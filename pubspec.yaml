name: wesios
description: WesiOS - Business Operating System for Wesi Inc.
publish_to: 'none'
version: 0.22.33+108
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  path: ^1.9.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  flutter_animate: ^4.3.0
  fl_chart: ^0.66.0
  table_calendar: ^3.0.9
  flutter_quill: 11.5.1
  audioplayers: ^5.2.1
  flutter_soloud: 3.1.12
  video_player: ^2.8.1
  camera: 0.10.6
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  speech_to_text: 7.4.0
  http: ^1.1.0
  dio: ^5.4.0
  pdf: ^3.10.7
  printing: ^5.11.1
  file_picker: 10.3.10
  share_plus: ^7.2.1
  cross_file: ^0.3.4+2
  device_info_plus: ^10.1.0
  url_launcher: ^6.2.2
  syncfusion_flutter_gauges: ^28.1.38
  intl: any
  flutter_localizations:
    sdk: flutter
  vibration: 3.1.3
  math_expressions: ^2.4.0
  flutter_timer_countdown: ^1.0.7
  flutter_drawing_board: ^1.0.1
  window_manager: ^0.3.7
  archive: ^3.6.1
  local_auth: ^2.2.0
  crypto: ^3.0.3
  cryptography: ^2.9.0
  pointycastle: ^4.0.0
  local_notifier: ^0.1.6
  dartssh2: 2.22.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
