name: wesios
description: WesiOS - Business Operating System for Wesi Inc.
publish_to: 'none'
version: 0.18.0+39

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (core only for now — auth/firestore break Windows desktop build)
  firebase_core: ^2.24.2

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local storage (Offline-First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI & Animations
  flutter_animate: ^4.3.0
  fl_chart: ^0.66.0
  table_calendar: ^3.0.9

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Utilities
  uuid: ^4.2.1
  pdf: ^3.10.7
  printing: ^5.11.1
  file_picker: ^6.1.1
  url_launcher: ^6.2.2
  path: ^1.8.3
  image: ^4.1.3
  share_plus: ^7.2.1
  local_auth: ^2.1.7
  vibration: ^1.8.4
  audioplayers: ^5.2.1
  video_player: ^2.8.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.2
  speech_to_text: ^6.6.0
  flutter_keyboard_visibility: ^6.0.0
  table_calendar: ^3.0.9
  flutter_animate: ^4.3.0
  flutter_quill: ^9.3.21
  flutter_quill_delta_from_html: ^1.2.3
  flutter_drawing_board: ^1.0.1
  math_expressions: ^2.5.0
  syncfusion_flutter_gauges: ^24.2.9
  dio: ^5.4.0
  crypto: ^3.0.3
  pointycastle: ^3.7.4
  window_manager: ^0.3.7
  screen_retriever: ^0.1.9
  win32: ^5.1.1
  flutter_secure_storage: ^9.0.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
