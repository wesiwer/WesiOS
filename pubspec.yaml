name: wesios
description: WesiOS - Business Operating System for Wesi Inc.
publish_to: 'none'
version: 0.22.30+105
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  path: ^1.9.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  flutter_animate: ^4.3.0
  fl_chart: ^0.66.0
  table_calendar: ^3.0.9
  flutter_quill: ^11.5.0
  audioplayers: ^6.5.1
  flutter_soloud: ^3.4.7
  video_player: ^2.10.1
  camera: ^0.11.3
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  speech_to_text: ^7.3.0
  http: ^1.5.0
  dio: ^5.9.0
  pdf: ^3.11.3
  printing: ^5.14.2
  file_picker: ^10.3.3
  share_plus: ^12.0.1
  cross_file: ^0.3.5+1
  device_info_plus: ^12.2.0
  url_launcher: ^6.3.2
  syncfusion_flutter_gauges: ^31.2.5
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  vibration: ^3.1.4
  math_expressions: ^3.1.0
  flutter_timer_countdown: ^1.0.7
  flutter_drawing_board: ^1.0.1
  window_manager: ^0.5.1
  archive: ^4.0.7
  local_auth: ^3.0.0
  crypto: ^3.0.7
  cryptography: ^2.9.0
  pointycastle: ^4.0.0
  local_notifier: ^0.1.6
  dartssh2: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.10.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/fonts/
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
