name: wesios
description: WesiOS - Business Operating System for Wesi Inc.
publish_to: 'none'
version: 0.16.0+35

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (core only for now — auth/firestore break Windows desktop build)
  firebase_core: ^2.24.2

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local storage (Offline-First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI & Animations
  flutter_animate: ^4.3.0
  fl_chart: ^0.66.0
  table_calendar: ^3.0.9
  flutter_quill: ^9.3.12

  # Audio & Video
  audioplayers: ^5.2.1
  video_player: ^2.8.1

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Voice input
  speech_to_text: ^6.5.1

  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0

  # PDF & Files
  pdf: ^3.10.7
  printing: ^5.11.1
  file_picker: ^6.1.1
  share_plus: ^7.2.1

  # System
  device_info_plus: ^10.1.0
  url_launcher: ^6.2.2

  # Charts & Visuals
  syncfusion_flutter_gauges: ^24.1.41

  # Intl & Localization
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter

  # Haptic
  vibration: ^1.8.4

  # Calculator
  math_expressions: ^2.4.0

  # Timer
  flutter_timer_countdown: ^1.0.7

  # Canvas / MindMap
  flutter_drawing_board: ^1.0.1

  # Window management (custom title bar)
  window_manager: ^0.3.7

  # Zip-распаковка загруженных движков прогноза (Prophet/SARIMAX)
  archive: ^3.6.1

  # Защита ключей Firebase: отпечаток/Face ID на телефоне
  local_auth: ^2.2.0

  # Хэш пароля доступа — сам пароль не хранится
  crypto: ^3.0.3
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/wesi_logo_easter.png
    - assets/audio/
    - assets/fonts/
    - assets/animations/

# Launcher icons configuration
flutter_launcher_icons:
  android: "launcher_icon"
  # iOS/macOS в проекте нет — платформенные папки не сгенерированы,
  # генератор на них падает.
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48
