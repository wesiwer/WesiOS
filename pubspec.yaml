name: wesios
description: WesiOS - Business Operating System for Wesi Inc.
publish_to: 'none'
version: 0.19.13+61

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  path: ^1.9.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  flutter_animate: ^4.3.0
  fl_chart: ^0.66.0
  table_calendar: ^3.0.9
  flutter_quill: ^9.3.12
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  window_manager: ^0.3.7
  intl: ^0.19.0
  math_expressions: ^2.5.0
  url_launcher: ^6.2.4
  file_picker: ^8.1.2
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  http: ^1.2.2
  crypto: ^3.0.3
  encrypt: ^5.0.3
  package_info_plus: ^8.1.0
  local_auth: ^2.2.0
  firebase_messaging: ^14.7.10
  flutter_secure_storage_windows: ^3.1.2
  flutter_secure_storage_macos: ^3.1.2
  flutter_secure_storage_linux: ^1.2.2
  device_info_plus: ^10.1.2
  firebase_core_platform_interface: ^5.0.0
  firebase_core_web: ^2.10.0
  firebase_messaging_platform_interface: ^4.5.18
  firebase_messaging_web: ^3.5.18
  firebase_auth: ^4.20.0
  firebase_auth_web: ^5.12.0
  firebase_auth_platform_interface: ^7.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icons/wesios_app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
