name: wesios
description: WesiOS - Business Operating System for Wesi Inc.
publish_to: 'none'
version: 0.22.12+87

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  cupertino_icons: ^1.0.6
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  http: ^1.2.0
  intl: ^0.19.0
  crypto: ^3.0.3
  pointycastle: ^3.7.4
  cryptography: ^2.7.0
  uuid: ^4.3.3
  path_provider: ^2.1.2
  path: ^1.9.0
  file_picker: ^6.1.1
  image_picker: ^1.0.7
  camera: ^0.10.6
  flutter_local_notifications: ^17.2.4
  local_notifier: ^0.1.6
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  archive: ^3.6.1
  package_info_plus: ^8.0.2
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  flutter_secure_storage: ^9.2.2
  mime: ^1.0.6
  open_filex: ^4.5.0
  share_plus: ^10.0.2
  window_manager: ^0.4.2
  desktop_drop: ^0.5.0
  flutter_markdown: ^0.7.3+2
  characters: ^1.3.0
  collection: ^1.18.0
  timezone: ^0.9.4
  pdf: ^3.11.1
  printing: ^5.13.1
  csv: ^6.0.0
  xml: ^6.5.0
  spreadsheet_decoder: ^2.3.0
  excel: ^4.0.6
  flutter_svg: ^2.0.10+1
  animations: ^2.0.11
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  flutter_colorpicker: ^1.1.0
  synchronized: ^3.3.0+3
  flutter_native_splash: ^2.4.1
  package_config: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0F0F11"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
