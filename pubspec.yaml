name: wesios
description: WesiOS - Business Operating System for Wesi Inc.
publish_to: 'none'
version: 0.22.13+88

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  path: ^1.9.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  google_fonts: ^6.1.0
  crypto: ^3.0.3
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.2.4
  http: ^1.2.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^18.0.1
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  record: ^6.1.2
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  permission_handler: ^11.4.0
  uuid: ^4.5.1
  archive: ^4.0.2
  pointycastle: ^3.9.1
  connectivity_plus: ^6.1.4
  path_provider_windows: ^2.3.0
  win32: ^5.10.0
  ffi: ^2.1.3
  desktop_drop: ^0.5.0
  cross_file: ^0.3.4+2
  flutter_markdown: ^0.7.5
  markdown: ^7.2.2
  flutter_svg: ^2.0.17
  fl_chart: ^0.69.2
  syncfusion_flutter_charts: ^27.2.5
  syncfusion_flutter_pdf: ^27.2.5
  printing: ^5.13.4
  pdf: ^3.11.1
  csv: ^6.0.0
  excel: ^4.0.6
  collection: ^1.18.0
  characters: ^1.3.0
  package_info_plus: ^8.1.2
  open_filex: ^4.6.0
  device_info_plus: ^11.3.0
  system_info2: ^4.0.0
  battery_plus: ^6.2.1
  wakelock_plus: ^1.2.10
  screen_brightness: ^2.1.2
  window_manager: ^0.4.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/models/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 256
