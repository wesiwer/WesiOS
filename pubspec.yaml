name: wesios
description: WesiOS - Business Operating System for Wesi Inc.
publish_to: 'none'
version: 0.19.4+52

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (core only for now — auth/firestore break Windows desktop build)
  firebase_core: ^2.24.2

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Charts
  fl_chart: ^0.66.0

  # Formatting
  intl: ^0.19.0

  # Networking
  http: ^1.2.0
  dio: ^5.4.0

  # UUID
  uuid: ^4.3.3

  # File handling
  path_provider: ^2.1.2
  file_picker: ^6.1.1

  # Sharing / links
  share_plus: ^7.2.1
  url_launcher: ^6.2.4

  # PDF
  pdf: ^3.10.7
  printing: ^5.12.0

  # Rich text
  flutter_quill: ^9.3.11
  flutter_quill_delta_from_html: ^1.2.4

  # Audio
  audioplayers: ^5.2.1
  speech_to_text: ^6.6.0

  # Video
  video_player: ^2.8.2

  # Windows desktop
  window_manager: ^0.3.8

  # Notifications
  flutter_local_notifications: ^17.2.2
  local_notifier: ^0.1.6

  # Security
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2

  # Device/session metadata
  device_info_plus: ^10.1.2

  # Haptics
  vibration: ^1.8.4

  # Animations
  flutter_animate: ^4.5.0

  # Calendar
  table_calendar: ^3.1.0

  # Math
  math_expressions: ^2.5.0

  # Gauges
  syncfusion_flutter_gauges: ^24.2.9

  # Timer
  flutter_timer_countdown: ^1.0.7

  # Color picker
  flutter_colorpicker: ^1.0.3

  # Drawing
  flutter_drawing_board: ^1.0.1+2

  # Keyboard
  flutter_keyboard_visibility: ^6.0.0

  # Markdown
  markdown: ^7.2.2

  # Icons
  flutter_launcher_icons: ^0.13.1

  # Crypto
  crypto: ^3.0.3
  pointycastle: ^4.0.0

  # Misc
  shared_preferences: ^2.2.2
  timezone: ^0.9.2
  win32: ^5.2.0
  win32_registry: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png
  min_sdk_android: 21
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
