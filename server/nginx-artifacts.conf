# Раздача сборок WesiOS.
#
# Вставить ВНУТРЬ существующего `server { ... }` для api.wesi-inc.ru —
# обычно это /etc/nginx/sites-available/api.wesi-inc.ru.
#
# Порядок в файле значения не имеет: точное совпадение (`location =`) и
# префикс (`location /artifacts/`) выигрывают у `location /` независимо от
# того, где написаны. А вот попасть ВНУТРЬ нужного `server {}` — обязательно:
# положенное рядом с ним просто не применится, и запрос за сборкой уйдёт в
# PocketBase. Тот честно ответит 404, а выглядеть это будет как «обновление
# не приходит».
#
# После правки:
#   sudo nginx -t && sudo systemctl reload nginx
#
# ------------------------------------------------------------------------
# Про открытость.
#
# Эти адреса открыты без пароля, и это осознанно: приложение должно уметь
# проверить обновление до того, как человек вошёл, — иначе сломанная версия
# не сможет обновиться до починенной, и вытаскивать её пришлось бы руками с
# каждого устройства.
#
# Что отсюда следует: по этим ссылкам лежит установочный файл приложения, и
# скачать его может любой, кто знает адрес. Данных компании там нет — только
# то, что и так стоит у каждого сотрудника на телефоне.
#
# Если этого всё равно не хочется, закрывать надо не выключенным листингом, а
# токеном: заголовок, который знает приложение, и проверка `if
# ($http_x_wesi_key != "...") { return 404; }` здесь же. Тогда токен придётся
# зашить в сборку — со всеми последствиями, которые у зашитых токенов бывают.

# Манифест: меняется на каждой выкладке. Старый в кэше означает «обновление
# вышло, а телефон о нём не знает ещё сутки».
location = /artifacts/app/app-manifest.json {
    alias /srv/wesi-artifacts/app/app-manifest.json;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate" always;
}

# Сами сборки. Лежат в каталоге с версией в имени и под одним адресом
# никогда не меняются, поэтому кэшировать их можно долго.
location /artifacts/ {
    alias /srv/wesi-artifacts/;

    # Каталог не показываем. Список файлов — это карта: по нему видно все
    # версии, которые когда-либо выкладывались, включая отозванные.
    # (autoindex и так выключен по умолчанию — пишем явно, чтобы никто не
    # включил его «на минуточку».)
    autoindex off;

    # Без этого Chrome и Safari пытаются открыть apk вместо скачивания.
    types {
        application/vnd.android.package-archive  apk;
        application/zip                          zip;
        application/json                         json;
    }
    default_type application/octet-stream;

    add_header Cache-Control "public, max-age=604800" always;

    sendfile on;
    tcp_nopush on;
}
