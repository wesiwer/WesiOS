# HTTPS facade for Wesi AI Relay.
# Emergency branch compatibility: the current Relay VPS nginx expects HTTP/2
# as a listen parameter instead of the newer standalone `http2 on` directive.
# Relay itself remains bound to localhost; nginx exposes only the explicitly
# allowlisted endpoints below.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name RELAY_HOST_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/RELAY_HOST_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/RELAY_HOST_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        access_log off;
    }

    location = /v1/wesi-ai {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        proxy_read_timeout 420s;
        proxy_send_timeout 240s;
        client_max_body_size 32m;
    }

    location = /v1/wesi-ai-artifact {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 32k;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_HOST_PLACEHOLDER;
    return 301 https://$host$request_uri;
}
