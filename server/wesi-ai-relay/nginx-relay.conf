# HTTPS-фасад для Wesi AI Relay.
#
# Relay слушает только localhost и не умеет TLS — намеренно: он держит ключ
# провайдера, и чем меньше он умеет, тем меньше у него способов ошибиться.
# Наружу его выставляет nginx.
#
# Сертификат: certbot --nginx -d <адрес-relay>
#
# Положить в /etc/nginx/sites-available/wesi-ai-relay и включить символьной
# ссылкой в sites-enabled.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name RELAY_HOST_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/RELAY_HOST_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/RELAY_HOST_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Отвечает Relay только на два адреса. Всё остальное закрыто здесь, а не
    # внутри: до приложения такой запрос доходить не должен вообще.
    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        access_log off;
    }

    location = /v1/wesi-ai {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Заголовки подписи обязаны дойти без изменений — по ним считается
        # HMAC, и любая правка превращает подлинный запрос в 401.
        proxy_pass_request_headers on;

        # Ответ модели может собираться долго; таймаут должен быть не меньше
        # того, что стоит на стороне основного сервера.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        client_max_body_size 2m;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_HOST_PLACEHOLDER;
    return 301 https://$host$request_uri;
}
