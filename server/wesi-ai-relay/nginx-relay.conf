# HTTPS facade for Wesi AI Relay.
# Relay itself remains bound to localhost; nginx exposes only the explicitly
# allowlisted endpoints below.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name RELAY_HOST_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/RELAY_HOST_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/RELAY_HOST_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /health {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        access_log off;
    }

    location = /v1/wesi-ai-stream {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 420s;
        proxy_send_timeout 120s;
        client_max_body_size 32m;
        add_header X-Accel-Buffering no always;
    }

    location = /api/wesi/ai/chat/stream {
        proxy_pass http://127.0.0.1:8792/api/wesi/ai/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-WesiOS-Session $http_x_wesios_session;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 420s;
        proxy_send_timeout 120s;
        client_max_body_size 32m;
        add_header X-Accel-Buffering no always;
    }

    location = /v1/wesi-ai {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        proxy_read_timeout 420s;
        proxy_send_timeout 240s;
        # Universal attachments are capped again inside Relay at 18 MiB raw
        # file bytes / 28 MiB signed JSON. This is only the HTTP envelope cap.
        client_max_body_size 32m;
    }

    # Heavy generated image/music/video bytes are fetched by Main Server only
    # through a second signed request. The Relay artifact is one-time and
    # short-lived, so this endpoint must never be made public or cached.
    location = /v1/wesi-ai-artifact {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 32k;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_HOST_PLACEHOLDER;
    return 301 https://$host$request_uri;
}
