name: wesi_aero
description: Wesi Aero private network client in the WesiOS design language.
publish_to: none
version: 0.2.4+6

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: 10.3.10
  flutter_secure_storage: ^9.0.0
  cryptography: ^2.7.0
  mobile_scanner: ^7.4.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
