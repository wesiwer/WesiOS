services:
  control-plane:
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ./data:/data
      - ./profiles:/profiles:ro
    environment:
      WESI_AERO_ADMIN_TOKEN: ${WESI_AERO_ADMIN_TOKEN:?required}
      WESI_AERO_MASTER_KEY: ${WESI_AERO_MASTER_KEY:?required}
      WESI_AERO_PUBLIC_BASE_URL: ${WESI_AERO_PUBLIC_BASE_URL:?required}
      WESI_AERO_PAYMENT_RETURN_URL: ${WESI_AERO_PAYMENT_RETURN_URL:?required}
      WESI_AERO_ALLOW_MOCK_PAYMENTS: ${WESI_AERO_ALLOW_MOCK_PAYMENTS:-false}
      WESI_AERO_YOOKASSA_SHOP_ID: ${WESI_AERO_YOOKASSA_SHOP_ID:-}
      WESI_AERO_YOOKASSA_SECRET_KEY: ${WESI_AERO_YOOKASSA_SECRET_KEY:-}
      WESI_AERO_CRYPTO_PAY_TOKEN: ${WESI_AERO_CRYPTO_PAY_TOKEN:-}
      WESI_AERO_CRYPTO_PAY_TESTNET: ${WESI_AERO_CRYPTO_PAY_TESTNET:-true}
      WESI_AERO_TECHNICAL_LOGS: "true"

  xray:
    image: ghcr.io/xtls/xray-core:26.4.17
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8443:8443/tcp"
    volumes:
      - ./config/xray.json:/etc/xray/config.json:ro
    command: ["run", "-config", "/etc/xray/config.json"]
