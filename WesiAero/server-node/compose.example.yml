services:
  control-plane:
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8790:8790"
    volumes:
      - ./data:/data
      - ./profiles:/profiles:ro
    environment:
      WESI_AERO_ADMIN_TOKEN: ${WESI_AERO_ADMIN_TOKEN:?required}
      WESI_AERO_TECHNICAL_LOGS: "true"

  xray:
    image: ghcr.io/xtls/xray-core:26.4.17
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "8443:8443/tcp"
    volumes:
      - ./config/xray.json:/etc/xray/config.json:ro
    command: ["run", "-config", "/etc/xray/config.json"]
