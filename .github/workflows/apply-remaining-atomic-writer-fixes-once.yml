name: Apply Remaining Atomic Writer Fixes Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-remaining-atomic-writer-fixes-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move every remote-worker sync-row mutation to atomic boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/pb_hooks/wesi_ai_remote_worker.pb.js')
          s = p.read_text()

          s = s.replace(
            'const rw = require(`${__hooks}/wesi_ai_remote_worker_lib.js`);\n',
            'const rw = require(`${__hooks}/wesi_ai_remote_worker_lib.js`);\nconst atomic = require(`${__hooks}/wesi_sync_atomic.js`);\n',
            1,
          )

          old = '''function upsert(app, ownerId, org, coll, rid, payload) {
  let record = findRecord(app, ownerId, coll, rid);
  if (!record) {
    const collection = app.findCollectionByNameOrId("wesios_records");
    record = new Record(collection);
    record.set("owner", ownerId);
    record.set("org", org || OWNER_ORG);
    record.set("coll", coll);
    record.set("rid", rid);
  }
  record.set("payload", payload);
  record.set("stamp", new Date().toISOString());
  record.set("deleted", false);
  app.save(record);
  return record;
}
'''
          new = '''function persistRecord(app, record, payload, deleted) {
  const stamp = new Date().toISOString();
  atomic.commit(app, {
    owner: record.getString("owner"),
    org: record.getString("org"),
    coll: record.getString("coll"),
    rid: record.getString("rid"),
    payload: payload,
    stamp: stamp,
    deleted: deleted === true,
  });
  return findRecord(app, record.getString("owner"), record.getString("coll"), record.getString("rid"));
}

function upsert(app, ownerId, org, coll, rid, payload) {
  const stamp = new Date().toISOString();
  atomic.commit(app, {
    owner: ownerId,
    org: org || OWNER_ORG,
    coll: coll,
    rid: rid,
    payload: payload,
    stamp: stamp,
    deleted: false,
  });
  return findRecord(app, ownerId, coll, rid);
}
'''
          if old not in s: raise SystemExit('remote worker upsert snippet not found')
          s = s.replace(old, new, 1)

          replacements = [
            ('''  credential.set("payload", credentialPayload);\n  credential.set("stamp", new Date(nowMs).toISOString());\n  e.app.save(credential);\n''', '''  persistRecord(e.app, credential, credentialPayload, false);\n'''),
            ('''      removable[i].set("deleted", true);\n      removable[i].set("stamp", new Date().toISOString());\n      app.save(removable[i]);\n''', '''      persistRecord(app, removable[i], payloadOf(removable[i]), true);\n'''),
            ('''  record.set("payload", payload);\n  record.set("stamp", new Date().toISOString());\n  app.save(record);\n  return true;\n''', '''  persistRecord(app, record, payload, false);\n  return true;\n'''),
            ('''  record.set("payload", stored);\n  record.set("stamp", new Date().toISOString());\n  e.app.save(record);\n  return e.json(200, {ok: true, credentialId: credentialId, workerId: ticket.workerId});\n''', '''  persistRecord(e.app, record, stored, false);\n  return e.json(200, {ok: true, credentialId: credentialId, workerId: ticket.workerId});\n'''),
            ('''  record.set("payload", stored);\n  record.set("stamp", new Date().toISOString());\n  e.app.save(record);\n  return e.json(200, {ok: true, ready: true, credential: publicCredential});\n''', '''  persistRecord(e.app, record, stored, false);\n  return e.json(200, {ok: true, ready: true, credential: publicCredential});\n'''),
            ('''    row.set("payload", payload);\n    row.set("stamp", revokedAt);\n    e.app.save(row);\n''', '''    persistRecord(e.app, row, payload, false);\n'''),
          ]
          for old_snip, new_snip in replacements:
            if old_snip not in s:
              raise SystemExit('remote worker direct-save snippet not found: ' + old_snip.splitlines()[0])
            s = s.replace(old_snip, new_snip, 1)

          p.write_text(s)
          PY

          git config user.name 'WesiOS Atomic Fixes'
          git config user.email 'actions@users.noreply.github.com'
          git add server/pb_hooks/wesi_ai_remote_worker.pb.js
          git commit -m 'fix(sync): atomically persist every remote-worker sync row'
          git push origin HEAD:main
