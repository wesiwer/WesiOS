name: Apply portal requirements menu

on:
  push:
    branches: [main]
    paths:
      - tools/patch_portal_requirements_menu.py
      - .github/workflows/apply-portal-requirements-menu.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-portal-requirements-menu
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply targeted patch
        run: python3 tools/patch_portal_requirements_menu.py

      - name: Validate PocketBase hook
        run: node --check server/pb_hooks/employee_portal_static.pb.js

      - name: Verify expected menu behavior is present
        run: |
          set -euo pipefail
          grep -q "Системные требования" server/pb_hooks/employee_portal_static.pb.js
          grep -q "requirements-popover" server/pb_hooks/employee_portal_static.pb.js
          grep -q "aria-expanded" server/pb_hooks/employee_portal_static.pb.js
          grep -q "setRequirementsOpen" server/pb_hooks/employee_portal_static.pb.js
          git diff --check

      - name: Commit portal change
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/pb_hooks/employee_portal_static.pb.js
          git commit -m "feat(portal): move system requirements into hero menu"
          git push
