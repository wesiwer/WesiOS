name: Temporary Run Wesi AI Diagnostics
on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'ci: run Wesi AI diagnostic patch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage12-final-20260816
          fetch-depth: 0
      - name: Apply embedded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-wesi-ai-diagnostics-contract.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          raw = text[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          code = '\n'.join(lines)
          exec(compile(code, 'diagnostic-contract-patch', 'exec'), {})
          PY
      - name: Server validation
        run: |
          node --check server/wesi-ai-stream/gateway.mjs
          node --check server/pb_hooks/wesi_ai_routes.pb.js
          cd server/wesi-ai-stream
          npm test
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - run: dart format lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart test/wesi_ai_diagnostics_contract_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/wesi_ai_diagnostics_contract_test.dart test/wesi_ai_rich_message_test.dart test/wesi_ai_coagent_activity_test.dart
      - name: Commit verified product code
        run: |
          git config user.name wesi-ai-ci
          git config user.email wesi-ai-ci@users.noreply.github.com
          git add lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart server/pb_hooks/wesi_ai_routes.pb.js server/wesi-ai-stream/gateway.mjs test/wesi_ai_diagnostics_contract_test.dart
          git commit -m 'feat(ai): add end-to-end diagnostic error contract'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
