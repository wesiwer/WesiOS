name: Stage 14 Persist Verified Non-Workflow Fixes

on:
  push:
    branches:
      - agent/wesi-ai-stage14-full-system-audit-20260817
    paths:
      - .github/workflows/stage14-persist-nonworkflow.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/wesi-ai-stage14-full-system-audit-20260817

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Apply the already verified audit patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/stage14-full-system-audit-autofix.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = "      - name: Apply audited Stage 14 fixes\n        shell: bash\n        run: |\n"
          end_marker = "\n      - name: Verify server and deployment contracts"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('audit apply step start marker not found')
          start += len(start_marker)
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('audit apply step end marker not found')
          source = text[start:end]
          out = []
          for line in source.splitlines():
              if line:
                  if not line.startswith('          '):
                      raise SystemExit(f'unexpected apply-step indentation: {line!r}')
                  line = line[10:]
              out.append(line)
          Path('/tmp/stage14_apply.sh').write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY
          bash /tmp/stage14_apply.sh

      - name: Commit only verified non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/ai/wesi_ai_api.dart \
            lib/features/ai/wesi_ai_lobby_api.dart \
            .github/wesi-ai-router-deploy.trigger \
            test/features/ai/wesi_ai_response_contract_test.dart
          git diff --cached --check
          git diff --cached --quiet && { echo 'No non-workflow changes to persist'; exit 0; }
          git commit -m 'fix(ai): harden Stage 14 response transport contract'
          git push origin HEAD:agent/wesi-ai-stage14-full-system-audit-20260817
