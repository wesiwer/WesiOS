name: Diagnose WesiOS auth once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesios-auth-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Probe owner challenge persistence safely
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          TOKEN=$(openssl rand -hex 24)
          REMOTE="/tmp/wesi-auth-persist-probe-$GITHUB_RUN_ID"
          PATCHED="$RUNNER_TEMP/wesi_auth_persist_probe.pb.js"
          cp server/pb_hooks/wesi_auth_bootstrap.pb.js "$PATCHED"
          cat >> "$PATCHED" <<'JS'

          routerAdd("POST", "/api/wesi/internal/auth-persist-probe-__WESI_PROBE_TOKEN__", (e) => {
            let probe = null;
            try {
              const marker = e.app.findFirstRecordByFilter(
                "wesios_records",
                "coll='system' && rid='portal-owner' && deleted=false",
              );
              const userId = marker.getString("owner");
              const user = e.app.findRecordById("users", userId);
              const challengeId = $security.randomStringWithAlphabet(
                40,
                "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
              );
              const collection = e.app.findCollectionByNameOrId("wesios_records");
              probe = new Record(collection);
              const createdAt = new Date().toISOString();
              probe.set("owner", "__wesios_security__");
              probe.set("org", "wesi-inc");
              probe.set("coll", "security");
              probe.set("rid", "probe-otp:" + challengeId);
              probe.set("payload", {
                "kind": "otp",
                "challengeId": challengeId,
                "userId": user.id,
                "employeeId": "owner",
                "login": "redacted",
                "email": "",
                "purpose": "app",
                "ownerEmailSetup": false,
                "createdAt": createdAt,
                "expiresAt": new Date(Date.now() + 10 * 60 * 1000).toISOString(),
              });
              probe.set("stamp", createdAt);
              probe.set("deleted", false);
              e.app.save(probe);
              e.app.delete(probe);
              return e.json(200, {"ok": true, "stage": "challenge_save_ok"});
            } catch (error) {
              try { if (probe && probe.id) e.app.delete(probe); } catch (_) {}
              const raw = String((error && error.message) || error || "unknown");
              const safe = raw
                .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}/g, "<redacted-email>")
                .replace(/[A-Za-z0-9+\\/_-]{32,}/g, "<redacted-value>")
                .substring(0, 500);
              return e.json(422, {
                "ok": false,
                "stage": "challenge_save_failed",
                "errorType": String((error && error.name) || "Error").substring(0, 80),
                "reason": safe,
              });
            }
          });
          JS
          sed -i "s/__WESI_PROBE_TOKEN__/$TOKEN/g" "$PATCHED"
          node --check "$PATCHED"

          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes             "$PATCHED" server/pb_hooks/wesi_auth_bootstrap.pb.js             "$USER@$HOST:$REMOTE/"

          $SSH "$USER@$HOST" "TOKEN='$TOKEN' REMOTE='$REMOTE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          HOOK=/opt/pocketbase/pb_hooks/wesi_auth_bootstrap.pb.js
          ORIGINAL="$REMOTE/wesi_auth_bootstrap.pb.js"
          PATCHED="$REMOTE/wesi_auth_persist_probe.pb.js"
          test -s "$ORIGINAL" && test -s "$PATCHED"
          restore() {
            cat "$ORIGINAL" > "$HOOK" || true
            chmod 0644 "$HOOK" || true
            rm -rf "$REMOTE" || true
          }
          trap restore EXIT
          cat "$PATCHED" > "$HOOK"
          chmod 0644 "$HOOK"

          CODE=''
          for attempt in $(seq 1 20); do
            CODE=$(curl -sS -o "$REMOTE/result.json" -w '%{http_code}'               --max-time 20 -X POST               "http://127.0.0.1:8090/api/wesi/internal/auth-persist-probe-$TOKEN" || true)
            [ "$CODE" != 404 ] && [ -n "$CODE" ] && break
            sleep 1
          done
          echo "probe_http=$CODE"
          cat "$REMOTE/result.json" 2>/dev/null || true
          echo
          cat "$ORIGINAL" > "$HOOK"
          chmod 0644 "$HOOK"
          sleep 2
          cmp -s "$ORIGINAL" "$HOOK"
          echo 'temporary_probe_removed=true'
          REMOTE_SCRIPT
