name: Diagnose WesiOS auth once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesios-auth-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Read sanitized start-v2 errors through PocketBase
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          TOKEN=$(openssl rand -hex 24)
          REMOTE="/tmp/wesi-auth-log-probe-$GITHUB_RUN_ID"
          PATCHED="$RUNNER_TEMP/wesi_auth_log_probe.pb.js"
          cp server/pb_hooks/wesi_auth_bootstrap.pb.js "$PATCHED"
          cat >> "$PATCHED" <<'JS'

          routerAdd("POST", "/api/wesi/internal/auth-log-probe-__WESI_PROBE_TOKEN__", (e) => {
            const clean = (value) => String(value == null ? "" : value)
              .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, "<redacted-email>")
              .replace(/(?:\d{1,3}\.){3}\d{1,3}/g, "<redacted-ip>")
              .replace(/[A-Za-z0-9+\/_-]{32,}/g, "<redacted-value>")
              .substring(0, 700);
            const allowed = {
              "status": true, "message": true, "error": true, "details": true,
              "method": true, "url": true, "type": true, "reason": true,
            };
            const permitted = (input) => {
              if (!input || typeof input !== "object" || Array.isArray(input)) return {};
              const out = {};
              for (const key of Object.keys(input)) {
                if (!allowed[String(key).toLowerCase()]) continue;
                const value = input[key];
                if (value && typeof value === "object" && !Array.isArray(value)) {
                  out[key] = permitted(value);
                } else if (["string", "number", "boolean"].includes(typeof value) || value == null) {
                  out[key] = clean(value);
                }
              }
              return out;
            };

            const rows = arrayOf(new DynamicModel({
              "created": "", "message": "", "data": {},
            }));
            e.app.logQuery()
              .select("created", "message", "data")
              .orderBy("created DESC")
              .limit(1000)
              .all(rows);

            const found = [];
            for (const row of rows) {
              const safeData = permitted(row.data || {});
              const safeMessage = clean(row.message || "");
              const encoded = JSON.stringify(safeData);
              if (
                encoded.indexOf("/api/wesi/auth/start-v2") < 0 &&
                safeMessage.indexOf("/api/wesi/auth/start-v2") < 0
              ) continue;
              found.push({
                "created": clean(row.created),
                "message": safeMessage,
                "data": safeData,
              });
              if (found.length >= 12) break;
            }
            return e.json(200, {"matchingEntries": found});
          });
          JS
          sed -i "s/__WESI_PROBE_TOKEN__/$TOKEN/g" "$PATCHED"
          node --check "$PATCHED"

          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes             "$PATCHED" server/pb_hooks/wesi_auth_bootstrap.pb.js             "$USER@$HOST:$REMOTE/"

          $SSH "$USER@$HOST" "TOKEN='$TOKEN' REMOTE='$REMOTE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          HOOK=/opt/pocketbase/pb_hooks/wesi_auth_bootstrap.pb.js
          ORIGINAL="$REMOTE/wesi_auth_bootstrap.pb.js"
          PATCHED="$REMOTE/wesi_auth_log_probe.pb.js"
          test -s "$ORIGINAL" && test -s "$PATCHED"
          restore() {
            cat "$ORIGINAL" > "$HOOK" || true
            chmod 0644 "$HOOK" || true
            rm -rf "$REMOTE" || true
          }
          trap restore EXIT
          cat "$PATCHED" > "$HOOK"
          chmod 0644 "$HOOK"

          CODE=''
          for attempt in $(seq 1 20); do
            CODE=$(curl -sS -o "$REMOTE/result.json" -w '%{http_code}'               --max-time 20 -X POST               "http://127.0.0.1:8090/api/wesi/internal/auth-log-probe-$TOKEN" || true)
            [ "$CODE" != 404 ] && [ -n "$CODE" ] && break
            sleep 1
          done
          echo "probe_http=$CODE"
          cat "$REMOTE/result.json" 2>/dev/null || true
          echo
          cat "$ORIGINAL" > "$HOOK"
          chmod 0644 "$HOOK"
          sleep 2
          cmp -s "$ORIGINAL" "$HOOK"
          echo 'temporary_probe_removed=true'
          REMOTE_SCRIPT
