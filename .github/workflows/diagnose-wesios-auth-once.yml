name: Diagnose WesiOS auth once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesios-auth-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Verify real start-v2 route-local mail helpers
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          TOKEN=$(openssl rand -hex 24)
          REMOTE="/tmp/wesi-route-mail-probe-$GITHUB_RUN_ID"
          PATCHED="$RUNNER_TEMP/wesi_route_mail_probe.pb.js"
          cp server/pb_hooks/wesi_auth_bootstrap.pb.js "$PATCHED"
          python3 - "$PATCHED" "$TOKEN" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          token = sys.argv[2]
          source = path.read_text()
          needle = '  const body = e.requestInfo().body || {};\n'
          probe = '''  if (e.request.url.query().get("wesiProbe") === "__TOKEN__") {
            const mail = wesiBuildOtpMail("123456", "app");
            const html = String(mail && mail.html || "");
            const text = String(mail && mail.text || "");
            return e.json(200, {
              "ok": true,
              "localBuilder": typeof wesiBuildOtpMail === "function",
              "localDelivery": typeof wesiDeliverMail === "function",
              "template": html.indexOf("2026-08-09.mail-design-v1") >= 0,
              "logo": html.indexOf("https://api.wesi-inc.ru/portal/app_icon.png") >= 0,
              "codeCount": (html.match(/123456/g) || []).length,
              "textFallback": text.indexOf("123456") >= 0,
            });
          }

          '''.replace("__TOKEN__", token)
          route = source.find('routerAdd("POST", "/api/wesi/auth/start-v2", (e) => {')
          position = source.find(needle, route)
          if route < 0 or position < 0:
              raise SystemExit("unexpected start-v2 source shape")
          path.write_text(source[:position] + probe + source[position:])
          PY
          node --check "$PATCHED"

          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes             "$PATCHED" server/pb_hooks/wesi_auth_bootstrap.pb.js             "$USER@$HOST:$REMOTE/"

          $SSH "$USER@$HOST" "TOKEN='$TOKEN' REMOTE='$REMOTE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          HOOK=/opt/pocketbase/pb_hooks/wesi_auth_bootstrap.pb.js
          ORIGINAL="$REMOTE/wesi_auth_bootstrap.pb.js"
          PATCHED="$REMOTE/wesi_route_mail_probe.pb.js"
          test -s "$ORIGINAL" && test -s "$PATCHED"
          restore() {
            cat "$ORIGINAL" > "$HOOK" || true
            chmod 0644 "$HOOK" || true
            rm -rf "$REMOTE" || true
          }
          trap restore EXIT
          cat "$PATCHED" > "$HOOK"
          chmod 0644 "$HOOK"

          CODE=''
          for attempt in $(seq 1 20); do
            CODE=$(curl -sS -o "$REMOTE/result.json" -w '%{http_code}'               --max-time 20 -X POST               "http://127.0.0.1:8090/api/wesi/auth/start-v2?wesiProbe=$TOKEN" || true)
            [ "$CODE" != 404 ] && [ -n "$CODE" ] && break
            sleep 1
          done
          cat "$REMOTE/result.json"
          echo
          test "$CODE" = 200
          grep -q '"ok":true' "$REMOTE/result.json"
          grep -q '"localBuilder":true' "$REMOTE/result.json"
          grep -q '"localDelivery":true' "$REMOTE/result.json"
          grep -q '"template":true' "$REMOTE/result.json"
          grep -q '"logo":true' "$REMOTE/result.json"
          grep -q '"codeCount":1' "$REMOTE/result.json"
          grep -q '"textFallback":true' "$REMOTE/result.json"

          cat "$ORIGINAL" > "$HOOK"
          chmod 0644 "$HOOK"
          sleep 2
          cmp -s "$ORIGINAL" "$HOOK"
          echo 'temporary_probe_removed=true'
          REMOTE_SCRIPT
