name: Diagnose WesiOS auth once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesios-auth-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: employee-portal
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Read only sanitized start-v2 request errors
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" 'python3 -' <<'PY'
          import json
          import re
          import sqlite3

          path = "file:/opt/pocketbase/pb_data/logs.db?mode=ro"
          con = sqlite3.connect(path, uri=True)
          con.row_factory = sqlite3.Row
          tables = [
              row["name"] for row in con.execute(
                  "select name from sqlite_master where type='table' order by name"
              )
          ]
          candidates = []
          for table in tables:
              safe_table = table.replace('"', '""')
              columns = {
                  row["name"] for row in con.execute(
                      f'pragma table_info("{safe_table}")'
                  )
              }
              if {"message", "data", "created"}.issubset(columns):
                  candidates.append(table)

          allowed = {"status", "message", "error", "details", "method", "url", "type", "reason"}
          email_re = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          token_re = re.compile(r"[A-Za-z0-9+/_-]{32,}")
          ip_re = re.compile(r"(?:\d{1,3}\.){3}\d{1,3}")

          def clean(value):
              text = str(value)
              text = email_re.sub("<redacted-email>", text)
              text = ip_re.sub("<redacted-ip>", text)
              text = token_re.sub("<redacted-value>", text)
              return text[:700]

          def permitted(obj):
              if not isinstance(obj, dict):
                  return {}
              result = {}
              for key, value in obj.items():
                  if str(key).lower() not in allowed:
                      continue
                  if isinstance(value, dict):
                      result[str(key)] = permitted(value)
                  elif isinstance(value, (str, int, float, bool)) or value is None:
                      result[str(key)] = clean(value)
              return result

          found = []
          for table in candidates:
              safe_table = table.replace('"', '""')
              rows = con.execute(
                  f'select created, message, data from "{safe_table}" order by created desc limit 1000'
              ).fetchall()
              for row in rows:
                  try:
                      data = json.loads(row["data"] or "{}")
                  except Exception:
                      data = {}
                  serialized = json.dumps(permitted(data), ensure_ascii=False)
                  message = clean(row["message"] or "")
                  if "/api/wesi/auth/start-v2" not in serialized and "/api/wesi/auth/start-v2" not in message:
                      continue
                  found.append({
                      "created": clean(row["created"]),
                      "message": message,
                      "data": permitted(data),
                  })
                  if len(found) >= 12:
                      break
              if len(found) >= 12:
                  break

          print(json.dumps({
              "log_tables_found": len(candidates),
              "matching_entries": found,
          }, ensure_ascii=False))
          con.close()
          PY
