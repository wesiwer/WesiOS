name: Diagnose WesiOS auth once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesios-auth-once.yml'

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: employee-portal
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Classify redacted PocketBase auth error
        id: diagnose
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          SUMMARY=$($SSH "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          JOURNAL=$(mktemp)
          trap 'rm -f "$JOURNAL"' EXIT
          if journalctl -u pocketbase --since '12 hours ago' --no-pager >"$JOURNAL" 2>/dev/null; then
            :
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n journalctl -u pocketbase --since '12 hours ago' --no-pager >"$JOURNAL"
          else
            echo 'journal_access_denied'
            exit 0
          fi
          MATCHES=$(grep -E 'WesiOS PocketBase mail client failed|WesiOS security email delivery failed|No working WesiOS mail transport|/api/wesi/auth/start-v2|ReferenceError|TypeError|SyntaxError|panic' "$JOURNAL" || true)
          if grep -q 'No working WesiOS mail transport configured' <<<"$MATCHES"; then
            echo 'sendmail_failed_and_https_fallback_unconfigured'
          elif grep -q 'WesiOS PocketBase mail client failed' <<<"$MATCHES"; then
            echo 'pocketbase_mail_client_failed'
          elif grep -q 'WesiOS security email delivery failed' <<<"$MATCHES"; then
            echo 'legacy_security_mail_client_failed'
          elif grep -Eq 'ReferenceError|TypeError|SyntaxError|panic' <<<"$MATCHES"; then
            echo 'pocketbase_hook_runtime_error'
          elif grep -q '/api/wesi/auth/start-v2' <<<"$MATCHES"; then
            echo 'start_v2_non_2xx_without_hook_exception'
          else
            echo 'no_matching_auth_error_in_last_12h'
          fi
          REMOTE
          )
          SUMMARY=$(printf '%s' "$SUMMARY" | tr -cd 'a-zA-Z0-9_- ' | cut -c1-120)
          test -n "$SUMMARY"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Publish redacted diagnostic status
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.diagnose.outputs.summary }}
        shell: bash
        run: |
          set -euo pipefail
          BODY=$(jq -n             --arg state success             --arg context diagnostic/auth             --arg description "$SUMMARY"             '{state:$state,context:$context,description:$description}')
          curl -fsS             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"             -d "$BODY" >/dev/null
