name: Apply Wesi AI Stage 1 smart queue v2

on:
  push:
    branches:
      - agent/wesi-ai-stage1-final

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[stage1-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main --depth=1

      - name: Apply stage 1 patch
        run: |
          python tool/wesi_ai_stage1_apply.py
          python tool/wesi_ai_stage1_record_fix.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Format
        run: dart format lib/features/ai test/wesi_ai_turn_intent_test.dart test/wesi_ai_queue_hardening_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test smart queue
        run: flutter test test/wesi_ai_turn_intent_test.dart test/wesi_ai_queue_hardening_test.dart

      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage1-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/WESI_AI_CHAT_INTERACTION_SPEC.md docs/WESI_AI_ADAPTIVE_EXECUTION_SPEC.md \
            lib/features/ai/storage/wesi_ai_local_store.dart \
            lib/features/ai/controllers/wesi_ai_chat_controller.dart \
            lib/features/ai/wesi_ai_lobby_controller.dart \
            lib/features/ai/wesi_ai_managed_controller.dart \
            lib/features/ai/ai_assistant_v2_screen.dart \
            test/wesi_ai_queue_hardening_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(ai): implement smart preemptive queue [stage1-applied]'
          git push origin HEAD:agent/wesi-ai-stage1-final
