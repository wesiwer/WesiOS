name: Run Wesi AI UX patch helper
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-run-wesi-ai-ux-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: python3 tools/temp_patch_wesi_ai_mobile_ux.py
      - run: dart format lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/widgets/wesi_ai_rich_message.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/widgets/wesi_ai_rich_message.dart
          git diff --cached --check
          git commit -m "fix(ai): polish sidebar camera launch and math rendering"
          git push origin HEAD:fix/wesi-ai-tool-agent-handoff
