name: Repair AI Tool Silent Reads Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ai-tool-silent-reads-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 .github/scripts/repair-ai-tool-silent-reads.py
          sed -i 's/[[:space:]]*$//' server/pb_hooks/wesi_ai_*.js server/pb_hooks/wesi_ai_*_test.mjs
      - name: Check JavaScript
        run: |
          node --check server/pb_hooks/wesi_ai_data_access.js
          node --check server/pb_hooks/wesi_ai_action_broker.js
          node --check server/pb_hooks/wesi_ai_audio_tools.js
          node --check server/pb_hooks/wesi_ai_crm_write_tools.js
          node --check server/pb_hooks/wesi_ai_finance_policy.js
          node --check server/pb_hooks/wesi_ai_finance_write_tools.js
          node --check server/pb_hooks/wesi_ai_knowledge_tools.js
          node --check server/pb_hooks/wesi_ai_roadmap_tools.js
          node --check server/pb_hooks/wesi_ai_task_tools.js
          node --check server/pb_hooks/wesi_ai_task_write_tools.js
          node --check server/pb_hooks/wesi_ai_team_tools.js
          node --check server/pb_hooks/wesi_ai_workspace_tools.js
      - name: Run contracts
        run: |
          node --test server/pb_hooks/wesi_ai_tool_data_access_contract_test.mjs
          node --test server/pb_hooks/wesi_ai_finance_tools_test.mjs server/pb_hooks/wesi_ai_horizon_truth_test.mjs
          node --test server/pb_hooks/wesi_ai_history_contract_test.mjs server/pb_hooks/wesi_ai_lib_history_test.mjs server/pb_hooks/wesi_ai_stream_contract_test.mjs
          git diff --check
      - name: Commit validated repair
        run: |
          git config user.name 'WesiOS AI Contract Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add server/pb_hooks
          git diff --cached --check
          git commit -m 'fix(ai): fail closed on internal tool data reads'
          git push origin HEAD:main
