name: Diagnose existing mail secrets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mail-secrets.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      WESI_SMTP_HOST: ${{ secrets.WESI_SMTP_HOST }}
      WESI_SMTP_PORT: ${{ secrets.WESI_SMTP_PORT }}
      WESI_SMTP_USERNAME: ${{ secrets.WESI_SMTP_USERNAME }}
      WESI_SMTP_PASSWORD: ${{ secrets.WESI_SMTP_PASSWORD }}
      WESI_SMTP_FROM: ${{ secrets.WESI_SMTP_FROM }}
      WESI_MAIL_API_TOKEN: ${{ secrets.WESI_MAIL_API_TOKEN }}
      WESI_RESEND_API_KEY: ${{ secrets.WESI_RESEND_API_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
      MAILGUN_API_KEY: ${{ secrets.MAILGUN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record presence only
        run: |
          python3 - <<'PY'
          import json, os
          names=[
            'WESI_SMTP_HOST','WESI_SMTP_PORT','WESI_SMTP_USERNAME','WESI_SMTP_PASSWORD','WESI_SMTP_FROM',
            'WESI_MAIL_API_TOKEN','WESI_RESEND_API_KEY','RESEND_API_KEY','SENDGRID_API_KEY','BREVO_API_KEY',
            'POSTMARK_SERVER_TOKEN','MAILGUN_API_KEY'
          ]
          out={name: bool(os.environ.get(name,'')) for name in names}
          open('.mail-secret-presence.json','w',encoding='utf-8').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out))
          PY
      - name: Publish sanitized presence map
        run: |
          git config user.name 'WesiOS Mail Diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git add .mail-secret-presence.json
          git commit -m 'chore: record mail secret availability'
          git push origin HEAD:main
