name: Wesi AI Stage 10 Rebase One Shot

on:
  push:
    branches:
      - agent/wesi-ai-stage10-remote-worker-rebased

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage10-rebase-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage10-remote-worker-rebased
          fetch-depth: 0

      - name: Fetch validated old Stage 10 source
        run: git fetch origin a05d67f553121e73b5e794425bbf4606dc287280 --depth=1

      - name: Port product tree and apply final hardening
        run: |
          set -euo pipefail
          python3 scripts/stage10_rebase_once.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/wesi_remote_worker_protocol_test.dart')
          text = path.read_text(encoding='utf-8')
          old = "secret: 'super-secret-worker-key',"
          new = "secret: 'super-secret-worker-key-32-bytes-minimum',"
          if old not in text and new not in text:
              raise SystemExit('HMAC fixture anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate server protocol
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_ai_remote_worker_lib.js
          node --check server/pb_hooks/wesi_ai_remote_worker.pb.js
          node --test server/wesi-ai-stream/remote_worker_protocol.test.mjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format Stage 10 files
        run: dart format lib/features/ai/runtime/wesi_remote_worker_*.dart test/wesi_remote_worker_*.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Focused Stage 8-10 regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(test/wesi_remote_worker_*.dart)
          for base in test/wesi_resource_scheduler_test.dart test/wesi_job_queue_test.dart; do
            if [ -f "$base" ]; then tests+=("$base"); fi
          done
          flutter test "${tests[@]}"

      - name: Full regression suite
        run: flutter test

      - name: Commit validated Stage 10 product tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/ai/runtime/wesi_remote_worker_*.dart \
            server/pb_hooks/wesi_ai_remote_worker.pb.js \
            server/pb_hooks/wesi_ai_remote_worker_lib.js \
            server/wesi-ai-stream/remote_worker_protocol.test.mjs \
            test/wesi_remote_worker_*.dart
          git diff --cached --quiet && { echo '::error::No Stage 10 product diff generated'; exit 1; }
          git commit -m 'feat(ai): rebase and harden Stage 10 remote worker'
          git push origin HEAD:agent/wesi-ai-stage10-remote-worker-rebased
