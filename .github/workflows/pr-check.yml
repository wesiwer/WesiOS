name: Pull request check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-horizon-compile-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/horizon-top-tier'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/horizon-top-tier
          fetch-depth: 0
      - name: Apply Horizon compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tooling/horizon_compile_fix.py
          rm tooling/horizon_compile_fix.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-check.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/treasury/services/forecast_engine.dart \
                  lib/features/treasury/services/horizon_engine_competition.dart \
                  lib/features/treasury/services/horizon_business_context.dart \
                  .github/workflows/pr-check.yml
          git add -u tooling/horizon_compile_fix.py
          git commit -m 'fix(horizon): compile types imports and lease FX conversion'
          git push origin HEAD:agent/horizon-top-tier

  analyze-and-test:
    if: github.head_ref != 'agent/horizon-top-tier'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test