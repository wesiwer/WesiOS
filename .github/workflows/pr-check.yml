name: Pull request check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-decision-ui:
    if: github.head_ref == 'agent/horizon-top-tier'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/horizon-top-tier
          fetch-depth: 1

      - name: Apply decision layer integration
        run: python3 tooling/horizon_decision_integration.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Format, analyze and commit
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/treasury/forecast_chart_screen.dart \
            lib/features/treasury/services/sandbox_service.dart \
            lib/features/treasury/services/horizon_scenarios.dart \
            lib/features/treasury/sandbox_forecast_screen.dart \
            lib/features/treasury/widgets/horizon_decision_panel.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          git diff --check
          grep -q 'HorizonDecisionPanel' lib/features/treasury/forecast_chart_screen.dart
          grep -q 'smartCombined' lib/features/treasury/forecast_chart_screen.dart
          grep -q 'HorizonDecisionPanel' lib/features/treasury/sandbox_forecast_screen.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/treasury/forecast_chart_screen.dart \
            lib/features/treasury/services/sandbox_service.dart \
            lib/features/treasury/services/horizon_scenarios.dart \
            lib/features/treasury/sandbox_forecast_screen.dart \
            lib/features/treasury/widgets/horizon_decision_panel.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(horizon): expose decision layer and smart champions'
          git push origin HEAD:agent/horizon-top-tier

  analyze-and-test:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test