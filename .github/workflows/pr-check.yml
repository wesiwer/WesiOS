name: Pull request check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js server/wesi-ai-relay/*.mjs server/wesi-ai-stream/*.mjs; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Validate Wesi AI deployment shell
        shell: bash
        run: |
          set -euo pipefail
          for file in server/wesi-ai-relay/*.sh server/wesi-ai-stream/*.sh; do
            [ -f "$file" ] || continue
            bash -n "$file"
          done
          test -s .github/workflows/deploy-wesi-ai.yml
          test -s .github/workflows/deploy-wesi-ai-streaming.yml
          test ! -e .github/workflows/deploy-wesi-ai-relay.yml
          grep -q 'Deploy Wesi AI End-to-End' .github/workflows/deploy-wesi-ai.yml
          grep -q 'Deploy Wesi AI Streaming' .github/workflows/deploy-wesi-ai-streaming.yml
          grep -q 'configure-relay-https.sh' .github/workflows/deploy-wesi-ai.yml
          grep -q 'GEMINI_API_KEY' .github/workflows/deploy-wesi-ai.yml
      - name: Test Wesi AI Relay
        run: node --test server/wesi-ai-relay/*.test.mjs
      - name: Test Wesi AI Main streaming gateway
        run: node --test server/wesi-ai-stream/*.test.mjs
      - name: Validate Wesi AI persona bundle
        shell: bash
        run: |
          set -euo pipefail
          python server/build-wesi-ai-personas.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('server/pb_hooks/.wesi-ai-personas.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert len(data['personas']['zane']) >= 200
          assert len(data['personas']['nirvana']) >= 200
          p.unlink()
          PY
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
