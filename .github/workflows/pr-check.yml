name: Pull request check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-final-core:
    if: github.head_ref == 'agent/horizon-top-tier' && github.event.pull_request.head.sha == 'a21d8ce08cc03dc041379b92c2b568e288622283'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/horizon-top-tier
          fetch-depth: 1

      - name: Apply final Horizon core patch
        run: |
          set -euo pipefail
          python3 -m py_compile tooling/horizon_final_core_patch.py
          python3 tooling/horizon_final_core_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Validate core patch
        run: |
          set -euo pipefail
          dart format lib/features/treasury/services/forecast_engine.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test test/horizon_top_tier_test.dart test/treasury_engines_test.dart
          grep -q 'Data-adaptive regime' lib/features/treasury/services/forecast_engine.dart
          grep -q '_semanticStream' lib/features/treasury/services/forecast_engine.dart

      - name: Commit core patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/treasury/services/forecast_engine.dart
          git commit -m 'feat(horizon): learn regimes and enforce horizon policy'
          git push origin HEAD:agent/horizon-top-tier

  analyze-and-test:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
