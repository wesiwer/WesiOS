name: Pull request check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-tasks-cash:
    if: github.head_ref == 'agent/horizon-top-tier'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/horizon-top-tier
          fetch-depth: 1

      - name: Apply Tasks cash integration
        run: python3 tooling/horizon_tasks_integration.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Format, analyze and commit
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/tasks/widgets/task_editor_dialog.dart \
            lib/features/tasks/widgets/task_cash_impact_field.dart \
            lib/features/tasks/services/task_cash_impact.dart \
            lib/features/treasury/services/horizon_business_context.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          git diff --check
          grep -q 'TaskCashImpactField' lib/features/tasks/widgets/task_editor_dialog.dart
          grep -q 'TaskCashImpact.fromTags' lib/features/treasury/services/horizon_business_context.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/tasks/widgets/task_editor_dialog.dart \
            lib/features/tasks/widgets/task_cash_impact_field.dart \
            lib/features/tasks/services/task_cash_impact.dart \
            lib/features/treasury/services/horizon_business_context.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(horizon): connect Tasks cash obligations'
          git push origin HEAD:agent/horizon-top-tier

  analyze-and-test:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test