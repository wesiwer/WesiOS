name: Pull request check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-final-stress-source:
    if: github.head_ref == 'agent/horizon-top-tier'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/horizon-top-tier
          fetch-depth: 1

      - name: Apply final Horizon stress-source patch
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tooling/horizon_confidence_patch.py \
            tooling/horizon_main_source_stress_patch.py
          python3 tooling/horizon_confidence_patch.py
          python3 tooling/horizon_main_source_stress_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Validate and commit when changed
        run: |
          set -euo pipefail
          dart format \
            lib/features/treasury/services/forecast_engine.dart \
            lib/features/treasury/services/horizon_business_context.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test \
            test/horizon_top_tier_test.dart \
            test/horizon_completion_test.dart \
            test/horizon_truth_invariants_test.dart \
            test/horizon_main_source_stress_test.dart \
            test/horizon_explainability_probability_test.dart
          grep -Fq 'final actualEvidenceCount = nonRecurring.length;' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'final primaryLossSource = mainIncomeExposure.isEmpty' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'riskSource:' lib/features/treasury/services/horizon_business_context.dart
          git add \
            lib/features/treasury/services/forecast_engine.dart \
            lib/features/treasury/services/horizon_business_context.dart
          if git diff --cached --quiet; then
            echo 'Final stress-source patch already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(horizon): stress the true dominant income source'
          git push origin HEAD:agent/horizon-top-tier

  analyze-and-test:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
