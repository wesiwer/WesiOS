name: Pull request check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-final-core:
    if: github.head_ref == 'agent/horizon-top-tier'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/horizon-top-tier
          fetch-depth: 1

      - name: Apply final Horizon patches idempotently
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tooling/horizon_final_core_patch.py \
            tooling/run_horizon_final_core_patch.py \
            tooling/horizon_final_product_patch.py
          python3 tooling/run_horizon_final_core_patch.py
          python3 tooling/horizon_final_product_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Validate final patches
        run: |
          set -euo pipefail
          dart format \
            lib/features/treasury/services/forecast_engine.dart \
            lib/features/treasury/services/forecast_backtest.dart \
            lib/features/treasury/services/treasury_service.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test \
            test/horizon_top_tier_test.dart \
            test/treasury_engines_test.dart \
            test/horizon_product_integration_test.dart
          grep -Fq '_semanticStream' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'transferDelayDays' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'HorizonExplainabilityService.build' lib/features/treasury/services/treasury_service.dart
          grep -Fq 'HorizonBehaviorMonitor.analyze' lib/features/treasury/services/treasury_service.dart
          grep -Fq 'intervalScaleFromCoverage(coverage, mape: mape)' lib/features/treasury/services/forecast_backtest.dart

      - name: Commit final patches when changed
        run: |
          set -euo pipefail
          git add \
            lib/features/treasury/services/forecast_engine.dart \
            lib/features/treasury/services/forecast_backtest.dart \
            lib/features/treasury/services/treasury_service.dart
          if git diff --cached --quiet; then
            echo 'Final patches already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(horizon): finalize liquidity attribution and calibration wiring'
          git push origin HEAD:agent/horizon-top-tier

  analyze-and-test:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
