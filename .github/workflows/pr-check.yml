name: Pull request check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js server/wesi-ai-relay/*.mjs server/wesi-ai-stream/*.mjs; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Audit complete Wesi AI tool registry
        id: tool_audit
        shell: bash
        run: |
          set +e
          node --test server/pb_hooks/wesi_ai_tools_contract.test.js > tool-audit.log 2>&1
          code=$?
          set -e
          cat tool-audit.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Upload Wesi AI tool audit failure report
        if: ${{ steps.tool_audit.outputs.code != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: wesi-ai-tool-audit-failure
          path: tool-audit.log
          retention-days: 2
      - name: Enforce Wesi AI tool audit
        shell: bash
        run: test "${{ steps.tool_audit.outputs.code }}" = "0"
      - name: Validate Wesi AI deployment shell
        shell: bash
        run: |
          set -euo pipefail
          for file in server/wesi-ai-relay/*.sh server/wesi-ai-stream/*.sh; do
            [ -f "$file" ] || continue
            bash -n "$file"
          done
          test -s .github/workflows/deploy-wesi-ai.yml
          test -s .github/workflows/deploy-wesi-ai-streaming.yml
          test ! -e .github/workflows/deploy-wesi-ai-relay.yml
          grep -q 'Deploy Wesi AI End-to-End' .github/workflows/deploy-wesi-ai.yml
          grep -q 'Deploy Wesi AI Streaming' .github/workflows/deploy-wesi-ai-streaming.yml
          grep -q 'configure-relay-https.sh' .github/workflows/deploy-wesi-ai.yml
          grep -q 'GEMINI_API_KEY' .github/workflows/deploy-wesi-ai.yml
      - name: Test Wesi AI Relay
        id: relay_test
        shell: bash
        run: |
          set +e
          node --test server/wesi-ai-relay/*.test.mjs > relay-test.log 2>&1
          code=$?
          set -e
          cat relay-test.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Upload Wesi AI Relay failure report
        if: ${{ steps.relay_test.outputs.code != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: wesi-ai-relay-test-failure
          path: relay-test.log
          retention-days: 2
      - name: Enforce Wesi AI Relay tests
        shell: bash
        run: test "${{ steps.relay_test.outputs.code }}" = "0"
      - name: Test Wesi AI Main streaming gateway
        run: node --test server/wesi-ai-stream/*.test.mjs
      - name: Validate Wesi AI persona bundle
        shell: bash
        run: |
          set -euo pipefail
          python server/build-wesi-ai-personas.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('server/pb_hooks/.wesi-ai-personas.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert len(data['personas']['zane']) >= 200
          assert len(data['personas']['nirvana']) >= 200
          p.unlink()
          PY
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
