name: Pull request check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-calibration-truth-ui:
    if: github.head_ref == 'agent/horizon-top-tier'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/horizon-top-tier
          fetch-depth: 1

      - name: Apply final truth-first patches
        run: |
          set -euo pipefail
          python3 -m py_compile tooling/horizon_truth_ui_patch.py
          python3 tooling/horizon_truth_ui_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Validate and commit when changed
        run: |
          set -euo pipefail
          dart format \
            lib/features/treasury/services/forecast_engine.dart \
            lib/features/treasury/services/forecast_backtest.dart \
            lib/features/treasury/services/horizon_engine_competition.dart \
            lib/features/treasury/services/treasury_service.dart \
            lib/features/treasury/services/horizon_behavior_monitor.dart \
            lib/features/treasury/widgets/horizon_decision_panel.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test \
            test/horizon_top_tier_test.dart \
            test/horizon_completion_test.dart \
            test/horizon_explainability_probability_test.dart
          grep -Fq 'uncertainMagnitudeByOffset' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'final tailSize = max(3, (horizon * 0.20).round())' lib/features/treasury/services/forecast_backtest.dart
          grep -Fq 'final evaluationStart = max(0, (horizon * 0.75).floor())' lib/features/treasury/services/horizon_engine_competition.dart
          grep -Fq 'Income is NOT auto-posted as actual cash' lib/features/treasury/services/treasury_service.dart
          grep -Fq 'legacyAutoIncome' lib/features/treasury/services/horizon_behavior_monitor.dart
          grep -Fq 'нет оценки · цель 80%' lib/features/treasury/widgets/horizon_decision_panel.dart
          git add \
            lib/features/treasury/services/forecast_engine.dart \
            lib/features/treasury/services/forecast_backtest.dart \
            lib/features/treasury/services/horizon_engine_competition.dart \
            lib/features/treasury/services/treasury_service.dart \
            lib/features/treasury/services/horizon_behavior_monitor.dart \
            lib/features/treasury/widgets/horizon_decision_panel.dart
          if git diff --cached --quiet; then
            echo 'Final truth patches already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(horizon): harden recurring truth and long-horizon evaluation'
          git push origin HEAD:agent/horizon-top-tier

  analyze-and-test:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
