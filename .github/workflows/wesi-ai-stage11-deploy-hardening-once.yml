name: Wesi AI Stage 11 Deploy Hardening One Shot

on:
  push:
    branches:
      - agent/wesi-ai-stage11-connectors-secure-gpt56

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage11-deploy-hardening-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage11-connectors-secure-gpt56
          fetch-depth: 0

      - name: Apply production deploy hardening
        run: python3 scripts/stage11_deploy_hardening_once.py

      - name: Validate deploy workflow structure
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/deploy-wesi-ai.yml', aliases: true); puts 'yaml ok'"
          grep -q 'server/pb_migrations/1786830000_wesi_ai_connector_vault.js' .github/workflows/deploy-wesi-ai.yml
          grep -q 'WESI_CONNECTOR_VAULT_KEY' .github/workflows/deploy-wesi-ai.yml
          grep -q 'WESI_GITHUB_OAUTH_CLIENT_ID' .github/workflows/deploy-wesi-ai.yml
          grep -q 'EnvironmentFile=-/etc/wesi-ai-connectors.env' .github/workflows/deploy-wesi-ai.yml
          grep -q 'check_route GET /api/wesi/ai/connectors' .github/workflows/deploy-wesi-ai.yml
          grep -q 'if \[ -s "$REMOTE/wesi-connectors-env.b64" \]' .github/workflows/deploy-wesi-ai.yml
          ! grep -q 'WESI_CONNECTOR_VAULT_KEY: [A-Za-z0-9_-]\{32\}' .github/workflows/deploy-wesi-ai.yml

      - name: Validate source hooks and migration
        run: |
          set -euo pipefail
          node --check server/pb_migrations/1786830000_wesi_ai_connector_vault.js
          node --check server/pb_hooks/wesi_ai_connector_vault.js
          node --check server/pb_hooks/wesi_ai_github_connector.js
          node --test server/wesi-ai-stream/connector_protocol.test.mjs
          node --test server/wesi-ai-relay/action-broker.test.mjs

      - name: Export exact validated deploy workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          cp .github/workflows/deploy-wesi-ai.yml tmp/stage11-validated-deploy-wesi-ai.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/stage11-validated-deploy-wesi-ai.yml
          git commit -m 'ci(ai): export validated Stage 11 deploy workflow'
          git push origin HEAD:agent/wesi-ai-stage11-connectors-secure-gpt56
