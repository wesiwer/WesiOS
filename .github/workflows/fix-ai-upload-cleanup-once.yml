name: Finish AI staged cleanup once

on:
  push:
    paths:
      - '.github/workflows/fix-ai-upload-cleanup-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-client-hardening-chunked
          token: ${{ github.token }}
      - name: Apply cleanup patch
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('server/wesi-ai-relay/attachment-preprocessor.mjs'); t=p.read_text(encoding='utf-8'); old='    return {parts, descriptors, providerFiles};\\n  } catch (error) {\\n    await deleteGeminiFiles(providerFiles, apiKey);\\n    throw error;'; new='    return {parts, descriptors, providerFiles, stagedUploadIds};\\n  } catch (error) {\\n    await deleteGeminiFiles(providerFiles, apiKey);\\n    deleteStagedUploads(stagedUploadIds);\\n    throw error;'; assert old in t, 'cleanup target not found'; p.write_text(t.replace(old,new,1),encoding='utf-8')"
          node --check server/wesi-ai-relay/attachment-preprocessor.mjs
          grep -q 'return {parts, descriptors, providerFiles, stagedUploadIds}' server/wesi-ai-relay/attachment-preprocessor.mjs
          rm .github/workflows/fix-ai-upload-cleanup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/wesi-ai-relay/attachment-preprocessor.mjs .github/workflows/fix-ai-upload-cleanup-once.yml
          git commit -m 'fix(ai): complete staged attachment cleanup lifecycle'
          git push origin HEAD:chatgpt/ai-client-hardening-chunked
