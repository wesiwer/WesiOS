name: Test stable employee portal

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production portal HTML
        run: |
          set -euo pipefail
          mkdir -p build-src
          cp server/employee-portal/index.html server/employee-portal/styles.css server/employee-portal/portal-v6.css server/employee-portal/app.js server/employee-portal/motion-v6.js build-src/
          cp assets/images/app_icon.png build-src/app_icon.png
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('build-src')
          html=(root/'index.html').read_text(encoding='utf-8')
          css=(root/'styles.css').read_text(encoding='utf-8')
          css2=(root/'portal-v6.css').read_text(encoding='utf-8')
          js=(root/'app.js').read_text(encoding='utf-8').replace('</script','<\\/script')
          js2=(root/'motion-v6.js').read_text(encoding='utf-8').replace('</script','<\\/script')
          html=re.sub(r'<link\s+rel="stylesheet"\s+href="\./styles\.css[^"]*"\s*/?>','<style>'+css+'</style>',html,count=1)
          html=re.sub(r'<link\s+rel="stylesheet"\s+href="\./portal-v6\.css[^"]*"\s*/?>','<style>'+css2+'</style>',html,count=1)
          html=re.sub(r'<script\s+src="\./app\.js[^"]*"\s+defer></script>','<script>'+js+'</script>',html,count=1)
          html=re.sub(r'<script\s+src="\./motion-v6\.js[^"]*"\s+defer></script>','<script>'+js2+'</script>',html,count=1)
          (root/'index.html').write_text(html,encoding='utf-8')
          PY
          node --check server/employee-portal/app.js
          node --check server/employee-portal/motion-v6.js
      - name: Install WebKit
        run: |
          npm init -y >/dev/null
          npm install --silent playwright@1.54.2
          npx playwright install --with-deps webkit >/dev/null
      - name: Render mobile portal
        run: |
          python3 -m http.server 4173 --directory build-src >/tmp/portal-http.log 2>&1 &
          cat > render.mjs <<'JS'
          import { webkit, devices } from 'playwright';
          const browser=await webkit.launch({headless:true});
          const context=await browser.newContext({...devices['iPhone 15 Pro']});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          page.on('requestfailed',r=>errors.push(`${r.url()}: ${r.failure()?.errorText}`));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:20000});
          await page.waitForTimeout(1800);
          const result=await page.evaluate(()=>({
            background:getComputedStyle(document.body).backgroundColor,
            text:document.body.innerText.length,
            login:getComputedStyle(document.getElementById('loginView')).display,
            form:!!document.getElementById('loginForm'),
            sections:document.querySelectorAll('section').length,
            height:document.documentElement.scrollHeight,
            width:document.documentElement.scrollWidth,
            viewport:innerWidth,
            boot:!!document.getElementById('boot'),
          }));
          console.log(JSON.stringify({result,errors},null,2));
          await page.screenshot({path:'portal-mobile.png',fullPage:true});
          if(result.background==='rgb(255, 255, 255)')throw new Error('white background');
          if(result.text<1200)throw new Error('content missing');
          if(result.login==='none'||!result.form)throw new Error('login hidden');
          if(result.height<3000)throw new Error('sections missing');
          if(result.width>result.viewport+2)throw new Error('horizontal overflow');
          if(result.boot)throw new Error('blocking boot exists');
          if(errors.length)throw new Error(errors.join('\n'));
          await browser.close();
          JS
          node render.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stable-portal-mobile
          path: portal-mobile.png
          retention-days: 1
