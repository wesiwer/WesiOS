name: Organization hierarchy verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  analysis-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cce05b7c55e2d6e1b108dae8e2cab5fa533a0c67
      - name: Verify exact product SHA
        run: test "$(git rev-parse HEAD)" = "cce05b7c55e2d6e1b108dae8e2cab5fa533a0c67"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Full test suite
        run: flutter test
      - name: Organization hierarchy v1.1 contracts
        run: flutter test test/organization_hierarchy_test.dart test/organization_migration_context_test.dart test/inter_org_transfer_test.dart test/employee_finance_org_test.dart test/organization_finance_access_test.dart test/employee_finance_dynamics_test.dart test/organization_sync_integrity_test.dart test/organization_tz_contract_test.dart test/organization_ui_contract_test.dart
      - name: Legacy Treasury and Horizon contracts
        run: flutter test test/treasury_engines_test.dart test/recurring_payment_automation_test.dart test/horizon_legacy_income_truth_test.dart test/horizon_top_tier_test.dart test/horizon_product_integration_test.dart test/horizon_completion_test.dart

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cce05b7c55e2d6e1b108dae8e2cab5fa533a0c67
      - name: Verify exact product SHA
        run: test "$(git rev-parse HEAD)" = "cce05b7c55e2d6e1b108dae8e2cab5fa533a0c67"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cce05b7c55e2d6e1b108dae8e2cab5fa533a0c67
      - name: Verify exact product SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne 'cce05b7c55e2d6e1b108dae8e2cab5fa533a0c67') { throw 'Unexpected product SHA' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
