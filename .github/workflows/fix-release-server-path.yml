name: Fix WesiOS release server path

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch-main:
    if: github.head_ref == 'ci/fix-release-server-path'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Patch release deployment defaults safely
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release-app.yml')
          s = p.read_text()

          old = 'DIR="${ARTIFACTS_DIR:-/srv/wesi-artifacts}"'
          new = 'DIR="${ARTIFACTS_DIR:-/opt/pocketbase/pb_public/artifacts}"'
          if old not in s:
              raise SystemExit('expected old DIR default not found')
          s = s.replace(old, new, 1)

          old = '''          if $SSH "$USER@$HOST" "mkdir -p '$DIR/app' 2>/dev/null && test -w '$DIR/app'"; then\n            echo "Каталог $DIR/app доступен на запись"\n            exit 0\n          fi\n'''
          new = '''          if $SSH "$USER@$HOST" "mkdir -p '$DIR/app' 2>/dev/null && test -w '$DIR/app'"; then\n            echo "Каталог $DIR/app доступен на запись"\n            exit 0\n          fi\n\n          # Если каталог принадлежит сервису/root, один раз пробуем\n          # passwordless sudo. Никаких паролей в CI и интерактивных prompts.\n          if $SSH "$USER@$HOST" "command -v sudo >/dev/null 2>&1 && sudo -n mkdir -p '$DIR/app' && sudo -n chown -R '$USER' '$DIR' && test -w '$DIR/app'"; then\n            echo "Каталог $DIR/app подготовлен через passwordless sudo"\n            exit 0\n          fi\n'''
          if old not in s:
              raise SystemExit('expected writable check block not found')
          s = s.replace(old, new, 1)

          old = '''          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"\n          REMOTE_TMP="/tmp/wesios-upload-$GITHUB_RUN_ID"\n'''
          new = '''          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"\n          DIR="${ARTIFACTS_DIR:-/opt/pocketbase/pb_public/artifacts}"\n          REMOTE_TMP="/tmp/wesios-upload-$GITHUB_RUN_ID"\n'''
          if old not in s:
              raise SystemExit('expected upload SSH block not found')
          s = s.replace(old, new, 1)

          old = '''          $SSH "$USER@$HOST" \\\n            "WESI_ARTIFACTS='${ARTIFACTS_DIR}' \\\n             bash '$REMOTE_TMP/deploy-artifact.sh' \\\n'''
          new = '''          $SSH "$USER@$HOST" \\\n            "WESI_ARTIFACTS='$DIR' \\\n             bash '$REMOTE_TMP/deploy-artifact.sh' \\\n'''
          if old not in s:
              raise SystemExit('expected deploy-artifact invocation not found')
          s = s.replace(old, new, 1)

          # Обновляем комментарий, чтобы документация не обещала старый /srv default.
          s = s.replace(
              '# Пусто — каталог по умолчанию из самого скрипта.',
              '# Пусто — используем PocketBase pb_public, доступный по /artifacts.',
              1,
          )
          p.write_text(s)
          PY

          git diff --check
          git diff -- .github/workflows/release-app.yml
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-app.yml
          git commit -m 'fix(release): deploy artifacts through PocketBase public dir'
          git push origin HEAD:main
