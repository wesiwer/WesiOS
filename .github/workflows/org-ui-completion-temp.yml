name: Organization UI completion

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  complete:
    if: github.head_ref == 'agent/org-ui-completion-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-v1
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Complete org UI requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # Treasury subtree breakdown.
          p=Path('lib/features/treasury/treasury_screen.dart')
          s=p.read_text(encoding='utf-8')
          imp="import '../organizations/widgets/organization_switcher.dart';\n"
          if "subtree_finance_breakdown.dart" not in s:
              s=s.replace(imp, imp+"import '../organizations/widgets/subtree_finance_breakdown.dart';\n")
          needle="""          AccountsBar(\n            transactions: _transactions,\n            selectedId: _accountId,\n            onSelect: _selectAccount,\n          ),\n          const SizedBox(height: 16),\n          _balanceCard(),\n"""
          repl="""          AccountsBar(\n            transactions: _transactions,\n            selectedId: _accountId,\n            onSelect: _selectAccount,\n          ),\n          if (OrganizationContext.scope == OrganizationScope.subtree) ...[\n            const SizedBox(height: 16),\n            const SubtreeFinanceBreakdown(),\n          ],\n          const SizedBox(height: 16),\n          _balanceCard(),\n"""
          if 'const SubtreeFinanceBreakdown()' not in s and needle in s:
              s=s.replace(needle,repl,1)
          p.write_text(s,encoding='utf-8')

          # Inter-org flow exposes requested date before confirmation.
          p=Path('lib/features/organizations/inter_org_transfer_screen.dart')
          s=p.read_text(encoding='utf-8')
          state="""  final _note = TextEditingController();\n  bool _busy = false;\n"""
          if 'DateTime _selectedDate' not in s and state in s:
              s=s.replace(state,"""  final _note = TextEditingController();\n  DateTime _selectedDate = DateTime.now();\n  bool _busy = false;\n""",1)
          note_needle="""          const SizedBox(height: 10),\n          TextField(\n            controller: _note,\n"""
          if "_pickDate" not in s and note_needle in s:
              date_ui="""          const SizedBox(height: 10),\n          ListTile(\n            contentPadding: EdgeInsets.zero,\n            leading: Icon(Icons.calendar_today_outlined, color: AppTheme.accent),\n            title: const Text('Дата'),\n            subtitle: Text(\n              '${_selectedDate.day.toString().padLeft(2, '0')}.${_selectedDate.month.toString().padLeft(2, '0')}.${_selectedDate.year}',\n            ),\n            onTap: _pickDate,\n          ),\n          const SizedBox(height: 10),\n          TextField(\n            controller: _note,\n"""
              s=s.replace(note_needle,date_ui,1)
              submit_sig='  Future<void> _submit() async {\n'
              picker="""  Future<void> _pickDate() async {\n    final picked = await showDatePicker(\n      context: context,\n      initialDate: _selectedDate,\n      firstDate: DateTime(2020),\n      lastDate: DateTime(2100),\n    );\n    if (picked != null && mounted) {\n      setState(() => _selectedDate = picked);\n    }\n  }\n\n"""
              if submit_sig in s:
                  s=s.replace(submit_sig,picker+submit_sig,1)
          if 'date: _selectedDate,' not in s:
              s=s.replace("        note: _note.text.trim().isEmpty ? null : _note.text.trim(),\n", "        note: _note.text.trim().isEmpty ? null : _note.text.trim(),\n        date: _selectedDate,\n",1)
          p.write_text(s,encoding='utf-8')
          PY
          dart format lib >/dev/null
          flutter pub get
          flutter analyze --no-fatal-infos
          rm -f .github/workflows/org-ui-completion-temp.yml
          git diff --check
      - name: Commit UI completion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WesiOS CI Fix"
          git config user.email "actions@users.noreply.github.com"
          git add lib .github/workflows/org-ui-completion-temp.yml
          git commit -m "feat(org): complete subtree and transfer UI"
          git push origin HEAD:agent/org-hierarchy-v1
