name: Release WesiOS 0.19.19

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-and-wait:
    if: github.head_ref == 'ci/release-01919'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Dispatch signed WesiOS 0.19.19 release and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/horizon-top-tier \
            -f notes='Wesi Horizon Top-Tier A→G: новый прогноз Treasury с P10/P50/P90, calibrated risk, recurring reliability, сценариями, runway/reserve, What-If, multi-engine competition, explainability и truth-first confidence. Также включены финальные исправления recurring cash truth и Windows release compatibility.' \
            -f deploy_to_server=true

          run_id=''
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=50")
            run_id=$(printf '%s' "$runs" | jq -r \
              --argjson started "$started" \
              '[.workflow_runs[] | select(.name == "Publish WesiOS Release") | select((.created_at | fromdateiso8601) >= ($started - 5))] | sort_by(.created_at) | last | .id // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo '::error::Release run not found'; exit 1; }
          echo "release_run_id=$run_id"

          for attempt in $(seq 1 260); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            echo "release attempt=$attempt status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && break
              echo "::error::Release completed with $conclusion"
              exit 1
            fi
            sleep 15
          done
          final=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // ""')
          [ "$final" = success ] || { echo '::error::Release timeout/failure'; exit 1; }

          started_installer=$(date -u +%s)
          gh workflow run publish-windows-installer.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          installer_id=''
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=50")
            installer_id=$(printf '%s' "$runs" | jq -r \
              --argjson started "$started_installer" \
              '[.workflow_runs[] | select(.name == "Publish WesiOS Windows Installer") | select((.created_at | fromdateiso8601) >= ($started - 5))] | sort_by(.created_at) | last | .id // empty')
            [ -n "$installer_id" ] && break
            sleep 5
          done
          [ -n "$installer_id" ] || { echo '::error::Installer run not found'; exit 1; }
          echo "installer_run_id=$installer_id"

          for attempt in $(seq 1 180); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$installer_id")
            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            echo "installer attempt=$attempt status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && { echo 'WESIOS_01919_PRODUCTION_RELEASE_OK'; exit 0; }
              echo "::error::Installer completed with $conclusion"
              exit 1
            fi
            sleep 15
          done
          echo '::error::Installer timeout'
          exit 1
