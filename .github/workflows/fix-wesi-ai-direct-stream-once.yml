name: Fix Wesi AI Direct Stream Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wesi-ai-direct-stream-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply direct-chat fallback and diagnostics fix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' ' aWYgb2xkIG5vdCBpbiBzOgogICAgcmFpc2UgU3lzdGVtRXhpdCgic3RyZWFtIGNhdGNoIGluc2VydGlvbiBwb2ludCBub3QgZm91bmQiKQpzID0gcy5yZXBsYWNlKG9sZCwgbmV3LCAxKQoKbWFya2VyID0gIiIiICBzdGF0aWMgdm9pZCBfZW1pdFN0cmVhbUZhbGxiYWNrKAoiIiIK    aWYgb2xkX2cgbm90IGluIGc6CiAgICByYWlzZSBTeXN0ZW1FeGl0KCJnYXRld2F5IGRpYWdub3N0aWMgaW5zZXJ0aW9uIHBvaW50IG5vdCBmb3VuZCIpCm ' | tr -d ' ' | base64 --decode > /tmp/wesi-ai-direct-hotfix.py
          python3 /tmp/wesi-ai-direct-hotfix.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Validate hotfix
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/ai/wesi_ai_api.dart test/features/ai/wesi_ai_response_contract_test.dart
          node --check server/wesi-ai-stream/gateway.mjs
          node --test server/wesi-ai-stream/gateway.test.mjs
          flutter pub get
          flutter test test/features/ai/wesi_ai_response_contract_test.dart
          flutter analyze lib/features/ai/wesi_ai_api.dart --no-fatal-infos
          grep -q '^version: 0.22.20+95$' pubspec.yaml
          grep -q "static const String number = '0.22.20';" lib/core/constants/app_version.dart
          grep -q 'static const int build = 95;' lib/core/constants/app_version.dart

      - name: Commit validated hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wesiwer'
          git config user.email '77644223+wesiwer@users.noreply.github.com'
          git add lib/features/ai/wesi_ai_api.dart test/features/ai/wesi_ai_response_contract_test.dart server/wesi-ai-stream/gateway.mjs pubspec.yaml lib/core/constants/app_version.dart
          git commit -m 'fix(ai): restore direct Zane Nirvana chat fallback'
          git push origin HEAD:main

      - name: Redeploy streaming gateway and publish signed app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-wesi-ai-streaming.yml --repo "$GITHUB_REPOSITORY" --ref main -f public_host='wesi-ai-178-236-247-194.nip.io'
          gh workflow run release-app.yml --repo "$GITHUB_REPOSITORY" --ref main -f notes='Wesi AI direct Zane/Nirvana chat stream fallback hotfix.' -f deploy_to_server=true
