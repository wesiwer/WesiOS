name: Wesi AI Main Route Activation Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/pb_hooks/wesi_ai_*.js'
      - 'server/pb_hooks/wesi_ai_*.pb.js'
      - 'server/verify-wesi-ai-main-routes.sh'
      - '.github/wesi-ai-router-deploy.trigger'
      - '.github/workflows/wesi-ai-main-route-activation-guard.yml'
  workflow_run:
    workflows:
      - 'Deploy Wesi AI Streaming'
      - 'Deploy Wesi AI End-to-End'
    types: [completed]

permissions:
  contents: read

concurrency:
  group: wesi-ai-main-route-activation
  cancel-in-progress: false

jobs:
  activate-main-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate authoritative Main bundle
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${MAIN_HOST:-}" ] || { echo '::error::WESI_SERVER_HOST is missing'; exit 1; }
          [ -n "${MAIN_USER:-}" ] || { echo '::error::WESI_SERVER_USER is missing'; exit 1; }
          python3 server/build-wesi-ai-personas.py
          test -s server/pb_hooks/.wesi-ai-personas.json
          test -s server/verify-wesi-ai-main-routes.sh
          bash -n server/verify-wesi-ai-main-routes.sh
          count=0
          for file in server/pb_hooks/wesi_ai_*.js server/pb_hooks/wesi_ai_*.pb.js; do
            [ -f "$file" ] || continue
            node --check "$file"
            count=$((count + 1))
          done
          [ "$count" -gt 8 ] || { echo "::error::Incomplete Main Wesi AI hook bundle ($count files)"; exit 1; }
          for critical in \
            server/pb_hooks/wesi_ai_lib.js \
            server/pb_hooks/wesi_ai_routes.pb.js \
            server/pb_hooks/wesi_ai_lobby.pb.js \
            server/pb_hooks/wesi_ai_stream.pb.js; do
            test -s "$critical" || { echo "::error::Missing critical hook: $critical"; exit 1; }
          done

      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${KEY:-}" ] || { echo '::error::WESI_SERVER_SSH_KEY is missing'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts
          else
            ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Install activate and locally verify Main routes
        shell: bash
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          REMOTE="/tmp/wesi-ai-main-route-guard-$GITHUB_RUN_ID"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp "${SSH[@]}" \
            server/pb_hooks/wesi_ai_*.js \
            server/pb_hooks/wesi_ai_*.pb.js \
            server/pb_hooks/.wesi-ai-personas.json \
            server/verify-wesi-ai-main-routes.sh \
            "$MAIN_USER@$MAIN_HOST:$REMOTE/"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          HOOK_DIR=/opt/pocketbase/pb_hooks
          test -d "$HOOK_DIR"
          test -w "$HOOK_DIR" || { echo "Hook directory is not writable by $(id -un)" >&2; exit 1; }
          test -d "$REMOTE"

          count=0
          for src in "$REMOTE"/wesi_ai_*.js "$REMOTE"/wesi_ai_*.pb.js; do
            [ -f "$src" ] || continue
            dst="$HOOK_DIR/$(basename "$src")"
            [ ! -e "$dst" ] || test -w "$dst" || { echo "Hook is not writable: $dst" >&2; exit 1; }
            cat "$src" > "$dst"
            chmod 0644 "$dst"
            count=$((count + 1))
          done
          [ "$count" -gt 8 ] || { echo "Incomplete installed hook bundle: $count" >&2; exit 1; }

          test -w "$HOOK_DIR/.wesi-ai-personas.json" || [ ! -e "$HOOK_DIR/.wesi-ai-personas.json" ]
          cat "$REMOTE/.wesi-ai-personas.json" > "$HOOK_DIR/.wesi-ai-personas.json"
          chmod 0600 "$HOOK_DIR/.wesi-ai-personas.json"

          for critical in wesi_ai_lib.js wesi_ai_routes.pb.js wesi_ai_lobby.pb.js wesi_ai_stream.pb.js; do
            test -s "$HOOK_DIR/$critical" || { echo "Missing installed critical hook: $critical" >&2; exit 1; }
            cmp -s "$REMOTE/$critical" "$HOOK_DIR/$critical" || { echo "Installed hook differs: $critical" >&2; exit 1; }
          done

          # Some PocketBase deployments hot-reload pb_hooks. Probe first and only restart
          # when the newly installed routes are not actually registered yet.
          if bash "$REMOTE/verify-wesi-ai-main-routes.sh" http://127.0.0.1:8090; then
            echo MAIN_WESI_AI_ROUTES_ALREADY_ACTIVE
            rm -rf "$REMOTE"
            exit 0
          fi

          CURRENT_USER="$(id -un)"
          OLD_PID="$(pgrep -xo pocketbase || true)"
          PB_USER=""
          [ -z "$OLD_PID" ] || PB_USER="$(ps -o user= -p "$OLD_PID" | xargs)"
          RESTART_POLICY="$(systemctl show pocketbase -p Restart --value 2>/dev/null || true)"
          echo "PocketBase activation required: ssh_user=$CURRENT_USER process_user=${PB_USER:-unknown} restart_policy=${RESTART_POLICY:-unknown}"

          if [ "$(id -u)" -eq 0 ]; then
            systemctl restart pocketbase
          elif sudo -n true 2>/dev/null; then
            sudo -n systemctl restart pocketbase
          elif [ -n "$OLD_PID" ] && [ "$PB_USER" = "$CURRENT_USER" ]; then
            case "$RESTART_POLICY" in
              always|on-failure|on-abnormal|on-abort)
                # Force a failure so systemd's configured restart policy relaunches the
                # service without requiring privileged systemctl access.
                kill -KILL "$OLD_PID"
                ;;
              *)
                echo "Cannot safely restart PocketBase without sudo; service restart policy is '${RESTART_POLICY:-unset}'" >&2
                exit 1
                ;;
            esac
          else
            echo "Cannot activate PocketBase hooks: no passwordless sudo and process is owned by '${PB_USER:-unknown}', not '$CURRENT_USER'" >&2
            exit 1
          fi

          ready=0
          for _ in $(seq 1 40); do
            NEW_PID="$(pgrep -xo pocketbase || true)"
            if [ -n "$NEW_PID" ] && [ "$NEW_PID" != "${OLD_PID:-}" ] && curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || { echo 'PocketBase did not relaunch healthy after hook activation' >&2; exit 1; }

          bash "$REMOTE/verify-wesi-ai-main-routes.sh" http://127.0.0.1:8090
          rm -rf "$REMOTE"
          echo MAIN_WESI_AI_ROUTES_RELOADED
          REMOTE_SCRIPT

      - name: Verify public Chat and Lobby contract
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            if bash server/verify-wesi-ai-main-routes.sh https://api.wesi-inc.ru; then
              echo 'WESI_AI_MAIN_ROUTE_ACTIVATION_OK'
              exit 0
            fi
            sleep 2
          done
          echo '::error::Public Wesi AI Chat/Lobby route contract is not healthy after activation'
          exit 1
