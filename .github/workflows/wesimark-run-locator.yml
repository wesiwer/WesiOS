name: WesiMark Run Locator

on:
  workflow_dispatch:
  push:
    branches:
      - wesimark/printer-pairing-v2.4
    paths:
      - '.github/workflows/wesimark-run-locator.yml'

permissions:
  actions: read
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wesimark/printer-pairing-v2.4
      - name: Locate target build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 81889ca43acfe509a82b337763d40e650fb82fe7
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          for attempt in $(seq 1 30); do
            RUNS="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow wesimark-final-correct-build.yml --branch wesimark/printer-pairing-v2.4 --limit 30 --json databaseId,headSha,status,conclusion,url,createdAt)"
            ROW="$(jq -c --arg sha "$TARGET_SHA" '[.[] | select(.headSha == $sha)][0] // empty' <<<"$RUNS")"
            if [ -n "$ROW" ]; then
              {
                echo "target_sha=$TARGET_SHA"
                echo "run_id=$(jq -r '.databaseId' <<<"$ROW")"
                echo "status=$(jq -r '.status' <<<"$ROW")"
                echo "conclusion=$(jq -r '.conclusion // ""' <<<"$ROW")"
                echo "url=$(jq -r '.url' <<<"$ROW")"
                echo "located_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              } > .ci/wesimark-active-run.txt
              git config user.name github-actions[bot]
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git add -- .ci/wesimark-active-run.txt
              git commit -m 'ci(wesimark): record active verified build run' || true
              git pull --rebase origin wesimark/printer-pairing-v2.4
              git push origin HEAD:wesimark/printer-pairing-v2.4
              exit 0
            fi
            sleep 5
          done
          exit 1
