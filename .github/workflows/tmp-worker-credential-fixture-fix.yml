name: Temporary Worker Credential Fixture Fix

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
    paths:
      - .github/workflows/tmp-worker-credential-fixture-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage12-final-20260816
          fetch-depth: 0
      - name: Make test credentials independent of wall clock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'test/wesi_remote_worker_pause_lifecycle_test.dart',
              'test/wesi_remote_worker_agent_test.dart',
          ]:
              p = Path(name)
              text = p.read_text()
              old = 'expiresAt: DateTime.utc(2026, 8, 16),'
              if old not in text:
                  raise SystemExit(f'missing expected expiring fixture in {name}')
              p.write_text(text.replace(old, 'expiresAt: DateTime.utc(2030, 1, 1),'))
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - run: dart format test/wesi_remote_worker_pause_lifecycle_test.dart test/wesi_remote_worker_agent_test.dart
      - run: flutter test test/wesi_remote_worker_pause_lifecycle_test.dart test/wesi_remote_worker_agent_test.dart
      - name: Commit verified fixtures
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-ci'
          git config user.email 'wesi-ai-ci@users.noreply.github.com'
          git add test/wesi_remote_worker_pause_lifecycle_test.dart test/wesi_remote_worker_agent_test.dart
          git commit -m 'test(ai): make worker credentials clock-stable'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
