name: Validate Wesi AI Stage 5 server tools

on:
  push:
    branches:
      - agent/wesi-ai-stage5-action-broker

permissions:
  contents: read

concurrency:
  group: wesi-ai-stage5-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate server JavaScript
        run: |
          node --check server/pb_hooks/wesi_ai_capability_registry.js
          node --check server/pb_hooks/wesi_ai_risk_policy.js
          node --check server/pb_hooks/wesi_ai_action_broker.js
          node --check server/pb_hooks/wesi_ai_audit.js
          node --check server/pb_hooks/wesi_ai_tools.js
          node --check server/pb_hooks/wesi_ai_task_tools.js
          node --check server/pb_hooks/wesi_ai_task_write_tools.js
          node --check server/pb_hooks/wesi_ai_calendar_write_tools.js
          node --check server/pb_hooks/wesi_ai_finance_tools.js
          node --check server/pb_hooks/wesi_ai_finance_write_tools.js
          node --check server/pb_hooks/wesi_ai_workspace_tools.js
          node --check server/pb_hooks/wesi_ai_crm_write_tools.js
          node --check server/pb_hooks/wesi_ai_knowledge_tools.js
          node --check server/pb_hooks/wesi_ai_knowledge_write_tools.js
          node --check server/pb_hooks/wesi_ai_horizon_tools.js
          node --check server/pb_hooks/wesi_ai_routes.pb.js
          node --check server/pb_hooks/wesi_ai_stream.pb.js
      - name: Test Action Broker
        run: node --test server/wesi-ai-relay/action-broker.test.mjs
      - name: Test existing Relay policy regressions
        run: |
          node --test server/wesi-ai-relay/tools-policy.test.mjs
          node --test server/wesi-ai-relay/task-read-scope.test.mjs
          node --test server/wesi-ai-relay/finance-tools.test.mjs
