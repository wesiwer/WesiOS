name: One-shot sync referential integrity patch

on:
  pull_request:
    branches:
      - agent/org-hierarchy-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
      - name: Patch sync integrity boundaries
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/core/sync/sync_codec.dart')
          text = p.read_text(encoding='utf-8')

          old_snapshot = '''bool _organizationSnapshotValid(Iterable<OrganizationModel> values) {
  final nodes = values.toList();
  if (nodes.isEmpty) return false;
  final ids = nodes.map((e) => e.id).toSet();
  if (ids.length != nodes.length) return false;
  final roots = nodes.where((o) => o.isRoot).toList();
  if (roots.length != 1) return false;
  if (roots.single.parentId != null) return false;
  if (roots.single.id != OrganizationModel.rootId) return false;
  for (final node in nodes) {
    if (!node.isRoot &&
        (node.parentId == null || !ids.contains(node.parentId))) return false;
    final seen = <String>{node.id};
    var parent = node.parentId;
    while (parent != null) {
      if (!seen.add(parent)) return false;
      OrganizationModel? parentNode;
      for (final candidate in nodes) {
        if (candidate.id == parent) {
          parentNode = candidate;
          break;
        }
      }
      if (parentNode == null) return false;
      parent = parentNode.parentId;
    }
  }
  return true;
}
'''
          new_snapshot = '''bool _organizationSnapshotValid(Iterable<OrganizationModel> values) {
  final nodes = values.toList();
  if (nodes.isEmpty) return false;
  final byId = {for (final node in nodes) node.id: node};
  if (byId.length != nodes.length) return false;
  final roots = nodes.where((o) => o.isRoot).toList();
  if (roots.length != 1) return false;
  if (roots.single.parentId != null) return false;
  if (roots.single.id != OrganizationModel.rootId) return false;
  if (roots.single.archived) return false;
  for (final node in nodes) {
    if (!node.isRoot) {
      final parentId = node.parentId;
      final parentNode = parentId == null ? null : byId[parentId];
      if (parentNode == null) return false;
      // OrganizationService never allows an active child below an archived
      // parent. Sync must preserve the same domain invariant.
      if (!node.archived && parentNode.archived) return false;
    }
    final seen = <String>{node.id};
    var parent = node.parentId;
    while (parent != null) {
      if (!seen.add(parent)) return false;
      final parentNode = byId[parent];
      if (parentNode == null) return false;
      parent = parentNode.parentId;
    }
  }
  return true;
}
'''
          if text.count(old_snapshot) != 1:
              raise SystemExit(f'organization snapshot block count={text.count(old_snapshot)}')
          text = text.replace(old_snapshot, new_snapshot, 1)

          old_org_remove = '''  @override
  Future<void> removeById(String id) async {
    final b = box();
    if (b == null || id == OrganizationModel.rootId) return;
    final next = b.values.where((o) => o.id != id).toList();
    if (!_organizationSnapshotValid(next)) return;
    await b.delete(id);
  }
'''
          new_org_remove = '''  @override
  Future<void> removeById(String id) async {
    // Organizations are soft-deleted (archived) by the domain service. There
    // is no legitimate hard-delete operation to synchronize, while accepting
    // a remote tombstone could orphan accounts, transactions, tasks or grants.
    // Keep the local record; the next sync safely restores it remotely.
  }
'''
          if text.count(old_org_remove) != 1:
              raise SystemExit(f'organization remove block count={text.count(old_org_remove)}')
          text = text.replace(old_org_remove, new_org_remove, 1)

          old_account_apply = '''  @override
  Future<bool> applyFields(Map<String, dynamic> fields) async {
    final b = box();
    final incoming = decode(fields);
    if (b == null || incoming == null) return false;
    if (!_organizationExistsActive(incoming.effectiveOrganizationId)) return false;
    await b.put(incoming.id, incoming);
    return true;
  }
}

class TransactionsSync extends SyncCollection<TransactionModel> {
'''
          new_account_apply = '''  @override
  Future<bool> applyFields(Map<String, dynamic> fields) async {
    final b = box();
    final incoming = decode(fields);
    if (b == null || incoming == null) return false;
    if (!_organizationExistsActive(incoming.effectiveOrganizationId)) return false;
    final before = b.get(incoming.id);
    if (before != null &&
        before.effectiveOrganizationId != incoming.effectiveOrganizationId &&
        await AccountService.hasLinkedTransactions(incoming.id)) {
      return false;
    }
    await b.put(incoming.id, incoming);
    return true;
  }

  @override
  Future<void> removeById(String id) async {
    final b = box();
    final existing = b?.get(id);
    if (b == null || existing == null) return;
    if (existing.kind == AccountKind.main) return;
    if (await AccountService.hasLinkedTransactions(id)) return;
    await b.delete(id);
  }
}

class TransactionsSync extends SyncCollection<TransactionModel> {
'''
          if text.count(old_account_apply) != 1:
              raise SystemExit(f'account apply block count={text.count(old_account_apply)}')
          text = text.replace(old_account_apply, new_account_apply, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git rm .github/workflows/org-sync-integrity-patch.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/sync/sync_codec.dart
          git commit -m "fix: reject destructive sync referential changes"
          git push origin HEAD:agent/org-hierarchy-remediation-1
