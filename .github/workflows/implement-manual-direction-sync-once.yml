name: Implement manual sync direction once

on:
  push:
    branches:
      - fix/safe-local-recovery-upload
    paths:
      - '.github/workflows/implement-manual-direction-sync-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safe-local-recovery-upload
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Apply targeted integration patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1) Fix the real organization recovery failure: collection.local()
          # is the authoritative projection. Raw quarantined Hive rows must not
          # masquerade as concurrent edits and block remote repair.
          engine = Path('lib/core/sync/sync_engine.dart')
          text = engine.read_text()
          old_lookup = '''  static dynamic _localValueBySyncId(
            SyncCollection<dynamic> c,
            String id,
          ) {
            final box = c.box();
            if (box != null) {
              try {
                final direct = box.get(id);
                if (direct != null && c.shouldSync(direct) && c.idOf(direct) == id) {
                  return direct;
                }
              } catch (_) {}
            }
            try {
              return c.local()[id];
            } catch (_) {
              return null;
            }
          }
          '''
          new_lookup = '''  static dynamic _localValueBySyncId(
            SyncCollection<dynamic> c,
            String id,
          ) {
            // The collection projection is authoritative. Some codecs quarantine
            // structurally invalid raw Hive rows. Reading the box directly here
            // made that quarantined row look like a concurrent user edit and
            // blocked authoritative server repair forever.
            try {
              return c.local()[id];
            } catch (_) {
              return null;
            }
          }
          '''
          if old_lookup not in text:
              raise SystemExit('sync_engine lookup block not found')
          text = text.replace(old_lookup, new_lookup, 1)
          old_snapshot = '''    if (snapshot == null) {
              return currentValue == null && currentStamp == null;
            }
          '''
          new_snapshot = '''    if (snapshot == null) {
              // A quarantined row can become visible after its parent/root is
              // repaired earlier in this same pass. Visibility is not a local edit;
              // a real Hive edit is journaled and therefore has a fresh stamp.
              return currentStamp == null;
            }
          '''
          if old_snapshot not in text:
              raise SystemExit('sync_engine snapshot block not found')
          text = text.replace(old_snapshot, new_snapshot, 1)
          engine.write_text(text)

          # 2) Do not arm an owner-only recovery lock on employee devices.
          recovery = Path('lib/core/sync/sync_recovery.dart')
          text = recovery.read_text()
          old = '''    if (SyncRecoveryGuard.active || SyncRecoveryGuard.migrationChecked) return;

            var hasMeaningfulData = false;
          '''
          new = '''    if (SyncRecoveryGuard.active || SyncRecoveryGuard.migrationChecked) return;

            final current = TeamService.current;
            if (current == null) return;
            if (!current.isOwner) {
              await SyncRecoveryGuard.markMigrationChecked();
              return;
            }

            var hasMeaningfulData = false;
          '''
          if old not in text:
              raise SystemExit('sync_recovery arm block not found')
          recovery.write_text(text.replace(old, new, 1))

          # 3) Manual sync UI: explicit device->server or server->device.
          screen = Path('lib/features/settings/sync_screen.dart')
          text = screen.read_text()
          anchor = "import '../../core/sync/sync_recovery_guard.dart';\n"
          if "sync_manual_direction.dart" not in text:
              if anchor not in text:
                  raise SystemExit('sync_screen import anchor not found')
              text = text.replace(
                  anchor,
                  "import '../../core/sync/sync_manual_direction.dart';\n" + anchor,
                  1,
              )

          replacement = r'''  Future<void> _manualUploadDevice() async {
            if (_busy || !_signedIn || TeamService.current?.isOwner != true) return;
            final confirmed = await showDialog<bool>(
              context: context,
              builder: (dialogContext) => AlertDialog(
                title: Text(_ru ? 'Отправить данные с устройства?' : 'Upload device data?'),
                content: Text(
                  _ru
                      ? 'Телефон станет источником истины для бизнес-данных. Перед отправкой WesiOS создаст резервную копию, затем отправит локальные записи на сервер без скачивания серверных данных и проверит их обратным чтением. После успешной проверки автоматическая синхронизация сможет продолжить работу.'
                      : 'This device becomes authoritative for business data. WesiOS creates a backup first, uploads local rows without downloading server data, then verifies them by reading them back. Automatic sync can resume after verification.',
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(dialogContext, false),
                    child: Text(_ru ? 'Отмена' : 'Cancel'),
                  ),
                  FilledButton(
                    onPressed: () => Navigator.pop(dialogContext, true),
                    child: Text(_ru ? 'Отправить с устройства' : 'Upload device'),
                  ),
                ],
              ),
            );
            if (confirmed != true || !mounted) return;
            setState(() => _busy = true);
            final report = await SyncManualDirection.uploadDeviceAuthoritative();
            if (!mounted) return;
            setState(() => _busy = false);
            _say(report.describe(russian: _ru), error: !report.ok);
          }

          Future<void> _manualDownloadServer() async {
            if (_busy || !_signedIn) return;
            final confirmed = await showDialog<bool>(
              context: context,
              builder: (dialogContext) => AlertDialog(
                title: Text(_ru ? 'Принять данные с сервера?' : 'Download server data?'),
                content: Text(
                  _ru
                      ? 'WesiOS сначала сохранит защитную локальную копию. Затем серверные записи будут применены на устройстве без отправки локальных данных на сервер. Совпадающие записи могут быть заменены серверной версией; локальные записи, которых на сервере нет, автоматически не удаляются.'
                      : 'WesiOS saves a local safety backup first. Server rows are then applied to this device without uploading local data. Matching rows may be replaced by the server version; local rows absent from the server are not automatically deleted.',
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(dialogContext, false),
                    child: Text(_ru ? 'Отмена' : 'Cancel'),
                  ),
                  FilledButton(
                    onPressed: () => Navigator.pop(dialogContext, true),
                    child: Text(_ru ? 'Принять с сервера' : 'Download server'),
                  ),
                ],
              ),
            );
            if (confirmed != true || !mounted) return;
            setState(() => _busy = true);
            final report = await SyncManualDirection.downloadServerAuthoritative();
            if (!mounted) return;
            setState(() => _busy = false);
            _say(report.describe(russian: _ru), error: !report.ok);
          }

          Future<void> _syncNow() async {
            if (_busy) return;
            if (!_signedIn) {
              _say(
                _ru
                    ? 'Сеанс WesiOS завершён. Войдите заново.'
                    : 'Your WesiOS session has ended. Sign in again.',
                error: true,
              );
              await _goToLogin();
              return;
            }

            final choice = await showDialog<String>(
              context: context,
              builder: (dialogContext) => AlertDialog(
                title: Text(_ru ? 'Ручная синхронизация' : 'Manual sync'),
                content: Text(
                  _ru
                      ? 'Выберите, какая сторона сейчас является источником данных.'
                      : 'Choose which side is the data source for this pass.',
                ),
                actions: [
                  TextButton(
                    onPressed: () => Navigator.pop(dialogContext),
                    child: Text(_ru ? 'Отмена' : 'Cancel'),
                  ),
                  OutlinedButton(
                    onPressed: () => Navigator.pop(dialogContext, 'download'),
                    child: Text(_ru ? 'Принять с сервера' : 'Download server'),
                  ),
                  if (TeamService.current?.isOwner == true)
                    FilledButton(
                      onPressed: () => Navigator.pop(dialogContext, 'upload'),
                      child: Text(_ru ? 'Отправить с устройства' : 'Upload device'),
                    ),
                ],
              ),
            );
            if (!mounted) return;
            if (choice == 'upload') {
              await _manualUploadDevice();
            } else if (choice == 'download') {
              await _manualDownloadServer();
            }
          }

          @override
          Widget build'''
          pattern = r"  Future<void> _syncNow\(\) async \{.*?\n  \}\n\n  @override\n  Widget build"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'sync_screen _syncNow replacement count={count}')

          old_button = '''                      _button(
                                label: _ru
                                    ? 'Синхронизировать сейчас'
                                    : 'Synchronise now',
                                onTap: (_busy || !signedIn || recoveryLocked)
                                    ? null
                                    : _syncNow,
                                filled: true,
                              ),
          '''
          new_button = '''                      _button(
                                label: _ru
                                    ? 'Ручная синхронизация'
                                    : 'Manual sync',
                                onTap: (_busy || !signedIn) ? null : _syncNow,
                                filled: true,
                              ),
          '''
          if old_button not in text:
              raise SystemExit('sync_screen button block not found')
          screen.write_text(text.replace(old_button, new_button, 1))
          PY

      - name: Format changed Dart
        run: |
          dart format \
            lib/core/sync/sync_engine.dart \
            lib/core/sync/sync_recovery.dart \
            lib/core/sync/sync_manual_direction.dart \
            lib/features/settings/sync_screen.dart \
            test/core/sync/organization_sync_hidden_cache_engine_test.dart

      - name: Dependencies
        run: flutter pub get

      - name: Focused sync and backup tests
        run: |
          flutter test \
            test/core/sync/organization_sync_legacy_root_test.dart \
            test/core/sync/organization_sync_recovery_test.dart \
            test/core/sync/organization_sync_server_compat_test.dart \
            test/core/sync/organization_sync_hidden_cache_engine_test.dart \
            test/core/sync/sync_recovery_test.dart \
            test/core/backup/local_backup_service_test.dart

      - name: Analyze changed implementation
        run: |
          flutter analyze --no-fatal-infos \
            lib/core/sync/sync_engine.dart \
            lib/core/sync/sync_recovery.dart \
            lib/core/sync/sync_manual_direction.dart \
            lib/core/backup/local_backup_service.dart \
            lib/features/settings/sync_screen.dart

      - name: Commit tested integration and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/implement-manual-direction-sync-once.yml
          git add \
            lib/core/sync/sync_engine.dart \
            lib/core/sync/sync_recovery.dart \
            lib/core/sync/sync_manual_direction.dart \
            lib/features/settings/sync_screen.dart \
            test/core/sync/organization_sync_hidden_cache_engine_test.dart
          git commit -m 'feat(sync): add explicit safe manual direction'
          git push origin HEAD:fix/safe-local-recovery-upload
