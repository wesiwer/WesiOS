name: Deploy WesiOS Sync Hooks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/pb_hooks/wesi_sync_context.pb.js'
      - 'server/pb_hooks/wesi_sync_read.pb.js'
      - 'server/pb_hooks/wesi_sync_write.pb.js'
      - 'server/pb_hooks/wesi_sync_extra.pb.js'
      - '.github/workflows/deploy-sync-hooks.yml'

permissions:
  contents: read

concurrency:
  group: wesios-sync-hooks-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: employee-portal
      url: https://api.wesi-inc.ru
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate sync hooks
        run: |
          set -euo pipefail
          for file in \
            server/pb_hooks/wesi_sync_context.pb.js \
            server/pb_hooks/wesi_sync_read.pb.js \
            server/pb_hooks/wesi_sync_write.pb.js \
            server/pb_hooks/wesi_sync_extra.pb.js; do
            test -s "$file"
            node --check "$file"
          done
          grep -q 'wesiSyncContext' server/pb_hooks/wesi_sync_context.pb.js
          grep -q '/api/wesi/sync/revision' server/pb_hooks/wesi_sync_read.pb.js
          grep -q '/api/wesi/sync/{collection}' server/pb_hooks/wesi_sync_read.pb.js
          grep -q '/api/wesi/sync/{collection}' server/pb_hooks/wesi_sync_write.pb.js
          grep -q '/api/wesi/sync/revision-v2' server/pb_hooks/wesi_sync_extra.pb.js
          grep -q '/api/wesi/sync/sandbox_transactions' server/pb_hooks/wesi_sync_extra.pb.js
          grep -q '/api/wesi/sync/audio_extras' server/pb_hooks/wesi_sync_extra.pb.js

      - name: Check server secrets
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${HOST:-}" ] || { echo '::error::Нет WESI_SERVER_HOST'; exit 1; }
          [ -n "${USER:-}" ] || { echo '::error::Нет WESI_SERVER_USER'; exit 1; }
          [ -n "${KEY:-}" ] || { echo '::error::Нет WESI_SERVER_SSH_KEY'; exit 1; }

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Install sync hooks atomically
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          CONFIGURED_HOOK_DIR: ${{ vars.WESI_PB_HOOK_DIR }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE="/tmp/wesi-sync-hooks-$GITHUB_RUN_ID"
          HOOK_DIR="${CONFIGURED_HOOK_DIR:-/opt/pocketbase/pb_hooks}"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            server/pb_hooks/wesi_sync_context.pb.js \
            server/pb_hooks/wesi_sync_read.pb.js \
            server/pb_hooks/wesi_sync_write.pb.js \
            server/pb_hooks/wesi_sync_extra.pb.js \
            "$USER@$HOST:$REMOTE/"
          $SSH "$USER@$HOST" "REMOTE='$REMOTE' HOOK_DIR='$HOOK_DIR' bash -s" <<'SH'
          set -euo pipefail
          files=(wesi_sync_context.pb.js wesi_sync_read.pb.js wesi_sync_write.pb.js wesi_sync_extra.pb.js)
          install_direct() {
            mkdir -p "$HOOK_DIR"
            for f in "${files[@]}"; do install -m 0644 "$REMOTE/$f" "$HOOK_DIR/$f"; done
          }
          if [ -d "$HOOK_DIR" ] && [ -w "$HOOK_DIR" ]; then
            install_direct
          elif [ ! -e "$HOOK_DIR" ] && [ -w "$(dirname "$HOOK_DIR")" ]; then
            install_direct
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n mkdir -p "$HOOK_DIR"
            for f in "${files[@]}"; do sudo -n install -m 0644 "$REMOTE/$f" "$HOOK_DIR/$f"; done
          else
            # Existing hook files are often writable even if the directory is not.
            for f in "${files[@]}"; do
              [ -f "$HOOK_DIR/$f" ] && [ -w "$HOOK_DIR/$f" ] || {
                echo "Нет прав обновить $HOOK_DIR/$f" >&2; exit 3;
              }
              cat "$REMOTE/$f" > "$HOOK_DIR/$f"
              chmod 0644 "$HOOK_DIR/$f"
            done
          fi
          for f in "${files[@]}"; do
            if cmp -s "$REMOTE/$f" "$HOOK_DIR/$f" 2>/dev/null; then
              echo "Подтверждён hook: $f"
            elif command -v sudo >/dev/null 2>&1 && sudo -n cmp -s "$REMOTE/$f" "$HOOK_DIR/$f"; then
              echo "Подтверждён hook: $f"
            else
              echo "Установленный hook не совпадает: $f" >&2; exit 4
            fi
          done
          rm -rf "$REMOTE"
          SH

      - name: Verify production sync routes
        run: |
          set -euo pipefail
          API='https://api.wesi-inc.ru'
          sleep 3
          for path in \
            /api/wesi/sync/revision \
            /api/wesi/sync/revision-v2 \
            /api/wesi/sync/sandbox_transactions \
            /api/wesi/sync/audio_extras; do
            code=$(curl -sS -o response.txt -w '%{http_code}' --max-time 20 "$API$path" || true)
            case "$code" in
              401|403) echo "Protected sync route loaded: $path ($code)" ;;
              *) echo "::error::$path returned HTTP $code"; cat response.txt; exit 1 ;;
            esac
          done
