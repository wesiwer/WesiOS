name: Validate Wesi AI Stage 7 runtime packs

on:
  push:
    branches:
      - agent/wesi-ai-stage7-runtime-packs

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage7-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-packs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage7-runtime-packs
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Apply Stage 7 integration patch
        run: python tool/wesi_ai_stage7_apply.py
      - name: Format Stage 6/7 runtime sources
        run: >-
          dart format
          lib/features/ai/runtime/wesi_local_runtime_models.dart
          lib/features/ai/runtime/wesi_local_runtime_policy.dart
          lib/features/ai/runtime/wesi_local_runtime_executor.dart
          lib/features/ai/runtime/wesi_runtime_pack_models.dart
          lib/features/ai/runtime/wesi_runtime_pack_catalog.dart
          lib/features/ai/runtime/wesi_environment_scanner.dart
          lib/features/ai/runtime/wesi_runtime_pack_manager.dart
          test/wesi_local_runtime_test.dart
          test/wesi_runtime_pack_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Stage 6 and 7 security tests
        run: flutter test test/wesi_local_runtime_test.dart test/wesi_runtime_pack_test.dart
      - name: Commit validated Stage 7 and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wesi-ai-stage7-focused.yml tool/wesi_ai_stage7_apply.py
          git add lib/features/ai/runtime test/wesi_local_runtime_test.dart test/wesi_runtime_pack_test.dart docs/WESI_AI_RUNTIME_PACKS.md
          git commit -m "feat(ai): add verified environment scanner and runtime packs"
          git push origin HEAD:agent/wesi-ai-stage7-runtime-packs
