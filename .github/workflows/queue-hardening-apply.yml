name: Apply Wesi AI Queue Hardening

on:
  push:
    branches:
      - chatgpt/wesi-ai-queue-hardening
    paths:
      - tool/queue_hardening_patch.py
      - .github/workflows/queue-hardening-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/wesi-ai-queue-hardening
          fetch-depth: 0

      - name: Apply exact queue hardening patch
        run: python3 tool/queue_hardening_patch.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/ai/wesi_ai_managed_controller.dart lib/features/ai/ai_assistant_v2_screen.dart test/wesi_ai_queue_hardening_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(ai): harden queued chat submission"
          git push origin HEAD:chatgpt/wesi-ai-queue-hardening
