name: Capture Latest Android Release Failure Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-latest-android-release-failure-temp.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture latest failed release Android logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'capture retry 4'
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-app.yml --limit 10 --json databaseId,status,conclusion,createdAt --jq '[.[] | select(.conclusion=="failure")][0].databaseId')
          [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] || { echo 'No failed release run found'; exit 1; }
          echo "RUN_ID=$RUN_ID"
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,jobs > /tmp/release.json
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log || true
          {
            echo '=== RELEASE JSON ==='
            cat /tmp/release.json
            echo
            echo '=== FAILED LOGS ==='
            cat /tmp/failed.log
          } > .github/latest-android-release-failure.txt
          git config user.name 'WesiOS Release Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git switch -C diag/latest-android-release-failure
          git add .github/latest-android-release-failure.txt
          git commit -m 'diag: capture latest Android release failure'
          git push --force origin HEAD:diag/latest-android-release-failure
