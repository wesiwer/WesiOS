name: Fix Sync Revision Fallback Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sync-revision-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch client fallback and regression test
        run: python3 .github/scripts/fix-sync-revision-fallback.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Validate revision fallback
        run: |
          set -euo pipefail
          dart format lib/core/sync/pocketbase_transport.dart test/sync_revision_fallback_test.dart
          flutter test test/sync_revision_fallback_test.dart
          flutter analyze lib/core/sync/pocketbase_transport.dart test/sync_revision_fallback_test.dart --no-fatal-infos
          git diff --check

      - name: Commit only after validation
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Sync Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/sync/pocketbase_transport.dart test/sync_revision_fallback_test.dart
          git diff --cached --check
          git commit -m 'fix(sync): keep legacy revision fallback live'
          git push origin HEAD:main
