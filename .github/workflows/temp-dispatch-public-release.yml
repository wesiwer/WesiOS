name: Temporary dispatch public WesiOS release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-dispatch-public-release.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch signed public release from Wesi AI feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref fix/wesi-ai-tool-agent-handoff \
            -f notes='Wesi AI: исправлены инструменты и Thinking UX, компактные таблицы и код, перенос настроек в sidebar, answer-ready UX и multi-Gemini failover.' \
            -f deploy_to_server=true
          echo 'Release workflow dispatched for fix/wesi-ai-tool-agent-handoff.'
