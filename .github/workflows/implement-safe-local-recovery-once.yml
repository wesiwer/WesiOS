name: Implement Safe Local Recovery Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/implement-safe-local-recovery-once.yml'
      - 'lib/core/sync/sync_recovery.dart'
      - 'lib/core/sync/sync_recovery_guard.dart'
      - 'test/core/sync/sync_recovery_test.dart'

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch startup, engine, auto sync and UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Fix a static diagnostic helper: static members do not override Object.toString.
          replace_once(
              'lib/core/sync/sync_recovery_guard.dart',
              "\n  @override\n  static String toString() =>\n      'SyncRecoveryGuard(active=$active, status=$lastStatus, run=$lastRunId)';\n",
              "\n  static String describe() =>\n      'SyncRecoveryGuard(active=$active, status=$lastStatus, run=$lastRunId)';\n",
          )

          # Arm the mobile migration lock before any automatic pull can start.
          replace_once(
              'lib/main.dart',
              "import 'core/sync/sync_feature_extensions.dart';\n",
              "import 'core/sync/sync_feature_extensions.dart';\nimport 'core/sync/sync_recovery.dart';\n",
          )
          replace_once(
              'lib/main.dart',
              "  SyncAuditExtensions.install();\n  SyncBusinessExtensions.install();\n\n  if (TeamService.current != null && SyncEndpoint.isConnected) {\n",
              "  SyncAuditExtensions.install();\n  SyncBusinessExtensions.install();\n\n  // Existing mobile installations may contain business records created while\n  // cloud sync was unhealthy. Lock normal pull BEFORE it can touch those rows.\n  if (!kIsWeb && (Platform.isAndroid || Platform.isIOS)) {\n    await SyncRecovery.armMigrationIfNeeded();\n  }\n\n  if (TeamService.current != null && SyncEndpoint.isConnected) {\n",
          )

          # Defense in depth: a direct SyncEngine.run() cannot bypass recovery lock.
          replace_once(
              'lib/core/sync/sync_engine.dart',
              "import 'sync_merge.dart';\n",
              "import 'sync_merge.dart';\nimport 'sync_recovery_guard.dart';\n",
          )
          replace_once(
              'lib/core/sync/sync_engine.dart',
              "  static Future<void> runOnLaunch() async {\n    if (!SyncEndpoint.enabled) {\n",
              "  static Future<void> runOnLaunch() async {\n    if (SyncRecoveryGuard.active) {\n      await prepare();\n      return;\n    }\n    if (!SyncEndpoint.enabled) {\n",
          )
          replace_once(
              'lib/core/sync/sync_engine.dart',
              "  }) async {\n    final at = now ?? SyncClock.now();\n\n    if (busy.value) {\n",
              "  }) async {\n    final at = now ?? SyncClock.now();\n\n    if (SyncRecoveryGuard.active) {\n      return _finish(SyncReport(\n        at: at,\n        failure: const SyncFailure(\n          'RECOVERY_LOCKED',\n          'Обычная синхронизация заблокирована до проверки локальной копии на сервере',\n        ),\n      ));\n    }\n\n    if (busy.value) {\n",
          )

          # Auto/manual entry points also fail closed with a clear reason.
          replace_once(
              'lib/core/sync/sync_auto.dart',
              "import 'sync_journal.dart';\n",
              "import 'sync_journal.dart';\nimport 'sync_recovery_guard.dart';\n",
          )
          replace_once(
              'lib/core/sync/sync_auto.dart',
              "  static void start() {\n    if (_listening) return;\n",
              "  static void start() {\n    if (SyncRecoveryGuard.active) {\n      stop(force: true);\n      return;\n    }\n    if (_listening) return;\n",
          )
          replace_once(
              'lib/core/sync/sync_auto.dart',
              "  static Future<SyncReport> now() async {\n    _localTimer?.cancel();\n\n    if (!SyncEndpoint.isConnected) {\n",
              "  static Future<SyncReport> now() async {\n    _localTimer?.cancel();\n\n    if (SyncRecoveryGuard.active) {\n      return SyncReport(\n        at: DateTime.now(),\n        failure: const SyncFailure(\n          'RECOVERY_LOCKED',\n          'Сначала завершите безопасный перенос локальных данных',\n        ),\n      );\n    }\n\n    if (!SyncEndpoint.isConnected) {\n",
          )

          # Recovery controls in the existing sync screen.
          replace_once(
              'lib/features/settings/sync_screen.dart',
              "import '../../core/sync/sync_endpoint.dart';\n",
              "import '../../core/sync/sync_endpoint.dart';\nimport '../../core/sync/sync_recovery.dart';\nimport '../../core/sync/sync_recovery_guard.dart';\n",
          )
          replace_once(
              'lib/features/settings/sync_screen.dart',
              "  Future<void> _syncNow() async {\n",
              r'''  Future<void> _runRecovery() async {
    if (_busy || !_signedIn) return;
    final confirmed = await showDialog<bool>(
      context: context,
      builder: (dialogContext) => AlertDialog(
        title: Text(_ru ? 'Безопасный перенос' : 'Protected local upload'),
        content: Text(
          _ru
              ? 'Сначала будет создана отдельная локальная резервная копия. Затем данные этого устройства отправятся на сервер без скачивания серверных записей и без удаления локальных данных. Обычная синхронизация останется заблокированной до полной проверки.'
              : 'A separate local backup will be created first. This device will then upload its business data without pulling server rows or deleting local data. Normal sync stays locked until verification completes.',
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(dialogContext, false),
            child: Text(_ru ? 'Отмена' : 'Cancel'),
          ),
          FilledButton(
            onPressed: () => Navigator.pop(dialogContext, true),
            child: Text(_ru ? 'Создать копию и перенести' : 'Back up and upload'),
          ),
        ],
      ),
    );
    if (confirmed != true || !mounted) return;

    setState(() => _busy = true);
    final report = await SyncRecovery.run();
    if (!mounted) return;
    setState(() => _busy = false);
    _say(report.describe(russian: _ru), error: !report.ok);
  }

  Future<void> _releaseRecoveryLock() async {
    if (_busy || !SyncRecovery.verified) return;
    final confirmed = await showDialog<bool>(
      context: context,
      builder: (dialogContext) => AlertDialog(
        title: Text(_ru ? 'Серверная копия проверена' : 'Server copy verified'),
        content: Text(
          _ru
              ? 'Все локальные записи из защитного снимка совпали с сервером. Снять блокировку обычной синхронизации? Автосинхронизация останется выключенной, пока вы сами её не включите.'
              : 'Every local row in the protected snapshot matches the server. Release the normal-sync lock? Automatic sync will remain off until you enable it yourself.',
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(dialogContext, false),
            child: Text(_ru ? 'Оставить защиту' : 'Keep locked'),
          ),
          FilledButton(
            onPressed: () => Navigator.pop(dialogContext, true),
            child: Text(_ru ? 'Снять блокировку' : 'Release lock'),
          ),
        ],
      ),
    );
    if (confirmed != true || !mounted) return;
    setState(() => _busy = true);
    await SyncRecovery.releaseVerifiedSafetyLock();
    if (!mounted) return;
    setState(() => _busy = false);
    _say(
      _ru
          ? 'Защитная блокировка снята. Автоматическая синхронизация всё ещё выключена.'
          : 'Recovery lock released. Automatic sync is still disabled.',
    );
  }

  Future<void> _syncNow() async {
''',
          )
          replace_once(
              'lib/features/settings/sync_screen.dart',
              "                        onTap: (_busy || !signedIn) ? null : _syncNow,\n                        filled: true,\n                      ),\n",
              r'''                        onTap: (_busy || !signedIn || SyncRecoveryGuard.active)
                            ? null
                            : _syncNow,
                        filled: true,
                      ),
                      if (signedIn && TeamService.current?.isOwner == true) ...[
                        const SizedBox(height: 10),
                        _button(
                          label: SyncRecoveryGuard.active
                              ? (SyncRecovery.verified
                                    ? (_ru
                                          ? 'Серверная копия проверена — снять защиту'
                                          : 'Server copy verified — release lock')
                                    : (_ru
                                          ? 'Безопасно перенести данные с телефона'
                                          : 'Safely upload this device'))
                              : (_ru
                                    ? 'Создать защитную копию на сервере'
                                    : 'Create protected server copy'),
                          onTap: _busy
                              ? null
                              : (SyncRecoveryGuard.active && SyncRecovery.verified
                                    ? _releaseRecoveryLock
                                    : _runRecovery),
                        ),
                      ],
                      if (SyncRecoveryGuard.active) ...[
                        const SizedBox(height: 10),
                        Text(
                          SyncRecovery.verified
                              ? (_ru
                                    ? 'Защитный режим: серверная копия уже проверена. Обычный pull всё ещё заблокирован.'
                                    : 'Recovery mode: the server copy is verified. Normal pull is still locked.')
                              : (_ru
                                    ? 'Защитный режим: обычная синхронизация отключена, локальные бизнес-данные не будут заменены серверными.'
                                    : 'Recovery mode: normal sync is disabled and local business data cannot be replaced by server rows.'),
                          style: TextStyle(
                            fontSize: 11.5,
                            height: 1.4,
                            color: AppTheme.accent,
                          ),
                        ),
                      ],
''',
          )
          replace_once(
              'lib/features/settings/sync_screen.dart',
              "            onChanged: signedIn\n                ? (value) async {\n",
              "            onChanged: signedIn && !SyncRecoveryGuard.active\n                ? (value) async {\n",
          )

          # Recovery build version.
          replace_once(
              'pubspec.yaml',
              'version: 0.22.33+108\n',
              'version: 0.22.34+109\n',
          )
          PY

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format recovery changes
        run: dart format lib/core/sync/sync_recovery.dart lib/core/sync/sync_recovery_guard.dart lib/core/sync/sync_engine.dart lib/core/sync/sync_auto.dart lib/features/settings/sync_screen.dart lib/main.dart test/core/sync/sync_recovery_test.dart

      - name: Run recovery regression tests
        run: |
          flutter test test/core/sync/sync_recovery_test.dart
          flutter test test/core/sync/organization_sync_legacy_root_test.dart
          flutter test test/core/sync/organization_sync_recovery_test.dart
          flutter test test/core/sync/organization_sync_server_compat_test.dart

      - name: Analyze touched Dart files
        run: flutter analyze lib/core/sync/sync_recovery.dart lib/core/sync/sync_recovery_guard.dart lib/core/sync/sync_engine.dart lib/core/sync/sync_auto.dart lib/features/settings/sync_screen.dart lib/main.dart test/core/sync/sync_recovery_test.dart

      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/main.dart lib/core/sync/sync_recovery.dart lib/core/sync/sync_recovery_guard.dart lib/core/sync/sync_engine.dart lib/core/sync/sync_auto.dart lib/features/settings/sync_screen.dart test/core/sync/sync_recovery_test.dart pubspec.yaml pubspec.lock
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit'
            exit 0
          fi
          git commit -m 'feat(sync): protect and upload local business data safely'
          git push origin HEAD:${{ github.head_ref }}
