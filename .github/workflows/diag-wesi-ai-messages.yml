name: Diagnose live Wesi AI message path

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-wesi-ai-messages.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RELAY_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      RELAY_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - name: Prepare SSH
        env:
          RELAY_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$RELAY_KEY" > ~/.ssh/relay_key
          printf '%s\n' "$MAIN_KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/relay_key ~/.ssh/main_key
          ssh-keyscan -H "$RELAY_HOST" > ~/.ssh/relay_known 2>/dev/null
          ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known 2>/dev/null

      - name: Test live Relay tiers locally
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/relay_key -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/relay_known "$RELAY_USER@$RELAY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          curl -fsS http://127.0.0.1:8787/health > /tmp/wesi-health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/wesi-health.json'))
          print('relay_health', d.get('ok'), d.get('ready'), d.get('routing'))
          PY
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          secret="$("${SUDO[@]}" awk -F= '$1=="WESI_MAIN_SHARED_SECRET"{sub(/^[^=]*=/,"");print;exit}' /etc/wesi-ai-relay.env)"
          [ ${#secret} -ge 32 ] || { echo 'relay shared secret missing'; exit 2; }
          export WESI_SHARED="$secret"
          python3 - <<'PY'
          import hashlib,hmac,json,os,time,urllib.request,urllib.error
          secret=os.environ['WESI_SHARED'].encode()
          for route in ('wesi/fast','wesi/pro','wesi/ultra'):
              rid='wai_diag_'+route.split('/')[-1]+'_'+str(time.time_ns())
              payload={'requestId':rid,'route':route,'operation':'chat','input':{'system':'Diagnostic. Reply only OK.','history':[],'message':'OK'}}
              raw=json.dumps(payload,separators=(',',':'),ensure_ascii=False).encode(); ts=str(int(time.time()))
              sig=hmac.new(secret,rid.encode()+b'.'+ts.encode()+b'.'+raw,hashlib.sha256).hexdigest()
              req=urllib.request.Request('http://127.0.0.1:8787/v1/wesi-ai',data=raw,method='POST',headers={'Content-Type':'application/json','X-Wesi-Request-Id':rid,'X-Wesi-Timestamp':ts,'X-Wesi-Signature':sig})
              try:
                  with urllib.request.urlopen(req,timeout=45) as r:
                      d=json.loads(r.read())
                      print(route,'HTTP',r.status,'ok=',d.get('ok'),'provider=',d.get('provider'),'model=',d.get('model'),'answer=',str(d.get('answer',''))[:24])
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')[:500]
                  print(route,'HTTP',e.code,'ERROR',body)
              except Exception as e:
                  print(route,'EXCEPTION',type(e).__name__,str(e)[:300])
          PY
          unset WESI_SHARED secret
          REMOTE

      - name: Inspect Main message path
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/main_key -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/main_known "$MAIN_USER@$MAIN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== services ==='
          systemctl is-active pocketbase 2>/dev/null || true
          systemctl is-active wesi-ai-stream 2>/dev/null || true
          echo '=== stream port ==='
          ss -ltn 2>/dev/null | grep ':8792 ' || echo '8792-not-listening'
          echo '=== hook hashes ==='
          for f in wesi_ai_routes.pb.js wesi_ai_stream.pb.js wesi_ai_tools.js wesi_ai_lib.js; do
            p="/opt/wesi/pb_hooks/$f"
            [ -f "$p" ] || p="/root/wesi/pb_hooks/$f"
            if [ -f "$p" ]; then sha256sum "$p" | awk '{print $1, "'$f'"}'; else echo "missing $f"; fi
          done
          echo '=== recent Wesi AI errors ==='
          journalctl -u pocketbase --since '45 minutes ago' --no-pager 2>/dev/null | grep -E 'WAI_|wesi.ai|relay|stream|429|503|502' | tail -n 120 || true
          REMOTE
