name: Fix Sync Profile Scope Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sync-profile-scope-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch profile scope and contract test
        run: python3 .github/scripts/fix-sync-profile-scope.py

      - name: Validate sync server contracts
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_sync_read.pb.js
          node --check server/pb_hooks/wesi_sync_write.pb.js
          node --test server/pb_hooks/wesi_sync_profile_scope_contract_test.mjs server/pb_hooks/wesi_sync_extra_contract_test.mjs
          git diff --check

      - name: Commit only after validation
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Sync Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add server/pb_hooks/wesi_sync_read.pb.js server/pb_hooks/wesi_sync_write.pb.js server/pb_hooks/wesi_sync_profile_scope_contract_test.mjs
          git diff --cached --check
          git commit -m 'fix(sync): keep profile in private account scope'
          git push origin HEAD:main
