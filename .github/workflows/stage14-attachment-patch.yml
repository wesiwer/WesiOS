name: Stage14 Attachment Integration Patch

on:
  push:
    branches: [agent/wesi-ai-stage14-media-attachment-staging]
    paths:
      - '.github/workflows/stage14-attachment-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply structural patch
        run: python3 .github/scripts/stage14_attachment_patch.py
      - name: Validate server files
        run: |
          node --check server/pb_hooks/wesi_ai_capability_registry.js
          node --check server/pb_hooks/wesi_ai_media_tools.js
          git diff --check
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and analyze integration
        run: |
          dart format lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart
          flutter analyze lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart lib/features/ai/media_engines test/features/ai/media_engines --no-fatal-infos
      - name: Test Stage14 media layer
        run: flutter test test/features/ai/media_engines
      - name: Commit verified product patch
        run: |
          git config user.name 'wesi-ai-stage14-bot'
          git config user.email 'wesi-ai-stage14-bot@users.noreply.github.com'
          git add server/pb_hooks/wesi_ai_capability_registry.js lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart
          git diff --cached --check
          git commit -m 'feat(ai): bind current-turn attachments to Stage14 media'
          git push origin HEAD:agent/wesi-ai-stage14-media-attachment-staging
