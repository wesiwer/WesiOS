name: Temporary hotfix Wesi AI calendar tool

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-hotfix-wesi-ai-calendar-tool.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 1
      - name: Validate audited hook
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_ai_calendar_write_tools.js
          grep -q 'Validate all user-controlled fields before generating ids' server/pb_hooks/wesi_ai_calendar_write_tools.js
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}"
          test -n "${MAIN_USER:-}"
          test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_main
          chmod 600 ~/.ssh/id_main
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Hot deploy calendar adapter with rollback copy
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/id_main" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          REMOTE=/tmp/wesi-ai-calendar-${GITHUB_RUN_ID}.js
          TARGET=/opt/pocketbase/pb_hooks/wesi_ai_calendar_write_tools.js
          scp "${SSH[@]}" server/pb_hooks/wesi_ai_calendar_write_tools.js "$MAIN_USER@$MAIN_HOST:$REMOTE"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "REMOTE='$REMOTE' TARGET='$TARGET' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          test -s "$REMOTE"
          test -w "$TARGET"
          BACKUP="${TARGET}.bak-tool-audit-$(date +%Y%m%d%H%M%S)"
          cp "$TARGET" "$BACKUP"
          cat "$REMOTE" > "$TARGET"
          chmod 0644 "$TARGET"
          cmp -s "$REMOTE" "$TARGET"
          grep -q 'Validate all user-controlled fields before generating ids' "$TARGET"
          rm -f "$REMOTE"
          echo "LIVE_CALENDAR_HOOK_SHA256=$(sha256sum "$TARGET" | awk '{print $1}')"
          echo "BACKUP=$BACKUP"
          REMOTE_SCRIPT
      - name: Verify Main remains healthy
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/id_main" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null"
          code=$(curl -sS -o /tmp/cap.out -w '%{http_code}' --max-time 15 https://api.wesi-inc.ru/api/wesi/ai/capabilities || true)
          test "$code" = "401" -o "$code" = "403"
          echo "MAIN_HEALTH_PASS protected_capabilities_http=$code"
