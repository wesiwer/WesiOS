name: Wesi AI Multi Provider One Shot

on:
  push:
    branches:
      - agent/wesi-ai-multi-provider-orchestration

permissions:
  contents: write

concurrency:
  group: wesi-ai-multi-provider-once
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-multi-provider-orchestration
          fetch-depth: 0

      - name: Apply product patch
        run: |
          set -euo pipefail
          python3 .github/scripts/wesi_ai_multi_provider_patch.py

      - name: Validate Relay JavaScript and shell
        run: |
          set -euo pipefail
          for file in server/wesi-ai-relay/*.mjs; do node --check "$file"; done
          for file in server/wesi-ai-relay/*.sh; do bash -n "$file"; done

      - name: Run complete Relay regression suite
        run: |
          set -euo pipefail
          node --test server/wesi-ai-relay/*.test.mjs

      - name: Validate deployment workflow contracts in runner
        run: |
          set -euo pipefail
          grep -q 'GROQ_API_KEY_B64' .github/workflows/deploy-wesi-ai.yml
          grep -q 'MISTRAL_API_KEY_B64' .github/workflows/deploy-wesi-ai.yml
          grep -q 'OPENROUTER_API_KEY_B64' .github/workflows/deploy-wesi-ai.yml
          grep -q 'GROQ_API_KEY_B64' .github/workflows/deploy-wesi-ai-streaming.yml
          grep -q 'listen 443 ssl http2;' server/wesi-ai-relay/nginx-relay.conf
          ! grep -q '^[[:space:]]*http2 on;' server/wesi-ai-relay/nginx-relay.conf

      - name: Commit validated Relay product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/wesi-ai-relay
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ai): add multi-provider ensemble orchestration'
            git push origin HEAD:agent/wesi-ai-multi-provider-orchestration
          fi
