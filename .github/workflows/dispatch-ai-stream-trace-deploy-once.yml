name: Dispatch Safe Wesi AI Tool Trace Deploy Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-ai-stream-trace-deploy-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical streaming deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-wesi-ai-streaming.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f public_host=wesi-ai-178-236-247-194.nip.io
