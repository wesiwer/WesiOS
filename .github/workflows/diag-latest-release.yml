name: Diagnose latest WesiOS release failure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/release-diag-trigger.txt

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture latest failed release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Build signed WesiOS release" --status failure --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID" || { echo "No failed release run found"; exit 1; }
          {
            echo "RUN_ID=$RUN_ID"
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json name,status,conclusion,event,headSha,createdAt,updatedAt,url,jobs
            echo
            echo "===== FAILED LOGS ====="
            gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
          } > tools/latest_release_failure.txt 2>&1
      - name: Commit diagnostic snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/latest_release_failure.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture latest release failure'
          git push
