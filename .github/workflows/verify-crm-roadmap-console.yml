name: Verify CRM Roadmap Console builds

on:
  pull_request:
    branches: [main]

permissions:
  actions: write
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug

  windows:
    # Проект генерирует CMake под Visual Studio 2019/2022. Новый
    # windows-latest уже перешёл на образ VS2026 и не содержит ожидаемый
    # генератор, поэтому используем стабильный совместимый образ.
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release

  employee-activation-repair:
    if: github.head_ref == 'ci/fix-employee-activation-01916'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Repair activation, deploy auth fix, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fix_employee_activation_01916_v2.sh