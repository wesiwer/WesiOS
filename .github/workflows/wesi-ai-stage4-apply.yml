name: Validate Wesi AI Stage 4 backup and D2D

on:
  push:
    branches:
      - agent/wesi-ai-stage4-backup-d2d

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[stage4-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 4 integration
        run: python tool/wesi_ai_stage4_remaining.py
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Format Stage 4 Dart
        run: |
          dart format \
            lib/features/ai/backup \
            lib/features/ai/models/wesi_ai_chat_models.dart \
            lib/features/ai/storage/wesi_ai_local_store.dart \
            lib/features/ai/controllers/wesi_ai_chat_controller.dart \
            lib/features/ai/ai_assistant_v2_screen.dart \
            test/wesi_ai_backup_d2d_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test Stage 4 and regressions
        run: flutter test test/wesi_ai_backup_d2d_test.dart test/wesi_ai_memory_engine_test.dart test/wesi_ai_memory_controls_test.dart test/wesi_ai_queue_hardening_test.dart test/wesi_ai_turn_intent_test.dart
      - name: Commit validated Stage 4 integration
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage4-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/ai test/wesi_ai_backup_d2d_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(ai): integrate important backup and encrypted D2D [stage4-applied]'
          for attempt in 1 2 3; do
            git fetch origin agent/wesi-ai-stage4-backup-d2d
            if git rebase origin/agent/wesi-ai-stage4-backup-d2d; then
              if git push origin HEAD:agent/wesi-ai-stage4-backup-d2d; then
                exit 0
              fi
            else
              git rebase --abort || true
              exit 1
            fi
            sleep 2
          done
          exit 1
