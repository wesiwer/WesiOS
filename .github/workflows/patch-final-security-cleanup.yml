name: Patch final security cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-final-security-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/security-2fa-sessions-real-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Remove stale warning and lock verified owner email
        shell: python
        run: |
          from pathlib import Path
          import re

          profile = Path('lib/features/profile/profile_screen.dart')
          text = profile.read_text(encoding='utf-8')
          needle = '  bool _vaultUnlocked = false;'
          if needle not in text:
              raise SystemExit('profile warning anchor missing')
          profile.write_text(text.replace(
              needle,
              '  // Legacy Firebase vault helpers are retained for migration only.\n'
              '  // ignore: unused_field\n'
              '  bool _vaultUnlocked = false;',
              1,
          ), encoding='utf-8')

          card = Path('lib/features/profile/widgets/credentials_card.dart')
          text = card.read_text(encoding='utf-8')
          text = text.replace(
              "'Почта обязательна: на неё будет приходить шестизначный код при новом входе.'",
              "'Почта для кодов уже подтверждена и защищена. Здесь можно изменить логин или пароль.'",
              1,
          ).replace(
              "'Email is required for six-digit sign-in codes.'",
              "'The security email is verified and locked. You can change login or password here.'",
              1,
          )

          pattern = re.compile(
              r"(_dialogField\(\s*controller:\s*email,\s*)"
              r"label:\s*_ru\s*\?\s*'Почта для кодов'\s*:\s*'Security email',"
              r"(\s*hint:\s*'name@example\.com',\s*keyboard:\s*TextInputType\.emailAddress,\s*)\)",
              re.S,
          )
          text, count = pattern.subn(
              r"\1label: _ru ? 'Подтверждённая почта для кодов' : 'Verified security email',"
              r"\2enabled: false,\n                  )",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('security email regex did not match exactly once')

          text, count = re.subn(
              r"(Widget _dialogField\(\{[\s\S]*?TextInputType\? keyboard,\s*)(\}\) =>)",
              r"\1bool enabled = true,\n  \2",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('dialog signature regex did not match')

          text, count = re.subn(
              r"(TextField\(\s*controller:\s*controller,\s*)(obscureText:\s*obscure,)",
              r"\1enabled: enabled,\n            \2",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('dialog TextField regex did not match')

          text = text.replace(
              "? 'Изменить логин, почту или пароль' : 'Change login, email or password'",
              "? 'Изменить логин или пароль' : 'Change login or password'",
              1,
          )
          card.write_text(text, encoding='utf-8')

      - name: Commit cleanup
        run: |
          set -euo pipefail
          dart format lib/features/profile/profile_screen.dart lib/features/profile/widgets/credentials_card.dart || true
          git diff --check
          test -n "$(git status --porcelain lib/features/profile/profile_screen.dart lib/features/profile/widgets/credentials_card.dart)"
          git config user.name 'WesiOS Security CI'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/profile/profile_screen.dart lib/features/profile/widgets/credentials_card.dart
          git commit -m 'security: lock verified owner email and clean legacy warning'
          git push origin HEAD:${{ github.head_ref }}
