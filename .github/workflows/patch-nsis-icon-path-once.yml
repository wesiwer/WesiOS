name: Patch NSIS icon path once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-nsis-icon-path-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Pass absolute icon path to NSIS
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/repair-android-signature.yml')
          text = p.read_text(encoding='utf-8')
          old = '''          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\\NSIS\\makensis.exe" }
          & $makensis "/DVERSION=${{ needs.metadata.outputs.version }}" "/DBUILD_DIR=$source" "/DOUTPUT_FILE=$out" "windows/installer/wesios.nsi"
'''
          new = '''          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\\NSIS\\makensis.exe" }
          $icon = (Resolve-Path "windows/runner/resources/app_icon.ico").Path
          if (-not (Test-Path $icon)) { throw "Windows installer icon missing" }
          & $makensis "/DVERSION=${{ needs.metadata.outputs.version }}" "/DBUILD_DIR=$source" "/DOUTPUT_FILE=$out" "/DICON_FILE=$icon" "windows/installer/wesios.nsi"
'''
          if old not in text:
              raise SystemExit('NSIS workflow anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove one-off patch
        run: |
          set -euo pipefail
          grep -q 'DICON_FILE' .github/workflows/repair-android-signature.yml
          grep -q 'ICON_FILE define is required' windows/installer/wesios.nsi
          rm -f .github/workflows/patch-nsis-icon-path-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ci): pass absolute icon path to NSIS installer'
          git push origin HEAD:main
