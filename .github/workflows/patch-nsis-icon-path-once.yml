name: Patch NSIS icon path once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-nsis-icon-path-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Pass absolute icon path to NSIS
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('.github/workflows/repair-android-signature.yml')
          text = p.read_text(encoding='utf-8')
          if '"/DICON_FILE=$icon"' not in text:
              pattern = re.compile(
                  r'(?m)^(\s*)& \$makensis (.*) "windows/installer/wesios\.nsi"\s*$'
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit('makensis invocation not found')
              indent = match.group(1)
              args = match.group(2)
              replacement = (
                  indent + '$icon = (Resolve-Path "windows/runner/resources/app_icon.ico").Path\n' +
                  indent + 'if (-not (Test-Path $icon)) { throw "Windows installer icon missing" }\n' +
                  indent + '& $makensis ' + args + ' "/DICON_FILE=$icon" "windows/installer/wesios.nsi"'
              )
              text = text[:match.start()] + replacement + text[match.end():]
          p.write_text(text, encoding='utf-8')
      - name: Commit and remove one-off patch
        run: |
          set -euo pipefail
          grep -q 'DICON_FILE' .github/workflows/repair-android-signature.yml
          grep -q 'ICON_FILE define is required' windows/installer/wesios.nsi
          rm -f .github/workflows/patch-nsis-icon-path-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ci): pass absolute icon path to NSIS installer'
          git push origin HEAD:main
