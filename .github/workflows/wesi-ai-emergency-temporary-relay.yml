name: Wesi AI Emergency Minimum Working AI

on:
  push:
    branches:
      - ops/wesi-ai-temporary-relay-nip
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: wesi-ai-emergency-minimum-ai
  cancel-in-progress: true

jobs:
  minimum-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELAY_SSH_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve temporary Relay hostname
        id: host
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${RELAY_SSH_HOST:-}" ] || { echo '::error::Missing WESI_RELAY_SSH_HOST'; exit 1; }
          if [[ "$RELAY_SSH_HOST" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            IP="$RELAY_SSH_HOST"
          else
            IP="$(getent ahostsv4 "$RELAY_SSH_HOST" | awk 'NR==1 {print $1}')"
          fi
          [ -n "${IP:-}" ] || { echo '::error::Could not resolve Relay IPv4'; exit 1; }
          python3 - "$IP" <<'PY'
          import ipaddress,sys
          ip=ipaddress.ip_address(sys.argv[1])
          if ip.version != 4 or not ip.is_global:
              raise SystemExit('Relay must resolve to a public IPv4')
          PY
          HOST="wesi-ai-${IP//./-}.nip.io"
          RESOLVED="$(getent ahostsv4 "$HOST" | awk 'NR==1 {print $1}' || true)"
          [ "$RESOLVED" = "$IP" ] || { echo '::error::Temporary hostname does not resolve to Relay'; exit 1; }
          echo "public_host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Temporary Relay: https://$HOST" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify temporary Relay HTTPS is ready
        shell: bash
        env:
          PUBLIC_HOST: ${{ steps.host.outputs.public_host }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "https://$PUBLIC_HOST/health" > /tmp/relay-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/relay-health.json',encoding='utf-8'))
          assert data.get('ok') is True, data
          assert data.get('ready') is True, data
          assert data.get('routing') == ['fast','pro','ultra'], data
          print('Temporary Relay HTTPS is ready')
          PY

      - name: Live signed Relay to Gemini smoke test
        shell: bash
        env:
          PUBLIC_HOST: ${{ steps.host.outputs.public_host }}
          SHARED: ${{ secrets.WESI_MAIN_SHARED_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${SHARED:-}" ] || { echo '::error::WESI_MAIN_SHARED_SECRET is required for live smoke'; exit 1; }
          [ "${#SHARED}" -ge 32 ] || { echo '::error::WESI_MAIN_SHARED_SECRET is too short'; exit 1; }
          echo "::add-mask::$SHARED"
          node <<'NODE' > /tmp/relay-smoke-env
          const crypto = require('crypto');
          const id = `wai_emergency_${process.env.GITHUB_RUN_ID}_${Date.now()}`;
          const timestamp = String(Math.floor(Date.now()/1000));
          const body = JSON.stringify({
            requestId: id,
            operation: 'chat',
            route: 'wesi/fast',
            input: {
              system: 'Return a short plain-text answer. This is a Wesi AI infrastructure smoke test.',
              history: [],
              message: 'Reply with exactly WESI_OK'
            }
          });
          const signature = crypto.createHmac('sha256', process.env.SHARED)
            .update(`${id}.${timestamp}.${body}`).digest('hex');
          const b64 = Buffer.from(body).toString('base64');
          console.log(`REQUEST_ID=${id}`);
          console.log(`TIMESTAMP=${timestamp}`);
          console.log(`SIGNATURE=${signature}`);
          console.log(`BODY_B64=${b64}`);
          NODE
          source /tmp/relay-smoke-env
          printf '%s' "$BODY_B64" | base64 -d > /tmp/relay-smoke.json
          CODE="$(curl -sS -o /tmp/relay-smoke-out.json -w '%{http_code}' --max-time 90 \
            -X POST "https://$PUBLIC_HOST/v1/wesi-ai" \
            -H 'Content-Type: application/json' \
            -H "X-Wesi-Timestamp: $TIMESTAMP" \
            -H "X-Wesi-Request-Id: $REQUEST_ID" \
            -H "X-Wesi-Signature: $SIGNATURE" \
            --data-binary @/tmp/relay-smoke.json)"
          [ "$CODE" = 200 ] || { echo "::error::Relay Gemini smoke returned HTTP $CODE"; cat /tmp/relay-smoke-out.json; exit 1; }
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/relay-smoke-out.json',encoding='utf-8'))
          assert data.get('ok') is True, data
          answer=str(data.get('answer','')).strip()
          assert answer, data
          print('LIVE_RELAY_GEMINI_OK')
          PY
          echo 'Live Relay → Gemini text roundtrip: OK' >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch Main router switch to temporary Relay
        id: dispatch
        shell: bash
        env:
          PUBLIC_HOST: ${{ steps.host.outputs.public_host }}
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          PAYLOAD="$(python3 - "$PUBLIC_HOST" <<'PY'
          import json,sys
          print(json.dumps({'ref':'main','inputs':{'public_host':sys.argv[1]}}))
          PY
          )"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/configure-wesi-ai-router.yml/dispatches" \
            -d "$PAYLOAD"
          echo 'Main router configuration dispatched.'

      - name: Wait for Main router configuration
        shell: bash
        env:
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
          PUBLIC_HOST: ${{ steps.host.outputs.public_host }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/configure-wesi-ai-router.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              | python3 -c 'import json,sys,os; d=json.load(sys.stdin); s=os.environ["STARTED_AT"]; print(next((str(r["id"]) for r in d.get("workflow_runs",[]) if r.get("created_at","") >= s), ""))')"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          [ -n "$RUN_ID" ] || { echo '::error::Could not locate router configuration run'; exit 1; }
          echo "Router run: $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          for _ in $(seq 1 100); do
            JSON="$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            read -r STATUS CONCLUSION < <(printf '%s' "$JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status", ""), d.get("conclusion") or "")')
            if [ "$STATUS" = completed ]; then
              [ "$CONCLUSION" = success ] || { echo "::error::Router configuration failed: $CONCLUSION"; exit 1; }
              break
            fi
            sleep 6
          done

          curl -fsS --max-time 20 "https://$PUBLIC_HOST/health" | grep -q '"ready":true'
          CODE="$(curl -sS -o /tmp/main-ai-protected.out -w '%{http_code}' --max-time 20 \
            -X POST 'https://api.wesi-inc.ru/api/wesi/ai/chat' \
            -H 'Content-Type: application/json' \
            -d '{"persona":"zane","tier":"fast","message":"ping"}' || true)"
          if [ "$CODE" != 401 ] && [ "$CODE" != 403 ]; then
            echo "::error::Main Wesi AI route is not protected/loaded as expected; HTTP $CODE"
            cat /tmp/main-ai-protected.out || true
            exit 1
          fi
          echo 'Minimum Wesi AI path is live: WesiOS → api.wesi-inc.ru → temporary Relay → Gemini.' >> "$GITHUB_STEP_SUMMARY"
