name: Temporary apply Wesi AI tool message fix

on:
  push:
    branches:
      - fix/wesi-ai-tool-agent-handoff
    paths:
      - tools/temp_patch_wesi_ai_tool_messages.py
      - .github/workflows/temp-apply-wesi-ai-tool-message-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/temp_patch_wesi_ai_tool_messages.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Format Dart
        run: dart format lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart test/wesi_ai_tool_result_detail_test.dart
      - name: Check gateway syntax
        run: node --check server/wesi-ai-stream/gateway.mjs
      - name: Test gateway tool handoff
        run: node --test server/wesi-ai-stream/tool_handoff.test.mjs
      - name: Get Flutter dependencies
        run: flutter pub get
      - name: Test client tool result detail
        run: flutter test test/wesi_ai_tool_result_detail_test.dart
      - name: Commit product fix and remove temporary patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/temp_patch_wesi_ai_tool_messages.py .github/workflows/temp-apply-wesi-ai-tool-message-fix.yml
          git add lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart server/wesi-ai-stream/gateway.mjs server/wesi-ai-stream/tool_handoff.test.mjs test/wesi_ai_tool_result_detail_test.dart
          git commit -m "fix(ai): preserve verified tool result messages"
          git push origin HEAD:fix/wesi-ai-tool-agent-handoff
