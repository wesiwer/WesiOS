name: Temporary install Gemini router slots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-install-gemini-slots.yml'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      RELAY_USER: ${{ secrets.WESI_RELAY_SSH_USER }}

    steps:
      - name: Validate required secrets
        env:
          RELAY_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          G2: ${{ secrets.GEMINI_API_KEY_2 }}
          G3: ${{ secrets.GEMINI_API_KEY_3 }}
          G4: ${{ secrets.GEMINI_API_KEY_4 }}
          G5: ${{ secrets.GEMINI_API_KEY_5 }}
        run: |
          set -euo pipefail
          for name in RELAY_HOST RELAY_USER RELAY_KEY G2 G3 G4 G5; do
            [ -n "${!name:-}" ] || { echo "::error::Missing $name"; exit 1; }
          done
          echo 'Four additional Gemini secrets are present.'

      - name: Prepare SSH
        env:
          RELAY_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          RELAY_KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$RELAY_KEY" > ~/.ssh/relay_key
          chmod 600 ~/.ssh/relay_key
          if [ -n "${RELAY_KNOWN:-}" ]; then
            printf '%s\n' "$RELAY_KNOWN" > ~/.ssh/relay_known_hosts
          else
            ssh-keyscan -H "$RELAY_HOST" > ~/.ssh/relay_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/relay_known_hosts

      - name: Build sealed provider bundle
        env:
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_PROJECT: ${{ secrets.GEMINI_API_PROJECT }}
          GEMINI_API_PROJECT_2: ${{ secrets.GEMINI_API_PROJECT_2 }}
          GEMINI_API_PROJECT_3: ${{ secrets.GEMINI_API_PROJECT_3 }}
          GEMINI_API_PROJECT_4: ${{ secrets.GEMINI_API_PROJECT_4 }}
          GEMINI_API_PROJECT_5: ${{ secrets.GEMINI_API_PROJECT_5 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          names = [
              'GEMINI_API_KEY_2','GEMINI_API_KEY_3','GEMINI_API_KEY_4','GEMINI_API_KEY_5',
              'GEMINI_API_PROJECT','GEMINI_API_PROJECT_2','GEMINI_API_PROJECT_3','GEMINI_API_PROJECT_4','GEMINI_API_PROJECT_5',
              'GROQ_API_KEY','MISTRAL_API_KEY','OPENROUTER_API_KEY',
          ]
          with open('providers.b64','w',encoding='ascii') as f:
              for name in names:
                  value = os.environ.get(name, '').strip()
                  if value:
                      f.write(name + '=' + base64.b64encode(value.encode()).decode() + '\n')
          PY
          chmod 600 providers.b64

      - name: Install provider bundle and restart Relay
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          scp "${SSH[@]}" providers.b64 "$RELAY_USER@$RELAY_HOST:/tmp/wesi-ai-providers.b64"
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          test -f /tmp/wesi-ai-providers.b64
          tmp=/tmp/wesi-ai-providers.env.new
          umask 077
          : > "$tmp"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            key="${line%%=*}"
            value="${line#*=}"
            [ "$key" != "$line" ] || { echo 'bad provider line' >&2; exit 2; }
            case "$key" in
              GEMINI_API_KEY_2|GEMINI_API_KEY_3|GEMINI_API_KEY_4|GEMINI_API_KEY_5|GEMINI_API_PROJECT|GEMINI_API_PROJECT_2|GEMINI_API_PROJECT_3|GEMINI_API_PROJECT_4|GEMINI_API_PROJECT_5|GROQ_API_KEY|MISTRAL_API_KEY|OPENROUTER_API_KEY) ;;
              *) echo 'bad provider key' >&2; exit 2;;
            esac
            decoded="$(printf '%s' "$value" | base64 -d)"
            [ -n "$decoded" ] || continue
            printf '%s=%s\n' "$key" "$decoded" >> "$tmp"
          done < /tmp/wesi-ai-providers.b64
          rm -f /tmp/wesi-ai-providers.b64
          extra_slots="$(grep -Ec '^GEMINI_API_KEY_[2-5]=' "$tmp" || true)"
          [ "$extra_slots" -eq 4 ] || { echo "Expected 4 additional Gemini slots, got $extra_slots" >&2; exit 3; }
          group=root
          if getent group wesi-relay >/dev/null 2>&1; then group=wesi-relay; fi
          "${SUDO[@]}" install -o root -g "$group" -m 0640 "$tmp" /etc/wesi-ai-providers.env
          rm -f "$tmp"
          "${SUDO[@]}" systemctl restart wesi-ai-relay
          "${SUDO[@]}" systemctl is-active --quiet wesi-ai-relay
          echo 'Gemini additional slots installed: 4 (total configured Gemini keys: 5 including primary).'
          REMOTE
          rm -f providers.b64

      - name: Verify Relay locally
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          slots="$(grep -Ec '^GEMINI_API_KEY_[2-5]=' /etc/wesi-ai-providers.env || true)"
          [ "$slots" -eq 4 ] || { echo "Expected 4 installed additional Gemini slots, got $slots" >&2; exit 4; }
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 5 http://127.0.0.1:8787/health > /tmp/wesi-ai-health.json; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/wesi-ai-health.json',encoding='utf-8'))
          assert data.get('ok') is True and data.get('ready') is True, data
          assert data.get('routing') == ['fast','pro','ultra'], data
          print('Relay local health PASS; 5 Gemini keys configured including primary; Fast / Pro / Ultra ready.')
          PY
          rm -f /tmp/wesi-ai-health.json
          REMOTE
