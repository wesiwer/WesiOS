name: Temporary org integration patch runner

on:
  push:
    branches: [chatgpt/org-main-v2]
    paths: ['org-integration-trigger.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-main-v2
          fetch-depth: 0
      - name: Reconcile current Horizon APIs with org security
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/treasury/services/treasury_service.dart')
          s = p.read_text()
          if "import 'calendar_days.dart';" not in s:
              s = s.replace("import 'anomaly_engine.dart';\n", "import 'anomaly_engine.dart';\nimport 'calendar_days.dart';\n")
          marker = "  // ========== WESI HORIZON ==========\n"
          balance = '''  /// Баланс на конец календарного дня без будущих операций.\n  static double balanceOnDay(DateTime day, List<TransactionModel> transactions, double totalBalance) {\n    final cutoff = dateOnly(day);\n    var later = 0.0;\n    for (final tx in transactions) {\n      if (tx.isRecurring) continue;\n      if (dateOnly(tx.date).isAfter(cutoff)) {\n        later += tx.type == TransactionType.income ? tx.amount : -tx.amount;\n      }\n    }\n    return totalBalance - later;\n  }\n\n'''
          if 'static double balanceOnDay(' not in s:
              if marker not in s: raise SystemExit('Horizon marker not found')
              s = s.replace(marker, marker + '\n' + balance, 1)
          old = '''      var anchor = tx;\n      var guard = 0;\n      while (RecurringEngine.isDue(anchor, now) && guard < 366) {\n        final due = RecurringEngine.advance(anchor.date, period);'''
          new = '''      final anchorDate = tx.recurringAnchorDate;\n      var lastDue = tx.date;\n      var index = RecurringEngine.firstIndexAfter(anchorDate, period, tx.date);\n      var guard = 0;\n      while (guard < 366) {\n        final due = RecurringEngine.occurrence(anchorDate, period, index);\n        if (due.isAfter(now)) break;'''
          if old in s:
              s = s.replace(old, new, 1)
              tail_old = '''        anchor = anchor.copyWith(date: due, updatedAt: DateTime.now());\n        guard++;\n      }\n      if (guard > 0) await _putRecurringSystem(anchor);'''
              tail_new = '''        lastDue = due;\n        index++;\n        guard++;\n      }\n      if (guard > 0) {\n        await _putRecurringSystem(tx.copyWith(date: lastDue, recurringAnchor: anchorDate, updatedAt: DateTime.now()));\n      }'''
              if tail_old not in s: raise SystemExit('Recurring tail not found')
              s = s.replace(tail_old, tail_new, 1)
          p.write_text(s)

          p = Path('lib/features/treasury/services/horizon_business_context.dart')
          s = p.read_text()
          if "import 'calendar_days.dart';" not in s:
              s = "import 'calendar_days.dart';\n" + s
          p.write_text(s)
          PY
          git fetch origin agent/org-hierarchy-v1 --depth=1
          git show FETCH_HEAD:lib/features/organizations/widgets/organization_access_editor.dart > lib/features/organizations/widgets/organization_access_editor.dart
          rm -f .github/workflows/org-integration-patch-once.yml .github/workflows/org-integration-runner-temp.yml org-integration-trigger.txt
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reconcile org security with current Horizon APIs'
          git push origin HEAD:chatgpt/org-main-v2
