name: Inspect server auth hook once
# trigger: verify live v12 after direct deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-server-auth-hook-once.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare SSH and inspect
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/known_hosts
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes "$USER@$HOST" 'bash -s' > /tmp/server-auth-inspect.txt <<'REMOTE'
          set +e
          H=/opt/pocketbase/pb_hooks/wesi_auth_bootstrap.pb.js
          echo '=== MAIN HOOK ==='
          grep -oE '2026-08-09\.owner-email-v[0-9]+' "$H" | head -n1 || true
          grep -F 'WesiOS start-v2 OTP delivery failed' "$H" >/dev/null && echo INLINE_OTP_PRESENT || echo INLINE_OTP_MISSING
          grep -F 'payload.sentAt = sentAt.toISOString()' "$H" >/dev/null && echo SENT_AT_PATCH_PRESENT || echo SENT_AT_PATCH_MISSING
          echo '=== DUPLICATE ROUTES ==='
          echo -n 'auth-version='; grep -Rsl --include='*.js' '/api/wesi/auth/version' /opt/pocketbase/pb_hooks 2>/dev/null | wc -l
          grep -Rsl --include='*.js' '/api/wesi/auth/version' /opt/pocketbase/pb_hooks 2>/dev/null || true
          echo -n 'start-v2='; grep -Rsl --include='*.js' '/api/wesi/auth/start-v2' /opt/pocketbase/pb_hooks 2>/dev/null | wc -l
          grep -Rsl --include='*.js' '/api/wesi/auth/start-v2' /opt/pocketbase/pb_hooks 2>/dev/null || true
          echo '=== LIVE LOCAL VERSION ==='
          curl -sS --max-time 10 http://127.0.0.1:8090/api/wesi/auth/version || true
          echo
          echo '=== PROCESS ==='
          ps -eo pid,user,lstart,cmd | grep '[p]ocketbase' || true
          echo '=== RESTART CAPABILITY ==='
          if command -v sudo >/dev/null 2>&1 && sudo -n systemctl status pocketbase >/dev/null 2>&1; then echo SUDO_SYSTEMCTL_AVAILABLE; else echo SUDO_SYSTEMCTL_UNAVAILABLE; fi
          REMOTE
          python3 - <<'PY'
          import re
          s=open('/tmp/server-auth-inspect.txt',encoding='utf-8',errors='replace').read()
          s=re.sub(r'/opt/pocketbase/pb_hooks/','pb_hooks/',s)
          s=re.sub(r'\b(?:\d{1,3}\.){3}\d{1,3}\b','<redacted-ip>',s)
          open('.github/server-auth-hook-inspect.txt','w',encoding='utf-8').write(s)
          PY
          git config user.name 'WesiOS Auth Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git switch -C diag/server-auth-hook
          git add .github/server-auth-hook-inspect.txt
          git commit -m 'diag(auth): inspect server hook state'
          git push --force origin HEAD:diag/server-auth-hook
