name: Deploy app-latest to PocketBase

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  deploy:
    if: github.head_ref == 'ci/deploy-app-latest-pocketbase'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download already published app-latest assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upload
          gh release download app-latest \
            --repo "$GITHUB_REPOSITORY" \
            --dir upload \
            --pattern 'wesios-windows-x64.zip' \
            --pattern 'wesios-android.apk' \
            --pattern 'app-manifest.json' \
            --clobber
          test -s upload/wesios-windows-x64.zip
          test -s upload/wesios-android.apk
          test -s upload/app-manifest.json
          python3 -m json.tool upload/app-manifest.json >/dev/null
          ls -lh upload

      - name: Read release version
        id: meta
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, base64
          m = json.load(open('upload/app-manifest.json', encoding='utf-8'))
          print('version=' + str(m['version']))
          print('build=' + str(m['build']))
          notes = (m.get('android') or {}).get('notes') or (m.get('windows') or {}).get('notes') or ''
          print('notes_b64=' + base64.b64encode(notes.encode()).decode())
          PY

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}"
          test -n "${USER:-}"
          test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo '::warning::WESI_SERVER_KNOWN_HOSTS не задан — используется текущий host key сервера.'
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare PocketBase public directory
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          TARGET='/opt/pocketbase/pb_public/artifacts'

          if $SSH "$USER@$HOST" "mkdir -p '$TARGET/app' 2>/dev/null && test -w '$TARGET/app'"; then
            echo "TARGET_READY=$TARGET (direct)"
            exit 0
          fi

          if $SSH "$USER@$HOST" "command -v sudo >/dev/null 2>&1 && sudo -n mkdir -p '$TARGET/app' && sudo -n chown -R \"\$(id -un)\" '$TARGET' && test -w '$TARGET/app'"; then
            echo "TARGET_READY=$TARGET (sudo -n bootstrap)"
            exit 0
          fi

          echo '::error::Не удалось подготовить PocketBase artifacts directory.'
          $SSH "$USER@$HOST" "id; ls -ld /opt/pocketbase /opt/pocketbase/pb_public /opt/pocketbase/pb_public/artifacts 2>&1 || true; command -v sudo >/dev/null && sudo -n true >/dev/null 2>&1 && echo SUDO_N_OK || echo SUDO_N_UNAVAILABLE" || true
          exit 1

      - name: Upload app-latest to PocketBase
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          NOTES_B64: ${{ steps.meta.outputs.notes_b64 }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE_TMP="/tmp/wesios-app-latest-$GITHUB_RUN_ID"
          TARGET='/opt/pocketbase/pb_public/artifacts'

          $SSH "$USER@$HOST" "mkdir -p '$REMOTE_TMP'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            upload/wesios-windows-x64.zip \
            upload/wesios-android.apk \
            server/deploy-artifact.sh \
            "$USER@$HOST:$REMOTE_TMP/"

          cleanup() {
            $SSH "$USER@$HOST" "rm -rf '$REMOTE_TMP'" || true
          }
          trap cleanup EXIT

          $SSH "$USER@$HOST" \
            "WESI_ARTIFACTS='$TARGET' bash '$REMOTE_TMP/deploy-artifact.sh' \
              --version '$VERSION' --build '$BUILD' --from '$REMOTE_TMP' \
              --notes-b64 '$NOTES_B64'"

      - name: Verify public PocketBase artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          BASE: https://api.wesi-inc.ru/artifacts
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BASE/app/app-manifest.json" -o server-manifest.json
          cat server-manifest.json
          python3 <<'PY'
          import json, os, sys, urllib.request
          m = json.load(open('server-manifest.json', encoding='utf-8'))
          want_v = os.environ['VERSION']
          want_b = int(os.environ['BUILD'])
          if m.get('version') != want_v or int(m.get('build', -1)) != want_b:
              sys.exit(f"server manifest={m.get('version')}+{m.get('build')} expected={want_v}+{want_b}")
          base = os.environ['BASE'].rstrip('/')
          for platform in ('windows', 'android'):
              item = m[platform]
              url = f"{base}/{item['path']}"
              req = urllib.request.Request(url, method='HEAD')
              with urllib.request.urlopen(req, timeout=30) as response:
                  size = int(response.headers.get('Content-Length', '-1'))
              if size != int(item['sizeBytes']):
                  sys.exit(f"{platform}: public size {size} != manifest {item['sizeBytes']}")
              print(f"{platform}: {url} — {size} bytes OK")
          print('POCKETBASE_APP_LATEST_DEPLOY_OK')
          PY
