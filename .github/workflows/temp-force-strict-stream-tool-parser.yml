name: Temporary force strict stream tool parser

on:
  push:
    branches:
      - fix/wesi-ai-tool-agent-handoff
    paths:
      - tools/temp_force_strict_stream_tool_parser.py
      - .github/workflows/temp-force-strict-stream-tool-parser.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 0
      - name: Apply explicit parser delta
        run: python3 tools/temp_force_strict_stream_tool_parser.py
      - name: Verify stream protocol
        run: |
          node --check server/wesi-ai-stream/gateway.mjs
          node --test server/wesi-ai-stream/tool_handoff.test.mjs server/wesi-ai-stream/tool_registry_contract.test.mjs
      - name: Commit parser product fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/wesi-ai-stream/gateway.mjs
          git commit -m "fix(ai): reject malformed stream tool arguments"
          git push origin HEAD:fix/wesi-ai-tool-agent-handoff
