name: Diagnose Home mobile overflow

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feat/finish-unfinished-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Apply current Home fixes
        run: |
          set -euo pipefail
          git fetch origin agent/fix-full-home-mobile main --depth=1
          git show origin/agent/fix-full-home-mobile:tools/fix_full_home_mobile.py > /tmp/fix_home.py
          git show origin/main:tools/finish_home_mobile_header.py > /tmp/fix_header.py
          python3 /tmp/fix_home.py
          python3 /tmp/fix_header.py
          dart format lib/core/widgets/wesi_avatar.dart lib/core/widgets/wesi_clock.dart lib/features/home/home_screen.dart test/home_mobile_layout_test.dart

      - name: Let Flutter report the second overflow directly
        run: |
          python3 -c "from pathlib import Path; p=Path('test/home_mobile_layout_test.dart'); s=p.read_text(); old='    expect(tester.takeException(), isNull);'; i=s.rfind(old); assert i >= 0; p.write_text(s[:i] + s[i+len(old):])"
          flutter pub get >/dev/null
          flutter test test/home_mobile_layout_test.dart --reporter expanded
