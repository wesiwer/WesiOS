name: Wesi AI Stage 11 GitHub Server

on:
  push:
    branches:
      - agent/wesi-ai-stage11-connectors
    paths:
      - scripts/stage11_github_server_integrate.py
      - .github/workflows/wesi-ai-stage11-github-server.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage11-github-server
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage11-connectors
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 scripts/stage11_github_server_integrate.py

      - name: Validate JS syntax
        run: |
          node --check server/pb_hooks/wesi_ai_github_lib.js
          node --check server/pb_hooks/wesi_ai_github.pb.js
          node --check server/pb_hooks/wesi_ai_github_tools.js
          node --check server/pb_hooks/wesi_ai_tools.js
          node --check server/pb_hooks/wesi_ai_capability_registry.js

      - name: Run GitHub connector regressions
        run: |
          node --test server/wesi-ai-stream/github_connector.test.mjs
          node --test server/wesi-ai-stream/remote_worker_protocol.test.mjs

      - name: Verify Broker registration
        run: |
          grep -F 'wesi_ai_github_tools.js' server/pb_hooks/wesi_ai_tools.js
          grep -F 'github_repositories_list:' server/pb_hooks/wesi_ai_capability_registry.js
          grep -F 'github_actions_list:' server/pb_hooks/wesi_ai_capability_registry.js

      - name: Commit validated product integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/pb_hooks/wesi_ai_tools.js server/pb_hooks/wesi_ai_capability_registry.js
          if git diff --cached --quiet; then
            echo "Integration already committed"
            exit 0
          fi
          git commit -m "feat(ai): register GitHub connector read tools"
          git push origin HEAD:agent/wesi-ai-stage11-connectors
