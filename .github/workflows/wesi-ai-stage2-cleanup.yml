name: Clean Wesi AI Stage 2 unrelated formatting

on:
  push:
    branches:
      - agent/wesi-ai-stage2-streaming

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[stage2-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore unrelated AI files from current main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- \
            lib/features/ai/ai_assistant_screen.dart \
            lib/features/ai/media_engines/wesi_media_engine_runner.dart \
            lib/features/ai/media_engines/wesi_media_engine_service.dart \
            lib/features/ai/models/wesi_ai_attachment.dart \
            lib/features/ai/models/wesi_ai_chat_models.dart \
            lib/features/ai/models/wesi_ai_content_blocks.dart \
            lib/features/ai/wesi_ai_chat_ui.dart \
            lib/features/ai/wesi_ai_handoff_controller.dart \
            lib/features/ai/wesi_ai_speech_output.dart \
            lib/features/ai/wesi_ai_turn_intent.dart \
            lib/features/ai/widgets/wesi_ai_camera_capture.dart
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/ai
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(ai): remove unrelated stage 2 formatting [stage2-cleanup]'
          git push origin HEAD:agent/wesi-ai-stage2-streaming
