name: Horizon final cleanup gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: horizon-final-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/horizon-top-tier'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/horizon-top-tier
          fetch-depth: 20

      - name: Wait for prior patch runner and refresh branch
        shell: bash
        run: |
          set -euo pipefail
          sleep 120
          git fetch origin agent/horizon-top-tier
          git reset --hard origin/agent/horizon-top-tier

      - name: Apply every remaining Horizon hardening patch
        shell: bash
        run: |
          set -euo pipefail
          patches=(
            tooling/horizon_confidence_patch.py
            tooling/horizon_main_source_stress_patch.py
            tooling/horizon_balance_truth_patch.py
            tooling/horizon_account_risk_patch.py
            tooling/horizon_legacy_income_balance_patch.py
            tooling/horizon_income_delay_patch.py
            tooling/horizon_final_audit_patch.py
          )
          for patch in "${patches[@]}"; do
            [ -f "$patch" ] || continue
            python3 -m py_compile "$patch"
            python3 "$patch"
          done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Full clean validation before cleanup commit
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/treasury/services/forecast_engine.dart \
            lib/features/treasury/services/forecast_backtest.dart \
            lib/features/treasury/services/horizon_calibration.dart \
            lib/features/treasury/services/horizon_learning_service.dart \
            lib/features/treasury/services/horizon_prediction_registry.dart \
            lib/features/treasury/services/horizon_tuning_optimizer.dart \
            lib/features/treasury/services/horizon_engine_competition.dart \
            lib/features/treasury/services/horizon_business_context.dart \
            lib/features/treasury/services/horizon_contract_memory.dart \
            lib/features/treasury/services/horizon_behavior_monitor.dart \
            lib/features/treasury/services/horizon_explainability.dart \
            lib/features/treasury/services/account_liquidity_service.dart \
            lib/features/treasury/services/account_service.dart \
            lib/features/treasury/services/treasury_service.dart \
            lib/features/treasury/widgets/horizon_decision_panel.dart \
            lib/features/treasury/widgets/account_liquidity_dialog.dart \
            lib/features/audio/services/audio_vault_service.dart
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          git diff --check

      - name: Verify top-tier truth invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'final actualEvidenceCount = nonRecurring.length;' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'final primaryLossSource = mainIncomeExposure.isEmpty' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'delayedSampledIncome' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'uncertainMagnitudeByOffset' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'recurringReliability: effectiveRecurringReliability' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'history: nonRecurring' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'actualForBalance' lib/features/treasury/services/account_service.dart
          grep -Fq 'Income is NOT auto-posted as actual cash' lib/features/treasury/services/treasury_service.dart
          grep -Fq 'final tailSize = max(3, (horizon * 0.20).round())' lib/features/treasury/services/forecast_backtest.dart
          grep -Fq 'final evaluationStart = max(0, (horizon * 0.75).floor())' lib/features/treasury/services/horizon_engine_competition.dart
          grep -Fq 'HorizonPredictionRegistry.recordBaseForecast' lib/features/treasury/services/treasury_service.dart
          grep -Fq 'HorizonExplainabilityService.build' lib/features/treasury/services/treasury_service.dart
          grep -Fq 'HorizonBehaviorMonitor.analyze' lib/features/treasury/services/treasury_service.dart
          grep -Fq 'context-crm-unavailable' lib/features/treasury/services/horizon_business_context.dart
          grep -Fq 'final crmOverdue = !due.isAfter(today);' lib/features/treasury/services/horizon_business_context.dart
          grep -Fq 'final missedIncoming = overdue && parsed.signedAmount > 0;' lib/features/treasury/services/horizon_business_context.dart
          grep -Fq 'calibrationSamples' lib/features/treasury/services/forecast_engine.dart
          grep -Fq 'нет оценки · цель 80%' lib/features/treasury/widgets/horizon_decision_panel.dart
          test -f test/horizon_completion_test.dart
          test -f test/horizon_truth_invariants_test.dart
          test -f test/horizon_main_source_stress_test.dart
          test -f test/horizon_balance_truth_test.dart
          test -f test/horizon_account_recurring_risk_test.dart
          test -f test/horizon_legacy_income_truth_test.dart
          test -f test/horizon_income_delay_truth_test.dart
          test -f test/horizon_overdue_cash_truth_test.dart
          test -f test/horizon_explainability_probability_test.dart

      - name: Sync final Horizon engineering notes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          block = '''

## Final independent-audit hardening

The final audit pass additionally closed cash-truth edge cases that ordinary feature checklists did not expose:

- statistical confidence and history span are earned only by actual non-recurring cash evidence;
- recurring income is never auto-posted as actual cash; legacy generated income rows remain stored but are excluded from actual-balance arithmetic;
- current balances exclude future-dated scheduled operations, while backtests reconstruct only cash already present at the current-balance date;
- recurring execution reliability reconstructs due dates even after its schedule anchor has advanced;
- overdue Task expenses remain immediate commitments, while missed expected Task income loses false certainty;
- overdue open CRM deals do not disappear: they move to near-term uncertain cash with a probability haircut and warning;
- `knownCashShare` includes probabilistic recurring/business exposure in the unknown denominator;
- long-horizon backtests and engine championship score the horizon tail rather than allowing easy first weeks to dominate 90/180-day quality;
- main-source stress selects the dominant source across historical streams, recurring contracts and CRM/Vault cash;
- 30-day incoming-delay stress uses real delayed-cash queues, including positive shocks, rather than deleting early income;
- account-local liquidity risk uses actual history plus account-bound recurring/scenario cash, FX haircut and transfer latency;
- unavailable CRM/Vault/Tasks/account context is surfaced explicitly instead of being silently omitted;
- material P50 changes have additive attribution, and probabilistic business events cannot be double-counted as fake committed remainder;
- calibration UI distinguishes a target (80%) from measured coverage and reports sample count/source.

Implementation completeness must still not be confused with empirical proof: 14/30/90/180-day production forecasts need real time to mature before their long-run calibration can be claimed as historically demonstrated.
'''
          for name in ('docs/WESI_HORIZON_TOP_TIER.md', 'TZ.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              marker = '## Final independent-audit hardening'
              if marker not in text:
                  path.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY

      - name: Restore read-only PR validation and remove patch infrastructure
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/pr-check.yml <<'YAML'
          name: Pull request check

          on:
            pull_request:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: pr-check-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            analyze-and-test:
              runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
              timeout-minutes: 30
              steps:
                - uses: actions/checkout@v4
                - name: Validate server JavaScript
                  shell: bash
                  run: |
                    set -euo pipefail
                    for file in server/pb_hooks/*.js server/employee-portal/*.js; do
                      [ -f "$file" ] || continue
                      node --check "$file"
                    done
                - name: Setup Flutter
                  uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.24.0'
                    channel: stable
                    cache: true
                - name: Get dependencies
                  run: flutter pub get
                - name: Analyze
                  run: flutter analyze --no-fatal-infos
                - name: Test
                  run: flutter test
          YAML

          find tooling -maxdepth 1 -type f \( -name 'horizon_*patch.py' -o -name 'run_horizon*patch.py' \) -print0 \
            | xargs -0 -r git rm -f --
          git rm -f .github/workflows/horizon-final-cleanup.yml
          git diff --check

      - name: Commit final clean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to clean.'
            exit 0
          fi
          git commit -m 'chore(horizon): finalize audited A-G implementation'
          git fetch origin agent/horizon-top-tier
          git rebase origin/agent/horizon-top-tier
          git push origin HEAD:agent/horizon-top-tier
