name: Organization sync integrity

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/org-sync-integrity-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-v1
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Enforce ownership on decoded sync records
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('lib/core/sync/sync_codec.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              "      organizationId: _strOrNull(fields['organizationId']),\n      minimumBalance:",
              "      organizationId: _str(\n        fields['organizationId'],\n        OrganizationModel.wesiBeatsId,\n      ),\n      minimumBalance:",
              1,
          )
          # Transaction decoder has the same old nullable assignment later in
          # the file. Replace the next remaining occurrence only.
          old="      organizationId: _strOrNull(fields['organizationId']),\n      projectId:"
          new="      organizationId: _str(\n        fields['organizationId'],\n        OrganizationModel.wesiBeatsId,\n      ),\n      projectId:"
          if old in s: s=s.replace(old,new,1)

          # Task ownership is carried in compatibility tags for mixed-version
          # peers. Decode tags once and hydrate stable fields when present.
          task_start="""    final raw = fields['subtasks'];\n    return TaskModel(\n"""
          if "final syncTags = _strings(fields['tags']);" not in s and task_start in s:
              task_prefix="""    final raw = fields['subtasks'];\n    final syncTags = _strings(fields['tags']);\n    String? tagValue(String prefix) {\n      for (final tag in syncTags) {\n        if (tag.startsWith(prefix) && tag.length > prefix.length) {\n          return tag.substring(prefix.length);\n        }\n      }\n      return null;\n    }\n    return TaskModel(\n"""
              s=s.replace(task_start,task_prefix,1)
          s=s.replace(
              "      tags: _strings(fields['tags']),\n      order: _int(fields['order']),\n    );\n",
              "      tags: syncTags,\n      order: _int(fields['order']),\n      organizationId: tagValue(TaskModel.organizationTagPrefix) ??\n          OrganizationModel.wesiBeatsId,\n      responsibleEmployeeId: tagValue(TaskModel.employeeTagPrefix),\n    );\n",
              1,
          )
          p.write_text(s,encoding='utf-8')
          PY
          dart format lib/core/sync/sync_codec.dart >/dev/null
          flutter pub get
          flutter analyze --no-fatal-infos
          rm -f .github/workflows/org-sync-integrity-temp.yml
          git diff --check
      - name: Commit sync integrity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WesiOS CI Fix"
          git config user.email "actions@users.noreply.github.com"
          git add lib/core/sync/sync_codec.dart .github/workflows/org-sync-integrity-temp.yml
          git commit -m "fix(org): enforce ownership during sync decode"
          git push origin HEAD:agent/org-hierarchy-v1
