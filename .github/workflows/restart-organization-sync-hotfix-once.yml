name: Restart Organization Sync Hotfix Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restart-organization-sync-hotfix-once.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/ops/run-organization-sync-restart-20260821'

permissions:
  contents: read

concurrency:
  group: wesios-organization-sync-hotfix-production
  cancel-in-progress: false

jobs:
  deploy-and-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: employee-portal
      url: https://api.wesi-inc.ru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate organization normalization locally
        shell: bash
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_sync_read.pb.js
          grep -q 'normalizeOrganizationPayload' server/pb_hooks/wesi_sync_read.pb.js
          grep -q 'org_wesi_inc' server/pb_hooks/wesi_sync_read.pb.js

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEY:-}" || { echo '::error::Нет WESI_SERVER_SSH_KEY'; exit 1; }
          test -n "${HOST:-}" || { echo '::error::Нет WESI_SERVER_HOST'; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Install current sync-read hook and restart PocketBase
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          CONFIGURED_HOOK_DIR: ${{ vars.WESI_PB_HOOK_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${USER:-}" || { echo '::error::Нет WESI_SERVER_USER'; exit 1; }
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          HOOK_DIR="${CONFIGURED_HOOK_DIR:-/opt/pocketbase/pb_hooks}"
          REMOTE="/tmp/wesi-org-sync-read-$GITHUB_RUN_ID.pb.js"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes server/pb_hooks/wesi_sync_read.pb.js "$USER@$HOST:$REMOTE"
          $SSH "$USER@$HOST" "REMOTE='$REMOTE' HOOK_DIR='$HOOK_DIR' bash -s" <<'SH'
          set -euo pipefail
          dst="$HOOK_DIR/wesi_sync_read.pb.js"

          if [ -w "$HOOK_DIR" ]; then
            tmp="$HOOK_DIR/.deploy-wesi_sync_read.$$.$RANDOM.tmp"
            cat "$REMOTE" > "$tmp"
            chmod 0644 "$tmp"
            cmp -s "$REMOTE" "$tmp"
            mv -f "$tmp" "$dst"
          elif [ -e "$dst" ] && [ -w "$dst" ]; then
            cat "$REMOTE" > "$dst"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            tmp="$HOOK_DIR/.deploy-wesi_sync_read.$$.$RANDOM.tmp"
            sudo -n cp "$REMOTE" "$tmp"
            sudo -n chmod 0644 "$tmp"
            sudo -n cmp -s "$REMOTE" "$tmp"
            sudo -n mv -f "$tmp" "$dst"
          else
            echo 'Нет прав на установку sync-read hook' >&2
            exit 3
          fi

          if cmp -s "$REMOTE" "$dst" 2>/dev/null; then
            echo 'sync-read hook подтверждён byte-for-byte'
          elif command -v sudo >/dev/null 2>&1 && sudo -n cmp -s "$REMOTE" "$dst"; then
            echo 'sync-read hook подтверждён byte-for-byte через sudo'
          else
            echo 'Установленный sync-read hook не совпадает' >&2
            exit 4
          fi
          grep -q 'normalizeOrganizationPayload' "$dst" || {
            echo 'organization normalization отсутствует на production' >&2; exit 5;
          }
          echo 'organization normalization присутствует на production'

          restarted=0
          if systemctl restart pocketbase 2>/dev/null; then
            echo 'PocketBase перезапущен напрямую через systemctl'
            restarted=1
          elif command -v sudo >/dev/null 2>&1 && sudo -n systemctl restart pocketbase 2>/dev/null; then
            echo 'PocketBase перезапущен через sudo systemctl'
            restarted=1
          else
            old_pid="$(systemctl show pocketbase -p MainPID --value 2>/dev/null || true)"
            restart_policy="$(systemctl show pocketbase -p Restart --value 2>/dev/null || true)"
            service_user="$(systemctl show pocketbase -p User --value 2>/dev/null || true)"
            process_user=''
            if [[ "$old_pid" =~ ^[0-9]+$ ]] && [ "$old_pid" -gt 1 ]; then
              process_user="$(ps -o user= -p "$old_pid" 2>/dev/null | xargs || true)"
            fi
            current_user="$(id -un)"
            echo "PocketBase MainPID=$old_pid unitUser=$service_user processUser=$process_user deployUser=$current_user Restart=$restart_policy"

            case "$restart_policy" in
              always|on-failure|on-abnormal|on-abort|on-watchdog) policy_safe=1 ;;
              *) policy_safe=0 ;;
            esac

            if [ "$policy_safe" = 1 ] && [ -n "$process_user" ] && [ "$process_user" = "$current_user" ]; then
              echo 'systemd гарантирует автоматический подъём; завершаю только текущий PocketBase PID'
              kill -KILL "$old_pid"
              for i in $(seq 1 30); do
                sleep 1
                new_pid="$(systemctl show pocketbase -p MainPID --value 2>/dev/null || true)"
                state="$(systemctl is-active pocketbase 2>/dev/null || true)"
                if [[ "$new_pid" =~ ^[0-9]+$ ]] && [ "$new_pid" -gt 1 ] && [ "$new_pid" != "$old_pid" ] && [ "$state" = active ]; then
                  echo "PocketBase автоматически поднят systemd: old=$old_pid new=$new_pid"
                  restarted=1
                  break
                fi
              done
            fi
          fi

          if [ "$restarted" != 1 ]; then
            echo 'Не найден безопасный способ перезапустить PocketBase без дополнительных sudo-прав' >&2
            exit 6
          fi

          sleep 2
          state="$(systemctl is-active pocketbase 2>/dev/null || true)"
          [ "$state" = active ] || { echo "PocketBase state=$state после рестарта" >&2; exit 7; }
          rm -f "$REMOTE"
          SH

      - name: Verify production organizations route after restart
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.wesi-inc.ru'
          for i in $(seq 1 15); do
            code=$(curl -sS -o response.txt -w '%{http_code}' --max-time 20 "$API/api/wesi/sync/organizations" || true)
            case "$code" in
              401|403)
                echo "organizations route loaded and protected: HTTP $code"
                exit 0
                ;;
              *)
                echo "attempt $i: organizations route HTTP $code"
                sleep 2
                ;;
            esac
          done
          echo '::error::organizations route did not become healthy/protected'
          cat response.txt || true
          exit 1
