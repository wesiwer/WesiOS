name: Capture Final Release Result Once
# trigger: capture signed WesiOS 0.22.30+105 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-final-release-result-once.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture latest non-cancelled release run after final toolchain fixes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for i in $(seq 1 48); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release-app.yml --limit 10 \
              --json databaseId,status,conclusion,createdAt > /tmp/runs.json
            RUN_ID=$(python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/runs.json'))
          rows=sorted(rows, key=lambda r:r.get('createdAt',''), reverse=True)
          for row in rows:
              if row['databaseId'] <= 32154843215:
                  continue
              if row.get('conclusion') == 'cancelled':
                  continue
              print(row['databaseId'])
              break
          PY
            )
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo 'FINAL_RELEASE_RUN_NOT_FOUND' > /tmp/result.txt
          else
            gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status || true
            {
              echo "RUN_ID=$RUN_ID"
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --json databaseId,status,conclusion,headSha,createdAt,jobs
              echo
              echo '=== FAILED LOGS ==='
              gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed || true
            } > /tmp/result.txt
          fi
          cp /tmp/result.txt .github/final-release-result.txt
          git config user.name 'WesiOS Release Diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git switch -C diag/final-release-result
          git add .github/final-release-result.txt
          git commit -m 'ops: capture final release result'
          git push --force origin HEAD:diag/final-release-result
