name: Deploy sync revision stamp fix once
# trigger: production deploy after invalid updated sort

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-sync-revision-fix-once.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: employee-portal
      url: https://api.wesi-inc.ru
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate revision implementation
        shell: bash
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_sync_revision.js
          node --test server/pb_hooks/wesi_sync_revision_contract_test.mjs
          ! grep -Fq '"-updated,-id"' server/pb_hooks/wesi_sync_revision.js
          ! grep -Fq 'getString("updated")' server/pb_hooks/wesi_sync_revision.js
          grep -Fq '"-stamp,-id"' server/pb_hooks/wesi_sync_revision.js
          grep -Fq 'first.getString("stamp")' server/pb_hooks/wesi_sync_revision.js

      - name: Deploy exact revision runtime to production
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
          CONFIGURED_HOOK_DIR: ${{ vars.WESI_PB_HOOK_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          HOOK_DIR="${CONFIGURED_HOOK_DIR:-/opt/pocketbase/pb_hooks}"
          REMOTE="/tmp/wesi-sync-revision-$GITHUB_RUN_ID"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes server/pb_hooks/wesi_sync_revision.js "$USER@$HOST:$REMOTE/wesi_sync_revision.js"
          $SSH "$USER@$HOST" "REMOTE='$REMOTE' HOOK_DIR='$HOOK_DIR' bash -s" > /tmp/revision-deploy.txt <<'REMOTE_SCRIPT'
          set -euo pipefail
          SRC="$REMOTE/wesi_sync_revision.js"
          DST="$HOOK_DIR/wesi_sync_revision.js"
          if [ -w "$DST" ]; then
            cat "$SRC" > "$DST"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n install -m 0644 "$SRC" "$DST"
          else
            echo 'TARGET_NOT_WRITABLE' >&2
            exit 30
          fi
          sleep 3
          cmp -s "$SRC" "$DST" || { echo 'LIVE_FILE_MISMATCH' >&2; exit 31; }
          if grep -Fq '"-updated,-id"' "$DST"; then echo 'INVALID_UPDATED_SORT_STILL_PRESENT' >&2; exit 32; fi
          if grep -Fq 'getString("updated")' "$DST"; then echo 'INVALID_UPDATED_READ_STILL_PRESENT' >&2; exit 33; fi
          grep -Fq '"-stamp,-id"' "$DST"
          grep -Fq 'first.getString("stamp")' "$DST"
          echo 'LIVE_FILE_MATCH_MAIN=true'
          echo 'UPDATED_SORT_PRESENT=false'
          echo 'STAMP_FALLBACK_PRESENT=true'
          rm -rf "$REMOTE"
          REMOTE_SCRIPT

      - name: Verify route remains loaded and protected
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/response.txt -w '%{http_code}' --max-time 20 https://api.wesi-inc.ru/api/wesi/sync/revision-v2 || true)
          case "$code" in
            401|403) echo "revision-v2 protected route loaded: $code" ;;
            *) echo "Unexpected revision-v2 HTTP $code"; cat /tmp/response.txt; exit 40 ;;
          esac

      - name: Publish deployment report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > .github/sync-revision-fix-deploy.json
          import json, pathlib, datetime
          text=pathlib.Path('/tmp/revision-deploy.txt').read_text(encoding='utf-8',errors='replace') if pathlib.Path('/tmp/revision-deploy.txt').exists() else ''
          print(json.dumps({
            'checkedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'headSha': '${{ github.sha }}',
            'liveFileMatchMain': 'LIVE_FILE_MATCH_MAIN=true' in text,
            'updatedSortPresent': not ('UPDATED_SORT_PRESENT=false' in text),
            'stampFallbackPresent': 'STAMP_FALLBACK_PRESENT=true' in text,
          }, ensure_ascii=False, indent=2))
          PY
          git config user.name 'WesiOS Sync Hotfix'
          git config user.email 'actions@users.noreply.github.com'
          git switch -C diag/sync-revision-fix-deploy
          git add .github/sync-revision-fix-deploy.json
          git commit -m 'diag(sync): verify revision stamp hotfix' || true
          git push --force origin HEAD:diag/sync-revision-fix-deploy
