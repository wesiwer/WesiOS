name: Snapshot WesiOS 0.19.4+52 production runs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/snapshot-release-runs-0194.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 250c1a94e771c98792c4936a9f4e4da7e9f4a9ec
      STATUS_FILE: .release-runs-0.19.4+52.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Snapshot run ids
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 5
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&per_page=100")
          portal=$(printf '%s' "$runs" | jq -c '.workflow_runs | map(select(.name == "Deploy employee portal")) | sort_by(.created_at) | last // {}')
          release=$(printf '%s' "$runs" | jq -c '.workflow_runs | map(select(.name == "Build signed WesiOS release")) | sort_by(.created_at) | last // {}')
          jq -n --arg target "$TARGET_SHA" --argjson portal "$portal" --argjson release "$release" \
            '{targetSha:$target,portal:{id:$portal.id,status:$portal.status,conclusion:$portal.conclusion,url:$portal.html_url},release:{id:$release.id,status:$release.status,conclusion:$release.conclusion,url:$release.html_url}}' > "$STATUS_FILE"
          cat "$STATUS_FILE"
      - name: Publish snapshot
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Release Snapshot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$STATUS_FILE"
          git commit -m 'chore: snapshot WesiOS 0.19.4+52 production runs'
          git push origin HEAD:main
