name: Activate hash-gated owner recovery once

on:
  push:
    branches: [main]
    paths:
      - 'server/pb_hooks/wesi_owner_recovery.pb.js'
      - '.github/workflows/activate-owner-recovery-once.yml'

permissions:
  contents: read

concurrency:
  group: wesios-owner-recovery-production
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build an expiring recovery bootstrap
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='server/pb_hooks/wesi_owner_recovery.pb.js'
          BOOTSTRAP='server/pb_hooks/wesi_auth_bootstrap.pb.js'
          OUTPUT="$RUNNER_TEMP/wesi_auth_bootstrap.pb.js"
          EXPIRES_AT="$(date -u -d '+45 minutes' +'%Y-%m-%dT%H:%M:%SZ')"

          test -s "$SOURCE"
          test -s "$BOOTSTRAP"
          test ! -e lib/features/auth/owner_recovery_service.dart
          test ! -e server/fix-owner-recovery-production.sh

          python3 - "$SOURCE" "$BOOTSTRAP" "$OUTPUT" "$EXPIRES_AT" <<'PY'
          from pathlib import Path
          import sys

          recovery_path = Path(sys.argv[1])
          bootstrap_path = Path(sys.argv[2])
          output_path = Path(sys.argv[3])
          expires_at = sys.argv[4]
          recovery = recovery_path.read_text(encoding='utf-8')
          marker = '__WESI_RECOVERY_EXPIRES_AT__'
          if recovery.count(marker) != 1:
              raise SystemExit('expected exactly one recovery expiry placeholder')
          recovery = recovery.replace(marker, expires_at)
          bootstrap = bootstrap_path.read_text(encoding='utf-8')
          output_path.write_text(recovery + '\n\n' + bootstrap, encoding='utf-8')
          PY

          node --check "$OUTPUT"
          grep -q 'wesiOneTimeOwnerRecovery' "$OUTPUT"
          ! grep -q '__WESI_RECOVERY_EXPIRES_AT__' "$OUTPUT"
          echo "RECOVERY_EXPIRES_AT=$EXPIRES_AT" >> "$GITHUB_ENV"

      - name: Check server credentials
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}"
          test -n "${USER:-}"
          test -n "${KEY:-}"

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy only the temporary bootstrap
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE="/tmp/wesi-owner-recovery-$GITHUB_RUN_ID"
          LOCAL="$RUNNER_TEMP/wesi_auth_bootstrap.pb.js"

          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            "$LOCAL" "$USER@$HOST:$REMOTE/wesi_auth_bootstrap.pb.js"

          $SSH "$USER@$HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          HOOK=/opt/pocketbase/pb_hooks/wesi_auth_bootstrap.pb.js
          SOURCE="$REMOTE/wesi_auth_bootstrap.pb.js"
          test -s "$SOURCE"
          test -f "$HOOK"

          if [ -w "$HOOK" ]; then
            cat "$SOURCE" > "$HOOK"
            chmod 0644 "$HOOK"
          elif [ -w "$(dirname "$HOOK")" ]; then
            install -m 0644 "$SOURCE" "$HOOK"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n install -m 0644 "$SOURCE" "$HOOK"
          else
            echo 'No permission to update the existing WesiOS auth bootstrap.' >&2
            exit 1
          fi

          if [ -r "$HOOK" ]; then
            cmp -s "$SOURCE" "$HOOK"
          else
            sudo -n cmp -s "$SOURCE" "$HOOK"
          fi
          rm -rf "$REMOTE"
          sleep 3
          curl -fsS --max-time 15 http://127.0.0.1:8090/api/health >/dev/null
          echo 'Hash-gated owner recovery bootstrap is active.'
          REMOTE_SCRIPT

      - name: Verify the production boundary
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.wesi-inc.ru'
          curl -fsS --max-time 20 "$API/api/health" >/dev/null

          CODE=$(curl -sS -o invalid-recovery.json -w '%{http_code}' --max-time 20 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"login":"owner-recovery","password":"invalid","purpose":"app"}' \
            "$API/api/wesi/auth/start-v2" || true)
          [ "$CODE" = 401 ] || {
            echo "Unexpected recovery boundary response: HTTP $CODE" >&2
            cat invalid-recovery.json >&2 || true
            exit 1
          }

          MAIL_CODE=$(curl -sS -o mail-ready.json -w '%{http_code}' --max-time 20 \
            "$API/api/wesi/auth/mail-ready" || true)
          case "$MAIL_CODE" in
            200|503) ;;
            *) echo "Unexpected mail readiness response: HTTP $MAIL_CODE" >&2; exit 1 ;;
          esac
          echo "One-time owner recovery is active until $RECOVERY_EXPIRES_AT."
