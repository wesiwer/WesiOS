name: Remove expired owner recovery from production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-owner-recovery-once.yml'

permissions:
  contents: read

concurrency:
  group: wesios-owner-recovery-production
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate clean auth bootstrap
        run: |
          set -euo pipefail
          test -s server/pb_hooks/wesi_auth_bootstrap.pb.js
          node --check server/pb_hooks/wesi_auth_bootstrap.pb.js
          ! grep -q 'wesiOneTimeOwnerRecovery' server/pb_hooks/wesi_auth_bootstrap.pb.js

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy clean auth bootstrap
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE="/tmp/wesi-auth-cleanup-$GITHUB_RUN_ID"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes             server/pb_hooks/wesi_auth_bootstrap.pb.js             "$USER@$HOST:$REMOTE/wesi_auth_bootstrap.pb.js"
          $SSH "$USER@$HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          HOOK=/opt/pocketbase/pb_hooks/wesi_auth_bootstrap.pb.js
          SOURCE="$REMOTE/wesi_auth_bootstrap.pb.js"
          test -s "$SOURCE"
          if [ -w "$HOOK" ]; then
            cat "$SOURCE" > "$HOOK"
            chmod 0644 "$HOOK"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n install -m 0644 "$SOURCE" "$HOOK"
          else
            echo 'No permission to replace auth bootstrap' >&2
            exit 1
          fi
          if [ -r "$HOOK" ]; then cmp -s "$SOURCE" "$HOOK"; else sudo -n cmp -s "$SOURCE" "$HOOK"; fi
          rm -rf "$REMOTE"
          sleep 3
          curl -fsS --max-time 15 http://127.0.0.1:8090/api/health >/dev/null
          REMOTE_SCRIPT

      - name: Verify recovery no longer intercepts normal login
        run: |
          set -euo pipefail
          API='https://api.wesi-inc.ru'
          CODE=$(curl -sS -o response.json -w '%{http_code}' --max-time 20             -X POST -H 'Content-Type: application/json'             -d '{"login":"WesiOff","password":"definitely-invalid-cleanup-check","purpose":"app"}'             "$API/api/wesi/auth/start-v2" || true)
          [ "$CODE" = 400 ] || [ "$CODE" = 401 ]
          ! grep -qi 'временн.*восстанов\|recovery' response.json
          MAIL_CODE=$(curl -sS -o mail-ready.json -w '%{http_code}' --max-time 20             "$API/api/wesi/auth/mail-ready" || true)
          [ "$MAIL_CODE" = 200 ]
          grep -q '"smtpReady":true' mail-ready.json
          echo 'CLEAN_AUTH_BOOTSTRAP_ACTIVE'
