name: Wesi AI tasks v1 finalizer temp

on:
  pull_request:
    branches:
      - agent/org-hierarchy-v1

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'chatgpt/wesi-ai-tasks-v1-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wesi-ai-tasks-v1-20260812
          fetch-depth: 0

      - name: Apply Tasks integration
        run: python3 .github/scripts/wesi_ai_tasks_v1_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format Wesi AI sources
        run: |
          dart format \
            lib/features/tasks/tasks_screen.dart \
            lib/features/tasks/ai \
            test/wesi_ai_task_engine_test.dart

      - name: Verify and capture diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          flutter analyze --no-fatal-infos > .ci/wesi-ai-analyze.log 2>&1
          ANALYZE=$?
          flutter test test/wesi_ai_task_engine_test.dart > .ci/wesi-ai-targeted.log 2>&1
          TARGETED=$?
          flutter test > .ci/wesi-ai-full-test.log 2>&1
          FULL=$?
          printf 'analyze=%s\ntargeted=%s\nfull=%s\n' "$ANALYZE" "$TARGETED" "$FULL" > .ci/wesi-ai-status.txt
          exit 0

      - name: Persist patched source and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/tasks/tasks_screen.dart \
                  lib/features/tasks/ai \
                  test/wesi_ai_task_engine_test.dart \
                  .ci/wesi-ai-analyze.log \
                  .ci/wesi-ai-targeted.log \
                  .ci/wesi-ai-full-test.log \
                  .ci/wesi-ai-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record Wesi AI v1 verification [skip ci]'
            git push origin HEAD:chatgpt/wesi-ai-tasks-v1-20260812
          fi

      - name: Enforce verification result
        shell: bash
        run: |
          source .ci/wesi-ai-status.txt
          test "$analyze" = 0
          test "$targeted" = 0
          test "$full" = 0
