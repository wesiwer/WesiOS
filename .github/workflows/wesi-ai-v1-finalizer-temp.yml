name: Wesi AI tasks v1 finalizer temp

on:
  pull_request:
    branches:
      - agent/org-hierarchy-v1

permissions:
  contents: write

jobs:
  extract-failure:
    if: github.head_ref == 'chatgpt/wesi-ai-tasks-v1-20260812'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wesi-ai-tasks-v1-20260812
          fetch-depth: 0

      - name: Extract failure context from persisted full-suite log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          {
            echo '=== failure-pattern context ==='
            grep -n -E -B 8 -A 24 'FAILED|Failed|failed|ERROR|Error|Exception|Expected:|Actual:|TestFailure|Some tests|Failure|failure|❌' .ci/wesi-ai-full-test.log || true
            echo
            echo '=== final 220 lines ==='
            tail -n 220 .ci/wesi-ai-full-test.log
          } > .ci/wesi-ai-failure-extract.log

      - name: Persist failure extract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .ci/wesi-ai-failure-extract.log
          git commit -m 'ci: extract Wesi AI full-suite failure [skip ci]'
          git push origin HEAD:chatgpt/wesi-ai-tasks-v1-20260812
