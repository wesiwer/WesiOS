name: Wesi AI tasks v1 finalizer temp

on:
  pull_request:
    branches:
      - agent/org-hierarchy-v1

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'chatgpt/wesi-ai-tasks-v1-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wesi-ai-tasks-v1-20260812
          fetch-depth: 0

      - name: Apply Tasks integration
        run: python3 .github/scripts/wesi_ai_tasks_v1_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format Wesi AI sources
        run: |
          dart format \
            lib/features/tasks/tasks_screen.dart \
            lib/features/tasks/ai \
            test/wesi_ai_task_engine_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Wesi AI engine tests
        run: flutter test test/wesi_ai_task_engine_test.dart

      - name: Full test suite
        run: flutter test

      - name: Commit verified product source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/wesi_ai_tasks_v1_patch.py
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(tasks): add intelligent Wesi AI task proposals [skip ci]'
          git push origin HEAD:chatgpt/wesi-ai-tasks-v1-20260812
