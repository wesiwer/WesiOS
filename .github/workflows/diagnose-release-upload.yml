name: Diagnose release upload 0.19.3+51

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Read release staging state
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for d in /tmp/wesios-release-31242160215 /tmp/wesios-emergency-31242965525; do
            echo "--- $d ---"
            if [ -d "$d" ]; then
              find "$d" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            else
              echo 'directory absent'
            fi
          done
          echo '--- published disk manifest ---'
          python3 - <<'PY'
          import json, os
          p='/opt/pocketbase/pb_public/artifacts/app/app-manifest.json'
          if not os.path.exists(p):
              print('manifest absent')
          else:
              with open(p, encoding='utf-8') as f: m=json.load(f)
              print(m.get('version'), m.get('build'))
              for k in ('android','windows'):
                  e=m.get(k,{})
                  print(k, e.get('asset'), e.get('sizeBytes'))
          PY
          echo '--- related processes ---'
          ps -eo pid,etime,comm,args | grep -E '[c]url|[s]ftp|[s]cp|deploy-artifact' | tail -30 || true
          REMOTE

      - name: Read both release run statuses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run in 31242160215 31242965525; do
            echo "--- run $run ---"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
              --jq '.jobs[] | [.name,.status,(.conclusion // "-"),(.steps[]? | select(.status=="in_progress") | .name)] | @tsv'
          done
