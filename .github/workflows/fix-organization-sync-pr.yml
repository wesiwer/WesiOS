name: Observable Organization Sync Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ops/run-organization-sync-repair-20260821'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch client-side organization compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path('lib/core/sync/sync_codec.dart')
          s = p.read_text(encoding='utf-8')

          date_old = "    final createdAt = _date(fields['createdAt']);"
          date_new = "\n".join([
              "    // Legacy PocketBase callbacks used created/updated and could send",
              "    // stale root metadata. The immutable root id is authoritative.",
              "    final createdAt =",
              "        _date(fields['createdAt']) ??",
              "        _date(fields['created']) ??",
              "        _date(fields['updatedAt']) ??",
              "        _date(fields['updated']);",
          ])
          if s.count(date_old) != 1:
              raise SystemExit(f'unexpected createdAt match count: {s.count(date_old)}')
          s = s.replace(date_old, date_new, 1)

          root_old = "\n".join([
              "    final isRoot = fields['isRoot'] == true;",
              "    final parentId = _strOrNull(fields['parentId']);",
              "    if (isRoot != (id == OrganizationModel.rootId)) return null;",
              "    if (isRoot && parentId != null) return null;",
          ])
          root_new = "\n".join([
              "    final canonicalRoot = id == OrganizationModel.rootId;",
              "    // A non-root row may never elevate itself. The canonical root,",
              "    // however, is repaired locally even if a stale server callback",
              "    // still sends isRoot=false or an obsolete parentId.",
              "    if (!canonicalRoot && fields['isRoot'] == true) return null;",
              "    final isRoot = canonicalRoot;",
              "    final parentId = isRoot",
              "        ? null",
              "        : (_strOrNull(fields['parentId']) ?? _strOrNull(fields['parent']));",
          ])
          if s.count(root_old) != 1:
              raise SystemExit(f'unexpected root metadata match count: {s.count(root_old)}')
          s = s.replace(root_old, root_new, 1)

          apply_old = "\n".join([
              "    final b = box();",
              "    final incoming = decode(fields);",
              "    if (b == null || incoming == null) return false;",
          ])
          apply_new = "\n".join([
              "    // A lifecycle transition must not turn a closed Hive box into a",
              "    // fake REMOTE_APPLY_INCOMPLETE data error.",
              "    final b = box() ?? await ensureBox();",
              "    final incoming = decode(fields);",
              "    if (incoming == null) return false;",
          ])
          if s.count(apply_old) != 1:
              raise SystemExit(f'unexpected organization apply match count: {s.count(apply_old)}')
          s = s.replace(apply_old, apply_new, 1)
          p.write_text(s, encoding='utf-8')

          test_b64 = ''
          test_path = Path('test/core/sync/organization_sync_legacy_root_test.dart')
          test_path.write_bytes(base64.b64decode(test_b64))

          p = Path('pubspec.yaml')
          s = p.read_text(encoding='utf-8')
          if s.count('version: 0.22.32+107') != 1:
              raise SystemExit('unexpected pubspec version')
          p.write_text(s.replace('version: 0.22.32+107', 'version: 0.22.33+108', 1), encoding='utf-8')

          p = Path('lib/core/constants/app_version.dart')
          s = p.read_text(encoding='utf-8')
          if s.count("static const String number = '0.22.32';") != 1 or s.count('static const int build = 107;') != 1:
              raise SystemExit('unexpected AppVersion values')
          s = s.replace("static const String number = '0.22.32';", "static const String number = '0.22.33';", 1)
          s = s.replace('static const int build = 107;', 'static const int build = 108;', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Format and verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/core/sync/sync_codec.dart test/core/sync/organization_sync_legacy_root_test.dart
          flutter pub get
          flutter test test/core/sync/organization_sync_legacy_root_test.dart
          flutter test test/core/sync/organization_sync_recovery_test.dart
          flutter test test/core/sync/organization_sync_server_compat_test.dart
          git diff --check

      - name: Commit client repair to main
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Sync Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/sync/sync_codec.dart test/core/sync/organization_sync_legacy_root_test.dart pubspec.yaml lib/core/constants/app_version.dart
          git commit -m 'fix(sync): canonicalize organization root on client'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Redeploy legacy sync hooks and restart PocketBase
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy-sync-hooks.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for i in $(seq 1 80); do
            payload=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-sync-hooks.yml --event workflow_dispatch --branch main --limit 20 --json databaseId,headSha,createdAt,status,conclusion)
            run_id=$(printf '%s' "$payload" | jq -r --arg sha "$PATCH_SHA" --arg since "$since" '[.[] | select(.headSha == $sha and .createdAt >= $since)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          [ -n "$run_id" ] || { echo 'deploy-sync-hooks run not found' >&2; exit 1; }
          echo "deploy run: $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 10
