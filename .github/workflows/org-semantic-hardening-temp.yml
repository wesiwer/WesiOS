name: Organization semantic hardening

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  harden:
    if: github.head_ref == 'agent/org-semantic-hardening-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-v1
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Apply semantic hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # Inter-org linked legs remain in canonical Treasury RUB. Transfer
          # retains each organization's base-currency amount separately.
          p=Path('lib/features/organizations/services/inter_org_transfer_service.dart')
          s=p.read_text(encoding='utf-8')
          if "../../../core/services/currency_service.dart" not in s:
              s=s.replace("import 'package:hive_flutter/hive_flutter.dart';\n", "import 'package:hive_flutter/hive_flutter.dart';\n\nimport '../../../core/services/currency_service.dart';\n")
          if 'final debitRub =' not in s:
              s=s.replace(
                  '    final treasury = TreasuryService();\n',
                  "    final treasury = TreasuryService();\n"
                  "    final debitRub = fromAmount *\n"
                  "        CurrencyService.rateToRub(fromOrg.baseCurrency.toLowerCase());\n"
                  "    final creditRub = toAmount *\n"
                  "        CurrencyService.rateToRub(toOrg.baseCurrency.toLowerCase());\n"
              )
              s=s.replace('      amount: fromAmount,\n      type: TransactionType.expense,', '      amount: debitRub,\n      type: TransactionType.expense,')
              s=s.replace('      amount: toAmount,\n      type: TransactionType.income,', '      amount: creditRub,\n      type: TransactionType.income,')
          p.write_text(s,encoding='utf-8')

          # Recurring cash is a stronger capability than one-off transaction
          # creation: enforce manage_recurring on create/update/delete.
          p=Path('lib/features/treasury/services/treasury_service.dart')
          s=p.read_text(encoding='utf-8')
          marker="""    if (TeamService.current != null &&\n        !await OrganizationAccessService.can(\n          orgId,\n          OrganizationPermissions.createTransactions,\n        )) {\n      throw StateError('create_transactions permission required');\n    }\n"""
          addition=marker+"""    if (tx.isRecurring &&\n        TeamService.current != null &&\n        !await OrganizationAccessService.can(\n          orgId,\n          OrganizationPermissions.manageRecurring,\n        )) {\n      throw StateError('manage_recurring permission required');\n    }\n"""
          if "tx.isRecurring &&\n        TeamService.current" not in s and marker in s:
              s=s.replace(marker,addition,1)
          update_marker="""    if (TeamService.current != null &&\n        !await OrganizationAccessService.can(\n          before.effectiveOrganizationId,\n          OrganizationPermissions.editTransactions,\n        )) {\n      throw StateError('edit_transactions permission required');\n    }\n"""
          update_add=update_marker+"""    if ((before.isRecurring || tx.isRecurring) &&\n        TeamService.current != null &&\n        !await OrganizationAccessService.can(\n          before.effectiveOrganizationId,\n          OrganizationPermissions.manageRecurring,\n        )) {\n      throw StateError('manage_recurring permission required');\n    }\n"""
          if '(before.isRecurring || tx.isRecurring)' not in s and update_marker in s:
              s=s.replace(update_marker,update_add,1)
          delete_marker="""    if (before.interOrgTransferId != null && !allowInterOrg) {\n      throw StateError('inter-org transaction must be cancelled as a transfer');\n    }\n"""
          delete_add=delete_marker+"""    if (before.isRecurring &&\n        TeamService.current != null &&\n        !await OrganizationAccessService.can(\n          before.effectiveOrganizationId,\n          OrganizationPermissions.manageRecurring,\n        )) {\n      throw StateError('manage_recurring permission required');\n    }\n"""
          if 'before.isRecurring &&\n        TeamService.current' not in s and delete_marker in s:
              s=s.replace(delete_marker,delete_add,1)
          p.write_text(s,encoding='utf-8')

          # Tree mutations are not merely hidden in UI: reject them before
          # execution when actor lacks manage_org_settings.
          p=Path('lib/features/organizations/organizations_screen.dart')
          s=p.read_text(encoding='utf-8')
          create_sig='  Future<void> _create({OrganizationModel? parent}) async {\n'
          create_guard="""  Future<void> _create({OrganizationModel? parent}) async {\n    final permissionOrgId =\n        parent?.id ?? OrganizationContext.currentOrganizationId;\n    if (TeamService.current?.isOwner != true &&\n        !await OrganizationAccessService.can(\n          permissionOrgId,\n          OrganizationPermissions.manageOrgSettings,\n        )) {\n      if (mounted) {\n        ScaffoldMessenger.of(context).showSnackBar(\n          const SnackBar(content: Text('Нет права управлять настройками этой организации.')),\n        );\n      }\n      return;\n    }\n"""
          if 'final permissionOrgId =' not in s and create_sig in s:
              s=s.replace(create_sig,create_guard,1)
          action_sig='  Future<void> _action(OrganizationModel org, String action) async {\n'
          action_guard="""  Future<void> _action(OrganizationModel org, String action) async {\n    if ((action == 'archive' || action == 'restore' || action == 'child') &&\n        TeamService.current?.isOwner != true &&\n        !await OrganizationAccessService.can(\n          org.id,\n          OrganizationPermissions.manageOrgSettings,\n        )) {\n      if (mounted) {\n        ScaffoldMessenger.of(context).showSnackBar(\n          const SnackBar(content: Text('Нет права управлять настройками этой организации.')),\n        );\n      }\n      return;\n    }\n"""
          if "action == 'archive' || action == 'restore'" not in s and action_sig in s:
              s=s.replace(action_sig,action_guard,1)
          p.write_text(s,encoding='utf-8')
          PY
          dart format lib >/dev/null
          flutter pub get
          flutter analyze --no-fatal-infos
          rm -f .github/workflows/org-semantic-hardening-temp.yml
          git diff --check
      - name: Commit hardening to product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WesiOS CI Fix"
          git config user.email "actions@users.noreply.github.com"
          git add lib .github/workflows/org-semantic-hardening-temp.yml
          git commit -m "fix(org): enforce financial and tree boundaries"
          git push origin HEAD:agent/org-hierarchy-v1
