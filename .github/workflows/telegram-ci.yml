name: Telegram MVP Gate

on:
  pull_request:
    paths:
      - 'server/pb_hooks/wesi_telegram*.js'
      - 'server/pb_hooks/wesi_ai_finance_tools.js'
      - 'server/pb_hooks/wesi_ai_task_tools.js'
      - 'lib/core/services/telegram_link_service.dart'
      - 'lib/features/profile/telegram_link_screen.dart'
      - 'lib/features/profile/profile_with_telegram.dart'
      - 'lib/core/routes/app_router.dart'
      - 'android/app/src/main/AndroidManifest.xml'
      - '.github/workflows/telegram-ci.yml'
      - '.github/workflows/deploy-wesi-telegram.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Check Telegram server syntax
        run: |
          set -euo pipefail
          for file in \
            server/pb_hooks/wesi_telegram_lib.js \
            server/pb_hooks/wesi_telegram_store.js \
            server/pb_hooks/wesi_telegram_gateway.js \
            server/pb_hooks/wesi_telegram.pb.js \
            server/pb_hooks/wesi_ai_finance_tools.js \
            server/pb_hooks/wesi_ai_task_tools.js; do
            node --check "$file"
          done

      - name: Test pure Telegram policy
        run: node server/pb_hooks/wesi_telegram_lib_test.mjs

      - name: Reject legacy Vercel imports from production gateway
        run: |
          set -euo pipefail
          if grep -R -E '@vercel/postgres|telegram-webhook/' \
              server/pb_hooks/wesi_telegram*.js; then
            echo '::error::Production Telegram gateway must not depend on the legacy Vercel prototype.'
            exit 1
          fi

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test deep-link routing
        run: flutter test test/telegram_deep_link_test.dart
