name: Trigger WesiOS Production Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-production-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch production release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-wesios-production.yml --ref main
      - name: Remove one-shot trigger
        run: |
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/run-production-once.yml
          git commit -m 'ci: remove completed production release trigger'
          git push origin HEAD:main
