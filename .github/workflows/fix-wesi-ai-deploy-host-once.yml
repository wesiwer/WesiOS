name: Fix Wesi AI Deploy Host Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-wesi-ai-deploy-host-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace stale production host
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-wesi-ai.yml')
          text = path.read_text()
          old = 'ai.wesi-wf.su'
          new = 'wesi-ai-178-236-247-194.nip.io'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 stale host references, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          ! grep -F 'ai.wesi-wf.su' .github/workflows/deploy-wesi-ai.yml
          grep -F 'wesi-ai-178-236-247-194.nip.io' .github/workflows/deploy-wesi-ai.yml
      - name: Commit permanent workflow fix
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Ops Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/deploy-wesi-ai.yml
          git commit -m 'fix: use live Wesi AI relay host in production deploy'
          git push origin HEAD:main
