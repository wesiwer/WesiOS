name: Patch security UI once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-security-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/security-2fa-sessions-real-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Patch portal owner enrollment and employee email validation
        shell: python
        run: |
          from pathlib import Path

          portal = Path('server/employee-portal/app.js')
          text = portal.read_text(encoding='utf-8')
          old = """    const body = await request('/api/wesi/auth/start', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ login, password, purpose: 'portal' }),
            }, 20000, false);
            if (!body?.challengeId) throw new Error('Сервер не создал проверку входа');
            state.challengeId = body.challengeId;
            state.maskedEmail = body.maskedEmail || '';
          """
          new = """    let body = await request('/api/wesi/auth/start-v2', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ login, password, purpose: 'portal' }),
            }, 20000, false);
            if (!body?.challengeId) throw new Error('Сервер не создал проверку входа');
            if (body.emailSetupRequired) {
              const proposed = window.prompt(
                'Для старого профиля владельца нужно один раз привязать почту для кодов безопасности. Введите действующую электронную почту:',
                '',
              );
              const email = (proposed || '').trim().toLowerCase();
              if (!email) throw new Error('Почта обязательна для защищённого входа');
              body = await request('/api/wesi/auth/setup-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ challengeId: body.challengeId, email }),
              }, 20000, false);
              if (!body?.challengeId) throw new Error('Не удалось отправить код на эту почту');
            }
            state.challengeId = body.challengeId;
            state.maskedEmail = body.maskedEmail || '';
          """
          if old not in text:
              raise SystemExit('portal beginSignIn pattern not found')
          text = text.replace(old, new, 1)

          old2 = """    state.user = body.record || {};
            persistSession(state.remember);
            els.password.value = '';
          """
          new2 = """    state.user = body.record || {};
            persistSession(state.remember);
            // For the one-time owner migration this commits the address only
            // after the code sent to that address has been verified. For an
            // employee the route returns 403 and is intentionally ignored.
            try {
              await request('/api/wesi/security/confirm-owner-email', {
                method: 'POST',
              }, 5000);
            } catch (_) {}
            els.password.value = '';
          """
          if old2 not in text:
              raise SystemExit('portal verify pattern not found')
          portal.write_text(text.replace(old2, new2, 1), encoding='utf-8')

          editor = Path('lib/features/team/employee_editor_screen.dart')
          text = editor.read_text(encoding='utf-8')
          old3 = """    if (name.isEmpty && _nickCtrl.text.trim().isEmpty) {
              _error(_ru ? 'Введите имя или ник' : 'Enter a name or nickname');
              return;
            }
            setState(() => _saving = true);
          """
          new3 = """    if (name.isEmpty && _nickCtrl.text.trim().isEmpty) {
              _error(_ru ? 'Введите имя или ник' : 'Enter a name or nickname');
              return;
            }
            final email = _emailCtrl.text.trim().toLowerCase();
            if (!TeamService.validEmployeeEmail(email)) {
              _error(_ru
                  ? 'Укажите действующую электронную почту — на неё будут приходить коды входа'
                  : 'Enter a valid email address for sign-in codes');
              return;
            }
            final duplicateEmail = TeamService.byEmail(email);
            if (duplicateEmail != null && duplicateEmail.id != widget.initial?.id) {
              _error(_ru
                  ? 'Эта электронная почта уже используется другим сотрудником'
                  : 'This email is already used by another employee');
              return;
            }
            setState(() => _saving = true);
          """
          if old3 not in text:
              raise SystemExit('employee validation pattern not found')
          text = text.replace(old3, new3, 1)
          text = text.replace('email: _emailCtrl.text,', 'email: email,', 1)
          text = text.replace('email: _emailCtrl.text.trim(),', 'email: email,', 1)
          text = text.replace("? 'Не осталось свободных логинов'\n              : 'No free logins left'", "? 'Не удалось создать сотрудника. Проверьте почту и данные профиля'\n              : 'Unable to create the employee. Check the email and profile data'", 1)
          text = text.replace("_field(_emailCtrl, _ru ? 'Почта' : 'Email',", "_field(_emailCtrl, _ru ? 'Почта *' : 'Email *',", 1)
          editor.write_text(text, encoding='utf-8')

      - name: Commit exact UI integration
        run: |
          set -euo pipefail
          node --check server/employee-portal/app.js
          git diff --check
          git diff -- server/employee-portal/app.js lib/features/team/employee_editor_screen.dart
          test -n "$(git status --porcelain server/employee-portal/app.js lib/features/team/employee_editor_screen.dart)"
          git config user.name 'WesiOS Security CI'
          git config user.email 'actions@users.noreply.github.com'
          git add server/employee-portal/app.js lib/features/team/employee_editor_screen.dart
          git commit -m 'security: finish OTP portal and mandatory email UI'
          git push origin HEAD:${{ github.head_ref }}
