name: Patch security UI once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-security-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/security-2fa-sessions-real-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
          fetch-depth: 1

      - name: Patch final security UI integration
        shell: python
        run: |
          from pathlib import Path

          # Portal: use v2 password step, one-time owner email enrollment, and
          # commit the verified owner email after the OTP session is issued.
          portal = Path('server/employee-portal/app.js')
          text = portal.read_text(encoding='utf-8')
          needle = "const body = await request('/api/wesi/auth/start', {"
          if needle not in text:
              raise SystemExit('portal start route pattern not found')
          text = text.replace(
              needle,
              "let body = await request('/api/wesi/auth/start-v2', {",
              1,
          )
          anchor = "if (!body?.challengeId) throw new Error('Сервер не создал проверку входа');\n    state.challengeId = body.challengeId;"
          enrollment = """if (!body?.challengeId) throw new Error('Сервер не создал проверку входа');
              if (body.emailSetupRequired) {
                const proposed = window.prompt(
                  'Для старого профиля владельца нужно один раз привязать почту для кодов безопасности. Введите действующую электронную почту:',
                  '',
                );
                const email = (proposed || '').trim().toLowerCase();
                if (!email) throw new Error('Почта обязательна для защищённого входа');
                body = await request('/api/wesi/auth/setup-email', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ challengeId: body.challengeId, email }),
                }, 20000, false);
                if (!body?.challengeId) throw new Error('Не удалось отправить код на эту почту');
              }
              state.challengeId = body.challengeId;"""
          if anchor not in text:
              raise SystemExit('portal challenge anchor not found')
          text = text.replace(anchor, enrollment, 1)
          confirm_anchor = "state.user = body.record || {};\n    persistSession(state.remember);\n    els.password.value = '';"
          confirm = """state.user = body.record || {};
              persistSession(state.remember);
              try {
                await request('/api/wesi/security/confirm-owner-email', {
                  method: 'POST',
                }, 5000);
              } catch (_) {}
              els.password.value = '';"""
          if confirm_anchor not in text:
              raise SystemExit('portal verified-session anchor not found')
          portal.write_text(text.replace(confirm_anchor, confirm, 1), encoding='utf-8')

          # Employee editor: email is mandatory, valid and unique before any
          # local/server write. The visible label also marks it as required.
          editor = Path('lib/features/team/employee_editor_screen.dart')
          text = editor.read_text(encoding='utf-8')
          anchor = """if (name.isEmpty && _nickCtrl.text.trim().isEmpty) {
                _error(_ru ? 'Введите имя или ник' : 'Enter a name or nickname');
                return;
              }
              setState(() => _saving = true);"""
          replacement = """if (name.isEmpty && _nickCtrl.text.trim().isEmpty) {
                _error(_ru ? 'Введите имя или ник' : 'Enter a name or nickname');
                return;
              }
              final email = _emailCtrl.text.trim().toLowerCase();
              if (!TeamService.validEmployeeEmail(email)) {
                _error(_ru
                    ? 'Укажите действующую электронную почту — на неё будут приходить коды входа'
                    : 'Enter a valid email address for sign-in codes');
                return;
              }
              final duplicateEmail = TeamService.byEmail(email);
              if (duplicateEmail != null && duplicateEmail.id != widget.initial?.id) {
                _error(_ru
                    ? 'Эта электронная почта уже используется другим сотрудником'
                    : 'This email is already used by another employee');
                return;
              }
              setState(() => _saving = true);"""
          if anchor not in text:
              raise SystemExit('employee save anchor not found')
          text = text.replace(anchor, replacement, 1)
          text = text.replace('email: _emailCtrl.text,', 'email: email,', 1)
          text = text.replace('email: _emailCtrl.text.trim(),', 'email: email,', 1)
          text = text.replace(
              "? 'Не осталось свободных логинов'\n              : 'No free logins left'",
              "? 'Не удалось создать сотрудника. Проверьте почту и данные профиля'\n              : 'Unable to create the employee. Check the email and profile data'",
              1,
          )
          text = text.replace(
              "_field(_emailCtrl, _ru ? 'Почта' : 'Email',",
              "_field(_emailCtrl, _ru ? 'Почта *' : 'Email *',",
              1,
          )
          editor.write_text(text, encoding='utf-8')

          # First owner migration: bootstrap still sees the legacy @wesi.local
          # auth email during the same request. Use the email that was just
          # proven by the OTP response when constructing local identity.
          service = Path('lib/features/team/services/portal_account_service.dart')
          text = service.read_text(encoding='utf-8')
          anchor = """final bootstrapJson = _map(bootstrapText);
              final identity = bootstrapJson == null ? null : PortalAppIdentity.tryParse(bootstrapJson);"""
          replacement = """final bootstrapJson = _map(bootstrapText);
              final verifiedRecord = verifyJson?['record'];
              if (bootstrapJson != null &&
                  bootstrapJson['owner'] == true &&
                  verifiedRecord is Map) {
                final verifiedEmail = '${verifiedRecord['email'] ?? ''}'.trim().toLowerCase();
                if (validSecurityEmail(verifiedEmail)) {
                  bootstrapJson['email'] = verifiedEmail;
                }
              }
              final identity = bootstrapJson == null
                  ? null
                  : PortalAppIdentity.tryParse(bootstrapJson);"""
          if anchor not in text:
              raise SystemExit('owner identity anchor not found')
          service.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

      - name: Commit exact UI integration
        run: |
          set -euo pipefail
          node --check server/employee-portal/app.js
          git diff --check
          git diff -- server/employee-portal/app.js lib/features/team/employee_editor_screen.dart lib/features/team/services/portal_account_service.dart
          test -n "$(git status --porcelain server/employee-portal/app.js lib/features/team/employee_editor_screen.dart lib/features/team/services/portal_account_service.dart)"
          git config user.name 'WesiOS Security CI'
          git config user.email 'actions@users.noreply.github.com'
          git add server/employee-portal/app.js lib/features/team/employee_editor_screen.dart lib/features/team/services/portal_account_service.dart
          git commit -m 'security: finish OTP portal and mandatory email UI'
          git push origin HEAD:${{ github.head_ref }}
