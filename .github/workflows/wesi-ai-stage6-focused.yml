name: Validate Wesi AI Stage 6 local runtime

on:
  push:
    branches:
      - agent/wesi-ai-stage6-local-runtime

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage6-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage6-local-runtime
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Apply local runtime hardening
        run: python tool/wesi_ai_stage6_hardening_apply.py
      - name: Format Stage 6 sources
        run: >-
          dart format
          lib/features/ai/runtime/wesi_local_runtime_models.dart
          lib/features/ai/runtime/wesi_local_runtime_policy.dart
          lib/features/ai/runtime/wesi_local_runtime_executor.dart
          lib/features/ai/runtime/wesi_local_workspace.dart
          test/wesi_local_runtime_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Local runtime security tests
        run: flutter test test/wesi_local_runtime_test.dart
      - name: Commit validated hardening and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wesi-ai-stage6-focused.yml tool/wesi_ai_stage6_hardening_apply.py
          git add lib/features/ai/runtime test/wesi_local_runtime_test.dart
          git commit -m "feat(ai): harden controlled local runtime"
          git push origin HEAD:agent/wesi-ai-stage6-local-runtime
