name: Rotate PocketBase token secrets once

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Rotate signing secrets without printing them
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          SENTINEL="$HOME/.wesi-auth-token-secrets-rotated-20260808"
          HOOK=/opt/pocketbase/pb_hooks/employee_portal.pb.js

          if [ -f "$SENTINEL" ]; then
            echo 'PocketBase token secrets already rotated.'
            exit 0
          fi
          [ -w "$HOOK" ] || {
            echo 'Existing PocketBase hook is not writable by deploy user.' >&2
            exit 3
          }

          ROUTE_TOKEN=$(openssl rand -hex 32)
          BACKUP=$(mktemp)
          cp "$HOOK" "$BACKUP"
          cleanup() {
            cp "$BACKUP" "$HOOK" 2>/dev/null || true
            rm -f "$BACKUP"
          }
          trap cleanup EXIT

          cat >> "$HOOK" <<EOF

          routerAdd("POST", "/__wesi_security_rotate_${ROUTE_TOKEN}", (e) => {
            const collection = e.app.findCollectionByNameOrId("users");
            collection.authToken.secret = \$security.randomString(50);
            collection.passwordResetToken.secret = \$security.randomString(50);
            collection.emailChangeToken.secret = \$security.randomString(50);
            collection.verificationToken.secret = \$security.randomString(50);
            collection.fileToken.secret = \$security.randomString(50);
            e.app.save(collection);
            return e.json(200, {"ok": true});
          });
          EOF

          sleep 3
          RESPONSE=$(curl -fsS --max-time 10 -X POST \
            "http://127.0.0.1:8090/__wesi_security_rotate_${ROUTE_TOKEN}")
          printf '%s' "$RESPONSE" | grep -q '"ok":true'

          # Restore production hook immediately; changing it triggers another
          # PocketBase reload and removes the one-time route.
          cp "$BACKUP" "$HOOK"
          rm -f "$BACKUP"
          trap - EXIT
          touch "$SENTINEL"
          sleep 2
          echo 'PocketBase token signing secrets rotated successfully.'
          REMOTE
