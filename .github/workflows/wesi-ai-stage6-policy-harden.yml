name: Harden Wesi Local Runtime Policy

on:
  push:
    branches:
      - agent/wesi-ai-stage6-local-runtime

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage6-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage6-local-runtime
      - name: Apply policy hardening
        run: python tool/wesi_ai_stage6_policy_harden.py
      - name: Remove one-shot files
        run: |
          rm tool/wesi_ai_stage6_policy_harden.py
          rm .github/workflows/wesi-ai-stage6-policy-harden.yml
      - name: Commit policy hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ai): harden local workspace and SSRF policy"
          git push origin HEAD:agent/wesi-ai-stage6-local-runtime
