name: Build WesiOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Wipe broken Windows platform stub
        shell: pwsh
        run: |
          if (Test-Path windows) {
            Remove-Item -Recurse -Force windows
          }

      - name: Regenerate Windows platform files
        run: flutter create --platforms=windows --project-name=wesios .

      - name: Restore custom Windows icon
        shell: pwsh
        run: |
          if (Test-Path assets/images/app_icon.ico) {
            Copy-Item assets/images/app_icon.ico windows/runner/resources/app_icon.ico -Force
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle Python runtime for the SARIMAX forecast engine
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyVersion = "3.11.9"
          $releaseDir = "build\windows\x64\runner\Release"

          # Embeddable distribution — портативный, без инсталлятора/реестра,
          # ровно то, что можно скопировать рядом с exe и запускать оттуда.
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath python_runtime -Force

          # Embeddable-сборка по умолчанию отключает site-packages — включаем
          # и явно прописываем путь, где будет лежать statsmodels/numpy/pandas.
          $pthFile = Get-ChildItem python_runtime\python*._pth | Select-Object -First 1
          (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName
          Add-Content $pthFile.FullName "`nLib\site-packages"

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & python_runtime\python.exe get-pip.py --no-warn-script-location

          # Только SARIMAX-стек (statsmodels+numpy+pandas, ~350 МБ, чистые
          # wheels без компиляции). Prophet сюда осознанно НЕ входит — его
          # стек с CmdStan весит ~1.7 ГБ и требует C++ компиляции модели;
          # решение по нему ждёт отдельного подтверждения (см. STATUS.md).
          # forecast_prophet.py остаётся в бандле (см. ниже) и корректно
          # сообщит "недоступен", если модуль prophet не установлен —
          # ExternalForecastBridge такое падение уже обрабатывает как null.
          & python_runtime\python.exe -m pip install --no-warn-script-location numpy pandas statsmodels

          Copy-Item python_runtime "$releaseDir\python" -Recurse -Force
          Copy-Item python_engines "$releaseDir\python_engines" -Recurse -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WesiOS-Windows
          path: build/windows/x64/runner/Release/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Create dummy google-services.json
        run: |
          mkdir -p android/app
          echo '{
            "project_info": {
              "project_number": "123456789",
              "project_id": "wesios-d7b07",
              "storage_bucket": "wesios-d7b07.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abc123",
                "android_client_info": { "package_name": "com.wesi.wesios" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "dummy-key" }],
              "services": {
                "appinvite_service": { "other_platform_oauth_client": [] }
              }
            }],
            "configuration_version": "1"
          }' > android/app/google-services.json

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: r25b

      - name: Build APK
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4G -Dorg.gradle.daemon=false'
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WesiOS-Android
          path: build/app/outputs/flutter-apk/app-release.apk
