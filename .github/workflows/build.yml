name: Build WesiOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Wipe broken Windows platform stub
        shell: pwsh
        run: |
          if (Test-Path windows) {
            Remove-Item -Recurse -Force windows
          }

      - name: Regenerate Windows platform files
        run: flutter create --platforms=windows --project-name=wesios .

      - name: Restore custom Windows icon
        shell: pwsh
        run: |
          if (Test-Path assets/images/app_icon.ico) {
            Copy-Item assets/images/app_icon.ico windows/runner/resources/app_icon.ico -Force
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WesiOS-Windows
          path: build/windows/x64/runner/Release/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Create dummy google-services.json
        run: |
          mkdir -p android/app
          echo '{
            "project_info": {
              "project_number": "123456789",
              "project_id": "wesios-d7b07",
              "storage_bucket": "wesios-d7b07.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abc123",
                "android_client_info": { "package_name": "com.wesi.wesios" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "dummy-key" }],
              "services": {
                "appinvite_service": { "other_platform_oauth_client": [] }
              }
            }],
            "configuration_version": "1"
          }' > android/app/google-services.json

      - name: Build APK
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4G -Dorg.gradle.daemon=false'
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WesiOS-Android
          path: build/app/outputs/flutter-apk/app-release.apk
