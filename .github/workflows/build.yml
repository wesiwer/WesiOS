name: Build WesiOS

# ГДЕ СОБИРАЕТСЯ
#
# По умолчанию — на машинах GitHub. Пока репозиторий открыт, они бесплатны и
# безлимитны. У закрытого репозитория счётчик включается, и Windows считается
# по двойному тарифу: сборка Windows идёт 6 минут, а списывается 12.
#
# Чтобы перенести сборку на свой компьютер, достаточно завести переменную
# репозитория (Settings → Secrets and variables → Actions → Variables):
#
#   RUNNER_WINDOWS = wesios-laptop
#   RUNNER_LINUX   = wesios-laptop   (необязательно, см. tools/RUNNER.md)
#
# Переменная не задана — работает как раньше. Ноутбук выключен — достаточно
# стереть переменную, и сборка снова уйдёт на GitHub. Настройка целиком в
# tools/RUNNER.md, скрипт установки — tools/setup-runner.ps1.

# СБОРКА ТОЛЬКО ПО КОМАНДЕ
#
# Здесь был `push` — и каждая отправка в main запускала полную сборку на 20
# минут квоты. За время работы репозиторий набрал 624 прогона; на закрытом
# репозитории это одиннадцать тысяч минут при лимите 2000 в месяц.
#
# Договорённость «собираем только с разрешения» существовала и раньше, но
# держалась на том, что о ней помнят. Правило, которое надо помнить, — не
# правило. Теперь сборку нельзя запустить иначе как руками:
# Actions → Build WesiOS → Run workflow.
#
# Вернуть автоматическую сборку — дописать сюда `push:`. Одна строка, но
# перед этим стоит посмотреть на счётчик минут.
on:
  workflow_dispatch:

# Новый запуск отменяет предыдущий на той же ветке.
#
# Без этого три отправки подряд дают три полные сборки, из которых нужна
# последняя: две первые досчитываются до конца и списывают по 20 минут за
# результат, который никто не увидит.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Быстрая проверка перед дорогими сборками.
  #
  # Идёт на Linux (одинарный тариф) три минуты. Если код не компилируется или
  # падают тесты, Windows и Android даже не начнутся — сломанный коммит
  # обойдётся в 3 минуты вместо 20. В этом репозитории CI однажды был красным
  # тридцать прогонов подряд; тридцать раз по семнадцать сэкономленных минут
  # — это пятьсот минут, четверть месячной квоты.
  check:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # `--no-fatal-infos` намеренно. Без него `flutter analyze` возвращает
      # ненулевой код на подсказках вроде «этот конструктор можно сделать
      # const» — и проверка падала бы всегда, на любом коммите. Ворота,
      # которые закрыты постоянно, перестают что-либо значить: их обходят.
      #
      # Ошибки и предупреждения при этом остаются смертельными, и репозиторий
      # сейчас чист по обоим.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  build-windows:
    needs: check
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-2022' }}
    # Предел по умолчанию — 360 минут. Зависшая задача на Windows съела бы
    # 720 минут квоты (двойной тариф) — треть месяца за один раз. Сборка
    # идёт шесть минут, получаса хватает с четырёхкратным запасом.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Wipe broken Windows platform stub
        shell: pwsh
        run: |
          if (Test-Path windows) {
            Remove-Item -Recurse -Force windows
          }

      - name: Regenerate Windows platform files
        run: flutter create --platforms=windows --project-name=wesios .

      - name: Restore custom Windows icon
        shell: pwsh
        run: |
          if (Test-Path assets/images/app_icon.ico) {
            Copy-Item assets/images/app_icon.ico windows/runner/resources/app_icon.ico -Force
          }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: WesiOS-Windows
          path: build/windows/x64/runner/Release/
          # Срок хранения указан явно, а не оставлен по умолчанию (90 дней).
          # У закрытого репозитория хранилище Actions — 500 МБ, а один прогон
          # кладёт туда около 39 МБ. За девяносто дней это переполнилось бы
          # после дюжины сборок, и следующая упала бы уже на выгрузке — то
          # есть после того, как всё собралось.
          #
          # Три дня хватает, чтобы забрать сборку руками. Настоящий канал
          # раздачи — GitHub Release (release-app.yml), его ассеты в этот
          # лимит не входят.
          retention-days: 1

  build-android:
    needs: check
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          # temurin, а не zulu: именно на нём собирается релизный APK.
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      # Настоящий google-services.json лежит в репозитории. Раньше этот шаг
      # затирал его через `>`, и в каждом APK оказывался проект wesios-dummy:
      # Firebase не работал ни в одной выпущенной сборке. Заглушка нужна
      # только там, где файла нет вовсе, иначе Gradle не соберёт проект.
      #
      # `shell: bash` указан явно: без него на Windows-раннере шаг ушёл бы в
      # PowerShell, где `[ -f ... ]` — не условие, а ошибка. Этот job должен
      # уметь работать и на ноутбуке.
      - name: Ensure google-services.json exists
        shell: bash
        run: |
          if [ -f android/app/google-services.json ]; then
            echo "Использую настоящий google-services.json из репозитория"
            exit 0
          fi
          echo "Настоящего конфига нет — кладу заглушку, Firebase работать не будет"
          mkdir -p android/app
          echo '{
            "project_info": {
              "project_number": "123456789",
              "project_id": "wesios-d7b07",
              "storage_bucket": "wesios-d7b07.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789:android:abc123",
                "android_client_info": { "package_name": "com.wesi.wesios" }
              },
              "oauth_client": [],
              "api_key": [{ "current_key": "dummy-key" }],
              "services": {
                "appinvite_service": { "other_platform_oauth_client": [] }
              }
            }],
            "configuration_version": "1"
          }' > android/app/google-services.json

      # Без `ndk-version`. С ним действие переустанавливает состав SDK, и
      # платформа 35 из него пропадает: Gradle падает с «compileSdkVersion is
      # not specified», хотя в android/app/build.gradle она прописана явно.
      # Сообщение уводит в сторону — искать надо не в build.gradle.
      #
      # Ровно такой шаг, без параметров, собирает и подписывает релизный APK
      # в release-app.yml. NDK нужной версии AGP дотягивает сам.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4G -Dorg.gradle.daemon=false'
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WesiOS-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1
