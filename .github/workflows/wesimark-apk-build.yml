name: WesiMark 2.4.1 Verified Build

on:
  push:
    branches:
      - 'wesimark/apk-build-v2.4.0'
    paths:
      - '.github/workflows/wesimark-apk-build.yml'
      - '.wesimark-apk/patch_wesimark_2_4_1.py'
  pull_request:
    branches:
      - 'wesimark/apk-build-v2.4.0'
    paths:
      - '.wesimark-apk/build-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SIGNER_SHA256: 99996fc482731b32a8a38a6359fc51a831156a05957fe9f5291ac1b58b217810
  EXPECTED_LAUNCHER_SHA256: a3e6a99a6e58179d5bf9bd27b80667cae065553e5f38f676876a67ff0933699a
  SOURCE_DRIVE_ID: 1ScMR7JUANdpGTha1hqUN-IXAh9UlVTvy
  VERSION_NAME: 2.4.1
  VERSION_CODE: '15'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "::error::$name is not available"; exit 1; }
          done
          KEYSTORE="$RUNNER_TEMP/wesimark-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          STORE_PASS=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          KEY_PASS=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '[:space:]')
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null
          ACTUAL=$(keytool -exportcert -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS" | sha256sum | awk '{print $1}')
          echo "Signer SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_SIGNER_SHA256" || { echo "::error::Unexpected signer"; exit 1; }
          {
            echo "WESIMARK_KEYSTORE=$KEYSTORE"
            echo "WESIMARK_STORE_PASS=$STORE_PASS"
            echo "WESIMARK_KEY_ALIAS=$ALIAS"
            echo "WESIMARK_KEY_PASS=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Download clean WesiMark 2.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet gdown
          python3 -m gdown "$SOURCE_DRIVE_ID" -O /tmp/WesiMark-source.zip
          unzip -t /tmp/WesiMark-source.zip >/dev/null
          rm -rf /tmp/wesimark-src
          mkdir -p /tmp/wesimark-src
          unzip -q /tmp/WesiMark-source.zip -d /tmp/wesimark-src
          ROOT="$(find /tmp/wesimark-src -name pubspec.yaml -type f -printf '%h\n' | head -n1)"
          test -n "$ROOT"
          grep -q '^version: 2.4.0+14$' "$ROOT/pubspec.yaml"
          test -f "$ROOT/lib/main.dart"
          echo "WESIMARK_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Apply 2.4.1 pairing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .wesimark-apk/patch_wesimark_2_4_1.py "$WESIMARK_ROOT"
          grep -q '^version: 2.4.1+15$' "$WESIMARK_ROOT/pubspec.yaml"
          grep -q '_primeVsonSecurityForPairing' "$WESIMARK_ROOT/lib/data/repo/printer_service.dart"
          ! grep -q '_triggerVsonSecurityPairing' "$WESIMARK_ROOT/lib/data/repo/printer_service.dart"

      - name: Verify Android identity and original launcher
        shell: bash
        run: |
          set -euo pipefail
          cd "$WESIMARK_ROOT"
          grep -q 'applicationId = "ru.wesi.wesimark"' android/app/build.gradle.kts
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          ICON=$(sha256sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | awk '{print $1}')
          echo "Launcher SHA-256: $ICON"
          test "$ICON" = "$EXPECTED_LAUNCHER_SHA256"
          cat > android/key.properties <<EOF
          storeFile=$WESIMARK_KEYSTORE
          storePassword=$WESIMARK_STORE_PASS
          keyAlias=$WESIMARK_KEY_ALIAS
          keyPassword=$WESIMARK_KEY_PASS
          EOF

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: ${{ env.WESIMARK_ROOT }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.WESIMARK_ROOT }}
        run: flutter analyze

      - name: Run tests
        working-directory: ${{ env.WESIMARK_ROOT }}
        run: flutter test

      - name: Build ARM64 release APK
        working-directory: ${{ env.WESIMARK_ROOT }}
        run: >-
          flutter build apk --release --split-per-abi
          --target-platform android-arm64
          --build-name "$VERSION_NAME"
          --build-number "$VERSION_CODE"

      - name: Verify APK package version signature and launcher source
        shell: bash
        run: |
          set -euo pipefail
          APK="$WESIMARK_ROOT/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ru.wesi.wesimark' versionCode='15' versionName='2.4.1'" /tmp/badging.txt
          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/build-artifacts/WesiMark-2.4.1+15-arm64-v8a.apk"
          {
            echo "WesiMark 2.4.1+15"
            echo "package=ru.wesi.wesimark"
            echo "signer_sha256=$EXPECTED_SIGNER_SHA256"
            echo "launcher_sha256=$EXPECTED_LAUNCHER_SHA256"
            sha256sum "$GITHUB_WORKSPACE/build-artifacts/WesiMark-2.4.1+15-arm64-v8a.apk"
          } > "$GITHUB_WORKSPACE/build-artifacts/VERIFICATION.txt"

      - name: Package patched source
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$WESIMARK_ROOT/android/key.properties"
          rm -rf "$WESIMARK_ROOT/build" "$WESIMARK_ROOT/.dart_tool"
          (cd "$WESIMARK_ROOT" && zip -qr "$GITHUB_WORKSPACE/build-artifacts/WesiMark-2.4.1+15-source.zip" . -x '.git/*')
          test -s "$GITHUB_WORKSPACE/build-artifacts/WesiMark-2.4.1+15-source.zip"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: WesiMark-2.4.1+15-verified
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 30
