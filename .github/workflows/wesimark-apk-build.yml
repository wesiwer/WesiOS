name: WesiMark APK Build

on:
  push:
    branches:
      - 'wesimark/apk-build-v2.4.0'
    paths:
      - '.github/workflows/wesimark-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify published APK
        shell: bash
        run: |
          set -euo pipefail
          test -f build-artifacts/WesiMark-2.4.0+14.apk
          SIZE=$(stat -c%s build-artifacts/WesiMark-2.4.0+14.apk)
          echo "APK size: $SIZE bytes"
          test "$SIZE" -eq 75750373
          sha256sum build-artifacts/WesiMark-2.4.0+14.apk
