name: WesiMark APK Build

on:
  push:
    branches:
      - 'wesimark/apk-build-v2.4.0'
    paths:
      - '.github/workflows/wesimark-apk-build.yml'
  pull_request:
    branches:
      - 'wesimark/apk-build-v2.4.0'
    paths:
      - '.wesimark-apk/original-android-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_WESIMARK_CERT_SHA256: dfd466f3185f21b02ade358f1dc3792e404365ba3cde54b4b20163e8d031846a
  EXPECTED_LAUNCHER_XXXHDPI_SHA256: a3e6a99a6e58179d5bf9bd27b80667cae065553e5f38f676876a67ff0933699a

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate available signing key against WesiMark 2.3
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "::error::$name is not available"; exit 1; }
          done
          KEYSTORE="$RUNNER_TEMP/wesimark-candidate.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          STORE_PASS=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          KEY_PASS=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '[:space:]')
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null
          ACTUAL_CERT=$(keytool -exportcert -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS" | sha256sum | awk '{print $1}')
          echo "Candidate signer SHA-256: $ACTUAL_CERT"
          echo "Required WesiMark SHA-256: $EXPECTED_WESIMARK_CERT_SHA256"
          test "$ACTUAL_CERT" = "$EXPECTED_WESIMARK_CERT_SHA256" || {
            echo "::error::Available GitHub signing key is NOT the original WesiMark key"
            exit 1
          }
          {
            echo "WESIMARK_KEYSTORE=$KEYSTORE"
            echo "WESIMARK_STORE_PASS=$STORE_PASS"
            echo "WESIMARK_KEY_ALIAS=$ALIAS"
            echo "WESIMARK_KEY_PASS=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Download original WesiMark source
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1ScMR7JUANdpGTha1hqUN-IXAh9UlVTvy&export=download&confirm=t'
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o /tmp/WesiMark-source.zip
          unzip -t /tmp/WesiMark-source.zip >/dev/null
          rm -rf /tmp/wesimark-original
          mkdir -p /tmp/wesimark-original
          unzip -q /tmp/WesiMark-source.zip -d /tmp/wesimark-original
          ROOT="$(find /tmp/wesimark-original -name pubspec.yaml -type f -printf '%h\n' | head -n1)"
          test -n "$ROOT"
          echo "WESIMARK_ROOT=$ROOT" >> "$GITHUB_ENV"
          grep -q '^version: 2.4.0+14$' "$ROOT/pubspec.yaml"
          test -f "$ROOT/lib/main.dart"

      - name: Verify original WesiMark Android identity and install signing config
        shell: bash
        run: |
          set -euo pipefail
          cd "$WESIMARK_ROOT"
          grep -q 'applicationId = "ru.wesi.wesimark"' android/app/build.gradle.kts
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml
          ACTUAL_ICON=$(sha256sum android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png | awk '{print $1}')
          echo "Launcher SHA-256: $ACTUAL_ICON"
          test "$ACTUAL_ICON" = "$EXPECTED_LAUNCHER_XXXHDPI_SHA256"
          cat > android/key.properties <<EOF
          storeFile=$WESIMARK_KEYSTORE
          storePassword=$WESIMARK_STORE_PASS
          keyAlias=$WESIMARK_KEY_ALIAS
          keyPassword=$WESIMARK_KEY_PASS
          EOF

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: ${{ env.WESIMARK_ROOT }}
        run: flutter pub get

      - name: Build release APK from original Android project
        working-directory: ${{ env.WESIMARK_ROOT }}
        run: flutter build apk --release --build-name=2.4.0 --build-number=14

      - name: Verify package and original WesiMark signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$WESIMARK_ROOT/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          grep -qi "certificate SHA-256 digest: $EXPECTED_WESIMARK_CERT_SHA256" /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='ru.wesi.wesimark'" /tmp/badging.txt
          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/build-artifacts/WesiMark-2.4.0+14.apk"
          sha256sum "$GITHUB_WORKSPACE/build-artifacts/WesiMark-2.4.0+14.apk"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WesiMark-2.4.0+14-verified
          path: build-artifacts/WesiMark-2.4.0+14.apk
          if-no-files-found: error
          retention-days: 14
