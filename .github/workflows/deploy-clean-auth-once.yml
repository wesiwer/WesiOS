name: Deploy clean WesiOS auth once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-clean-auth-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate clean hook
        run: |
          set -euo pipefail
          test -s server/pb_hooks/wesi_auth_bootstrap.pb.js
          node --check server/pb_hooks/wesi_auth_bootstrap.pb.js
          ! grep -q 'wesiOneTimeOwnerRecovery' server/pb_hooks/wesi_auth_bootstrap.pb.js
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Replace temporary hook
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE="/tmp/wesi-clean-auth-$GITHUB_RUN_ID"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes server/pb_hooks/wesi_auth_bootstrap.pb.js "$USER@$HOST:$REMOTE/clean.pb.js"
          $SSH "$USER@$HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail
          SOURCE="$REMOTE/clean.pb.js"
          HOOK=/opt/pocketbase/pb_hooks/wesi_auth_bootstrap.pb.js
          test -s "$SOURCE"
          if [ -w "$HOOK" ]; then
            cat "$SOURCE" > "$HOOK"
            chmod 0644 "$HOOK"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
            sudo -n install -m 0644 "$SOURCE" "$HOOK"
          else
            exit 30
          fi
          if [ -r "$HOOK" ]; then cmp -s "$SOURCE" "$HOOK"; else sudo -n cmp -s "$SOURCE" "$HOOK"; fi
          rm -rf "$REMOTE"
          sleep 5
          curl -fsS --max-time 15 http://127.0.0.1:8090/api/health >/dev/null
          REMOTE
      - name: Verify production
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o response.json -w '%{http_code}' --max-time 20 -X POST -H 'Content-Type: application/json' -d '{"login":"WesiOff","password":"definitely-invalid-cleanup-check","purpose":"app"}' https://api.wesi-inc.ru/api/wesi/auth/start-v2 || true)
          case "$CODE" in 400|401) ;; *) cat response.json; exit 1;; esac
          ! grep -Eqi 'временн.*восстанов|recovery' response.json
          curl -fsS --max-time 20 https://api.wesi-inc.ru/api/wesi/auth/mail-ready | grep -q '"smtpReady":true'
          echo CLEAN_AUTH_ACTIVE
