name: Patch AI chat UI v4 once

on:
  push:
    paths:
      - '.github/workflows/patch-ai-chat-ui-v4-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-chat-ui-hardening-v4
          token: ${{ github.token }}
      - name: Patch current V2 without replacing Projects or attachments
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/ai/ai_assistant_v2_screen.dart')
          text = p.read_text(encoding='utf-8')

          marker = "import 'package:file_picker/file_picker.dart';\n"
          assert marker in text
          text = text.replace(marker, "import 'dart:async';\n\n" + marker, 1)

          marker = "import 'wesi_ai_handoff_controller.dart';\n"
          assert marker in text
          text = text.replace(marker, marker + "import 'wesi_ai_chat_ui.dart';\n", 1)

          old = """  String _voicePrefix = '';
            WesiAiVoiceSession? _session;
          """
          new = """  String _voicePrefix = '';
            WesiAiVoiceSession? _session;
            DateTime? _sendingSince;
            Timer? _sendingTicker;
            bool _creatingInitial = false;
          """
          assert old in text, 'state fields marker missing'
          text = text.replace(old, new, 1)

          old = """  void _refresh() {
            if (mounted) setState(() {});
          }
          """
          new = """  void _refresh() {
            final controller = _controller;
            if (controller != null && !controller.loading) {
              if (WesiAiChatUi.shouldCreateInitialConversation(controller.state) && !_creatingInitial) {
                _creatingInitial = true;
                unawaited(
                  controller.createConversation(WesiAiPersona.zane).whenComplete(() {
                    _creatingInitial = false;
                    if (mounted) setState(() {});
                  }),
                );
              }
              _syncSendingClock(controller.sending);
            }
            if (mounted) setState(() {});
          }

          void _syncSendingClock(bool sending) {
            if (sending) {
              if (_sendingSince != null) return;
              _sendingSince = DateTime.now();
              _sendingTicker ??= Timer.periodic(const Duration(seconds: 1), (_) {
                if (mounted) setState(() {});
              });
              return;
            }
            _sendingSince = null;
            _sendingTicker?.cancel();
            _sendingTicker = null;
          }
          """
          assert old in text, 'refresh marker missing'
          text = text.replace(old, new, 1)

          old = """    _voice.removeListener(_onVoiceChanged);
            _voice.dispose();
            _composer.dispose();
          """
          new = """    _voice.removeListener(_onVoiceChanged);
            _voice.dispose();
            _sendingTicker?.cancel();
            _composer.dispose();
          """
          assert old in text, 'dispose marker missing'
          text = text.replace(old, new, 1)

          old = """            items: const [
                  DropdownMenuItem(value: WesiAiTier.fast, child: Text('Wesi AI Быстрый')),
                  DropdownMenuItem(value: WesiAiTier.pro, child: Text('Wesi AI Pro')),
                  DropdownMenuItem(value: WesiAiTier.maximum, child: Text('Wesi AI Максимальный')),
                ],
          """
          new = """            items: WesiAiTier.values
                    .map((tier) => DropdownMenuItem<WesiAiTier>(
                          value: tier,
                          child: Text('Wesi AI ${WesiAiChatUi.tierLabel(tier)}'),
                        ))
                    .toList(growable: false),
          """
          assert old in text, 'tier menu marker missing'
          text = text.replace(old, new, 1)

          old = """    if (active == null) {
              return Center(
                child: Text(
                  controller.state.activeProject == null
                      ? 'Создайте чат или выберите проект'
                      : 'Создайте чат внутри проекта «${controller.state.activeProject!.title}»',
                ),
              );
            }
          """
          new = """    if (active == null) {
              if (_creatingInitial) {
                return const Center(child: CircularProgressIndicator());
              }
              return Center(
                child: Text(
                  controller.state.activeProject == null
                      ? 'Создайте чат или выберите проект'
                      : 'Создайте чат внутри проекта «${controller.state.activeProject!.title}»',
                ),
              );
            }
          """
          assert old in text, 'active null marker missing'
          text = text.replace(old, new, 1)

          old = """          child: messages.isEmpty
                  ? const Center(child: Text('История этого чата хранится локально'))
                  : ListView.builder(
          """
          new = """          child: messages.isEmpty
                  ? _emptyConversationState(active)
                  : ListView.builder(
          """
          assert old in text, 'empty state marker missing'
          text = text.replace(old, new, 1)

          old = """        if (controller.sending) const LinearProgressIndicator(),
          """
          new = """        if (controller.sending) _sendingStatus(),
          """
          assert old in text, 'sending indicator marker missing'
          text = text.replace(old, new, 1)

          marker = """  Widget _conversationHeader(WesiAiHandoffController controller, WesiAiConversation active) {
          """
          insert = """  Widget _emptyConversationState(WesiAiConversation active) {
            final theme = Theme.of(context);
            return Center(
              child: Padding(
                padding: const EdgeInsets.all(28),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Icon(Icons.auto_awesome_rounded, size: 54, color: theme.colorScheme.primary),
                    const SizedBox(height: 16),
                    Text(
                      WesiAiChatUi.personaEmptyLabel(active.persona),
                      textAlign: TextAlign.center,
                      style: theme.textTheme.titleLarge?.copyWith(fontWeight: FontWeight.w700),
                    ),
                    const SizedBox(height: 8),
                    Text(
                      active.projectId == null
                          ? 'Напишите сообщение или прикрепите файл, чтобы начать диалог.'
                          : 'Контекст и инструкции текущего проекта будут учтены автоматически.',
                      textAlign: TextAlign.center,
                      style: theme.textTheme.bodyMedium?.copyWith(color: theme.colorScheme.onSurfaceVariant),
                    ),
                  ],
                ),
              ),
            );
          }

          Widget _sendingStatus() {
            final since = _sendingSince;
            final elapsed = since == null ? Duration.zero : DateTime.now().difference(since);
            return Padding(
              padding: const EdgeInsets.fromLTRB(12, 5, 12, 7),
              child: Row(
                children: [
                  const SizedBox.square(
                    dimension: 16,
                    child: CircularProgressIndicator(strokeWidth: 2),
                  ),
                  const SizedBox(width: 9),
                  Text(WesiAiChatUi.sendingLabel(elapsed)),
                ],
              ),
            );
          }

          """
          assert marker in text, 'conversation header marker missing'
          text = text.replace(marker, insert + marker, 1)

          p.write_text(text, encoding='utf-8')

          # Advertise both legacy inline and current staged limits from Main.
          p = Path('server/pb_hooks/wesi_ai_routes.pb.js')
          text = p.read_text(encoding='utf-8')
          old = """    attachmentLimits: {
                maxFiles: 4,
                maxFileBytes: 15728640,
                maxTotalBytes: 18874368
              }
          """
          new = """    attachmentLimits: {
                maxFiles: 4,
                maxFileBytes: 15728640,
                maxTotalBytes: 18874368,
                inlineMaxFileBytes: 15728640,
                inlineMaxTotalBytes: 18874368,
                stagedMaxFileBytes: 268435456,
                stagedMaxTotalBytes: 536870912,
                stagedChunkBytes: 1048576
              }
          """
          assert old in text, 'main attachment limits marker missing'
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Expose staged limits in Relay health without changing existing keys.
          p = Path('server/wesi-ai-relay/server.mjs')
          text = p.read_text(encoding='utf-8')
          old = """        maxFiles: 4,
                maxFileBytes: 15 * 1024 * 1024,
                maxTotalBytes: 18 * 1024 * 1024,
                multimodal: true,
          """
          new = """        maxFiles: 4,
                maxFileBytes: 15 * 1024 * 1024,
                maxTotalBytes: 18 * 1024 * 1024,
                inlineMaxFileBytes: 15 * 1024 * 1024,
                inlineMaxTotalBytes: 18 * 1024 * 1024,
                stagedMaxFileBytes: STAGED_MAX_FILE_BYTES,
                stagedMaxTotalBytes: 512 * 1024 * 1024,
                stagedChunkBytes: STAGED_CHUNK_BYTES,
                multimodal: true,
          """
          assert old in text, 'relay health attachment marker missing'
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          dart format lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/wesi_ai_chat_ui.dart
          node --check server/pb_hooks/wesi_ai_routes.pb.js
          node --check server/wesi-ai-relay/server.mjs
          rm .github/workflows/patch-ai-chat-ui-v4-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/wesi_ai_chat_ui.dart server/pb_hooks/wesi_ai_routes.pb.js server/wesi-ai-relay/server.mjs .github/workflows/patch-ai-chat-ui-v4-once.yml
          git commit -m 'feat(ai): polish ordinary chat UX and report staged limits'
          git push origin HEAD:chatgpt/ai-chat-ui-hardening-v4
