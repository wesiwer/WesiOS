name: Expand Wesi Aero Relay Protocols

on:
  push:
    branches:
      - codex/wesi-aero-build-20260821
    paths:
      - WesiAero/server-node/src/**
      - WesiAero/server-node/scripts/setup-singbox-prototype.sh
      - WesiAero/server-node/scripts/setup-amneziawg-prototype.sh
      - WesiAero/server-node/scripts/setup-control-plane-prototype.sh
      - WesiAero/server-node/scripts/configure-control-plane-https.sh
      - WesiAero/server-node/scripts/sync-live-protocols.sh
      - WesiAero/server-node/scripts/refresh-control-plane-code.sh
      - .github/workflows/wesi-aero-expand-protocols.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: wesi-aero-protocol-expansion
  cancel-in-progress: true

env:
  AERO_HOST: wesi-aero-178-236-247-194.nip.io
  RELAY_SSH_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
  RELAY_SSH_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
  RELAY_SSH_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
  RELAY_SSH_KNOWN_HOSTS: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}

jobs:
  expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/wesi-aero-build-20260821

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc --arg target_url "$TARGET_URL" '{state:"pending",target_url:$target_url,description:"Deploying hardened eight-protocol relay",context:"wesi-aero/protocol-expansion"}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d "$payload" >/dev/null

      - name: Configure SSH
        run: |
          set -euo pipefail
          for name in RELAY_SSH_HOST RELAY_SSH_USER RELAY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then echo "Missing $name" >&2; exit 1; fi
          done
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$RELAY_SSH_KEY" > "$HOME/.ssh/wesi_aero_relay"
          chmod 600 "$HOME/.ssh/wesi_aero_relay"
          if [ -n "${RELAY_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$RELAY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/wesi_aero_known_hosts"
          else
            ssh-keyscan -H "$RELAY_SSH_HOST" > "$HOME/.ssh/wesi_aero_known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/wesi_aero_known_hosts"

      - name: Deploy relay backends, control-plane sandbox and privacy hardening
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/wesi_aero_relay" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/wesi_aero_known_hosts")
          SCP=(scp -i "$HOME/.ssh/wesi_aero_relay" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/wesi_aero_known_hosts")
          remote="/tmp/wesi-aero-expand-${GITHUB_RUN_ID}"
          "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "rm -rf '$remote' && mkdir -p '$remote'"
          "${SCP[@]}" -r WesiAero/server-node "$RELAY_SSH_USER@$RELAY_SSH_HOST:$remote/"
          "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "REMOTE='$remote' AERO_HOST='$AERO_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          chmod +x "$REMOTE/server-node/scripts/"*.sh

          # Transport services first so control-plane profile publication cannot
          # advertise a backend before its real service/config exists.
          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" bash "$REMOTE/server-node/scripts/setup-singbox-prototype.sh"
          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" AWG_ENDPOINT_HOST="$AERO_HOST" bash "$REMOTE/server-node/scripts/setup-amneziawg-prototype.sh"

          # Reinstall only Wesi Aero's loopback control-plane service from the
          # branch source. This applies the systemd sandbox (UMask, namespace,
          # kernel/control-group protections, restricted address families) while
          # preserving existing server secrets in /etc/wesi-aero/control.env.
          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" \
            bash "$REMOTE/server-node/scripts/setup-control-plane-prototype.sh" "$REMOTE/server-node"

          # Rebuild only the Wesi Aero virtual host. The script validates nginx
          # before reload and disables source-IP/access request logging.
          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" \
            bash "$REMOTE/server-node/scripts/configure-control-plane-https.sh" "$AERO_HOST"

          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" bash "$REMOTE/server-node/scripts/sync-live-protocols.sh"

          systemctl is-active --quiet wesi-aero-singbox.service
          systemctl is-active --quiet wesi-aero-amneziawg.service
          systemctl is-active --quiet wesi-aero-control.service
          systemctl is-active --quiet nginx.service
          ss -ltn | grep -q ':8445 '
          ss -ltn | grep -q ':8388 '
          ss -lun | grep -q ':8446 '
          ss -lun | grep -q ':8447 '
          ss -lun | grep -q ':51820 '
          ss -lun | grep -q ':51821 '
          awg show awg0 >/dev/null
          test -s /var/lib/wesi-aero/profiles/_default.wesi-relay.wireguard.json
          test -s /var/lib/wesi-aero/profiles/_default.wesi-relay.amneziawg.json
          jq -e '.protocol == "wireguard"' /var/lib/wesi-aero/profiles/_default.wesi-relay.wireguard.json >/dev/null
          jq -e '.protocol == "amneziawg" and (.clientConfig | contains("Jc =") and contains("H4 ="))' /var/lib/wesi-aero/profiles/_default.wesi-relay.amneziawg.json >/dev/null
          "${SUDO[@]}" grep -q '^WESI_AERO_TECHNICAL_LOGS=false$' /etc/wesi-aero/control.env
          "${SUDO[@]}" grep -q '^UMask=0077$' /etc/systemd/system/wesi-aero-control.service
          "${SUDO[@]}" grep -q '^ProtectKernelTunables=true$' /etc/systemd/system/wesi-aero-control.service
          "${SUDO[@]}" grep -q '^RestrictNamespaces=true$' /etc/systemd/system/wesi-aero-control.service
          "${SUDO[@]}" grep -q 'access_log off;' /etc/nginx/sites-enabled/wesi-aero-control
          ! "${SUDO[@]}" grep -q 'proxy_add_x_forwarded_for' /etc/nginx/sites-enabled/wesi-aero-control
          curl -fsS --max-time 10 http://127.0.0.1:8790/v1/catalog | jq -e '
            .servers[] | select(.id=="wesi-relay") |
            (["vless-reality","vmess","trojan","shadowsocks","hysteria2","tuic","wireguard","amneziawg"] - .protocols | length) == 0
          ' >/dev/null
          REMOTE

      - name: Verify public control plane
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "https://$AERO_HOST/healthz" | grep -q '"status":"ok"'
          curl -fsS --max-time 15 "https://$AERO_HOST/v1/catalog" | jq -e '
            .servers[] | select(.id=="wesi-relay") |
            (["vless-reality","vmess","trojan","shadowsocks","hysteria2","tuic","wireguard","amneziawg"] - .protocols | length) == 0
          ' >/dev/null

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Eight-protocol relay + control-plane hardening live'; else state=failure; description='Relay deployment/control-plane hardening failed'; fi
          payload=$(jq -nc --arg state "$state" --arg target_url "$TARGET_URL" --arg description "$description" '{state:$state,target_url:$target_url,description:$description,context:"wesi-aero/protocol-expansion"}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d "$payload" >/dev/null
