name: Expand Wesi Aero Relay Protocols

on:
  push:
    branches:
      - codex/wesi-aero-build-20260821
    paths:
      - WesiAero/server-node/src/**
      - WesiAero/server-node/scripts/setup-singbox-prototype.sh
      - WesiAero/server-node/scripts/setup-restrictive-transports.sh
      - WesiAero/server-node/scripts/setup-amneziawg-prototype.sh
      - WesiAero/server-node/scripts/setup-control-plane-prototype.sh
      - WesiAero/server-node/scripts/configure-control-plane-https.sh
      - WesiAero/server-node/scripts/sync-live-protocols.sh
      - WesiAero/server-node/scripts/refresh-control-plane-code.sh
      - .github/workflows/wesi-aero-expand-protocols.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: wesi-aero-protocol-expansion
  cancel-in-progress: true

env:
  AERO_HOST: wesi-aero-178-236-247-194.nip.io
  RELAY_SSH_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
  RELAY_SSH_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
  RELAY_SSH_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
  RELAY_SSH_KNOWN_HOSTS: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}

jobs:
  expand:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/wesi-aero-build-20260821

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc --arg target_url "$TARGET_URL" '{state:"pending",target_url:$target_url,description:"Deploying hardened relay + TLS/443 transports",context:"wesi-aero/protocol-expansion"}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d "$payload" >/dev/null

      - name: Configure SSH
        run: |
          set -euo pipefail
          for name in RELAY_SSH_HOST RELAY_SSH_USER RELAY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then echo "Missing $name" >&2; exit 1; fi
          done
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$RELAY_SSH_KEY" > "$HOME/.ssh/wesi_aero_relay"
          chmod 600 "$HOME/.ssh/wesi_aero_relay"
          if [ -n "${RELAY_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$RELAY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/wesi_aero_known_hosts"
          else
            ssh-keyscan -H "$RELAY_SSH_HOST" > "$HOME/.ssh/wesi_aero_known_hosts" 2>/dev/null
          fi
          chmod 600 "$HOME/.ssh/wesi_aero_known_hosts"

      - name: Deploy relay backends, restrictive transports and privacy hardening
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/wesi_aero_relay" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/wesi_aero_known_hosts")
          SCP=(scp -i "$HOME/.ssh/wesi_aero_relay" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/wesi_aero_known_hosts")
          remote="/tmp/wesi-aero-expand-${GITHUB_RUN_ID}"
          "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "rm -rf '$remote' && mkdir -p '$remote'"
          "${SCP[@]}" -r WesiAero/server-node "$RELAY_SSH_USER@$RELAY_SSH_HOST:$remote/"
          "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "REMOTE='$remote' AERO_HOST='$AERO_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          chmod +x "$REMOTE/server-node/scripts/"*.sh

          has_tcp_listener() {
            local port="$1"
            ss -ltnH | awk -v suffix=":$port" '$4 ~ suffix"$" {found=1} END {exit(found ? 0 : 1)}'
          }
          has_udp_listener() {
            local port="$1"
            ss -lunH | awk -v suffix=":$port" '$5 ~ suffix"$" || $4 ~ suffix"$" {found=1} END {exit(found ? 0 : 1)}'
          }
          has_loopback_tcp_listener() {
            local port="$1"
            ss -ltnH | awk -v suffix=":$port" '$4 ~ suffix"$" && $4 ~ /^127\.0\.0\.1:/ {found=1} END {exit(found ? 0 : 1)}'
          }
          has_non_loopback_tcp_listener() {
            local port="$1"
            ss -ltnH | awk -v suffix=":$port" '$4 ~ suffix"$" && $4 !~ /^127\.0\.0\.1:/ {found=1} END {exit(found ? 0 : 1)}'
          }

          # Transport services first so control-plane profile publication cannot
          # advertise a backend before its real service/config exists.
          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" bash "$REMOTE/server-node/scripts/setup-singbox-prototype.sh"
          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" bash "$REMOTE/server-node/scripts/setup-restrictive-transports.sh"
          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" AWG_ENDPOINT_HOST="$AERO_HOST" bash "$REMOTE/server-node/scripts/setup-amneziawg-prototype.sh"

          # Reinstall only Wesi Aero's loopback control-plane service from the
          # branch source. Existing secrets in /etc/wesi-aero/control.env stay intact.
          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" \
            bash "$REMOTE/server-node/scripts/setup-control-plane-prototype.sh" "$REMOTE/server-node"

          # Rebuild only the Wesi Aero vhost. The generated transport snippet is
          # included inside this hostname's TLS/443 server, not globally in nginx.
          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" \
            bash "$REMOTE/server-node/scripts/configure-control-plane-https.sh" "$AERO_HOST"

          "${SUDO[@]}" env WESI_AERO_PUBLIC_HOST="$AERO_HOST" bash "$REMOTE/server-node/scripts/sync-live-protocols.sh"

          systemctl is-active --quiet wesi-aero-singbox.service
          systemctl is-active --quiet wesi-aero-restrictive-transports.service
          systemctl is-active --quiet wesi-aero-amneziawg.service
          systemctl is-active --quiet wesi-aero-control.service
          systemctl is-active --quiet nginx.service
          has_tcp_listener 8445
          has_tcp_listener 8388
          has_udp_listener 8446
          has_udp_listener 8447
          has_udp_listener 51820
          has_udp_listener 51821
          for port in 18080 18081 18082; do
            has_loopback_tcp_listener "$port"
            if has_non_loopback_tcp_listener "$port"; then
              echo "Restrictive transport port $port escaped loopback." >&2
              exit 1
            fi
          done
          awg show awg0 >/dev/null
          test -s /var/lib/wesi-aero/profiles/_default.wesi-relay.wireguard.json
          test -s /var/lib/wesi-aero/profiles/_default.wesi-relay.amneziawg.json
          test -s /var/lib/wesi-aero/profiles/_default.wesi-relay.vmess.json
          jq -e '.protocol == "wireguard"' /var/lib/wesi-aero/profiles/_default.wesi-relay.wireguard.json >/dev/null
          jq -e '.protocol == "amneziawg" and (.clientConfig | contains("Jc =") and contains("H4 ="))' /var/lib/wesi-aero/profiles/_default.wesi-relay.amneziawg.json >/dev/null
          jq -er '.clientConfig' /var/lib/wesi-aero/profiles/_default.wesi-relay.vmess.json | sed 's#^vmess://##' | base64 -d | jq -e --arg host "$AERO_HOST" '.add==$host and .port=="443" and .net=="ws" and .tls=="tls" and .sni==$host' >/dev/null
          "${SUDO[@]}" grep -q '^WESI_AERO_TECHNICAL_LOGS=false$' /etc/wesi-aero/control.env
          "${SUDO[@]}" grep -q '^UMask=0077$' /etc/systemd/system/wesi-aero-control.service
          "${SUDO[@]}" grep -q '^ProtectKernelTunables=true$' /etc/systemd/system/wesi-aero-control.service
          "${SUDO[@]}" grep -q '^RestrictNamespaces=true$' /etc/systemd/system/wesi-aero-control.service
          "${SUDO[@]}" grep -q 'access_log off;' /etc/nginx/sites-enabled/wesi-aero-control
          "${SUDO[@]}" grep -q 'include /etc/nginx/snippets/wesi-aero-transports.conf;' /etc/nginx/sites-enabled/wesi-aero-control
          "${SUDO[@]}" grep -q 'proxy_pass http://127.0.0.1:18080;' /etc/nginx/snippets/wesi-aero-transports.conf
          ! "${SUDO[@]}" grep -q 'proxy_add_x_forwarded_for' /etc/nginx/sites-enabled/wesi-aero-control

          # End-to-end public TLS/443 data-plane proof. This client connects to
          # the public Wesi Aero hostname, traverses nginx -> WS transport ->
          # sing-box, and must reach an external HTTPS origin through the tunnel.
          RESTRICTIVE_UUID="$(cat /var/lib/wesi-aero/singbox/restrictive-vmess.uuid)"
          TEST_CONFIG="$(mktemp)"
          TEST_LOG="$(mktemp)"
          TEST_PID=''
          cleanup_test() {
            if [ -n "$TEST_PID" ]; then kill "$TEST_PID" >/dev/null 2>&1 || true; wait "$TEST_PID" 2>/dev/null || true; fi
            rm -f "$TEST_CONFIG" "$TEST_LOG"
          }
          trap cleanup_test EXIT
          jq -n \
            --arg host "$AERO_HOST" --arg uuid "$RESTRICTIVE_UUID" \
            '{
              log:{level:"error",timestamp:false},
              inbounds:[{type:"socks",tag:"socks-in",listen:"127.0.0.1",listen_port:19080}],
              outbounds:[
                {type:"vmess",tag:"proxy",server:$host,server_port:443,uuid:$uuid,security:"auto",alter_id:0,
                 tls:{enabled:true,server_name:$host},
                 transport:{type:"ws",path:"/aero/transport/ws",headers:{Host:$host}}},
                {type:"direct",tag:"direct"}
              ],
              route:{final:"proxy"}
            }' > "$TEST_CONFIG"
          sing-box check -c "$TEST_CONFIG"
          sing-box run -c "$TEST_CONFIG" >"$TEST_LOG" 2>&1 & TEST_PID=$!
          for _ in $(seq 1 40); do
            if has_loopback_tcp_listener 19080; then break; fi
            kill -0 "$TEST_PID" 2>/dev/null || { cat "$TEST_LOG" >&2; exit 1; }
            sleep 0.25
          done
          has_loopback_tcp_listener 19080 || { cat "$TEST_LOG" >&2; exit 1; }
          curl -fsS --max-time 20 --proxy socks5h://127.0.0.1:19080 https://example.com/ >/dev/null
          cleanup_test
          trap - EXIT

          # Detailed transport policy is deliberately admin-only. Public clients
          # see the https443 capability tag, while CI verifies exact policy over
          # the authenticated loopback admin API without printing its token.
          # shellcheck disable=SC1090
          source /etc/wesi-aero/control.env
          PUBLIC_CATALOG="$(curl -fsS --max-time 10 http://127.0.0.1:8790/v1/catalog)"
          jq -e '
            .servers[] | select(.id=="wesi-relay") |
            (["vless-reality","vmess","trojan","shadowsocks","hysteria2","tuic","wireguard","amneziawg"] - .protocols | length) == 0 and
            (.tags | index("https443")) != null and
            (.transportConfig == null)
          ' <<<"$PUBLIC_CATALOG" >/dev/null
          ADMIN_SNAPSHOT="$(curl -fsS --max-time 10 -H "x-admin-token: $WESI_AERO_ADMIN_TOKEN" http://127.0.0.1:8790/v1/admin/snapshot)"
          jq -e --arg host "$AERO_HOST" '
            .servers[] | select(.id=="wesi-relay") |
            .transportConfig.defaultProtocol == "vmess" and
            .transportConfig.restrictiveNetwork.enabled == true and
            .transportConfig.restrictiveNetwork.publicPort == 443 and
            .transportConfig.restrictiveNetwork.hostname == $host and
            .transportConfig.restrictiveNetwork.primary.transport == "websocket" and
            .transportConfig.restrictiveNetwork.domainFronting == false and
            .transportConfig.restrictiveNetwork.thirdPartyCdn == false
          ' <<<"$ADMIN_SNAPSHOT" >/dev/null
          REMOTE

      - name: Verify public control plane
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 "https://$AERO_HOST/healthz" | grep -q '"status":"ok"'
          curl -fsS --max-time 15 "https://$AERO_HOST/v1/catalog" | jq -e '
            .servers[] | select(.id=="wesi-relay") |
            (["vless-reality","vmess","trojan","shadowsocks","hysteria2","tuic","wireguard","amneziawg"] - .protocols | length) == 0 and
            (.tags | index("https443")) != null and
            (.transportConfig == null)
          ' >/dev/null

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Relay + Wesi TLS/443 restrictive transports live'; else state=failure; description='Relay/restrictive transport deployment failed'; fi
          payload=$(jq -nc --arg state "$state" --arg target_url "$TARGET_URL" --arg description "$description" '{state:$state,target_url:$target_url,description:$description,context:"wesi-aero/protocol-expansion"}')
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d "$payload" >/dev/null
