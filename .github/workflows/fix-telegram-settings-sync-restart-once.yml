name: Fix Telegram Settings + Sync Restart Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-telegram-settings-sync-restart-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch Telegram settings, sync restart and version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('lib/features/settings/settings_screen.dart')
          text = settings.read_text(encoding='utf-8')

          import_line = "import '../profile/telegram_link_screen.dart';\n"
          if import_line not in text:
              marker = "import '../treasury/services/treasury_service.dart';\n"
              if marker not in text:
                  raise SystemExit('telegram import marker not found')
              text = text.replace(marker, marker + import_line, 1)

          telegram_tile = """              _tile(\n                icon: Icons.send_rounded,\n                title: 'Telegram',\n                subtitle: ru\n                    ? 'Привязка бота и настройки уведомлений'\n                    : 'Bot linking and notification settings',\n                onTap: () => Navigator.of(context).push(\n                  MaterialPageRoute(\n                    builder: (_) => const TelegramLinkScreen(),\n                  ),\n                ),\n              ),\n"""
          if "builder: (_) => const TelegramLinkScreen()" not in text:
              marker = "              _plannedTile(\n                icon: Icons.email,\n"
              if marker not in text:
                  raise SystemExit('Telegram insertion marker not found')
              text = text.replace(marker, telegram_tile + marker, 1)
          settings.write_text(text, encoding='utf-8')

          deploy = Path('.github/workflows/deploy-sync-hooks.yml')
          d = deploy.read_text(encoding='utf-8')
          old = '          restart_needed="$migration_changed"\n'
          new = '          # PocketBase can preserve registered JS callbacks across hot hook reloads.\n          # Always restart after replacing the sync bundle to eliminate stale callbacks.\n          restart_needed="1"\n'
          if old in d:
              d = d.replace(old, new, 1)
          elif 'restart_needed="1"' not in d:
              raise SystemExit('sync restart marker not found')
          deploy.write_text(d, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          p = pubspec.read_text(encoding='utf-8')
          m = re.search(r'(?m)^version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)\s*$', p)
          if not m:
              raise SystemExit('pubspec version not found')
          major, minor, patch, build = map(int, m.groups())
          p = p[:m.start()] + f'version: {major}.{minor}.{patch + 1}+{build + 1}' + p[m.end():]
          pubspec.write_text(p, encoding='utf-8')
          PY

          grep -q "telegram_link_screen.dart" lib/features/settings/settings_screen.dart
          grep -q "const TelegramLinkScreen()" lib/features/settings/settings_screen.dart
          grep -q 'restart_needed="1"' .github/workflows/deploy-sync-hooks.yml
          git diff --check

      - name: Commit fixes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Fix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/settings/settings_screen.dart .github/workflows/deploy-sync-hooks.yml pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: restore Telegram settings and restart sync runtime'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch production sync deployment
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "since=$since" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-sync-hooks.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Wait for production sync deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ steps.sync.outputs.since }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for i in $(seq 1 36); do
            payload=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-sync-hooks.yml/runs?branch=main&event=workflow_dispatch&per_page=10")
            run_id=$(printf '%s' "$payload" | jq -r --arg since "$SINCE" '[.workflow_runs[] | select(.created_at >= $since)] | sort_by(.created_at) | reverse | .[0].id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          [ -n "$run_id" ] || { echo 'Sync deploy run not found' >&2; exit 1; }

          for i in $(seq 1 72); do
            payload=$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(printf '%s' "$payload" | jq -r '.status')
            conclusion=$(printf '%s' "$payload" | jq -r '.conclusion // empty')
            echo "sync deploy: status=$status conclusion=$conclusion"
            if [ "$status" = 'completed' ]; then
              [ "$conclusion" = 'success' ] || exit 1
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Dispatch application release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/release-app.yml/dispatches" \
            -d '{"ref":"main","inputs":{"notes":"Telegram: восстановлена активная кнопка привязки и настроек уведомлений. Синхронизация: PocketBase теперь перезапускается после обновления sync hooks/runtime.","deploy_to_server":"true"}}'
