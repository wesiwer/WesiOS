name: Analyze Errors Current Main V2 Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/ops/run-sync-rootfix-20260820'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Capture exact analyzer output
        id: analyze
        shell: bash
        run: |
          set +e
          flutter pub get >/tmp/pub.log 2>&1
          PUB=$?
          flutter analyze >/tmp/analyze.log 2>&1
          ANALYZE=$?
          set -e

          {
            echo '### WesiOS current main — flutter analyze'
            echo
            echo "- source: \`$(git rev-parse HEAD)\`"
            echo "- pub get: \`$PUB\`"
            echo "- analyze: \`$ANALYZE\`"
            echo
            echo '```text'
            if [ "$PUB" -ne 0 ]; then
              tail -n 120 /tmp/pub.log
            else
              grep -E '(^|[[:space:]])(error|warning|info) • ' /tmp/analyze.log | tail -n 120 || true
              echo
              echo '--- summary ---'
              tail -n 20 /tmp/analyze.log
            fi
            echo '```'
          } > /tmp/comment.md

          echo "pub=$PUB" >> "$GITHUB_OUTPUT"
          echo "analyze=$ANALYZE" >> "$GITHUB_OUTPUT"

      - name: Comment exact result on PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/comment.md

      - name: Preserve analyzer exit status
        shell: bash
        run: |
          test "${{ steps.analyze.outputs.pub }}" -eq 0
          test "${{ steps.analyze.outputs.analyze }}" -eq 0
