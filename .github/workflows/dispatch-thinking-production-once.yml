name: Dispatch Thinking Production Once

on:
  push:
    branches: [fix/wesi-ai-dynamic-deliberation]
    paths:
      - '.github/workflows/dispatch-thinking-production-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  deploy-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Deploy Wesi AI streaming production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-wesi-ai-streaming.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f public_host='wesi-ai-178-236-247-194.nip.io'
          sleep 5
          DEPLOY_RUN="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-wesi-ai-streaming.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$DEPLOY_RUN"
          echo "STREAM_DEPLOY_RUN=$DEPLOY_RUN"
          gh run watch "$DEPLOY_RUN" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Dispatch signed WesiOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='Thinking: живой публичный ход решения от текущей персоны, больше шагов для сложных запросов, пересмотр гипотез после проверенных фактов. Classic остаётся быстрым режимом.' \
            -f deploy_to_server=true
          echo 'WESIOS_0_22_21_96_RELEASE_DISPATCHED'
