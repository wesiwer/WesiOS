name: Apply Wesi AI Stage 2 client streaming

on:
  push:
    branches:
      - agent/wesi-ai-stage2-streaming

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[stage2-client-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Flutter streaming patch
        run: python tool/wesi_ai_stage2_client_patch.py
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Format
        run: dart format lib/features/ai test/wesi_ai_queue_hardening_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test Wesi AI queue and streaming regression
        run: flutter test test/wesi_ai_queue_hardening_test.dart test/wesi_ai_turn_intent_test.dart
      - name: Commit validated Flutter implementation
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/ai test
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(ai): render true network streaming deltas [stage2-client-applied]'
          git push origin HEAD:agent/wesi-ai-stage2-streaming
