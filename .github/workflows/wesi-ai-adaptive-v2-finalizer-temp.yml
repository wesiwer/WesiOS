name: Wesi AI adaptive learning v2 finalizer temp

on:
  pull_request:
    branches:
      - agent/org-hierarchy-v1

permissions:
  contents: write

concurrency:
  group: wesi-ai-adaptive-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.head_ref == 'chatgpt/wesi-ai-adaptive-learning-v2-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wesi-ai-adaptive-learning-v2-20260812
          fetch-depth: 0

      - name: Apply adaptive learning integration
        run: python3 .github/scripts/wesi_ai_learning_v2_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format Wesi AI adaptive sources
        run: |
          dart format \
            lib/features/tasks/ai \
            test/wesi_ai_task_engine_test.dart \
            test/wesi_ai_adaptive_learning_test.dart

      - name: Verify and capture diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          flutter analyze --no-fatal-infos > .ci/wesi-ai-v2-analyze.log 2>&1
          ANALYZE=$?
          flutter test test/wesi_ai_task_engine_test.dart test/wesi_ai_adaptive_learning_test.dart > .ci/wesi-ai-v2-targeted.log 2>&1
          TARGETED=$?
          flutter test test/tasks_screen_layout_test.dart > .ci/wesi-ai-v2-layout.log 2>&1
          LAYOUT=$?
          flutter test > .ci/wesi-ai-v2-full.log 2>&1
          FULL=$?
          printf 'analyze=%s\ntargeted=%s\nlayout=%s\nfull=%s\n' "$ANALYZE" "$TARGETED" "$LAYOUT" "$FULL" > .ci/wesi-ai-v2-status.txt
          exit 0

      - name: Persist patched product and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/tasks/ai \
                  test/wesi_ai_task_engine_test.dart \
                  test/wesi_ai_adaptive_learning_test.dart \
                  .ci/wesi-ai-v2-analyze.log \
                  .ci/wesi-ai-v2-targeted.log \
                  .ci/wesi-ai-v2-layout.log \
                  .ci/wesi-ai-v2-full.log \
                  .ci/wesi-ai-v2-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record Wesi AI adaptive v2 verification [skip ci]'
            git push origin HEAD:chatgpt/wesi-ai-adaptive-learning-v2-20260812
          fi

      - name: Enforce verification result
        shell: bash
        run: |
          source .ci/wesi-ai-v2-status.txt
          test "$analyze" = 0
          test "$targeted" = 0
          test "$layout" = 0
          test "$full" = 0
