name: Temporary compact Wesi AI rich content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-const-theme.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 0

      - name: Compact code and tables
        run: |
          set -euo pipefail
          python3 scripts/compact_wesi_ai_rich_content.py
          git diff --check

      - name: Commit feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/ai/widgets/wesi_ai_rich_message.dart \
            lib/features/ai/widgets/wesi_ai_visualization.dart \
            lib/features/ai/widgets/wesi_ai_message_content.dart \
            test/wesi_ai_rich_message_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(ai): compact mobile code and tables"
          git push origin HEAD:fix/wesi-ai-tool-agent-handoff
