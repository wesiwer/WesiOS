name: Temporary Wesi AI tool-hook deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-hooks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 1

      - name: Validate hooks
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_ai_routes.pb.js
          node --check server/pb_hooks/wesi_ai_tools.js

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Hot-deploy exact tool hooks
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE="/tmp/wesi-ai-hooks-$GITHUB_RUN_ID"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes server/pb_hooks/wesi_ai_routes.pb.js "$USER@$HOST:$REMOTE/routes.pb.js"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes server/pb_hooks/wesi_ai_tools.js "$USER@$HOST:$REMOTE/tools.js"
          $SSH "$USER@$HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail
          install_hook() {
            SOURCE="$1"
            TARGET="$2"
            test -s "$SOURCE"
            if [ -w "$TARGET" ]; then
              cat "$SOURCE" > "$TARGET"
              chmod 0644 "$TARGET"
            elif [ -w "$(dirname "$TARGET")" ]; then
              install -m 0644 "$SOURCE" "$TARGET"
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo -n install -m 0644 "$SOURCE" "$TARGET"
            else
              echo "Target is not writable: $TARGET" >&2
              exit 30
            fi
            cmp -s "$SOURCE" "$TARGET"
          }
          install_hook "$REMOTE/routes.pb.js" /opt/pocketbase/pb_hooks/wesi_ai_routes.pb.js
          install_hook "$REMOTE/tools.js" /opt/pocketbase/pb_hooks/wesi_ai_tools.js
          rm -rf "$REMOTE"
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 4 http://127.0.0.1:8090/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 4 http://127.0.0.1:8090/api/health >/dev/null
          REMOTE

      - name: Verify deployed SHA
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          LOCAL_ROUTES=$(sha256sum server/pb_hooks/wesi_ai_routes.pb.js | awk '{print $1}')
          LOCAL_TOOLS=$(sha256sum server/pb_hooks/wesi_ai_tools.js | awk '{print $1}')
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE_ROUTES=$($SSH "$USER@$HOST" "sha256sum /opt/pocketbase/pb_hooks/wesi_ai_routes.pb.js | awk '{print \$1}'")
          REMOTE_TOOLS=$($SSH "$USER@$HOST" "sha256sum /opt/pocketbase/pb_hooks/wesi_ai_tools.js | awk '{print \$1}'")
          test "$LOCAL_ROUTES" = "$REMOTE_ROUTES"
          test "$LOCAL_TOOLS" = "$REMOTE_TOOLS"
          echo WESI_AI_TOOL_HOOKS_ACTIVE
