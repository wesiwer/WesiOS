name: Temporary finish Wesi AI quota workflow sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-const-theme.yml'

permissions:
  contents: write

jobs:
  sync-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RELAY_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      RELAY_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 0

      - name: Add Gemini project labels to deploy workflows
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def expr(secret):
              return '$' + '{{ secrets.' + secret + ' }}'

          def insert_env_after(text, marker, pairs):
              lines = text.splitlines()
              if any((pairs[0][0] + ':') in line for line in lines):
                  return text
              for i, line in enumerate(lines):
                  if line.lstrip().startswith(marker + ':'):
                      indent = line[:len(line) - len(line.lstrip())]
                      lines[i+1:i+1] = [f"{indent}{name}: {expr(secret)}" for name, secret in pairs]
                      return '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
              raise RuntimeError(f'marker not found: {marker}')

          project_env = [
              ('GEMINI_API_PROJECT', 'GEMINI_API_PROJECT'),
              ('GEMINI_API_PROJECT_2', 'GEMINI_API_PROJECT_2'),
              ('GEMINI_API_PROJECT_3', 'GEMINI_API_PROJECT_3'),
              ('GEMINI_API_PROJECT_4', 'GEMINI_API_PROJECT_4'),
              ('GEMINI_API_PROJECT_5', 'GEMINI_API_PROJECT_5'),
          ]
          key_line = "              'GEMINI_API_KEY_2','GEMINI_API_KEY_3','GEMINI_API_KEY_4','GEMINI_API_KEY_5',"
          project_line = "              'GEMINI_API_PROJECT','GEMINI_API_PROJECT_2','GEMINI_API_PROJECT_3','GEMINI_API_PROJECT_4','GEMINI_API_PROJECT_5',"
          old_allow = 'GEMINI_API_KEY_2|GEMINI_API_KEY_3|GEMINI_API_KEY_4|GEMINI_API_KEY_5|GROQ_API_KEY|MISTRAL_API_KEY|OPENROUTER_API_KEY) ;;'
          new_allow = 'GEMINI_API_KEY_2|GEMINI_API_KEY_3|GEMINI_API_KEY_4|GEMINI_API_KEY_5|GEMINI_API_PROJECT|GEMINI_API_PROJECT_2|GEMINI_API_PROJECT_3|GEMINI_API_PROJECT_4|GEMINI_API_PROJECT_5|GROQ_API_KEY|MISTRAL_API_KEY|OPENROUTER_API_KEY) ;;'

          p = Path('.github/workflows/configure-wesi-ai-router.yml')
          text = p.read_text(encoding='utf-8')
          text = insert_env_after(text, 'GEMINI_API_KEY_5', project_env)
          if project_line not in text:
              if key_line not in text: raise RuntimeError('configure names marker missing')
              text = text.replace(key_line, key_line + '\n' + project_line, 1)
          text = text.replace(old_allow, new_allow)
          p.write_text(text, encoding='utf-8')

          p = Path('.github/workflows/deploy-wesi-ai.yml')
          text = p.read_text(encoding='utf-8')
          sealed_projects = [
              ('GEMINI_PROJECT', 'GEMINI_API_PROJECT'),
              ('GEMINI_PROJECT_2', 'GEMINI_API_PROJECT_2'),
              ('GEMINI_PROJECT_3', 'GEMINI_API_PROJECT_3'),
              ('GEMINI_PROJECT_4', 'GEMINI_API_PROJECT_4'),
              ('GEMINI_PROJECT_5', 'GEMINI_API_PROJECT_5'),
          ]
          text = insert_env_after(text, 'GEMINI_KEY_5', sealed_projects)
          text = insert_env_after(text, 'GEMINI_API_KEY_5', project_env)
          loop = """          for index in range(2, 6):
              value = os.environ.get(f'GEMINI_KEY_{index}', '').strip()
              if value:
                  values[f'GEMINI_API_KEY_{index}_B64'] = value
"""
          loop_with_projects = """          primary_project = os.environ.get('GEMINI_PROJECT', '').strip()
          if primary_project:
              values['GEMINI_API_PROJECT_B64'] = primary_project
          for index in range(2, 6):
              value = os.environ.get(f'GEMINI_KEY_{index}', '').strip()
              if value:
                  values[f'GEMINI_API_KEY_{index}_B64'] = value
              project = os.environ.get(f'GEMINI_PROJECT_{index}', '').strip()
              if project:
                  values[f'GEMINI_API_PROJECT_{index}_B64'] = project
"""
          if "GEMINI_API_PROJECT_{index}_B64" not in text:
              if loop not in text: raise RuntimeError('deploy key loop marker missing')
              text = text.replace(loop, loop_with_projects, 1)
          if project_line not in text:
              if key_line not in text: raise RuntimeError('deploy provider names marker missing')
              text = text.replace(key_line, key_line + '\n' + project_line, 1)
          text = text.replace(old_allow, new_allow)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          bash -n server/wesi-ai-relay/deploy-relay.sh
          node --test server/wesi-ai-relay/provider-failover.test.mjs

      - name: Commit workflow support
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/configure-wesi-ai-router.yml .github/workflows/deploy-wesi-ai.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(ai): preserve Gemini project quota scopes in deploys"
            git push origin HEAD:fix/wesi-ai-tool-agent-handoff
          fi

      - name: Prepare diagnostic SSH
        env:
          RELAY_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          RELAY_KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
          MAIN_KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$RELAY_KEY" > ~/.ssh/relay_key
          printf '%s\n' "$MAIN_KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/relay_key ~/.ssh/main_key
          if [ -n "${RELAY_KNOWN:-}" ]; then printf '%s\n' "$RELAY_KNOWN" > ~/.ssh/relay_known; else ssh-keyscan -H "$RELAY_HOST" > ~/.ssh/relay_known 2>/dev/null; fi
          if [ -n "${MAIN_KNOWN:-}" ]; then printf '%s\n' "$MAIN_KNOWN" > ~/.ssh/main_known; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known 2>/dev/null; fi
          chmod 600 ~/.ssh/relay_known ~/.ssh/main_known

      - name: Verify Relay locally and through TLS
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known")
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          curl -fsS --max-time 5 http://127.0.0.1:8787/health >/tmp/local-health.json
          grep -q '"ready":true' /tmp/local-health.json
          echo RELAY_LOCAL=ok
          if curl -fsS --max-time 10 https://ai.wesi-wf.su/health >/tmp/public-health.json 2>/dev/null; then
            grep -q '"ready":true' /tmp/public-health.json && echo RELAY_PUBLIC_TLS=ok
          else
            echo RELAY_PUBLIC_TLS=unreachable
          fi
          if curl -fsS --max-time 10 --resolve ai.wesi-wf.su:443:127.0.0.1 https://ai.wesi-wf.su/health >/tmp/local-tls.json 2>/dev/null; then
            grep -q '"ready":true' /tmp/local-tls.json && echo RELAY_LOCAL_TLS=ok
          else
            echo RELAY_LOCAL_TLS=unreachable
          fi
          REMOTE

      - name: Verify Main can reach Relay
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          curl -fsS --max-time 15 https://ai.wesi-wf.su/health >/tmp/wesi-relay-from-main.json
          grep -q '"ready":true' /tmp/wesi-relay-from-main.json
          echo MAIN_TO_RELAY=ok
          REMOTE
