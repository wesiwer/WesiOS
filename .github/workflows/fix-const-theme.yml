name: Temporary Wesi AI fallback work-log patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-const-theme.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 0
      - name: Add factual fallback activity
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/features/ai/wesi_ai_api.dart')
          text = p.read_text(encoding='utf-8')
          old = """        if (streamed != null) return streamed;\n      }\n\n      final request = await _http.postUrl(uri);\n"""
          new = """        if (streamed != null) return streamed;\n        onActivity?.call(<String, dynamic>{\n          'type': 'activity',\n          'kind': 'status',\n          'label': 'Переключаюсь на основной маршрут Wesi AI',\n          'detail':\n              'Streaming transport недоступен; продолжаю через защищённый WesiOS Main.',\n          'phase': 'done',\n        });\n      }\n\n      onActivity?.call(<String, dynamic>{\n        'type': 'activity',\n        'kind': 'status',\n        'label': 'Ожидаю проверенный ответ',\n        'detail': 'Запрос отправлен в WesiOS Main.',\n        'phase': 'start',\n      });\n      final request = await _http.postUrl(uri);\n"""
          if old not in text:
              raise SystemExit('fallback insertion anchor not found')
          text = text.replace(old, new, 1)
          old2 = """      if (response.statusCode < 200 || response.statusCode >= 300) {\n        final code = '${json['code'] ?? 'WAI_REQUEST_FAILED'}';\n        throw WesiAiApiException(code, _messageFor(code));\n      }\n      return _replyFromPayload(json);\n"""
          new2 = """      if (response.statusCode < 200 || response.statusCode >= 300) {\n        final code = '${json['code'] ?? 'WAI_REQUEST_FAILED'}';\n        throw WesiAiApiException(code, _messageFor(code));\n      }\n      onActivity?.call(<String, dynamic>{\n        'type': 'activity',\n        'kind': 'status',\n        'label': 'Ответ проверен сервером',\n        'phase': 'done',\n      });\n      return _replyFromPayload(json);\n"""
          if old2 not in text:
              raise SystemExit('response insertion anchor not found')
          p.write_text(text.replace(old2, new2, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/ai/wesi_ai_api.dart
          git diff --cached --quiet && exit 0
          git commit -m "fix(ai): expose factual fallback progress in thinking mode"
          git push origin HEAD:fix/wesi-ai-tool-agent-handoff
