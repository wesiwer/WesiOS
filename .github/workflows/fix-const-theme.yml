name: Temporary apply Wesi AI quota workflow migration

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-const-theme.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 0
      - name: Apply and validate
        run: |
          set -euo pipefail
          python3 scripts/sync_wesi_ai_quota_workflows.py
          git diff --check
          node --test server/wesi-ai-relay/provider-failover.test.mjs
          bash -n server/wesi-ai-relay/deploy-relay.sh
      - name: Commit feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/configure-wesi-ai-router.yml .github/workflows/deploy-wesi-ai.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(ai): preserve Gemini project quota scopes in deploys"
            git push origin HEAD:fix/wesi-ai-tool-agent-handoff
          fi
