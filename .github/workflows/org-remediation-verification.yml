name: Organization remediation verification

on:
  pull_request:
    branches:
      - agent/org-hierarchy-v1

concurrency:
  group: org-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # BEGIN ONE_SHOT_SYNC_PATCH
  sync-integrity-patch:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
      - name: Patch destructive sync boundaries
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/core/sync/sync_codec.dart')
          text = p.read_text(encoding='utf-8')

          old_snapshot = '''bool _organizationSnapshotValid(Iterable<OrganizationModel> values) {
            final nodes = values.toList();
            if (nodes.isEmpty) return false;
            final ids = nodes.map((e) => e.id).toSet();
            if (ids.length != nodes.length) return false;
            final roots = nodes.where((o) => o.isRoot).toList();
            if (roots.length != 1) return false;
            if (roots.single.parentId != null) return false;
            if (roots.single.id != OrganizationModel.rootId) return false;
            for (final node in nodes) {
              if (!node.isRoot &&
                  (node.parentId == null || !ids.contains(node.parentId))) return false;
              final seen = <String>{node.id};
              var parent = node.parentId;
              while (parent != null) {
                if (!seen.add(parent)) return false;
                OrganizationModel? parentNode;
                for (final candidate in nodes) {
                  if (candidate.id == parent) {
                    parentNode = candidate;
                    break;
                  }
                }
                if (parentNode == null) return false;
                parent = parentNode.parentId;
              }
            }
            return true;
          }
          '''
          new_snapshot = '''bool _organizationSnapshotValid(Iterable<OrganizationModel> values) {
            final nodes = values.toList();
            if (nodes.isEmpty) return false;
            final byId = {for (final node in nodes) node.id: node};
            if (byId.length != nodes.length) return false;
            final roots = nodes.where((o) => o.isRoot).toList();
            if (roots.length != 1) return false;
            if (roots.single.parentId != null) return false;
            if (roots.single.id != OrganizationModel.rootId) return false;
            if (roots.single.archived) return false;
            for (final node in nodes) {
              if (!node.isRoot) {
                final parentId = node.parentId;
                final parentNode = parentId == null ? null : byId[parentId];
                if (parentNode == null) return false;
                if (!node.archived && parentNode.archived) return false;
              }
              final seen = <String>{node.id};
              var parent = node.parentId;
              while (parent != null) {
                if (!seen.add(parent)) return false;
                final parentNode = byId[parent];
                if (parentNode == null) return false;
                parent = parentNode.parentId;
              }
            }
            return true;
          }
          '''
          # Dedent because YAML block indentation is not part of the script string.
          import textwrap
          old_snapshot = textwrap.dedent(old_snapshot)
          new_snapshot = textwrap.dedent(new_snapshot)
          if text.count(old_snapshot) != 1:
            raise SystemExit(f'organization snapshot block count={text.count(old_snapshot)}')
          text = text.replace(old_snapshot, new_snapshot, 1)

          old_org_remove = textwrap.dedent('''
            @override
            Future<void> removeById(String id) async {
              final b = box();
              if (b == null || id == OrganizationModel.rootId) return;
              final next = b.values.where((o) => o.id != id).toList();
              if (!_organizationSnapshotValid(next)) return;
              await b.delete(id);
            }
          ''').lstrip('\n')
          new_org_remove = textwrap.dedent('''
            @override
            Future<void> removeById(String id) async {
              // Organizations use archive/restore, not hard delete. Ignoring a
              // remote tombstone prevents dangling accounts, money, tasks and grants.
            }
          ''').lstrip('\n')
          if text.count(old_org_remove) != 1:
            raise SystemExit(f'organization remove block count={text.count(old_org_remove)}')
          text = text.replace(old_org_remove, new_org_remove, 1)

          old_account_apply = textwrap.dedent('''
            @override
            Future<bool> applyFields(Map<String, dynamic> fields) async {
              final b = box();
              final incoming = decode(fields);
              if (b == null || incoming == null) return false;
              if (!_organizationExistsActive(incoming.effectiveOrganizationId)) return false;
              await b.put(incoming.id, incoming);
              return true;
            }
          }

          class TransactionsSync extends SyncCollection<TransactionModel> {
          ''').lstrip('\n')
          new_account_apply = textwrap.dedent('''
            @override
            Future<bool> applyFields(Map<String, dynamic> fields) async {
              final b = box();
              final incoming = decode(fields);
              if (b == null || incoming == null) return false;
              if (!_organizationExistsActive(incoming.effectiveOrganizationId)) return false;
              final before = b.get(incoming.id);
              if (before != null &&
                  before.effectiveOrganizationId != incoming.effectiveOrganizationId &&
                  await AccountService.hasLinkedTransactions(incoming.id)) {
                return false;
              }
              await b.put(incoming.id, incoming);
              return true;
            }

            @override
            Future<void> removeById(String id) async {
              final b = box();
              final existing = b?.get(id);
              if (b == null || existing == null) return;
              if (existing.kind == AccountKind.main) return;
              if (await AccountService.hasLinkedTransactions(id)) return;
              await b.delete(id);
            }
          }

          class TransactionsSync extends SyncCollection<TransactionModel> {
          ''').lstrip('\n')
          if text.count(old_account_apply) != 1:
            raise SystemExit(f'account apply block count={text.count(old_account_apply)}')
          text = text.replace(old_account_apply, new_account_apply, 1)
          p.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/org-remediation-verification.yml')
          w = workflow.read_text(encoding='utf-8')
          begin = '  # BEGIN ONE_SHOT_SYNC_PATCH\n'
          end = '  # END ONE_SHOT_SYNC_PATCH\n'
          a = w.index(begin)
          b = w.index(end, a) + len(end)
          workflow.write_text(w[:a] + w[b:], encoding='utf-8')
      - name: Commit hardening
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/sync/sync_codec.dart .github/workflows/org-remediation-verification.yml
          git commit -m "fix: reject destructive sync referential changes"
          git push origin HEAD:agent/org-hierarchy-remediation-1
  # END ONE_SHOT_SYNC_PATCH

  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  remediation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Security, scope, money, sync, migration, UI and fault-injection suite
        run: >-
          flutter test
          test/organization_privilege_escalation_test.dart
          test/organization_domain_permission_test.dart
          test/organization_service_authorization_test.dart
          test/organization_scope_isolation_test.dart
          test/task_crm_organization_scope_test.dart
          test/organization_finance_negative_test.dart
          test/organization_forecast_permission_test.dart
          test/inter_org_visibility_test.dart
          test/inter_org_fault_injection_test.dart
          test/multi_currency_org_test.dart
          test/background_org_processing_test.dart
          test/sync_corruption_guard_test.dart
          test/sync_migration_grant_test.dart
          test/org_physical_ownership_test.dart
          test/organization_legacy_migration_rehearsal_test.dart
          test/organization_access_revocation_test.dart
          test/organization_finance_access_test.dart
          test/organization_sync_integrity_test.dart
          test/inter_org_transfer_test.dart
          test/organization_ui_behavior_test.dart
          test/organization_finance_ui_behavior_test.dart
          test/team_stats_organization_scope_ui_test.dart

  full-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
