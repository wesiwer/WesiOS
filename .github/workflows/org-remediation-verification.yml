name: Organization remediation verification

on:
  push:
    branches:
      - agent/org-hierarchy-remediation-1
  pull_request:
    branches:
      - agent/org-hierarchy-v1

concurrency:
  group: org-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERIFY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  account-history-hardening:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Make financial account lifecycle history-safe
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/features/treasury/services/account_service.dart')
          text = p.read_text(encoding='utf-8')
          old = '''    if (before != null && before.effectiveOrganizationId != orgId) {
      if (await hasLinkedTransactions(before.id)) {
        throw StateError(
          'cannot move account with existing transactions to another organization',
        );
      }
    }
'''
          new = '''    if (before != null && before.effectiveOrganizationId != orgId) {
      throw StateError(
        'account organization is immutable; use an explicit migration/reclassification flow',
      );
    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'account move block count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''    // Never trust the caller's cached operation count as the integrity source.
    // A stale UI or direct service invocation must not orphan ledger rows.
    final actualHasOperations =
        hasOperations || await hasLinkedTransactions(account.id);
    if (actualHasOperations) {
      await save(account.copyWith(archived: true));
      return true;
    }
    await CriticalAuditService.record(
      event: 'account.delete',
      entityType: 'account',
      entityId: account.id,
      organizationId: account.effectiveOrganizationId,
      before: _auditJson(account),
      after: null,
    );
    await box.delete(id);
    if (selectedId == id) await select(null);
    revision.value++;
    return true;
'''
          new = '''    // Financial accounts are historical entities. Even a currently empty
    // account may still be referenced by a cancelled InterOrgTransfer journal,
    // audit record or future reconciliation evidence. User deletion therefore
    // always means archive; physical removal belongs only to an explicit data
    // migration/purge procedure with dependency validation.
    await save(account.copyWith(archived: true));
    if (selectedId == id) await select(null);
    return true;
'''
          if text.count(old) != 1:
              raise SystemExit(f'account delete block count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('lib/core/sync/sync_codec.dart')
          text = p.read_text(encoding='utf-8')
          old = '''    final before = b.get(incoming.id);
    if (before != null &&
        before.effectiveOrganizationId != incoming.effectiveOrganizationId &&
        await AccountService.hasLinkedTransactions(incoming.id)) {
      return false;
    }
    await b.put(incoming.id, incoming);
    return true;
  }

  @override
  Future<void> removeById(String id) async {
    final b = box();
    final existing = b?.get(id);
    if (b == null || existing == null) return;
    if (existing.kind == AccountKind.main) return;
    if (await AccountService.hasLinkedTransactions(id)) return;
    await b.delete(id);
  }
}

class TransactionsSync extends SyncCollection<TransactionModel> {
'''
          new = '''    final before = b.get(incoming.id);
    if (before != null &&
        before.effectiveOrganizationId != incoming.effectiveOrganizationId) {
      return false;
    }
    await b.put(incoming.id, incoming);
    return true;
  }

  @override
  Future<void> removeById(String id) async {
    // Account lifecycle is archive-based. A remote tombstone cannot prove that
    // no ledger, cancelled InterOrg journal or audit history still references
    // the account, so generic sync never physically removes financial accounts.
  }
}

class TransactionsSync extends SyncCollection<TransactionModel> {
'''
          if text.count(old) != 1:
              raise SystemExit(f'AccountsSync integrity block count={text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('test/account_history_integrity_test.dart')
          p.write_text(r'''import 'dart:io';

import 'package:flutter_test/flutter_test.dart';
import 'package:hive/hive.dart';
import 'package:wesios/core/sync/sync_codec.dart';
import 'package:wesios/features/organizations/models/inter_org_transfer_model.dart';
import 'package:wesios/features/organizations/models/organization_model.dart';
import 'package:wesios/features/organizations/services/inter_org_transfer_service.dart';
import 'package:wesios/features/organizations/services/organization_service.dart';
import 'package:wesios/features/treasury/models/account_model.dart';
import 'package:wesios/features/treasury/services/account_service.dart';

void main() {
  TestWidgetsFlutterBinding.ensureInitialized();
  late Directory temp;

  setUpAll(() async {
    temp = await Directory.systemTemp.createTemp('wesios-account-history-');
    Hive.init(temp.path);
    if (!Hive.isAdapterRegistered(14)) Hive.registerAdapter(AccountKindAdapter());
    if (!Hive.isAdapterRegistered(15)) Hive.registerAdapter(AccountModelAdapter());
    if (!Hive.isAdapterRegistered(80)) Hive.registerAdapter(OrganizationStatusAdapter());
    if (!Hive.isAdapterRegistered(81)) Hive.registerAdapter(OrganizationModelAdapter());
    if (!Hive.isAdapterRegistered(83)) Hive.registerAdapter(InterOrgTransferTypeAdapter());
    if (!Hive.isAdapterRegistered(84)) Hive.registerAdapter(InterOrgTransferModelAdapter());
    await Hive.openBox<dynamic>('wesios_settings');
    await Hive.openBox<OrganizationModel>(OrganizationService.boxName);
    await Hive.openBox<AccountModel>('wesios_accounts');
    await Hive.openBox<InterOrgTransferModel>(InterOrgTransferService.boxName);
  });

  setUp(() async {
    await Hive.box<dynamic>('wesios_settings').clear();
    await Hive.box<OrganizationModel>(OrganizationService.boxName).clear();
    await Hive.box<AccountModel>('wesios_accounts').clear();
    await Hive.box<InterOrgTransferModel>(InterOrgTransferService.boxName).clear();
    await OrganizationService.ensureBaseline();
  });

  tearDownAll(() async {
    await Hive.close();
    if (await temp.exists()) await temp.delete(recursive: true);
  });

  test('existing financial account cannot be re-owned even when currently empty',
      () async {
    final child = await OrganizationService.create(
      name: 'Child',
      parentId: OrganizationModel.rootId,
      createdBy: 'setup',
    );
    final account = await AccountService.create(
      name: 'Historical account',
      organizationId: OrganizationModel.rootId,
    );

    await expectLater(
      AccountService.save(account.copyWith(organizationId: child.id)),
      throwsStateError,
    );
    expect(
      (await AccountService.byId(account.id))!.effectiveOrganizationId,
      OrganizationModel.rootId,
    );
  });

  test('user delete archives even an empty financial account', () async {
    final account = await AccountService.create(
      name: 'Empty account',
      organizationId: OrganizationModel.rootId,
    );

    expect(await AccountService.delete(account.id, hasOperations: false), isTrue);
    final persisted = await AccountService.byId(account.id);
    expect(persisted, isNotNull);
    expect(persisted!.archived, isTrue);
  });

  test('sync tombstone cannot erase account referenced by historical transfer journal',
      () async {
    final child = await OrganizationService.create(
      name: 'Child',
      parentId: OrganizationModel.rootId,
      createdBy: 'setup',
    );
    final from = await AccountService.create(
      name: 'Transfer source',
      organizationId: OrganizationModel.rootId,
    );
    final to = await AccountService.ensureMain(organizationId: child.id);
    final at = DateTime(2026, 8, 1);
    final transfer = InterOrgTransferModel(
      id: 'historical-transfer',
      fromOrganizationId: OrganizationModel.rootId,
      toOrganizationId: child.id,
      fromAccountId: from.id,
      toAccountId: to.id,
      amount: 100,
      currency: 'RUB',
      amountInFromOrgBase: 100,
      amountInToOrgBase: 100,
      type: InterOrgTransferType.internalTransfer,
      date: at,
      createdBy: 'owner',
      createdAt: at,
      linkedDebitTransactionId: 'historical-transfer_debit',
      linkedCreditTransactionId: 'historical-transfer_credit',
      cancelled: true,
      cancelledAt: at.add(const Duration(days: 1)),
      cancelledBy: 'owner',
    );
    await Hive.box<InterOrgTransferModel>(InterOrgTransferService.boxName)
        .put(transfer.id, transfer);

    await AccountsSync().removeById(from.id);
    expect(await AccountService.byId(from.id), isNotNull);
  });
}
''', encoding='utf-8')

      - name: Format and commit
        shell: bash
        run: |
          dart format lib/features/treasury/services/account_service.dart lib/core/sync/sync_codec.dart test/account_history_integrity_test.dart
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make financial account history immutable"
          git push origin HEAD:agent/org-hierarchy-remediation-1

  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFY_SHA }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  remediation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFY_SHA }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Security, scope, money, sync, migration, UI and fault-injection suite
        run: >-
          flutter test
          test/organization_privilege_escalation_test.dart
          test/organization_domain_permission_test.dart
          test/organization_service_authorization_test.dart
          test/organization_scope_isolation_test.dart
          test/task_crm_organization_scope_test.dart
          test/crm_interaction_integrity_test.dart
          test/organization_finance_negative_test.dart
          test/organization_forecast_permission_test.dart
          test/inter_org_visibility_test.dart
          test/inter_org_fault_injection_test.dart
          test/multi_currency_org_test.dart
          test/account_liquidity_migration_test.dart
          test/background_org_processing_test.dart
          test/sync_corruption_guard_test.dart
          test/sync_migration_grant_test.dart
          test/sync_repeat_audit_security_test.dart
          test/employee_sync_lifecycle_test.dart
          test/account_history_integrity_test.dart
          test/org_physical_ownership_test.dart
          test/organization_legacy_migration_rehearsal_test.dart
          test/organization_access_revocation_test.dart
          test/organization_finance_access_test.dart
          test/organization_sync_integrity_test.dart
          test/inter_org_transfer_test.dart
          test/organization_ui_behavior_test.dart
          test/organization_finance_ui_behavior_test.dart
          test/team_stats_organization_scope_ui_test.dart

  full-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFY_SHA }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFY_SHA }}
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFY_SHA }}
      - name: Verify exact head
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:VERIFY_SHA) {
            throw "Expected exact head $env:VERIFY_SHA but checked out $actual"
          }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
