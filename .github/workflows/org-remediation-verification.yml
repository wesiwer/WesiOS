name: Organization remediation verification

on:
  push:
    branches:
      - agent/org-hierarchy-remediation-1
  pull_request:
    branches:
      - agent/org-hierarchy-v1

concurrency:
  group: org-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # BEGIN OWNER_SYNC_PATCH
  owner-sync-patch:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
      - name: Protect owner identity at sync boundary
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/core/sync/sync_codec.dart')
          text = p.read_text(encoding='utf-8')
          old = """      demoStats: stats is Map
          ? {
              for (final e in stats.entries)
                if (_double(e.value) != null) '${e.key}': _double(e.value)!,
            }
          : const {},
    );
  }
}

class OrganizationGrantsSync extends SyncCollection<OrganizationAccessGrant> {
"""
          new = """      demoStats: stats is Map
          ? {
              for (final e in stats.entries)
                if (_double(e.value) != null) '${e.key}': _double(e.value)!,
            }
          : const {},
    );
  }

  @override
  Future<bool> applyFields(Map<String, dynamic> fields) async {
    final b = box();
    final incoming = decode(fields);
    if (b == null || incoming == null) return false;
    final existing = b.get(incoming.id);
    EmployeeModel? localOwner;
    for (final row in b.values) {
      if (row.isOwner) {
        localOwner = row;
        break;
      }
    }

    // Generic dataset sync is not an identity authority. A trusted login/server
    // identity bootstrap must establish the owner locally first. Sync may then
    // refresh that same owner's directory fields, but it cannot mint a second
    // owner, promote a normal employee, demote the owner, or replace owner id.
    if (incoming.isOwner) {
      if (existing?.isOwner != true) return false;
      if (localOwner != null && localOwner.id != incoming.id) return false;
    }
    if (existing?.isOwner == true && !incoming.isOwner) return false;

    await b.put(incoming.id, incoming);
    return true;
  }

  @override
  Future<void> removeById(String id) async {
    final b = box();
    final existing = b?.get(id);
    if (b == null || existing == null || existing.isOwner) return;
    await b.delete(id);
  }
}

class OrganizationGrantsSync extends SyncCollection<OrganizationAccessGrant> {
"""
