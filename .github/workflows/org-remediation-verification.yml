              section = """

### I4. Owner identity sync boundary — NEW RE-AUDIT HARDENING, IMPLEMENTED/PENDING FINAL EVIDENCE

Generic dataset sync не является identity authority:

- `isOwner=true` не может повысить обычного сотрудника до owner;
- новый owner не может появиться только из employee sync record;
- существующий owner не может быть понижен или удалён remote tombstone;
