name: Organization remediation verification

on:
  pull_request:
    branches:
      - agent/org-hierarchy-v1

concurrency:
  group: org-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-sync-patch:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
      - name: Patch sync grant authorization and remove one-shot helper
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/core/sync/sync_codec.dart')
          text = p.read_text(encoding='utf-8')
          old = '''  bool _actorMayHaveIssued(OrganizationAccessGrant incoming) {
    if (incoming.createdBy == 'sync' || incoming.createdBy == 'migration') {
      return true;
    }
    if (!_employeeExists(incoming.createdBy)) return false;
'''
          new = '''  bool _actorMayHaveIssued(OrganizationAccessGrant incoming) {
    // Transport identity is never an authorization principal.
    if (incoming.createdBy == 'untrusted-sync' || incoming.createdBy == 'sync') {
      return false;
    }

    // Legacy migration grants are system-generated independently on existing
    // installations. A new device may receive them through sync, but only in
    // the exact non-escalating shape that ensureLegacyGrants() could produce.
    if (incoming.createdBy == 'migration/internal' ||
        incoming.createdBy == 'migration') {
      if (incoming.organizationId != OrganizationModel.rootId) return false;
      final target = Hive.box<EmployeeModel>(TeamService.boxName)
          .get(incoming.employeeId);
      if (target == null) return false;
      if (target.isOwner) {
        return incoming.includeSubtree &&
            incoming.canViewTeamFinance &&
            incoming.canViewSelfFinance &&
            incoming.permissions.toSet().containsAll(OrganizationPermissions.all) &&
            OrganizationPermissions.all.toSet().containsAll(incoming.permissions);
      }
      if (incoming.includeSubtree) return false;
      final financeVisible = target.permissions.allows(TeamModules.treasury) ||
          target.permissions.allows(TeamModules.forecast) ||
          target.permissions.allows(TeamModules.analytics);
      final expected = financeVisible
          ? <String>{
              OrganizationPermissions.view,
              OrganizationPermissions.viewFinance,
              OrganizationPermissions.createTransactions,
              OrganizationPermissions.editTransactions,
              OrganizationPermissions.manageAccounts,
              OrganizationPermissions.manageRecurring,
              OrganizationPermissions.viewForecast,
            }
          : <String>{OrganizationPermissions.view};
      if (incoming.permissions.toSet().length != expected.length ||
          !incoming.permissions.toSet().containsAll(expected)) return false;
      if (incoming.canViewTeamFinance !=
          (financeVisible && target.permissions.canSeeOthersStats)) return false;
      return incoming.canViewSelfFinance;
    }

    if (!_employeeExists(incoming.createdBy)) return false;
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one migration grant authorization block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          helper = Path('.github/workflows/org-sync-migration-patch.yml')
          if helper.exists():
              helper.unlink()
      - name: Commit patch
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/sync/sync_codec.dart .github/workflows/org-sync-migration-patch.yml || true
          git commit -m "fix: validate synced legacy migration grants safely"
          git push origin HEAD:agent/org-hierarchy-remediation-1

  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  remediation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Security, scope, money, sync, migration, UI and fault-injection suite
        run: >-
          flutter test
          test/organization_privilege_escalation_test.dart
          test/organization_domain_permission_test.dart
          test/organization_service_authorization_test.dart
          test/organization_scope_isolation_test.dart
          test/task_crm_organization_scope_test.dart
          test/organization_finance_negative_test.dart
          test/organization_forecast_permission_test.dart
          test/inter_org_visibility_test.dart
          test/inter_org_fault_injection_test.dart
          test/multi_currency_org_test.dart
          test/background_org_processing_test.dart
          test/sync_corruption_guard_test.dart
          test/sync_migration_grant_test.dart
          test/org_physical_ownership_test.dart
          test/organization_legacy_migration_rehearsal_test.dart
          test/organization_access_revocation_test.dart
          test/organization_finance_access_test.dart
          test/organization_sync_integrity_test.dart
          test/inter_org_transfer_test.dart
          test/organization_ui_behavior_test.dart
          test/organization_finance_ui_behavior_test.dart
          test/team_stats_organization_scope_ui_test.dart

  full-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
