name: Organization remediation verification

on:
  push:
    branches:
      - agent/org-hierarchy-remediation-1
  pull_request:
    branches:
      - agent/org-hierarchy-v1

concurrency:
  group: org-remediation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repeat-audit-hardening:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Apply repeat-audit source fixes
        shell: python
        run: |
          from pathlib import Path

          # ---- EmployeesSync: generic data sync cannot mint/demote/delete owner ----
          p = Path('lib/core/sync/sync_codec.dart')
          text = p.read_text(encoding='utf-8')
          if 'Generic dataset sync is not an identity authority' not in text:
              cls = text.index('class EmployeesSync extends SyncCollection<EmployeeModel>')
              end = text.index('\nclass OrganizationGrantsSync extends', cls)
              block = text[cls:end]
              close = block.rfind('\n}')
              if close < 0:
                  raise SystemExit('EmployeesSync closing brace not found')
              addition = r'''

  @override
  Future<bool> applyFields(Map<String, dynamic> fields) async {
    final b = box();
    final incoming = decode(fields);
    if (b == null || incoming == null) return false;
    final existing = b.get(incoming.id);
    EmployeeModel? localOwner;
    for (final row in b.values) {
      if (row.isOwner) {
        localOwner = row;
        break;
      }
    }

    // Generic dataset sync is not an identity authority. Trusted login/server
    // identity bootstrap must establish the owner locally first.
    if (incoming.isOwner) {
      if (existing?.isOwner != true) return false;
      if (localOwner != null && localOwner.id != incoming.id) return false;
    }
    if (existing?.isOwner == true && !incoming.isOwner) return false;

    await b.put(incoming.id, incoming);
    return true;
  }

  @override
  Future<void> removeById(String id) async {
    final b = box();
    final existing = b?.get(id);
    if (b == null || existing == null || existing.isOwner) return;
    await b.delete(id);
  }
'''
              block = block[:close] + addition + block[close:]
              text = text[:cls] + block + text[end:]

          # ---- InterOrg sync: immutable financial core + one-way cancellation ----
          cls = text.index('class InterOrgTransfersSync extends SyncCollection<InterOrgTransferModel>')
          next_cls = text.index('\nclass TransactionAuditsSync extends', cls)
          block = text[cls:next_cls]
          apply_at = block.index('  @override\n  Future<bool> applyFields(Map<String, dynamic> fields) async {')
          helper = r'''  bool _sameImmutableCore(
    InterOrgTransferModel a,
    InterOrgTransferModel b,
  ) =>
      a.fromOrganizationId == b.fromOrganizationId &&
      a.toOrganizationId == b.toOrganizationId &&
      a.fromAccountId == b.fromAccountId &&
      a.toAccountId == b.toAccountId &&
      a.amount == b.amount &&
      a.currency == b.currency &&
      a.amountInFromOrgBase == b.amountInFromOrgBase &&
      a.amountInToOrgBase == b.amountInToOrgBase &&
      a.type == b.type &&
      a.note == b.note &&
      a.date == b.date &&
      a.createdBy == b.createdBy &&
      a.createdAt == b.createdAt &&
      a.linkedDebitTransactionId == b.linkedDebitTransactionId &&
      a.linkedCreditTransactionId == b.linkedCreditTransactionId &&
      a.ownerEmployeeId == b.ownerEmployeeId;

  @override
  Future<bool> applyFields(Map<String, dynamic> fields) async {
    final b = box();
    final incoming = decode(fields);
    if (b == null || incoming == null) return false;
    if (!_organizationExistsActive(incoming.fromOrganizationId) ||
        !_organizationExistsActive(incoming.toOrganizationId)) return false;
    final from = _account(incoming.fromAccountId);
    final to = _account(incoming.toAccountId);
    if (from == null ||
        to == null ||
        from.archived ||
        to.archived ||
        from.effectiveOrganizationId != incoming.fromOrganizationId ||
        to.effectiveOrganizationId != incoming.toOrganizationId) return false;
    if (incoming.ownerEmployeeId != null &&
        !_employeeExists(incoming.ownerEmployeeId!)) return false;

    final existing = b.get(incoming.id);
    if (existing != null) {
      if (!_sameImmutableCore(existing, incoming)) return false;
      if (existing.cancelled) {
        if (!incoming.cancelled ||
            incoming.cancelledAt != existing.cancelledAt ||
            incoming.cancelledBy != existing.cancelledBy) return false;
      } else if (incoming.cancelled) {
        if (incoming.cancelledAt == null ||
            incoming.cancelledBy == null ||
            incoming.cancelledBy!.trim().isEmpty) return false;
      } else if (incoming.cancelledAt != null || incoming.cancelledBy != null) {
        return false;
      }
    } else {
      if (incoming.cancelled) {
        if (incoming.cancelledAt == null ||
            incoming.cancelledBy == null ||
            incoming.cancelledBy!.trim().isEmpty) return false;
      } else if (incoming.cancelledAt != null || incoming.cancelledBy != null) {
        return false;
      }
    }

    await b.put(incoming.id, incoming);
    await InterOrgTransferService.recoverPending();
    return true;
  }
'''
          # replace old apply method through final class brace
          old_tail = block[apply_at:]
          last_close = old_tail.rfind('\n}')
          if last_close < 0:
              raise SystemExit('InterOrgTransfersSync closing brace not found')
          block = block[:apply_at] + helper + old_tail[last_close:]
          text = text[:cls] + block + text[next_cls:]
          p.write_text(text, encoding='utf-8')

          # ---- CRM: deal/client parent integrity and old-parent authorization ----
          p = Path('lib/features/crm/services/crm_service.dart')
          text = p.read_text(encoding='utf-8')
          start = text.index('  static Future<void> saveInteraction(CrmInteraction interaction) async {')
          end = text.index('  static Future<List<CrmDeal>> dealsForClient', start)
          replacement = r'''  static Future<void> _requireInteractionWrite(
    CrmInteraction interaction,
    Map<String, CrmClient> clients,
    Map<String, CrmDeal> deals,
  ) async {
    final client = clients[interaction.clientId];
    if (client == null) throw StateError('CRM client does not exist');
    await _requireOrgWrite(client.organizationId);

    CrmDeal? linked;
    if (interaction.dealId != null) {
      linked = deals[interaction.dealId!];
      if (linked == null ||
          linked.clientId != client.id ||
          linked.organizationId != client.organizationId) {
        throw StateError('CRM interaction deal/client mismatch');
      }
    }

    if (!_clientOwnedByCurrent(client) &&
        (linked == null || !_dealOwnedByCurrent(linked, clients))) {
      throw StateError('CRM interaction parent is outside employee scope');
    }
  }

  static Future<void> saveInteraction(CrmInteraction interaction) async {
    final clients = {for (final c in await clientsRaw()) c.id: c};
    final deals = {for (final d in await dealsRaw()) d.id: d};
    await _requireInteractionWrite(interaction, clients, deals);

    final all = await interactionsRaw();
    final index = all.indexWhere((value) => value.id == interaction.id);
    if (index < 0) {
      all.add(interaction);
    } else {
      // Re-authorize the old parent before replacing by id. Re-parenting an
      // inaccessible row must never become an ownership bypass.
      await _requireInteractionWrite(all[index], clients, deals);
      all[index] = interaction;
    }
    await _write(_interactionsKey, all, (value) => value.toJson());

    if (interaction.nextActionAt != null) {
      final allClients = await clientsRaw();
      final clientIndex =
          allClients.indexWhere((value) => value.id == interaction.clientId);
      if (clientIndex >= 0) {
        allClients[clientIndex] = allClients[clientIndex].copyWith(
          nextContactAt: interaction.nextActionAt,
          updatedAt: DateTime.now(),
        );
        await _write(_clientsKey, allClients, (value) => value.toJson());
      }
    }
  }

  static Future<void> deleteInteraction(String id) async {
    final all = await interactionsRaw();
    final target = all.where((value) => value.id == id).firstOrNull;
    if (target == null) return;
    final clients = {for (final c in await clientsRaw()) c.id: c};
    final deals = {for (final d in await dealsRaw()) d.id: d};
    await _requireInteractionWrite(target, clients, deals);
    await _write(
      _interactionsKey,
      all.where((value) => value.id != id).toList(),
      (value) => value.toJson(),
    );
  }

'''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          # ---- Small repeat-audit math regression in Horizon native risk mean ----
          p = Path('lib/features/treasury/services/horizon_engine_competition.dart')
          text = p.read_text(encoding='utf-8')
          old = 'values.fold<double>(0, (a, b) => a + b) / results.length'
          if old in text:
              text = text.replace(old,
                  'values.fold<double>(0, (a, b) => a + b) / values.length', 1)
          p.write_text(text, encoding='utf-8')

          # ---- Sync negative tests ----
          p = Path('test/sync_corruption_guard_test.dart')
          text = p.read_text(encoding='utf-8')
          additions = ''
          if 'employee sync cannot mint, demote or tombstone owner identity' not in text:
              additions += r'''

  test('employee sync cannot mint, demote or tombstone owner identity', () async {
    final employees = Hive.box<EmployeeModel>(TeamService.boxName);
    final owner = EmployeeModel(
      id: 'owner-secure',
      login: 'owner-secure',
      fullName: 'Owner',
      createdAt: DateTime(2026, 1, 1),
      permissions: TeamPermissions.owner,
      isOwner: true,
    );
    final employee = EmployeeModel(
      id: 'ordinary',
      login: 'ordinary',
      fullName: 'Ordinary',
      createdAt: DateTime(2026, 1, 2),
      permissions: const TeamPermissions(),
    );
    await employees.put(owner.id, owner);
    await employees.put(employee.id, employee);
    final sync = EmployeesSync();

    final forgedOwner = sync.encode(employee)..['isOwner'] = true;
    expect(await sync.applyFields(forgedOwner), isFalse);
    expect(TeamService.byId(employee.id)!.isOwner, isFalse);

    final forgedNewOwner = sync.encode(employee)
      ..['id'] = 'remote-owner'
      ..['login'] = 'remote-owner'
      ..['isOwner'] = true;
    expect(await sync.applyFields(forgedNewOwner), isFalse);
    expect(TeamService.byId('remote-owner'), isNull);

    final demotedOwner = sync.encode(owner)..['isOwner'] = false;
    expect(await sync.applyFields(demotedOwner), isFalse);
    expect(TeamService.byId(owner.id)!.isOwner, isTrue);

    await sync.removeById(owner.id);
    expect(TeamService.byId(owner.id), isNotNull);
  });
'''
          if 'inter-org sync cannot rewrite immutable transfer core' not in text:
              additions += r'''

  test('inter-org sync cannot rewrite immutable transfer core', () async {
    final a = await OrganizationService.create(
      name: 'Immutable A',
      parentId: OrganizationModel.rootId,
      createdBy: 'setup',
    );
    final b = await OrganizationService.create(
      name: 'Immutable B',
      parentId: OrganizationModel.rootId,
      createdBy: 'setup',
    );
    final accountA = await AccountService.ensureMain(organizationId: a.id);
    final accountB = await AccountService.ensureMain(organizationId: b.id);
    final now = DateTime(2026, 8, 1);
    final transfer = InterOrgTransferModel(
      id: 'immutable-transfer',
      fromOrganizationId: a.id,
      toOrganizationId: b.id,
      fromAccountId: accountA.id,
      toAccountId: accountB.id,
      amount: 100,
      currency: 'RUB',
      amountInFromOrgBase: 100,
      amountInToOrgBase: 100,
      type: InterOrgTransferType.internalTransfer,
      date: now,
      createdBy: 'owner',
      createdAt: now,
      linkedDebitTransactionId: 'immutable-transfer_debit',
      linkedCreditTransactionId: 'immutable-transfer_credit',
    );
    await Hive.box<InterOrgTransferModel>(InterOrgTransferService.boxName)
        .put(transfer.id, transfer);

    final forged = InterOrgTransfersSync().encode(transfer)..['amount'] = 999;
    expect(await InterOrgTransfersSync().applyFields(forged), isFalse);
    expect(
      Hive.box<InterOrgTransferModel>(InterOrgTransferService.boxName)
          .get(transfer.id)!
          .amount,
      100,
    );
  });
'''
          if additions:
              pos = text.rfind('\n}')
              if pos < 0:
                  raise SystemExit('sync_corruption_guard closing brace missing')
              text = text[:pos] + additions + text[pos:]
          p.write_text(text, encoding='utf-8')

          # ---- CRM bridge negative test ----
          p = Path('test/task_crm_organization_scope_test.dart')
          text = p.read_text(encoding='utf-8')
          if 'CRM interaction cannot use an owned deal as a bridge to another client' not in text:
              addition = r'''

  test('CRM interaction cannot use an owned deal as a bridge to another client', () async {
    final alice = await addEmployee('alice');
    final bob = await addEmployee('bob');
    await OrganizationAccessService.grant(
      employeeId: alice.id,
      organizationId: OrganizationModel.rootId,
      includeSubtree: false,
      permissions: const [OrganizationPermissions.view],
      enforceActor: false,
    );
    final now = DateTime(2026, 8, 1);
    await CrmService.saveClient(CrmClient(
      id: 'alice-client',
      name: 'Alice client',
      createdAt: now,
      updatedAt: now,
      organizationId: OrganizationModel.rootId,
      ownerEmployeeId: alice.id,
    ));
    await CrmService.saveClient(CrmClient(
      id: 'bob-client',
      name: 'Bob client',
      createdAt: now,
      updatedAt: now,
      organizationId: OrganizationModel.rootId,
      ownerEmployeeId: bob.id,
    ));
    await CrmService.saveDeal(CrmDeal(
      id: 'alice-deal',
      clientId: 'alice-client',
      title: 'Alice deal',
      createdAt: now,
      updatedAt: now,
      organizationId: OrganizationModel.rootId,
      responsibleEmployeeId: alice.id,
    ));

    await signIn(alice.id);
    await OrganizationContext.selectOrganization(OrganizationModel.rootId);
    await OrganizationContext.setScope(OrganizationScope.only);

    await expectLater(
      CrmService.saveInteraction(CrmInteraction(
        id: 'bridge',
        clientId: 'bob-client',
        dealId: 'alice-deal',
        title: 'Forbidden bridge',
        details: 'must fail',
        at: now,
      )),
      throwsA(isA<StateError>()),
    );
    expect(
      (await CrmService.interactionsRaw()).where((e) => e.id == 'bridge'),
      isEmpty,
    );
  });
'''
              pos = text.rfind('\n}')
              if pos < 0:
                  raise SystemExit('task_crm test closing brace missing')
              text = text[:pos] + addition + text[pos:]
          p.write_text(text, encoding='utf-8')

          # Remove temporary trigger marker if still present.
          trigger = Path('.github/repeat-audit-trigger.txt')
          if trigger.exists():
              trigger.unlink()

      - name: Format and commit repeat-audit fixes
        shell: bash
        run: |
          dart format \
            lib/core/sync/sync_codec.dart \
            lib/features/crm/services/crm_service.dart \
            lib/features/treasury/services/horizon_engine_competition.dart \
            test/sync_corruption_guard_test.dart \
            test/task_crm_organization_scope_test.dart
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hardening changes needed"
            exit 0
          fi
          git commit -m "fix: close repeat-audit organization integrity gaps"
          git push origin HEAD:agent/org-hierarchy-remediation-1

  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos

  remediation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Security, scope, money, sync, migration, UI and fault-injection suite
        run: >-
          flutter test
          test/organization_privilege_escalation_test.dart
          test/organization_domain_permission_test.dart
          test/organization_service_authorization_test.dart
          test/organization_scope_isolation_test.dart
          test/task_crm_organization_scope_test.dart
          test/organization_finance_negative_test.dart
          test/organization_forecast_permission_test.dart
          test/inter_org_visibility_test.dart
          test/inter_org_fault_injection_test.dart
          test/multi_currency_org_test.dart
          test/background_org_processing_test.dart
          test/sync_corruption_guard_test.dart
          test/sync_migration_grant_test.dart
          test/org_physical_ownership_test.dart
          test/organization_legacy_migration_rehearsal_test.dart
          test/organization_access_revocation_test.dart
          test/organization_finance_access_test.dart
          test/organization_sync_integrity_test.dart
          test/inter_org_transfer_test.dart
          test/organization_ui_behavior_test.dart
          test/organization_finance_ui_behavior_test.dart
          test/team_stats_organization_scope_ui_test.dart

  full-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  android-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
