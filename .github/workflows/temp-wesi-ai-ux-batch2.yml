name: Temporary Wesi AI mobile UX batch 2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/temp-wesi-ai-ux-batch2.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('lib/features/ai/ai_assistant_v2_screen.dart'); s=p.read_text()
          a=s.index('  Widget _sidebar(WesiAiManagedChatController controller) {'); b=s.index('  Widget _sidebarUtilities(',a); r=s[a:b]
          r=r.replace('    return Column(\n      children: [','    return ListView(\n      padding: EdgeInsets.zero,\n      children: [',1)
          r=r.replace('constraints: const BoxConstraints(maxHeight: 220),','constraints: const BoxConstraints(),',1)
          r=r.replace('          child: ListView(\n            shrinkWrap: true,','          child: ListView(\n            shrinkWrap: true,\n            physics: const NeverScrollableScrollPhysics(),',1)
          old='        Expanded(\n          child: ListView(\n            padding: const EdgeInsets.symmetric(vertical: 6),'
          new='        ListView(\n          shrinkWrap: true,\n          physics: const NeverScrollableScrollPhysics(),\n          padding: const EdgeInsets.symmetric(vertical: 6),'
          assert old in r; r=r.replace(old,new,1)
          old='            ],\n          ),\n        ),\n      ],\n    );\n  }\n\n'; new='            ],\n          ),\n      ],\n    );\n  }\n\n'; assert old in r; r=r.replace(old,new,1)
          s=s[:a]+r+s[b:]
          pattern=re.compile(r'      final attachment = await showDialog<WesiAiAttachment>\(.*?      \);\n      if \(attachment == null',re.S)
          repl='''      final attachment = await Navigator.of(context).push<WesiAiAttachment>(\n        MaterialPageRoute<WesiAiAttachment>(\n          fullscreenDialog: true,\n          builder: (_) => const WesiAiCameraCaptureScreen(),\n        ),\n      );\n      if (attachment == null'''
          s,n=pattern.subn(repl,s,count=1); assert n==1; p.write_text(s)

          p=Path('lib/features/ai/widgets/wesi_ai_camera_capture.dart'); s=p.read_text()
          old='''            if (controller != null && controller.value.isInitialized)\n              Center(\n                child: AspectRatio(\n                  aspectRatio: controller.value.aspectRatio,\n                  child: CameraPreview(controller),\n                ),\n              )'''
          new='''            if (controller != null && controller.value.isInitialized)\n              LayoutBuilder(\n                builder: (context, constraints) {\n                  final preview = controller.value.previewSize;\n                  return ClipRect(\n                    child: SizedBox.expand(\n                      child: FittedBox(\n                        fit: BoxFit.cover,\n                        child: SizedBox(\n                          width: preview?.height ?? constraints.maxWidth,\n                          height: preview?.width ?? constraints.maxHeight,\n                          child: CameraPreview(controller),\n                        ),\n                      ),\n                    ),\n                  );\n                },\n              )'''
          assert old in s; p.write_text(s.replace(old,new,1))

          p=Path('lib/features/ai/widgets/wesi_ai_rich_message.dart'); s=p.read_text()
          old="""  static String displayMarkdown(String markdown) => markdown.replaceAllMapped(\n        RegExp(r'^\\s{0,3}#{1,6}\\s+(.+)$', multiLine: true),\n        (match) => '**${match.group(1)?.trim() ?? ''}**',\n      );"""
          new=r'''  static String displayMarkdown(String markdown) {
    var value = markdown.replaceAllMapped(
      RegExp(r'^\s{0,3}#{1,6}\s+(.+)$', multiLine: true),
      (match) => '**${match.group(1)?.trim() ?? ''}**',
    );
    const commands = <String, String>{
      r'\times': '×', r'\cdot': '·', r'\pm': '±', r'\leq': '≤',
      r'\geq': '≥', r'\neq': '≠', r'\approx': '≈', r'\infty': '∞',
      r'\pi': 'π', r'\alpha': 'α', r'\beta': 'β', r'\gamma': 'γ',
    };
    for (final entry in commands.entries) {
      value = value.replaceAll(entry.key, entry.value);
    }
    value = value.replaceAllMapped(
      RegExp(r'\\sqrt\{([^{}]+)\}'),
      (m) => '√(${m.group(1) ?? ''})',
    );
    value = value.replaceAllMapped(
      RegExp(r'\\frac\{([^{}]+)\}\{([^{}]+)\}'),
      (m) => '(${m.group(1) ?? ''})⁄(${m.group(2) ?? ''})',
    );
    value = _script(value, true);
    value = _script(value, false);
    return value.replaceAll(RegExp(r'(?<!\\)\$(.+?)(?<!\\)\$'), r'$1');
  }

  static String _script(String value, bool superscript) {
    const sup = <String,String>{'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','-':'⁻','=':'⁼','(':'⁽',')':'⁾','n':'ⁿ','i':'ⁱ'};
    const sub = <String,String>{'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','-':'₋','=':'₌','(':'₍',')':'₎','a':'ₐ','e':'ₑ','i':'ᵢ','o':'ₒ','r':'ᵣ','u':'ᵤ','v':'ᵥ','x':'ₓ'};
    final map = superscript ? sup : sub;
    final marker = superscript ? '^' : '_';
    return value.replaceAllMapped(
      RegExp('${RegExp.escape(marker)}(?:\\{([^{}]+)\\}|([0-9+\\-=()nieaoruvx]+))'),
      (m) {
        final raw = m.group(1) ?? m.group(2) ?? '';
        if (raw.isEmpty || raw.split('').any((c) => !map.containsKey(c))) return m.group(0) ?? '';
        return raw.split('').map((c) => map[c]!).join();
      },
    );
  }'''
          assert old in s; s=s.replace(old,new,1)
          old='                  label: Text(option),\n                  onPressed: onAnswer == null ? null : () => onAnswer!(option),'
          new='                  label: Text(_visibleOption(option)),\n                  onPressed: onAnswer == null ? null : () => onAnswer!(option),'; assert old in s; s=s.replace(old,new,1)
          anchor='  Future<void> _customAnswer(BuildContext context) async {'
          helper=r'''  String _visibleOption(String option) {
    final value = option.trim();
    if (value == 'org_wesi_inc') return 'Wesi Inc';
    if (value == 'org_wesi_beats') return 'Wesi Beats';
    if (value.startsWith('org_')) {
      final raw = value.substring(4);
      if (RegExp(r'^\d+$').hasMatch(raw)) {
        final suffix = raw.length <= 4 ? raw : raw.substring(raw.length - 4);
        return 'Организация ••••$suffix';
      }
      return raw.split('_').where((p) => p.isNotEmpty).map((p) => p[0].toUpperCase() + p.substring(1)).join(' ');
    }
    return value;
  }

'''
          assert anchor in s; p.write_text(s.replace(anchor,helper+anchor,1))
          PY
          dart format lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/widgets/wesi_ai_camera_capture.dart lib/features/ai/widgets/wesi_ai_rich_message.dart
          git diff --check
      - name: Validate
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/widgets/wesi_ai_camera_capture.dart lib/features/ai/widgets/wesi_ai_rich_message.dart
          git commit -m "fix(ai): polish mobile sidebar camera and math rendering"
          git push origin HEAD:fix/wesi-ai-tool-agent-handoff
