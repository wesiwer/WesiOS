name: Apply AI chat redesign and queue once

on:
  push:
    paths:
      - '.github/workflows/apply-ai-chat-redesign-queue-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-chat-ui-hardening-v4
          token: ${{ github.token }}
      - name: Patch product code and master specification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------------- Managed controller: FIFO user-turn queue ----------------
          p = Path('lib/features/ai/wesi_ai_managed_controller.dart')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r"class _TransientRetryPayload \{.*?\n  @override\n  Future<void> createConversation",
              re.S,
          )
          replacement = r'''class _TransientRetryPayload {
            final String prompt;
            final List<WesiAiAttachment> attachments;
            const _TransientRetryPayload(this.prompt, this.attachments);
          }

          class WesiAiQueuedTurn {
            final String conversationId;
            final String text;
            final List<WesiAiAttachment> attachments;
            final DateTime queuedAt;

            const WesiAiQueuedTurn({
              required this.conversationId,
              required this.text,
              required this.attachments,
              required this.queuedAt,
            });

            String get preview {
              if (text.trim().isNotEmpty) return text.trim();
              if (attachments.length == 1) return attachments.first.name;
              if (attachments.isNotEmpty) return 'Вложения: ${attachments.length}';
              return 'Сообщение';
            }
          }

          class WesiAiManagedChatController extends WesiAiLobbyChatController {
            static const int maxQueuedTurns = 12;

            final Map<String, _TransientRetryPayload> _attachmentRetries =
                <String, _TransientRetryPayload>{};
            final List<WesiAiQueuedTurn> _queuedTurns = <WesiAiQueuedTurn>[];
            bool _drainingQueue = false;

            WesiAiManagedChatController({required WesiAiLocalStore store})
                : super(store: store);

            int get queuedTurnCount => _queuedTurns.length;
            List<WesiAiQueuedTurn> get queuedTurns =>
                List<WesiAiQueuedTurn>.unmodifiable(_queuedTurns);
            bool get processing => sending || _drainingQueue || _queuedTurns.isNotEmpty;

            @override
            Future<void> addUserMessage(
              String text, {
              List<WesiAiAttachment> attachments = const <WesiAiAttachment>[],
            }) async {
              final conversation = state.activeConversation;
              final clean = text.trim();
              if (conversation == null || (clean.isEmpty && attachments.isEmpty)) return;

              if (sending || _drainingQueue) {
                if (_queuedTurns.length >= maxQueuedTurns) {
                  await _appendQueueFullError(conversation.id);
                  return;
                }
                _queuedTurns.add(
                  WesiAiQueuedTurn(
                    conversationId: conversation.id,
                    text: clean,
                    attachments: List<WesiAiAttachment>.unmodifiable(attachments),
                    queuedAt: DateTime.now(),
                  ),
                );
                notifyListeners();
                return;
              }

              await _sendNow(clean, attachments: attachments);
              await _drainQueuedTurns();
            }

            Future<void> _sendNow(
              String text, {
              List<WesiAiAttachment> attachments = const <WesiAiAttachment>[],
            }) async {
              final conversationId = state.activeConversationId;
              final previousUserIds = conversationId == null
                  ? const <String>{}
                  : state
                      .messagesFor(conversationId)
                      .where((message) => message.author == WesiAiMessageAuthor.user)
                      .map((message) => message.id)
                      .toSet();
              await super.addUserMessage(text, attachments: attachments);
              if (attachments.isEmpty || conversationId == null) return;
              WesiAiMessage? added;
              for (final message in state.messagesFor(conversationId).reversed) {
                if (message.author == WesiAiMessageAuthor.user &&
                    !previousUserIds.contains(message.id)) {
                  added = message;
                  break;
                }
              }
              if (added == null) return;
              _attachmentRetries[added.id] = _TransientRetryPayload(
                text.trim(),
                List<WesiAiAttachment>.unmodifiable(attachments),
              );
              while (_attachmentRetries.length > 8) {
                _attachmentRetries.remove(_attachmentRetries.keys.first);
              }
            }

            Future<void> _drainQueuedTurns() async {
              if (_drainingQueue || sending || _queuedTurns.isEmpty) return;
              _drainingQueue = true;
              notifyListeners();
              try {
                while (_queuedTurns.isNotEmpty) {
                  final turn = _queuedTurns.removeAt(0);
                  WesiAiConversation? target;
                  for (final conversation in state.conversations) {
                    if (conversation.id == turn.conversationId && !conversation.archived) {
                      target = conversation;
                      break;
                    }
                  }
                  if (target == null) {
                    notifyListeners();
                    continue;
                  }
                  if (state.activeConversationId != target.id) {
                    state = state.copyWith(
                      activeConversationId: target.id,
                      activeProjectId: target.projectId,
                      clearActiveProject: target.projectId == null,
                    );
                    await _save();
                  } else {
                    notifyListeners();
                  }
                  await _sendNow(turn.text, attachments: turn.attachments);
                }
              } finally {
                _drainingQueue = false;
                notifyListeners();
              }
            }

            Future<void> _appendQueueFullError(String conversationId) async {
              final at = DateTime.now();
              state = state.copyWith(
                messages: <WesiAiMessage>[
                  ...state.messages,
                  WesiAiMessage(
                    id: '${at.microsecondsSinceEpoch}_${Random().nextInt(1 << 20)}',
                    conversationId: conversationId,
                    employeeId: store.employeeId,
                    author: WesiAiMessageAuthor.system,
                    kind: WesiAiMessageKind.error,
                    text: 'Очередь сообщений заполнена. Дождитесь обработки одного из ожидающих сообщений.',
                    createdAt: at,
                    metadata: const <String, dynamic>{'code': 'WAI_MESSAGE_QUEUE_FULL'},
                  ),
                ],
              );
              await _save();
            }

            @override
            Future<void> createConversation'''
          text, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              raise SystemExit('managed controller queue anchor not found')
          anchor = "    final deletedMessageIds = state.messages\n"
          if anchor not in text:
              raise SystemExit('delete conversation anchor not found')
          text = text.replace(
              anchor,
              "    _queuedTurns.removeWhere((turn) => turn.conversationId == id);\n" + anchor,
              1,
          )
          p.write_text(text, encoding='utf-8')

          # ---------------- Current V2 screen: redesign without feature rollback ----------------
          p = Path('lib/features/ai/ai_assistant_v2_screen.dart')
          text = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              text = text.replace(old, new, 1)

          replace_once(
              "import 'package:file_picker/file_picker.dart';\n",
              "import 'dart:async';\n\nimport 'package:file_picker/file_picker.dart';\n",
              'async import',
          )
          replace_once(
              "import 'wesi_ai_handoff_controller.dart';\n",
              "import 'wesi_ai_handoff_controller.dart';\nimport 'wesi_ai_chat_ui.dart';\n",
              'chat ui import',
          )
          replace_once(
              "  final WesiAiVoiceController _voice = WesiAiVoiceController();\n  final List<WesiAiAttachment> _attachments = <WesiAiAttachment>[];\n  String _voicePrefix = '';\n  WesiAiVoiceSession? _session;\n",
              "  final WesiAiVoiceController _voice = WesiAiVoiceController();\n  final List<WesiAiAttachment> _attachments = <WesiAiAttachment>[];\n  final ScrollController _scroll = ScrollController();\n  String _voicePrefix = '';\n  WesiAiVoiceSession? _session;\n  WesiAiUiMode _uiMode = WesiAiUiMode.classic;\n  DateTime? _sendingSince;\n  Timer? _sendingTicker;\n  bool _creatingInitial = false;\n",
              'screen state',
          )

          refresh_pattern = re.compile(r"  void _refresh\(\) \{.*?\n  \}\n\n  void _onVoiceChanged", re.S)
          refresh_replacement = r'''  void _refresh() {
            final controller = _controller;
            if (controller != null && !controller.loading) {
              if (WesiAiChatUi.shouldCreateInitialConversation(controller.state) &&
                  !_creatingInitial) {
                _creatingInitial = true;
                unawaited(
                  controller.createConversation(WesiAiPersona.zane).whenComplete(() {
                    _creatingInitial = false;
                    if (mounted) setState(() {});
                  }),
                );
              }
              _syncSendingClock(controller.sending);
            }
            if (!mounted) return;
            setState(() {});
            WidgetsBinding.instance.addPostFrameCallback((_) => _scrollToBottom());
          }

          void _syncSendingClock(bool sending) {
            if (sending) {
              if (_sendingSince != null) return;
              _sendingSince = DateTime.now();
              _sendingTicker ??= Timer.periodic(const Duration(seconds: 1), (_) {
                if (mounted) setState(() {});
              });
              return;
            }
            _sendingSince = null;
            _sendingTicker?.cancel();
            _sendingTicker = null;
          }

          void _scrollToBottom() {
            if (!_scroll.hasClients) return;
            _scroll.animateTo(
              _scroll.position.maxScrollExtent,
              duration: const Duration(milliseconds: 220),
              curve: Curves.easeOut,
            );
          }

          void _onVoiceChanged'''
          text, count = refresh_pattern.subn(lambda _: refresh_replacement, text, count=1)
          if count != 1:
              raise SystemExit('refresh method anchor not found')

          replace_once(
              "    _voice.removeListener(_onVoiceChanged);\n    _voice.dispose();\n    _composer.dispose();\n",
              "    _voice.removeListener(_onVoiceChanged);\n    _voice.dispose();\n    _sendingTicker?.cancel();\n    _scroll.dispose();\n    _composer.dispose();\n",
              'dispose',
          )

          appbar_pattern = re.compile(r"      appBar: AppBar\(.*?\n      \),\n      body:", re.S)
          appbar_replacement = r'''      appBar: AppBar(
                titleSpacing: 14,
                title: Row(
                  children: [
                    ClipRRect(
                      borderRadius: BorderRadius.circular(8),
                      child: Image.asset('assets/images/app_icon.png', width: 30, height: 30),
                    ),
                    const SizedBox(width: 10),
                    Expanded(
                      child: Text(
                        controller.state.activeProject?.title ?? 'Wesi AI',
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                      ),
                    ),
                  ],
                ),
                actions: [
                  PopupMenuButton<WesiAiUiMode>(
                    tooltip: 'Режим отображения ответа',
                    initialValue: _uiMode,
                    onSelected: (mode) => setState(() => _uiMode = mode),
                    itemBuilder: (_) => const [
                      PopupMenuItem(
                        value: WesiAiUiMode.classic,
                        child: ListTile(
                          contentPadding: EdgeInsets.zero,
                          leading: Icon(Icons.chat_bubble_outline_rounded),
                          title: Text('Классический'),
                        ),
                      ),
                      PopupMenuItem(
                        value: WesiAiUiMode.thinking,
                        child: ListTile(
                          contentPadding: EdgeInsets.zero,
                          leading: Icon(Icons.psychology_alt_outlined),
                          title: Text('Думающий'),
                          subtitle: Text('Безопасное резюме обработки'),
                        ),
                      ),
                    ],
                    icon: Icon(
                      _uiMode == WesiAiUiMode.thinking
                          ? Icons.psychology_alt_outlined
                          : Icons.chat_bubble_outline_rounded,
                    ),
                  ),
                  DropdownButtonHideUnderline(
                    child: DropdownButton<WesiAiTier>(
                      value: controller.state.tier,
                      onChanged: controller.processing
                          ? null
                          : (value) {
                              if (value != null) controller.setTier(value);
                            },
                      items: WesiAiTier.values
                          .map(
                            (tier) => DropdownMenuItem<WesiAiTier>(
                              value: tier,
                              child: Text(WesiAiChatUi.tierLabel(tier)),
                            ),
                          )
                          .toList(growable: false),
                    ),
                  ),
                  const SizedBox(width: 12),
                ],
              ),
              body:'''
          text, count = appbar_pattern.subn(lambda _: appbar_replacement, text, count=1)
          if count != 1:
              raise SystemExit('appbar anchor not found')

          # Brand the sidebar while keeping all existing project/chat actions.
          sidebar_anchor = "    return Column(\n      children: [\n"
          sidebar_insert = r'''    return Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.fromLTRB(16, 16, 12, 8),
                    child: Row(
                      children: [
                        ClipRRect(
                          borderRadius: BorderRadius.circular(10),
                          child: Image.asset('assets/images/app_icon.png', width: 34, height: 34),
                        ),
                        const SizedBox(width: 10),
                        const Expanded(
                          child: Text(
                            'Wesi AI',
                            style: TextStyle(fontSize: 22, fontWeight: FontWeight.w700),
                          ),
                        ),
                      ],
                    ),
                  ),
          '''
          if sidebar_anchor not in text:
              raise SystemExit('sidebar anchor not found')
          text = text.replace(sidebar_anchor, sidebar_insert, 1)

          replace_once(
              "    if (active == null) {\n      return Center(\n",
              "    if (active == null) {\n      if (_creatingInitial) {\n        return const Center(child: CircularProgressIndicator());\n      }\n      return Center(\n",
              'active conversation empty',
          )
          replace_once(
              "          child: messages.isEmpty\n              ? const Center(child: Text('История этого чата хранится локально'))\n              : ListView.builder(\n                  padding: const EdgeInsets.all(12),\n",
              "          child: messages.isEmpty\n              ? _emptyConversationState(active)\n              : ListView.builder(\n                  controller: _scroll,\n                  padding: const EdgeInsets.fromLTRB(18, 16, 18, 24),\n",
              'message list',
          )
          replace_once(
              "        if (controller.sending) const LinearProgressIndicator(),\n",
              "        if (controller.sending) _sendingStatus(),\n",
              'sending status',
          )

          header_anchor = "  Widget _conversationHeader(WesiAiHandoffController controller, WesiAiConversation active) {\n"
          if header_anchor not in text:
              raise SystemExit('header helper anchor not found')
          helpers = r'''  Widget _emptyConversationState(WesiAiConversation active) {
                final theme = Theme.of(context);
                return Center(
                  child: ConstrainedBox(
                    constraints: const BoxConstraints(maxWidth: 560),
                    child: Padding(
                      padding: const EdgeInsets.fromLTRB(28, 28, 28, 90),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          ClipRRect(
                            borderRadius: BorderRadius.circular(22),
                            child: Image.asset('assets/images/app_icon.png', width: 78, height: 78),
                          ),
                          const SizedBox(height: 22),
                          Text(
                            WesiAiChatUi.personaEmptyLabel(active.persona),
                            textAlign: TextAlign.center,
                            style: theme.textTheme.headlineSmall?.copyWith(
                              fontWeight: FontWeight.w600,
                              height: 1.2,
                            ),
                          ),
                          const SizedBox(height: 9),
                          Text(
                            active.projectId == null
                                ? 'Напишите сообщение, задайте вопрос или прикрепите файл.'
                                : 'Контекст и инструкции текущего проекта будут учтены автоматически.',
                            textAlign: TextAlign.center,
                            style: theme.textTheme.bodyMedium?.copyWith(
                              color: theme.colorScheme.onSurfaceVariant,
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                );
              }

              Widget _sendingStatus() {
                final since = _sendingSince;
                final elapsed = since == null
                    ? Duration.zero
                    : DateTime.now().difference(since);
                return Padding(
                  padding: const EdgeInsets.fromLTRB(18, 4, 18, 7),
                  child: Row(
                    children: [
                      const SizedBox.square(
                        dimension: 16,
                        child: CircularProgressIndicator(strokeWidth: 2),
                      ),
                      const SizedBox(width: 9),
                      Text(WesiAiChatUi.sendingLabel(elapsed)),
                    ],
                  ),
                );
              }

              Widget _reasoningSummary(WesiAiMessage message) {
                return Container(
                  margin: const EdgeInsets.only(bottom: 8),
                  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 9),
                  decoration: BoxDecoration(
                    color: Theme.of(context).colorScheme.surfaceContainerLow,
                    borderRadius: BorderRadius.circular(14),
                  ),
                  child: Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Icon(Icons.psychology_alt_outlined, size: 18),
                      const SizedBox(width: 8),
                      Expanded(
                        child: Text(
                          WesiAiChatUi.safeReasoningSummary(message),
                          style: Theme.of(context).textTheme.bodySmall,
                        ),
                      ),
                    ],
                  ),
                );
              }

              Widget _followUps(String answer) {
                final suggestions = WesiAiChatUi.followUps(answer);
                return Padding(
                  padding: const EdgeInsets.only(top: 7),
                  child: Wrap(
                    spacing: 7,
                    runSpacing: 7,
                    children: [
                      for (final suggestion in suggestions)
                        ActionChip(
                          avatar: const Icon(Icons.subdirectory_arrow_right_rounded, size: 16),
                          label: Text(suggestion),
                          onPressed: () {
                            _composer.text = suggestion;
                            _composer.selection = TextSelection.collapsed(
                              offset: suggestion.length,
                            );
                          },
                        ),
                    ],
                  ),
                );
              }

          '''
          text = text.replace(header_anchor, helpers + header_anchor, 1)

          message_pattern = re.compile(
              r"  Widget _messageTile\(WesiAiMessage message, bool latest\) \{.*?\n  \}\n\n  Widget _composerBar",
              re.S,
          )
          message_replacement = r'''  Widget _messageTile(WesiAiMessage message, bool latest) {
                final theme = Theme.of(context);
                final mine = message.author == WesiAiMessageAuthor.user;
                final assistant = message.author == WesiAiMessageAuthor.zane ||
                    message.author == WesiAiMessageAuthor.nirvana;
                final toolLike = message.author == WesiAiMessageAuthor.tool ||
                    message.kind == WesiAiMessageKind.action ||
                    message.kind == WesiAiMessageKind.status;
                final error = message.kind == WesiAiMessageKind.error;
                final rawAttachments = message.metadata['attachments'];
                final attachmentMaps = rawAttachments is List
                    ? rawAttachments.whereType<Map>().toList(growable: false)
                    : const <Map>[];

                if (toolLike && !mine) {
                  return Align(
                    alignment: Alignment.centerLeft,
                    child: Container(
                      constraints: const BoxConstraints(maxWidth: 760),
                      margin: const EdgeInsets.only(bottom: 10),
                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 9),
                      decoration: BoxDecoration(
                        border: Border.all(color: theme.dividerColor),
                        borderRadius: BorderRadius.circular(14),
                      ),
                      child: Row(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Icon(Icons.extension_outlined, size: 17),
                          const SizedBox(width: 8),
                          Flexible(child: Text(message.text)),
                        ],
                      ),
                    ),
                  );
                }

                return Align(
                  alignment: mine ? Alignment.centerRight : Alignment.centerLeft,
                  child: Container(
                    constraints: const BoxConstraints(maxWidth: 780),
                    margin: const EdgeInsets.only(bottom: 18),
                    child: Column(
                      crossAxisAlignment:
                          mine ? CrossAxisAlignment.end : CrossAxisAlignment.start,
                      children: [
                        if (assistant)
                          Padding(
                            padding: const EdgeInsets.only(left: 2, bottom: 6),
                            child: Text(
                              _authorName(message.author),
                              style: theme.textTheme.labelMedium?.copyWith(
                                fontWeight: FontWeight.w700,
                              ),
                            ),
                          ),
                        if (assistant && _uiMode == WesiAiUiMode.thinking)
                          _reasoningSummary(message),
                        Container(
                          padding: EdgeInsets.symmetric(
                            horizontal: mine ? 14 : 2,
                            vertical: mine ? 10 : 4,
                          ),
                          decoration: BoxDecoration(
                            color: error
                                ? theme.colorScheme.errorContainer
                                : mine
                                    ? theme.colorScheme.surfaceContainerHighest
                                    : Colors.transparent,
                            borderRadius: BorderRadius.circular(22),
                          ),
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              if (attachmentMaps.isNotEmpty) ...[
                                Wrap(
                                  spacing: 6,
                                  runSpacing: 6,
                                  children: attachmentMaps.map((raw) {
                                    final map = Map<String, dynamic>.from(raw);
                                    final mime = '${map['mimeType'] ?? ''}';
                                    return Chip(
                                      avatar: Icon(
                                        mime.startsWith('image/')
                                            ? Icons.image_outlined
                                            : Icons.attach_file,
                                        size: 16,
                                      ),
                                      label: Text('${map['name'] ?? 'Файл'}'),
                                      visualDensity: VisualDensity.compact,
                                    );
                                  }).toList(growable: false),
                                ),
                                const SizedBox(height: 8),
                              ],
                              WesiAiMessageContent(
                                key: ValueKey(message.id),
                                message: message,
                                animateText: latest && assistant,
                              ),
                            ],
                          ),
                        ),
                        if (assistant && latest && message.text.trim().isNotEmpty)
                          _followUps(message.text),
                        if (!assistant && !mine && !toolLike)
                          Padding(
                            padding: const EdgeInsets.only(top: 5),
                            child: Text(
                              _authorName(message.author),
                              style: theme.textTheme.labelSmall?.copyWith(
                                color: theme.colorScheme.onSurfaceVariant,
                              ),
                            ),
                          ),
                      ],
                    ),
                  ),
                );
              }

              Widget _composerBar'''
          text, count = message_pattern.subn(lambda _: message_replacement, text, count=1)
          if count != 1:
              raise SystemExit('message tile anchor not found')

          composer_pattern = re.compile(
              r"  Widget _composerBar\(WesiAiChatController controller\) => Padding\(.*?\n      \);\n\n  Future<void> _pickAttachments",
              re.S,
          )
          composer_replacement = r'''  Widget _composerBar(WesiAiManagedChatController controller) => Padding(
                padding: const EdgeInsets.fromLTRB(12, 5, 12, 12),
                child: Center(
                  child: ConstrainedBox(
                    constraints: const BoxConstraints(maxWidth: 920),
                    child: DecoratedBox(
                      decoration: BoxDecoration(
                        color: Theme.of(context).colorScheme.surfaceContainerLow,
                        borderRadius: BorderRadius.circular(28),
                        border: Border.all(color: Theme.of(context).dividerColor),
                      ),
                      child: Padding(
                        padding: const EdgeInsets.fromLTRB(10, 8, 8, 8),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.stretch,
                          children: [
                            if (controller.queuedTurnCount > 0)
                              Container(
                                margin: const EdgeInsets.fromLTRB(4, 2, 4, 7),
                                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
                                decoration: BoxDecoration(
                                  color: Theme.of(context).colorScheme.secondaryContainer,
                                  borderRadius: BorderRadius.circular(14),
                                ),
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text(
                                      'В очереди: ${controller.queuedTurnCount}',
                                      style: const TextStyle(fontWeight: FontWeight.w700),
                                    ),
                                    const SizedBox(height: 3),
                                    Text(
                                      controller.queuedTurns
                                          .take(3)
                                          .map((turn) => turn.preview)
                                          .join(' · '),
                                      maxLines: 2,
                                      overflow: TextOverflow.ellipsis,
                                      style: Theme.of(context).textTheme.bodySmall,
                                    ),
                                  ],
                                ),
                              ),
                            if (_attachments.isNotEmpty)
                              Padding(
                                padding: const EdgeInsets.fromLTRB(4, 0, 4, 7),
                                child: Wrap(
                                  spacing: 6,
                                  runSpacing: 6,
                                  children: [
                                    for (var index = 0; index < _attachments.length; index++)
                                      InputChip(
                                        avatar: Icon(
                                          _attachments[index].mimeType.startsWith('image/')
                                              ? Icons.image_outlined
                                              : Icons.attach_file,
                                          size: 16,
                                        ),
                                        label: Text(
                                          '${_attachments[index].name} · ${_formatBytes(_attachments[index].byteSize)}',
                                          overflow: TextOverflow.ellipsis,
                                        ),
                                        onDeleted: () =>
                                            setState(() => _attachments.removeAt(index)),
                                      ),
                                  ],
                                ),
                              ),
                            TextField(
                              controller: _composer,
                              minLines: 1,
                              maxLines: 6,
                              decoration: InputDecoration(
                                hintText: controller.sending
                                    ? 'Дополните запрос — сообщение встанет в очередь'
                                    : 'Спроси Wesi AI о чём угодно',
                                border: InputBorder.none,
                                contentPadding:
                                    const EdgeInsets.symmetric(horizontal: 8, vertical: 8),
                              ),
                              onSubmitted: (_) => _send(controller),
                            ),
                            Row(
                              children: [
                                IconButton(
                                  tooltip: 'Прикрепить файл',
                                  onPressed: _pickAttachments,
                                  icon: const Icon(Icons.add_rounded),
                                ),
                                IconButton(
                                  tooltip: 'Камера',
                                  onPressed: _capturePhoto,
                                  icon: const Icon(Icons.photo_camera_outlined),
                                ),
                                const Spacer(),
                                if (controller.sending || controller.queuedTurnCount > 0)
                                  Padding(
                                    padding: const EdgeInsets.only(right: 6),
                                    child: Text(
                                      controller.sending
                                          ? 'Ответ обрабатывается'
                                          : 'Обрабатываю очередь',
                                      style: Theme.of(context).textTheme.labelSmall,
                                    ),
                                  ),
                                IconButton(
                                  tooltip: _voice.listening
                                      ? 'Остановить диктовку'
                                      : 'Голосовой ввод',
                                  onPressed: controller.sending || _session?.active == true
                                      ? null
                                      : _toggleVoice,
                                  icon: Icon(_voice.listening ? Icons.stop : Icons.mic_none),
                                ),
                                IconButton(
                                  tooltip: _session?.active == true
                                      ? 'Завершить голосовой разговор'
                                      : 'Голосовой разговор',
                                  onPressed: controller.sending
                                      ? null
                                      : () => _toggleConversation(controller),
                                  icon: Icon(
                                    _session?.active == true
                                        ? Icons.headset_off
                                        : Icons.headset_mic_outlined,
                                  ),
                                ),
                                IconButton.filled(
                                  tooltip: controller.sending
                                      ? 'Добавить сообщение в очередь'
                                      : 'Отправить',
                                  onPressed: () => _send(controller),
                                  icon: const Icon(Icons.arrow_upward_rounded),
                                ),
                              ],
                            ),
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              );

              Future<void> _pickAttachments'''
          text, count = composer_pattern.subn(lambda _: composer_replacement, text, count=1)
          if count != 1:
              raise SystemExit('composer anchor not found')

          send_pattern = re.compile(
              r"  Future<void> _send\(WesiAiChatController controller\) async \{.*?\n  \}\n\n  Future<void> _toggleVoice",
              re.S,
          )
          send_replacement = r'''  Future<void> _send(WesiAiManagedChatController controller) async {
                if (_voice.listening) await _voice.stop();
                final text = _composer.text.trim();
                if (text.isEmpty && _attachments.isEmpty) return;
                final attachments = List<WesiAiAttachment>.from(_attachments);
                _composer.clear();
                _voicePrefix = '';
                _voice.clearTranscript();
                setState(() => _attachments.clear());
                await controller.addUserMessage(text, attachments: attachments);
              }

              Future<void> _toggleVoice'''
          text, count = send_pattern.subn(lambda _: send_replacement, text, count=1)
          if count != 1:
              raise SystemExit('send method anchor not found')

          p.write_text(text, encoding='utf-8')

          # ---------------- Master specification: explicit FIFO queue semantics ----------------
          p = Path('docs/WESI_AI_MASTER_SPEC.md')
          text = p.read_text(encoding='utf-8')
          if '### Очередь сообщений во время ответа' not in text:
              marker = '## 2. Мультимодальный ввод и Universal Attachments\n'
              if marker not in text:
                  raise SystemExit('master spec section 2 anchor not found')
              queue_spec = '''### Очередь сообщений во время ответа

Текстовый чат обязан поддерживать последовательную очередь пользовательских сообщений. Если Wesi AI уже обрабатывает запрос, новое сообщение пользователя **не должно отменять, обрывать или заменять текущую генерацию**.

Обязательное поведение:
- текущий ответ завершается штатно и отображается полностью;
- новое уточнение, дополнение или следующий запрос помещается в FIFO-очередь текущего диалога;
- после завершения текущего запроса первый элемент очереди запускается автоматически, затем следующие элементы обрабатываются по порядку;
- очередь должна поддерживать как текст, так и вложения и сохранять привязку к исходному чату/проекту;
- ожидающие сообщения должны быть видимы пользователю в интерфейсе, без тихого отбрасывания;
- ошибка текущего ответа не уничтожает ожидающие сообщения: после фиксации ошибки очередь продолжает обрабатываться;
- прерывание текущей генерации допускается только отдельным явным действием пользователя `Stop/Cancel`, а не фактом отправки следующего сообщения.

'''
              text = text.replace(marker, queue_spec + marker, 1)
              p.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/apply-ai-chat-redesign-queue-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/ai/wesi_ai_managed_controller.dart lib/features/ai/ai_assistant_v2_screen.dart docs/WESI_AI_MASTER_SPEC.md .github/workflows/apply-ai-chat-redesign-queue-once.yml
          git commit -m 'feat(ai): redesign chat and queue follow-up messages'
          git push origin HEAD:chatgpt/ai-chat-ui-hardening-v4
