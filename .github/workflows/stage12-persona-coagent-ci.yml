name: Stage 12 Persona Co-Agent CI

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stream-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/wesi-ai-stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Co-Agent protocol
        run: node --check persona_coagent.mjs
      - name: Syntax check Main Co-Agent policy
        run: node --check ../pb_hooks/wesi_ai_coagent_policy.js
      - name: Syntax check Main stream hook
        run: node --check ../pb_hooks/wesi_ai_stream.pb.js
      - name: Wesi AI stream gateway tests
        run: npm test

  flutter-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Co-Agent Thinking timeline tests
        run: flutter test test/wesi_ai_coagent_activity_test.dart

  diagnostic-ui-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI coverage patch only on trigger
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "ci: execute diagnostic UI completion" ]; then
            echo DIAGNOSTIC_UI_PATCH_NOT_REQUESTED
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-wesi-ai-diagnostics-ui-complete.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = text.index(marker) + len(marker)
          end = text.index(end_marker, start)
          raw = text[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          exec(compile('\n'.join(lines), 'diagnostic-ui-patch', 'exec'), {})
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Verify and publish UI coverage
        run: |
          set -euo pipefail
          if [ "$(git log -1 --pretty=%s)" != "ci: execute diagnostic UI completion" ]; then exit 0; fi
          flutter pub get
          dart format lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart test/wesi_ai_diagnostics_contract_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/wesi_ai_diagnostics_contract_test.dart test/wesi_ai_rich_message_test.dart test/wesi_ai_coagent_activity_test.dart
          git config user.name wesi-ai-ci
          git config user.email wesi-ai-ci@users.noreply.github.com
          git add lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart test/wesi_ai_diagnostics_contract_test.dart
          git commit -m 'feat(ai): expose auth and tool diagnostics in UI'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
