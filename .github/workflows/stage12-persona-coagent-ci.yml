name: Stage 12 Persona Co-Agent CI

on:
  push:
    branches:
      - agent/wesi-ai-stage12-persona-coagent
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/wesi-ai-stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Co-Agent protocol
        run: node --check persona_coagent.mjs
      - name: Wesi AI stream gateway tests
        run: npm test
