name: Stage 12 Persona Co-Agent CI

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stream-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server/wesi-ai-stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Co-Agent protocol
        run: node --check persona_coagent.mjs
      - name: Syntax check Main Co-Agent policy
        run: node --check ../pb_hooks/wesi_ai_coagent_policy.js
      - name: Syntax check Main stream hook
        run: node --check ../pb_hooks/wesi_ai_stream.pb.js
      - name: Wesi AI stream gateway tests
        run: npm test

  flutter-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Flutter dependencies
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Co-Agent Thinking timeline tests
        run: flutter test test/wesi_ai_coagent_activity_test.dart

  diagnostic-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply diagnostics only on trigger commit
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [ "$subject" != "ci: trigger diagnostics patch" ] && [ "$subject" != "ci: fix diagnostics escaping" ]; then
            echo DIAGNOSTIC_PATCH_NOT_REQUESTED
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-wesi-ai-diagnostics-v2.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "          PY\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          raw = text[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          exec(compile('\n'.join(lines), 'diagnostics-v2', 'exec'), {})

          p = Path('lib/features/ai/wesi_ai_api.dart')
          source = p.read_text()
          source = source.replace("].join('" + "\n" + "');", "].join('\\n');")
          source = source.replace(
              "String get displayMessage => '$message" + "\n\n" + "Технические детали" + "\n" + "$technicalDetails';",
              "String get displayMessage => '$message\\n\\nТехнические детали\\n$technicalDetails';",
          )
          p.write_text(source)
          PY
      - name: Validate server diagnostics
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [ "$subject" != "ci: trigger diagnostics patch" ] && [ "$subject" != "ci: fix diagnostics escaping" ]; then exit 0; fi
          node --check server/wesi-ai-stream/gateway.mjs
          node --check server/pb_hooks/wesi_ai_routes.pb.js
          cd server/wesi-ai-stream && npm test
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Validate Flutter diagnostics and publish
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          if [ "$subject" != "ci: trigger diagnostics patch" ] && [ "$subject" != "ci: fix diagnostics escaping" ]; then exit 0; fi
          flutter pub get
          dart format lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart test/wesi_ai_diagnostics_contract_test.dart
          flutter analyze --no-fatal-infos
          flutter test test/wesi_ai_diagnostics_contract_test.dart test/wesi_ai_rich_message_test.dart test/wesi_ai_coagent_activity_test.dart
          git config user.name wesi-ai-ci
          git config user.email wesi-ai-ci@users.noreply.github.com
          git add lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart server/pb_hooks/wesi_ai_routes.pb.js server/wesi-ai-stream/gateway.mjs test/wesi_ai_diagnostics_contract_test.dart
          git commit -m 'feat(ai): add end-to-end diagnostic error contract'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
