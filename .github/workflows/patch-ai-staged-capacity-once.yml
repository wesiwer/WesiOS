name: Patch AI staged capacity once

on:
  push:
    paths:
      - '.github/workflows/patch-ai-staged-capacity-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-client-hardening-chunked
          token: ${{ github.token }}
      - name: Apply bounded staged storage budget
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('server/wesi-ai-relay/staged-upload.mjs')
          text = p.read_text(encoding='utf-8')

          old = "export const STAGED_TTL_MS = 60 * 60 * 1000;\n"
          new = old + "export const STAGED_MAX_ACTIVE_BYTES = 1024 * 1024 * 1024;\nexport const STAGED_MAX_ACTIVE_UPLOADS = 32;\n"
          assert old in text, 'staged constants marker not found'
          text = text.replace(old, new, 1)

          text = text.replace(
              "for (const entry of entries.slice(0, 512)) {",
              "for (const entry of entries) {",
              1,
          )

          marker = "export function startStagedUpload(input = {}) {\n"
          helper = '''function activeStagedBudget(now = Date.now()) {
            ensureRoot();
            let entries = [];
            try { entries = fs.readdirSync(ROOT, {withFileTypes: true}); } catch { return {uploads: 0, bytes: 0}; }
            let uploads = 0;
            let bytes = 0;
            for (const entry of entries) {
              if (!entry.isDirectory() || !ID_RE.test(entry.name)) continue;
              try {
                const meta = loadMeta(entry.name, {allowExpired: true});
                if (Number(meta.expiresAt || 0) <= now) {
                  fs.rmSync(uploadDir(entry.name), {recursive: true, force: true});
                  continue;
                }
                const declared = Number(meta.byteSize || 0);
                if (!Number.isSafeInteger(declared) || declared <= 0 || declared > STAGED_MAX_FILE_BYTES) {
                  fs.rmSync(uploadDir(entry.name), {recursive: true, force: true});
                  continue;
                }
                uploads += 1;
                bytes += declared;
              } catch {
                try { fs.rmSync(uploadDir(entry.name), {recursive: true, force: true}); } catch {}
              }
            }
            return {uploads, bytes};
          }

          '''
          assert marker in text, 'startStagedUpload marker not found'
          text = text.replace(marker, helper + marker, 1)

          old = """  if (!Number.isSafeInteger(byteSize) || byteSize <= 0 || byteSize > STAGED_MAX_FILE_BYTES) {
            throw new Error('WAI_UPLOAD_TOO_LARGE');
          }
          const id = crypto.randomBytes(24).toString('base64url');
          """
          new = """  if (!Number.isSafeInteger(byteSize) || byteSize <= 0 || byteSize > STAGED_MAX_FILE_BYTES) {
            throw new Error('WAI_UPLOAD_TOO_LARGE');
          }
          const budget = activeStagedBudget();
          if (budget.uploads >= STAGED_MAX_ACTIVE_UPLOADS || budget.bytes + byteSize > STAGED_MAX_ACTIVE_BYTES) {
            throw new Error('WAI_UPLOAD_CAPACITY');
          }
          const id = crypto.randomBytes(24).toString('base64url');
          """
          assert old in text, 'start budget insertion point not found'
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          server = Path('server/wesi-ai-relay/server.mjs')
          s = server.read_text(encoding='utf-8')
          old_status = "  const status = code === 'WAI_UPLOAD_NOT_FOUND' ? 404 : code === 'WAI_UPLOAD_EXPIRED' ? 410 : 400;"
          new_status = "  const status = code === 'WAI_UPLOAD_NOT_FOUND' ? 404 : code === 'WAI_UPLOAD_EXPIRED' ? 410 : code === 'WAI_UPLOAD_CAPACITY' ? 507 : 400;"
          assert old_status in s, 'staged error status marker not found'
          server.write_text(s.replace(old_status, new_status, 1), encoding='utf-8')
          PY

          node --check server/wesi-ai-relay/staged-upload.mjs
          node --check server/wesi-ai-relay/server.mjs
          node --test server/wesi-ai-relay/staged-upload.test.mjs
          rm .github/workflows/patch-ai-staged-capacity-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/wesi-ai-relay/staged-upload.mjs server/wesi-ai-relay/server.mjs .github/workflows/patch-ai-staged-capacity-once.yml
          git commit -m 'fix(ai): bound staged upload disk reservations'
          git push origin HEAD:chatgpt/ai-client-hardening-chunked
