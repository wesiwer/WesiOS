name: Diagnose Wesi AI Stream Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesi-ai-stream-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}"
          test -n "${MAIN_USER:-}"
          test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts
          else
            ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/main_known_hosts
      - name: Inspect production stream prepare failure
        shell: bash
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          echo '=== REPOSITORY STREAM HOOK SHA256 ==='
          sha256sum server/pb_hooks/wesi_ai_stream.pb.js
          echo '=== PRODUCTION HOOK / SERVICE / RECENT ERRORS ==='
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "bash -s" <<'REMOTE'
          set -uo pipefail
          echo '--- identity/groups ---'
          id || true
          echo '--- installed stream hook sha256 ---'
          sha256sum /opt/pocketbase/pb_hooks/wesi_ai_stream.pb.js || true
          echo '--- relevant validation contract ---'
          grep -nE 'persona\)|tier\)|lobbyMode\)|message.length|summary.length|conversationId.length|provider !=|attachmentsRaw.length|Слишком длинное сообщение' /opt/pocketbase/pb_hooks/wesi_ai_stream.pb.js || true
          echo '--- pocketbase status ---'
          systemctl is-active pocketbase || true
          echo '--- stream service status ---'
          systemctl is-active wesi-ai-stream || true
          echo '--- pocketbase recent stream/400/errors ---'
          journalctl -u pocketbase --since '12 hours ago' --no-pager -o short-iso 2>&1 | grep -Ei 'stream/prepare|WAI_|BadRequest|bad request|status.?400|http.?400|Wesi AI|Некоррект|Слишком|Недоступная настройка|permission denied' | tail -n 800 || true
          echo '--- stream gateway recent errors ---'
          journalctl -u wesi-ai-stream --since '12 hours ago' --no-pager -o short-iso 2>&1 | grep -Ei 'WAI_|prepare|400|error|reject|main|permission denied' | tail -n 800 || true
          echo '--- readable nginx stream access ---'
          if [ -r /var/log/nginx/access.log ]; then
            tail -n 5000 /var/log/nginx/access.log | grep -E '/api/wesi/ai/(chat/stream|stream/prepare)' | tail -n 500 || true
          else
            echo 'nginx access log is not readable by deploy user'
          fi
          REMOTE
