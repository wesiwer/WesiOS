name: Stage13 Gateway Patch Once

on:
  push:
    branches:
      - agent/wesi-ai-stage13-dynamic-subagents
    paths:
      - .github/workflows/stage13-gateway-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage13-dynamic-subagents
      - name: Apply gateway patch
        run: python3 scripts/stage13_patch_gateway.py
      - name: Validate gateway
        run: |
          node --check server/wesi-ai-stream/gateway.mjs
          git diff --check
      - name: Commit gateway integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/wesi-ai-stream/gateway.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'feat(ai): integrate dynamic subagents into stream gateway'
          git push origin HEAD:agent/wesi-ai-stage13-dynamic-subagents
