name: Export WesiOS public mail DNS once

on:
  push:
    paths:
      - '.github/workflows/export-wesi-mail-dns-once.yml'

permissions:
  contents: read

jobs:
  export-public-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: employee-portal
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Export public DNS values
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PUBLIC_FILE='/etc/opendkim/keys/wesi-inc.ru/wesios.txt'
          test -r "$PUBLIC_FILE" || {
            echo 'Public DKIM TXT is not readable by the deploy user.' >&2
            exit 20
          }
          PUBLIC_IP=$(curl -4fsS --max-time 10 https://api.ipify.org)
          DKIM_TXT=$(tr -d '\n\t"' < "$PUBLIC_FILE" | sed -E 's/^[^(]*\((.*)\)[^)]*$/\1/' | sed -E 's/[[:space:]]+/ /g')
          printf 'PUBLIC_IP=%s\n' "$PUBLIC_IP"
          printf 'DKIM_TXT=%s\n' "$DKIM_TXT"
          REMOTE
