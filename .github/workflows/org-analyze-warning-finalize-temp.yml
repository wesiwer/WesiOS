name: Org analyze warning finalize temp

on:
  push:
    paths:
      - '.github/workflows/org-analyze-warning-finalize-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-v1
          fetch-depth: 0
      - name: Remove org hierarchy analyzer warnings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/features/organizations/inter_org_transfer_screen.dart')
          s=p.read_text()
          s=s.replace("'В базе ${from!.name} (${from.baseCurrency})'", "'В базе ${from.name} (${from.baseCurrency})'")
          s=s.replace("'В базе ${to!.name} (${to.baseCurrency})'", "'В базе ${to.name} (${to.baseCurrency})'")
          p.write_text(s)

          p=Path('lib/features/treasury/services/account_service.dart')
          s=p.read_text()
          s=s.replace("import '../../organizations/models/organization_model.dart';\n", '')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'WesiOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/org-analyze-warning-finalize-temp.yml
          git add lib/features/organizations/inter_org_transfer_screen.dart lib/features/treasury/services/account_service.dart
          git commit -m 'fix(org): clear hierarchy analyzer warnings'
          git push origin HEAD:agent/org-hierarchy-v1
