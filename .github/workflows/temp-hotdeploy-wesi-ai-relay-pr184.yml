name: Temporary inspect Wesi AI Relay TLS

on:
  push:
    branches:
      - fix/wesi-ai-tool-agent-handoff
    paths:
      - .github/workflows/temp-hotdeploy-wesi-ai-relay-pr184.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      RELAY_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
    steps:
      - name: Prepare Relay SSH
        env:
          KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${RELAY_HOST:-}" && test -n "${RELAY_USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/relay_key
          chmod 600 ~/.ssh/relay_key
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/relay_known_hosts; else ssh-keyscan -H "$RELAY_HOST" > ~/.ssh/relay_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/relay_known_hosts

      - name: Inspect public TLS names and nginx vhosts
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          echo '--- NGINX PUBLIC SERVER NAMES ---'
          "${SUDO[@]}" nginx -T 2>/dev/null | sed -n -E 's/^[[:space:]]*server_name[[:space:]]+([^;]+);.*/server_name \1/p' | sort -u
          echo '--- CERTIFICATE SANS ---'
          found=0
          for cert in /etc/letsencrypt/live/*/fullchain.pem; do
            [ -f "$cert" ] || continue
            found=1
            name="$(basename "$(dirname "$cert")")"
            echo "certificate $name"
            "${SUDO[@]}" openssl x509 -in "$cert" -noout -subject -ext subjectAltName 2>/dev/null | sed -E 's/DNS:/DNS:/g'
          done
          if [ "$found" -eq 0 ]; then
            echo 'no-letsencrypt-certificates'
          fi
          echo '--- LOCAL RELAY ---'
          curl -fsS --max-time 5 http://127.0.0.1:8787/health
          REMOTE
