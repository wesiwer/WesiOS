name: Temporary hot-deploy Wesi AI Relay PR184

on:
  push:
    branches:
      - fix/wesi-ai-tool-agent-handoff
    paths:
      - .github/workflows/temp-hotdeploy-wesi-ai-relay-pr184.yml

permissions:
  contents: read

concurrency:
  group: temp-wesi-ai-relay-pr184-hotdeploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAY_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      RELAY_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 1

      - name: Validate exact Relay bundle
        run: |
          set -euo pipefail
          for file in server/wesi-ai-relay/*.mjs; do node --check "$file"; done
          node --test server/wesi-ai-relay/*.test.mjs
          test -s server/wesi-ai-relay/package.json

      - name: Prepare SSH
        env:
          RELAY_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          RELAY_KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
          MAIN_KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in RELAY_HOST RELAY_USER MAIN_HOST MAIN_USER RELAY_KEY MAIN_KEY; do
            test -n "${!name:-}"
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$RELAY_KEY" > ~/.ssh/relay_key
          printf '%s\n' "$MAIN_KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/relay_key ~/.ssh/main_key
          if [ -n "${RELAY_KNOWN:-}" ]; then printf '%s\n' "$RELAY_KNOWN" > ~/.ssh/relay_known_hosts; else ssh-keyscan -H "$RELAY_HOST" > ~/.ssh/relay_known_hosts 2>/dev/null; fi
          if [ -n "${MAIN_KNOWN:-}" ]; then printf '%s\n' "$MAIN_KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/*known_hosts

      - name: Upload and atomically install current Relay runtime
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          REMOTE="/tmp/wesi-ai-relay-pr184-${GITHUB_RUN_ID}"
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp "${SSH[@]}" server/wesi-ai-relay/*.mjs server/wesi-ai-relay/package.json "$RELAY_USER@$RELAY_HOST:$REMOTE/"
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          APP=/opt/wesi-ai-relay
          test -d "$APP"
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          stamp="$(date +%Y%m%d%H%M%S)"
          backup="/tmp/wesi-ai-relay-backup-$stamp"
          mkdir -p "$backup"
          for src in "$REMOTE"/*.mjs "$REMOTE"/package.json; do
            name="$(basename "$src")"
            if [ -f "$APP/$name" ]; then "${SUDO[@]}" cp "$APP/$name" "$backup/$name"; fi
            "${SUDO[@]}" install -o root -g root -m 0644 "$src" "$APP/$name"
            "${SUDO[@]}" cmp -s "$src" "$APP/$name"
          done
          rm -rf "$REMOTE"
          "${SUDO[@]}" systemctl restart wesi-ai-relay
          for _ in $(seq 1 30); do
            if "${SUDO[@]}" systemctl is-active --quiet wesi-ai-relay && curl -fsS --max-time 5 http://127.0.0.1:8787/health > /tmp/wesi-relay-health.json; then break; fi
            sleep 1
          done
          "${SUDO[@]}" systemctl is-active --quiet wesi-ai-relay
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/wesi-relay-health.json', encoding='utf-8'))
          assert data.get('ok') is True, data
          assert data.get('ready') is True, data
          assert data.get('routing') == ['fast','pro','ultra'], data
          assert data.get('streaming') is True, data
          print('RELAY_LOCAL_HEALTH_PASS')
          PY
          echo "BACKUP=$backup"
          REMOTE_SCRIPT

      - name: Verify Relay from Main server
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "curl -fsS --max-time 20 https://ai.wesi-wf.su/health" > main-relay-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('main-relay-health.json', encoding='utf-8'))
          assert data.get('ok') is True and data.get('ready') is True, data
          assert data.get('routing') == ['fast','pro','ultra'], data
          print('MAIN_TO_RELAY_HEALTH_PASS')
          PY

      - name: Best-effort external runner health
        run: |
          if curl -fsS --max-time 20 https://ai.wesi-wf.su/health > runner-relay-health.json; then
            python3 - <<'PY'
          import json
          data=json.load(open('runner-relay-health.json', encoding='utf-8'))
          assert data.get('ok') is True and data.get('ready') is True, data
          print('RUNNER_TO_RELAY_HEALTH_PASS')
          PY
          else
            echo '::warning::GitHub runner could not reach public Relay; local Relay and Main-to-Relay checks are authoritative for this deploy.'
          fi
