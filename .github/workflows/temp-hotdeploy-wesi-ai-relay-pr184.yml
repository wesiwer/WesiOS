name: Temporary switch Main to valid Wesi AI Relay TLS host

on:
  push:
    branches:
      - fix/wesi-ai-tool-agent-handoff
    paths:
      - .github/workflows/temp-hotdeploy-wesi-ai-relay-pr184.yml

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
      RELAY_PUBLIC_HOST: wesi-ai-178-236-247-194.nip.io
    steps:
      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}" && test -n "${MAIN_USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Verify valid Relay HTTPS from Main
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "curl -fsS --max-time 20 https://$RELAY_PUBLIC_HOST/health" > /tmp/health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert d.get('ok') is True and d.get('ready') is True, d
          assert d.get('routing') == ['fast','pro','ultra'], d
          assert d.get('streaming') is True, d
          print('MAIN_TO_VALID_RELAY_TLS_PASS')
          PY

      - name: Switch only Main Relay URL and preserve secrets/routes
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "RELAY_PUBLIC_HOST='$RELAY_PUBLIC_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          CFG=/opt/pocketbase/pb_hooks/.wesi-ai-relay.json
          test -s "$CFG"
          test -w "$CFG"
          stamp="$(date +%Y%m%d%H%M%S)"
          cp "$CFG" "$CFG.bak-tls-host-$stamp"
          python3 - <<'PY'
          import json, os
          p='/opt/pocketbase/pb_hooks/.wesi-ai-relay.json'
          with open(p,encoding='utf-8') as f: data=json.load(f)
          assert isinstance(data.get('sharedSecret'),str) and len(data['sharedSecret']) >= 32
          assert isinstance(data.get('routes'),dict)
          before={k:data['routes'].get(k) for k in ('fast','pro','maximum')}
          data['url']='https://' + os.environ['RELAY_PUBLIC_HOST']
          with open(p,'w',encoding='utf-8') as f: json.dump(data,f,ensure_ascii=False,separators=(',',':'))
          with open(p,encoding='utf-8') as f: check=json.load(f)
          assert check['url']=='https://' + os.environ['RELAY_PUBLIC_HOST']
          assert {k:check['routes'].get(k) for k in ('fast','pro','maximum')} == before
          assert check['sharedSecret']==data['sharedSecret']
          print('MAIN_RELAY_CONFIG_URL_SWITCHED_WITH_SECRETS_PRESERVED')
          PY
          chmod 0600 "$CFG"
          curl -fsS --max-time 20 "https://$RELAY_PUBLIC_HOST/health" >/tmp/wesi-ai-relay-health.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/wesi-ai-relay-health.json',encoding='utf-8'))
          assert d.get('ok') is True and d.get('ready') is True, d
          print('MAIN_RELAY_CONFIG_TARGET_HEALTH_PASS')
          PY
          echo "backup=$CFG.bak-tls-host-$stamp"
          REMOTE
