name: Temporary inspect Main streaming prerequisites

on:
  push:
    branches:
      - fix/wesi-ai-tool-agent-handoff
    paths:
      - .github/workflows/temp-hotdeploy-wesi-ai-relay-pr184.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/main_known_hosts
      - name: Inspect prerequisites
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "user=$(id -un) uid=$(id -u)"
          if sudo -n true 2>/dev/null; then echo 'sudo_nopasswd=yes'; else echo 'sudo_nopasswd=no'; fi
          if command -v node >/dev/null 2>&1; then echo "node=$(node --version) path=$(command -v node)"; else echo 'node=missing'; fi
          if command -v nginx >/dev/null 2>&1; then echo "nginx=$(nginx -v 2>&1)"; else echo 'nginx=missing'; fi
          if command -v curl >/dev/null 2>&1 && curl -fsS --max-time 2 http://127.0.0.1:8792/health >/dev/null 2>&1; then echo 'stream_gateway=already_live'; else echo 'stream_gateway=not_live'; fi
          if systemctl is-active --quiet pocketbase 2>/dev/null; then echo 'pocketbase=active'; else echo 'pocketbase=unknown_or_inactive'; fi
          REMOTE
