name: Finalize WesiOS 0.22.30 Once
# trigger: activate after workflow exists on default branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-0.22.30-once.yml'

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch signed 0.22.30+105 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='WesiOS 0.22.30+105: fixes organizations:org_wesi_inc (+2) by normalizing legacy organization payloads on the production sync read path; removes the obsolete Telegram bot server-required placeholder from Settings.' \
            -f deploy_to_server=true

  observe-sync-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact production sync deploy and publish status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for i in $(seq 1 120); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-sync-hooks.yml --limit 30 \
              --json databaseId,headSha,status,conclusion,event,createdAt > /tmp/sync-runs.json
            RUN_ID=$(python3 - "$GITHUB_SHA" <<'PY'
          import json,sys
          want=sys.argv[1]
          rows=json.load(open('/tmp/sync-runs.json', encoding='utf-8'))
          for row in rows:
              if row.get('headSha') == want and row.get('event') == 'push':
                  print(row['databaseId'])
                  break
          PY
            )
            [ -n "$RUN_ID" ] && break
            sleep 3
          done

          if [ -z "$RUN_ID" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure \
              -f context='Wesi Sync Deploy' \
              -f description='Production sync deploy run was not found' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
            exit 1
          fi

          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status || true
          CONCLUSION=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // "failure"')
          if [ "$CONCLUSION" = success ]; then STATE=success; else STATE=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='Wesi Sync Deploy' \
            -f description="Production sync deploy: $CONCLUSION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          [ "$STATE" = success ]

  observe-app-release:
    needs: dispatch-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for exact signed app release and publish status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=''
          for i in $(seq 1 120); do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release-app.yml --limit 30 \
              --json databaseId,headSha,status,conclusion,event,createdAt > /tmp/release-runs.json
            RUN_ID=$(python3 - "$GITHUB_SHA" <<'PY'
          import json,sys
          want=sys.argv[1]
          rows=json.load(open('/tmp/release-runs.json', encoding='utf-8'))
          for row in rows:
              if row.get('headSha') == want and row.get('event') == 'workflow_dispatch':
                  print(row['databaseId'])
                  break
          PY
            )
            [ -n "$RUN_ID" ] && break
            sleep 3
          done

          if [ -z "$RUN_ID" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=failure \
              -f context='Wesi App Release' \
              -f description='Signed app release run was not found' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
            exit 1
          fi

          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status || true
          CONCLUSION=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion // "failure"')
          if [ "$CONCLUSION" = success ]; then STATE=success; else STATE=failure; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='Wesi App Release' \
            -f description="Signed app release: $CONCLUSION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
          [ "$STATE" = success ]
