name: Publish WesiOS Production

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Что нового (показывается в приложении)'
        required: false
        default: ''

permissions:
  actions: write
  contents: read

concurrency:
  group: publish-wesios-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Dispatch signed GitHub release build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes="$NOTES" \
            -f deploy_to_server=false

          run_id=''
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=50")
            run_id=$(printf '%s' "$runs" | jq -r \
              --argjson started "$started" \
              '[.workflow_runs[] | select(.name == "Publish WesiOS Release") | select((.created_at | fromdateiso8601) >= ($started - 5))] | sort_by(.created_at) | last | .id // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo '::error::Не найден новый Publish WesiOS Release run.'
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "builder_run_id=$run_id"

          for attempt in $(seq 1 180); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            echo "builder attempt=$attempt status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && break
              echo "::error::Signed release builder completed with $conclusion"
              exit 1
            fi
            sleep 15
          done

          final=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // ""')
          [ "$final" = success ] || { echo '::error::Signed release builder timeout/failure'; exit 1; }

      - name: Download published app-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upload
          gh release download app-latest \
            --repo "$GITHUB_REPOSITORY" \
            --dir upload \
            --pattern 'wesios-windows-x64.zip' \
            --pattern 'wesios-android.apk' \
            --pattern 'app-manifest.json' \
            --clobber
          test -s upload/wesios-windows-x64.zip
          test -s upload/wesios-android.apk
          test -s upload/app-manifest.json
          python3 -m json.tool upload/app-manifest.json >/dev/null

      - name: Read published metadata
        id: meta
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, base64
          m = json.load(open('upload/app-manifest.json', encoding='utf-8'))
          print('version=' + str(m['version']))
          print('build=' + str(m['build']))
          notes = (m.get('android') or {}).get('notes') or (m.get('windows') or {}).get('notes') or ''
          print('notes_b64=' + base64.b64encode(notes.encode()).decode())
          PY

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" || { echo '::error::WESI_SERVER_HOST missing'; exit 1; }
          test -n "${USER:-}" || { echo '::error::WESI_SERVER_USER missing'; exit 1; }
          test -n "${KEY:-}" || { echo '::error::WESI_SERVER_SSH_KEY missing'; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
            echo '::warning::WESI_SERVER_KNOWN_HOSTS не задан — используется текущий host key.'
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy published build to PocketBase
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          NOTES_B64: ${{ steps.meta.outputs.notes_b64 }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          TARGET='/opt/pocketbase/pb_public/artifacts'
          REMOTE_TMP="/tmp/wesios-production-$GITHUB_RUN_ID"

          $SSH "$USER@$HOST" "mkdir -p '$TARGET/app' && test -w '$TARGET/app'"
          $SSH "$USER@$HOST" "mkdir -p '$REMOTE_TMP'"

          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            upload/wesios-windows-x64.zip \
            upload/wesios-android.apk \
            server/deploy-artifact.sh \
            "$USER@$HOST:$REMOTE_TMP/"

          cleanup() { $SSH "$USER@$HOST" "rm -rf '$REMOTE_TMP'" || true; }
          trap cleanup EXIT

          $SSH "$USER@$HOST" \
            "WESI_ARTIFACTS='$TARGET' bash '$REMOTE_TMP/deploy-artifact.sh' \
              --version '$VERSION' --build '$BUILD' --from '$REMOTE_TMP' \
              --notes-b64 '$NOTES_B64'"

      - name: Verify production artifacts publicly
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD: ${{ steps.meta.outputs.build }}
          BASE: https://api.wesi-inc.ru/artifacts
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BASE/app/app-manifest.json" -o manifest.json
          python3 <<'PY'
          import json, os, sys, urllib.request
          m = json.load(open('manifest.json', encoding='utf-8'))
          version, build = os.environ['VERSION'], int(os.environ['BUILD'])
          if m.get('version') != version or int(m.get('build', -1)) != build:
              sys.exit(f"manifest mismatch: got {m.get('version')}+{m.get('build')}, expected {version}+{build}")
          base = os.environ['BASE'].rstrip('/')
          for platform in ('windows', 'android'):
              item = m[platform]
              url = f"{base}/{item['path']}"
              req = urllib.request.Request(url, method='HEAD')
              with urllib.request.urlopen(req, timeout=30) as response:
                  size = int(response.headers.get('Content-Length', '-1'))
              if size != int(item['sizeBytes']):
                  sys.exit(f"{platform}: size mismatch {size} != {item['sizeBytes']}")
              print(f"{platform}: {url} — {size} bytes OK")
          print(f"WESIOS_PRODUCTION_RELEASE_OK {version}+{build}")
          PY
