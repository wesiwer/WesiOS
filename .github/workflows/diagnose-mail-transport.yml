name: Diagnose production mail transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-mail-transport.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Collect non-secret mail capabilities
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" 'bash -s' > mail-capabilities.env <<'REMOTE'
          set +e
          boolcmd() { command -v "$1" >/dev/null 2>&1 && echo true || echo false; }
          echo "os=$(awk -F= '$1==\"ID\"{gsub(/\"/,\"\",$2);print $2}' /etc/os-release 2>/dev/null | head -1)"
          echo "apt=$(boolcmd apt-get)"
          sudo -n true >/dev/null 2>&1; [ $? -eq 0 ] && echo 'sudo=true' || echo 'sudo=false'
          echo "sendmail=$(boolcmd sendmail)"
          echo "postfix=$(boolcmd postfix)"
          echo "msmtp=$(boolcmd msmtp)"
          echo "exim=$(boolcmd exim4)"
          systemctl is-active --quiet postfix 2>/dev/null; [ $? -eq 0 ] && echo 'postfixActive=true' || echo 'postfixActive=false'
          systemctl is-active --quiet exim4 2>/dev/null; [ $? -eq 0 ] && echo 'eximActive=true' || echo 'eximActive=false'
          ss -ltn 2>/dev/null | grep -Eq '[:.]25[[:space:]]' && echo 'local25=true' || echo 'local25=false'
          timeout 7 bash -c '</dev/tcp/gmail-smtp-in.l.google.com/25' >/dev/null 2>&1; [ $? -eq 0 ] && echo 'outbound25=true' || echo 'outbound25=false'
          timeout 7 bash -c '</dev/tcp/smtp.gmail.com/587' >/dev/null 2>&1; [ $? -eq 0 ] && echo 'outbound587=true' || echo 'outbound587=false'
          REMOTE

          python3 - <<'PY'
          import json
          values={}
          for line in open('mail-capabilities.env', encoding='utf-8'):
              if '=' not in line: continue
              k,v=line.rstrip().split('=',1)
              if v in ('true','false'): values[k]=(v=='true')
              else: values[k]=v
          with open('.mail-transport-diagnostic.json','w',encoding='utf-8') as f:
              json.dump(values,f,ensure_ascii=False,indent=2)
              f.write('\n')
          print(json.dumps(values,ensure_ascii=False))
          PY
      - name: Publish sanitized diagnostic
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Mail Diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git add .mail-transport-diagnostic.json
          git commit -m 'chore: record production mail transport capabilities'
          git push origin HEAD:main
