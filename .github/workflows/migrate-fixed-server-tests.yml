name: Migrate fixed-server tests

on:
  push:
    branches: [chatgpt/fixed-server-test-migration]
    paths:
      - '.github/workflows/migrate-fixed-server-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fixed-server-test-migration
          fetch-depth: 0

      - name: Update obsolete expectations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sync = Path('test/sync_engine_test.dart')
          text = sync.read_text(encoding='utf-8')
          old = """    test('без настроенного сервера честно говорит об этом', () async {
                final report = await SyncEngine.run(now: base);
                expect(report.ok, isFalse);
                expect(report.firstFailure?.code, 'NOT_CONFIGURED');
              });""".replace('              ', '')
          new = """    test('корпоративный сервер известен, но без входа обмен не начинается', () async {
                final report = await SyncEngine.run(now: base);
                expect(report.ok, isFalse);
                expect(report.firstFailure?.code, 'NOT_SIGNED_IN');
              });""".replace('              ', '')
          if old not in text:
              raise SystemExit('Не найден старый тест SyncEngine')
          sync.write_text(text.replace(old, new, 1), encoding='utf-8')

          chat = Path('test/chat_service_test.dart')
          text = chat.read_text(encoding='utf-8')
          old = """    test('без сервера сообщение никуда не собирается', () async {
                // Вечные «часики» означали бы «отправляется» — и висели бы всегда,
                // выглядя как поломка.
                final chat = await ChatService.direct('e2', now: base);
                final m = (await ChatService.send(
                    chatId: chat.id, body: 'Привет', now: base))!;
                expect(m.state, DeliveryState.local);
                expect(ChatDelivery.whyLocal(chat), isNotNull);
              });""".replace('              ', '')
          new = """    test('рабочее сообщение сразу ждёт отправки на корпоративный сервер', () async {
                final chat = await ChatService.direct(
                    'e2', kind: ChatKind.work, now: base);
                final m = (await ChatService.send(
                    chatId: chat.id, body: 'Привет', now: base))!;
                expect(m.state, DeliveryState.pending);
                expect(ChatDelivery.whyLocal(chat), isNull);
              });""".replace('              ', '')
          if old not in text:
              raise SystemExit('Не найден старый тест ChatService')
          chat.write_text(text.replace(old, new, 1), encoding='utf-8')

          transport = Path('lib/core/sync/pocketbase_transport.dart')
          text = transport.read_text(encoding='utf-8')
          old = """    final url = SyncEndpoint.url;
              if (url == null) return null;
              final t = PocketBaseTransport(url);""".replace('              ', '')
          new = """    final t = PocketBaseTransport(SyncEndpoint.url);""".replace('              ', '')
          if old not in text:
              raise SystemExit('Не найден устаревший null-check PocketBaseTransport')
          transport.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit migration
        run: |
          git config user.name 'WesiOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git add test/sync_engine_test.dart test/chat_service_test.dart lib/core/sync/pocketbase_transport.dart
          git commit -m 'test: align sync expectations with fixed server'
          git push origin HEAD:chatgpt/fixed-server-test-migration
