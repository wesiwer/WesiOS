name: Wesi AI Stage 11 GitHub Secure One Shot

on:
  push:
    branches:
      - agent/wesi-ai-stage11-connectors-secure-gpt56

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage11-github-secure-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage11-connectors-secure-gpt56
          fetch-depth: 0

      - name: Generate secure GitHub connector slice
        run: |
          python3 scripts/stage11_github_connector_once.py
          python3 scripts/stage11_secure_compile_fix.py

      - name: Validate PocketBase and connector protocol JavaScript
        run: |
          set -euo pipefail
          node --check server/pb_migrations/1786830000_wesi_ai_connector_vault.js
          node --check server/pb_hooks/wesi_ai_connector_policy.js
          node --check server/pb_hooks/wesi_ai_connector_vault.js
          node --check server/pb_hooks/wesi_ai_github_connector.js
          node --check server/pb_hooks/wesi_ai_connectors.pb.js
          node --check server/pb_hooks/wesi_ai_tools.js
          node --check server/pb_hooks/wesi_ai_capability_registry.js
          node --check server/pb_hooks/wesi_ai_routes.pb.js
          node --test server/wesi-ai-stream/connector_protocol.test.mjs

      - name: Enforce connector security invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'WESI_CONNECTOR_VAULT_KEY' server/pb_hooks/wesi_ai_connector_vault.js
          grep -q 'wesi_ai_connector_vault' server/pb_migrations/1786830000_wesi_ai_connector_vault.js
          grep -q 'listRule = null' server/pb_migrations/1786830000_wesi_ai_connector_vault.js
          grep -q 'viewRule = null' server/pb_migrations/1786830000_wesi_ai_connector_vault.js
          grep -q 'untrustedExternalData' server/pb_hooks/wesi_ai_github_connector.js
          grep -q 'WESI_AI_UNTRUSTED_EXTERNAL_CONTENT' server/pb_hooks/wesi_ai_routes.pb.js
          grep -q 'GITHUB_WRITE_RESULT_UNKNOWN' server/pb_hooks/wesi_ai_github_connector.js
          grep -q 'GITHUB_PROTECTED_BRANCH' server/pb_hooks/wesi_ai_github_connector.js
          if grep -R --line-number -E 'wesios_records|const GITHUB_COLL *= *["'"']ai_github_connector["'"']' \
            server/pb_hooks/wesi_ai_github_connector.js \
            server/pb_hooks/wesi_ai_connectors.pb.js \
            server/pb_hooks/wesi_ai_connector_vault.js; then
            echo '::error::Legacy client-synced GitHub credential storage leaked into secure connector path'
            exit 1
          fi
          if grep -R --line-number -E 'gh[pousr]_[A-Za-z0-9_]{20,}' lib/features/ai/connectors server/pb_hooks/wesi_ai_*connector*; then
            echo '::error::GitHub token-like literal detected'
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format connector Dart files
        run: dart format lib/features/ai/connectors lib/features/ai/ai_assistant_v2_screen.dart test/wesi_connector_models_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Focused connector tests
        run: flutter test test/wesi_connector_models_test.dart test/wesi_ai_action_broker_contract_test.dart

      - name: Full regression suite
        run: flutter test

      - name: Commit validated product slice only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/pb_migrations/1786830000_wesi_ai_connector_vault.js \
            server/pb_hooks/wesi_ai_connector_policy.js \
            server/pb_hooks/wesi_ai_connector_vault.js \
            server/pb_hooks/wesi_ai_github_connector.js \
            server/pb_hooks/wesi_ai_connectors.pb.js \
            server/pb_hooks/wesi_ai_tools.js \
            server/pb_hooks/wesi_ai_capability_registry.js \
            server/pb_hooks/wesi_ai_routes.pb.js \
            server/wesi-ai-stream/connector_protocol.test.mjs \
            lib/features/ai/connectors/wesi_connector_api.dart \
            lib/features/ai/connectors/wesi_connector_manager_sheet.dart \
            lib/features/ai/ai_assistant_v2_screen.dart \
            test/wesi_connector_models_test.dart
          git diff --cached --quiet && { echo '::error::No secure Stage 11 product diff generated'; exit 1; }
          git commit -m 'feat(ai): add secure GitHub connector foundation'
          git push origin HEAD:agent/wesi-ai-stage11-connectors-secure-gpt56
