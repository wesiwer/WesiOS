name: Finish AI staged cleanup wiring once

on:
  push:
    paths:
      - '.github/workflows/fix-ai-upload-cleanup-return-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-client-hardening-chunked
          token: ${{ github.token }}
      - name: Wire staged ids into return and error cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/wesi-ai-relay/attachment-preprocessor.mjs')
          text = p.read_text(encoding='utf-8')
          old = """    return {parts, descriptors, providerFiles};
            } catch (error) {
              await deleteGeminiFiles(providerFiles, apiKey);
              throw error;
            }
          }
          """
          # The previous patch normalized the file indentation, so support the
          # actual four/two-space shape as well.
          if old in text:
              new = """    return {parts, descriptors, providerFiles, stagedUploadIds};
            } catch (error) {
              await deleteGeminiFiles(providerFiles, apiKey);
              deleteStagedUploads(stagedUploadIds);
              throw error;
            }
          }
          """
              text = text.replace(old, new, 1)
          else:
              old2 = """    return {parts, descriptors, providerFiles};
          } catch (error) {
            await deleteGeminiFiles(providerFiles, apiKey);
            throw error;
          }
          """
              if old2 in text:
                  new2 = """    return {parts, descriptors, providerFiles, stagedUploadIds};
          } catch (error) {
            await deleteGeminiFiles(providerFiles, apiKey);
            deleteStagedUploads(stagedUploadIds);
            throw error;
          }
          """
                  text = text.replace(old2, new2, 1)
              else:
                  old3 = """    return {parts, descriptors, providerFiles};
  } catch (error) {
    await deleteGeminiFiles(providerFiles, apiKey);
    throw error;
  }
}
"""
                  if old3 not in text:
                      raise SystemExit('cleanup return block not found')
                  new3 = """    return {parts, descriptors, providerFiles, stagedUploadIds};
  } catch (error) {
    await deleteGeminiFiles(providerFiles, apiKey);
    deleteStagedUploads(stagedUploadIds);
    throw error;
  }
}
"""
                  text = text.replace(old3, new3, 1)
          p.write_text(text, encoding='utf-8')
          PY
          node --check server/wesi-ai-relay/attachment-preprocessor.mjs
          grep -q 'return {parts, descriptors, providerFiles, stagedUploadIds}' server/wesi-ai-relay/attachment-preprocessor.mjs
          grep -q 'deleteStagedUploads(stagedUploadIds)' server/wesi-ai-relay/attachment-preprocessor.mjs
          rm .github/workflows/fix-ai-upload-cleanup-return-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/wesi-ai-relay/attachment-preprocessor.mjs .github/workflows/fix-ai-upload-cleanup-return-once.yml
          git commit -m 'fix(ai): complete staged upload cleanup lifecycle'
          git push origin HEAD:chatgpt/ai-client-hardening-chunked
