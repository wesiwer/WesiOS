name: Release WesiOS 0.22.8 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-once-0.22.8.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed WesiOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='Wesi AI, secure SSH server connections and Direct SSH Console' \
            -f deploy_to_server=true
          echo 'WESIOS_RELEASE_0_22_8_DISPATCHED_RETRY_1'
