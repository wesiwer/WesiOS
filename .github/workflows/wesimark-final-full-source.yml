name: WesiMark Final APK

on:
  push:
    branches:
      - wesimark/apk-build-v2.4.0
    paths:
      - '.github/workflows/wesimark-final-full-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-final-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download original WesiMark source
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://drive.usercontent.google.com/download?id=1ScMR7JUANdpGTha1hqUN-IXAh9UlVTvy&export=download&confirm=t'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/wesimark-source.zip
          file /tmp/wesimark-source.zip
          unzip -t /tmp/wesimark-source.zip >/dev/null
          rm -rf /tmp/wesimark-src
          mkdir -p /tmp/wesimark-src
          unzip -q /tmp/wesimark-source.zip -d /tmp/wesimark-src
          PUBSPEC="$(find /tmp/wesimark-src -name pubspec.yaml -type f | head -n1)"
          test -n "$PUBSPEC"
          APP_DIR="$(dirname "$PUBSPEC")"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          grep -F 'version: 2.4.0+14' "$PUBSPEC"
          test -d "$APP_DIR/android/app/src/main/res"
          test -f "$APP_DIR/lib/main.dart"

      - name: Verify original launcher icon and Android identity
        shell: bash
        run: |
          set -euxo pipefail
          cd "$APP_DIR"
          echo 'Launcher resources:'
          find android/app/src/main/res -type f \( -name 'ic_launcher*' -o -name '*launcher*' \) -print | sort
          ICON_COUNT=$(find android/app/src/main/res -type f \( -name 'ic_launcher*' -o -name '*launcher*' \) | wc -l)
          test "$ICON_COUNT" -gt 0
          echo 'Android identity:'
          grep -RInE 'applicationId|namespace|android:label' android/app android/build.gradle* android/settings.gradle* 2>/dev/null || true

      - name: Verify release signing material
        shell: bash
        run: |
          set -euxo pipefail
          cd "$APP_DIR"
          echo 'Signing config references:'
          grep -RInE 'signingConfig|storeFile|keyAlias|key.properties' android 2>/dev/null || true
          find android -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'key.properties' \) -print
          if find android -type f \( -name '*.jks' -o -name '*.keystore' \) | grep -q .; then
            echo 'ORIGINAL_KEYSTORE_PRESENT=1' >> "$GITHUB_ENV"
          else
            echo 'ORIGINAL_KEYSTORE_PRESENT=0' >> "$GITHUB_ENV"
          fi

      - name: Restore dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cd "$APP_DIR"
          flutter pub get

      - name: Build release APK from original Android project
        shell: bash
        run: |
          set -euxo pipefail
          cd "$APP_DIR"
          flutter build apk --release --build-name=2.4.0 --build-number=14
          test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK package, signing certificate and size
        shell: bash
        run: |
          set -euxo pipefail
          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p "$GITHUB_WORKSPACE/final-apk"
          cp "$APK" "$GITHUB_WORKSPACE/final-apk/WesiMark-2.4.0+14.apk"
          sha256sum "$GITHUB_WORKSPACE/final-apk/WesiMark-2.4.0+14.apk"
          stat -c 'APK size: %s bytes' "$GITHUB_WORKSPACE/final-apk/WesiMark-2.4.0+14.apk"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: WesiMark-2.4.0+14-final-apk
          path: final-apk/WesiMark-2.4.0+14.apk
          if-no-files-found: error
          retention-days: 30
