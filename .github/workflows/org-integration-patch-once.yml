name: Org integration compatibility patch once

on:
  push:
    branches: [chatgpt/org-main-v2]
    paths: ['.github/workflows/org-integration-patch-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-main-v2
          fetch-depth: 0
      - name: Patch current Horizon APIs into org-secured services
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/treasury/services/treasury_service.dart')
          s = p.read_text()
          if "import 'calendar_days.dart';" not in s:
              s = s.replace("import 'anomaly_engine.dart';\n", "import 'anomaly_engine.dart';\nimport 'calendar_days.dart';\n")

          marker = "  // ========== WESI HORIZON ==========\n"
          balance = '''  /// Баланс на конец календарного дня без будущих операций.\n  /// Нужен Horizon, чтобы будущая запись не попадала одновременно в текущий\n  /// баланс и затем повторно в прогноз.\n  static double balanceOnDay(\n    DateTime day,\n    List<TransactionModel> transactions,\n    double totalBalance,\n  ) {\n    final cutoff = dateOnly(day);\n    var later = 0.0;\n    for (final tx in transactions) {\n      if (tx.isRecurring) continue;\n      if (dateOnly(tx.date).isAfter(cutoff)) {\n        later += tx.type == TransactionType.income ? tx.amount : -tx.amount;\n      }\n    }\n    return totalBalance - later;\n  }\n\n'''
          if 'static double balanceOnDay(' not in s:
              if marker not in s:
                  raise SystemExit('Horizon marker not found')
              s = s.replace(marker, marker + '\n' + balance, 1)

          # Keep org authorization/ownership logic, but restore stable recurring\n          # anchor semantics from current main.\n          old = '''      var anchor = tx;\n      var guard = 0;\n      while (RecurringEngine.isDue(anchor, now) && guard < 366) {\n        final due = RecurringEngine.advance(anchor.date, period);'''
          new = '''      final anchorDate = tx.recurringAnchorDate;\n      var lastDue = tx.date;\n      var index = RecurringEngine.firstIndexAfter(anchorDate, period, tx.date);\n      var guard = 0;\n      while (guard < 366) {\n        final due = RecurringEngine.occurrence(anchorDate, period, index);\n        if (due.isAfter(now)) break;'''
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace(
                  "        anchor = anchor.copyWith(date: due, updatedAt: DateTime.now());\n        guard++;\n      }\n      if (guard > 0) await _putRecurringSystem(anchor);",
                  "        lastDue = due;\n        index++;\n        guard++;\n      }\n      if (guard > 0) {\n        await _putRecurringSystem(tx.copyWith(\n          date: lastDue,\n          recurringAnchor: anchorDate,\n          updatedAt: DateTime.now(),\n        ));\n      }",
                  1,
              )
          p.write_text(s)

          # Latest Contacts expects the shared access editor's static show().\n          # Take only the UI widget from the latest org branch; authorization\n          # remains enforced by the remediated OrganizationAccessService.\n          PY
          git fetch origin agent/org-hierarchy-v1 --depth=1
          git show FETCH_HEAD:lib/features/organizations/widgets/organization_access_editor.dart > lib/features/organizations/widgets/organization_access_editor.dart

          # Re-apply current calendar-day arithmetic to the org-aware Horizon\n          # context where the two histories diverged. The import is harmless\n          # until the remaining date operations are merged/tested below.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/treasury/services/horizon_business_context.dart')
          s = p.read_text()
          if "import 'calendar_days.dart';" not in s:
              s = "import 'calendar_days.dart';\n" + s
          p.write_text(s)
          PY

          rm .github/workflows/org-integration-patch-once.yml
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: reconcile org security with current Horizon APIs'
          git push origin HEAD:chatgpt/org-main-v2
