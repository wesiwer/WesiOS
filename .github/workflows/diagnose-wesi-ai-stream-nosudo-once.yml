name: Diagnose Wesi AI Stream NoSudo Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesi-ai-stream-nosudo-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/main_known_hosts
      - name: Read production diagnostics
        shell: bash
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          echo '=== REPO HOOK ==='
          sha256sum server/pb_hooks/wesi_ai_stream.pb.js
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "bash -s" <<'REMOTE'
          set -uo pipefail
          echo '=== ID ==='; id || true
          echo '=== PROD HOOK ==='; sha256sum /opt/pocketbase/pb_hooks/wesi_ai_stream.pb.js || true
          echo '=== CONTRACT ==='; grep -nE 'persona\)|tier\)|lobbyMode\)|message.length|summary.length|conversationId.length|provider !=|attachmentsRaw.length|Слишком длинное сообщение' /opt/pocketbase/pb_hooks/wesi_ai_stream.pb.js || true
          echo '=== SERVICES ==='; systemctl is-active pocketbase || true; systemctl is-active wesi-ai-stream || true
          echo '=== PB JOURNAL ==='; journalctl -u pocketbase --since '12 hours ago' --no-pager -o short-iso 2>&1 | tail -n 3000 | grep -Ei 'stream/prepare|WAI_|BadRequest|bad request|400|Wesi AI|Некоррект|Слишком|Недоступная настройка|permission denied' | tail -n 1000 || true
          echo '=== STREAM JOURNAL ==='; journalctl -u wesi-ai-stream --since '12 hours ago' --no-pager -o short-iso 2>&1 | tail -n 3000 | grep -Ei 'WAI_|prepare|400|error|reject|main|permission denied' | tail -n 1000 || true
          echo '=== NGINX ==='; if [ -r /var/log/nginx/access.log ]; then tail -n 5000 /var/log/nginx/access.log | grep -E '/api/wesi/ai/(chat/stream|stream/prepare)' | tail -n 500 || true; else echo 'nginx access log unreadable'; fi
          REMOTE
