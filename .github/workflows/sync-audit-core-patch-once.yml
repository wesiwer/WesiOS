name: Apply Sync Audit Core Patch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-audit-core-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact core audit patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}')
              p.write_text(text.replace(old, new, 1))

          # SyncCollection tells the journal which Hive events belong to it and
          # how a physical Hive key maps to the logical server record id.
          replace_once(
              'lib/core/sync/sync_codec.dart',
              '  bool shouldSync(T value) => true;\n\n  Box<T>? box() {',
              "  bool shouldSync(T value) => true;\n\n  /// A collection may share a Hive box with unrelated local settings.\n  bool watchesBoxKey(Object? key) => true;\n\n  /// Most boxes use their Hive key as the sync id. Private keyed stores may\n  /// map a short local key to an account-scoped server id.\n  String syncIdForBoxKey(Object? key) => '$key';\n\n  Box<T>? box() {",
          )

          replace_once(
              'lib/core/sync/sync_journal.dart',
              "  static void attach(String collection, BoxBase<dynamic> box) {\n    if (_watchers.containsKey(collection)) return;\n    _watchers[collection] = box.watch().listen((event) {\n      final id = '${event.key}';\n      final k = key(collection, id);",
              "  static void attach(\n    String collection,\n    BoxBase<dynamic> box, {\n    bool Function(Object? key)? acceptsKey,\n    String Function(Object? key)? syncIdForKey,\n  }) {\n    if (_watchers.containsKey(collection)) return;\n    _watchers[collection] = box.watch().listen((event) {\n      if (acceptsKey != null && !acceptsKey(event.key)) return;\n      final id = syncIdForKey?.call(event.key) ?? '${event.key}';\n      if (id.isEmpty) return;\n      final k = key(collection, id);",
          )

          replace_once(
              'lib/core/sync/sync_engine.dart',
              '        SyncJournal.attach(c.name, await c.ensureBox());',
              "        SyncJournal.attach(\n          c.name,\n          await c.ensureBox(),\n          acceptsKey: c.watchesBoxKey,\n          syncIdForKey: c.syncIdForBoxKey,\n        );",
          )

          # Existing account-private stores used employee::key on the wire but
          # raw key in Hive. Fix both identity and box-event filtering.
          replace_once(
              'lib/core/sync/sync_feature_extensions.dart',
              "  Set<String> get keys => SyncFeatureExtensions._profileKeys;\n\n  @override\n  String idOf(dynamic value)",
              "  Set<String> get keys => SyncFeatureExtensions._profileKeys;\n\n  @override\n  bool watchesBoxKey(Object? key) => keys.contains('$key');\n\n  @override\n  String syncIdForBoxKey(Object? key) =>\n      SyncFeatureExtensions.privateRecordId('$key');\n\n  @override\n  String idOf(dynamic value)",
          )
          replace_once(
              'lib/core/sync/sync_feature_extensions.dart',
              "  String get boxName => SyncFeatureExtensions.vaultBoxName();\n  @override\n  String idOf(dynamic value)",
              "  String get boxName => SyncFeatureExtensions.vaultBoxName();\n  @override\n  bool watchesBoxKey(Object? key) => SyncFeatureExtensions._vaultKey(key);\n  @override\n  String syncIdForBoxKey(Object? key) =>\n      SyncFeatureExtensions.privateRecordId('$key');\n  @override\n  String idOf(dynamic value)",
          )

          # Same mapping for the replacement Shield channel, and filter the
          # shared legacy Audio Vault box down to its single portable meta key.
          replace_once(
              'lib/core/sync/sync_audit_extensions.dart',
              "  String get boxName => SyncFeatureExtensions.profileBoxName();\n\n  @override\n  String idOf(dynamic value)",
              "  String get boxName => SyncFeatureExtensions.profileBoxName();\n\n  @override\n  bool watchesBoxKey(Object? key) => _keys.contains('$key');\n\n  @override\n  String syncIdForBoxKey(Object? key) =>\n      SyncFeatureExtensions.privateRecordId('$key');\n\n  @override\n  String idOf(dynamic value)",
          )
          replace_once(
              'lib/core/sync/sync_audit_extensions.dart',
              "  String get boxName => AudioVaultService.boxName;\n\n  @override\n  String idOf(dynamic value) => _metaKey;",
              "  String get boxName => AudioVaultService.boxName;\n\n  @override\n  bool watchesBoxKey(Object? key) => '$key' == _metaKey;\n\n  @override\n  String idOf(dynamic value) => _metaKey;",
          )

          # Install the second-pass business coverage before SyncEngine.prepare.
          replace_once(
              'lib/main.dart',
              "import 'core/sync/sync_audit_extensions.dart';\n",
              "import 'core/sync/sync_audit_extensions.dart';\nimport 'core/sync/sync_business_extensions.dart';\n",
          )
          replace_once(
              'lib/main.dart',
              '  SyncAuditExtensions.install();\n',
              '  SyncAuditExtensions.install();\n  SyncBusinessExtensions.install();\n',
          )

          # Non-owner employee projection must not silently drop fields 17-22.
          replace_once(
              'server/pb_hooks/wesi_sync_read.pb.js',
              '        "photo": p.photo == null ? null : p.photo\n      };',
              '        "photo": p.photo == null ? null : p.photo,\n        "skills": Array.isArray(p.skills) ? p.skills.map(String) : [],\n        "weeklyCapacityPoints": Number(p.weeklyCapacityPoints || 10),\n        "workloadMinRatio": Number(p.workloadMinRatio == null ? 0.65 : p.workloadMinRatio),\n        "workloadMaxRatio": Number(p.workloadMaxRatio == null ? 1.10 : p.workloadMaxRatio),\n        "managerEmployeeId": p.managerEmployeeId == null ? null : String(p.managerEmployeeId),\n        "workloadAlertTarget": String(p.workloadAlertTarget || "manager")\n      };',
          )

          # Extra routes support either one required module or any of several.
          path = Path('server/pb_hooks/wesi_sync_extra.pb.js')
          text = path.read_text()
          old = '  if (requiredModule && !ctx.isOwner && ctx.modules.indexOf(requiredModule) < 0) {\n    return e.json(200, {"items": []});\n  }'
          new = '  const moduleAllowed = !requiredModule || ctx.isOwner || (Array.isArray(requiredModule)\n    ? requiredModule.some((name) => ctx.modules.indexOf(name) >= 0)\n    : ctx.modules.indexOf(requiredModule) >= 0);\n  if (!moduleAllowed) return e.json(200, {"items": []});'
          if text.count(old) != 1:
              raise SystemExit('server extra read module block mismatch')
          text = text.replace(old, new, 1)
          old = '  if (requiredModule && !ctx.isOwner && ctx.modules.indexOf(requiredModule) < 0) {\n    throw new ForbiddenError("Раздел не открыт этому сотруднику");\n  }'
          new = '  const moduleAllowed = !requiredModule || ctx.isOwner || (Array.isArray(requiredModule)\n    ? requiredModule.some((name) => ctx.modules.indexOf(name) >= 0)\n    : ctx.modules.indexOf(requiredModule) >= 0);\n  if (!moduleAllowed) throw new ForbiddenError("Раздел не открыт этому сотруднику");'
          if text.count(old) != 1:
              raise SystemExit('server extra write module block mismatch')
          text = text.replace(old, new, 1)

          marker = '// Audio cards remain company-shared. Extended analysis/QC metadata belongs to\n'
          routes = '''// Business state found by the second audit pass.\nrouterAdd("GET", "/api/wesi/sync/finance_categories", (e) =>\n  wesiSyncExtraRead(e, "finance_categories", "company", ["treasury", "forecast", "sandbox", "analytics"]),\n  $apis.requireAuth("users"));\nrouterAdd("POST", "/api/wesi/sync/finance_categories", (e) =>\n  wesiSyncExtraWrite(e, "finance_categories", "company", ["treasury", "forecast", "sandbox", "analytics"]),\n  $apis.requireAuth("users"));\n\nrouterAdd("GET", "/api/wesi/sync/team_skills", (e) =>\n  wesiSyncExtraRead(e, "team_skills", "company", ["contacts", "tasks"]),\n  $apis.requireAuth("users"));\nrouterAdd("POST", "/api/wesi/sync/team_skills", (e) =>\n  wesiSyncExtraWrite(e, "team_skills", "company", ["contacts", "tasks"]),\n  $apis.requireAuth("users"));\n\nrouterAdd("GET", "/api/wesi/sync/time_center", (e) =>\n  wesiSyncExtraRead(e, "time_center", "private", null), $apis.requireAuth("users"));\nrouterAdd("POST", "/api/wesi/sync/time_center", (e) =>\n  wesiSyncExtraWrite(e, "time_center", "private", null), $apis.requireAuth("users"));\n\nfor (const name of ["horizon_predictions", "horizon_learning", "horizon_competition"]) {\n  routerAdd("GET", "/api/wesi/sync/" + name, (e) =>\n    wesiSyncExtraRead(e, name, "private", ["treasury", "forecast", "analytics"]),\n    $apis.requireAuth("users"));\n  routerAdd("POST", "/api/wesi/sync/" + name, (e) =>\n    wesiSyncExtraWrite(e, name, "private", ["treasury", "forecast", "analytics"]),\n    $apis.requireAuth("users"));\n}\n\nrouterAdd("GET", "/api/wesi/sync/horizon_contracts", (e) =>\n  wesiSyncExtraRead(e, "horizon_contracts", "private", ["audio", "forecast", "analytics"]),\n  $apis.requireAuth("users"));\nrouterAdd("POST", "/api/wesi/sync/horizon_contracts", (e) =>\n  wesiSyncExtraWrite(e, "horizon_contracts", "private", ["audio", "forecast", "analytics"]),\n  $apis.requireAuth("users"));\n\nrouterAdd("GET", "/api/wesi/sync/task_ai_memory", (e) =>\n  wesiSyncExtraRead(e, "task_ai_memory", "private", ["tasks", "ai"]),\n  $apis.requireAuth("users"));\nrouterAdd("POST", "/api/wesi/sync/task_ai_memory", (e) =>\n  wesiSyncExtraWrite(e, "task_ai_memory", "private", ["tasks", "ai"]),\n  $apis.requireAuth("users"));\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('server extra route marker mismatch')
          text = text.replace(marker, routes + marker, 1)
          path.write_text(text)
          PY

      - name: Validate patches
        run: |
          git diff --check
          node --check server/pb_hooks/wesi_sync_read.pb.js
          node --check server/pb_hooks/wesi_sync_extra.pb.js

      - name: Commit patches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/sync/sync_codec.dart \
                  lib/core/sync/sync_journal.dart \
                  lib/core/sync/sync_engine.dart \
                  lib/core/sync/sync_feature_extensions.dart \
                  lib/core/sync/sync_audit_extensions.dart \
                  lib/main.dart \
                  server/pb_hooks/wesi_sync_read.pb.js \
                  server/pb_hooks/wesi_sync_extra.pb.js
          git commit -m 'fix(sync): align journal ids and hidden business state'
          git push origin HEAD:main
