name: Fix portal Windows installer once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-portal-windows-installer-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Correct Windows download response
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/pb_hooks/employee_portal.pb.js')
          text = p.read_text(encoding='utf-8')
          old_name = '? "wesios-windows-x64.zip"\n    : "wesios-android.apk";'
          new_name = '? "wesios-windows-x64-setup.exe"\n    : "wesios-android.apk";'
          old_type = '? "application/zip"\n    : "application/vnd.android.package-archive");'
          new_type = '? "application/vnd.microsoft.portable-executable"\n    : "application/vnd.android.package-archive");'
          if old_name not in text or old_type not in text:
              raise SystemExit('Windows download response anchors not found')
          text = text.replace(old_name, new_name, 1).replace(old_type, new_type, 1)
          p.write_text(text, encoding='utf-8')
      - name: Validate and commit
        run: |
          set -euo pipefail
          node --check server/pb_hooks/employee_portal.pb.js
          grep -q 'wesios-windows-x64-setup.exe' server/pb_hooks/employee_portal.pb.js
          grep -q 'application/vnd.microsoft.portable-executable' server/pb_hooks/employee_portal.pb.js
          rm -f .github/workflows/fix-portal-windows-installer-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(portal): serve Windows installer with executable metadata'
          git push origin HEAD:main
