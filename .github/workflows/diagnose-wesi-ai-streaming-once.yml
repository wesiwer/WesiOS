name: Diagnose Wesi AI Streaming Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesi-ai-streaming-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}"
          test -n "${MAIN_USER:-}"
          test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts
          else
            ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Trace stream prepare through public proxy and local PocketBase
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if sudo -n true 2>/dev/null; then SUDO='sudo -n'; else SUDO=''; fi

          echo '=== RECENT NGINX ACCESS: STREAM PREPARE ==='
          for f in /var/log/nginx/access.log /var/log/nginx/*access*.log; do
            [ -r "$f" ] || $SUDO test -r "$f" 2>/dev/null || continue
            ($SUDO tail -n 5000 "$f" 2>/dev/null || true) \
              | grep -F '/api/wesi/ai/stream/prepare' \
              | tail -n 80 || true
          done

          echo '=== RECENT NGINX ERRORS: STREAM ==='
          for f in /var/log/nginx/error.log /var/log/nginx/*error*.log; do
            [ -r "$f" ] || $SUDO test -r "$f" 2>/dev/null || continue
            ($SUDO tail -n 1200 "$f" 2>/dev/null || true) \
              | grep -Ei 'stream/prepare|wesi/ai|client intended|too large|upstream|400' \
              | tail -n 120 || true
          done

          echo '=== RELEVANT NGINX CONFIG ==='
          ($SUDO nginx -T 2>/dev/null || true) \
            | grep -E -C 4 'server_name[[:space:]]+api\.wesi-inc\.ru|client_max_body_size|proxy_pass|proxy_set_header|location[[:space:]].*/api|proxy_request_buffering' \
            | head -n 320 || true

          echo '=== PUBLIC VS LOCAL SYNTHETIC AUTH FAILURE ==='
          secret="$($SUDO python3 - <<'PY'
import json
p='/opt/pocketbase/pb_hooks/.wesi-ai-relay.json'
try:
    print(json.load(open(p,encoding='utf-8')).get('streamSecret',''))
except Exception:
    print('')
PY
          )"
          [ ${#secret} -ge 32 ] || { echo 'STREAM_SECRET_UNAVAILABLE'; exit 0; }
          body='{"persona":"zane","tier":"fast","lobbyMode":"smart","message":"stream proxy probe","summary":"","projectContext":"","conversationId":"probe","activeOrganizationId":"","memory":{},"messages":[]}'
          fake_token='fake.invalid.token'
          fake_session='abcdefghijklmnopqrstuvwx'
          for base in 'http://127.0.0.1:8090' 'https://api.wesi-inc.ru'; do
            out="/tmp/probe-$(echo "$base" | tr -cd 'A-Za-z0-9').out"
            hdr="${out}.headers"
            code="$(curl -sS --max-time 15 -D "$hdr" -o "$out" -w '%{http_code}' \
              -X POST "$base/api/wesi/ai/stream/prepare" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -H "Authorization: $fake_token" \
              -H "X-WesiOS-Session: $fake_session" \
              -H "X-Wesi-AI-Stream-Secret: $secret" \
              --data-binary "$body" || true)"
            printf 'BASE=%s STATUS=%s\n' "$base" "$code"
            grep -Ei '^(HTTP/|content-type:|server:|content-length:)' "$hdr" | tr -d '\r' || true
            printf 'BODY='
            head -c 800 "$out" | tr '\n' ' '; echo
          done
          REMOTE
