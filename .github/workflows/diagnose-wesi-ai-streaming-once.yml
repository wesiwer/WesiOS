name: Atomic Reload Wesi AI Streaming Hook Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesi-ai-streaming-once.yml'

permissions:
  contents: read

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}" && test -n "${MAIN_USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key && chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Atomically replace live streaming hook
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          REMOTE="/tmp/wesi-ai-stream-atomic-$GITHUB_RUN_ID.pb.js"
          scp "${SSH[@]}" server/pb_hooks/wesi_ai_stream.pb.js "$MAIN_USER@$MAIN_HOST:$REMOTE"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail
          HOOK_DIR=/opt/pocketbase/pb_hooks
          TARGET="$HOOK_DIR/wesi_ai_stream.pb.js"
          STAGED="$HOOK_DIR/.wesi_ai_stream.pb.js.atomic.$$"
          test -d "$HOOK_DIR" && test -w "$HOOK_DIR"
          cat "$REMOTE" > "$STAGED"
          chmod 0644 "$STAGED"
          cmp -s "$REMOTE" "$STAGED"
          mv -f "$STAGED" "$TARGET"
          sleep 3
          cmp -s "$REMOTE" "$TARGET"
          rm -f "$REMOTE"
          curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null
          echo 'STREAM_HOOK_ATOMICALLY_RELOADED'
          REMOTE

      - name: Verify public services remain healthy
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://api.wesi-inc.ru/api/health >/dev/null
          curl -fsS --max-time 15 https://wesi-ai-178-236-247-194.nip.io/health | grep -q '"streaming":true'
          echo 'PUBLIC_WESI_AI_EDGE_READY'
