name: Diagnose Wesi AI Streaming Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesi-ai-streaming-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}"
          test -n "${MAIN_USER:-}"
          test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts
          else
            ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Compare production hooks with main
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          echo '=== REPOSITORY CHECKSUMS ==='
          sha256sum server/pb_hooks/wesi_ai_stream.pb.js server/pb_hooks/wesi_ai_routes.pb.js
          echo '=== PRODUCTION CHECKSUMS ==='
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "sha256sum /opt/pocketbase/pb_hooks/wesi_ai_stream.pb.js /opt/pocketbase/pb_hooks/wesi_ai_routes.pb.js"
          echo '=== BYTE COMPARISON ==='
          scp "${SSH[@]}" "$MAIN_USER@$MAIN_HOST:/opt/pocketbase/pb_hooks/wesi_ai_stream.pb.js" /tmp/prod-stream.pb.js
          scp "${SSH[@]}" "$MAIN_USER@$MAIN_HOST:/opt/pocketbase/pb_hooks/wesi_ai_routes.pb.js" /tmp/prod-routes.pb.js
          cmp -s server/pb_hooks/wesi_ai_stream.pb.js /tmp/prod-stream.pb.js && echo 'STREAM_MATCH=true' || echo 'STREAM_MATCH=false'
          cmp -s server/pb_hooks/wesi_ai_routes.pb.js /tmp/prod-routes.pb.js && echo 'ROUTES_MATCH=true' || echo 'ROUTES_MATCH=false'
          if ! cmp -s server/pb_hooks/wesi_ai_stream.pb.js /tmp/prod-stream.pb.js; then
            echo '=== STREAM DIFF (NO SECRETS EXPECTED) ==='
            diff -u /tmp/prod-stream.pb.js server/pb_hooks/wesi_ai_stream.pb.js | head -n 240 || true
          fi
