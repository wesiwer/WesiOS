name: Reload Wesi AI Streaming Runtime Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesi-ai-streaming-once.yml'

permissions:
  contents: read

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}" && test -n "${MAIN_USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key && chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Restart PocketBase and verify hook runtime
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n systemctl restart pocketbase
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8090/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8090/api/health
          sudo -n systemctl is-active --quiet pocketbase
          echo '=== POCKETBASE ACTIVE SINCE ==='
          sudo -n systemctl show pocketbase -p ActiveEnterTimestamp --value
          echo '=== STARTUP JS ERRORS ==='
          if sudo -n journalctl -u pocketbase --since '2 minutes ago' --no-pager 2>/dev/null | grep -Ei 'ReferenceError|SyntaxError|streamSecret|wesi_ai.*error'; then
            echo '::error::PocketBase hook runtime reported a JS error after restart'
            exit 1
          fi
          echo 'POCKETBASE_WESI_AI_RUNTIME_RELOADED'
          REMOTE

      - name: Verify public Main and streaming edge health
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://api.wesi-inc.ru/api/health >/dev/null
          curl -fsS --max-time 15 https://wesi-ai-178-236-247-194.nip.io/health | grep -q '"streaming":true'
          echo 'PUBLIC_WESI_AI_EDGE_READY'
