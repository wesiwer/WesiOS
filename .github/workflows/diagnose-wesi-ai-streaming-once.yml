name: Diagnose Wesi AI Streaming Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesi-ai-streaming-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}" && test -n "${MAIN_USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key && chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Inspect safe PocketBase log metadata
        env:
          LOG_READER_B64: 
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          printf '%s' "$LOG_READER_B64" | base64 -d > /tmp/read_pb_logs.py
          scp "${SSH[@]}" /tmp/read_pb_logs.py "$MAIN_USER@$MAIN_HOST:/tmp/read_pb_logs.py"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" 'if sudo -n true 2>/dev/null; then sudo -n python3 /tmp/read_pb_logs.py; else python3 /tmp/read_pb_logs.py; fi; rm -f /tmp/read_pb_logs.py'
