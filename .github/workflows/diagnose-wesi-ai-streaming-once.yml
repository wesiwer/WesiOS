name: Deploy Human Wesi AI Reasoning Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesi-ai-streaming-once.yml'

permissions:
  contents: write

jobs:
  reasoning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAY_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      RELAY_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply visible reasoning patch
        run: |
          set -euo pipefail
          python3 scripts/patch_wesi_ai_visible_reasoning.py
          grep -q 'Как я подхожу к запросу' server/wesi-ai-stream/gateway.mjs
          grep -q 'Зачем нужен' server/wesi-ai-stream/dynamic_subagent_orchestrator.mjs
          grep -q 'humanReason' server/wesi-ai-stream/persona_coagent_orchestrator.mjs

      - name: Validate streaming runtime
        run: |
          set -euo pipefail
          node --check server/wesi-ai-stream/gateway.mjs
          node --check server/wesi-ai-stream/persona_coagent_orchestrator.mjs
          node --check server/wesi-ai-stream/dynamic_subagent_orchestrator.mjs
          node --test server/wesi-ai-stream/*.test.mjs

      - name: Prepare Relay SSH
        env:
          KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${RELAY_HOST:-}" && test -n "${RELAY_USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/relay_key
          chmod 600 ~/.ssh/relay_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/relay_known_hosts
          else
            ssh-keyscan -H "$RELAY_HOST" > ~/.ssh/relay_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/relay_known_hosts

      - name: Deploy reasoning runtime to production Relay
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          REMOTE="/tmp/wesi-ai-visible-reasoning-$GITHUB_RUN_ID"
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp "${SSH[@]}" \
            server/wesi-ai-stream/gateway.mjs \
            server/wesi-ai-stream/persona_coagent_orchestrator.mjs \
            server/wesi-ai-stream/dynamic_subagent_orchestrator.mjs \
            "$RELAY_USER@$RELAY_HOST:$REMOTE/"
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail
          for file in gateway.mjs persona_coagent_orchestrator.mjs dynamic_subagent_orchestrator.mjs; do
            sudo -n install -o root -g wesi-ai-stream -m 0640 "$REMOTE/$file" "/opt/wesi-ai-stream/$file"
          done
          sudo -n systemctl restart wesi-ai-stream
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8792/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8792/health | grep -q '"streaming":true'
          grep -q 'Как я подхожу к запросу' /opt/wesi-ai-stream/gateway.mjs
          grep -q 'Зачем нужен' /opt/wesi-ai-stream/dynamic_subagent_orchestrator.mjs
          rm -rf "$REMOTE"
          echo 'VISIBLE_REASONING_RUNTIME_ACTIVE'
          REMOTE

      - name: Verify public streaming edge
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://wesi-ai-178-236-247-194.nip.io/health | grep -q '"streaming":true'
          code="$(curl -sS -o /tmp/wesi-visible-reasoning-probe.out -w '%{http_code}' --max-time 20 -X POST https://wesi-ai-178-236-247-194.nip.io/api/wesi/ai/chat/stream -H 'Content-Type: application/json' -d '{"persona":"zane","tier":"fast","message":"Привет"}' || true)"
          if [ "$code" != 401 ] && [ "$code" != 403 ]; then
            echo "Unexpected protected edge status: $code"
            cat /tmp/wesi-visible-reasoning-probe.out || true
            exit 1
          fi
          echo "PUBLIC_VISIBLE_REASONING_EDGE_READY status=$code"

      - name: Persist product changes
        run: |
          set -euo pipefail
          git config user.name 'wesiwer'
          git config user.email '77644223+wesiwer@users.noreply.github.com'
          git add \
            server/wesi-ai-stream/gateway.mjs \
            server/wesi-ai-stream/gateway.test.mjs \
            server/wesi-ai-stream/persona_coagent_orchestrator.mjs \
            server/wesi-ai-stream/dynamic_subagent_orchestrator.mjs
          git rm scripts/patch_wesi_ai_visible_reasoning.py
          git commit -m 'feat(ai): add human-readable contextual reasoning timeline'
          git push origin HEAD:main
