name: Reload Wesi AI Streaming Runtime Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesi-ai-streaming-once.yml'

permissions:
  contents: read

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}" && test -n "${MAIN_USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key && chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Reload PocketBase through its own service process
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          me="$(id -un)"
          echo "DEPLOY_USER=$me"
          pid="$(pgrep -f '^/opt/pocketbase/pocketbase serve .*--dir=/opt/pocketbase/pb_data' | head -n 1 || true)"
          if [ -z "$pid" ]; then
            pid="$(pgrep -f '/opt/pocketbase/pocketbase serve' | head -n 1 || true)"
          fi
          test -n "$pid" || { echo '::error::PocketBase process not found'; exit 1; }
          owner="$(ps -o user= -p "$pid" | xargs)"
          echo "POCKETBASE_PID=$pid OWNER=$owner"
          if [ "$owner" != "$me" ]; then
            echo "::error::PocketBase is owned by $owner, deploy user is $me; refusing unsafely to signal another user process"
            exit 1
          fi

          before="$pid"
          kill -TERM "$pid"
          for _ in $(seq 1 40); do
            current="$(pgrep -f '/opt/pocketbase/pocketbase serve' | head -n 1 || true)"
            if [ -n "$current" ] && [ "$current" != "$before" ] && curl -fsS --max-time 2 http://127.0.0.1:8090/api/health >/dev/null 2>&1; then
              echo "POCKETBASE_RESTARTED old=$before new=$current"
              break
            fi
            sleep 1
          done
          current="$(pgrep -f '/opt/pocketbase/pocketbase serve' | head -n 1 || true)"
          test -n "$current" && test "$current" != "$before"
          curl -fsS --max-time 5 http://127.0.0.1:8090/api/health
          echo 'POCKETBASE_WESI_AI_RUNTIME_RELOADED'
          REMOTE

      - name: Verify public Main and streaming edge health
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://api.wesi-inc.ru/api/health >/dev/null
          curl -fsS --max-time 15 https://wesi-ai-178-236-247-194.nip.io/health | grep -q '"streaming":true'
          echo 'PUBLIC_WESI_AI_EDGE_READY'
