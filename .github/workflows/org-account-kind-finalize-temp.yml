name: Org account kind finalize temp

on:
  push:
    paths:
      - '.github/workflows/org-account-kind-finalize-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-v1
          fetch-depth: 0
      - name: Patch exhaustive AccountKind UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/features/treasury/widgets/accounts_bar.dart')
          s=p.read_text()
          a="""        AccountKind.savings => Icons.savings,\n        AccountKind.project => Icons.workspaces_outline,\n      };"""
          b="""        AccountKind.savings => Icons.savings,\n        AccountKind.project => Icons.workspaces_outline,\n        AccountKind.reserve => Icons.savings_outlined,\n        AccountKind.other => Icons.account_balance_wallet_outlined,\n      };"""
          if a not in s: raise SystemExit('icon switch marker missing')
          s=s.replace(a,b,1)
          a="""        AccountKind.savings => _ru ? 'Накопления' : 'Savings',\n        AccountKind.project => _ru ? 'Проект' : 'Project',\n      };"""
          b="""        AccountKind.savings => _ru ? 'Накопления' : 'Savings',\n        AccountKind.project => _ru ? 'Проект' : 'Project',\n        AccountKind.reserve => _ru ? 'Резерв' : 'Reserve',\n        AccountKind.other => _ru ? 'Другое' : 'Other',\n      };"""
          if a not in s: raise SystemExit('label switch marker missing')
          s=s.replace(a,b,1)
          a="""                          AccountKind.savings => _ru ? 'Накопления' : 'Savings',\n                          AccountKind.project => _ru ? 'Проект' : 'Project',\n                        },"""
          b="""                          AccountKind.savings => _ru ? 'Накопления' : 'Savings',\n                          AccountKind.project => _ru ? 'Проект' : 'Project',\n                          AccountKind.reserve => _ru ? 'Резерв' : 'Reserve',\n                          AccountKind.other => _ru ? 'Другое' : 'Other',\n                        },"""
          if a not in s: raise SystemExit('dialog switch marker missing')
          s=s.replace(a,b,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'WesiOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/org-account-kind-finalize-temp.yml
          git add lib/features/treasury/widgets/accounts_bar.dart
          git commit -m 'fix(org): support reserve and other account kinds'
          git push origin HEAD:agent/org-hierarchy-v1
