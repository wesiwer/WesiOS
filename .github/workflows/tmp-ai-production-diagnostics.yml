name: Temporary Wesi AI Production Diagnostics

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
    paths:
      - .github/workflows/tmp-ai-production-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      RELAY_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
      PUBLIC_HOST: wesi-ai-178-236-247-194.nip.io
    steps:
      - name: Prepare SSH
        env:
          RELAY_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          RELAY_KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          MAIN_KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$RELAY_KEY" > ~/.ssh/relay_key
          printf '%s\n' "$MAIN_KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/relay_key ~/.ssh/main_key
          if [ -n "${RELAY_KNOWN:-}" ]; then printf '%s\n' "$RELAY_KNOWN" > ~/.ssh/relay_known_hosts; else ssh-keyscan -H "$RELAY_HOST" > ~/.ssh/relay_known_hosts 2>/dev/null; fi
          if [ -n "${MAIN_KNOWN:-}" ]; then printf '%s\n' "$MAIN_KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/*known_hosts

      - name: Check public stream edge
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/health -w '%{http_code}' --max-time 15 "https://$PUBLIC_HOST/health" || true)"
          echo "STREAM_HEALTH_HTTP=$code"
          if [ "$code" = 200 ]; then
            python3 - <<'PY'
          import json
          data=json.load(open('/tmp/health'))
          print('STREAM_READY='+str(bool(data.get('ready'))).lower())
          print('STREAMING='+str(bool(data.get('streaming'))).lower())
          PY
          fi
          authcode="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST "https://$PUBLIC_HOST/api/wesi/ai/chat/stream" -H 'Content-Type: application/json' -d '{}' || true)"
          echo "STREAM_PROTECTED_HTTP=$authcode"

      - name: Inspect Main synchronized finance metadata
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          DB=/opt/pocketbase/pb_data/data.db
          test -r "$DB"
          command -v sqlite3 >/dev/null
          echo 'COLLECTION_COUNTS_BEGIN'
          sqlite3 -readonly "$DB" "select coll || '=' || count(*) from wesios_records where deleted=0 and coll in ('organizations','transactions','accounts') group by coll order by coll;"
          echo 'COLLECTION_COUNTS_END'
          echo 'TRANSACTION_ORG_COUNTS_BEGIN'
          sqlite3 -readonly "$DB" "select coalesce(nullif(json_extract(payload,'$.organizationId'),''),'org_wesi_inc') || '=' || count(*) from wesios_records where deleted=0 and coll='transactions' group by coalesce(nullif(json_extract(payload,'$.organizationId'),''),'org_wesi_inc') order by count(*) desc;"
          echo 'TRANSACTION_ORG_COUNTS_END'
          echo 'TRANSACTION_DATE_RANGE_BEGIN'
          sqlite3 -readonly "$DB" "select coalesce(min(json_extract(payload,'$.date')),'none') || ' .. ' || coalesce(max(json_extract(payload,'$.date')),'none') from wesios_records where deleted=0 and coll='transactions';"
          echo 'TRANSACTION_DATE_RANGE_END'
          echo 'RECENT_2M_COUNTS_BEGIN'
          sqlite3 -readonly "$DB" "select coalesce(nullif(json_extract(payload,'$.organizationId'),''),'org_wesi_inc') || '=' || count(*) from wesios_records where deleted=0 and coll='transactions' and datetime(json_extract(payload,'$.date')) >= datetime('2026-06-16T00:00:00Z') and datetime(json_extract(payload,'$.date')) <= datetime('2026-08-16T23:59:59Z') group by coalesce(nullif(json_extract(payload,'$.organizationId'),''),'org_wesi_inc') order by count(*) desc;"
          echo 'RECENT_2M_COUNTS_END'
          echo 'ORG_IDS_BEGIN'
          sqlite3 -readonly "$DB" "select coalesce(json_extract(payload,'$.id'),rid) from wesios_records where deleted=0 and coll='organizations' order by 1;"
          echo 'ORG_IDS_END'
          REMOTE

      - name: Inspect Relay services
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "RELAY_SERVICE=$(systemctl is-active wesi-ai-relay || true)"
          echo "GATEWAY_SERVICE=$(systemctl is-active wesi-ai-stream || true)"
          curl -fsS --max-time 5 http://127.0.0.1:8787/health | python3 -c "import json,sys; d=json.load(sys.stdin); print('RELAY_READY='+str(bool(d.get('ready'))).lower()); print('RELAY_STREAMING='+str(bool(d.get('streaming'))).lower())"
          curl -fsS --max-time 5 http://127.0.0.1:8792/health | python3 -c "import json,sys; d=json.load(sys.stdin); print('GATEWAY_READY='+str(bool(d.get('ready'))).lower())"
          REMOTE
