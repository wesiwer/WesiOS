name: Apply sysadmin console activation patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Apply targeted patch
        run: |
          python3 tools/patch_sysadmin_console_activation.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/team/contacts_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("? '$label\n$attemptText'", "? '$label · $attemptText'")
          p.write_text(s, encoding='utf-8')

          p = Path('test/sysadmin_console_test.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("join('\n');", "join('\\n');")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/team/contacts_screen.dart \
            lib/features/sysadmin/sysadmin_screen.dart \
            lib/features/sysadmin/target_detail_screen.dart \
            lib/features/home/more_tab.dart \
            lib/core/routes/app_router.dart \
            lib/features/sysadmin/console/console_templates.dart \
            lib/features/sysadmin/console/console_command_service.dart \
            lib/features/sysadmin/console/console_screen.dart \
            test/sysadmin_console_test.dart

      - name: Validate patch markers
        run: |
          set -euo pipefail
          grep -q 'Повторить активацию' lib/features/team/contacts_screen.dart
          grep -q 'Duration(seconds: 45)' lib/features/team/contacts_screen.dart
          grep -q 'WesiConsoleScreen.open(context, t.id)' lib/features/sysadmin/target_detail_screen.dart
          ! grep -q "route: '/sysadmin/console'" lib/features/home/more_tab.dart
          grep -q 'targetId: widget.targetId' lib/features/sysadmin/console/console_screen.dart
          grep -q '_scopedArgs' lib/features/sysadmin/console/console_command_service.dart
          grep -q 'resolveCommand' lib/features/sysadmin/console/console_templates.dart
          git diff --check

      - name: Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Console regression tests
        run: flutter test test/sysadmin_console_test.dart

      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/team/contacts_screen.dart \
            lib/features/sysadmin/sysadmin_screen.dart \
            lib/features/sysadmin/target_detail_screen.dart \
            lib/features/home/more_tab.dart \
            lib/core/routes/app_router.dart \
            lib/features/sysadmin/console/console_templates.dart \
            lib/features/sysadmin/console/console_command_service.dart \
            lib/features/sysadmin/console/console_screen.dart \
            test/sysadmin_console_test.dart
          git commit -m 'fix: bind console to selected server and retry activation'
          git push origin HEAD:${{ github.head_ref }}
