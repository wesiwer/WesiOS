name: Apply Telegram Sync Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-telegram-sync-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-telegram-sync-hotfix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-telegram-sync
          fetch-depth: 0

      - name: Apply guarded migration
        run: |
          set -euo pipefail
          python3 scripts/apply_telegram_sync_hotfix.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and validate changed sources
        run: |
          set -euo pipefail
          dart format \
            lib/core/widgets/wesi_telegram_icon.dart \
            lib/features/profile/profile_with_telegram.dart \
            lib/features/profile/telegram_link_screen.dart \
            lib/features/settings/sync_screen.dart
          flutter pub get
          flutter analyze --no-fatal-infos \
            lib/core/widgets/wesi_telegram_icon.dart \
            lib/features/profile/profile_with_telegram.dart \
            lib/features/profile/telegram_link_screen.dart \
            lib/features/settings/sync_screen.dart \
            lib/core/services/telegram_link_service.dart
          node --check server/pb_hooks/wesi_telegram_gateway.js

          grep -q 'resolveBotUsername' server/pb_hooks/wesi_telegram_gateway.js
          grep -q 'telegramApi(cfg, "getMe"' server/pb_hooks/wesi_telegram_gateway.js
          grep -q 'WesiTelegramIcon' lib/features/profile/profile_with_telegram.dart
          grep -q 'WesiTelegramIcon' lib/features/profile/telegram_link_screen.dart
          ! grep -q 'Icons.telegram' lib/features/profile/profile_with_telegram.dart
          ! grep -q 'Icons.telegram' lib/features/profile/telegram_link_screen.dart
          ! grep -q 'PocketBaseTransport' lib/features/settings/sync_screen.dart
          ! grep -q 'TextEditingController' lib/features/settings/sync_screen.dart
          grep -q 'SyncEndpoint.isConnected' lib/features/settings/sync_screen.dart

      - name: Commit hotfix to branch
        run: |
          set -euo pipefail
          rm -f scripts/apply_telegram_sync_hotfix.py
          git config user.name 'wesiwer'
          git config user.email '77644223+wesiwer@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix: repair Telegram linking icon and sync session'
          git push origin HEAD:agent/fix-telegram-sync
