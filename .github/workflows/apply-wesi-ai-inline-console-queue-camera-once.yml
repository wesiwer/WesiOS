name: Apply Wesi AI inline console queue camera fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wesi-ai-inline-console-queue-camera-once.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-wesi-ai-inline-console-queue-camera-once
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'wesiwer/WesiOS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Mark patch run pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Wesi AI UX Patch',
              description: 'Applying and verifying chat UX patch',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Apply Wesi AI patch
        run: python3 .github/scripts/apply_wesi_ai_inline_console_queue_camera.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/ai/ai_assistant_v2_screen.dart \
            lib/features/ai/widgets/wesi_ai_camera_capture.dart \
            lib/features/ai/widgets/wesi_ai_rich_message.dart \
            lib/features/ai/widgets/wesi_ai_code_console.dart

      - name: Analyze Wesi AI
        run: flutter analyze --no-fatal-infos lib/features/ai

      - name: Verify camera frame and aspect contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          screen = Path('lib/features/ai/ai_assistant_v2_screen.dart').read_text(encoding='utf-8')
          camera = Path('lib/features/ai/widgets/wesi_ai_camera_capture.dart').read_text(encoding='utf-8')

          checks = {
              'compact 58% camera dialog': 'size.height * 0.58' in screen,
              'bounded camera dialog height': 'clamp(360.0, 560.0)' in screen,
              'rounded camera frame': 'BorderRadius.circular(24)' in screen and 'clipBehavior: Clip.antiAlias' in screen,
              'uniform aspect-preserving fill': 'FittedBox(' in camera and 'fit: BoxFit.cover' in camera,
              'portrait preview dimensions swapped correctly': 'final width = portrait ? previewSize.height : previewSize.width;' in camera and 'final height = portrait ? previewSize.width : previewSize.height;' in camera,
              'preview clipped to frame': 'ClipRect(' in camera and 'SizedBox.expand(' in camera,
              'real CameraPreview remains source': 'CameraPreview(controller)' in camera,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{'OK' if ok else 'FAIL'}: {name}")
          if failed:
              raise SystemExit('Camera presentation contract failed: ' + ', '.join(failed))
          PY

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/ai/ai_assistant_v2_screen.dart \
            lib/features/ai/widgets/wesi_ai_camera_capture.dart \
            lib/features/ai/widgets/wesi_ai_rich_message.dart \
            lib/features/ai/widgets/wesi_ai_code_console.dart
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "fix(ai): inline code console queue and camera UX"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict with a parallel main update."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during push; retrying ($attempt/3)"
            sleep 3
          done
          echo "Unable to push verified patch after retries."
          exit 1

      - name: Report patch run result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Wesi AI UX Patch',
              description: state === 'success'
                ? 'Chat UX patch applied and camera contract verified'
                : 'Chat UX patch verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
