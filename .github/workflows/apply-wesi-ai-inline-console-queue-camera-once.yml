name: Apply Wesi AI mobile visualizations fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wesi-ai-inline-console-queue-camera-once.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-wesi-ai-mobile-visualizations-once
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'wesiwer/WesiOS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Mark patch run pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Wesi AI Mobile Visuals',
              description: 'Applying responsive tables and charts fix',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Apply responsive visualizations patch
        run: python3 .github/scripts/apply_wesi_ai_inline_console_queue_camera.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Format visualization widget
        run: dart format lib/features/ai/widgets/wesi_ai_visualization.dart

      - name: Analyze visualization widget
        run: flutter analyze --no-fatal-infos lib/features/ai/widgets/wesi_ai_visualization.dart

      - name: Verify mobile visualization contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('lib/features/ai/widgets/wesi_ai_visualization.dart').read_text(encoding='utf-8')
          compact_table = source.split('Widget _buildCompactTable', 1)[1].split('Widget _buildWideTable', 1)[0]

          checks = {
              'responsive width detection': source.count('constraints.maxWidth < _compactBreakpoint') >= 2,
              'phone breakpoint': source.count('static const double _compactBreakpoint = 560;') >= 2,
              'compact table renderer': '_buildCompactTable(theme)' in source,
              'compact table wraps fields': 'Flexible(' in compact_table and 'SelectableText(' in compact_table,
              'no horizontal scrolling in compact table': 'SingleChildScrollView' not in compact_table,
              'desktop table layout preserved': '_buildWideTable() => SingleChildScrollView(' in source and 'DataTable(' in source,
              'adaptive chart height': 'spec.type == WesiAiChartType.pie ? 178.0 : 200.0' in source,
              'compact painter mode': 'required this.compact' in source and 'final bool compact;' in source,
              'adaptive chart labels': '_labelStride(' in source and '_showLabel(' in source,
              'mobile pie legend': '_compactPieLegend(theme, accents)' in source,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(f"{'OK' if ok else 'FAIL'}: {name}")
          if failed:
              raise SystemExit('Mobile visualization contract failed: ' + ', '.join(failed))
          PY

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/ai/widgets/wesi_ai_visualization.dart
          if git diff --cached --quiet; then
            echo "No visualization changes to commit."
            exit 0
          fi
          git commit -m "fix(ai): adapt generated visuals for phone widths"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict with a parallel main update."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during push; retrying ($attempt/3)"
            sleep 3
          done
          echo "Unable to push verified patch after retries."
          exit 1

      - name: Report patch run result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Wesi AI Mobile Visuals',
              description: state === 'success'
                ? 'Responsive mobile tables and charts verified'
                : 'Responsive mobile visualization verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
