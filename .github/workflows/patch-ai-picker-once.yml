name: Patch AI large-file picker once

on:
  push:
    paths:
      - '.github/workflows/patch-ai-picker-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-client-hardening-chunked
          token: ${{ github.token }}
      - name: Switch file picker to path-backed mode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/ai/ai_assistant_v2_screen.dart')
          text = p.read_text(encoding='utf-8')
          old = "allowMultiple: true,\n        withData: true,\n        type: FileType.any,"
          new = "allowMultiple: true,\n        withData: false,\n        type: FileType.any,"
          if old not in text:
              raise SystemExit('expected picker block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/patch-ai-picker-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/ai/ai_assistant_v2_screen.dart .github/workflows/patch-ai-picker-once.yml
          git commit -m 'fix(ai): avoid loading large picked files into memory'
          git push origin HEAD:chatgpt/ai-client-hardening-chunked
