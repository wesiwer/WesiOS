name: Dispatch WesiOS 0.22.18 Release Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-once-0.22.18.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='Исправлен запуск Windows при отсутствующем каталоге Documents: Hive теперь создаёт каталог до открытия локальной базы.' \
            -f deploy_to_server=true
          echo 'RELEASE_0_22_18_93_DISPATCHED'
