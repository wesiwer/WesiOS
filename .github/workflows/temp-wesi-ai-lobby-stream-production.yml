name: Temporary Wesi AI Lobby + Stream Production Hotfix

on:
  push:
    branches:
      - 'fix/wesi-ai-lobby-persona-stream-20260816'
    paths:
      - '.github/workflows/temp-wesi-ai-lobby-stream-production.yml'

permissions:
  contents: read

concurrency:
  group: wesi-ai-production-deploy
  cancel-in-progress: false

jobs:
  hot-deploy-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact Lobby and stream bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_ai_lobby_core.js
          node --check server/pb_hooks/wesi_ai_lobby_router.js
          node --check server/pb_hooks/wesi_ai_lobby_turn.js
          node --check server/pb_hooks/wesi_ai_stream.pb.js
          node --test server/pb_hooks/wesi_ai_lobby_router_test.mjs
          node --test server/pb_hooks/wesi_ai_lobby_turn_test.mjs
          node --test server/pb_hooks/wesi_ai_stream_contract_test.mjs

      - name: Prepare Main SSH
        env:
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          MAIN_KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}"
          test -n "${MAIN_USER:-}"
          test -n "${MAIN_KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$MAIN_KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${MAIN_KNOWN:-}" ]; then
            printf '%s\n' "$MAIN_KNOWN" > ~/.ssh/main_known_hosts
          else
            ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Hot deploy Lobby and current stream hook
        shell: bash
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          REMOTE="/tmp/wesi-ai-lobby-hotfix-$GITHUB_RUN_ID"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp "${SSH[@]}" \
            server/pb_hooks/wesi_ai_lobby.pb.js \
            server/pb_hooks/wesi_ai_lobby_core.js \
            server/pb_hooks/wesi_ai_lobby_router.js \
            server/pb_hooks/wesi_ai_lobby_turn.js \
            server/pb_hooks/wesi_ai_stream.pb.js \
            "$MAIN_USER@$MAIN_HOST:$REMOTE/"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail
          HOOK_DIR=/opt/pocketbase/pb_hooks
          test -d "$HOOK_DIR"
          test -w "$HOOK_DIR"
          for name in \
            wesi_ai_lobby.pb.js \
            wesi_ai_lobby_core.js \
            wesi_ai_lobby_router.js \
            wesi_ai_lobby_turn.js \
            wesi_ai_stream.pb.js; do
            src="$REMOTE/$name"
            dst="$HOOK_DIR/$name"
            test -f "$src"
            [ ! -e "$dst" ] || test -w "$dst"
            cat "$src" > "$dst"
            chmod 0644 "$dst"
            cmp -s "$src" "$dst"
          done
          for _ in $(seq 1 20); do
            curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null
          grep -Fq '["both", "smart"].indexOf(lobbyMode) < 0' "$HOOK_DIR/wesi_ai_stream.pb.js"
          grep -Fq 'WAI_LOBBY_PERSONA_CONFLICT' "$HOOK_DIR/wesi_ai_lobby_turn.js"
          grep -Fq 'handoff: handoffSequence' "$HOOK_DIR/wesi_ai_lobby_router.js"
          rm -rf "$REMOTE"
          echo MAIN_LOBBY_STREAM_HOTFIX_DEPLOYED
          REMOTE

      - name: Verify protected Main endpoints
        shell: bash
        run: |
          set -euo pipefail
          stream_code="$(curl -sS -o /tmp/stream.out -w '%{http_code}' --max-time 15 -X POST https://api.wesi-inc.ru/api/wesi/ai/stream/prepare -H 'Content-Type: application/json' -d '{"persona":"zane","tier":"fast","lobbyMode":"smart","message":"ping"}' || true)"
          lobby_code="$(curl -sS -o /tmp/lobby.out -w '%{http_code}' --max-time 15 -X POST https://api.wesi-inc.ru/api/wesi/ai/lobby -H 'Content-Type: application/json' -d '{"tier":"fast","lobbyMode":"smart","message":"ping"}' || true)"
          case "$stream_code" in 401|403) ;; *) echo "::error::stream prepare protection unexpected HTTP $stream_code"; exit 1 ;; esac
          case "$lobby_code" in 401|403) ;; *) echo "::error::lobby protection unexpected HTTP $lobby_code"; exit 1 ;; esac
          echo "PROTECTED_ENDPOINTS_OK stream=$stream_code lobby=$lobby_code"
