name: Temporary relocate Wesi AI tool tests

on:
  push:
    branches:
      - fix/wesi-ai-tool-agent-handoff
    paths:
      - .github/workflows/temp-relocate-wesi-ai-tool-tests.yml

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
          fetch-depth: 0
      - name: Move tests out of production pb_hooks
        run: |
          set -euo pipefail
          mkdir -p server/wesi-ai-tests
          git mv server/pb_hooks/wesi_ai_tools_contract.test.js server/wesi-ai-tests/tools_contract.test.js
          git mv server/pb_hooks/wesi_ai_mutating_safety.test.js server/wesi-ai-tests/mutating_safety.test.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ('tools_contract.test.js', 'mutating_safety.test.js'):
              p = Path('server/wesi-ai-tests') / name
              s = p.read_text(encoding='utf-8')
              old = "const HOOKS = __dirname;"
              new = "const HOOKS = path.resolve(__dirname, '../pb_hooks');"
              if old not in s:
                  raise SystemExit(f'HOOKS anchor missing in {name}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          p = Path('.github/workflows/pr-check.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('server/pb_hooks/wesi_ai_tools_contract.test.js', 'server/wesi-ai-tests/tools_contract.test.js')
          s = s.replace('server/pb_hooks/wesi_ai_mutating_safety.test.js', 'server/wesi-ai-tests/mutating_safety.test.js')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify relocated tool audit
        run: |
          node --check server/wesi-ai-tests/tools_contract.test.js
          node --check server/wesi-ai-tests/mutating_safety.test.js
          node --test server/wesi-ai-tests/tools_contract.test.js server/wesi-ai-tests/mutating_safety.test.js
          test -z "$(find server/pb_hooks -maxdepth 1 -name 'wesi_ai_*.test.js' -print -quit)"
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-relocate-wesi-ai-tool-tests.yml
          git add .github/workflows/pr-check.yml server/wesi-ai-tests server/pb_hooks
          git commit -m "test(ai): keep tool audits out of production hooks"
          git push origin HEAD:fix/wesi-ai-tool-agent-handoff
