name: Finish WesiOS unfinished features

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'feat/finish-unfinished-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Apply Home mobile regression fix
        run: |
          set -euo pipefail
          if grep -q 'home_clock_panel' lib/features/home/home_screen.dart; then
            echo 'Home base fix already present.'
          else
            git fetch origin agent/fix-full-home-mobile --depth=1
            git show origin/agent/fix-full-home-mobile:tools/fix_full_home_mobile.py > /tmp/fix_full_home_mobile.py
            python3 /tmp/fix_full_home_mobile.py
          fi
          git fetch origin main --depth=1
          git show origin/main:tools/finish_home_mobile_header.py > /tmp/finish_home_mobile_header.py
          git show origin/main:tools/fix_home_glasscard_rows.py > /tmp/fix_home_glasscard_rows.py
          python3 /tmp/finish_home_mobile_header.py
          python3 /tmp/fix_home_glasscard_rows.py

      - name: Apply Audio Vault quick actions and mobile layout
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:tools/finish_audio_quick_actions.py > /tmp/finish_audio_quick_actions.py
          git show origin/main:tools/fix_audio_quick_actions_null.py > /tmp/fix_audio_quick_actions_null.py
          git show origin/main:tools/fix_audio_vault_mobile_grid.py > /tmp/fix_audio_vault_mobile_grid.py
          python3 /tmp/finish_audio_quick_actions.py
          python3 /tmp/fix_audio_quick_actions_null.py
          python3 /tmp/fix_audio_vault_mobile_grid.py

      - name: Normalize generated mobile test imports
        run: |
          sed -i "/quote_mind_charge.dart/d;/wesi_quote_card.dart/d" test/home_mobile_layout_test.dart

      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/widgets/wesi_avatar.dart \
            lib/core/widgets/wesi_clock.dart \
            lib/core/widgets/app_update_card.dart \
            lib/features/home/home_screen.dart \
            lib/features/home/widgets/home_agenda.dart \
            lib/features/audio/audio_vault_v2_screen.dart \
            test/home_mobile_layout_test.dart

      - name: Static guards
        run: |
          set -euo pipefail
          grep -q 'Hive.isBoxOpen(_box)' lib/core/widgets/wesi_avatar.dart
          grep -q 'height: large ? 168 : 116' lib/core/widgets/wesi_clock.dart
          grep -q 'home_clock_panel' lib/features/home/home_screen.dart
          grep -q 'home_balance_card' lib/features/home/home_screen.dart
          grep -q 'compactHeader' lib/features/home/home_screen.dart
          grep -q 'showText: !compactHeader' lib/features/home/home_screen.dart
          grep -q 'homeAgendaCompactAction' lib/features/home/widgets/home_agenda.dart
          grep -q 'updateActionWrap' lib/core/widgets/app_update_card.dart
          grep -q '_quickAudioActions(BeatEntry beat)' lib/features/audio/audio_vault_v2_screen.dart
          grep -q '_analyzePendingBeats' lib/features/audio/audio_vault_v2_screen.dart
          grep -q '_openAbletonQuick' lib/features/audio/audio_vault_v2_screen.dart
          grep -q 'File(abletonPath).existsSync()' lib/features/audio/audio_vault_v2_screen.dart
          grep -q 'audioVaultSingleColumnMobile' lib/features/audio/audio_vault_v2_screen.dart
          grep -q 'audioVaultFooterWrap' lib/features/audio/audio_vault_v2_screen.dart
          ! grep -q 'quote_mind_charge.dart' test/home_mobile_layout_test.dart
          ! grep -q 'wesi_quote_card.dart' test/home_mobile_layout_test.dart
          git diff --check

      - run: flutter pub get

      - name: Targeted tests
        run: |
          flutter test test/home_mobile_layout_test.dart
          flutter test test/audio_analysis_v2_model_test.dart test/audio_analysis_v2_service_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Full test suite
        run: flutter test

      - name: Commit product changes to feature branch
        run: |
          set -euo pipefail
          rm -f .github/finish-unfinished.marker
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/core/widgets/wesi_avatar.dart \
            lib/core/widgets/wesi_clock.dart \
            lib/core/widgets/app_update_card.dart \
            lib/features/home/home_screen.dart \
            lib/features/home/widgets/home_agenda.dart \
            lib/features/audio/audio_vault_v2_screen.dart \
            test/home_mobile_layout_test.dart
          git add -u .github/finish-unfinished.marker || true
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'feat: finish Home mobile and Audio Vault quick actions'
          git push origin HEAD:${{ github.head_ref }}
