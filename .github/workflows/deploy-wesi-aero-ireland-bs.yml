name: Deploy Wesi Aero Ireland BS

on:
  workflow_dispatch:
    inputs:
      reality_profile:
        description: 'REALITY target profile: auto, wikipedia, microsoft, yahoo, custom'
        required: true
        default: 'auto'
        type: choice
        options: [auto, wikipedia, microsoft, yahoo, custom]
      reality_server_name:
        description: 'Custom REALITY SNI (only for custom profile)'
        required: false
        default: ''
        type: string
      reality_target:
        description: 'Custom REALITY target host:port (only for custom profile)'
        required: false
        default: ''
        type: string
  push:
    branches: [codex/wesi-aero-build-20260821]
    paths:
      - 'WesiAero/server-deploy/ireland-bs/**'
      - 'WesiAero/server-deploy/reality-targets.json'
      - 'WesiAero/server-deploy/select-reality-target.sh'
      - 'WesiAero/route-server/**'
      - 'WesiAero/node-agent/**'
      - '.github/workflows/deploy-wesi-aero-ireland-bs.yml'

permissions:
  contents: read

concurrency:
  group: wesi-aero-ireland-bs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELAY_SSH_HOST: ${{ secrets.WESI_RELAY_SSH_HOST || '178.236.247.194' }}
      RELAY_SSH_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
      PUBLIC_HOST: '178.236.247.194'
      REALITY_PROFILE: ${{ inputs.reality_profile || 'auto' }}
      CUSTOM_SERVER_NAME: ${{ inputs.reality_server_name || '' }}
      CUSTOM_TARGET: ${{ inputs.reality_target || '' }}
      ROUTE_TOKEN: ${{ secrets.WESI_AERO_ROUTE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate deployment bundle
        run: |
          set -euo pipefail
          bash -n WesiAero/server-deploy/ireland-bs/deploy.sh
          bash -n WesiAero/server-deploy/select-reality-target.sh
          bash -n WesiAero/route-server/deploy.sh
          bash -n WesiAero/node-agent/deploy.sh
          node --check WesiAero/route-server/src/index.mjs
          node --check WesiAero/route-server/src/route-core.mjs
          node --check WesiAero/route-server/src/auto-route.mjs
          node --check WesiAero/node-agent/src/index.mjs
          node --test WesiAero/route-server/test/*.test.mjs
          python3 -m json.tool WesiAero/server-deploy/reality-targets.json >/dev/null
          python3 -m json.tool WesiAero/route-server/config.example.json >/dev/null
          [ -n "${RELAY_SSH_USER:-}" ] || { echo '::error::WESI_RELAY_SSH_USER is missing'; exit 1; }
          case "$REALITY_PROFILE" in auto|wikipedia|microsoft|yahoo|custom) ;; *) echo '::error::invalid reality profile'; exit 1;; esac
          if [ "$REALITY_PROFILE" = custom ]; then
            [ -n "$CUSTOM_SERVER_NAME" ] && [ -n "$CUSTOM_TARGET" ] || {
              echo '::error::custom profile requires reality_server_name and reality_target'; exit 1;
            }
          fi

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "${KEY:-}" ] || { echo '::error::WESI_RELAY_SSH_KEY is missing'; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/relay_key
          chmod 600 ~/.ssh/relay_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/relay_known_hosts
          else
            ssh-keyscan -H "$RELAY_SSH_HOST" > ~/.ssh/relay_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/relay_known_hosts

      - name: Verify Wesi AI ports before Aero deployment
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ss -ltn | grep -q ':443 ' || { echo 'Wesi AI HTTPS 443 is unexpectedly not listening' >&2; exit 1; }
          ss -ltn | grep -q ':8787 ' || { echo 'Wesi AI relay 8787 is unexpectedly not listening' >&2; exit 1; }
          echo 'Existing Wesi AI listeners verified; Aero uses TCP/8443 and loopback/8793.'
          REMOTE

      - name: Upload Ireland BS routing stack
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          REMOTE="/tmp/wesi-aero-ireland-bs-$GITHUB_RUN_ID"
          echo "REMOTE=$REMOTE" >> "$GITHUB_ENV"
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE/ireland' '$REMOTE/route-server/src' '$REMOTE/route-server/test' '$REMOTE/node-agent/src'"
          scp "${SSH[@]}" WesiAero/server-deploy/ireland-bs/deploy.sh WesiAero/server-deploy/select-reality-target.sh WesiAero/server-deploy/reality-targets.json "$RELAY_SSH_USER@$RELAY_SSH_HOST:$REMOTE/ireland/"
          scp "${SSH[@]}" WesiAero/route-server/deploy.sh WesiAero/route-server/package.json WesiAero/route-server/config.example.json "$RELAY_SSH_USER@$RELAY_SSH_HOST:$REMOTE/route-server/"
          scp "${SSH[@]}" WesiAero/route-server/src/*.mjs "$RELAY_SSH_USER@$RELAY_SSH_HOST:$REMOTE/route-server/src/"
          scp "${SSH[@]}" WesiAero/route-server/test/*.mjs "$RELAY_SSH_USER@$RELAY_SSH_HOST:$REMOTE/route-server/test/"
          scp "${SSH[@]}" WesiAero/node-agent/deploy.sh WesiAero/node-agent/package.json "$RELAY_SSH_USER@$RELAY_SSH_HOST:$REMOTE/node-agent/"
          scp "${SSH[@]}" WesiAero/node-agent/src/*.mjs "$RELAY_SSH_USER@$RELAY_SSH_HOST:$REMOTE/node-agent/src/"

      - name: Select REALITY target on the actual VPS
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          SELECTOR="$REMOTE/ireland/select-reality-target.sh"
          TARGETS="$REMOTE/ireland/reality-targets.json"
          if [ "$REALITY_PROFILE" = custom ]; then
            RESULT="$(ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "WESI_AERO_REALITY_SERVER_NAME='$CUSTOM_SERVER_NAME' WESI_AERO_REALITY_TARGET='$CUSTOM_TARGET' bash '$SELECTOR' custom '$TARGETS'")"
          else
            RESULT="$(ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "bash '$SELECTOR' '$REALITY_PROFILE' '$TARGETS'")"
          fi
          SERVER_NAME="$(printf '%s\n' "$RESULT" | sed -n 's/^SERVER_NAME=//p' | tail -n1)"
          TARGET="$(printf '%s\n' "$RESULT" | sed -n 's/^TARGET=//p' | tail -n1)"
          [ -n "$SERVER_NAME" ] && [ -n "$TARGET" ] || { echo '::error::target selector returned incomplete result'; exit 1; }
          echo "Selected REALITY target: $SERVER_NAME -> $TARGET"
          echo "REALITY_SERVER_NAME=$SERVER_NAME" >> "$GITHUB_ENV"
          echo "REALITY_TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Install Route Server
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "cd '$REMOTE/route-server' && WESI_AERO_ROUTE_SERVER_TOKEN='$ROUTE_TOKEN' WESI_AERO_ROUTE_REPLACE_CONFIG=true bash deploy.sh"

      - name: Install Ireland BS
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "WESI_AERO_REALITY_PORT=8443 WESI_AERO_REALITY_SERVER_NAME='$REALITY_SERVER_NAME' WESI_AERO_REALITY_TARGET='$REALITY_TARGET' WESI_AERO_PUBLIC_HOST='$PUBLIC_HOST' bash '$REMOTE/ireland/deploy.sh'"

      - name: Install Ireland Node Agent
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "cd '$REMOTE/node-agent' && WESI_AERO_ROUTE_SERVER_URL='http://127.0.0.1:8793' WESI_AERO_ROUTE_SERVER_TOKEN='$ROUTE_TOKEN' bash deploy.sh"

      - name: Verify complete Ireland routing stack
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          "${SUDO[@]}" systemctl is-active --quiet wesi-aero-route-server
          "${SUDO[@]}" systemctl is-active --quiet wesi-aero-ireland-bs
          "${SUDO[@]}" systemctl is-active --quiet wesi-aero-node-agent-ireland-bs
          curl -fsS http://127.0.0.1:8793/healthz
          "${SUDO[@]}" ss -ltnp | grep -E ':8443\b'
          "${SUDO[@]}" test -s /etc/wesi-aero/ireland-bs/client-uri.txt
          echo 'Ireland BS + Route Server + Node Agent are active; Wesi AI ports were not changed.'
          REMOTE
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "rm -rf '$REMOTE'"
