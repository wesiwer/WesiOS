name: Temporary patch rootless streaming
on:
  push:
    branches:
      - agent/wesi-ai-finish-unfinished-20260816
    paths:
      - .github/workflows/temp-patch-rootless-streaming.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-finish-unfinished-20260816
          fetch-depth: 0
      - name: Patch client and Relay nginx
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          api = Path('lib/features/ai/wesi_ai_api.dart')
          s = api.read_text()
          marker = '  static const int maxTransportHistoryMessages = 80;\n'
          addition = marker + "  static const String streamBaseUrl = String.fromEnvironment(\n    'WESI_AI_STREAM_BASE_URL',\n    defaultValue: 'https://wesi-ai-178-236-247-194.nip.io',\n  );\n"
          if 'static const String streamBaseUrl' not in s:
              if marker not in s: raise SystemExit('api marker missing')
              s = s.replace(marker, addition, 1)
          old = "      if (conversation.persona != WesiAiPersona.lobby) {\n        final streamed = await _sendStream(\n          base: base,\n          auth: auth,\n          body: body,\n          onDelta: onDelta,\n          onActivity: onActivity,\n          cancellation: cancellation,\n        );\n        if (streamed != null) return streamed;\n      }"
          new = "      if (conversation.persona != WesiAiPersona.lobby) {\n        try {\n          final streamed = await _sendStream(\n            base: base,\n            auth: auth,\n            body: body,\n            onDelta: onDelta,\n            onActivity: onActivity,\n            cancellation: cancellation,\n          );\n          if (streamed != null) return streamed;\n        } on SocketException {\n          // Streaming is an optimization. If its dedicated edge is unavailable,\n          // continue through the ordinary authenticated Main chat endpoint.\n        } on HttpException {\n        } on TimeoutException {\n        }\n      }"
          if old in s:
              s = s.replace(old, new, 1)
          elif 'Streaming is an optimization.' not in s:
              raise SystemExit('send stream block missing')
          old_uri = "    final uri = base.replace(path: '/api/wesi/ai/chat/stream');"
          new_uri = "    final configuredStreamBase = streamBaseUrl.trim();\n    final streamBase = configuredStreamBase.isEmpty\n        ? base\n        : Uri.parse(configuredStreamBase);\n    final uri = streamBase.replace(path: '/api/wesi/ai/chat/stream');"
          if old_uri in s:
              s = s.replace(old_uri, new_uri, 1)
          elif 'configuredStreamBase' not in s:
              raise SystemExit('stream uri marker missing')
          api.write_text(s)

          nginx = Path('server/wesi-ai-relay/nginx-relay.conf')
          n = nginx.read_text()
          anchor = '''    location = /v1/wesi-ai {\n        proxy_pass http://127.0.0.1:8787;'''
          if 'location = /v1/wesi-ai-stream {' not in n:
              block = '''    location = /v1/wesi-ai-stream {\n        proxy_pass http://127.0.0.1:8787;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_pass_request_headers on;\n        proxy_buffering off;\n        proxy_cache off;\n        gzip off;\n        proxy_read_timeout 420s;\n        proxy_send_timeout 120s;\n        client_max_body_size 32m;\n        add_header X-Accel-Buffering no always;\n    }\n\n    location = /api/wesi/ai/chat/stream {\n        proxy_pass http://127.0.0.1:8792/api/wesi/ai/chat/stream;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header Authorization $http_authorization;\n        proxy_set_header X-WesiOS-Session $http_x_wesios_session;\n        proxy_buffering off;\n        proxy_cache off;\n        gzip off;\n        proxy_read_timeout 420s;\n        proxy_send_timeout 120s;\n        client_max_body_size 32m;\n        add_header X-Accel-Buffering no always;\n    }\n\n'''
              pos = n.find(anchor)
              if pos < 0: raise SystemExit('nginx anchor missing')
              n = n[:pos] + block + n[pos:]
          nginx.write_text(n)
          PY
          git diff --check
      - name: Commit code patch
        run: |
          set -euo pipefail
          git config user.name wesiwer
          git config user.email 77644223+wesiwer@users.noreply.github.com
          git add lib/features/ai/wesi_ai_api.dart server/wesi-ai-relay/nginx-relay.conf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(ai): route streaming through Relay edge'
          git push origin HEAD:agent/wesi-ai-finish-unfinished-20260816
