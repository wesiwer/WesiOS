name: Temporary patch rootless streaming
on:
  push:
    branches:
      - agent/wesi-ai-finish-unfinished-20260816
    paths:
      - .github/workflows/temp-patch-rootless-streaming.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-finish-unfinished-20260816
          fetch-depth: 0
      - name: Patch Relay-hosted streaming topology
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          api = Path('lib/features/ai/wesi_ai_api.dart')
          s = api.read_text()
          marker = '  static const int maxTransportHistoryMessages = 80;\n'
          addition = marker + "  static const String streamBaseUrl = String.fromEnvironment(\n    'WESI_AI_STREAM_BASE_URL',\n    defaultValue: 'https://wesi-ai-178-236-247-194.nip.io',\n  );\n"
          if 'static const String streamBaseUrl' not in s:
              if marker not in s: raise SystemExit('api marker missing')
              s = s.replace(marker, addition, 1)
          old = "      if (conversation.persona != WesiAiPersona.lobby) {\n        final streamed = await _sendStream(\n          base: base,\n          auth: auth,\n          body: body,\n          onDelta: onDelta,\n          onActivity: onActivity,\n          cancellation: cancellation,\n        );\n        if (streamed != null) return streamed;\n      }"
          new = "      if (conversation.persona != WesiAiPersona.lobby) {\n        try {\n          final streamed = await _sendStream(\n            base: base,\n            auth: auth,\n            body: body,\n            onDelta: onDelta,\n            onActivity: onActivity,\n            cancellation: cancellation,\n          );\n          if (streamed != null) return streamed;\n        } on SocketException {\n          // Streaming is an optimization. If its dedicated edge is unavailable,\n          // continue through the ordinary authenticated Main chat endpoint.\n        } on HttpException {\n        } on TimeoutException {\n        }\n      }"
          if old in s:
              s = s.replace(old, new, 1)
          elif 'Streaming is an optimization.' not in s:
              raise SystemExit('send stream block missing')
          old_uri = "    final uri = base.replace(path: '/api/wesi/ai/chat/stream');"
          new_uri = "    final configuredStreamBase = streamBaseUrl.trim();\n    final streamBase = configuredStreamBase.isEmpty\n        ? base\n        : Uri.parse(configuredStreamBase);\n    final uri = streamBase.replace(path: '/api/wesi/ai/chat/stream');"
          if old_uri in s:
              s = s.replace(old_uri, new_uri, 1)
          elif 'configuredStreamBase' not in s:
              raise SystemExit('stream uri marker missing')
          api.write_text(s)

          nginx = Path('server/wesi-ai-relay/nginx-relay.conf')
          n = nginx.read_text()
          anchor = '''    location = /v1/wesi-ai {\n        proxy_pass http://127.0.0.1:8787;'''
          if 'location = /v1/wesi-ai-stream {' not in n:
              block = '''    location = /v1/wesi-ai-stream {\n        proxy_pass http://127.0.0.1:8787;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_pass_request_headers on;\n        proxy_buffering off;\n        proxy_cache off;\n        gzip off;\n        proxy_read_timeout 420s;\n        proxy_send_timeout 120s;\n        client_max_body_size 32m;\n        add_header X-Accel-Buffering no always;\n    }\n\n    location = /api/wesi/ai/chat/stream {\n        proxy_pass http://127.0.0.1:8792/api/wesi/ai/chat/stream;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header Authorization $http_authorization;\n        proxy_set_header X-WesiOS-Session $http_x_wesios_session;\n        proxy_buffering off;\n        proxy_cache off;\n        gzip off;\n        proxy_read_timeout 420s;\n        proxy_send_timeout 120s;\n        client_max_body_size 32m;\n        add_header X-Accel-Buffering no always;\n    }\n\n'''
              pos = n.find(anchor)
              if pos < 0: raise SystemExit('nginx anchor missing')
              n = n[:pos] + block + n[pos:]
          nginx.write_text(n)

          wf = Path('.github/workflows/deploy-wesi-ai-streaming.yml')
          w = wf.read_text()
          w = w.replace("'WESI_POCKETBASE_URL_B64': 'http://127.0.0.1:8090',", "'WESI_POCKETBASE_URL_B64': 'https://api.wesi-inc.ru',")
          # Replace the privileged Main gateway deployment with: Relay gateway + unprivileged Main hot deploy.
          start = w.find('      - name: Deploy Main hooks and stream gateway\n')
          end = w.find('      - name: Verify protected streaming route\n', start)
          if start < 0 or end < 0: raise SystemExit('deploy workflow block missing')
          replacement = '''      - name: Deploy stream gateway beside Foreign Relay\n        run: |\n          set -euo pipefail\n          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")\n          REMOTE="/tmp/wesi-ai-gateway-relay-$GITHUB_RUN_ID"\n          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"\n          scp "${SSH[@]}" -r server/wesi-ai-stream "$RELAY_SSH_USER@$RELAY_SSH_HOST:$REMOTE/"\n          scp "${SSH[@]}" stream-secrets.b64 "$RELAY_SSH_USER@$RELAY_SSH_HOST:$REMOTE/"\n          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'\n          set -euo pipefail\n          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi\n          "${SUDO[@]}" bash "$REMOTE/wesi-ai-stream/deploy-stream-gateway.sh" "$REMOTE/wesi-ai-stream" "$REMOTE/stream-secrets.b64"\n          curl -fsS --max-time 10 http://127.0.0.1:8792/health\n          REMOTE\n          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" "rm -rf '$REMOTE'" || true\n\n      - name: Hot deploy Main hooks and relay config without sudo\n        run: |\n          set -euo pipefail\n          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")\n          REMOTE="/tmp/wesi-ai-stream-main-$GITHUB_RUN_ID"\n          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"\n          scp "${SSH[@]}" \\\n            server/pb_hooks/wesi_ai_*.js \\\n            server/pb_hooks/wesi_ai_*.pb.js \\\n            server/pb_hooks/.wesi-ai-personas.json \\\n            wesi-ai-relay.json \\\n            "$MAIN_USER@$MAIN_HOST:$REMOTE/"\n          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'\n          set -euo pipefail\n          HOOK_DIR=/opt/pocketbase/pb_hooks\n          test -d "$HOOK_DIR"\n          test -w "$HOOK_DIR"\n          install_hot() {\n            src="$1"; dst="$2"\n            if [ -e "$dst" ]; then test -w "$dst"; fi\n            cat "$src" > "$dst"\n          }\n          for src in "$REMOTE"/wesi_ai_*.js "$REMOTE"/wesi_ai_*.pb.js; do\n            [ -f "$src" ] || continue\n            install_hot "$src" "$HOOK_DIR/$(basename "$src")"\n            chmod 0644 "$HOOK_DIR/$(basename "$src")"\n          done\n          install_hot "$REMOTE/.wesi-ai-personas.json" "$HOOK_DIR/.wesi-ai-personas.json"\n          install_hot "$REMOTE/wesi-ai-relay.json" "$HOOK_DIR/.wesi-ai-relay.json"\n          chmod 0600 "$HOOK_DIR/.wesi-ai-personas.json" "$HOOK_DIR/.wesi-ai-relay.json"\n          for _ in $(seq 1 20); do\n            curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null && break\n            sleep 1\n          done\n          curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null\n          cmp -s "$REMOTE/wesi_ai_stream.pb.js" "$HOOK_DIR/wesi_ai_stream.pb.js"\n          cmp -s "$REMOTE/wesi-ai-relay.json" "$HOOK_DIR/.wesi-ai-relay.json"\n          REMOTE\n          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "rm -rf '$REMOTE'" || true\n\n'''
          w = w[:start] + replacement + w[end:]
          w = w.replace("-X POST https://api.wesi-inc.ru/api/wesi/ai/chat/stream", "-X POST https://$PUBLIC_HOST/api/wesi/ai/chat/stream")
          wf.write_text(w)
          PY
          dart format lib/features/ai/wesi_ai_api.dart || true
          git diff --check
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name wesiwer
          git config user.email 77644223+wesiwer@users.noreply.github.com
          git add lib/features/ai/wesi_ai_api.dart server/wesi-ai-relay/nginx-relay.conf .github/workflows/deploy-wesi-ai-streaming.yml
          git commit -m 'fix(ai): deploy streaming gateway on Relay without Main root'
          git push origin HEAD:agent/wesi-ai-finish-unfinished-20260816
