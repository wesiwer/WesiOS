name: Precision-clean Wesi AI Stage 2 client diff

on:
  push:
    branches:
      - agent/wesi-ai-stage2-streaming

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[stage2-precision-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and minimally patch two client files
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- lib/features/ai/wesi_ai_lobby_api.dart lib/features/ai/widgets/wesi_ai_message_content.dart
          python3 - <<'PY'
          from pathlib import Path

          p=Path('lib/features/ai/wesi_ai_lobby_api.dart')
          s=p.read_text(encoding='utf-8')
          old='''    WesiAiProject? project,\n    List<WesiAiAttachment> attachments = const <WesiAiAttachment>[],\n  }) async {'''
          new='''    WesiAiProject? project,\n    List<WesiAiAttachment> attachments = const <WesiAiAttachment>[],\n    void Function(String delta)? onDelta,\n    WesiAiRequestCancellation? cancellation,\n  }) async {'''
          if old not in s: raise SystemExit('lobby signature anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('''        project: project,\n        attachments: attachments,\n      );''','''        project: project,\n        attachments: attachments,\n        onDelta: onDelta,\n        cancellation: cancellation,\n      );''',2)
          p.write_text(s,encoding='utf-8')

          p=Path('lib/features/ai/widgets/wesi_ai_message_content.dart')
          s=p.read_text(encoding='utf-8')
          old='            animate: animateText && assistant,'
          new="""            animate: animateText &&\n                assistant &&\n                message.metadata['transportStreaming'] != true &&\n                message.metadata['transportStreamed'] != true,"""
          if old not in s: raise SystemExit('message animate anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit precision cleanup
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/ai/wesi_ai_lobby_api.dart lib/features/ai/widgets/wesi_ai_message_content.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(ai): minimize stage 2 client diff [stage2-precision-cleanup]'
          git push origin HEAD:agent/wesi-ai-stage2-streaming
