name: Prepare verified 0.19.23 organization UX release

on:
  push:
    branches:
      - chatgpt/release-01923-org-ux

permissions:
  contents: write
  actions: write

concurrency:
  group: prepare-release-01923-org-ux
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/release-01923-org-ux
          fetch-depth: 0

      - name: Fetch completed organization UX
        run: git fetch origin chatgpt/org-access-contacts-ux-20260812

      - name: Apply only organization UX product files
        run: |
          git checkout origin/chatgpt/org-access-contacts-ux-20260812 -- \
            lib/features/organizations/widgets/organization_access_editor.dart \
            lib/features/organizations/organizations_screen.dart \
            lib/features/team/contacts_screen.dart \
            test/organization_ui_contract_test.dart

      - name: Bump application version to 0.19.23+71
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text(encoding='utf-8')
          import re
          s, n = re.subn(r'(?m)^version:\s*[^\n]+$', 'version: 0.19.23+71', s, count=1)
          assert n == 1
          p.write_text(s, encoding='utf-8')

          p = Path('lib/core/constants/app_version.dart')
          s = p.read_text(encoding='utf-8')
          s, n1 = re.subn(r"static const String number = '[^']+';", "static const String number = '0.19.23';", s, count=1)
          s, n2 = re.subn(r'static const int build = \d+;', 'static const int build = 71;', s, count=1)
          assert n1 == 1 and n2 == 1
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/constants/app_version.dart \
            lib/features/organizations/widgets/organization_access_editor.dart \
            lib/features/organizations/organizations_screen.dart \
            lib/features/team/contacts_screen.dart \
            test/organization_ui_contract_test.dart

      - name: Verify version consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^version: 0.19.23+71$' pubspec.yaml
          grep -q "number = '0.19.23'" lib/core/constants/app_version.dart
          grep -q 'build = 71' lib/core/constants/app_version.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Full test suite
        run: flutter test

      - name: Commit verified release source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-release-01923-once.yml
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'release: WesiOS 0.19.23+71 with organization access UX'
          git push origin HEAD:chatgpt/release-01923-org-ux

      - name: Start signed production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref chatgpt/release-01923-org-ux \
            -f notes='Удобные права организаций: русский интерфейс, быстрые пресеты, настройка доступа из Контактов, фильтры по организациям и должностям.' \
            -f deploy_to_server=false
