name: Stage14 E2E Patch

on:
  push:
    branches: [agent/wesi-ai-stage14-media-e2e]
    paths:
      - '.github/workflows/stage14-e2e-patch.yml'

permissions:
  contents: write

jobs:
  patch-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Route local media through Stage14 workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/ai/controllers/wesi_ai_chat_controller.dart')
          text = path.read_text()
          old_import = "import '../media_engines/wesi_media_engine_runner.dart';"
          new_import = "import '../media_engines/wesi_media_workflow.dart';"
          old_call = 'final result = await WesiMediaEngineRunner.run(request);'
          new_call = 'final result = await WesiMediaWorkflow.runLocalRequest(request);'
          if old_import not in text:
              raise SystemExit('runner import marker not found')
          if old_call not in text:
              raise SystemExit('runner call marker not found')
          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_call, new_call, 1)
          path.write_text(text)
          PY
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage14-bot'
          git config user.email 'wesi-ai-stage14-bot@users.noreply.github.com'
          git add lib/features/ai/controllers/wesi_ai_chat_controller.dart
          git diff --cached --check
          git commit -m 'feat(ai): route local media through Stage14 workflow'
          git push origin HEAD:agent/wesi-ai-stage14-media-e2e
