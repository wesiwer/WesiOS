name: Deploy Wesi Telegram

on:
  push:
    branches: [main]
    paths:
      - 'server/pb_hooks/wesi_telegram*.js'
      - 'server/pb_hooks/wesi_ai_finance_tools.js'
      - 'server/pb_hooks/wesi_ai_task_tools.js'
      - 'scripts/generate_wesi_telegram_visuals.py'
      - '.github/workflows/deploy-wesi-telegram.yml'
  workflow_dispatch:
    inputs:
      bot_username:
        description: 'Telegram bot username without @'
        required: true
        default: 'WesiOSBot'
        type: string
      public_base_url:
        description: 'Main Wesi server public URL'
        required: true
        default: 'https://api.wesi-inc.ru'
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: wesi-telegram-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
      BOT_USERNAME: ${{ inputs.bot_username || 'WesiOSBot' }}
      PUBLIC_BASE_URL: ${{ inputs.public_base_url || 'https://api.wesi-inc.ru' }}
      BOT_DISPLAY_NAME: 'WesiOS: BUSINESS OPERATING SYSTEM'

    steps:
      - uses: actions/checkout@v4

      - name: Validate sources and configuration
        env:
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          BOT_TOKEN_PRIMARY: ${{ secrets.WESI_TELEGRAM_BOT_TOKEN }}
          BOT_TOKEN_LEGACY: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET_INPUT: ${{ secrets.WESI_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}"
          test -n "${MAIN_USER:-}"
          test -n "${MAIN_KEY:-}"
          BOT_TOKEN="${BOT_TOKEN_PRIMARY:-${BOT_TOKEN_LEGACY:-}}"
          if [ -z "$BOT_TOKEN" ]; then
            echo '::error::Set WESI_TELEGRAM_BOT_TOKEN (preferred) or TELEGRAM_BOT_TOKEN in Actions secrets.'
            exit 1
          fi
          if ! [[ "$BOT_USERNAME" =~ ^[A-Za-z0-9_]{5,32}$ ]]; then
            echo '::error::bot_username must be a Telegram username without @'
            exit 1
          fi
          if ! [[ "$PUBLIC_BASE_URL" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            echo '::error::public_base_url must be an https origin without path'
            exit 1
          fi

          for file in \
            server/pb_hooks/wesi_telegram_lib.js \
            server/pb_hooks/wesi_telegram_store.js \
            server/pb_hooks/wesi_telegram_gateway.js \
            server/pb_hooks/wesi_telegram_experience.js \
            server/pb_hooks/wesi_telegram_interactions.js \
            server/pb_hooks/wesi_telegram.pb.js \
            server/pb_hooks/wesi_ai_finance_tools.js \
            server/pb_hooks/wesi_ai_task_tools.js; do
            node --check "$file"
          done
          node server/pb_hooks/wesi_telegram_lib_test.mjs

          WEBHOOK_SECRET="${WEBHOOK_SECRET_INPUT:-}"
          if [ -z "$WEBHOOK_SECRET" ]; then
            WEBHOOK_SECRET="$(python3 -c 'import hashlib,sys; print(hashlib.sha256(("wesios-telegram-webhook-v1:"+sys.argv[1]).encode()).hexdigest())' "$BOT_TOKEN")"
          fi
          if ! [[ "$WEBHOOK_SECRET" =~ ^[A-Za-z0-9_-]{24,256}$ ]]; then
            echo '::error::WESI_TELEGRAM_WEBHOOK_SECRET must be 24-256 chars [A-Za-z0-9_-].'
            exit 1
          fi

          umask 077
          BOT_TOKEN="$BOT_TOKEN" WEBHOOK_SECRET="$WEBHOOK_SECRET" python3 - <<'PY'
          import json, os
          with open('wesi-telegram.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'botToken': os.environ['BOT_TOKEN'],
                  'webhookSecret': os.environ['WEBHOOK_SECRET'],
                  'botUsername': os.environ['BOT_USERNAME'],
                  'publicBaseUrl': os.environ['PUBLIC_BASE_URL'].rstrip('/'),
              }, f)
          PY
          echo "BOT_TOKEN=$BOT_TOKEN" >> "$GITHUB_ENV"
          echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"
          chmod 600 wesi-telegram.json

      - name: Generate WesiOS Telegram visuals
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow>=11.0,<13.0'
          python3 scripts/generate_wesi_telegram_visuals.py
          for kind in brief cash risk today overdue push farewell; do
            test -s "build/wesi_telegram_visuals/$kind.jpg"
          done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('build/wesi_telegram_visuals').glob('*.jpg'):
              data = path.read_bytes()
              assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9', path
          print('WESI_TELEGRAM_VISUALS_OK')
          PY

      - name: Prepare SSH
        env:
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          MAIN_KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$MAIN_KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${MAIN_KNOWN:-}" ]; then
            printf '%s\n' "$MAIN_KNOWN" > ~/.ssh/main_known_hosts
          else
            ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Atomically deploy Telegram hooks and visuals
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          REMOTE="/tmp/wesi-telegram-$GITHUB_RUN_ID"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE/visuals'"
          scp "${SSH[@]}" \
            server/pb_hooks/wesi_telegram_lib.js \
            server/pb_hooks/wesi_telegram_store.js \
            server/pb_hooks/wesi_telegram_gateway.js \
            server/pb_hooks/wesi_telegram_experience.js \
            server/pb_hooks/wesi_telegram_interactions.js \
            server/pb_hooks/wesi_telegram.pb.js \
            server/pb_hooks/wesi_ai_finance_tools.js \
            server/pb_hooks/wesi_ai_task_tools.js \
            wesi-telegram.json \
            "$MAIN_USER@$MAIN_HOST:$REMOTE/"
          scp "${SSH[@]}" build/wesi_telegram_visuals/*.jpg "$MAIN_USER@$MAIN_HOST:$REMOTE/visuals/"

          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail
          HOOK_DIR=/opt/pocketbase/pb_hooks
          PUBLIC_DIR=/opt/pocketbase/pb_public/telegram/visuals
          test -d "$HOOK_DIR"
          test -w "$HOOK_DIR"
          mkdir -p "$PUBLIC_DIR"

          atomic_install() {
            src="$1"
            dst="$2"
            mode="$3"
            dir="$(dirname "$dst")"
            tmp="$dir/.deploy-$(basename "$dst").$$.$RANDOM.tmp"
            cat "$src" > "$tmp"
            chmod "$mode" "$tmp"
            cmp -s "$src" "$tmp"
            mv -f "$tmp" "$dst"
          }

          atomic_install "$REMOTE/wesi_telegram_lib.js" "$HOOK_DIR/wesi_telegram_lib.js" 0644
          atomic_install "$REMOTE/wesi_telegram_store.js" "$HOOK_DIR/wesi_telegram_store.js" 0644
          atomic_install "$REMOTE/wesi_telegram_gateway.js" "$HOOK_DIR/wesi_telegram_gateway.js" 0644
          atomic_install "$REMOTE/wesi_telegram_experience.js" "$HOOK_DIR/wesi_telegram_experience.js" 0644
          atomic_install "$REMOTE/wesi_telegram_interactions.js" "$HOOK_DIR/wesi_telegram_interactions.js" 0644
          atomic_install "$REMOTE/wesi_ai_finance_tools.js" "$HOOK_DIR/wesi_ai_finance_tools.js" 0644
          atomic_install "$REMOTE/wesi_ai_task_tools.js" "$HOOK_DIR/wesi_ai_task_tools.js" 0644
          atomic_install "$REMOTE/wesi-telegram.json" "$HOOK_DIR/.wesi-telegram.json" 0600
          for kind in brief cash risk today overdue push farewell; do
            atomic_install "$REMOTE/visuals/$kind.jpg" "$PUBLIC_DIR/$kind.jpg" 0644
          done
          atomic_install "$REMOTE/wesi_telegram.pb.js" "$HOOK_DIR/wesi_telegram.pb.js" 0644

          sleep 4
          curl -fsS --max-time 8 http://127.0.0.1:8090/api/health >/dev/null
          cmp -s "$REMOTE/wesi_telegram_experience.js" "$HOOK_DIR/wesi_telegram_experience.js"
          cmp -s "$REMOTE/wesi_telegram_interactions.js" "$HOOK_DIR/wesi_telegram_interactions.js"
          cmp -s "$REMOTE/wesi_telegram.pb.js" "$HOOK_DIR/wesi_telegram.pb.js"
          cmp -s "$REMOTE/visuals/farewell.jpg" "$PUBLIC_DIR/farewell.jpg"
          cmp -s "$REMOTE/wesi-telegram.json" "$HOOK_DIR/.wesi-telegram.json"
          rm -rf "$REMOTE"
          echo WESI_TELEGRAM_HOOKS_AND_VISUALS_DEPLOYED
          REMOTE

      - name: Configure Telegram profile menu and webhook
        run: |
          set -euo pipefail
          tg_post() {
            method="$1"
            payload="$2"
            response="$(curl -fsS --max-time 20 -X POST \
              "https://api.telegram.org/bot${BOT_TOKEN}/${method}" \
              -H 'Content-Type: application/json' \
              --data-binary "$payload")"
            RESPONSE="$response" METHOD="$method" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['RESPONSE'])
          assert data.get('ok') is True, (os.environ['METHOD'], data)
          print('TELEGRAM_' + os.environ['METHOD'].upper() + '_OK')
          PY
          }

          webhook_url="${PUBLIC_BASE_URL%/}/api/wesi/telegram/webhook"
          webhook_payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'url': os.environ['PUBLIC_BASE_URL'].rstrip('/') + '/api/wesi/telegram/webhook',
              'secret_token': os.environ['WEBHOOK_SECRET'],
              'allowed_updates': ['message', 'callback_query'],
              'drop_pending_updates': False,
          }))
          PY
          )"
          tg_post setWebhook "$webhook_payload"
          tg_post setMyName '{"name":"WesiOS: BUSINESS OPERATING SYSTEM"}'
          tg_post setMyDescription '{"description":"WesiOS — операционная система бизнеса в Telegram: сводка, деньги, риски, задачи, организации и серверные уведомления."}'
          tg_post setMyShortDescription '{"short_description":"WesiOS — управление бизнесом и важные сигналы прямо в Telegram."}'
          tg_post setMyCommands '[{"command":"brief","description":"📊 Главная сводка"},{"command":"cash","description":"💰 Деньги и текущий баланс"},{"command":"risk","description":"⚠️ Риски и кассовый runway"},{"command":"today","description":"✅ Задачи на сегодня"},{"command":"overdue","description":"⏰ Просроченные задачи"},{"command":"org","description":"🏢 Выбрать организацию"},{"command":"test","description":"🔔 Проверить Telegram-уведомления"},{"command":"help","description":"🧭 Все возможности"}]'
          tg_post setChatMenuButton '{"menu_button":{"type":"commands"}}'

          info="$(curl -fsS --max-time 20 "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo")"
          name="$(curl -fsS --max-time 20 "https://api.telegram.org/bot${BOT_TOKEN}/getMyName")"
          commands="$(curl -fsS --max-time 20 "https://api.telegram.org/bot${BOT_TOKEN}/getMyCommands")"
          INFO="$info" NAME="$name" COMMANDS="$commands" EXPECTED="$webhook_url" python3 - <<'PY'
          import json, os
          info=json.loads(os.environ['INFO'])
          assert info.get('ok') is True, info
          result=info.get('result') or {}
          assert result.get('url') == os.environ['EXPECTED'], result
          assert result.get('has_custom_certificate') in (False, None), result

          name=json.loads(os.environ['NAME'])
          assert name.get('ok') is True, name
          assert (name.get('result') or {}).get('name') == 'WesiOS: BUSINESS OPERATING SYSTEM', name

          commands=json.loads(os.environ['COMMANDS'])
          assert commands.get('ok') is True, commands
          actual=[x.get('command') for x in commands.get('result') or []]
          expected=['brief','cash','risk','today','overdue','org','test','help']
          assert actual == expected, (actual, expected)
          print('TELEGRAM_PROFILE_MENU_WEBHOOK_VERIFIED pending=' + str(result.get('pending_update_count', 0)))
          PY

      - name: Verify public Telegram routes and visuals
        run: |
          set -euo pipefail
          base="${PUBLIC_BASE_URL%/}"
          code="$(curl -sS -o /tmp/tg-webhook.out -w '%{http_code}' --max-time 15 -X POST "$base/api/wesi/telegram/webhook" -H 'Content-Type: application/json' -d '{}' || true)"
          test "$code" = 401
          open_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$base/api/wesi/telegram/open?target=home" || true)"
          test "$open_code" = 302
          push_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$base/api/wesi/telegram/test-push" || true)"
          test "$push_code" = 401
          for kind in brief cash risk today overdue push farewell; do
            curl -fsS --max-time 15 "$base/telegram/visuals/$kind.jpg" -o "/tmp/$kind.jpg"
            test -s "/tmp/$kind.jpg"
          done
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('/tmp').glob('*.jpg'):
              data=path.read_bytes()
              assert data[:2] == b'\xff\xd8', path
          print('WESI_TELEGRAM_PUBLIC_VISUALS_OK')
          PY
          echo WESI_TELEGRAM_PUBLIC_ROUTES_OK

      - name: Cleanup secrets
        if: always()
        run: rm -f wesi-telegram.json ~/.ssh/main_key

      - name: Publish deploy status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'Wesi Telegram Deploy',
              description: ok ? 'Telegram profile, menu, visuals, hooks and webhook verified' : 'Production Telegram deploy failed'
            });
