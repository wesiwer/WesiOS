name: Diagnose employee provision

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Source hook fingerprint
        run: sha256sum server/pb_hooks/employee_portal.pb.js

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect PocketBase runtime safely
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          /opt/pocketbase/pocketbase --version 2>/dev/null || true
          echo '=== installed hook sha ==='
          sha256sum /opt/pocketbase/pb_hooks/employee_portal.pb.js 2>/dev/null || true
          rm -rf /tmp/wesi-pb-diag && mkdir -p /tmp/wesi-pb-diag
          cp /opt/pocketbase/pb_data/data.db /tmp/wesi-pb-diag/data.db
          [ -f /opt/pocketbase/pb_data/data.db-wal ] && cp /opt/pocketbase/pb_data/data.db-wal /tmp/wesi-pb-diag/data.db-wal || true
          [ -f /opt/pocketbase/pb_data/data.db-shm ] && cp /opt/pocketbase/pb_data/data.db-shm /tmp/wesi-pb-diag/data.db-shm || true
          cp /opt/pocketbase/pb_data/auxiliary.db /tmp/wesi-pb-diag/auxiliary.db
          [ -f /opt/pocketbase/pb_data/auxiliary.db-wal ] && cp /opt/pocketbase/pb_data/auxiliary.db-wal /tmp/wesi-pb-diag/auxiliary.db-wal || true
          [ -f /opt/pocketbase/pb_data/auxiliary.db-shm ] && cp /opt/pocketbase/pb_data/auxiliary.db-shm /tmp/wesi-pb-diag/auxiliary.db-shm || true

          python3 - <<'PY'
          import sqlite3, json, re

          def tables(con):
              return [r[0] for r in con.execute("select name from sqlite_master where type='table'")]

          def safe(v):
              if isinstance(v, str):
                  v = re.sub(r'(?i)(authorization|token)[^,}\"]*', r'\1=***', v)
                  if len(v) > 4000: v = v[:4000] + '…'
              return v

          db='/tmp/wesi-pb-diag/data.db'
          con=sqlite3.connect(db)
          ts=tables(con)
          print('=== data tables ===')
          print(','.join(ts))
          info=[r[1] for r in con.execute('pragma table_info(_collections)')]
          row=con.execute("select * from _collections where name='users'").fetchone()
          if row:
              data={k:safe(v) for k,v in zip(info,row)}
              print('=== users collection ===')
              print(json.dumps(data, ensure_ascii=False, default=str))
          if 'wesios_records' in ts:
              print('=== owner markers ===')
              print(con.execute("select count(*) from wesios_records where coll='system' and rid='portal-owner' and deleted=0").fetchone()[0])
              rows=con.execute("select owner,org,coll,rid,deleted from wesios_records where coll='system' and rid='portal-owner' limit 5").fetchall()
              print(rows)
          if 'users' in ts:
              cols=[r[1] for r in con.execute('pragma table_info(users)')]
              print('=== users columns ===')
              print(cols)
              wanted=[c for c in ('id','email','username','verified','name','employeeLogin') if c in cols]
              if wanted:
                  q='select '+','.join('"'+c+'"' for c in wanted)+' from users order by created desc limit 15'
                  print('=== recent users ===')
                  for r in con.execute(q): print(dict(zip(wanted,r)))
          con.close()

          con=sqlite3.connect('/tmp/wesi-pb-diag/auxiliary.db')
          ts=tables(con)
          print('=== auxiliary tables ===')
          print(','.join(ts))
          for t in ts:
              cols=[r[1] for r in con.execute(f'pragma table_info("{t}")')]
              if not any(c in cols for c in ('message','data','details','error','level')):
                  continue
              try:
                  rows=con.execute(f'select * from "{t}" order by rowid desc limit 250').fetchall()
              except Exception:
                  continue
              for r in rows:
                  d={k:safe(v) for k,v in zip(cols,r)}
                  s=json.dumps(d, ensure_ascii=False, default=str)
                  if any(x in s.lower() for x in ('provision','employee','portal','error','panic','exception','500')):
                      print('LOG', s)
          con.close()
          PY
          rm -rf /tmp/wesi-pb-diag
          REMOTE
