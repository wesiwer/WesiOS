name: Diagnose employee provision

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Source hook fingerprint
        run: sha256sum server/pb_hooks/employee_portal.pb.js

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect PocketBase runtime safely
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          PID=$(pgrep -f '/opt/pocketbase/pocketbase serve' | head -n1 || true)
          echo '=== pocketbase process ==='
          ps -eo pid,args | grep -E '[p]ocketbase( |$)' || true
          [ -n "$PID" ] && { echo "cwd=$(readlink -f /proc/$PID/cwd)"; } || true
          /opt/pocketbase/pocketbase --version 2>/dev/null || true
          echo '=== installed hook sha ==='
          sha256sum /opt/pocketbase/pb_hooks/employee_portal.pb.js 2>/dev/null || true
          echo '=== pb_data files ==='
          find /opt/pocketbase /srv -maxdepth 4 -type f \( -name '*.db' -o -name '*.db-wal' \) -printf '%p %s bytes\n' 2>/dev/null | head -n 50 || true

          python3 - <<'PY'
          import os, sqlite3, json, glob
          candidates = glob.glob('/opt/pocketbase/**/data.db', recursive=True) + glob.glob('/srv/**/data.db', recursive=True)
          seen=set()
          for db in candidates:
              if db in seen: continue
              seen.add(db)
              print('=== DATA DB', db, '===')
              try:
                  con=sqlite3.connect(f'file:{db}?mode=ro', uri=True)
                  cols=[r[0] for r in con.execute("select name from sqlite_master where type='table'")]
                  print('tables:', ','.join(cols[:80]))
                  if '_collections' in cols:
                      info=[r[1] for r in con.execute('pragma table_info(_collections)')]
                      print('_collections columns:', info)
                      row=con.execute("select * from _collections where name='users'").fetchone()
                      if row:
                          data=dict(zip(info,row))
                          for k,v in list(data.items()):
                              if isinstance(v,str) and len(v)>2500: data[k]=v[:2500]+'…'
                          print('users collection:', json.dumps(data, ensure_ascii=False, default=str))
                  if 'wesios_records' in cols:
                      print('owner markers:', con.execute("select count(*) from wesios_records where coll='system' and rid='portal-owner' and deleted=0").fetchone()[0])
                  con.close()
              except Exception as e:
                  print('data db error:', type(e).__name__, str(e))

          logs = glob.glob('/opt/pocketbase/**/logs.db', recursive=True) + glob.glob('/srv/**/logs.db', recursive=True)
          for db in logs:
              print('=== LOG DB', db, '===')
              try:
                  con=sqlite3.connect(f'file:{db}?mode=ro', uri=True)
                  tables=[r[0] for r in con.execute("select name from sqlite_master where type='table'")]
                  print('tables:', tables)
                  for t in tables:
                      info=[r[1] for r in con.execute(f'pragma table_info("{t}")')]
                      if any(x in info for x in ('message','data','details','error')):
                          rows=con.execute(f'select * from "{t}" order by rowid desc limit 120').fetchall()
                          for row in rows:
                              d=dict(zip(info,row))
                              s=json.dumps(d, ensure_ascii=False, default=str)
                              low=s.lower()
                              if any(x in low for x in ('provision','employee','portal','error','panic','exception')):
                                  for secret in ('token','authorization'):
                                      if secret in low:
                                          pass
                                  print(s[:3500])
                  con.close()
              except Exception as e:
                  print('log db error:', type(e).__name__, str(e))
          PY
          REMOTE
