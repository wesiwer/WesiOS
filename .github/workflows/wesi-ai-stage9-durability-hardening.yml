name: Validate Wesi AI Stage 9 durability hardening

on:
  push:
    branches:
      - agent/wesi-ai-stage9-self-debug-artifacts-rebased

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage9-durability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage9-self-debug-artifacts-rebased
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Apply Stage 9 durability hardening
        run: python tool/wesi_ai_stage9_durability_hardening.py
      - name: Format Stage 9 hardening
        run: >-
          dart format
          lib/features/ai/runtime/wesi_artifact_models.dart
          lib/features/ai/runtime/wesi_artifact_validator.dart
          lib/features/ai/runtime/wesi_artifact_delivery.dart
          lib/features/ai/runtime/wesi_self_debug_engine.dart
          lib/features/ai/runtime/wesi_self_debug_job_observer.dart
          lib/features/ai/runtime/wesi_self_debug_checkpoint.dart
          lib/features/ai/runtime/wesi_self_debug_job_control.dart
          lib/features/ai/runtime/wesi_self_debug_redactor.dart
          test/wesi_artifact_validator_test.dart
          test/wesi_self_debug_engine_test.dart
          test/wesi_self_debug_durability_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Stage 6-9 security and durability regressions
        run: >-
          flutter test
          test/wesi_local_runtime_test.dart
          test/wesi_runtime_pack_test.dart
          test/wesi_resource_scheduler_test.dart
          test/wesi_job_queue_test.dart
          test/wesi_job_coordinator_test.dart
          test/wesi_stage8_acceptance_test.dart
          test/wesi_artifact_validator_test.dart
          test/wesi_self_debug_engine_test.dart
          test/wesi_self_debug_durability_test.dart
      - name: Commit validated product hardening and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wesi-ai-stage9-durability-hardening.yml tool/wesi_ai_stage9_durability_hardening.py
          git add lib/features/ai/runtime/wesi_artifact_models.dart lib/features/ai/runtime/wesi_artifact_validator.dart lib/features/ai/runtime/wesi_artifact_delivery.dart lib/features/ai/runtime/wesi_self_debug_engine.dart lib/features/ai/runtime/wesi_self_debug_job_observer.dart lib/features/ai/runtime/wesi_self_debug_checkpoint.dart lib/features/ai/runtime/wesi_self_debug_job_control.dart lib/features/ai/runtime/wesi_self_debug_redactor.dart test/wesi_artifact_validator_test.dart test/wesi_self_debug_engine_test.dart test/wesi_self_debug_durability_test.dart
          git commit -m "feat(ai): harden durable self-debug and artifact proof"
          git push origin HEAD:agent/wesi-ai-stage9-self-debug-artifacts-rebased
