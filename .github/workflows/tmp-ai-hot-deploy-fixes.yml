name: Temporary Wesi AI Hot Deploy Fixes

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
    paths:
      - .github/workflows/tmp-ai-hot-deploy-fixes.yml

permissions:
  contents: read

concurrency:
  group: wesi-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELAY_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      RELAY_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
      PUBLIC_HOST: wesi-ai-178-236-247-194.nip.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage12-final-20260816

      - name: Validate sources
        run: |
          set -euo pipefail
          python3 server/build-wesi-ai-personas.py
          node --check server/wesi-ai-stream/gateway.mjs
          node --check server/pb_hooks/wesi_ai_finance_tools.js
          node --check server/pb_hooks/wesi_ai_tools.js
          (cd server/wesi-ai-stream && npm test)

      - name: Prepare SSH
        env:
          RELAY_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          RELAY_KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          MAIN_KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$RELAY_KEY" > ~/.ssh/relay_key
          printf '%s\n' "$MAIN_KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/relay_key ~/.ssh/main_key
          if [ -n "${RELAY_KNOWN:-}" ]; then printf '%s\n' "$RELAY_KNOWN" > ~/.ssh/relay_known_hosts; else ssh-keyscan -H "$RELAY_HOST" > ~/.ssh/relay_known_hosts 2>/dev/null; fi
          if [ -n "${MAIN_KNOWN:-}" ]; then printf '%s\n' "$MAIN_KNOWN" > ~/.ssh/main_known_hosts; else ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/*known_hosts

      - name: Hot deploy Main AI hooks
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          REMOTE="/tmp/wesi-ai-fix-main-$GITHUB_RUN_ID"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp "${SSH[@]}" server/pb_hooks/wesi_ai_*.js server/pb_hooks/wesi_ai_*.pb.js server/pb_hooks/.wesi-ai-personas.json "$MAIN_USER@$MAIN_HOST:$REMOTE/"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail
          HOOK_DIR=/opt/pocketbase/pb_hooks
          test -d "$HOOK_DIR" && test -w "$HOOK_DIR"
          for src in "$REMOTE"/wesi_ai_*.js "$REMOTE"/wesi_ai_*.pb.js; do
            [ -f "$src" ] || continue
            dst="$HOOK_DIR/$(basename "$src")"
            [ ! -e "$dst" ] || test -w "$dst"
            cat "$src" > "$dst"
            chmod 0644 "$dst"
          done
          cat "$REMOTE/.wesi-ai-personas.json" > "$HOOK_DIR/.wesi-ai-personas.json"
          chmod 0600 "$HOOK_DIR/.wesi-ai-personas.json"
          cmp -s "$REMOTE/wesi_ai_finance_tools.js" "$HOOK_DIR/wesi_ai_finance_tools.js"
          cmp -s "$REMOTE/wesi_ai_tools.js" "$HOOK_DIR/wesi_ai_tools.js"
          curl -fsS --max-time 10 http://127.0.0.1:8090/api/health >/dev/null
          rm -rf "$REMOTE"
          echo MAIN_AI_HOOKS_UPDATED
          REMOTE

      - name: Hot deploy streaming gateway runtime
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          REMOTE="/tmp/wesi-ai-fix-stream-$GITHUB_RUN_ID"
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp "${SSH[@]}" server/wesi-ai-stream/server.mjs server/wesi-ai-stream/gateway.mjs server/wesi-ai-stream/persona_coagent.mjs server/wesi-ai-stream/persona_coagent_orchestrator.mjs server/wesi-ai-stream/package.json "$RELAY_USER@$RELAY_HOST:$REMOTE/"
          ssh "${SSH[@]}" "$RELAY_USER@$RELAY_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then SUDO=(); else SUDO=(sudo -n); fi
          test -r /etc/wesi-ai-stream.env
          for file in server.mjs gateway.mjs persona_coagent.mjs persona_coagent_orchestrator.mjs package.json; do
            "${SUDO[@]}" install -o root -g wesi-ai-stream -m 0640 "$REMOTE/$file" "/opt/wesi-ai-stream/$file"
          done
          "${SUDO[@]}" systemctl restart wesi-ai-stream
          for _ in $(seq 1 20); do
            health="$(curl -fsS --max-time 3 http://127.0.0.1:8792/health 2>/dev/null || true)"
            if printf '%s' "$health" | grep -q '"ready":true' && printf '%s' "$health" | grep -q '"streaming":true'; then
              echo "$health"
              rm -rf "$REMOTE"
              exit 0
            fi
            sleep 1
          done
          "${SUDO[@]}" systemctl status wesi-ai-stream --no-pager -l || true
          exit 1
          REMOTE

      - name: Verify production facts
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 15 "https://$PUBLIC_HOST/health")"
          printf '%s' "$health" | grep -q '"streaming":true'
          protected="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST "https://$PUBLIC_HOST/api/wesi/ai/chat/stream" -H 'Content-Type: application/json' -d '{}' || true)"
          [ "$protected" = 401 ] || [ "$protected" = 403 ]
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          count="$(ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "sqlite3 -readonly /opt/pocketbase/pb_data/data.db \"select count(*) from wesios_records where deleted=0 and coll='transactions' and coalesce(nullif(json_extract(payload,'\\$.organizationId'),''),'org_wesi_inc')='org_wesi_inc' and datetime(json_extract(payload,'\\$.date')) >= datetime('2026-06-16T00:00:00Z') and datetime(json_extract(payload,'\\$.date')) <= datetime('2026-08-16T23:59:59Z');\"")"
          echo "ORG_WESI_INC_PERIOD_TRANSACTIONS=$count"
          test "$count" -gt 0
          echo WESI_AI_PRODUCTION_FIX_READY
