name: Apply contacts access UX once

on:
  push:
    branches:
      - agent/org-hierarchy-remediation-1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
          fetch-depth: 1
      - name: Apply patch
        run: python3 scripts/apply_contacts_access_ui.py
      - name: Validate patch
        run: git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/organizations/organizations_screen.dart lib/features/team/contacts_screen.dart
          git commit -m "feat: simplify organization access and contacts filtering"
          git push origin HEAD:agent/org-hierarchy-remediation-1
