name: One-time Recovery Release Trigger

on:
  push:
    paths:
      - '.github/recovery-release.trigger'

permissions:
  actions: write
  contents: write

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch normal WesiOS release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='Временный recovery-вход владельца без почтового OTP. После настройки профиля recovery-кнопка будет удалена.' \
            -f deploy_to_server=true
          echo 'Publish WesiOS Release dispatched.'

      - name: Mark successful dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="WesiOS 0.19.9+57 recovery release dispatched at $STAMP"
          CONTENT="$(printf '%s\n' "$BODY" | base64 -w0)"
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/contents/.github/recovery-release-dispatched-57.txt" \
            -f message='Mark recovery release dispatch' \
            -f content="$CONTENT" \
            -f branch='main'
