name: Dispatch WesiOS 0.22.17 Release Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-once-0.22.17.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='Wesi AI Stage 14: полный аудит транспорта, исправление Lobby/Chat и production route guard.' \
            -f deploy_to_server=true
          echo 'RELEASE_0_22_17_92_DISPATCHED'
