name: Deploy artifacts to Wesi server

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (defaults to pubspec version)'
        required: false
      deploy_models:
        description: 'Also deploy files from server-models/forecast'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PRODUCT: wesios

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${RAW%%+*}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download current app-latest assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/app
          gh release download app-latest --repo "$GITHUB_REPOSITORY" \
            --pattern 'wesios-windows-x64.zip' \
            --pattern 'wesios-android.apk' \
            --pattern 'app-manifest.json' \
            --dir out/app
          test -s out/app/wesios-windows-x64.zip
          test -s out/app/wesios-android.apk
          test -s out/app/app-manifest.json

      - name: Prepare forecast models
        if: ${{ inputs.deploy_models }}
        run: |
          set -euo pipefail
          mkdir -p out/model
          if [ -d server-models/forecast ]; then
            cp -a server-models/forecast/. out/model/
          fi
          if ! find out/model -type f -print -quit | grep -q .; then
            echo 'No forecast model files in server-models/forecast; model deployment skipped.'
            rm -rf out/model
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.WESI_SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_HOST"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload and atomically promote application
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          USER="${USER:-wesios-deploy}"
          REMOTE="/tmp/wesios-app-${GITHUB_RUN_ID}"
          ssh "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -r out/app/. "$USER@$HOST:$REMOTE/"
          ssh "$USER@$HOST" "sudo /usr/local/sbin/wesi-promote-release wesios app '$VERSION' '$REMOTE'; rm -rf '$REMOTE'"

      - name: Upload and atomically promote forecast model
        if: ${{ inputs.deploy_models && hashFiles('out/model/**') != '' }}
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          USER="${USER:-wesios-deploy}"
          REMOTE="/tmp/wesios-model-${GITHUB_RUN_ID}"
          ssh "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -r out/model/. "$USER@$HOST:$REMOTE/"
          ssh "$USER@$HOST" "sudo /usr/local/sbin/wesi-promote-release wesios forecast-model '$VERSION' '$REMOTE'; rm -rf '$REMOTE'"
