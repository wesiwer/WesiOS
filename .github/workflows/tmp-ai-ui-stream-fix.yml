name: Temporary Wesi AI UI Stream Fix

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
    paths:
      - .github/workflows/tmp-ai-ui-stream-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage12-final-20260816
          fetch-depth: 0
      - name: Apply focused fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1))

          # The Thinking UI is the useful default; Classic remains available and
          # still hides all observable work-status events.
          replace('lib/features/ai/ai_assistant_v2_screen.dart',
                  '  WesiAiUiMode _uiMode = WesiAiUiMode.classic;',
                  '  WesiAiUiMode _uiMode = WesiAiUiMode.thinking;')

          # Diff counters are meaningful for file/code tools only. Finance and
          # other read tools must not show fabricated +0/-0 badges.
          old='''                Text(\n                  '+${event.additions}',\n                  style: theme.textTheme.labelSmall?.copyWith(\n                    color: positive,\n                    fontWeight: FontWeight.w700,\n                  ),\n                ),\n                const SizedBox(width: 5),\n                Text(\n                  '-${event.deletions}',\n                  style: theme.textTheme.labelSmall?.copyWith(\n                    color: negative,\n                    fontWeight: FontWeight.w700,\n                  ),\n                ),'''
          new='''                if (event.hasDiff) ...[\n                  Text(\n                    '+${event.additions}',\n                    style: theme.textTheme.labelSmall?.copyWith(\n                      color: positive,\n                      fontWeight: FontWeight.w700,\n                    ),\n                  ),\n                  const SizedBox(width: 5),\n                  Text(\n                    '-${event.deletions}',\n                    style: theme.textTheme.labelSmall?.copyWith(\n                      color: negative,\n                      fontWeight: FontWeight.w700,\n                    ),\n                  ),\n                ],'''
          replace('lib/features/ai/widgets/wesi_ai_rich_message.dart', old, new)

          # Tool activity should describe real read results (especially finance)
          # instead of pretending every tool has a source-code diff.
          api=Path('lib/features/ai/wesi_ai_api.dart')
          text=api.read_text()
          old="""      result.add(<String, dynamic>{\n        'id': 'tool_result_$index',\n        'kind': 'tool',\n        'sourceName': tool,\n        'label': tool.isEmpty ? 'Инструмент' : 'Инструмент · $tool',\n        'status': 'result',\n        'additions': count(payload['additions'] ?? map['additions']),\n        'deletions': count(payload['deletions'] ?? map['deletions']),\n        if (files.isNotEmpty) 'files': files,\n        if ('${map['code'] ?? ''}'.trim().isNotEmpty)\n          'detail': '${map['code']}',\n      });"""
          new="""      final hasDiffMetadata = payload.containsKey('additions') ||\n          payload.containsKey('deletions') ||\n          map.containsKey('additions') ||\n          map.containsKey('deletions') ||\n          files.isNotEmpty;\n      final transactionCount = payload['transactionCount'];\n      final organizationName = '${payload['organizationName'] ?? ''}'.trim();\n      final organizationId = '${payload['organizationId'] ?? ''}'.trim();\n      final code = '${map['code'] ?? ''}'.trim();\n      final detailParts = <String>[\n        if (transactionCount is num) '${transactionCount.toInt()} операций',\n        if (organizationName.isNotEmpty) organizationName,\n        if (organizationName.isEmpty && organizationId.isNotEmpty) organizationId,\n        if (code.isNotEmpty) code,\n      ];\n      result.add(<String, dynamic>{\n        'id': 'tool_result_$index',\n        'kind': 'tool',\n        'sourceName': tool,\n        'label': tool.isEmpty ? 'Инструмент' : 'Инструмент · $tool',\n        'status': 'result',\n        if (hasDiffMetadata)\n          'additions': count(payload['additions'] ?? map['additions']),\n        if (hasDiffMetadata)\n          'deletions': count(payload['deletions'] ?? map['deletions']),\n        if (files.isNotEmpty) 'files': files,\n        if (detailParts.isNotEmpty) 'detail': detailParts.join(' · '),\n      });"""
          if old not in text: raise SystemExit('missing api tool activity block')
          api.write_text(text.replace(old,new,1))

          # Gateway health must expose an actual readiness bit; deployment and
          # diagnostics can then distinguish "process exists" from ready.
          replace('server/wesi-ai-stream/gateway.mjs',
                  "res.end(JSON.stringify({ok: true, service: 'wesi-ai-stream-gateway', streaming: true}));",
                  "res.end(JSON.stringify({ok: true, ready: true, service: 'wesi-ai-stream-gateway', streaming: true}));")

          # Do not emit fake file-diff counters for non-diff tool results.
          gw=Path('server/wesi-ai-stream/gateway.mjs')
          g=gw.read_text()
          old="""        writeNdjson(res, {\n          type: 'tool',\n          phase: 'result',\n          name: toolRequest.name,\n          ok: toolResult?.ok === true,\n          code: toolResult?.code || null,\n          additions: diff.additions,\n          deletions: diff.deletions,\n          files: diff.files,\n        });"""
          new="""        const toolPayload = toolResult && typeof toolResult.result === 'object' && !Array.isArray(toolResult.result)\n          ? toolResult.result\n          : {};\n        const hasDiffMetadata = Object.prototype.hasOwnProperty.call(toolPayload, 'additions') ||\n          Object.prototype.hasOwnProperty.call(toolPayload, 'deletions') || diff.files.length > 0;\n        writeNdjson(res, {\n          type: 'tool',\n          phase: 'result',\n          name: toolRequest.name,\n          ok: toolResult?.ok === true,\n          code: toolResult?.code || null,\n          ...(hasDiffMetadata ? {additions: diff.additions, deletions: diff.deletions, files: diff.files} : {}),\n          ...(Number.isFinite(Number(toolPayload.transactionCount)) ? {transactionCount: Number(toolPayload.transactionCount)} : {}),\n          ...(toolPayload.organizationId ? {organizationId: String(toolPayload.organizationId)} : {}),\n          ...(toolPayload.organizationName ? {organizationName: String(toolPayload.organizationName)} : {}),\n        });"""
          if old not in g: raise SystemExit('missing gateway tool result block')
          gw.write_text(g.replace(old,new,1))

          # Final agent rows are not file diffs unless there really was a diff.
          g=gw.read_text()
          g=g.replace("""          writeNdjson(res, {\n            type: 'agent',\n            phase: 'result',\n            name: prepared.persona,\n            role: 'lead',\n            additions: totalDiff.additions,\n            deletions: totalDiff.deletions,\n            files: totalDiff.files,\n          });""", """          writeNdjson(res, {\n            type: 'agent',\n            phase: 'result',\n            name: prepared.persona,\n            role: 'lead',\n            ...(totalDiff.additions || totalDiff.deletions || totalDiff.files.length\n              ? {additions: totalDiff.additions, deletions: totalDiff.deletions, files: totalDiff.files}\n              : {}),\n          });""", 1)
          g=g.replace("""      writeNdjson(res, {\n        type: 'agent',\n        phase: 'result',\n        name: prepared.persona,\n        role: 'lead',\n        additions: totalDiff.additions,\n        deletions: totalDiff.deletions,\n        files: totalDiff.files,\n      });""", """      writeNdjson(res, {\n        type: 'agent',\n        phase: 'result',\n        name: prepared.persona,\n        role: 'lead',\n        ...(totalDiff.additions || totalDiff.deletions || totalDiff.files.length\n          ? {additions: totalDiff.additions, deletions: totalDiff.deletions, files: totalDiff.files}\n          : {}),\n      });""", 1)
          gw.write_text(g)

          # Persist legacy root transactions with their effective org on the
          # next sync/write instead of leaving the organization ambiguous.
          replace('lib/features/treasury/models/transaction_model.dart',
                  "        'organizationId': organizationId,",
                  "        'organizationId': effectiveOrganizationId,")

          # Strengthen deployment: a 200 /health without ready=true is not OK.
          dep=Path('.github/workflows/deploy-wesi-ai-streaming.yml')
          d=dep.read_text()
          old='''          curl -fsS --max-time 10 http://127.0.0.1:8787/health\n          curl -fsS --max-time 10 http://127.0.0.1:8792/health'''
          new='''          curl -fsS --max-time 10 http://127.0.0.1:8787/health\n          gateway_health="$(curl -fsS --max-time 10 http://127.0.0.1:8792/health)"\n          echo "$gateway_health" | grep -q '\"ready\":true'\n          echo "$gateway_health" | grep -q '\"streaming\":true' '''
          if old not in d: raise SystemExit('missing deploy gateway health block')
          dep.write_text(d.replace(old,new,1))
          PY

      - name: Add regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/wesi_ai_rich_message_test.dart')
          t=p.read_text()
          marker="""  testWidgets('live work log is expanded before final answer', (tester) async {"""
          if marker not in t: raise SystemExit('missing rich test marker')
          insert="""  testWidgets('read-only tool does not render fake +0 -0 diff counters', (tester) async {\n    await tester.pumpWidget(const MaterialApp(\n      home: Scaffold(\n        body: WesiAiRichMessage(\n          messageId: 'finance-tool',\n          text: '',\n          activityRaw: [\n            {\n              'id': 'finance-result',\n              'kind': 'tool',\n              'sourceName': 'finance_summary',\n              'label': 'Инструмент · finance_summary',\n              'status': 'result',\n              'detail': '40 операций · Wesi Inc',\n            }\n          ],\n        ),\n      ),\n    ));\n    expect(find.text('Инструмент · finance_summary'), findsOneWidget);\n    expect(find.text('+0'), findsNothing);\n    expect(find.text('-0'), findsNothing);\n  });\n\n"""
          p.write_text(t.replace(marker, insert+marker, 1))

          # Health readiness regression uses the gateway's real handler.
          p=Path('server/wesi-ai-stream/gateway.test.mjs')
          t=p.read_text()
          if "gateway health exposes ready state" not in t:
              t += """\n\ntest('gateway health exposes ready state', async () => {\n  const handler = createGateway({\n    pocketBaseUrl: 'https://main.example.test',\n    relayUrl: 'https://relay.example.test',\n    streamSecret: 's'.repeat(40),\n    relaySecret: 'r'.repeat(40),\n    fetchImpl: async () => { throw new Error('not used'); },\n  });\n  const req = {method: 'GET', url: '/health'};\n  let status = 0; let body = '';\n  const res = {\n    destroyed: false, writableEnded: false,\n    writeHead(code) { status = code; },\n    end(value='') { body += value; this.writableEnded = true; },\n    write(value) { body += value; return true; },\n    on() {},\n  };\n  await handler(req, res);\n  assert.equal(status, 200);\n  const json = JSON.parse(body);\n  assert.equal(json.ready, true);\n  assert.equal(json.streaming, true);\n});\n"""
          p.write_text(t)
          PY

      - name: Format and test
        run: |
          set -euo pipefail
          node --check server/wesi-ai-stream/gateway.mjs
          node --check server/pb_hooks/wesi_ai_finance_tools.js
          (cd server/wesi-ai-stream && npm test)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/widgets/wesi_ai_rich_message.dart lib/features/ai/wesi_ai_api.dart lib/features/treasury/models/transaction_model.dart test/wesi_ai_rich_message_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/wesi_ai_rich_message_test.dart test/wesi_ai_coagent_activity_test.dart
      - name: Commit fixes
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-ci'
          git config user.email 'wesi-ai-ci@users.noreply.github.com'
          git add lib server test .github/workflows/deploy-wesi-ai-streaming.yml
          git commit -m 'fix(ai): ground finance results and restore thinking stream UX'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
