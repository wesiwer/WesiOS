name: Verify live sync connection now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-sync-connection-now.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safe-local-recovery-upload
          fetch-depth: 1
      - name: Verify public gateway routes exist
        shell: bash
        run: |
          set -euo pipefail
          auth_code=$(curl -sS --max-time 20 -o /tmp/auth.json -w '%{http_code}' https://api.wesi-inc.ru/api/wesi/auth/version)
          test "$auth_code" = 200
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/auth.json',encoding='utf-8'))
          assert data.get('version'), data
          print('AUTH_GATEWAY_OK', data.get('version'))
          PY
          for path in /api/wesi/sync-v3/revision /api/wesi/sync/organizations /api/wesi/sync-v3/tasks; do
            code=$(curl -sS --max-time 20 -o /tmp/sync-body -w '%{http_code}' "https://api.wesi-inc.ru$path")
            echo "EXTERNAL $path -> $code"
            # Unauthenticated request must reach the WesiOS sync middleware and
            # be rejected as unauthorized. 404 means the live route is missing.
            test "$code" = 401
          done
      - name: Verify deployed sync hooks and local PocketBase routes
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_sync_live && chmod 600 ~/.ssh/id_sync_live
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          for f in wesi_sync_data_access.js wesi_sync_context.pb.js wesi_sync_read.pb.js wesi_sync_write.pb.js wesi_sync_extra.pb.js wesi_sync_extra_runtime.js; do
            expected=$(sha256sum "server/pb_hooks/$f" | cut -d' ' -f1)
            actual=$(ssh -i ~/.ssh/id_sync_live -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$USER@$HOST" "sha256sum '/opt/pocketbase/pb_hooks/$f' | cut -d' ' -f1")
            echo "$f source=$expected live=$actual"
            test "$expected" = "$actual"
          done

          ssh -i ~/.ssh/id_sync_live -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/known_hosts "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for path in /api/wesi/sync-v3/revision /api/wesi/sync/organizations /api/wesi/sync-v3/tasks; do
            code=$(curl -sS --max-time 10 -o /tmp/wesi-sync-body -w '%{http_code}' "http://127.0.0.1:8090$path")
            echo "LOCAL $path -> $code"
            test "$code" = 401
          done
          grep -q 'X-WesiOS-Session' /opt/pocketbase/pb_hooks/wesi_sync_context.pb.js
          grep -q '/api/wesi/sync-v3/' /opt/pocketbase/pb_hooks/wesi_sync_context.pb.js
          echo LIVE_SYNC_ROUTER_OK
          REMOTE
      - name: Report success to PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 234 --repo "$GITHUB_REPOSITORY" --body '✅ Live sync connection verified: `api.wesi-inc.ru` responds, legacy and sync-v3 routes are active, unauthenticated probes reach WesiOS middleware (401, not 404), local PocketBase routes match, and deployed sync hook SHA256 values match the branch source.'
