name: Build Forecast Engine Bundles

# Собирает готовые к использованию Python-рантаймы для Prophet и SARIMAX —
# ОДИН РАЗ здесь, в CI, где есть C++ тулчейн для сборки CmdStan (Prophet)
# и быстрый доступ к PyPI. Обычный пользователь их не собирает у себя —
# EngineInstallService в приложении просто скачивает готовый zip с
# GitHub Release и распаковывает.
#
# Не гоняется на каждый push: зависимости движков меняются на порядки реже,
# чем остальной код, а Prophet-бандл компилируется 10+ минут. Раз в месяц
# пересобирается сам (свежие statsmodels/prophet с PyPI), плюс можно
# запустить вручную.
#
# ВАЖНО: пакеты намеренно НЕ запинены по версиям — смысл ежемесячной
# пересборки именно в том, чтобы подтянуть актуальные. Страховка от
# сломанного апстрима — smoke-тест ниже: если свежесобранный движок не
# выдаёт корректный прогноз, публикация не происходит, и у пользователей
# остаётся предыдущая рабочая сборка.
on:
  workflow_dispatch:
  schedule:
    # 4-е число каждого месяца, 03:00 UTC — не 1-е число и не полночь,
    # когда GitHub Actions перегружен задачами по расписанию.
    - cron: '0 3 4 * *'

# Бандлы публикуются как ассеты GitHub Release, а GITHUB_TOKEN по умолчанию
# в этом репозитории только на чтение — без явного contents: write шаг
# публикации падает с «HTTP 403: Resource not accessible by integration»
# уже ПОСЛЕ того, как всё собралось и прошло smoke-тест (Prophet к этому
# моменту компилирует CmdStan десять с лишним минут).
permissions:
  contents: write

env:
  PY_VERSION: '3.11.9'
  RELEASE_TAG: 'engines-v1'
  RELEASE_NOTES: 'Prebuilt Python runtimes for the optional Prophet/SARIMAX forecast engines. The app downloads these on demand (Settings > Forecast Models, or the banner on the Forecast screen) — they are not part of the main installer. manifest.json describes the current build; the app polls it to offer updates.'

jobs:
  build-sarimax:
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-2022' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      size: ${{ steps.meta.outputs.size }}
      packages: ${{ steps.meta.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Download embeddable Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$env:PY_VERSION/python-$env:PY_VERSION-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath python_runtime -Force

      - name: Enable site-packages in the embeddable distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pthFile = Get-ChildItem python_runtime\python*._pth | Select-Object -First 1
          (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName
          Add-Content $pthFile.FullName "`nLib\site-packages"

      - name: Bootstrap pip and install the SARIMAX stack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & python_runtime\python.exe get-pip.py --no-warn-script-location
          & python_runtime\python.exe -m pip install --no-warn-script-location numpy pandas statsmodels

      - name: Smoke test — the freshly built engine must produce a real forecast
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Гоняем ровно тот скрипт, который поедет пользователю, на ровно том
          # рантайме, который собрали. Ловит несовместимость свежих версий
          # пакетов ДО публикации — иначе ежемесячная авто-пересборка могла бы
          # молча выложить сломанный движок.
          $result = Get-Content python_engines\_smoke_test_input.json -Raw | & python_runtime\python.exe python_engines\forecast_sarimax.py
          Write-Host "engine output: $result"
          $parsed = $result | ConvertFrom-Json
          if ($parsed.error) { throw "engine returned an error: $($parsed.error) / $($parsed.detail)" }
          if (-not $parsed.p50 -or $parsed.p50.Count -ne 7) { throw "expected 7 p50 points, got $($parsed.p50.Count)" }
          for ($i = 0; $i -lt 7; $i++) {
            if ($parsed.p10[$i] -gt $parsed.p50[$i] -or $parsed.p50[$i] -gt $parsed.p90[$i]) {
              throw "percentiles out of order at day $i"
            }
          }
          Write-Host "smoke test passed"

      - name: Assemble bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path bundle\python -Force | Out-Null
          Copy-Item python_runtime\* bundle\python -Recurse -Force
          Copy-Item python_engines bundle\python_engines -Recurse -Force
          Compress-Archive -Path bundle\* -DestinationPath wesios-engine-sarimax-win64.zip -Force

      - name: Collect build metadata for the manifest
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = Get-Date -Format 'yyyy.MM.dd'
          $size = (Get-Item wesios-engine-sarimax-win64.zip).Length
          $np = & python_runtime\python.exe -c "import numpy; print(numpy.__version__)"
          $pd = & python_runtime\python.exe -c "import pandas; print(pandas.__version__)"
          $sm = & python_runtime\python.exe -c "import statsmodels; print(statsmodels.__version__)"
          $packages = "{""numpy"":""$np"",""pandas"":""$pd"",""statsmodels"":""$sm""}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          "packages=$packages" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Forecast engine bundles" --notes "$RELEASE_NOTES"
          gh release upload "$RELEASE_TAG" wesios-engine-sarimax-win64.zip --repo "$GITHUB_REPOSITORY" --clobber

  build-prophet:
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-2022' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      size: ${{ steps.meta.outputs.size }}
      packages: ${{ steps.meta.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Download embeddable Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$env:PY_VERSION/python-$env:PY_VERSION-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath python_runtime -Force

      - name: Enable site-packages in the embeddable distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pthFile = Get-ChildItem python_runtime\python*._pth | Select-Object -First 1
          (Get-Content $pthFile.FullName) -replace '#import site', 'import site' | Set-Content $pthFile.FullName
          Add-Content $pthFile.FullName "`nLib\site-packages"

      - name: Bootstrap pip and install the Prophet stack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & python_runtime\python.exe get-pip.py --no-warn-script-location
          & python_runtime\python.exe -m pip install --no-warn-script-location numpy pandas prophet cmdstanpy

      - name: Compile CmdStan once, here (no C++ toolchain on end-user machines)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # forecast_prophet.py находит python/cmdstan/<version>/ сам,
          # относительно своего sys.executable — важно только, чтобы версия
          # оказалась именно тут, в python_runtime\cmdstan.
          & python_runtime\python.exe -m cmdstanpy.install_cmdstan --dir python_runtime\cmdstan

      - name: Smoke test — the freshly built engine must produce a real forecast
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Заодно проверяет самое хрупкое место Prophet-бандла: что
          # forecast_prophet.py действительно находит собранный CmdStan
          # относительно sys.executable. Если бы путь резолвился неправильно,
          # скрипт упал бы здесь, а не у пользователя.
          $result = Get-Content python_engines\_smoke_test_input.json -Raw | & python_runtime\python.exe python_engines\forecast_prophet.py
          Write-Host "engine output: $result"
          $parsed = $result | ConvertFrom-Json
          if ($parsed.error) { throw "engine returned an error: $($parsed.error) / $($parsed.detail)" }
          if (-not $parsed.p50 -or $parsed.p50.Count -ne 7) { throw "expected 7 p50 points, got $($parsed.p50.Count)" }
          for ($i = 0; $i -lt 7; $i++) {
            if ($parsed.p10[$i] -gt $parsed.p50[$i] -or $parsed.p50[$i] -gt $parsed.p90[$i]) {
              throw "percentiles out of order at day $i"
            }
          }
          Write-Host "smoke test passed"

      - name: Assemble bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path bundle\python -Force | Out-Null
          Copy-Item python_runtime\* bundle\python -Recurse -Force
          Copy-Item python_engines bundle\python_engines -Recurse -Force
          Compress-Archive -Path bundle\* -DestinationPath wesios-engine-prophet-win64.zip -Force

      - name: Collect build metadata for the manifest
        id: meta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = Get-Date -Format 'yyyy.MM.dd'
          $size = (Get-Item wesios-engine-prophet-win64.zip).Length
          $np = & python_runtime\python.exe -c "import numpy; print(numpy.__version__)"
          $pd = & python_runtime\python.exe -c "import pandas; print(pandas.__version__)"
          $pr = & python_runtime\python.exe -c "import prophet; print(prophet.__version__)"
          $packages = "{""numpy"":""$np"",""pandas"":""$pd"",""prophet"":""$pr""}"
          "version=$version" >> $env:GITHUB_OUTPUT
          "size=$size" >> $env:GITHUB_OUTPUT
          "packages=$packages" >> $env:GITHUB_OUTPUT

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" || \
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Forecast engine bundles" --notes "$RELEASE_NOTES"
          gh release upload "$RELEASE_TAG" wesios-engine-prophet-win64.zip --repo "$GITHUB_REPOSITORY" --clobber

  publish-manifest:
    # Отдельной задачей после обеих сборок: манифест — это то, по чему
    # приложение решает «есть обновление». Публиковать его должен ровно один
    # исполнитель и только после того, как ОБА бандла успешно собрались и
    # прошли smoke-тест, иначе манифест пообещает версию, которой нет.
    needs: [build-sarimax, build-prophet]
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    steps:
      - name: Build manifest.json
        shell: bash
        run: |
          set -e
          cat > manifest.json <<EOF
          {
            "schema": 1,
            "engines": {
              "sarimax": {
                "version": "${{ needs.build-sarimax.outputs.version }}",
                "asset": "wesios-engine-sarimax-win64.zip",
                "sizeBytes": ${{ needs.build-sarimax.outputs.size }},
                "packages": ${{ needs.build-sarimax.outputs.packages }}
              },
              "prophet": {
                "version": "${{ needs.build-prophet.outputs.version }}",
                "asset": "wesios-engine-prophet-win64.zip",
                "sizeBytes": ${{ needs.build-prophet.outputs.size }},
                "packages": ${{ needs.build-prophet.outputs.packages }}
              }
            }
          }
          EOF
          cat manifest.json
          # Ловим кривой JSON здесь, а не в приложении у пользователя.
          python3 -m json.tool manifest.json > /dev/null

      - name: Publish manifest to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload "$RELEASE_TAG" manifest.json --repo "$GITHUB_REPOSITORY" --clobber
