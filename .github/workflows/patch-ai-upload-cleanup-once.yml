name: Patch AI staged cleanup once

on:
  push:
    paths:
      - '.github/workflows/patch-ai-upload-cleanup-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-client-hardening-chunked
          token: ${{ github.token }}
      - name: Release staged files after one provider request
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          pre = Path('server/wesi-ai-relay/attachment-preprocessor.mjs')
          text = pre.read_text(encoding='utf-8')
          text = text.replace(
              "import {resolveStagedAttachment, STAGED_UPLOAD_MIME} from './staged-upload.mjs';",
              "import {resolveStagedAttachment, STAGED_UPLOAD_MIME, cancelStagedUpload} from './staged-upload.mjs';",
              1,
          )
          marker = "export async function prepareGeminiAttachments(raw, apiKey = '') {"
          helper = """export function deleteStagedUploads(uploadIds) {\n  for (const raw of Array.isArray(uploadIds) ? uploadIds : []) {\n    const uploadId = String(raw || '');\n    if (!uploadId) continue;\n    try { cancelStagedUpload({uploadId}); } catch {}\n  }\n}\n\n"""
          if helper not in text:
              if marker not in text:
                  raise SystemExit('prepare marker not found')
              text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              "  const providerFiles = [];\n  let actualTotalBytes = 0;",
              "  const providerFiles = [];\n  const stagedUploadIds = [];\n  let actualTotalBytes = 0;",
              1,
          )
          text = text.replace(
              "      const item = staged || inlineItem;\n      actualTotalBytes += Number(item.byteSize || 0);",
              "      const item = staged || inlineItem;\n      if (staged?.uploadId) stagedUploadIds.push(staged.uploadId);\n      actualTotalBytes += Number(item.byteSize || 0);",
              1,
          )
          text = text.replace(
              "      return {parts, descriptors, providerFiles};\n    } catch (error) {\n      await deleteGeminiFiles(providerFiles, apiKey);\n      throw error;",
              "      return {parts, descriptors, providerFiles, stagedUploadIds};\n    } catch (error) {\n      await deleteGeminiFiles(providerFiles, apiKey);\n      deleteStagedUploads(stagedUploadIds);\n      throw error;",
              1,
          )
          pre.write_text(text, encoding='utf-8')

          google = Path('server/wesi-ai-relay/google.mjs')
          text = google.read_text(encoding='utf-8')
          text = text.replace(
              "import {prepareGeminiAttachments, deleteGeminiFiles} from './attachment-preprocessor.mjs';",
              "import {prepareGeminiAttachments, deleteGeminiFiles, deleteStagedUploads} from './attachment-preprocessor.mjs';",
              1,
          )
          text = text.replace(
              "  let prepared = {parts: [], providerFiles: []};",
              "  let prepared = {parts: [], providerFiles: [], stagedUploadIds: []};",
              1,
          )
          text = text.replace(
              "  } catch (error) {\n    await deleteGeminiFiles(prepared?.providerFiles, apiKey);",
              "  } catch (error) {\n    await deleteGeminiFiles(prepared?.providerFiles, apiKey);\n    deleteStagedUploads(prepared?.stagedUploadIds);",
              1,
          )
          text = text.replace(
              "  } finally {\n    await deleteGeminiFiles(prepared.providerFiles, apiKey);\n  }",
              "  } finally {\n    await deleteGeminiFiles(prepared.providerFiles, apiKey);\n    deleteStagedUploads(prepared.stagedUploadIds);\n  }",
              1,
          )
          google.write_text(text, encoding='utf-8')
          PY
          node --check server/wesi-ai-relay/attachment-preprocessor.mjs
          node --check server/wesi-ai-relay/google.mjs
          rm .github/workflows/patch-ai-upload-cleanup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/wesi-ai-relay/attachment-preprocessor.mjs server/wesi-ai-relay/google.mjs .github/workflows/patch-ai-upload-cleanup-once.yml
          git commit -m 'fix(ai): release staged attachment storage after request'
          git push origin HEAD:chatgpt/ai-client-hardening-chunked
