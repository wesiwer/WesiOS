name: Validate Wesi AI History Root Cause

on:
  push:
    branches:
      - 'fix/wesi-ai-history-root-cause'
    paths:
      - '.github/workflows/validate-wesi-ai-history-root-cause.yml'

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-history-root-cause
          fetch-depth: 0

      - name: Apply root-cause repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/wesi_ai_history_root_fix.py
          python3 .github/scripts/wesi_ai_history_root_fix.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Validate root-cause repair
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/ai/wesi_ai_api.dart test/features/ai/wesi_ai_response_contract_test.dart test/features/ai/wesi_ai_transport_history_test.dart
          node --check server/pb_hooks/wesi_ai_lib.js
          node --check server/pb_hooks/wesi_ai_routes.pb.js
          node --check server/pb_hooks/wesi_ai_stream.pb.js
          node --check server/pb_hooks/wesi_ai_lobby_core.js
          node --test server/pb_hooks/wesi_ai_lib_history_test.mjs server/pb_hooks/wesi_ai_history_contract_test.mjs server/pb_hooks/wesi_ai_stream_contract_test.mjs server/pb_hooks/wesi_ai_lobby_router_test.mjs server/pb_hooks/wesi_ai_lobby_turn_test.mjs
          flutter pub get
          flutter test test/features/ai/wesi_ai_response_contract_test.dart test/features/ai/wesi_ai_transport_history_test.dart
          flutter analyze lib/features/ai/wesi_ai_api.dart --no-fatal-infos
          ! grep -q 'shouldFallbackFromStreamError' lib/features/ai/wesi_ai_api.dart
          ! grep -q 'Слишком длинное сообщение в контексте' server/pb_hooks/wesi_ai_routes.pb.js
          ! grep -q 'Слишком длинное сообщение в контексте' server/pb_hooks/wesi_ai_stream.pb.js
          grep -q 'P0.2 — межустройственная синхронизация владельца' TZ.md
          grep -q 'P0.3 — авторизация сотрудников' TZ.md

      - name: Commit validated root fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wesiwer'
          git config user.email '77644223+wesiwer@users.noreply.github.com'
          git rm -f .github/workflows/validate-wesi-ai-history-root-cause.yml .github/scripts/wesi_ai_history_root_fix.py
          git add -A
          git commit -m 'fix(ai): repair direct stream history contract root cause'
          git push origin HEAD:fix/wesi-ai-history-root-cause
