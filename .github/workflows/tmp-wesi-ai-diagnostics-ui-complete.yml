name: Temporary Complete Wesi AI Diagnostic UI

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
    paths:
      - .github/workflows/tmp-wesi-ai-diagnostics-ui-complete.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch diagnostic presentation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          api = Path('lib/features/ai/wesi_ai_api.dart')
          text = api.read_text()
          old = """                  stage: 'MAIN',
                  component: 'WesiOS Main',
                  operation: 'chat',
                  lastSuccess: 'CLIENT',"""
          new = """                  stage: response.statusCode == 401 || response.statusCode == 403
                      ? 'AUTH'
                      : 'MAIN',
                  component: response.statusCode == 401 || response.statusCode == 403
                      ? 'WesiOS Auth'
                      : 'WesiOS Main',
                  operation: 'chat',
                  lastSuccess: 'CLIENT',"""
          if old not in text:
              raise SystemExit('main auth classification marker missing')
          text = text.replace(old, new, 1)

          old = """                stage: 'STREAM_GATEWAY',
                component: 'Streaming edge',
                operation: 'chat.stream',
                lastSuccess: 'CLIENT_AUTH',"""
          new = """                stage: response.statusCode == 401 || response.statusCode == 403
                    ? 'AUTH'
                    : 'STREAM_GATEWAY',
                component: response.statusCode == 401 || response.statusCode == 403
                    ? 'Streaming Auth'
                    : 'Streaming edge',
                operation: 'chat.stream',
                lastSuccess: response.statusCode == 401 || response.statusCode == 403
                    ? 'CLIENT'
                    : 'CLIENT_AUTH',"""
          if old not in text:
              raise SystemExit('stream auth classification marker missing')
          text = text.replace(old, new, 1)
          api.write_text(text)

          controller = Path('lib/features/ai/controllers/wesi_ai_chat_controller.dart')
          text = controller.read_text()
          old = """    String streamedToolDetail(Map<String, dynamic> raw) {
      final parts = <String>[];"""
          new = """    String streamedToolDetail(Map<String, dynamic> raw) {
      final parts = <String>[];
      final rawDiagnostic = raw['diagnostic'];
      if (rawDiagnostic is Map) {
        final diagnostic = Map<String, dynamic>.from(rawDiagnostic);
        final stage = '${diagnostic['stage'] ?? ''}'.trim();
        final component = '${diagnostic['component'] ?? ''}'.trim();
        final operation = '${diagnostic['operation'] ?? ''}'.trim();
        final diagnosticCode = '${diagnostic['code'] ?? ''}'.trim();
        final lastSuccess = '${diagnostic['lastSuccess'] ?? ''}'.trim();
        final requestId = '${diagnostic['requestId'] ?? ''}'.trim();
        if (stage.isNotEmpty) parts.add('Этап: $stage');
        if (component.isNotEmpty) parts.add('Компонент: $component');
        if (operation.isNotEmpty) parts.add('Операция: $operation');
        if (diagnosticCode.isNotEmpty) parts.add('Код: $diagnosticCode');
        if (lastSuccess.isNotEmpty) parts.add('После: $lastSuccess');
        if (requestId.isNotEmpty) parts.add('Request ID: $requestId');
      }"""
          if old not in text:
              raise SystemExit('tool diagnostic marker missing')
          text = text.replace(old, new, 1)

          old = """      } else if (type == 'activity') {
        activity.add(activityEntry(
          kind: '${raw['kind'] ?? 'reasoning'}',
          label: '${raw['label'] ?? 'Ход работы'}'.trim(),
          sourceName: name,
          detail: '${raw['detail'] ?? raw['message'] ?? ''}'.trim(),"""
          new = """      } else if (type == 'activity') {
        var detail = '${raw['detail'] ?? raw['message'] ?? ''}'.trim();
        final rawDiagnostic = raw['diagnostic'];
        if (rawDiagnostic is Map) {
          final diagnostic = Map<String, dynamic>.from(rawDiagnostic);
          final diagnosticParts = <String>[
            if ('${diagnostic['stage'] ?? ''}'.trim().isNotEmpty)
              'Этап: ${diagnostic['stage']}',
            if ('${diagnostic['component'] ?? ''}'.trim().isNotEmpty)
              'Компонент: ${diagnostic['component']}',
            if ('${diagnostic['code'] ?? ''}'.trim().isNotEmpty)
              'Код: ${diagnostic['code']}',
            if ('${diagnostic['requestId'] ?? ''}'.trim().isNotEmpty)
              'Request ID: ${diagnostic['requestId']}',
          ];
          final diagnosticText = diagnosticParts.join(' · ');
          if (diagnosticText.isNotEmpty && !detail.contains(diagnosticText)) {
            detail = detail.isEmpty ? diagnosticText : '$detail\n$diagnosticText';
          }
        }
        activity.add(activityEntry(
          kind: '${raw['kind'] ?? 'reasoning'}',
          label: '${raw['label'] ?? 'Ход работы'}'.trim(),
          sourceName: name,
          detail: detail,"""
          if old not in text:
              raise SystemExit('activity diagnostic marker missing')
          controller.write_text(text.replace(old, new, 1))

          test = Path('test/wesi_ai_diagnostics_contract_test.dart')
          text = test.read_text()
          marker = """    expect(error.displayMessage, contains('Request ID: wai_test_123'));
  });"""
          replacement = """    expect(error.displayMessage, contains('Request ID: wai_test_123'));
    final apiSource = File('lib/features/ai/wesi_ai_api.dart').readAsStringSync();
    expect(apiSource, contains("? 'AUTH'"));
    final controllerSource = File('lib/features/ai/controllers/wesi_ai_chat_controller.dart').readAsStringSync();
    expect(controllerSource, contains("'Этап: $stage'"));
    expect(controllerSource, contains("Request ID: $requestId"));
  });"""
          if marker not in text:
              raise SystemExit('diagnostic test marker missing')
          test.write_text(text.replace(marker, replacement, 1))
          PY
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - run: dart format lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart test/wesi_ai_diagnostics_contract_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/wesi_ai_diagnostics_contract_test.dart test/wesi_ai_rich_message_test.dart test/wesi_ai_coagent_activity_test.dart
      - name: Commit verified coverage
        run: |
          git config user.name wesi-ai-ci
          git config user.email wesi-ai-ci@users.noreply.github.com
          git add lib/features/ai/wesi_ai_api.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart test/wesi_ai_diagnostics_contract_test.dart
          git commit -m 'feat(ai): expose auth and tool diagnostics in UI'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
