name: Wesi AI Stage 9 Validate

on:
  push:
    branches: [agent/wesi-ai-stage9-self-debug-artifacts]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage9-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage9-self-debug-artifacts
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Apply Stage 9 hardening
        run: python tool/apply_wesi_ai_stage9_hardening.py
      - name: Format Stage 9
        run: |
          dart format \
            lib/features/ai/runtime/wesi_artifact_models.dart \
            lib/features/ai/runtime/wesi_artifact_validator.dart \
            lib/features/ai/runtime/wesi_artifact_delivery.dart \
            lib/features/ai/runtime/wesi_self_debug_engine.dart \
            lib/features/ai/runtime/wesi_self_debug_job_observer.dart \
            test/wesi_artifact_validator_test.dart \
            test/wesi_self_debug_engine_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Stage 6-9 runtime regressions
        run: |
          flutter test \
            test/wesi_local_runtime_test.dart \
            test/wesi_environment_scanner_test.dart \
            test/wesi_runtime_pack_security_test.dart \
            test/wesi_resource_scheduler_test.dart \
            test/wesi_job_queue_test.dart \
            test/wesi_job_coordinator_test.dart \
            test/wesi_artifact_validator_test.dart \
            test/wesi_self_debug_engine_test.dart
      - name: Commit validated Stage 9 tree and cleanup one-shot CI
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/wesi-ai-stage9-validate.yml tool/apply_wesi_ai_stage9_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/WESI_AI_STAGE_TRACKER.md \
            docs/WESI_AI_SELF_DEBUG_ARTIFACTS.md \
            lib/features/ai/runtime/wesi_artifact_models.dart \
            lib/features/ai/runtime/wesi_artifact_validator.dart \
            lib/features/ai/runtime/wesi_artifact_delivery.dart \
            lib/features/ai/runtime/wesi_self_debug_engine.dart \
            lib/features/ai/runtime/wesi_self_debug_job_observer.dart \
            test/wesi_artifact_validator_test.dart \
            test/wesi_self_debug_engine_test.dart
          git add -u .github/workflows/wesi-ai-stage9-validate.yml tool/apply_wesi_ai_stage9_hardening.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(ai): validate Stage 9 self-debug and artifacts"
          git push origin HEAD:agent/wesi-ai-stage9-self-debug-artifacts
