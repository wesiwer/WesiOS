name: One-time Android Updater Fix Release

on:
  push:
    paths:
      - '.github/owner-email-release.trigger'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch WesiOS 0.19.21 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/org-hierarchy-remediation-1 \
            -f notes='Исправлено Android-обновление: версия приложения и номер сборки теперь совпадают с реально выпускаемым APK; добавлена защита от повторного рассинхрона версий.' \
            -f deploy_to_server=true
          echo 'Publish WesiOS Release dispatched.'
