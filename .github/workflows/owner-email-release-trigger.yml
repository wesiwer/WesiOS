name: One-time Android Updater Server Deploy

on:
  push:
    paths:
      - '.github/owner-email-release.trigger'

permissions:
  contents: read

jobs:
  deploy-current-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
          fetch-depth: 1

      - name: Download published release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p upload
          gh release download app-latest --repo "$GITHUB_REPOSITORY" \
            --pattern 'wesios-android.apk' \
            --pattern 'wesios-windows-x64.zip' \
            --dir upload --clobber
          test -s upload/wesios-android.apk
          test -s upload/wesios-windows-x64.zip

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy 0.19.21+69 to PocketBase public artifacts
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          TMP="/tmp/wesios-updater-fix-$GITHUB_RUN_ID"
          $SSH "$USER@$HOST" "mkdir -p '$TMP'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            upload/wesios-windows-x64.zip \
            upload/wesios-android.apk \
            server/deploy-artifact.sh \
            "$USER@$HOST:$TMP/"
          $SSH "$USER@$HOST" \
            "WESI_ARTIFACTS='/opt/pocketbase/pb_public/artifacts' bash '$TMP/deploy-artifact.sh' --version '0.19.21' --build '69' --from '$TMP' --notes-b64 '0JjRgdC/0YDQsNCy0LvQtdC90L4gQW5kcm9pZC3QvtCx0L3QvtCy0LvQtdC90LjQtTog0LLQtdGA0YHQuNGPINGB0L7QstC/0LDQtNCw0LXRgiDRgSDRgNC10LDQu9GM0L3QvtC5INGB0LHQvtGA0LrQvtC5Lg=='"
          $SSH "$USER@$HOST" "rm -rf '$TMP'"

      - name: Verify production manifest
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://api.wesi-inc.ru/artifacts/app/app-manifest.json -o manifest.json
          cat manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('manifest.json'))
          assert m['version']=='0.19.21', m
          assert int(m['build'])==69, m
          assert m['android']['version']=='0.19.21', m
          assert int(m['android']['build'])==69, m
          print('production manifest is 0.19.21+69')
          PY
