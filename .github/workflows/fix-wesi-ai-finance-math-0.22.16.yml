name: Fix Wesi AI Finance Math 0.22.16

on:
  push:
    branches:
      - release/0.22.16-91
    paths:
      - .github/workflows/fix-wesi-ai-finance-math-0.22.16.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.22.16-91
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Apply exact patch
        run: python3 tools/release_fix_0_22_16.py

      - name: Format Dart
        run: dart format lib/features/ai/widgets/wesi_ai_rich_message.dart lib/features/ai/wesi_ai_api.dart test/wesi_ai_rich_message_test.dart

      - name: Flutter dependencies
        run: flutter pub get

      - name: Rich message regression
        run: flutter test test/wesi_ai_rich_message_test.dart

      - name: Finance nonzero regression
        run: node server/pb_hooks/wesi_ai_finance_tools_test.mjs

      - name: Verify diff
        run: |
          git diff --check
          grep -F "'activeOrganizationId': activeOrganizationId" lib/features/ai/wesi_ai_api.dart
          grep -F '"id", 1000, 0' server/pb_hooks/wesi_ai_finance_policy.js
          ! grep -F '"id", 0, 0' server/pb_hooks/wesi_ai_finance_policy.js

      - name: Commit verified fixes
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/ai/widgets/wesi_ai_rich_message.dart lib/features/ai/wesi_ai_api.dart server/pb_hooks/wesi_ai_finance_policy.js server/pb_hooks/wesi_ai_finance_tools_test.mjs test/wesi_ai_rich_message_test.dart
          git commit -m 'fix: render Wesi AI math and honor active finance organization'
          git push origin HEAD:release/0.22.16-91
