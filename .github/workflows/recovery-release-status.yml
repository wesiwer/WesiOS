name: One-time Recovery Release Status Probe

on:
  push:
    paths:
      - '.github/recovery-status.trigger'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture release run status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 3
          DATA="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-app.yml --limit 3 --json databaseId,status,conclusion,headSha,createdAt,url,displayTitle)"
          printf '%s\n' "$DATA"
          CONTENT="$(printf '%s\n' "$DATA" | base64 -w0)"
          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/contents/.github/recovery-release-status-57.json" \
            -f message='Capture recovery release status' \
            -f content="$CONTENT" \
            -f branch='main'
