name: One-time owner email fix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch owner security email field
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/features/profile/widgets/credentials_card.dart')
          s = p.read_text()

          old = """    final password = TextEditingController();
    final confirmation = TextEditingController();
    var visible = false;
"""
          new = """    final password = TextEditingController();
    final confirmation = TextEditingController();
    var visible = false;
    final canEditEmail = !PortalAccountService.validSecurityEmail(initialEmail);
"""
          if old not in s:
              raise SystemExit('credentials marker 1 not found')
          s = s.replace(old, new, 1)

          old = """                  Text(
                    _ru
                        ? 'Почта для кодов уже подтверждена и защищена. Здесь можно изменить логин или пароль.'
                        : 'The security email is verified and locked. You can change login or password here.',
                    style: TextStyle(fontSize: 12, height: 1.45, color: AppTheme.textMuted),
                  ),
"""
          new = """                  Text(
                    canEditEmail
                        ? (_ru
                            ? 'Для этого профиля ещё не настроена подтверждённая почта для кодов. Укажите её вместе с новым логином и паролем.'
                            : 'This profile does not have a verified security email yet. Enter it together with the new login and password.')
                        : (_ru
                            ? 'Почта для кодов уже подтверждена и защищена. Здесь можно изменить логин или пароль.'
                            : 'The security email is verified and locked. You can change login or password here.'),
                    style: TextStyle(fontSize: 12, height: 1.45, color: AppTheme.textMuted),
                  ),
"""
          if old not in s:
              raise SystemExit('credentials marker 2 not found')
          s = s.replace(old, new, 1)

          old = """                  _dialogField(
                    controller: email,
                    label: _ru ? 'Подтверждённая почта для кодов' : 'Verified security email',
                    hint: 'name@example.com',
                    keyboard: TextInputType.emailAddress,
                  enabled: false,
                  ),
"""
          new = """                  _dialogField(
                    controller: email,
                    label: canEditEmail
                        ? (_ru ? 'Почта для кодов' : 'Security email')
                        : (_ru ? 'Подтверждённая почта для кодов' : 'Verified security email'),
                    hint: 'name@example.com',
                    keyboard: TextInputType.emailAddress,
                    enabled: canEditEmail,
                  ),
"""
          if old not in s:
              raise SystemExit('credentials marker 3 not found')
          s = s.replace(old, new, 1)

          old = """                            : (_ru ? 'Изменить логин или пароль' : 'Change login or password'),
"""
          new = """                            : (me != null && !PortalAccountService.validSecurityEmail(me.email)
                                ? (_ru ? 'Настроить защищённый вход' : 'Set up secure sign-in')
                                : (_ru ? 'Изменить логин или пароль' : 'Change login or password')),
"""
          if old not in s:
              raise SystemExit('credentials marker 4 not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

          pub = Path('pubspec.yaml')
          text = pub.read_text()
          old_version = 'version: 0.19.9+57'
          if old_version not in text:
              raise SystemExit('pubspec version marker not found')
          pub.write_text(text.replace(old_version, 'version: 0.19.10+58', 1))
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/profile/widgets/credentials_card.dart pubspec.yaml
          git commit -m 'fix: allow owner to set initial security email'
          git push origin HEAD:main

      - name: Dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='Исправлена первичная настройка почты владельца после recovery-входа.' \
            -f deploy_to_server=false
          echo 'Publish WesiOS Release dispatched.'
