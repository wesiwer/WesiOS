name: Dispatch WesiOS Release

on:
  push:
    branches:
      - 'release-dispatch/**'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production release on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='Wesi AI: новый интерфейс чата и непрерываемая очередь сообщений' \
            -f deploy_to_server=true
