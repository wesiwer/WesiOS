name: Patch AI upload hardening once

on:
  push:
    paths:
      - '.github/workflows/patch-ai-upload-hardening-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ai-client-hardening-chunked
          token: ${{ github.token }}
      - name: Harden staged upload limits and cleanup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main = Path('server/pb_hooks/wesi_ai_upload_routes.pb.js')
          text = main.read_text(encoding='utf-8')
          old = 'if (!Array.isArray(bytes) || bytes.length !== expected) {'
          new = 'if (!bytes || typeof bytes.length !== "number" || bytes.length !== expected) {'
          if old not in text:
              raise SystemExit('Main chunk validation target not found')
          main.write_text(text.replace(old, new, 1), encoding='utf-8')

          pre = Path('server/wesi-ai-relay/attachment-preprocessor.mjs')
          text = pre.read_text(encoding='utf-8')
          marker = 'const MAX_STAGED_TEXT_READ_BYTES = 2 * 1024 * 1024;\n'
          if marker not in text:
              raise SystemExit('preprocessor constant marker not found')
          text = text.replace(
              marker,
              marker + 'const MAX_STAGED_TOTAL_ATTACHMENT_BYTES = 512 * 1024 * 1024;\n',
              1,
          )
          start = text.index("export async function prepareGeminiAttachments(raw, apiKey = '') {")
          replacement = r'''export async function prepareGeminiAttachments(raw, apiKey = '') {
            const inlineItems = sanitizeAttachments(raw);
            const parts = [];
            const descriptors = [];
            const providerFiles = [];
            let actualTotalBytes = 0;
            try {
              for (const inlineItem of inlineItems) {
                const staged = inlineItem.mimeType === STAGED_UPLOAD_MIME ? resolveStagedAttachment(inlineItem) : null;
                const item = staged || inlineItem;
                actualTotalBytes += Number(item.byteSize || 0);
                if (actualTotalBytes > MAX_STAGED_TOTAL_ATTACHMENT_BYTES) {
                  throw new Error('WAI_UPLOAD_BATCH_TOO_LARGE');
                }
                descriptors.push({name: item.name, mimeType: item.mimeType, byteSize: item.byteSize});
                if (isNativeProviderFile(item)) {
                  parts.push({text: `\n[WESI_AI_ATTACHMENT name=${JSON.stringify(item.name)} mime=${JSON.stringify(item.mimeType)} size=${item.byteSize}]`});
                  if (item.filePath) {
                    const providerFile = await uploadGeminiFile(item, apiKey);
                    providerFiles.push(providerFile.name);
                    parts.push({fileData: {mimeType: item.mimeType, fileUri: providerFile.uri}});
                  } else {
                    parts.push({inlineData: {mimeType: item.mimeType, data: item.bytes.toString('base64')}});
                  }
                  continue;
                }
                const sample = item.filePath ? await stagedPrefix(item) : item.bytes;
                if (TEXT_EXTENSIONS.has(item.extension) || item.mimeType.startsWith('text/') || mostlyText(sample)) {
                  parts.push({text: `\n[WESI_AI_ATTACHMENT_TEXT ${item.name}]\n${decodeText(sample)}`});
                  continue;
                }
                if (ARCHIVE_EXTENSIONS.has(item.extension) || OFFICE_EXTENSIONS.has(item.extension) || /zip|rar|7z|tar|gzip|bzip|xz|officedocument|opendocument|epub/.test(item.mimeType)) {
                  parts.push({text: `\n[WESI_AI_ATTACHMENT_CONTAINER ${item.name}]\n${await extractContainer(item)}`});
                  continue;
                }
                parts.push({text: `\n[WESI_AI_ATTACHMENT_BINARY ${item.name}]\n${await genericBinarySummary(item)}`});
              }
              return {parts, descriptors, providerFiles};
            } catch (error) {
              await deleteGeminiFiles(providerFiles, apiKey);
              throw error;
            }
          }
          '''.lstrip()
          pre.write_text(text[:start] + replacement, encoding='utf-8')
          PY
          node --check server/pb_hooks/wesi_ai_upload_routes.pb.js
          node --check server/wesi-ai-relay/attachment-preprocessor.mjs
          rm .github/workflows/patch-ai-upload-hardening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/pb_hooks/wesi_ai_upload_routes.pb.js server/wesi-ai-relay/attachment-preprocessor.mjs .github/workflows/patch-ai-upload-hardening-once.yml
          git commit -m 'fix(ai): harden staged upload resource boundaries'
          git push origin HEAD:chatgpt/ai-client-hardening-chunked
