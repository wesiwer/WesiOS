name: Repair production revision hook direct once
# trigger: deploy handler-scoped revision fix 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-sync-revision-direct-once.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate revision hooks
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_sync_revision.pb.js
          node --check server/pb_hooks/wesi_sync_revision.js
          test "$(grep -Fc 'const revision = require(`${__hooks}/wesi_sync_revision.js`);' server/pb_hooks/wesi_sync_revision.pb.js)" -eq 3
          ! grep -Fq 'function touchRevision(e)' server/pb_hooks/wesi_sync_revision.pb.js
      - name: Install exact main revision hooks
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/known_hosts
          REMOTE="/tmp/wesi-revision-$GITHUB_RUN_ID"
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes server/pb_hooks/wesi_sync_revision.pb.js server/pb_hooks/wesi_sync_revision.js "$USER@$HOST:$REMOTE/"
          $SSH "$USER@$HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          DIR=/opt/pocketbase/pb_hooks
          install_one(){ src="$1"; dst="$2"; if [ -w "$dst" ]; then cat "$src" > "$dst"; chmod 0644 "$dst"; elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then sudo -n install -m 0644 "$src" "$dst"; else exit 30; fi; }
          install_one "$REMOTE/wesi_sync_revision.js" "$DIR/wesi_sync_revision.js"
          install_one "$REMOTE/wesi_sync_revision.pb.js" "$DIR/wesi_sync_revision.pb.js"
          sleep 3
          cmp -s "$REMOTE/wesi_sync_revision.js" "$DIR/wesi_sync_revision.js"
          cmp -s "$REMOTE/wesi_sync_revision.pb.js" "$DIR/wesi_sync_revision.pb.js"
          test "$(grep -Fc 'const revision = require(`${__hooks}/wesi_sync_revision.js`);' "$DIR/wesi_sync_revision.pb.js")" -eq 3
          ! grep -Fq 'function touchRevision(e)' "$DIR/wesi_sync_revision.pb.js"
          rm -rf "$REMOTE"
          echo REVISION_HANDLER_SCOPE_FIX_DEPLOYED
          REMOTE_SCRIPT
