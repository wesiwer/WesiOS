name: Patch security tests once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/patch-security-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/security-2fa-sessions-real-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
          fetch-depth: 1
      - name: Add revocable session id to legacy tests
        shell: python
        run: |
          from pathlib import Path

          for name in ('test/chat_service_test.dart', 'test/sync_engine_test.dart'):
              path = Path(name)
              lines = path.read_text(encoding='utf-8').splitlines(True)
              out = []
              in_save = False
              has_session = False
              changed = 0
              for line in lines:
                  if 'SyncEndpoint.saveSession(' in line:
                      in_save = True
                      has_session = False
                  if in_save and 'sessionId:' in line:
                      has_session = True
                  if in_save and 'expiresAt:' in line and not has_session:
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(f"{indent}sessionId: 'test-session',\n")
                      changed += 1
                      has_session = True
                  out.append(line)
                  if in_save and ');' in line:
                      in_save = False
              path.write_text(''.join(out), encoding='utf-8')
              print(name, 'patched calls:', changed)

      - name: Commit exact test compatibility update
        run: |
          set -euo pipefail
          git diff --check
          git diff -- test/chat_service_test.dart test/sync_engine_test.dart
          test -n "$(git status --porcelain test/chat_service_test.dart test/sync_engine_test.dart)"
          git config user.name 'WesiOS Security CI'
          git config user.email 'actions@users.noreply.github.com'
          git add test/chat_service_test.dart test/sync_engine_test.dart
          git commit -m 'test: require revocable session ids'
          git push origin HEAD:${{ github.head_ref }}
