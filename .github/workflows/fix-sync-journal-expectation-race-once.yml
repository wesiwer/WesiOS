name: Fix Sync Journal Expectation Race Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sync-journal-expectation-race-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply journal race repair
        run: python3 .github/scripts/fix-sync-journal-expectation-race.py
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format touched Dart
        run: dart format lib/core/sync/sync_journal.dart lib/core/sync/sync_engine.dart test/sync_receive_regression_test.dart test/sync_journal_expectation_race_test.dart
      - name: Run core sync regressions
        run: |
          flutter test test/sync_journal_expectation_race_test.dart test/sync_receive_regression_test.dart test/sync_engine_test.dart test/sync_multi_device_test.dart test/sync_corruption_guard_test.dart test/organization_sync_integrity_test.dart
      - name: Analyze touched core
        run: flutter analyze lib/core/sync/sync_journal.dart lib/core/sync/sync_engine.dart test/sync_receive_regression_test.dart test/sync_journal_expectation_race_test.dart --no-fatal-infos
      - name: Validate diff
        run: git diff --check
      - name: Commit validated repair
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Sync Core Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/sync/sync_journal.dart lib/core/sync/sync_engine.dart test/sync_receive_regression_test.dart test/sync_journal_expectation_race_test.dart
          git diff --cached --check
          git commit -m 'fix(sync): suppress asynchronous remote apply bounce'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

