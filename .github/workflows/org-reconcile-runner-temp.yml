name: Temporary org reconciliation runner

on:
  push:
    branches: [chatgpt/org-main-v2]
    paths: ['org-reconcile-trigger.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-main-v2
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/org-hierarchy-remediation-1 --depth=1
          git show FETCH_HEAD:lib/features/organizations/widgets/organization_access_editor.dart > lib/features/organizations/widgets/organization_access_editor.dart
          python3 - <<'PY'
          from pathlib import Path

          # Contacts and Organizations must use the same remediated editor.
          p = Path('lib/features/team/contacts_screen.dart')
          s = p.read_text()
          block = '''    final grant = (await OrganizationAccessService.grantsFor(employee.id))\n        .where((g) => g.organizationId == organization!.id)\n        .firstOrNull;\n    if (!mounted) return;\n    final changed = await OrganizationAccessEditor.show(\n      context,\n      organization: organization,\n      employee: employee,\n      initialGrant: grant,\n    );'''
          repl = '''    if (!mounted) return;\n    final changed = await OrganizationAccessEditor.open(\n      context,\n      organization: organization,\n      employee: employee,\n    );'''
          if block not in s: raise SystemExit('contacts access block not found')
          p.write_text(s.replace(block, repl, 1))

          # Preserve calendar-day semantics from current main while keeping org scope.
          p = Path('lib/features/treasury/services/horizon_business_context.dart')
          s = p.read_text()
          if "import 'calendar_days.dart';" not in s:
              # Insert beside local service imports if previous temp import disappeared.
              s = "import 'calendar_days.dart';\n" + s
          s = s.replace('final end = today.add(Duration(days: days));', 'final end = addDays(today, days);')
          s = s.replace('max(0, today.difference(due).inDays)', 'max(0, dayDiff(due, today))')
          p.write_text(s)

          p = Path('lib/features/treasury/services/horizon_engine_competition.dart')
          s = p.read_text()
          if "import 'calendar_days.dart';" not in s:
              s = "import 'calendar_days.dart';\n" + s
          s = s.replace("final asOf = DateTime(today.year, today.month, today.day)\n            .subtract(Duration(days: offset));", "final asOf = addDays(today, -offset);")
          s = s.replace('final target = asOf.add(Duration(days: i + 1));', 'final target = addDays(asOf, i + 1);')
          p.write_text(s)

          p = Path('lib/features/treasury/services/horizon_prediction_registry.dart')
          s = p.read_text()
          if "import 'calendar_days.dart';" not in s:
              s = "import 'calendar_days.dart';\n" + s
          s = s.replace('targetDate: issued.add(Duration(days: horizon)),', 'targetDate: addDays(issued, horizon),')
          p.write_text(s)
          PY
          rm -f org-ci-trigger.txt org-reconcile-trigger.txt
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: unify org access editor and preserve calendar semantics'
          git push origin HEAD:chatgpt/org-main-v2
