name: Check WesiOS production mail

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    if: github.head_ref == 'ci/check-production-mail'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Diagnose self-hosted mail transport and exact DNS records
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "=== SERVICES ==="
          printf 'postfix='; systemctl is-active postfix 2>/dev/null || true
          printf 'opendkim='; systemctl is-active opendkim 2>/dev/null || true
          printf 'pocketbase='; systemctl is-active pocketbase.service 2>/dev/null || true
          printf 'sendmail='; command -v sendmail || true

          echo "=== POSTFIX ==="
          postconf -h myhostname 2>/dev/null | sed 's/^/myhostname=/' || true
          postconf -h inet_interfaces 2>/dev/null | sed 's/^/inet_interfaces=/' || true
          postconf -h relayhost 2>/dev/null | sed 's/^/relayhost=/' || true
          postconf -h non_smtpd_milters 2>/dev/null | sed 's/^/milters=/' || true

          echo "=== NETWORK ==="
          PUBLIC_IP=$(curl -4fsS --max-time 10 https://api.ipify.org 2>/dev/null || true)
          echo "PUBLIC_IP=$PUBLIC_IP"
          if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/gmail-smtp-in.l.google.com/25' 2>/dev/null; then
            echo 'OUTBOUND_TCP25=OPEN'
          else
            echo 'OUTBOUND_TCP25=BLOCKED'
          fi

          echo "=== DNS_CURRENT ==="
          printf 'NS='; dig +short NS wesi-inc.ru 2>/dev/null | paste -sd, - || true
          printf 'A_mail='; dig +short A mail.wesi-inc.ru 2>/dev/null | paste -sd, - || true
          printf 'PTR='; [ -n "$PUBLIC_IP" ] && dig +short -x "$PUBLIC_IP" 2>/dev/null | paste -sd, - || true
          printf 'SPF='; dig +short TXT wesi-inc.ru 2>/dev/null | grep -i 'v=spf1' | paste -sd' ' - || true
          printf 'DKIM='; dig +short TXT wesios._domainkey.wesi-inc.ru 2>/dev/null | paste -sd' ' - || true
          printf 'DMARC='; dig +short TXT _dmarc.wesi-inc.ru 2>/dev/null | paste -sd' ' - || true

          echo "=== DNS_REQUIRED ==="
          echo "A_NAME=mail"
          echo "A_VALUE=$PUBLIC_IP"
          echo "SPF_NAME=@"
          echo "SPF_VALUE=v=spf1 ip4:$PUBLIC_IP -all"
          echo "DKIM_NAME=wesios._domainkey"
          DKIM_FILE=/etc/opendkim/keys/wesi-inc.ru/wesios.txt
          DKIM_RAW=''
          if [ -r "$DKIM_FILE" ]; then
            DKIM_RAW=$(cat "$DKIM_FILE")
          elif command -v sudo >/dev/null 2>&1 && sudo -n test -r "$DKIM_FILE" 2>/dev/null; then
            DKIM_RAW=$(sudo -n cat "$DKIM_FILE" 2>/dev/null)
            echo 'DKIM_READ_MODE=sudo-read-public-txt'
          fi
          if [ -n "$DKIM_RAW" ]; then
            DKIM_VALUE=$(printf '%s' "$DKIM_RAW" | tr -d '\n\t\"' | sed -E 's/^[^(]*\((.*)\)[^)]*$/\1/' | sed -E 's/[[:space:]]+//g')
            echo "DKIM_VALUE=$DKIM_VALUE"
          else
            echo "DKIM_VALUE=UNREADABLE_BY_DEPLOY_USER"
          fi
          echo "DMARC_NAME=_dmarc"
          echo "DMARC_VALUE=v=DMARC1; p=quarantine; rua=mailto:postmaster@wesi-inc.ru; adkim=s; aspf=s"

          echo "=== QUEUE ==="
          mailq 2>/dev/null | tail -n 12 || true
          REMOTE

      - name: Check WesiOS mail readiness endpoint
        run: |
          set -euo pipefail
          code=$(curl -sS -o mail-ready.json -w '%{http_code}' --max-time 20 https://api.wesi-inc.ru/api/wesi/auth/mail-ready || true)
          echo "HTTP=$code"
          cat mail-ready.json 2>/dev/null || true
