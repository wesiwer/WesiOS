name: Verify WesiOS Windows Installer

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-and-wait:
    if: github.head_ref == 'ci/test-windows-installer'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Dispatch installer workflow and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          gh workflow run publish-windows-installer.yml \
            --repo "$GITHUB_REPOSITORY" --ref main

          run_id=''
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=50")
            run_id=$(printf '%s' "$runs" | jq -r \
              --argjson started "$started" \
              '[.workflow_runs[] | select(.name == "Publish WesiOS Windows Installer") | select((.created_at | fromdateiso8601) >= ($started - 5))] | sort_by(.created_at) | last | .id // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo '::error::Installer workflow run not found'; exit 1; }
          echo "installer_run_id=$run_id"

          for attempt in $(seq 1 140); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            echo "attempt=$attempt status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::Installer workflow completed with $conclusion"
              exit 1
            fi
            sleep 15
          done
          echo '::error::Timed out waiting for installer workflow'
          exit 1
