name: Org access contacts finalizer temp

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'chatgpt/org-access-contacts-ux-20260812'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-access-contacts-ux-20260812
          fetch-depth: 0

      - name: Apply access and Contacts UX patch
        run: python3 .github/scripts/org_access_contacts_ux.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format
        run: |
          dart format \
            lib/features/organizations/widgets/organization_access_editor.dart \
            lib/features/organizations/organizations_screen.dart \
            lib/features/team/contacts_screen.dart \
            test/organization_ui_contract_test.dart

      - name: Commit patched product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/organizations/widgets/organization_access_editor.dart \
                  lib/features/organizations/organizations_screen.dart \
                  lib/features/team/contacts_screen.dart \
                  test/organization_ui_contract_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'feat(org): simplify access controls and organization contacts [skip ci]'
            git push origin HEAD:chatgpt/org-access-contacts-ux-20260812
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Full test suite
        run: flutter test
