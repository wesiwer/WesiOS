name: Deploy employee portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/employee-portal/**'
      - 'server/pb_hooks/employee_portal.pb.js'
      - 'server/pb_hooks/employee_portal_static.pb.js'
      - 'server/deploy-employee-portal.sh'
      - 'assets/images/app_icon.png'
      - '.github/workflows/deploy-employee-portal.yml'

permissions:
  contents: read

concurrency:
  group: employee-portal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: employee-portal
      url: https://api.wesi-inc.ru/portal/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate portal assets and hooks
        run: |
          set -euo pipefail
          test -s server/employee-portal/index.html
          test -s server/employee-portal/styles.css
          test -s server/employee-portal/portal-v6.css
          test -s server/employee-portal/app.js
          test -s server/employee-portal/motion-v6.js
          test -s server/pb_hooks/employee_portal.pb.js
          test -s server/pb_hooks/employee_portal_static.pb.js
          test -s assets/images/app_icon.png
          grep -q './app_icon.png' server/employee-portal/index.html
          grep -q 'portal-v6.css' server/employee-portal/index.html
          grep -q 'motion-v6.js' server/employee-portal/index.html
          grep -q 'siteBoot' server/employee-portal/index.html
          grep -q 'runnerBack' server/employee-portal/index.html
          grep -q 'runnerFront' server/employee-portal/index.html
          grep -q 'scrollProgress' server/employee-portal/index.html
          grep -q 'id="requirementsTrigger"' server/employee-portal/index.html
          grep -q 'id="productInfo"' server/employee-portal/index.html
          grep -q 'Системные требования' server/employee-portal/index.html
          grep -q 'offset-path' server/employee-portal/portal-v6.css
          grep -q '/api/collections/users/auth-with-password' server/employee-portal/app.js
          grep -q 'data-theme="light"' server/employee-portal/styles.css
          grep -q 'themeSwitch' server/employee-portal/index.html
          grep -q "localStorage.getItem('wesi-theme')" server/employee-portal/index.html
          grep -q 'id="wesiMark"' server/employee-portal/index.html
          test "$(grep -o 'href="#wesiMark"' server/employee-portal/index.html | wc -l)" -eq 6
          grep -q -- '--logo-ink' server/employee-portal/styles.css
          grep -q 'background:var(--bg,' server/deploy-employee-portal.sh
          ! grep -v '^[[:space:]]*#' server/deploy-employee-portal.sh \
            | grep -q 'html,body{background:#'

          node --check server/employee-portal/app.js
          node --check server/employee-portal/motion-v6.js
          node --check server/pb_hooks/employee_portal.pb.js
          node --check server/pb_hooks/employee_portal_static.pb.js

          for marker in \
            '/api/wesi/app/bootstrap' \
            '/api/wesi/portal/profile/credentials' \
            '/api/wesi/portal/employees/provision' \
            '/api/wesi/portal/employees/access' \
            '/api/wesi/portal/employees/revoke'; do
            grep -q "$marker" server/pb_hooks/employee_portal.pb.js
          done
          grep -q 'portal-account:' server/pb_hooks/employee_portal.pb.js
          ! grep -q '^function portal' server/pb_hooks/employee_portal.pb.js
          ! grep -q 'portalOwnerOnly' server/pb_hooks/employee_portal.pb.js

      - name: Check server secrets
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${HOST:-}" ] || { echo '::error::Нет WESI_SERVER_HOST'; exit 1; }
          [ -n "${USER:-}" ] || { echo '::error::Нет WESI_SERVER_USER'; exit 1; }
          [ -n "${KEY:-}" ] || { echo '::error::Нет WESI_SERVER_SSH_KEY'; exit 1; }

      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and publish portal
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          CONFIGURED_ARTIFACTS_DIR: ${{ vars.WESI_ARTIFACTS_DIR }}
          PORTAL_DIR: ${{ vars.WESI_PORTAL_DIR }}
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE="/tmp/wesi-portal-$GITHUB_RUN_ID"
          if [ -n "${CONFIGURED_ARTIFACTS_DIR:-}" ]; then
            ARTIFACTS_DIR="$CONFIGURED_ARTIFACTS_DIR"
          else
            ARTIFACTS_DIR=$($SSH "$USER@$HOST" 'for d in /srv/wesi-artifacts /opt/pocketbase/pb_public/artifacts; do if [ -d "$d" ] && [ -w "$d" ]; then printf "%s" "$d"; exit 0; fi; done; exit 1')
          fi
          echo "Production artifacts root: $ARTIFACTS_DIR"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          cp assets/images/app_icon.png server/employee-portal/app_icon.png
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            server/employee-portal/index.html \
            server/employee-portal/styles.css \
            server/employee-portal/portal-v6.css \
            server/employee-portal/app.js \
            server/employee-portal/motion-v6.js \
            server/employee-portal/app_icon.png \
            server/pb_hooks/employee_portal.pb.js \
            server/pb_hooks/employee_portal_static.pb.js \
            server/deploy-employee-portal.sh \
            "$USER@$HOST:$REMOTE/"
          $SSH "$USER@$HOST" \
            "WESI_ARTIFACTS_DIR='$ARTIFACTS_DIR' WESI_PORTAL_DIR='${PORTAL_DIR:-}' bash '$REMOTE/deploy-employee-portal.sh' --from '$REMOTE'"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE'"

      - name: Verify deployed portal and auth routes
        run: |
          set -euo pipefail
          BASE='https://api.wesi-inc.ru/portal/'
          API='https://api.wesi-inc.ru'
          curl -fsS --max-time 30 "${BASE}?v=${GITHUB_SHA}" -o portal.html
          grep -q 'WesiOS' portal.html
          grep -q 'siteBoot' portal.html
          grep -q 'runnerFront' portal.html
          grep -q 'scrollProgress' portal.html
          grep -q 'offset-path' portal.html
          grep -q 'data-theme="light"' portal.html
          grep -q 'themeSwitch' portal.html
          grep -q "localStorage.getItem('wesi-theme')" portal.html
          grep -q 'id="wesiMark"' portal.html
          grep -q -- '--logo-ink' portal.html
          grep -q 'id="requirementsTrigger"' portal.html || {
            echo '::error::Production всё ещё отдаёт старый портал: нет requirementsTrigger'; exit 1; }
          grep -q 'id="productInfo"' portal.html || {
            echo '::error::Production всё ещё отдаёт старый портал: нет productInfo'; exit 1; }
          grep -q 'Системные требования' portal.html

          CACHE=$(curl -fsSI --max-time 20 "${BASE}" | tr -d '\r' | grep -i '^cache-control:' || true)
          case "$CACHE" in
            *no-cache*|*no-store*) echo 'Кеш не даст показать старую страницу.' ;;
            *) echo '::error::Нет Cache-Control — браузер будет держать старую версию часами'; exit 1 ;;
          esac

          curl -fsS --max-time 30 "${BASE}motion-v6.js?v=${GITHUB_SHA}" -o motion-v6.js
          node --check motion-v6.js
          test "$(wc -c < motion-v6.js)" -gt 1000
          curl -fsS --max-time 30 "${BASE}app_icon.png?v=${GITHUB_SHA}" -o app_icon.png
          test "$(wc -c < app_icon.png)" -gt 1000

          check_protected_route() {
            local method="$1" path="$2" code
            if [ "$method" = GET ]; then
              code=$(curl -sS -o route-response.txt -w '%{http_code}' --max-time 20 \
                -X GET "$API$path" || true)
            else
              code=$(curl -sS -o route-response.txt -w '%{http_code}' --max-time 20 \
                -X "$method" -H 'Content-Type: application/json' -d '{}' "$API$path" || true)
            fi
            case "$code" in
              401|403) echo "Маршрут защищён и загружен: $path ($code)" ;;
              *) echo "::error::Маршрут $path вернул HTTP $code"; cat route-response.txt || true; exit 1 ;;
            esac
          }

          check_protected_route GET  '/api/wesi/app/bootstrap'
          check_protected_route POST '/api/wesi/portal/profile/credentials'
          check_protected_route POST '/api/wesi/portal/employees/provision'
          check_protected_route POST '/api/wesi/portal/employees/access'
          check_protected_route POST '/api/wesi/portal/employees/revoke'

          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            "$API/api/wesi/portal/manifest" || true)
          case "$CODE" in
            401|403) echo 'Защита manifest работает.' ;;
            *) echo "::error::Неожиданный HTTP $CODE у защищённого manifest"; exit 1 ;;
          esac
