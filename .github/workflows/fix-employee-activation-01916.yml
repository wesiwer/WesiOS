name: Fix employee activation 0.19.16

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  actions: write
  contents: write

jobs:
  fix-test-deploy-release:
    if: github.head_ref == 'ci/fix-employee-activation-01916'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Fix employee activation source of truth
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          auth = Path('server/pb_hooks/wesi_auth_bootstrap.pb.js')
          text = auth.read_text(encoding='utf-8')

          old = '''      const model = new DynamicModel({"email": "", "fullName": "", "name": ""});
      record.unmarshalJSONField("payload", model);
      return {
        "email": String(model.email || ""),
        "fullName": String(model.fullName || ""),
        "name": String(model.name || ""),
      };'''
          new = '''      const model = new DynamicModel({
        "employeeId": "",
        "email": "",
        "fullName": "",
        "name": "",
      });
      record.unmarshalJSONField("payload", model);
      return {
        "employeeId": String(model.employeeId || ""),
        "email": String(model.email || ""),
        "fullName": String(model.fullName || ""),
        "name": String(model.name || ""),
      };'''
          if old not in text:
              raise SystemExit('start-v2 valueObject anchor not found')
          text = text.replace(old, new, 1)

          old = '''  e.app.save(link);

  return e.json(created ? 201 : 200, {
    "id": record.id,
    "email": record.getString("email"),
    "name": record.getString("name"),
    "login": login,
    "created": created,
    "linked": true,
  });'''
          new = '''  e.app.save(link);

  // Do not report activation until the exact credentials and portal link can
  // be read back from PocketBase. This keeps the app status aligned with what
  // /api/wesi/auth/start-v2 will actually accept.
  let verifiedUser = null;
  try {
    verifiedUser = e.app.findAuthRecordByEmail("users", email);
  } catch (_) {
    verifiedUser = null;
  }
  if (!verifiedUser || verifiedUser.id !== record.id || !verifiedUser.validatePassword(password)) {
    throw new InternalServerError("Сервер не подтвердил созданные данные входа сотрудника");
  }

  let verifiedLink = null;
  try {
    verifiedLink = e.app.findFirstRecordByFilter(
      "wesios_records",
      "coll='system' && rid='" + linkRid + "' && deleted=false",
    );
  } catch (_) {
    verifiedLink = null;
  }
  if (!verifiedLink || verifiedLink.getString("owner") !== e.auth.id) {
    throw new InternalServerError("Сервер не подтвердил привязку профиля сотрудника");
  }

  let verifiedEmployeeId = "";
  try {
    const verifyModel = new DynamicModel({"employeeId": ""});
    verifiedLink.unmarshalJSONField("payload", verifyModel);
    verifiedEmployeeId = String(verifyModel.employeeId || "");
  } catch (_) {
    verifiedEmployeeId = "";
  }
  if (!verifiedEmployeeId || verifiedEmployeeId !== String(body.employeeId || login)) {
    throw new InternalServerError("Серверная привязка сотрудника не прошла проверку");
  }

  return e.json(created ? 201 : 200, {
    "id": verifiedUser.id,
    "email": verifiedUser.getString("email"),
    "name": verifiedUser.getString("name"),
    "login": login,
    "employeeId": verifiedEmployeeId,
    "created": created,
    "linked": true,
    "verified": true,
  });'''
          if old not in text:
              raise SystemExit('provision verification anchor not found')
          text = text.replace(old, new, 1)

          if '2026-08-09.owner-email-v9' not in text:
              raise SystemExit('unexpected auth hook version')
          text = text.replace('2026-08-09.owner-email-v9', '2026-08-09.owner-email-v10')
          auth.write_text(text, encoding='utf-8')

          contacts = Path('lib/features/team/contacts_screen.dart')
          text = contacts.read_text(encoding='utf-8')
          old = '''    if (!_ownerOnly ||
        employee.isOwner ||
        _activationBusy.contains(employee.id)) {
      return;
    }

    final confirmed = await showDialog<bool>('''
          new = '''    if (!_ownerOnly ||
        employee.isOwner ||
        _activationBusy.contains(employee.id)) {
      return;
    }

    final alreadyActive = EmployeeAdminService.isActivated(employee.id);
    final confirmed = await showDialog<bool>('''
          if old not in text:
              raise SystemExit('activation dialog guard anchor not found')
          text = text.replace(old, new, 1)

          old = '''        title: Text(
          _ru ? 'Повторить активацию?' : 'Retry activation?',
          style: TextStyle('''
          new = '''        title: Text(
          alreadyActive
              ? (_ru ? 'Переактивировать сотрудника?' : 'Reactivate employee?')
              : (_ru ? 'Повторить активацию?' : 'Retry activation?'),
          style: TextStyle('''
          if old not in text:
              raise SystemExit('activation title anchor not found')
          text = text.replace(old, new, 1)

          old = '''    final canRetry = !active && !busy && (error.isNotEmpty || stalled);
    final canActivate = !active && !busy && attempted == null;
    final attemptText = attempted == null'''
          new = '''    final canRetry = !active && !busy && (error.isNotEmpty || stalled);
    final canActivate = !active && !busy && attempted == null;
    final canReactivate = active && !busy;
    final attemptText = attempted == null'''
          if old not in text:
              raise SystemExit('activation state anchor not found')
          text = text.replace(old, new, 1)

          old = '''          if (canRetry || canActivate) ...[
            const SizedBox(height: 6),
            TextButton.icon(
              style: TextButton.styleFrom(
                padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 5),
                minimumSize: Size.zero,
                tapTargetSize: MaterialTapTargetSize.shrinkWrap,
                foregroundColor:
                    canRetry ? AppTheme.accentRed : AppTheme.accent,
              ),
              onPressed: () => _retryActivation(employee),
              icon: Icon(
                canRetry ? Icons.refresh_rounded : Icons.person_add_alt_1,
                size: 14,
              ),
              label: Text(
                canRetry
                    ? (_ru ? 'Повторить активацию' : 'Retry activation')
                    : (_ru ? 'Активировать вручную' : 'Activate manually'),
                style: const TextStyle(
                    fontSize: 10.5, fontWeight: FontWeight.w700),
              ),
            ),
          ],'''
          new = '''          if (canReactivate || canRetry || canActivate) ...[
            const SizedBox(height: 6),
            TextButton.icon(
              style: TextButton.styleFrom(
                padding: const EdgeInsets.symmetric(horizontal: 9, vertical: 5),
                minimumSize: Size.zero,
                tapTargetSize: MaterialTapTargetSize.shrinkWrap,
                foregroundColor:
                    canRetry ? AppTheme.accentRed : AppTheme.accent,
              ),
              onPressed: () => _retryActivation(employee),
              icon: Icon(
                canActivate ? Icons.person_add_alt_1 : Icons.refresh_rounded,
                size: 14,
              ),
              label: Text(
                canReactivate
                    ? (_ru ? 'Переактивировать' : 'Reactivate')
                    : canRetry
                        ? (_ru ? 'Повторить активацию' : 'Retry activation')
                        : (_ru ? 'Активировать вручную' : 'Activate manually'),
                style: const TextStyle(
                    fontSize: 10.5, fontWeight: FontWeight.w700),
              ),
            ),
          ],'''
          if old not in text:
              raise SystemExit('activation action anchor not found')
          text = text.replace(old, new, 1)
          contacts.write_text(text, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          p = pubspec.read_text(encoding='utf-8')
          if 'version: 0.19.15+63' not in p:
              raise SystemExit('unexpected pubspec version')
          pubspec.write_text(p.replace('version: 0.19.15+63', 'version: 0.19.16+64', 1), encoding='utf-8')

          appv = Path('lib/core/constants/app_version.dart')
          a = appv.read_text(encoding='utf-8')
          if "static const String number = '0.19.15';" not in a or 'static const int build = 63;' not in a:
              raise SystemExit('unexpected AppVersion')
          a = a.replace("static const String number = '0.19.15';", "static const String number = '0.19.16';", 1)
          a = a.replace('static const int build = 63;', 'static const int build = 64;', 1)
          appv.write_text(a, encoding='utf-8')

          deploy = Path('.github/workflows/deploy-current-auth-once.yml')
          d = deploy.read_text(encoding='utf-8')
          if '  push:\n' in d and '  workflow_dispatch:\n' not in d:
              d = d.replace('on:\n  push:\n', 'on:\n  workflow_dispatch:\n  push:\n', 1)
          if '2026-08-09.owner-email-v9' not in d:
              raise SystemExit('unexpected deploy verifier version')
          d = d.replace('2026-08-09.owner-email-v9', '2026-08-09.owner-email-v10')
          deploy.write_text(d, encoding='utf-8')
          PY

          dart format lib/features/team/contacts_screen.dart lib/core/constants/app_version.dart
          node --check server/pb_hooks/wesi_auth_bootstrap.pb.js
          grep -q '"employeeId": String(model.employeeId' server/pb_hooks/wesi_auth_bootstrap.pb.js
          grep -q 'verifiedEmployeeId' server/pb_hooks/wesi_auth_bootstrap.pb.js
          grep -q 'Переактивировать' lib/features/team/contacts_screen.dart
          grep -q '^version: 0.19.16+64$' pubspec.yaml
          grep -q '2026-08-09.owner-email-v10' .github/workflows/deploy-current-auth-once.yml

      - name: Validate Flutter
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Commit fix to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/finish-employee-reactivation.yml \
                    .github/workflows/finish-employee-reactivation-v2.yml \
                    .github/workflows/fix-employee-activation-01916.yml
          git add server/pb_hooks/wesi_auth_bootstrap.pb.js \
                  .github/workflows/deploy-current-auth-once.yml \
                  lib/features/team/contacts_screen.dart \
                  lib/core/constants/app_version.dart \
                  pubspec.yaml pubspec.lock
          git commit -m 'fix(team): verify employee activation and allow unlimited reactivation + 0.19.16+64'
          git push origin HEAD:main

      - name: Deploy fixed auth hook and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          gh workflow run deploy-current-auth-once.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=50")
            run_id=$(printf '%s' "$runs" | jq -r --argjson started "$started" \
              '[.workflow_runs[] | select(.name == "Deploy WesiOS auth hook") | select((.created_at | fromdateiso8601) >= ($started - 5))] | sort_by(.created_at) | last | .id // empty')
            [ -n "$run_id" ] && break
            sleep 3
          done
          [ -n "$run_id" ] || { echo '::error::Auth deploy run not found'; exit 1; }
          echo "auth_deploy_run_id=$run_id"
          for attempt in $(seq 1 100); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            echo "auth deploy attempt=$attempt status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && break
              echo "::error::Auth deploy completed with $conclusion"
              exit 1
            fi
            sleep 6
          done
          final=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.conclusion // ""')
          [ "$final" = success ] || { echo '::error::Auth deploy timeout/failure'; exit 1; }

      - name: Verify production activation code path
        run: |
          set -euo pipefail
          BODY=''
          for attempt in $(seq 1 20); do
            BODY=$(curl -fsS --max-time 20 https://api.wesi-inc.ru/api/wesi/auth/version || true)
            if grep -q '"version":"2026-08-09.owner-email-v10"' <<<"$BODY"; then
              break
            fi
            sleep 1
          done
          echo "$BODY"
          grep -q '"version":"2026-08-09.owner-email-v10"' <<<"$BODY"

      - name: Dispatch canonical production release and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          started=$(date -u +%s)
          gh workflow run publish-wesios-production.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='Исправлена активация сотрудников: статус активирован ставится только после серверной проверки учётной записи, пароля и привязки профиля. Исправлен вход новых сотрудников. Для существующих сотрудников добавлена неограниченная переактивация с выдачей нового пароля.'

          run_id=''
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&per_page=50")
            run_id=$(printf '%s' "$runs" | jq -r --argjson started "$started" \
              '[.workflow_runs[] | select(.name == "Publish WesiOS Production") | select((.created_at | fromdateiso8601) >= ($started - 5))] | sort_by(.created_at) | last | .id // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo '::error::Production run not found'; exit 1; }
          echo "production_run_id=$run_id"

          for attempt in $(seq 1 300); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
            status=$(printf '%s' "$run" | jq -r '.status')
            conclusion=$(printf '%s' "$run" | jq -r '.conclusion // ""')
            echo "release attempt=$attempt status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::Production release completed with $conclusion"
              exit 1
            fi
            sleep 15
          done
          echo '::error::Timed out waiting for production release'
          exit 1
