name: Deploy Wesi AI Relay

# End-to-end Wesi AI infrastructure deployment.
#
# Required repository secrets (Foreign Relay):
#   WESI_RELAY_SSH_HOST
#   WESI_RELAY_SSH_USER
#   WESI_RELAY_SSH_KEY
#   GEMINI_API_KEY
#
# Existing Main Server secrets are reused automatically:
#   WESI_SERVER_HOST
#   WESI_SERVER_USER
#   WESI_SERVER_SSH_KEY
#
# Required DNS/input:
#   public_host workflow input OR WESI_RELAY_PUBLIC_HOST secret.
#   The hostname must already resolve to the Foreign Relay server and ports
#   80/443 must be reachable so Let's Encrypt can issue the certificate.
#
# Optional secrets:
#   WESI_RELAY_SSH_KNOWN_HOSTS
#   WESI_SERVER_KNOWN_HOSTS
#   WESI_MAIN_SHARED_SECRET       (generated for this deployment if absent)
#   WESI_RELAY_PUBLIC_HOST
#   WESI_ZANE_TTS_VOICE          (default Charon)
#   WESI_NIRVANA_TTS_VOICE       (default Sulafat)

on:
  workflow_dispatch:
    inputs:
      public_host:
        description: 'DNS hostname of Foreign Relay, e.g. ai-relay.example.com (without https://)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-wesi-ai-relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate deployment configuration
        shell: bash
        env:
          RELAY_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
          RELAY_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
          RELAY_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
          MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          PROVIDED_SHARED: ${{ secrets.WESI_MAIN_SHARED_SECRET }}
          PUBLIC_SECRET: ${{ secrets.WESI_RELAY_PUBLIC_HOST }}
          PUBLIC_INPUT: ${{ inputs.public_host }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${RELAY_HOST:-}" ] || missing+=(WESI_RELAY_SSH_HOST)
          [ -n "${RELAY_USER:-}" ] || missing+=(WESI_RELAY_SSH_USER)
          [ -n "${RELAY_KEY:-}" ] || missing+=(WESI_RELAY_SSH_KEY)
          [ -n "${GEMINI:-}" ] || missing+=(GEMINI_API_KEY)
          [ -n "${MAIN_HOST:-}" ] || missing+=(WESI_SERVER_HOST)
          [ -n "${MAIN_USER:-}" ] || missing+=(WESI_SERVER_USER)
          [ -n "${MAIN_KEY:-}" ] || missing+=(WESI_SERVER_SSH_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi

          PUBLIC="${PUBLIC_INPUT:-${PUBLIC_SECRET:-}}"
          PUBLIC="${PUBLIC#https://}"
          PUBLIC="${PUBLIC%%/*}"
          if ! [[ "$PUBLIC" =~ ^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$ ]]; then
            echo '::error::Set public_host (or WESI_RELAY_PUBLIC_HOST) to a DNS hostname, not an IP or URL.'
            exit 1
          fi

          if [ -n "${PROVIDED_SHARED:-}" ]; then
            SHARED="$PROVIDED_SHARED"
          else
            SHARED="$(openssl rand -hex 32)"
            echo '::notice::WESI_MAIN_SHARED_SECRET is absent; a strong secret was generated for this deployment and will be installed on both servers.'
          fi
          [ ${#SHARED} -ge 32 ] || { echo '::error::WESI_MAIN_SHARED_SECRET is too short'; exit 1; }
          echo "::add-mask::$SHARED"
          echo "WESI_SHARED_SECRET=$SHARED" >> "$GITHUB_ENV"
          echo "WESI_RELAY_PUBLIC=$PUBLIC" >> "$GITHUB_ENV"

      - name: Build and validate Wesi AI deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 server/build-wesi-ai-personas.py
          test -s server/pb_hooks/.wesi-ai-personas.json

          for file in server/wesi-ai-relay/*.mjs; do node --check "$file"; done
          node --test server/wesi-ai-relay/*.test.mjs
          bash -n server/wesi-ai-relay/deploy-relay.sh
          bash -n server/wesi-ai-relay/configure-relay-https.sh

          found=0
          for file in server/pb_hooks/wesi_ai_*.js server/pb_hooks/wesi_ai_*.pb.js; do
            [ -f "$file" ] || continue
            node --check "$file"
            found=$((found + 1))
          done
          [ "$found" -gt 5 ] || { echo '::error::Wesi AI hook bundle is unexpectedly incomplete'; exit 1; }

      - name: Prepare Relay SSH
        shell: bash
        env:
          KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
          KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/relay_key
          chmod 600 ~/.ssh/relay_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/relay_known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/relay_known_hosts 2>/dev/null
            echo '::warning::WESI_RELAY_SSH_KNOWN_HOSTS is not set; trusting the host key observed during this run.'
          fi
          chmod 600 ~/.ssh/relay_known_hosts

      - name: Build sealed Relay secret bundle
        shell: bash
        env:
          SHARED: ${{ env.WESI_SHARED_SECRET }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          ZANE_VOICE: ${{ secrets.WESI_ZANE_TTS_VOICE }}
          NIRVANA_VOICE: ${{ secrets.WESI_NIRVANA_TTS_VOICE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          pairs = {
              'WESI_MAIN_SHARED_SECRET_B64': os.environ['SHARED'],
              'GEMINI_API_KEY_B64': os.environ['GEMINI'],
          }
          optional = {
              'WESI_ZANE_TTS_VOICE_B64': os.environ.get('ZANE_VOICE', ''),
              'WESI_NIRVANA_TTS_VOICE_B64': os.environ.get('NIRVANA_VOICE', ''),
          }
          pairs.update({k: v for k, v in optional.items() if v})
          with open('relay-secrets.b64', 'w', encoding='ascii') as f:
              for key, value in pairs.items():
                  encoded = base64.b64encode(value.encode()).decode()
                  f.write(f'{key}={encoded}\n')
          PY
          chmod 600 relay-secrets.b64

      - name: Upload and install Foreign Relay
        shell: bash
        env:
          HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
          USER: ${{ secrets.WESI_RELAY_SSH_USER }}
          PUBLIC: ${{ env.WESI_RELAY_PUBLIC }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/relay_known_hosts")
          tmp="wesi-ai-relay-${GITHUB_RUN_ID}"
          cleanup() {
            rm -f relay-secrets.b64
            ssh "${SSH_OPTS[@]}" "$USER@$HOST" "rm -rf ~/$tmp" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "mkdir -p ~/$tmp"
          scp "${SSH_OPTS[@]}" \
            server/wesi-ai-relay/server.mjs \
            server/wesi-ai-relay/auth.mjs \
            server/wesi-ai-relay/google.mjs \
            server/wesi-ai-relay/google-media.mjs \
            server/wesi-ai-relay/package.json \
            server/wesi-ai-relay/deploy-relay.sh \
            server/wesi-ai-relay/configure-relay-https.sh \
            server/wesi-ai-relay/nginx-relay.conf \
            relay-secrets.b64 \
            "$USER@$HOST:~/$tmp/"

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" \
            "cd ~/$tmp && sudo bash deploy-relay.sh --install-from-b64 ~/$tmp/relay-secrets.b64 && sudo bash configure-relay-https.sh '$PUBLIC'"
          cleanup
          trap - EXIT

      - name: Verify public HTTPS, Gemini roundtrip and anti-replay
        shell: bash
        env:
          PUBLIC: ${{ env.WESI_RELAY_PUBLIC }}
          SHARED: ${{ env.WESI_SHARED_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "https://$PUBLIC/health" > relay-health.json
          python3 - <<'PY'
          import json
          data = json.load(open('relay-health.json', encoding='utf-8'))
          assert data.get('ok') is True, data
          assert data.get('ready') is True, data
          print('Foreign Relay HTTPS health: ready')
          PY

          python3 - <<'PY'
          import hashlib, hmac, json, os, time, urllib.error, urllib.request
          public = os.environ['PUBLIC']
          secret = os.environ['SHARED'].encode()
          request_id = 'wai_deploy_' + str(int(time.time()))
          payload = {
              'requestId': request_id,
              'route': 'google/gemini-3.5-flash-lite',
              'operation': 'chat',
              'input': {'system': 'Deployment health check.', 'history': [], 'message': 'Ответь одним словом: OK'},
          }
          raw = json.dumps(payload, separators=(',', ':'), ensure_ascii=False).encode()
          timestamp = str(int(time.time()))
          signature = hmac.new(secret, request_id.encode() + b'.' + timestamp.encode() + b'.' + raw, hashlib.sha256).hexdigest()
          headers = {
              'Content-Type': 'application/json',
              'X-Wesi-Request-Id': request_id,
              'X-Wesi-Timestamp': timestamp,
              'X-Wesi-Signature': signature,
          }
          req = urllib.request.Request(f'https://{public}/v1/wesi-ai', data=raw, headers=headers, method='POST')
          with urllib.request.urlopen(req, timeout=120) as response:
              result = json.load(response)
          assert result.get('ok') is True and str(result.get('answer', '')).strip(), result
          print('Relay -> Gemini roundtrip: OK')

          try:
              urllib.request.urlopen(req, timeout=20)
              raise AssertionError('Replay unexpectedly accepted')
          except urllib.error.HTTPError as exc:
              body = json.loads(exc.read().decode() or '{}')
              assert exc.code == 401 and body.get('code') == 'WAI_RELAY_REPLAY_DETECTED', (exc.code, body)
          print('Relay anti-replay production check: OK')
          PY

      - name: Prepare Main Server SSH
        shell: bash
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          printf '%s\n' "$KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/main_known_hosts 2>/dev/null
            echo '::warning::WESI_SERVER_KNOWN_HOSTS is not set; trusting the host key observed during this run.'
          fi
          chmod 600 ~/.ssh/main_known_hosts

      - name: Build private Main Server Relay config
        shell: bash
        env:
          PUBLIC: ${{ env.WESI_RELAY_PUBLIC }}
          SHARED: ${{ env.WESI_SHARED_SECRET }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          config = {
              'url': 'https://' + os.environ['PUBLIC'],
              'sharedSecret': os.environ['SHARED'],
              'routes': {
                  'fast': 'google/gemini-3.5-flash-lite',
                  'pro': 'google/gemini-3.6-flash',
                  'maximum': 'google/gemini-3.6-flash',
              },
          }
          with open('wesi-ai-relay.json', 'w', encoding='utf-8') as f:
              json.dump(config, f, ensure_ascii=False)
          PY
          chmod 600 wesi-ai-relay.json

      - name: Deploy Wesi AI Main hooks, personas and Relay config
        shell: bash
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          remote="/tmp/wesi-ai-main-${GITHUB_RUN_ID}"
          cleanup() {
            rm -f wesi-ai-relay.json
            ssh "${SSH_OPTS[@]}" "$USER@$HOST" "rm -rf '$remote'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "rm -rf '$remote' && mkdir -p '$remote'"
          scp "${SSH_OPTS[@]}" \
            server/pb_hooks/wesi_ai_*.js \
            server/pb_hooks/wesi_ai_*.pb.js \
            server/pb_hooks/.wesi-ai-personas.json \
            wesi-ai-relay.json \
            "$USER@$HOST:$remote/"

          ssh "${SSH_OPTS[@]}" "$USER@$HOST" "REMOTE='$remote' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          HOOK_DIR=/opt/pocketbase/pb_hooks
          test -d "$HOOK_DIR"
          test -d "$REMOTE"

          PB_USER=$(ps -eo user=,comm= | awk '$2 ~ /^pocketbase$/ {print $1; exit}')
          [ -n "${PB_USER:-}" ] || PB_USER=$(stat -c '%U' "$HOOK_DIR")
          PB_GROUP=$(id -gn "$PB_USER" 2>/dev/null || stat -c '%G' "$HOOK_DIR")

          install_one() {
            local source="$1" mode="$2" target="$3"
            if [ "$(id -un)" = "$PB_USER" ] && [ -w "$HOOK_DIR" ]; then
              install -o "$PB_USER" -g "$PB_GROUP" -m "$mode" "$source" "$target"
            else
              sudo -n install -o "$PB_USER" -g "$PB_GROUP" -m "$mode" "$source" "$target"
            fi
          }

          count=0
          for source in "$REMOTE"/wesi_ai_*.js "$REMOTE"/wesi_ai_*.pb.js; do
            [ -f "$source" ] || continue
            install_one "$source" 0644 "$HOOK_DIR/$(basename "$source")"
            count=$((count + 1))
          done
          [ "$count" -gt 5 ] || { echo "Incomplete hook upload: $count files" >&2; exit 1; }
          install_one "$REMOTE/.wesi-ai-personas.json" 0600 "$HOOK_DIR/.wesi-ai-personas.json"
          install_one "$REMOTE/wesi-ai-relay.json" 0600 "$HOOK_DIR/.wesi-ai-relay.json"

          test "$(stat -c '%a' "$HOOK_DIR/.wesi-ai-personas.json")" = 600
          test "$(stat -c '%a' "$HOOK_DIR/.wesi-ai-relay.json")" = 600

          # Hooks are deployment code, not user data. Restart deliberately so
          # the production process cannot continue with an old in-memory hook
          # set after files and config were atomically installed.
          sudo -n systemctl restart pocketbase
          for attempt in $(seq 1 30); do
            systemctl is-active --quiet pocketbase && break
            sleep 1
          done
          systemctl is-active --quiet pocketbase
          REMOTE_SCRIPT

          cleanup
          trap - EXIT

      - name: Verify Main Server and Wesi AI route loading
        shell: bash
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          PUBLIC: ${{ env.WESI_RELAY_PUBLIC }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          ssh "${SSH_OPTS[@]}" "$USER@$HOST" \
            "curl -fsS --max-time 20 'https://$PUBLIC/health' | grep -q '\"ready\":true'"

          code='000'
          for attempt in $(seq 1 20); do
            code="$(curl -sS -o /tmp/wesi-ai-capabilities.out -w '%{http_code}' --max-time 20 https://api.wesi-inc.ru/api/wesi/ai/capabilities || true)"
            [ "$code" != '000' ] && break
            sleep 1
          done
          # The endpoint is protected; unauthenticated 401/403 proves the
          # route exists. A 404 would mean the hooks did not load.
          if [ "$code" != '401' ] && [ "$code" != '403' ]; then
            echo "::error::Wesi AI capabilities route did not load as a protected endpoint (HTTP $code)."
            cat /tmp/wesi-ai-capabilities.out 2>/dev/null || true
            exit 1
          fi
          echo "Main Wesi AI route loaded (protected HTTP $code)."

      - name: Deployment summary
        run: |
          echo 'Foreign Relay, HTTPS, Gemini roundtrip, anti-replay, Main Wesi AI hooks, personas and shared Relay config are all deployed and verified.'
