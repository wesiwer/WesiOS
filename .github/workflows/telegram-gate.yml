name: Telegram Gateway Gate

on:
  pull_request:
    paths:
      - '.github/workflows/telegram-gate.yml'
      - '.github/workflows/deploy-wesi-telegram.yml'
      - 'server/WESI_TELEGRAM.md'
      - 'server/pb_hooks/wesi_telegram*.js'
      - 'server/pb_hooks/wesi_telegram*.mjs'
      - 'server/pb_hooks/wesi_ai_finance_tools.js'
      - 'server/pb_hooks/wesi_ai_task_tools.js'
      - 'scripts/generate_wesi_telegram_visuals.py'
      - 'lib/core/routes/app_router.dart'
      - 'lib/core/services/telegram_link_service.dart'
      - 'lib/features/profile/profile_with_telegram.dart'
      - 'lib/features/profile/telegram_link_screen.dart'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'test/telegram_deep_link_test.dart'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server hooks and visuals
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check Telegram contour
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            server/pb_hooks/wesi_telegram_lib.js \
            server/pb_hooks/wesi_telegram_store.js \
            server/pb_hooks/wesi_telegram_gateway.js \
            server/pb_hooks/wesi_telegram_experience.js \
            server/pb_hooks/wesi_telegram_interactions.js \
            server/pb_hooks/wesi_telegram_morning_photos.js \
            server/pb_hooks/wesi_telegram_morning.js \
            server/pb_hooks/wesi_telegram.pb.js \
            server/pb_hooks/wesi_ai_finance_tools.js \
            server/pb_hooks/wesi_ai_task_tools.js; do
            node --check "$file"
          done

      - name: Run Telegram unit tests
        run: |
          node server/pb_hooks/wesi_telegram_lib_test.mjs
          node server/pb_hooks/wesi_telegram_link_expiry_test.mjs
          node server/pb_hooks/wesi_telegram_link_inline_contract_test.mjs
          node server/pb_hooks/wesi_telegram_retention_test.mjs
          node server/pb_hooks/wesi_telegram_morning_photos_test.mjs
          node server/pb_hooks/wesi_telegram_morning_test.mjs

      - name: Generate and validate visual cards
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow>=11.0,<13.0'
          python3 scripts/generate_wesi_telegram_visuals.py
          for kind in brief cash risk today overdue push farewell; do
            test -s "build/wesi_telegram_visuals/$kind.jpg"
          done
          python3 - <<'PY'
          from pathlib import Path
          files=sorted(Path('build/wesi_telegram_visuals').glob('*.jpg'))
          assert len(files) == 7, files
          for path in files:
              data=path.read_bytes()
              assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9', path
          print('VISUAL_CARDS_OK')
          PY

      - name: Reject legacy Vercel dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E '@vercel/postgres|telegram-webhook/' server/pb_hooks/wesi_telegram*.js; then
            echo '::error::Production Telegram gateway must not depend on the legacy Vercel prototype.'
            exit 1
          fi

  flutter:
    name: Flutter analyze and deep links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Telegram integration
        run: |
          flutter analyze --no-fatal-infos \
            lib/core/routes/app_router.dart \
            lib/core/services/telegram_link_service.dart \
            lib/features/profile/profile_with_telegram.dart \
            lib/features/profile/telegram_link_screen.dart \
            test/telegram_deep_link_test.dart

      - name: Test Telegram deep-link routing
        run: flutter test test/telegram_deep_link_test.dart
