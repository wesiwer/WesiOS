name: Final harden Wesi AI Stage 8

on:
  push:
    branches:
      - agent/wesi-ai-stage8-resource-scheduler

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage8-final-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage8-resource-scheduler
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Apply final Stage 8 hardening
        run: python tool/wesi_ai_stage8_gpu_snapshot_fix.py
      - name: Format touched files
        run: >-
          dart format
          lib/features/ai/runtime/wesi_resource_scheduler_models.dart
          lib/features/ai/runtime/wesi_job_queue.dart
          test/wesi_resource_scheduler_test.dart
          test/wesi_job_queue_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Stage 8 scheduler and durable queue regressions
        run: >-
          flutter test
          test/wesi_resource_scheduler_test.dart
          test/wesi_job_queue_test.dart
          test/wesi_job_coordinator_test.dart
      - name: Commit product hardening and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wesi-ai-stage8-final-hardening.yml tool/wesi_ai_stage8_gpu_snapshot_fix.py
          git add lib/features/ai/runtime/wesi_resource_scheduler_models.dart lib/features/ai/runtime/wesi_job_queue.dart test/wesi_resource_scheduler_test.dart test/wesi_job_queue_test.dart
          git commit -m "fix(ai): harden Stage 8 recovery invariants"
          git push origin HEAD:agent/wesi-ai-stage8-resource-scheduler
