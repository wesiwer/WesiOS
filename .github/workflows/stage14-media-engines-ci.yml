name: Stage14 Media Engines CI

on:
  push:
    branches: [agent/wesi-ai-stage14-media-engines]
  pull_request:
    paths:
      - 'lib/features/ai/media_engines/**'
      - 'test/features/ai/media_engines/**'
      - '.github/workflows/stage14-media-engines-ci.yml'

jobs:
  focused-stage14:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Stage14 media layer
        run: flutter analyze lib/features/ai/media_engines test/features/ai/media_engines --no-fatal-infos
      - name: Test Stage14 media workflow
        run: flutter test test/features/ai/media_engines/wesi_media_workflow_test.dart
      - name: Enforce no-Control-Plane L4 policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q "WAI_MEDIA_REQUIRES_WORKER" lib/features/ai/media_engines/wesi_media_workflow.dart
          grep -q "maxInputBytes" lib/features/ai/media_engines/wesi_media_workflow.dart
