name: Stage14 Media Engines CI

on:
  push:
    branches:
      - 'agent/wesi-ai-stage14-*'
  pull_request:
    paths:
      - 'lib/features/ai/media_engines/**'
      - 'lib/features/ai/controllers/wesi_ai_chat_controller.dart'
      - 'lib/features/ai/wesi_ai_api.dart'
      - 'test/features/ai/media_engines/**'
      - 'server/pb_hooks/wesi_ai_media_*.js'
      - 'server/pb_hooks/wesi_ai_media_*_test.mjs'
      - 'server/pb_hooks/wesi_ai_capability_registry.js'
      - 'server/media-engines/**'
      - '.github/workflows/stage14-media-engines-ci.yml'

jobs:
  focused-stage14:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Stage14 server media contract
        run: |
          node --check server/pb_hooks/wesi_ai_media_contract.js
          node --check server/pb_hooks/wesi_ai_media_tools.js
          node --check server/pb_hooks/wesi_ai_capability_registry.js
          node --test server/pb_hooks/wesi_ai_media_contract_test.mjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Stage14 media layer
        run: flutter analyze lib/features/ai/media_engines lib/features/ai/controllers/wesi_ai_chat_controller.dart lib/features/ai/wesi_ai_api.dart test/features/ai/media_engines --no-fatal-infos
      - name: Test Stage14 media layer
        run: flutter test test/features/ai/media_engines
      - name: Enforce L4, staging, validation, archive and artifact policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q "WAI_MEDIA_REQUIRES_WORKER" lib/features/ai/media_engines/wesi_media_workflow.dart
          grep -q "maxInputBytes" lib/features/ai/media_engines/wesi_media_workflow.dart
          grep -q "archive_symlink_forbidden" lib/features/ai/media_engines/wesi_media_archive_guard.dart
          grep -q "archive_expansion_limit" lib/features/ai/media_engines/wesi_media_archive_guard.dart
          grep -q "WesiMediaArchiveGuard.validateZip" lib/features/ai/media_engines/wesi_media_engine_service.dart
          grep -q "WesiMediaLocalRequestSanitizer.sanitize" lib/features/ai/wesi_ai_api.dart
          grep -q "WesiMediaTurnExecutor.run" lib/features/ai/controllers/wesi_ai_chat_controller.dart
          grep -q "turnAttachments: attachments" lib/features/ai/controllers/wesi_ai_chat_controller.dart
          grep -q "_localMediaRequestIdentity" lib/features/ai/controllers/wesi_ai_chat_controller.dart
          grep -q "WesiMediaEnginePathGuard.resolveOutput" lib/features/ai/media_engines/wesi_media_engine_runner.dart
          grep -q "WesiMediaOutputValidator.validate" lib/features/ai/media_engines/wesi_media_engine_runner.dart
          grep -q "wesi-media-v1" lib/features/ai/media_engines/wesi_media_output_validator.dart
          grep -q "ffprobe" lib/features/ai/media_engines/wesi_media_output_validator.dart
          grep -q "WesiMediaArtifactStore.promote" lib/features/ai/media_engines/wesi_media_workflow.dart
          grep -q "maxVideoBytes" lib/features/ai/media_engines/wesi_media_artifact_store.dart
          grep -q "application/zip" lib/features/ai/media_engines/wesi_media_input_stager.dart
          grep -q "'artifactOwned'" lib/features/ai/controllers/wesi_ai_chat_controller.dart
          grep -q "'sha256'" lib/features/ai/controllers/wesi_ai_chat_controller.dart
          ! grep -q 'Файл сохранён: ${result.outputPath}' lib/features/ai/controllers/wesi_ai_chat_controller.dart
          grep -q "musicRegenerateStem" server/pb_hooks/wesi_ai_media_contract.js
          grep -q "musicMix" server/pb_hooks/wesi_ai_media_contract.js
          grep -q "musicExport" server/pb_hooks/wesi_ai_media_contract.js
          grep -q "regenerate_music_stem" server/pb_hooks/wesi_ai_capability_registry.js
          grep -q "mix_music" server/pb_hooks/wesi_ai_capability_registry.js
          grep -q "export_music" server/pb_hooks/wesi_ai_capability_registry.js
