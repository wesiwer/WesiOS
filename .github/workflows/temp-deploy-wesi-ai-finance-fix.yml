name: Temporary deploy Wesi AI finance fix
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-deploy-wesi-ai-finance-fix.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-tool-agent-handoff
      - name: Validate finance hooks
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_ai_finance_policy.js
          node --check server/pb_hooks/wesi_ai_finance_tools.js
      - name: Prepare Main SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${MAIN_HOST:-}"
          test -n "${MAIN_USER:-}"
          test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/main_known_hosts
          else
            ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/main_known_hosts
      - name: Hot deploy finance hooks with rollback
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known_hosts")
          REMOTE="/tmp/wesi-ai-finance-$GITHUB_RUN_ID"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp "${SSH[@]}" \
            server/pb_hooks/wesi_ai_finance_policy.js \
            server/pb_hooks/wesi_ai_finance_tools.js \
            "$MAIN_USER@$MAIN_HOST:$REMOTE/"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          HOOK_DIR=/opt/pocketbase/pb_hooks
          POLICY="$HOOK_DIR/wesi_ai_finance_policy.js"
          TOOLS="$HOOK_DIR/wesi_ai_finance_tools.js"
          test -d "$HOOK_DIR"
          test -s "$REMOTE/wesi_ai_finance_policy.js"
          test -s "$REMOTE/wesi_ai_finance_tools.js"

          install_hook() {
            source="$1"
            target="$2"
            if [ -w "$target" ]; then
              cat "$source" > "$target"
              chmod 0644 "$target"
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo -n install -m 0644 "$source" "$target"
            else
              echo "No write permission for $target" >&2
              return 30
            fi
            if [ -r "$target" ]; then
              cmp -s "$source" "$target"
            else
              sudo -n cmp -s "$source" "$target"
            fi
          }

          if [ -r "$POLICY" ]; then cat "$POLICY" > "$REMOTE/old-policy.js"; fi
          if [ -r "$TOOLS" ]; then cat "$TOOLS" > "$REMOTE/old-tools.js"; fi
          rollback() {
            echo 'Finance hot deploy failed; restoring previous hooks' >&2
            if [ -s "$REMOTE/old-policy.js" ]; then install_hook "$REMOTE/old-policy.js" "$POLICY" || true; fi
            if [ -s "$REMOTE/old-tools.js" ]; then install_hook "$REMOTE/old-tools.js" "$TOOLS" || true; fi
          }
          trap rollback ERR
          install_hook "$REMOTE/wesi_ai_finance_policy.js" "$POLICY"
          install_hook "$REMOTE/wesi_ai_finance_tools.js" "$TOOLS"

          # PocketBase watches pb_hooks and reloads changed JavaScript files;
          # the deploy user intentionally has no service-restart privilege.
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null
          cmp -s "$REMOTE/wesi_ai_finance_policy.js" "$POLICY"
          cmp -s "$REMOTE/wesi_ai_finance_tools.js" "$TOOLS"
          trap - ERR
          rm -rf "$REMOTE"
          echo FINANCE_HOOKS_HOT_DEPLOYED
          REMOTE_SCRIPT
      - name: Verify protected Wesi AI endpoint
        run: |
          set -euo pipefail
          code='000'
          for _ in $(seq 1 15); do
            code="$(curl -sS -o /tmp/wesi-finance-check.out -w '%{http_code}' --max-time 20 https://api.wesi-inc.ru/api/wesi/ai/capabilities || true)"
            if [ "$code" = '401' ] || [ "$code" = '403' ]; then break; fi
            sleep 1
          done
          if [ "$code" != '401' ] && [ "$code" != '403' ]; then
            echo "::error::Wesi AI protected endpoint unhealthy (HTTP $code)"
            cat /tmp/wesi-finance-check.out 2>/dev/null || true
            exit 1
          fi
          echo "Main Wesi AI finance hooks are live; protected endpoint HTTP $code"
