name: Apply Telegram retention patch

on:
  push:
    branches:
      - agent/telegram-retention-24h
    paths:
      - '.github/telegram-retention-patch.trigger'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run telegram retention patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/telegram-retention-24h
          fetch-depth: 0

      - name: Apply guarded patch
        run: python3 scripts/apply_telegram_retention_patch.py

      - name: Validate patched Telegram contour
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_telegram_gateway.js
          node --check server/pb_hooks/wesi_telegram_experience.js
          node --check server/pb_hooks/wesi_telegram_interactions.js
          node --check server/pb_hooks/wesi_telegram.pb.js
          node server/pb_hooks/wesi_telegram_lib_test.mjs
          node server/pb_hooks/wesi_telegram_retention_test.mjs

      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/pb_hooks/wesi_telegram_gateway.js \
            server/pb_hooks/wesi_telegram_experience.js \
            server/pb_hooks/wesi_telegram_interactions.js \
            server/pb_hooks/wesi_telegram.pb.js \
            server/pb_hooks/wesi_telegram_retention_test.mjs \
            .github/workflows/telegram-gate.yml
          git diff --cached --check
          git commit -m 'feat(telegram): enforce 24h message retention'
          git push origin HEAD:agent/telegram-retention-24h
