name: Sync Lifecycle Isolation

on:
  pull_request:
    paths:
      - '.github/workflows/sync-lifecycle-debug.yml'
      - 'test/**'
      - 'lib/core/sync/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Lifecycle only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run lifecycle test only
        run: flutter test test/sync_engine_lifecycle_test.dart --reporter expanded

  serialized-suite:
    name: Full suite serial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run full suite without parallel test files
        run: flutter test -j 1 --reporter expanded
