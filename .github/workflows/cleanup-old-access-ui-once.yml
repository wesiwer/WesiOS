name: Cleanup old access UI helpers once

on:
  push:
    branches:
      - agent/org-hierarchy-remediation-1

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
          fetch-depth: 1
      - name: Remove obsolete access-dialog helpers
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/features/organizations/organizations_screen.dart')
          s = p.read_text()
          s = s.replace('  bool _actorSubtree = false;\n', '')
          s = s.replace('  bool _actorTeamFinance = false;\n', '')
          s = re.sub(r"\n  Future<void> _teamFinance\(.*?\n  Future<void> _permission\(", "\n  Future<void> _permission(", s, count=1, flags=re.S)
          s = re.sub(r"\n  Future<void> _permission\(.*?\n  @override\n  Widget build", "\n  @override\n  Widget build", s, count=1, flags=re.S)
          s = s.replace('        _actorSubtree = actorSubtree;\n', '')
          s = s.replace('        _actorTeamFinance = actorTeamFinance;\n', '')
          # These calculations only served the removed inline controls.
          s = re.sub(r"\n    var actorSubtree = actor\?\.isOwner == true;\n    var actorTeamFinance = actor\?\.isOwner == true;", '', s, count=1)
          s = re.sub(r"\n        actorSubtree = actorSubtree \|\| grant\.includeSubtree;\n        actorTeamFinance = actorTeamFinance \|\|\n            \(grant\.canViewTeamFinance &&\n                grant\.permissions\n                    \.contains\(OrganizationPermissions\.viewFinance\)\);", '', s, count=1)
          p.write_text(s)
          PY
          dart format lib/features/organizations/organizations_screen.dart
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/organizations/organizations_screen.dart
          git commit -m "refactor: remove obsolete inline access controls"
          git push origin HEAD:agent/org-hierarchy-remediation-1
