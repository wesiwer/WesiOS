name: Build Wesi Aero Android ARM64

on:
  push:
    branches:
      - codex/wesi-aero-build-20260821
    paths:
      - WesiAero/**
      - .github/workflows/wesi-aero-arm64.yml

permissions:
  contents: read

concurrency:
  group: wesi-aero-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: Signed Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: WesiAero
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          flutter create --platforms=android --org com.wesi --project-name wesi_aero .
          rm -f test/widget_test.dart

      - name: Apply Wesi Aero Android integration
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i 's/android:label="wesi_aero"/android:label="Wesi Aero"/' android/app/src/main/AndroidManifest.xml
          python3 scripts/configure_payment_return.py
          grep -q 'android:scheme="wesi-aero"' android/app/src/main/AndroidManifest.xml
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/branding/wesi_aero_mark.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done

      - name: Validate Flutter project
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Configure permanent Android release signature
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is missing"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/wesi-aero-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          store_password=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          key_password=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          alias_name=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
          keytool -list -keystore "$keystore" -storepass "$store_password" -alias "$alias_name" >/dev/null
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$store_password"
            printf 'keyAlias=%s\n' "$alias_name"
            printf 'keyPassword=%s\n' "$key_password"
          } > android/key.properties
          python3 scripts/configure_android_signing.py

      - name: Build signed ARM64 release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4G -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi
          src=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$src"
          cp "$src" Wesi-Aero-Android-arm64-v8a.apk
          test "$(stat -c%s Wesi-Aero-Android-arm64-v8a.apk)" -lt 104857600
          sha256sum Wesi-Aero-Android-arm64-v8a.apk | tee Wesi-Aero-Android-arm64-v8a.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Wesi-Aero-Android-arm64
          path: |
            WesiAero/Wesi-Aero-Android-arm64-v8a.apk
            WesiAero/Wesi-Aero-Android-arm64-v8a.apk.sha256
          retention-days: 7
          if-no-files-found: error
