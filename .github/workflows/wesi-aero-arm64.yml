name: Build Wesi Aero Android ARM64

on:
  push:
    branches:
      - codex/wesi-aero-build-20260821
    paths:
      - WesiAero/**
      - .github/workflows/wesi-aero-arm64.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: wesi-aero-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  AERO_CONTROL_URL: https://wesi-aero-178-236-247-194.nip.io
  RELAY_SSH_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
  RELAY_SSH_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
  RELAY_SSH_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
  RELAY_SSH_KNOWN_HOSTS: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}

jobs:
  android-arm64:
    name: Signed Android ARM64 Live APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: WesiAero
    steps:
      - name: Publish ARM64 build link
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc --arg state pending --arg target_url "$TARGET_URL" \
            --arg description "Signed ARM64 APK is building" --arg context "wesi-aero/arm64" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "$payload"

      - uses: actions/checkout@v4
        with:
          ref: codex/wesi-aero-build-20260821

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.wesi --project-name wesi_aero .
          rm -f test/widget_test.dart

      - name: Apply full native VPN runtime and performance patches
        run: |
          set -euo pipefail
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          sed -i 's/android:label="wesi_aero"/android:label="Wesi Aero"/' android/app/src/main/AndroidManifest.xml
          python3 scripts/configure_payment_return.py
          python3 scripts/configure_android_wireguard.py
          python3 scripts/download_xray_aar.py
          python3 scripts/configure_android_xray.py
          python3 scripts/harden_android_xray_datapath.py
          python3 scripts/optimize_flutter_control_plane.py
          python3 scripts/fix_flutter_perf_compat.py
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/branding/wesi_aero_mark.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done
          grep -q 'android:name=".AeroXrayVpnService"' android/app/src/main/AndroidManifest.xml
          grep -q 'setUnderlyingNetworks(arrayOf(network))' android/app/src/main/kotlin/com/wesi/wesi_aero/AeroXrayVpnService.kt
          grep -q 'measureDelay("https://cp.cloudflare.com/generate_204")' android/app/src/main/kotlin/com/wesi/wesi_aero/AeroXrayVpnService.kt
          grep -q 'put("outboundTag", "proxy")' android/app/src/main/kotlin/com/wesi/wesi_aero/AeroXrayVpnService.kt
          grep -q 'child: BackdropGroup(' lib/src/screens/app_shell.dart
          grep -q 'Duration(milliseconds: 33)' lib/src/widgets/ambient_background.dart
          grep -q 'final ValueNotifier<double> phase;' lib/src/widgets/ambient_background.dart
          grep -q 'if (embedded.isNotEmpty) return embedded;' lib/src/services/secret_store.dart
          bash -n server-node/scripts/ensure-prototype-license.sh
          test -s android/app/libs/libv2ray.aar

      - name: Verify and load current prototype license from Wesi Relay
        shell: bash
        run: |
          set -euo pipefail
          for name in RELAY_SSH_HOST RELAY_SSH_USER RELAY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required server credential $name is missing"
              exit 1
            fi
          done
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          keyfile="$RUNNER_TEMP/wesi-aero-relay-key"
          knownhosts="$RUNNER_TEMP/wesi-aero-known-hosts"
          printf '%s\n' "$RELAY_SSH_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          if [ -n "${RELAY_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$RELAY_SSH_KNOWN_HOSTS" > "$knownhosts"
          else
            ssh-keyscan -H "$RELAY_SSH_HOST" > "$knownhosts" 2>/dev/null
          fi
          chmod 600 "$knownhosts"
          prototype_license="$(ssh \
            -i "$keyfile" \
            -o BatchMode=yes \
            -o UserKnownHostsFile="$knownhosts" \
            "$RELAY_SSH_USER@$RELAY_SSH_HOST" \
            'if [ "$(id -u)" -eq 0 ]; then bash -s; else sudo -n bash -s; fi' \
            < server-node/scripts/ensure-prototype-license.sh \
            | tr -d '\r\n')"
          if ! printf '%s' "$prototype_license" | grep -Eq '^WA1-[0-9A-Fa-f]{32}-[A-Za-z0-9_-]{24,64}$'; then
            echo '::error::Relay did not return a server-verified Wesi Aero prototype license'
            exit 1
          fi
          echo "::add-mask::$prototype_license"
          printf 'WESI_AERO_PROTOTYPE_LICENSE=%s\n' "$prototype_license" >> "$GITHUB_ENV"

      - name: Validate Flutter and live control plane
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
          curl -fsS --max-time 15 "$AERO_CONTROL_URL/healthz" | grep -q '"status":"ok"'

      - name: Configure permanent Android release signature
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is missing"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/wesi-aero-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          store_password=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          key_password=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          alias_name=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
          keytool -list -keystore "$keystore" -storepass "$store_password" -alias "$alias_name" >/dev/null
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$store_password"
            printf 'keyAlias=%s\n' "$alias_name"
            printf 'keyPassword=%s\n' "$key_password"
          } > android/key.properties
          python3 scripts/configure_android_signing.py

      - name: Build signed ARM64 live release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5G -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          test -n "${WESI_AERO_PROTOTYPE_LICENSE:-}"
          flutter build apk --release --split-per-abi \
            --dart-define=WESI_AERO_DEMO=false \
            --dart-define=WESI_AERO_CONTROL_URL="$AERO_CONTROL_URL" \
            --dart-define=WESI_AERO_PROTOTYPE_LICENSE="$WESI_AERO_PROTOTYPE_LICENSE"
          src=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$src"
          cp "$src" Wesi-Aero-Android-Live-0.2.3+5-arm64-v8a.apk
          test "$(stat -c%s Wesi-Aero-Android-Live-0.2.3+5-arm64-v8a.apk)" -lt 104857600
          sha256sum Wesi-Aero-Android-Live-0.2.3+5-arm64-v8a.apk | tee Wesi-Aero-Android-Live-0.2.3+5-arm64-v8a.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Wesi-Aero-Android-Live-arm64
          path: |
            WesiAero/Wesi-Aero-Android-Live-0.2.3+5-arm64-v8a.apk
            WesiAero/Wesi-Aero-Android-Live-0.2.3+5-arm64-v8a.apk.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Publish final ARM64 status
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Live ARM64 VPN APK is ready'; else state=failure; description='ARM64 VPN APK build failed'; fi
          payload=$(jq -nc --arg state "$state" --arg target_url "$TARGET_URL" \
            --arg description "$description" --arg context "wesi-aero/arm64" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "$payload"
