name: Build Wesi Aero Android ARM64

on:
  push:
    branches:
      - codex/wesi-aero-build-20260821
    paths:
      - WesiAero/lib/**
      - WesiAero/scripts/**
      - WesiAero/assets/**
      - WesiAero/test/**
      - WesiAero/pubspec.yaml
      - WesiAero/pubspec.lock
      - WesiAero/analysis_options.yaml
      - WesiAero/server-node/scripts/ensure-prototype-license.sh
      - .github/workflows/wesi-aero-arm64.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: wesi-aero-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  AERO_CONTROL_URL: https://wesi-aero-178-236-247-194.nip.io
  RELAY_SSH_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
  RELAY_SSH_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
  RELAY_SSH_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
  RELAY_SSH_KNOWN_HOSTS: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}

jobs:
  android-arm64:
    name: Signed Android ARM64 multi-engine APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: WesiAero
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/wesi-aero-build-20260821

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.wesi --project-name wesi_aero .
          rm -f test/widget_test.dart
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/android:label="wesi_aero"/android:label="Wesi Aero"/' android/app/src/main/AndroidManifest.xml

      - name: Restore pinned sing-box ARM64 core
        uses: actions/cache@v4
        with:
          path: WesiAero/android/app/libs/libbox.aar
          key: wesi-aero-libbox-v1.13.18-go1.24-ndk28-arm64-v3

      - name: Build and configure all Android VPN engines
        env:
          WESI_AERO_ANDROID_ABIS: arm64-v8a
          WESI_AERO_SINGBOX_TARGET: android/arm64
        run: |
          set -euo pipefail
          bash scripts/configure_android_all_engines.sh
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp assets/branding/wesi_aero_mark.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done

      - name: Verify and load current prototype license from Wesi Relay
        shell: bash
        run: |
          set -euo pipefail
          for name in RELAY_SSH_HOST RELAY_SSH_USER RELAY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required server credential $name is missing"
              exit 1
            fi
          done
          keyfile="$RUNNER_TEMP/wesi-aero-relay-key"
          knownhosts="$RUNNER_TEMP/wesi-aero-known-hosts"
          printf '%s\n' "$RELAY_SSH_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          if [ -n "${RELAY_SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$RELAY_SSH_KNOWN_HOSTS" > "$knownhosts"
          else
            ssh-keyscan -H "$RELAY_SSH_HOST" > "$knownhosts" 2>/dev/null
          fi
          chmod 600 "$knownhosts"
          prototype_license="$(ssh -i "$keyfile" -o BatchMode=yes -o UserKnownHostsFile="$knownhosts" \
            "$RELAY_SSH_USER@$RELAY_SSH_HOST" \
            'if [ "$(id -u)" -eq 0 ]; then bash -s; else sudo -n bash -s; fi' \
            < server-node/scripts/ensure-prototype-license.sh | tr -d '\r\n')"
          if ! printf '%s' "$prototype_license" | grep -Eq '^WA1-[0-9A-Fa-f]{32}-[A-Za-z0-9_-]{24,64}$'; then
            echo '::error::Relay did not return a server-verified Wesi Aero prototype license'
            exit 1
          fi
          echo "::add-mask::$prototype_license"
          printf 'WESI_AERO_PROTOTYPE_LICENSE=%s\n' "$prototype_license" >> "$GITHUB_ENV"

      - name: Validate Flutter and eight-protocol control plane
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
          curl -fsS --max-time 15 "$AERO_CONTROL_URL/healthz" | grep -q '"status":"ok"'
          curl -fsS --max-time 15 "$AERO_CONTROL_URL/v1/catalog" | jq -e '
            .servers[] | select(.id=="wesi-relay") |
            (["vless-reality","vmess","trojan","shadowsocks","hysteria2","tuic","wireguard","amneziawg"] - .protocols | length) == 0
          ' >/dev/null

      - name: Configure permanent Android release signature
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is missing"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/wesi-aero-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"
          store_password=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          key_password=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          alias_name=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n')
          keytool -list -keystore "$keystore" -storepass "$store_password" -alias "$alias_name" >/dev/null
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$store_password"
            printf 'keyAlias=%s\n' "$alias_name"
            printf 'keyPassword=%s\n' "$key_password"
          } > android/key.properties
          python3 scripts/configure_android_signing.py

      - name: Build signed ARM64 live release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6G -Dorg.gradle.daemon=false
        run: |
          set -euo pipefail
          test -n "${WESI_AERO_PROTOTYPE_LICENSE:-}"
          flutter build apk --release --split-per-abi \
            --dart-define=WESI_AERO_DEMO=false \
            --dart-define=WESI_AERO_CONTROL_URL="$AERO_CONTROL_URL" \
            --dart-define=WESI_AERO_PROTOTYPE_LICENSE="$WESI_AERO_PROTOTYPE_LICENSE"
          version="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          test -n "$version"
          name="Wesi-Aero-Android-Live-${version}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$name"
          test -s "$name"
          sha256sum "$name" | tee "$name.sha256"
          printf 'APK_GLOB=WesiAero/Wesi-Aero-Android-Live-%s-arm64-v8a.apk*\n' "$version" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Wesi-Aero-Android-Live-arm64
          path: ${{ env.APK_GLOB }}
          retention-days: 7
          if-no-files-found: error

      - name: Publish final ARM64 status
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='Multi-engine ARM64 APK is ready'; else state=failure; description='ARM64 multi-engine build failed'; fi
          payload=$(jq -nc --arg state "$state" --arg target_url "$TARGET_URL" --arg description "$description" --arg context "wesi-aero/arm64" '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" -d "$payload"
