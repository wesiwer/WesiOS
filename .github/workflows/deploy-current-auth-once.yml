name: Deploy WesiOS auth hook

on:
  push:
    branches: [main]
    paths:
      - 'server/pb_hooks/wesi_auth_bootstrap.pb.js'
      - 'server/pb_hooks/wesi_security.pb.js'
      - 'server/pb_hooks/wesi_mail_health.pb.js'
      - '.github/workflows/deploy-current-auth-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Validate auth hook
        run: |
          set -euo pipefail
          test -s server/pb_hooks/wesi_auth_bootstrap.pb.js
          test -s server/pb_hooks/wesi_security.pb.js
          test -s server/pb_hooks/wesi_mail_health.pb.js
          node --check server/pb_hooks/wesi_auth_bootstrap.pb.js
          node --check server/pb_hooks/wesi_security.pb.js
          node --check server/pb_hooks/wesi_mail_health.pb.js
          # Версия маркера намеренно не фиксируется точным номером.
          #
          # Здесь стояли owner-email-v9 и security-mail-v8. Код ушёл на v11 и
          # v9 коммитами 674733d и 367e336, а проверки остались, и деплой с
          # 9 августа падал на первом же grep — то есть заголовки
          # безопасности не доезжали до сервера вообще. Обнаружилось только
          # тогда, когда push в main наконец снова тронул эти файлы.
          #
          # Смысл проверки — убедиться, что выкладывается брендированная
          # версия хука, а не старая копия. Номер версии этому не служит: он
          # растёт при каждой правке письма и превращает ворота в мину
          # замедленного действия.
          grep -qE '2026-08-09\.owner-email-v[0-9]+' server/pb_hooks/wesi_auth_bootstrap.pb.js
          grep -qE '2026-08-09\.security-mail-v[0-9]+' server/pb_hooks/wesi_security.pb.js
          grep -q '2026-08-09.mail-design-v2' server/pb_hooks/wesi_auth_bootstrap.pb.js
          test "$(grep -c 'const wesiBuildOtpMail = (code, purpose) =>' server/pb_hooks/wesi_auth_bootstrap.pb.js)" -eq 2
          ! grep -q 'globalThis.wesiBuildOtpMail' server/pb_hooks/wesi_auth_bootstrap.pb.js
          grep -q '2026-08-09.mail-design-v2' server/pb_hooks/wesi_security.pb.js
          test "$(grep -c 'const wesiSecurityBuildOtpMail = (code, purpose) =>' server/pb_hooks/wesi_security.pb.js)" -eq 1
          ! grep -q 'globalThis.wesiSecurityBuildOtpMail' server/pb_hooks/wesi_security.pb.js
          grep -q 'durationSeconds \* 1000000000' server/pb_hooks/wesi_security.pb.js
          test "$(grep -c 'const asciiHtml = html.replace' server/pb_hooks/wesi_auth_bootstrap.pb.js)" -eq 2
          test "$(grep -c 'const asciiHtml = html.replace' server/pb_hooks/wesi_security.pb.js)" -eq 1
          grep -q 'https://api.wesi-inc.ru/portal/app_icon.png' server/pb_hooks/wesi_auth_bootstrap.pb.js
          grep -q 'https://api.wesi-inc.ru/portal/app_icon.png' server/pb_hooks/wesi_security.pb.js
          grep -q 'sendmailSelected' server/pb_hooks/wesi_mail_health.pb.js
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy and verify exact hook
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE="/tmp/wesi-current-auth-$GITHUB_RUN_ID"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes server/pb_hooks/wesi_auth_bootstrap.pb.js "$USER@$HOST:$REMOTE/auth.pb.js"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes server/pb_hooks/wesi_security.pb.js "$USER@$HOST:$REMOTE/security.pb.js"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes server/pb_hooks/wesi_mail_health.pb.js "$USER@$HOST:$REMOTE/mail-health.pb.js"
          $SSH "$USER@$HOST" "REMOTE='$REMOTE' bash -s" <<'REMOTE'
          set -euo pipefail
          AUTH_SOURCE="$REMOTE/auth.pb.js"
          SECURITY_SOURCE="$REMOTE/security.pb.js"
          MAIL_HEALTH_SOURCE="$REMOTE/mail-health.pb.js"
          AUTH_HOOK=/opt/pocketbase/pb_hooks/wesi_auth_bootstrap.pb.js
          SECURITY_HOOK=/opt/pocketbase/pb_hooks/wesi_security.pb.js
          MAIL_HEALTH_HOOK=/opt/pocketbase/pb_hooks/wesi_mail_health.pb.js
          test -s "$AUTH_SOURCE"
          test -s "$SECURITY_SOURCE"
          test -s "$MAIL_HEALTH_SOURCE"
          install_hook() {
            SOURCE="$1"
            HOOK="$2"
            if [ -w "$HOOK" ]; then
              cat "$SOURCE" > "$HOOK"
              chmod 0644 "$HOOK"
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo -n install -m 0644 "$SOURCE" "$HOOK"
            else
              exit 30
            fi
            if [ -r "$HOOK" ]; then
              cmp -s "$SOURCE" "$HOOK"
            else
              sudo -n cmp -s "$SOURCE" "$HOOK"
            fi
          }
          install_hook "$AUTH_SOURCE" "$AUTH_HOOK"
          install_hook "$SECURITY_SOURCE" "$SECURITY_HOOK"
          install_hook "$MAIL_HEALTH_SOURCE" "$MAIL_HEALTH_HOOK"
          SETUP_MATCHES=$(grep -Rsl --include='*.js' '/api/wesi/auth/setup-email' /opt/pocketbase/pb_hooks | wc -l)
          START_V2_MATCHES=$(grep -Rsl --include='*.js' '/api/wesi/auth/start-v2' /opt/pocketbase/pb_hooks | wc -l)
          VERIFY_MATCHES=$(grep -Rsl --include='*.js' '/api/wesi/auth/verify' /opt/pocketbase/pb_hooks | wc -l)
          test "$SETUP_MATCHES" -eq 1
          test "$START_V2_MATCHES" -eq 1
          test "$VERIFY_MATCHES" -eq 1
          # PocketBase watches pb_hooks and reloads changed JavaScript files.
          # The deploy user intentionally has no service-restart privilege.
          rm -rf "$REMOTE"
          curl -fsS --max-time 5 http://127.0.0.1:8090/api/health >/dev/null
          REMOTE
      - name: Verify exact production auth version
        run: |
          set -euo pipefail
          BODY=''
          for attempt in $(seq 1 20); do
            BODY=$(curl -fsS --max-time 20 https://api.wesi-inc.ru/api/wesi/auth/version || true)
            if grep -q '"version":"2026-08-09.owner-email-v9"' <<<"$BODY" &&
               grep -q '"jsonReadable":true' <<<"$BODY"; then
              break
            fi
            sleep 1
          done
          echo "$BODY"
          grep -q '"version":"2026-08-09.owner-email-v9"' <<<"$BODY"
          grep -q '"jsonReadable":true' <<<"$BODY"
      - name: Verify exact production security version
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --max-time 20 https://api.wesi-inc.ru/api/wesi/security/version)
          echo "$BODY"
          grep -q '"version":"2026-08-09.security-mail-v8"' <<<"$BODY"
          grep -q '"jsonReadable":true' <<<"$BODY"
      - name: Verify production mail
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://api.wesi-inc.ru/api/wesi/auth/mail-ready | grep -q '"ready":true'
          curl -fsS --max-time 20 https://api.wesi-inc.ru/portal/app_icon.png -o wesi-mail-logo.png
          test "$(wc -c < wesi-mail-logo.png)" -gt 1000
          test "$(od -An -tx1 -N8 wesi-mail-logo.png | tr -d ' \n')" = '89504e470d0a1a0a'
          echo CURRENT_AUTH_ACTIVE
