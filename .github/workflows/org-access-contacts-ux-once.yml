name: Organization access UX cleanup

on:
  push:
    branches:
      - chatgpt/org-access-contacts-ux-20260812

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-access-contacts-ux-20260812
          fetch-depth: 0
      - name: Remove temporary verification files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci
          rm -f .org-access-contacts-verify-trigger
          rm -f .github/scripts/org_access_contacts_ux.py
          rm -f .github/scripts/org_access_verify_hotfix.py
          rm -f .github/workflows/org-access-contacts-ux-once.yml
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove organization UX verification harness [skip ci]'
          git push origin HEAD:chatgpt/org-access-contacts-ux-20260812
