name: Organization access contacts UX verify

on:
  push:
    branches:
      - chatgpt/org-access-contacts-ux-20260812

permissions:
  contents: write

concurrency:
  group: org-access-contacts-ux-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-access-contacts-ux-20260812
          fetch-depth: 0

      - name: Apply deterministic hotfix
        run: python3 .github/scripts/org_access_verify_hotfix.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/organizations/widgets/organization_access_editor.dart \
            lib/features/organizations/organizations_screen.dart \
            lib/features/team/contacts_screen.dart \
            test/organization_ui_contract_test.dart

      - name: Verify and capture logs
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          flutter analyze --no-fatal-infos > .ci/org-access-analyze.log 2>&1
          ANALYZE=$?
          if [ "$ANALYZE" -eq 0 ]; then
            flutter test > .ci/org-access-test.log 2>&1
            TEST=$?
          else
            echo 'Tests not run because analyze failed.' > .ci/org-access-test.log
            TEST=99
          fi
          printf 'analyze=%s\ntest=%s\n' "$ANALYZE" "$TEST" > .ci/org-access-status.txt
          exit 0

      - name: Persist source and verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/organizations/widgets/organization_access_editor.dart \
                  lib/features/organizations/organizations_screen.dart \
                  lib/features/team/contacts_screen.dart \
                  test/organization_ui_contract_test.dart \
                  .ci/org-access-analyze.log \
                  .ci/org-access-test.log \
                  .ci/org-access-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record organization UX verification [skip ci]'
            git push origin HEAD:chatgpt/org-access-contacts-ux-20260812
          fi

      - name: Enforce result
        shell: bash
        run: |
          source .ci/org-access-status.txt
          test "$analyze" = 0
          test "$test" = 0
