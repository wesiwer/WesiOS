name: Organization access contacts UX once

on:
  push:
    branches:
      - chatgpt/org-access-contacts-ux-20260812

permissions:
  contents: write

concurrency:
  group: org-access-contacts-ux-once
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-access-contacts-ux-20260812
          fetch-depth: 0

      - name: Apply UX patch
        run: python3 .github/scripts/org_access_contacts_ux.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/organizations/widgets/organization_access_editor.dart \
            lib/features/organizations/organizations_screen.dart \
            lib/features/team/contacts_screen.dart \
            test/organization_ui_contract_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Full test suite
        run: flutter test

      - name: Remove one-shot harness and commit product changes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/org_access_contacts_ux.py
          rm -f .github/workflows/org-access-contacts-ux-once.yml
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m "feat(org): simplify access controls and organization contacts"
          git push origin HEAD:chatgpt/org-access-contacts-ux-20260812
