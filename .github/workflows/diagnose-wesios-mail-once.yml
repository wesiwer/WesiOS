name: Diagnose WesiOS mail once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesios-mail-once.yml'

permissions:
  contents: read

jobs:
  permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: employee-portal
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Check exact non-interactive sudo capabilities
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          POSTCONF=$(command -v postconf || true)
          SYSTEMCTL=$(command -v systemctl || true)
          if [ -n "$POSTCONF" ] && sudo -n -l "$POSTCONF" >/dev/null 2>&1; then
            echo 'sudo_postconf_allowed=true'
          else
            echo 'sudo_postconf_allowed=false'
          fi
          if [ -n "$SYSTEMCTL" ] && sudo -n -l "$SYSTEMCTL" reload postfix.service >/dev/null 2>&1; then
            echo 'sudo_postfix_reload_allowed=true'
          else
            echo 'sudo_postfix_reload_allowed=false'
          fi
          echo "smtpd_tls_security_level=$(postconf -h smtpd_tls_security_level 2>/dev/null || echo unknown)"
          REMOTE
