name: Diagnose WesiOS mail once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wesios-mail-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: employee-portal
    steps:
      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect live mail error without exposing data
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}"
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          sanitize() {
            sed -E \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<redacted-email>/g' \
              -e 's/(apiKey|password|token)[=:][^ ,;}]+/\1=<redacted>/Ig' \
              -e 's/[A-Za-z0-9+\/_-]{32,}/<redacted-value>/g'
          }

          for unit in pocketbase postfix opendkim; do
            state=$(systemctl is-active "$unit" 2>/dev/null || true)
            printf '%s=%s\n' "$unit" "${state:-unknown}"
          done

          SMTP_BANNER=$(
            timeout 5 bash -c '
              exec 3<>/dev/tcp/127.0.0.1/25
              IFS= read -r line <&3
              printf "QUIT\r\n" >&3
              printf "%s" "$line"
            ' 2>/dev/null || true
          )
          case "$SMTP_BANNER" in
            220*) echo 'smtp_socket=ready' ;;
            *) echo 'smtp_socket=failed' ;;
          esac

          if command -v postqueue >/dev/null 2>&1; then
            QUEUE_COUNT=$(postqueue -j 2>/dev/null | wc -l | tr -d ' ')
            echo "postfix_queue_count=${QUEUE_COUNT:-unknown}"
          else
            echo 'postfix_queue_count=unavailable'
          fi

          ALL_LOGS=''
          STATUS_LOGS=$(systemctl status pocketbase --no-pager -n 200 2>&1 || true)
          ALL_LOGS="$STATUS_LOGS"

          JOURNAL_LOGS=$(journalctl -u pocketbase --since '90 minutes ago' --no-pager -o cat 2>/dev/null || true)
          if [ -z "$JOURNAL_LOGS" ]; then
            JOURNAL_LOGS=$(sudo -n journalctl -u pocketbase --since '90 minutes ago' --no-pager -o cat 2>/dev/null || true)
          fi
          ALL_LOGS="$ALL_LOGS
          $JOURNAL_LOGS"

          FILTERED=$(printf '%s\n' "$ALL_LOGS" |
            grep -E 'WesiOS (SMTP delivery failed|security email delivery failed|owner email setup delivery failed)' |
            tail -n 20 || true)

          DB_FILTERED=''
          if command -v sqlite3 >/dev/null 2>&1 && [ -r /opt/pocketbase/pb_data/auxiliary.db ]; then
            DB_FILTERED=$(sqlite3 -readonly /opt/pocketbase/pb_data/auxiliary.db \
              "select message || ' ' || data from _logs where message like '%WesiOS%' or data like '%WesiOS%' order by created desc limit 20;" \
              2>/dev/null || true)
          fi

          COMBINED="$FILTERED
          $DB_FILTERED"
          COMBINED=$(printf '%s\n' "$COMBINED" | sed '/^[[:space:]]*$/d' | tail -n 20)
          if [ -z "$COMBINED" ]; then
            echo 'pocketbase_mail_error=not_visible'
            echo "sqlite_available=$(command -v sqlite3 >/dev/null 2>&1 && echo true || echo false)"
            echo "auxiliary_readable=$([ -r /opt/pocketbase/pb_data/auxiliary.db ] && echo true || echo false)"
          else
            echo 'pocketbase_mail_error_begin'
            printf '%s\n' "$COMBINED" | sanitize
            echo 'pocketbase_mail_error_end'
          fi
          REMOTE
