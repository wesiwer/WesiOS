name: PubGet Modern SSH V5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pubget-modern-ssh-v5.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - shell: bash
        run: |
          set +e
          flutter pub get >/tmp/pub.log 2>&1
          RC=$?
          set -e
          { echo "SOURCE=$(git rev-parse HEAD)"; echo "PUB_GET=$RC"; tail -n 100 /tmp/pub.log; } > .github/pubget-modern-ssh-v5.txt
          git config user.name 'WesiOS PubGet V5'
          git config user.email 'actions@users.noreply.github.com'
          git switch -C diag/pubget-modern-ssh-v5
          git add .github/pubget-modern-ssh-v5.txt
          git commit -m 'ops: capture pubget modern SSH v5'
          git push --force origin HEAD:diag/pubget-modern-ssh-v5
          test "$RC" -eq 0
