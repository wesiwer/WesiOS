name: Wesi AI Stage 10 Lease Validate

on:
  push:
    branches: [agent/wesi-ai-stage10-remote-worker-finalize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage10-lease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage10-remote-worker-finalize
          fetch-depth: 0
      - name: Apply Stage 10 review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/wesi_remote_worker_controller_test.dart')
          text = path.read_text()
          text = text.replace(
              'Future<void> _enqueueBuild(',
              'Future<WesiScheduledJob> _enqueueBuild(',
          )
          path.write_text(text)
          PY
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Format Stage 10 lease lifecycle
        run: |
          dart format \
            lib/features/ai/runtime/wesi_remote_worker_models.dart \
            lib/features/ai/runtime/wesi_remote_worker_auth.dart \
            lib/features/ai/runtime/wesi_remote_worker_pairing.dart \
            lib/features/ai/runtime/wesi_remote_worker_registry.dart \
            lib/features/ai/runtime/wesi_remote_worker_lease_store.dart \
            lib/features/ai/runtime/wesi_remote_worker_controller.dart \
            test/wesi_remote_worker_protocol_test.dart \
            test/wesi_remote_worker_controller_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Stage 8 regressions
        run: |
          flutter test \
            test/wesi_resource_scheduler_test.dart \
            test/wesi_job_queue_test.dart \
            test/wesi_job_coordinator_test.dart
      - name: Stage 10 protocol regressions
        run: flutter test test/wesi_remote_worker_protocol_test.dart
      - name: Stage 10 lease and reconnect regressions
        run: flutter test test/wesi_remote_worker_controller_test.dart
      - name: Commit validated formatter and review output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/ai/runtime/wesi_remote_worker_models.dart \
            lib/features/ai/runtime/wesi_remote_worker_auth.dart \
            lib/features/ai/runtime/wesi_remote_worker_pairing.dart \
            lib/features/ai/runtime/wesi_remote_worker_registry.dart \
            lib/features/ai/runtime/wesi_remote_worker_lease_store.dart \
            lib/features/ai/runtime/wesi_remote_worker_controller.dart \
            test/wesi_remote_worker_protocol_test.dart \
            test/wesi_remote_worker_controller_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(ai): finalize Stage 10 remote worker lifecycle"
          git push origin HEAD:agent/wesi-ai-stage10-remote-worker-finalize
