name: Wesi AI Stage 10 Protocol Validate

on:
  push:
    branches: [agent/wesi-ai-stage10-remote-worker]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage10-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage10-remote-worker
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Format Stage 10 protocol
        run: |
          dart format \
            lib/features/ai/runtime/wesi_remote_worker_models.dart \
            lib/features/ai/runtime/wesi_remote_worker_auth.dart \
            lib/features/ai/runtime/wesi_remote_worker_pairing.dart \
            lib/features/ai/runtime/wesi_remote_worker_registry.dart \
            test/wesi_remote_worker_protocol_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Stage 8 regressions
        run: |
          flutter test \
            test/wesi_resource_scheduler_test.dart \
            test/wesi_job_queue_test.dart \
            test/wesi_job_coordinator_test.dart
      - name: Pairing QR regression
        run: flutter test test/wesi_remote_worker_protocol_test.dart --plain-name "pairing QR excludes poll secret and credential"
      - name: Pairing one-time regression
        run: flutter test test/wesi_remote_worker_protocol_test.dart --plain-name "pairing claim and credential delivery are one-time"
      - name: Pairing scope expiry regression
        run: flutter test test/wesi_remote_worker_protocol_test.dart --plain-name "pairing rejects wrong owner scope and expired QR"
      - name: HMAC replay regression
        run: flutter test test/wesi_remote_worker_protocol_test.dart --plain-name "HMAC signing rejects body tamper, stale request and replay"
      - name: Heartbeat regression
        run: flutter test test/wesi_remote_worker_protocol_test.dart --plain-name "heartbeat feeds Stage 8 worker profile and expires offline"
      - name: Mailbox replay regression
        run: flutter test test/wesi_remote_worker_protocol_test.dart --plain-name "mailbox is idempotent and worker sequence rejects replay"
