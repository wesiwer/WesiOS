name: Apply Wesi AI step drilldown once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-wesi-ai-step-drilldown-once.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: apply-wesi-ai-step-drilldown-once
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'wesiwer/WesiOS'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark patch pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'Wesi AI Step Drilldown Patch',
              description: 'Applying and verifying full technical step sheet',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Apply exact drilldown patch
        run: python3 .github/scripts/apply_wesi_ai_step_drilldown.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/ai/widgets/wesi_ai_rich_message.dart \
            lib/features/ai/widgets/wesi_ai_step_detail_sheet.dart \
            test/wesi_ai_step_detail_sheet_test.dart

      - name: Analyze changed UI
        run: |
          flutter analyze --no-fatal-infos \
            lib/features/ai/widgets/wesi_ai_rich_message.dart \
            lib/features/ai/widgets/wesi_ai_step_detail_sheet.dart

      - name: Test drilldown and specialist visibility
        run: |
          flutter test test/wesi_ai_step_detail_sheet_test.dart
          flutter test test/wesi_ai_subagent_visibility_test.dart

      - name: Commit verified patch to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/ai/widgets/wesi_ai_rich_message.dart \
            lib/features/ai/widgets/wesi_ai_step_detail_sheet.dart \
            test/wesi_ai_step_detail_sheet_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No drilldown changes to commit."
            exit 0
          fi
          git commit -m "feat(ai): add full step drilldown sheet"

          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict with parallel main update."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main advanced during push; retrying ($attempt/4)"
            sleep 3
          done
          echo "Unable to push verified drilldown after retries."
          exit 1

      - name: Report patch result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'Wesi AI Step Drilldown Patch',
              description: state === 'success'
                ? 'Full technical step drilldown applied and verified'
                : 'Step drilldown verification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
