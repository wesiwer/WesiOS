name: Apply concrete system requirements

on:
  push:
    branches: [main]
    paths:
      - tools/patch_concrete_system_requirements.py
      - .github/workflows/apply-concrete-system-requirements.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-concrete-system-requirements
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply targeted requirements patch
        run: python3 tools/patch_concrete_system_requirements.py

      - name: Validate exact requirements
        run: |
          set -euo pipefail
          grep -q 'Core i3-6100U / Ryzen 3 2200U' server/employee-portal/index.html
          grep -q 'Core i5-8250U / Ryzen 5 3500U' server/employee-portal/index.html
          grep -q '4 ГБ' server/employee-portal/index.html
          grep -q '8 ГБ' server/employee-portal/index.html
          grep -q 'Snapdragon 660/665' server/employee-portal/index.html
          grep -q '1 Мбит/с' server/employee-portal/index.html
          grep -q '10 Мбит/с' server/employee-portal/index.html
          test "$(grep -o 'Core i3-6100U / Ryzen 3 2200U' server/employee-portal/index.html | wc -l)" -eq 2
          test "$(grep -o 'Snapdragon 660/665' server/employee-portal/index.html | wc -l)" -eq 2
          node --check server/employee-portal/app.js
          node --check server/employee-portal/motion-v6.js
          git diff --check

      - name: Commit portal change
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/employee-portal/index.html
          git commit -m 'feat(portal): publish concrete WesiOS hardware requirements'
          git push
