name: Apply repeat-audit integrity fixes

on:
  push:
    branches:
      - agent/org-hierarchy-remediation-1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-remediation-1
      - name: Patch repeat-audit findings
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          old_crm = """  static Future<void> saveInteraction(CrmInteraction interaction) async {
    final clients = {for (final c in await clientsRaw()) c.id: c};
    final client = clients[interaction.clientId];
    if (client == null) throw StateError('CRM client does not exist');
    await _requireOrgWrite(client.organizationId);
    if (!_clientOwnedByCurrent(client)) {
      final deals = {for (final d in await dealsRaw()) d.id: d};
      final linked = interaction.dealId == null ? null : deals[interaction.dealId!];
      if (linked == null || !_dealOwnedByCurrent(linked, clients)) {
        throw StateError('CRM interaction parent is outside employee scope');
      }
    }

    final all = await interactionsRaw();
"""
          new_crm = """  static Future<void> saveInteraction(CrmInteraction interaction) async {
    final clients = {for (final c in await clientsRaw()) c.id: c};
    final client = clients[interaction.clientId];
    if (client == null) throw StateError('CRM client does not exist');
    await _requireOrgWrite(client.organizationId);

    final deals = {for (final d in await dealsRaw()) d.id: d};
    final linked = interaction.dealId == null ? null : deals[interaction.dealId!];
    if (interaction.dealId != null &&
        (linked == null ||
            linked.clientId != client.id ||
            linked.organizationId != client.organizationId)) {
      throw StateError('CRM interaction deal/client organization mismatch');
    }
    if (!_clientOwnedByCurrent(client) &&
        (linked == null || !_dealOwnedByCurrent(linked, clients))) {
      throw StateError('CRM interaction parent is outside employee scope');
    }

    final all = await interactionsRaw();
"""
          replace_once(
              'lib/features/crm/services/crm_service.dart',
              old_crm,
              new_crm,
              'CRM interaction parent integrity')

          old_sync = """    if (incoming.ownerEmployeeId != null &&
        !_employeeExists(incoming.ownerEmployeeId!)) return false;
    await b.put(incoming.id, incoming);
    return true;
  }
}

class TasksSync extends SyncCollection<TaskModel> {
"""
          new_sync = """    if (incoming.ownerEmployeeId != null &&
        !_employeeExists(incoming.ownerEmployeeId!)) return false;
    await b.put(incoming.id, incoming);
    return true;
  }

  @override
  Future<void> removeById(String id) async {
    final b = box();
    final existing = b?.get(id);
    if (b == null || existing == null) return;
    // A linked inter-org leg is part of a journaled logical transfer. Remote
    // tombstones may not delete one side independently; cancellation/recovery
    // must go through InterOrgTransferService.
    if (existing.interOrgTransferId != null ||
        existing.source == TransactionSource.interorg) return;
    await b.delete(id);
  }
}

class TasksSync extends SyncCollection<TaskModel> {
"""
          replace_once(
              'lib/core/sync/sync_codec.dart',
              old_sync,
              new_sync,
              'inter-org transaction tombstone integrity')

          p = Path('test/task_crm_organization_scope_test.dart')
          text = p.read_text(encoding='utf-8')
          marker = "CRM interaction cannot link a deal from another client or organization"
          if marker not in text:
              insert = r'''

  test('CRM interaction cannot link a deal from another client or organization', () async {
    final alice = await addEmployee('alice');
    final bob = await addEmployee('bob');
    await OrganizationAccessService.grant(
      employeeId: alice.id,
      organizationId: OrganizationModel.rootId,
      includeSubtree: false,
      permissions: const [OrganizationPermissions.view],
      enforceActor: false,
    );
    await CrmService.saveClient(CrmClient(
      id: 'alice-client',
      name: 'Alice client',
      createdAt: DateTime(2026, 1, 1),
      updatedAt: DateTime(2026, 1, 1),
      organizationId: OrganizationModel.rootId,
      ownerEmployeeId: alice.id,
    ));
    await CrmService.saveClient(CrmClient(
      id: 'bob-client',
      name: 'Bob client',
      createdAt: DateTime(2026, 1, 1),
      updatedAt: DateTime(2026, 1, 1),
      organizationId: OrganizationModel.rootId,
      ownerEmployeeId: bob.id,
    ));
    await CrmService.saveDeal(CrmDeal(
      id: 'bob-deal',
      clientId: 'bob-client',
      title: 'Bob deal',
      createdAt: DateTime(2026, 1, 1),
      updatedAt: DateTime(2026, 1, 1),
      organizationId: OrganizationModel.rootId,
      responsibleEmployeeId: bob.id,
    ));

    await signIn(alice.id);
    await OrganizationContext.selectOrganization(OrganizationModel.rootId);
    await OrganizationContext.setScope(OrganizationScope.only);

    await expectLater(
      CrmService.saveInteraction(CrmInteraction(
        id: 'forged-interaction',
        clientId: 'alice-client',
        dealId: 'bob-deal',
        title: 'Forged link',
        at: DateTime(2026, 8, 1),
      )),
      throwsA(isA<StateError>()),
    );
    expect(
      (await CrmService.interactionsRaw()).any((i) => i.id == 'forged-interaction'),
      isFalse,
    );
  });
'''
              pos = text.rfind('\n}')
              if pos < 0:
                  raise SystemExit('task/crm test closing brace missing')
              p.write_text(text[:pos] + insert + text[pos:], encoding='utf-8')

          p = Path('test/sync_corruption_guard_test.dart')
          text = p.read_text(encoding='utf-8')
          marker = 'sync tombstone cannot delete one linked inter-org ledger leg'
          if marker not in text:
              insert = r'''

  test('sync tombstone cannot delete one linked inter-org ledger leg', () async {
    final account = await AccountService.ensureMain(
      organizationId: OrganizationModel.rootId,
    );
    final leg = TransactionModel(
      id: 'transfer-1_debit',
      title: 'Inter-org debit',
      amount: 100,
      type: TransactionType.expense,
      date: DateTime(2026, 8, 1),
      accountId: account.id,
      organizationId: OrganizationModel.rootId,
      source: TransactionSource.interorg,
      interOrgTransferId: 'transfer-1',
    );
    await Hive.box<TransactionModel>('wesios_treasury').put(leg.id, leg);
    await TransactionsSync().removeById(leg.id);
    expect(
      Hive.box<TransactionModel>('wesios_treasury').containsKey(leg.id),
      isTrue,
    );
  });
'''
              pos = text.rfind('\n}')
              if pos < 0:
                  raise SystemExit('sync test closing brace missing')
              p.write_text(text[:pos] + insert + text[pos:], encoding='utf-8')

          self_path = Path('.github/workflows/org-repeat-audit-fix.yml')
          if self_path.exists():
              self_path.unlink()

      - name: Format, validate and commit
        shell: bash
        run: |
          dart format lib/features/crm/services/crm_service.dart lib/core/sync/sync_codec.dart test/task_crm_organization_scope_test.dart test/sync_corruption_guard_test.dart
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close repeat-audit CRM and inter-org sync bypasses"
          git push origin HEAD:agent/org-hierarchy-remediation-1
