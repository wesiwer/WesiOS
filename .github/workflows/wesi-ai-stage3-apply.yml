name: Validate Wesi AI Stage 3 memory engine

on:
  push:
    branches:
      - agent/wesi-ai-stage3-memory-engine

permissions:
  contents: write

jobs:
  validate-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate server memory hooks
        run: |
          set -euo pipefail
          for file in \
            server/pb_hooks/wesi_ai_memory.pb.js \
            server/pb_hooks/wesi_ai_lib.js \
            server/pb_hooks/wesi_ai_routes.pb.js \
            server/pb_hooks/wesi_ai_stream.pb.js \
            server/pb_hooks/wesi_ai_lobby_core.js \
            server/pb_hooks/wesi_ai_lobby_turn.js; do
            node --check "$file"
          done
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Format Stage 3 Dart
        run: |
          dart format \
            lib/features/ai/memory \
            lib/features/ai/models/wesi_ai_chat_models.dart \
            lib/features/ai/storage/wesi_ai_local_store.dart \
            lib/features/ai/wesi_ai_api.dart \
            lib/features/ai/wesi_ai_lobby_api.dart \
            lib/features/ai/controllers/wesi_ai_chat_controller.dart \
            lib/features/ai/wesi_ai_lobby_controller.dart \
            lib/features/ai/ai_assistant_v2_screen.dart \
            test/wesi_ai_memory_engine_test.dart \
            test/wesi_ai_queue_hardening_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test memory and queue regressions
        run: flutter test test/wesi_ai_memory_engine_test.dart test/wesi_ai_queue_hardening_test.dart test/wesi_ai_turn_intent_test.dart
      - name: Commit formatting only
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/ai test
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(ai): format validated Stage 3 memory code [stage3-formatted]'
          git push origin HEAD:agent/wesi-ai-stage3-memory-engine
