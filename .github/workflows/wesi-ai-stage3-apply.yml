name: Apply Wesi AI Stage 3 memory engine

on:
  push:
    branches:
      - agent/wesi-ai-stage3-memory-engine

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[stage3-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 3 integration
        run: python tool/wesi_ai_stage3_apply.py
      - name: Validate server memory hook
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_ai_memory.pb.js
          node --check server/pb_hooks/wesi_ai_lib.js
          node --check server/pb_hooks/wesi_ai_routes.pb.js
          node --check server/pb_hooks/wesi_ai_stream.pb.js
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Format changed Dart
        run: |
          dart format \
            lib/features/ai/memory \
            lib/features/ai/models/wesi_ai_chat_models.dart \
            lib/features/ai/storage/wesi_ai_local_store.dart \
            lib/features/ai/wesi_ai_api.dart \
            lib/features/ai/wesi_ai_lobby_api.dart \
            lib/features/ai/controllers/wesi_ai_chat_controller.dart \
            lib/features/ai/wesi_ai_lobby_controller.dart \
            lib/features/ai/ai_assistant_v2_screen.dart \
            test/wesi_ai_memory_engine_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test memory and queue regressions
        run: flutter test test/wesi_ai_memory_engine_test.dart test/wesi_ai_queue_hardening_test.dart test/wesi_ai_turn_intent_test.dart
      - name: Commit validated Stage 3 implementation
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/ai server/pb_hooks test
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(ai): implement local-first memory engine [stage3-applied]'
          git push origin HEAD:agent/wesi-ai-stage3-memory-engine
