name: Repair Remaining Wesi AI Data Contracts Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ai-remaining-data-contracts-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch in runner
        run: python3 .github/scripts/repair-ai-remaining-data-contracts.py

      - name: Check modified JavaScript
        run: |
          set -euo pipefail
          for f in \
            server/pb_hooks/wesi_ai_calendar_write_tools.js \
            server/pb_hooks/wesi_ai_knowledge_write_tools.js \
            server/pb_hooks/wesi_ai_action_broker.js \
            server/pb_hooks/wesi_ai_connector_vault.js \
            server/pb_hooks/wesi_ai_github_connector.js \
            server/pb_hooks/wesi_ai_media_lib.js \
            server/pb_hooks/wesi_ai_remote_worker.pb.js \
            server/pb_hooks/wesi_ai_lib.js; do
            node --check "$f"
          done

      - name: Run data-contract regressions
        run: |
          set -euo pipefail
          node --test server/pb_hooks/wesi_ai_remaining_data_contract_test.mjs
          node --test server/pb_hooks/wesi_ai_tool_data_access_contract_test.mjs
          node --test server/pb_hooks/wesi_ai_finance_tools_test.mjs server/pb_hooks/wesi_ai_horizon_truth_test.mjs
          node --test server/pb_hooks/wesi_ai_history_contract_test.mjs server/pb_hooks/wesi_ai_lib_history_test.mjs server/pb_hooks/wesi_ai_stream_contract_test.mjs
          git diff --check

      - name: Commit only validated runtime changes
        run: |
          set -euo pipefail
          git config user.name 'WesiOS AI Contract Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            server/pb_hooks/wesi_ai_calendar_write_tools.js \
            server/pb_hooks/wesi_ai_knowledge_write_tools.js \
            server/pb_hooks/wesi_ai_action_broker.js \
            server/pb_hooks/wesi_ai_connector_vault.js \
            server/pb_hooks/wesi_ai_github_connector.js \
            server/pb_hooks/wesi_ai_media_lib.js \
            server/pb_hooks/wesi_ai_remote_worker.pb.js \
            server/pb_hooks/wesi_ai_lib.js \
            server/pb_hooks/wesi_ai_remaining_data_contract_test.mjs
          git diff --cached --check
          git commit -m 'fix(ai): fail closed across remaining tool runtimes'
          git push origin HEAD:main
