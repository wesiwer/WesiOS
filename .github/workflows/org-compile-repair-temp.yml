name: Organization compile repair loop

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.head_ref == 'agent/org-compile-repair-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-v1
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Apply deterministic compatibility repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1) New enum values must be handled anywhere old UI switch-expressions
          # still know only the pre-org AccountKind set. Reuse the old savings
          # presentation as a conservative visual fallback; no business logic is
          # changed by this patch.
          for p in Path('lib').rglob('*.dart'):
              text = p.read_text(encoding='utf-8')
              lines = text.splitlines(True)
              out=[]; i=0; touched=False
              while i < len(lines):
                  if 'switch (' not in lines[i]:
                      out.append(lines[i]); i+=1; continue
                  block=[lines[i]]; j=i+1
                  while j < len(lines) and j < i+100:
                      block.append(lines[j])
                      if lines[j].lstrip().startswith('};'):
                          break
                      j+=1
                  source=''.join(block)
                  if 'AccountKind.' in source and '=>' in source:
                      fallback=None; indent='      '
                      for bl in block:
                          m=re.match(r'^(\s*)AccountKind\.savings\s*=>\s*(.+),\s*$', bl.rstrip('\n'))
                          if m: indent,fallback=m.group(1),m.group(2); break
                      if fallback is None:
                          for bl in block:
                              m=re.match(r'^(\s*)AccountKind\.project\s*=>\s*(.+),\s*$', bl.rstrip('\n'))
                              if m: indent,fallback=m.group(1),m.group(2); break
                      if fallback is not None:
                          k=next((n for n,b in enumerate(block) if b.lstrip().startswith('};')),len(block))
                          add=[]
                          if 'AccountKind.reserve' not in source: add.append(f'{indent}AccountKind.reserve => {fallback},\n')
                          if 'AccountKind.other' not in source: add.append(f'{indent}AccountKind.other => {fallback},\n')
                          if add: block[k:k]=add; touched=True
                  out.extend(block); i=j+1
              new=''.join(out)
              # 2) Legacy TeamPermissions has no stable team-finance semantic.
              # Migration must fail closed; explicit org grants enable it later.
              if '.permissions.canSeeOthersStats' in new:
                  new=new.replace('employee.permissions.canSeeOthersStats', 'false')
                  touched=True
              if touched and new != text:
                  p.write_text(new,encoding='utf-8')
          PY
          dart format lib test >/dev/null
          flutter pub get
      - name: Commit deterministic repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WesiOS CI Fix"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add lib test
            git commit -m "fix(org): resolve hierarchy compile compatibility"
            git push origin HEAD:agent/org-hierarchy-v1
          fi
      - name: Re-analyze and report remaining errors
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos > analyze.log 2>&1
          code=$?
          errors=$(grep -Ei 'error' analyze.log | head -60 || true)
          body=$(cat <<EOF
          TEMP COMPILE REPAIR — DO NOT MERGE.

          Analyzer exit: \`$code\`

          \`\`\`text
          $errors
          \`\`\`
          EOF
          )
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          exit "$code"
