name: Release Windows installer 0.19.20 once

on:
  push:
    branches:
      - agent/org-hierarchy-remediation-1
    paths:
      - '.github/workflows/release-installer-0.19.20-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch installer workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run publish-windows-installer.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref agent/org-hierarchy-remediation-1
