name: Temporary org final repair runner

on:
  push:
    branches: [chatgpt/org-main-v2]
    paths: ['org-final-repair-trigger.txt']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-main-v2
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def add_import(path, anchor, line):
              p=Path(path); s=p.read_text()
              if line not in s:
                  if anchor not in s: raise SystemExit(f'import anchor missing {path}')
                  p.write_text(s.replace(anchor, anchor+line, 1))
          for path in ['test/crm_service_test.dart','test/task_assignment_test.dart','test/tasks_screen_layout_test.dart','test/accounts_test.dart']:
              add_import(path, "import 'package:hive/hive.dart';\n", "import 'package:wesios/features/organizations/models/organization_model.dart';\n")
              p=Path(path); s=p.read_text(); marker=next((l for l in s.splitlines(True) if 'Hive.init(' in l),None)
              if marker is None: raise SystemExit(f'Hive.init missing {path}')
              if 'Hive.registerAdapter(OrganizationModelAdapter());' not in s:
                  s=s.replace(marker, marker+'    Hive.registerAdapter(OrganizationStatusAdapter());\n    Hive.registerAdapter(OrganizationModelAdapter());\n',1)
              p.write_text(s)
          for path in ['test/sync_engine_test.dart','test/backup_service_test.dart','test/accounts_test.dart']:
              p=Path(path); s=p.read_text(); marker='    Hive.registerAdapter(RecurringPeriodAdapter());\n'
              if marker in s and 'Hive.registerAdapter(TransactionSourceAdapter());' not in s:
                  s=s.replace(marker, marker+'    Hive.registerAdapter(TransactionSourceAdapter());\n',1)
              p.write_text(s)
          path='test/sync_engine_test.dart'
          add_import(path, "import 'package:wesios/features/knowledge/models/article_model.dart';\n", "import 'package:wesios/features/organizations/models/inter_org_transfer_model.dart';\nimport 'package:wesios/features/organizations/models/organization_access_grant.dart';\nimport 'package:wesios/features/organizations/models/organization_model.dart';\nimport 'package:wesios/features/organizations/models/transaction_audit_model.dart';\n")
          p=Path(path); s=p.read_text(); anchor='    Hive.registerAdapter(EmployeeModelAdapter());\n'
          regs='    Hive.registerAdapter(OrganizationStatusAdapter());\n    Hive.registerAdapter(OrganizationModelAdapter());\n    Hive.registerAdapter(OrganizationAccessGrantAdapter());\n    Hive.registerAdapter(InterOrgTransferTypeAdapter());\n    Hive.registerAdapter(InterOrgTransferModelAdapter());\n    Hive.registerAdapter(TransactionAuditModelAdapter());\n'
          if 'Hive.registerAdapter(OrganizationAccessGrantAdapter());' not in s:
              if anchor not in s: raise SystemExit('sync adapter anchor missing')
              s=s.replace(anchor,anchor+regs,1)
          s=s.replace("      expect(back.tags, ['работа', 'срочно']);","      expect(back.tags, containsAll(['работа', 'срочно']));\n      expect(back.tags.where((tag) => !tag.startsWith('wesios:')), ['работа', 'срочно']);",1)
          p.write_text(s)
          p=Path('lib/features/team/team_stats_screen.dart'); s=p.read_text()
          if "../organizations/services/organization_access_service.dart" not in s:
              s=s.replace("import '../tasks/models/task_model.dart';\n","import '../organizations/services/organization_access_service.dart';\nimport '../organizations/services/organization_context.dart';\nimport '../tasks/models/task_model.dart';\n",1)
          if 'int _loadEpoch = 0;' not in s: s=s.replace('  List<TaskModel> _tasks = const [];\n','  List<TaskModel> _tasks = const [];\n  int _loadEpoch = 0;\n',1)
          if 'OrganizationContext.revision.addListener(_changed);' not in s: s=s.replace('    TaskService.revision.addListener(_changed);\n','    TaskService.revision.addListener(_changed);\n    OrganizationContext.revision.addListener(_changed);\n    OrganizationAccessService.revision.addListener(_changed);\n',1)
          if 'OrganizationContext.revision.removeListener(_changed);' not in s: s=s.replace('    TaskService.revision.removeListener(_changed);\n','    TaskService.revision.removeListener(_changed);\n    OrganizationContext.revision.removeListener(_changed);\n    OrganizationAccessService.revision.removeListener(_changed);\n',1)
          old='  Future<void> _load() async {\n    final tasks = await TaskService().getAll();\n    if (mounted) setState(() => _tasks = tasks);\n  }'
          new='  Future<void> _load() async {\n    final epoch = ++_loadEpoch;\n    final tasks = await TaskService().getAll();\n    if (mounted && epoch == _loadEpoch) {\n      setState(() => _tasks = tasks);\n    }\n  }'
          if old in s: s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm -f org-final-repair-trigger.txt .github/workflows/org-final-verify-temp.yml .github/workflows/org-final-repair-temp.yml
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finish organization integration compatibility'
          git push origin HEAD:chatgpt/org-main-v2
