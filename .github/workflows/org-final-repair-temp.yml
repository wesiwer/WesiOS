name: Temporary org final repair runner

on:
  push:
    branches: [chatgpt/org-main-v2]
    paths: ['org-final-repair-trigger.txt']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-main-v2
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path); s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          def add_import(path, anchor, line):
              p=Path(path); s=p.read_text()
              if line not in s:
                  if anchor not in s: raise SystemExit(f'import anchor missing {path}')
                  s=s.replace(anchor, anchor+line, 1)
                  p.write_text(s)

          def add_reg(path, anchor, lines):
              p=Path(path); s=p.read_text()
              missing=''.join(x for x in lines if x.strip() and x not in s)
              if not missing: return
              if anchor not in s: raise SystemExit(f'reg anchor missing {path}')
              s=s.replace(anchor, anchor+missing, 1)
              p.write_text(s)

          # Tests whose service paths now establish the organization baseline.
          for path in [
              'test/crm_service_test.dart',
              'test/task_assignment_test.dart',
              'test/tasks_screen_layout_test.dart',
              'test/accounts_test.dart',
          ]:
              add_import(path, "import 'package:hive/hive.dart';\n", "import 'package:wesios/features/organizations/models/organization_model.dart';\n")
              add_reg(path, '    Hive.init(', [])
              p=Path(path); s=p.read_text()
              marker = next((line for line in s.splitlines(True) if 'Hive.init(' in line), None)
              if marker is None: raise SystemExit(f'Hive.init missing {path}')
              regs = "    Hive.registerAdapter(OrganizationStatusAdapter());\n    Hive.registerAdapter(OrganizationModelAdapter());\n"
              if 'Hive.registerAdapter(OrganizationModelAdapter());' not in s:
                  s=s.replace(marker, marker+regs, 1)
              p.write_text(s)

          # TransactionSource is a real persisted enum and must be registered in
          # tests that write TransactionModel directly, just like production main.
          for path in ['test/sync_engine_test.dart', 'test/backup_service_test.dart', 'test/accounts_test.dart']:
              p=Path(path); s=p.read_text()
              marker = next((line for line in s.splitlines(True) if 'Hive.registerAdapter(RecurringPeriodAdapter());' in line), None)
              if marker and 'Hive.registerAdapter(TransactionSourceAdapter());' not in s:
                  s=s.replace(marker, marker+'    Hive.registerAdapter(TransactionSourceAdapter());\n', 1)
              p.write_text(s)

          # Sync test touches org-aware collections; register the same org adapters
          # used by the app bootstrap so failures test sync semantics, not Hive setup.
          path='test/sync_engine_test.dart'
          add_import(path, "import 'package:wesios/features/knowledge/models/article_model.dart';\n",
                     "import 'package:wesios/features/organizations/models/inter_org_transfer_model.dart';\nimport 'package:wesios/features/organizations/models/organization_access_grant.dart';\nimport 'package:wesios/features/organizations/models/organization_model.dart';\nimport 'package:wesios/features/organizations/models/transaction_audit_model.dart';\n")
          p=Path(path); s=p.read_text()
          anchor='    Hive.registerAdapter(EmployeeModelAdapter());\n'
          regs=("    Hive.registerAdapter(OrganizationStatusAdapter());\n"
                "    Hive.registerAdapter(OrganizationModelAdapter());\n"
                "    Hive.registerAdapter(OrganizationAccessGrantAdapter());\n"
                "    Hive.registerAdapter(InterOrgTransferTypeAdapter());\n"
                "    Hive.registerAdapter(InterOrgTransferModelAdapter());\n"
                "    Hive.registerAdapter(TransactionAuditModelAdapter());\n")
          if 'Hive.registerAdapter(OrganizationAccessGrantAdapter());' not in s:
              if anchor not in s: raise SystemExit('sync adapter anchor missing')
              s=s.replace(anchor, anchor+regs, 1)
          s=s.replace("      expect(back.tags, ['работа', 'срочно']);",
                      "      expect(back.tags, containsAll(['работа', 'срочно']));\n      expect(back.tags.where((tag) => !tag.startsWith('wesios:')), ['работа', 'срочно']);", 1)
          p.write_text(s)

          # TeamStats must refresh when organization scope or access grants change,
          # and an older async load must not overwrite a newer context.
          path='lib/features/team/team_stats_screen.dart'
          p=Path(path); s=p.read_text()
          if "../organizations/services/organization_access_service.dart" not in s:
              s=s.replace("import '../tasks/models/task_model.dart';\n",
                          "import '../organizations/services/organization_access_service.dart';\nimport '../organizations/services/organization_context.dart';\nimport '../tasks/models/task_model.dart';\n", 1)
          s=s.replace('  List<TaskModel> _tasks = const [];\n', '  List<TaskModel> _tasks = const [];\n  int _loadEpoch = 0;\n', 1)
          s=s.replace('    TeamService.revision.addListener(_changed);\n    TaskService.revision.addListener(_changed);\n',
                      '    TeamService.revision.addListener(_changed);\n    TaskService.revision.addListener(_changed);\n    OrganizationContext.revision.addListener(_changed);\n    OrganizationAccessService.revision.addListener(_changed);\n', 1)
          s=s.replace('    TeamService.revision.removeListener(_changed);\n    TaskService.revision.removeListener(_changed);\n',
                      '    TeamService.revision.removeListener(_changed);\n    TaskService.revision.removeListener(_changed);\n    OrganizationContext.revision.removeListener(_changed);\n    OrganizationAccessService.revision.removeListener(_changed);\n', 1)
          s=s.replace('  Future<void> _load() async {\n    final tasks = await TaskService().getAll();\n    if (mounted) setState(() => _tasks = tasks);\n  }',
                      '  Future<void> _load() async {\n    final epoch = ++_loadEpoch;\n    final tasks = await TaskService().getAll();\n    if (mounted && epoch == _loadEpoch) {\n      setState(() => _tasks = tasks);\n    }\n  }', 1)
          p.write_text(s)
          PY
          rm -f org-final-repair-trigger.txt .github/workflows/org-final-verify-temp.yml
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finish organization integration compatibility'
          git push origin HEAD:chatgpt/org-main-v2
