name: Configure WesiOS release artifacts directory

on:
  pull_request:
    types: [opened, reopened]

permissions:
  actions: write
  contents: read

jobs:
  configure:
    if: github.head_ref == 'ci/set-release-artifacts-dir'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set WESI_ARTIFACTS_DIR repository variable
        env:
          GH_TOKEN: ${{ github.token }}
          VALUE: /opt/pocketbase/pb_public/artifacts
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/actions/variables/WESI_ARTIFACTS_DIR" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/actions/variables/WESI_ARTIFACTS_DIR" \
              -f name='WESI_ARTIFACTS_DIR' \
              -f value="$VALUE" >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/variables" \
              -f name='WESI_ARTIFACTS_DIR' \
              -f value="$VALUE" >/dev/null
          fi

          actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/variables/WESI_ARTIFACTS_DIR" --jq '.value')
          test "$actual" = "$VALUE"
          echo "WESI_ARTIFACTS_DIR=$actual"
