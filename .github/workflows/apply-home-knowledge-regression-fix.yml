name: Apply Home and Knowledge regression fix

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Apply targeted fix
        run: python3 tools/fix_home_knowledge_regression.py

      - name: Format
        run: |
          dart format \
            lib/features/home/home_screen.dart \
            lib/core/widgets/wesi_clock.dart \
            lib/features/knowledge/models/article_model.dart \
            lib/features/knowledge/models/article_model.g.dart \
            lib/features/knowledge/services/knowledge_service.dart

      - name: Validate regression guards
        run: |
          set -euo pipefail
          ! grep -q 'OverflowBox' lib/core/widgets/wesi_clock.dart
          grep -q 'width: double.infinity' lib/features/home/home_screen.dart
          grep -q '@HiveField(10, defaultValue: false)' lib/features/knowledge/models/article_model.dart
          grep -Fq 'fields[10] as bool? ?? false' lib/features/knowledge/models/article_model.g.dart
          grep -q 'KnowledgeService: failed to open' lib/features/knowledge/services/knowledge_service.dart
          git diff --check

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/home/home_screen.dart \
            lib/core/widgets/wesi_clock.dart \
            lib/features/knowledge/models/article_model.dart \
            lib/features/knowledge/models/article_model.g.dart \
            lib/features/knowledge/services/knowledge_service.dart
          git commit -m 'fix: restore Home layout and legacy Knowledge Base'
          git push origin HEAD:${{ github.head_ref }}
