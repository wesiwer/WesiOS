name: Repair Telegram Entry + Sync Runtime Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-sync-400-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch source and deploy policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('lib/features/settings/settings_screen.dart')
          text = settings.read_text(encoding='utf-8')

          telegram_import = "import '../profile/telegram_link_screen.dart';\n"
          if telegram_import not in text:
              anchor = "import '../treasury/services/treasury_service.dart';\n"
              if anchor not in text:
                  raise SystemExit('settings import anchor not found')
              text = text.replace(anchor, anchor + telegram_import, 1)

          telegram_tile = """              _tile(\n                icon: Icons.send_rounded,\n                title: 'Telegram',\n                subtitle: ru\n                    ? 'Привязка бота и настройки уведомлений'\n                    : 'Bot linking and notification settings',\n                onTap: () => Navigator.of(context).push(\n                  MaterialPageRoute(\n                    builder: (_) => const TelegramLinkScreen(),\n                  ),\n                ),\n              ),\n"""
          if 'const TelegramLinkScreen()' not in text:
              anchor = "              _plannedTile(\n                icon: Icons.email,\n"
              if anchor not in text:
                  raise SystemExit('settings Telegram tile anchor not found')
              text = text.replace(anchor, telegram_tile + anchor, 1)
          settings.write_text(text, encoding='utf-8')

          deploy = Path('.github/workflows/deploy-sync-hooks.yml')
          text = deploy.read_text(encoding='utf-8')
          old = '          restart_needed="$migration_changed"\n'
          replacement = '''          # PocketBase can preserve already-registered JS callbacks across a hot hook reload.\n          # A sync bundle replacement therefore always requires a real process restart.\n          restart_needed="1"\n'''
          if old in text:
              text = text.replace(old, replacement, 1)
          elif 'restart_needed="1"' not in text:
              raise SystemExit('sync restart anchor not found')
          deploy.write_text(text, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          m = re.search(r'(?m)^version:\s*(\d+)\.(\d+)\.(\d+)\+(\d+)\s*$', text)
          if not m:
              raise SystemExit('pubspec version not found')
          major, minor, patch, build = map(int, m.groups())
          if (major, minor, patch, build) == (0, 22, 30, 105):
              text = text[:m.start()] + 'version: 0.22.31+106' + text[m.end():]
              pubspec.write_text(text, encoding='utf-8')
          PY

          grep -q "telegram_link_screen.dart" lib/features/settings/settings_screen.dart
          grep -q "const TelegramLinkScreen()" lib/features/settings/settings_screen.dart
          grep -q 'restart_needed="1"' .github/workflows/deploy-sync-hooks.yml
          grep -q '^version: 0.22.31+106$' pubspec.yaml
          git diff --check
          git diff -- lib/features/settings/settings_screen.dart .github/workflows/deploy-sync-hooks.yml pubspec.yaml

      - name: Commit repair to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/settings/settings_screen.dart .github/workflows/deploy-sync-hooks.yml pubspec.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: restore Telegram connection and eliminate stale sync callbacks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch production sync deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-sync-hooks.yml/dispatches" \
            -d '{"ref":"main"}'

      - name: Dispatch WesiOS 0.22.31 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/release-app.yml/dispatches" \
            -d '{"ref":"main","inputs":{"notes":"Исправлено подключение Telegram в настройках. Исправлен повторяющийся сбой синхронизации: sync hooks/runtime теперь применяются с обязательным перезапуском PocketBase.","deploy_to_server":"true"}}'
