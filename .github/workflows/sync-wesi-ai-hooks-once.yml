name: Stage current Wesi AI hooks on Main

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-wesi-ai-hooks-once.yml']

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
      RELEASE_REF: d4db570b4d2972738e01efce979dda498053636d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Validate release hook bundle
        run: |
          set -euo pipefail
          python3 server/build-wesi-ai-personas.py
          count=0
          for file in server/pb_hooks/wesi_ai_*.js server/pb_hooks/wesi_ai_*.pb.js; do
            [ -f "$file" ] || continue
            node --check "$file"
            count=$((count + 1))
          done
          [ "$count" -gt 8 ] || { echo "Incomplete Wesi AI bundle: $count"; exit 2; }
          test -s server/pb_hooks/.wesi-ai-personas.json
          echo "validated_hooks=$count"
      - name: Prepare SSH
        env:
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$MAIN_KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known 2>/dev/null
      - name: Stage atomic hook bundle
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/main_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/main_known")
          remote="/tmp/wesi-ai-hooks-$GITHUB_RUN_ID"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "rm -rf '$remote' && mkdir -p '$remote'"
          scp "${SSH[@]}" server/pb_hooks/wesi_ai_*.js server/pb_hooks/wesi_ai_*.pb.js server/pb_hooks/.wesi-ai-personas.json "$MAIN_USER@$MAIN_HOST:$remote/"
          ssh "${SSH[@]}" "$MAIN_USER@$MAIN_HOST" "REMOTE='$remote' bash -s" <<'REMOTE'
          set -euo pipefail
          target=/opt/pocketbase/pb_hooks
          test -d "$target"
          test -w "$target"
          backup="/tmp/wesi-ai-hooks-backup-$(date +%s)"
          mkdir -p "$backup"
          cp -a "$target"/wesi_ai_*.js "$target"/wesi_ai_*.pb.js "$backup/" 2>/dev/null || true
          [ -f "$target/.wesi-ai-personas.json" ] && cp -a "$target/.wesi-ai-personas.json" "$backup/" || true
          chmod 0644 "$REMOTE"/wesi_ai_*.js "$REMOTE"/wesi_ai_*.pb.js "$REMOTE/.wesi-ai-personas.json"
          for src in "$REMOTE"/wesi_ai_*.js "$REMOTE"/wesi_ai_*.pb.js "$REMOTE/.wesi-ai-personas.json"; do
            [ -f "$src" ] || continue
            base="$(basename "$src")"
            mv -f "$src" "$target/$base"
          done
          rm -rf "$REMOTE"
          echo "backup=$backup"
          grep -n 'routerAdd("POST", "/api/wesi/ai/chat"' "$target/wesi_ai_routes.pb.js" | head -n 1
          grep -n 'routerAdd("POST", "/api/wesi/ai/stream/prepare"' "$target/wesi_ai_stream.pb.js" | head -n 1
          echo 'STAGED_OK_RESTART_REQUIRED'
          REMOTE
