name: Apply Sync Audit Patches Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-audit-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact sync audit patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # Open Sandbox screen must repaint when remote rows arrive.
          replace_once(
              'lib/features/treasury/sandbox_screen.dart',
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport '../../core/sync/sync_audit_extensions.dart';\n",
          )
          replace_once(
              'lib/features/treasury/sandbox_screen.dart',
              "  void initState() {\n    super.initState();\n    _loadData();\n  }\n\n  /// Загрузка под страховкой",
              "  void initState() {\n    super.initState();\n    SandboxSyncSignal.revision.addListener(_loadData);\n    _loadData();\n  }\n\n  @override\n  void dispose() {\n    SandboxSyncSignal.revision.removeListener(_loadData);\n    super.dispose();\n  }\n\n  /// Загрузка под страховкой",
          )

          # Forecast/What-If stays live while it is open too.
          replace_once(
              'lib/features/treasury/sandbox_forecast_screen.dart',
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport '../../core/sync/sync_audit_extensions.dart';\n",
          )
          replace_once(
              'lib/features/treasury/sandbox_forecast_screen.dart',
              "  void initState() {\n    super.initState();\n    _load();\n  }\n\n  /// Загрузка под страховкой.",
              "  void initState() {\n    super.initState();\n    SandboxSyncSignal.revision.addListener(_load);\n    WhatIfStore.revision.addListener(_load);\n    _load();\n  }\n\n  @override\n  void dispose() {\n    SandboxSyncSignal.revision.removeListener(_load);\n    WhatIfStore.revision.removeListener(_load);\n    super.dispose();\n  }\n\n  /// Загрузка под страховкой.",
          )

          # Manual button uses the same coordinator as auto sync so it waits
          # for an in-flight pass and refreshes the remote watermark.
          replace_once(
              'lib/features/settings/sync_screen.dart',
              "import '../../core/sync/sync_engine.dart';\n",
              "import '../../core/sync/sync_auto.dart';\n",
          )
          replace_once(
              'lib/features/settings/sync_screen.dart',
              '    final report = await SyncEngine.run();',
              '    final report = await SyncAuto.now();',
          )

          # Portable Audio Vault analysis is metadata. On the source device it
          # remains bound to the local WAV stat; on another device, where the
          # intentionally local sourcePath is empty, the synced report is still
          # visible instead of disappearing.
          replace_once(
              'lib/features/audio/services/audio_vault_extras_service.dart',
              "  static Future<AudioAnalysisReport?> analysisForBeat(BeatEntry beat) async {\n    final wav = beat.wavPath;\n    if (wav == null || wav.isEmpty) return null;\n    final meta = await metaFor(beat.id);\n    final report = meta.analysis;\n    if (report == null) return null;\n",
              "  static Future<AudioAnalysisReport?> analysisForBeat(BeatEntry beat) async {\n    final meta = await metaFor(beat.id);\n    final report = meta.analysis;\n    if (report == null) return null;\n    // A report received through sync deliberately has no device path. Its QC\n    // metrics are portable metadata and remain useful without the local WAV.\n    if (report.sourcePath.isEmpty) return report;\n    final wav = beat.wavPath;\n    if (wav == null || wav.isEmpty) return null;\n",
          )

          # Wesi AI: important backup remains selective, D2D transfer becomes
          # a complete local-state package. No routine full history is uploaded
          # to the generic server sync.
          path = Path('lib/features/ai/backup/wesi_ai_backup_service.dart')
          text = path.read_text()
          old_sig = "  static Future<WesiAiBackupBuildResult> buildImportantPackage(\n    WesiAiLocalState state,\n  ) async {\n    final selected = state.conversations\n        .where((conversation) => conversation.importantForBackup)\n        .toList(growable: false);\n    if (selected.isEmpty) {\n      throw const FormatException('Нет чатов, отмеченных для важного backup');\n    }\n    final selectedIds = selected.map((item) => item.id).toSet();\n    final selectedProjectIds =\n        selected.map((item) => item.projectId).whereType<String>().toSet();\n    final projects = state.projects\n        .where((project) => selectedProjectIds.contains(project.id))\n        .toList(growable: false);\n"
          new_sig = "  static Future<WesiAiBackupBuildResult> _buildPackage(\n    WesiAiLocalState state, {\n    required bool includeAll,\n    required bool strictArtifacts,\n  }) async {\n    final selected = (includeAll\n            ? state.conversations\n            : state.conversations\n                .where((conversation) => conversation.importantForBackup))\n        .toList(growable: false);\n    if (selected.isEmpty) {\n      throw FormatException(includeAll\n          ? 'В Wesi AI пока нет чатов для D2D-переноса'\n          : 'Нет чатов, отмеченных для важного backup');\n    }\n    final selectedIds = selected.map((item) => item.id).toSet();\n    final selectedProjectIds = includeAll\n        ? state.projects.map((item) => item.id).toSet()\n        : selected.map((item) => item.projectId).whereType<String>().toSet();\n    final projects = (includeAll\n            ? state.projects\n            : state.projects\n                .where((project) => selectedProjectIds.contains(project.id)))\n        .toList(growable: false);\n"
          if text.count(old_sig) != 1:
              raise SystemExit('wesi_ai_backup_service.dart: build signature block mismatch')
          text = text.replace(old_sig, new_sig, 1)

          old_memory = "    final memoryEntries = state.memoryEntries.where((entry) {\n      if (entry.scope == WesiAiMemoryScope.project) {\n        return entry.projectId != null &&\n            selectedProjectIds.contains(entry.projectId);\n      }\n      if (entry.sourceConversationId != null &&\n          selectedIds.contains(entry.sourceConversationId)) {\n        return true;\n      }\n      return entry.scope == WesiAiMemoryScope.shared ||\n          entry.scope == WesiAiMemoryScope.zane ||\n          entry.scope == WesiAiMemoryScope.nirvana;\n    }).toList(growable: false);\n"
          new_memory = "    final memoryEntries = (includeAll\n            ? state.memoryEntries\n            : state.memoryEntries.where((entry) {\n                if (entry.scope == WesiAiMemoryScope.project) {\n                  return entry.projectId != null &&\n                      selectedProjectIds.contains(entry.projectId);\n                }\n                if (entry.sourceConversationId != null &&\n                    selectedIds.contains(entry.sourceConversationId)) {\n                  return true;\n                }\n                return entry.scope == WesiAiMemoryScope.shared ||\n                    entry.scope == WesiAiMemoryScope.zane ||\n                    entry.scope == WesiAiMemoryScope.nirvana;\n              }))\n        .toList(growable: false);\n"
          if text.count(old_memory) != 1:
              raise SystemExit('wesi_ai_backup_service.dart: memory block mismatch')
          text = text.replace(old_memory, new_memory, 1)

          old_skip = "        } else {\n          skippedArtifacts++;\n        }\n"
          new_skip = "        } else {\n          if (strictArtifacts) {\n            throw FormatException(\n              'D2D не может без потерь перенести artifact сообщения ${message.id}',\n            );\n          }\n          skippedArtifacts++;\n        }\n"
          if text.count(old_skip) != 1:
              raise SystemExit('wesi_ai_backup_service.dart: artifact block mismatch')
          text = text.replace(old_skip, new_skip, 1)

          marker = "  static Future<WesiAiBackupExportResult> exportImportantBackup(\n"
          wrappers = "  static Future<WesiAiBackupBuildResult> buildImportantPackage(\n    WesiAiLocalState state,\n  ) =>\n      _buildPackage(state, includeAll: false, strictArtifacts: false);\n\n  /// Полный пакет только для защищённого D2D между собственными устройствами.\n  /// В отличие от important-backup он включает все чаты, проекты и память и\n  /// отказывается собираться, если artifact нельзя перенести без потерь.\n  static Future<WesiAiBackupBuildResult> buildFullTransferPackage(\n    WesiAiLocalState state,\n  ) =>\n      _buildPackage(state, includeAll: true, strictArtifacts: true);\n\n"
          if text.count(marker) != 1:
              raise SystemExit('wesi_ai_backup_service.dart: export marker mismatch')
          text = text.replace(marker, wrappers + marker, 1)
          path.write_text(text)

          replace_once(
              'lib/features/ai/backup/wesi_ai_d2d_service.dart',
              '    final build = await WesiAiBackupService.buildImportantPackage(state);',
              '    final build = await WesiAiBackupService.buildFullTransferPackage(state);',
          )
          PY

      - name: Format Dart
        run: dart format \
          lib/features/treasury/sandbox_screen.dart \
          lib/features/treasury/sandbox_forecast_screen.dart \
          lib/features/settings/sync_screen.dart \
          lib/features/audio/services/audio_vault_extras_service.dart \
          lib/features/ai/backup/wesi_ai_backup_service.dart \
          lib/features/ai/backup/wesi_ai_d2d_service.dart

      - name: Commit patches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/treasury/sandbox_screen.dart \
                  lib/features/treasury/sandbox_forecast_screen.dart \
                  lib/features/settings/sync_screen.dart \
                  lib/features/audio/services/audio_vault_extras_service.dart \
                  lib/features/ai/backup/wesi_ai_backup_service.dart \
                  lib/features/ai/backup/wesi_ai_d2d_service.dart
          git diff --cached --check
          git commit -m 'fix(sync): complete live module and Wesi AI D2D sync'
          git push origin HEAD:main
