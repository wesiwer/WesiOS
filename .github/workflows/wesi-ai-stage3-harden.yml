name: Harden Wesi AI Stage 3 memory engine

on:
  push:
    branches:
      - agent/wesi-ai-stage3-memory-engine

permissions:
  contents: write

jobs:
  harden-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[stage3-hardened]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Stage 3 hardening
        run: python tool/wesi_ai_stage3_harden.py
      - name: Validate server context paths
        run: |
          set -euo pipefail
          for file in \
            server/pb_hooks/wesi_ai_routes.pb.js \
            server/pb_hooks/wesi_ai_stream.pb.js \
            server/pb_hooks/wesi_ai_lobby_core.js \
            server/pb_hooks/wesi_ai_lobby_turn.js; do
            node --check "$file"
          done
          grep -q 'WESI_AI_PROJECT_CONTEXT' server/pb_hooks/wesi_ai_routes.pb.js
          grep -q 'WESI_AI_TASK_STATE' server/pb_hooks/wesi_ai_stream.pb.js
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - name: Format changed files
        run: |
          dart format \
            lib/features/ai/controllers/wesi_ai_chat_controller.dart \
            lib/features/ai/wesi_ai_lobby_controller.dart \
            lib/features/ai/wesi_ai_managed_controller.dart \
            lib/features/ai/wesi_ai_api.dart \
            lib/features/ai/wesi_ai_lobby_api.dart \
            test/wesi_ai_memory_engine_test.dart
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test memory regressions
        run: flutter test test/wesi_ai_memory_engine_test.dart test/wesi_ai_queue_hardening_test.dart test/wesi_ai_turn_intent_test.dart
      - name: Commit validated hardening
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage3-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/features/ai server/pb_hooks test/wesi_ai_memory_engine_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(ai): harden Memory Engine integration [stage3-hardened]'
          git push origin HEAD:agent/wesi-ai-stage3-memory-engine
