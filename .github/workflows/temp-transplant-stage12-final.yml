name: Temporary transplant Stage 12 final
on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
    paths:
      - .github/workflows/temp-transplant-stage12-final.yml
permissions:
  contents: write
jobs:
  transplant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage12-final-20260816
          fetch-depth: 0
      - name: Transplant verified Stage 12 files from finish branch
        run: |
          set -euo pipefail
          git fetch origin agent/wesi-ai-finish-unfinished-20260816
          git checkout origin/agent/wesi-ai-finish-unfinished-20260816 -- \
            docs/WESI_AI_STAGE_TRACKER.md \
            lib/features/ai/ai_assistant_v2_screen.dart \
            lib/features/ai/wesi_ai_api.dart \
            lib/features/ai/widgets/wesi_ai_message_content.dart \
            lib/features/ai/widgets/wesi_ai_rich_message.dart \
            server/pb_hooks/wesi_ai_coagent_policy.js \
            server/pb_hooks/wesi_ai_stream.pb.js \
            server/wesi-ai-relay/deploy-relay.sh \
            server/wesi-ai-relay/nginx-relay.conf \
            server/wesi-ai-stream/coagent_policy.test.mjs \
            server/wesi-ai-stream/deploy-stream-gateway.sh \
            server/wesi-ai-stream/gateway.mjs \
            server/wesi-ai-stream/gateway.test.mjs \
            server/wesi-ai-stream/persona_coagent.mjs \
            server/wesi-ai-stream/persona_coagent.test.mjs \
            server/wesi-ai-stream/persona_coagent_orchestrator.mjs \
            server/wesi-ai-stream/persona_coagent_orchestrator.test.mjs \
            test/wesi_ai_coagent_activity_test.dart
          git diff --check
          git config user.name wesiwer
          git config user.email 77644223+wesiwer@users.noreply.github.com
          git add docs lib server test
          git commit -m 'feat(ai): transplant verified Stage 12 onto current main'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
