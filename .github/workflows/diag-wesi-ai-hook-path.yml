name: Locate live PocketBase hooks

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-wesi-ai-hook-path.yml']

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      MAIN_HOST: ${{ secrets.WESI_SERVER_HOST }}
      MAIN_USER: ${{ secrets.WESI_SERVER_USER }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate hooks and compare
        env:
          MAIN_KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$MAIN_KEY" > ~/.ssh/main_key
          chmod 600 ~/.ssh/main_key
          ssh-keyscan -H "$MAIN_HOST" > ~/.ssh/main_known 2>/dev/null
          ssh -i ~/.ssh/main_key -o BatchMode=yes -o UserKnownHostsFile=~/.ssh/main_known "$MAIN_USER@$MAIN_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          pid="$(pgrep -xo pocketbase || pgrep -f '[p]ocketbase serve' | head -n1 || true)"
          echo "pid=${pid:-none}"
          if [ -n "$pid" ]; then
            printf 'cmdline='; tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null || true; echo
          fi
          echo 'systemd-working-dir:'
          systemctl show pocketbase -p WorkingDirectory --value 2>/dev/null || true
          echo 'candidate hook dirs:'
          for d in /opt/pocketbase/pb_hooks /opt/pocketbase/hooks "$HOME/pb_hooks" "$HOME/wesi/pb_hooks" "$HOME/WesiOS/server/pb_hooks" /opt/wesi/pb_hooks /opt/wesios/pb_hooks /var/lib/pocketbase/pb_hooks; do
            if [ -d "$d" ]; then
              echo "DIR $d"
              ls -ld "$d"
              ls -l "$d"/wesi_ai_routes.pb.js "$d"/wesi_ai_stream.pb.js "$d"/wesi_ai_lib.js "$d"/wesi_ai_tools.js 2>/dev/null || true
              grep -n 'routerAdd("POST", "/api/wesi/ai/chat"' "$d"/wesi_ai_routes.pb.js 2>/dev/null || true
            fi
          done
          echo 'find under /opt/pocketbase:'
          find /opt/pocketbase -maxdepth 4 -type f -name 'wesi_ai_routes.pb.js' -print 2>/dev/null | head -n 20 || true
          REMOTE
