name: Fix Final Gate Residuals Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-final-gate-residuals-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply residual fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Remove now-unused concrete fallback variable. The model keeps
          # accountId nullable; effectiveAccountId supplies the business fallback.
          p=Path('lib/core/sync/sync_codec.dart')
          s=p.read_text()
          old="""    final accountId =
        _strOrNull(fields['accountId']) ?? AccountModel.mainIdFor(orgId);
"""
          if old not in s: raise SystemExit('unused accountId declaration not found')
          p.write_text(s.replace(old,'',1))

          # 2) Export exact CRM policy helpers used by contract tests and by
          # future focused transaction-policy verification.
          p=Path('server/pb_hooks/wesi_sync_crm_runtime.js')
          s=p.read_text()
          old="""module.exports = {
  read,
  write,
  authorize,
  clientVisible,
  dealVisible,
  interactionVisible,
};
"""
          new="""module.exports = {
  read,
  write,
  authorize,
  authorizeClient,
  authorizeDeal,
  authorizeInteraction,
  clientVisible,
  dealVisible,
  interactionVisible,
};
"""
          if old not in s: raise SystemExit('crm exports block not found')
          p.write_text(s.replace(old,new,1))

          # 3) Nonce now intentionally includes a millisecond prefix. The race
          # contract must verify the fresh random suffix rather than obsolete raw format.
          p=Path('server/pb_hooks/wesi_sync_revision_race_test.mjs')
          s=p.read_text()
          old="""  assert.equal(payload.nonce, 'nonce-2',
    'retry must issue a fresh revision token instead of accepting the competitor token');
"""
          new="""  assert.ok(String(payload.nonce || '').endsWith(':nonce-2'),
    'retry must issue a fresh revision token instead of accepting the competitor token');
"""
          if old not in s: raise SystemExit('revision race nonce assertion not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit fixes to main
        shell: bash
        run: |
          git config user.name 'WesiOS CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/sync/sync_codec.dart server/pb_hooks/wesi_sync_crm_runtime.js server/pb_hooks/wesi_sync_revision_race_test.mjs
          git commit -m 'fix(ci): close final sync gate residuals'
          git pull --rebase origin main
          git push origin HEAD:main
