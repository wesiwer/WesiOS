name: Redeploy Wesi AI Streaming Once 0.22.16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redeploy-wesi-ai-streaming-once-0.22.16.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical streaming production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy-wesi-ai-streaming.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f public_host=wesi-ai-178-236-247-194.nip.io
          echo WESI_AI_STREAMING_REDEPLOY_DISPATCHED
