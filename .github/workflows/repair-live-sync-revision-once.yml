name: Repair live sync revision once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-live-sync-revision-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate repository revision hooks
        shell: bash
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_sync_revision.pb.js
          node --check server/pb_hooks/wesi_sync_revision.js
          grep -Fq 'function touchRevision(e)' server/pb_hooks/wesi_sync_revision.pb.js
          grep -Fq 'revision.touch(e.app, e.record.getString("owner"))' server/pb_hooks/wesi_sync_revision.pb.js
          grep -Fq 'module.exports = {' server/pb_hooks/wesi_sync_revision.js

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect, replace and verify live revision hooks
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE="/tmp/wesi-revision-repair-$GITHUB_RUN_ID"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            server/pb_hooks/wesi_sync_revision.pb.js \
            server/pb_hooks/wesi_sync_revision.js \
            "$USER@$HOST:$REMOTE/"

          $SSH "$USER@$HOST" "REMOTE='$REMOTE' bash -s" > /tmp/revision-repair.txt <<'REMOTE_SCRIPT'
          set -euo pipefail
          DIR=/opt/pocketbase/pb_hooks
          PB="$DIR/wesi_sync_revision.pb.js"
          JS="$DIR/wesi_sync_revision.js"
          NEW_PB="$REMOTE/wesi_sync_revision.pb.js"
          NEW_JS="$REMOTE/wesi_sync_revision.js"

          echo '=== BEFORE ==='
          if grep -Fq 'function touchRevision(e)' "$PB" 2>/dev/null; then echo TOUCH_REVISION_DEFINED=true; else echo TOUCH_REVISION_DEFINED=false; fi
          echo -n 'PB_SHA256='; sha256sum "$PB" 2>/dev/null | awk '{print $1}' || true
          echo -n 'NEW_PB_SHA256='; sha256sum "$NEW_PB" | awk '{print $1}'
          echo -n 'JS_SHA256='; sha256sum "$JS" 2>/dev/null | awk '{print $1}' || true
          echo -n 'NEW_JS_SHA256='; sha256sum "$NEW_JS" | awk '{print $1}'

          install_one() {
            src="$1"; dst="$2"
            if [ -w "$dst" ] || { [ ! -e "$dst" ] && [ -w "$DIR" ]; }; then
              cat "$src" > "$dst"
              chmod 0644 "$dst"
            elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
              sudo -n install -m 0644 "$src" "$dst"
            else
              echo "Cannot replace $dst" >&2
              exit 30
            fi
          }
          install_one "$NEW_JS" "$JS"
          install_one "$NEW_PB" "$PB"
          sleep 3

          echo '=== AFTER ==='
          cmp -s "$NEW_PB" "$PB" || { echo PB_MISMATCH >&2; exit 31; }
          cmp -s "$NEW_JS" "$JS" || { echo JS_MISMATCH >&2; exit 32; }
          grep -Fq 'function touchRevision(e)' "$PB"
          grep -Fq 'revision.touch(e.app, e.record.getString("owner"))' "$PB"
          echo TOUCH_REVISION_DEFINED=true
          echo LIVE_FILES_MATCH_MAIN=true
          rm -rf "$REMOTE"
          REMOTE_SCRIPT

      - name: Verify wesios_records save no longer throws
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          TOKEN=$(openssl rand -hex 24)
          REMOTE="/tmp/wesi-save-verify-$GITHUB_RUN_ID"
          PATCHED="$RUNNER_TEMP/wesi_save_verify.pb.js"
          cp server/pb_hooks/wesi_mail_health.pb.js "$PATCHED"
          cat >> "$PATCHED" <<JS

          routerAdd("GET", "/api/wesi/internal/save-verify-$TOKEN", (e) => {
            const collection = e.app.findCollectionByNameOrId("wesios_records");
            const record = new Record(collection);
            record.set("owner", "__wesios_probe__");
            record.set("org", "wesi-inc");
            record.set("coll", "security-probe");
            record.set("rid", "revision-repair:" + Date.now());
            record.set("payload", {kind:"revision-repair-probe", createdAt:new Date().toISOString()});
            record.set("stamp", new Date().toISOString());
            record.set("deleted", true);
            try {
              e.app.save(record);
              try { e.app.delete(record); } catch (_) {}
              return e.json(200, {ok:true});
            } catch (error) {
              return e.json(500, {ok:false, reason:String((error && error.message) || error || "unknown").substring(0,300)});
            }
          });
          JS
          node --check "$PATCHED"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE' && mkdir -p '$REMOTE'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes "$PATCHED" server/pb_hooks/wesi_mail_health.pb.js "$USER@$HOST:$REMOTE/"
          $SSH "$USER@$HOST" "TOKEN='$TOKEN' REMOTE='$REMOTE' bash -s" > /tmp/save-verify.json <<'REMOTE_SCRIPT'
          set -euo pipefail
          HOOK=/opt/pocketbase/pb_hooks/wesi_mail_health.pb.js
          ORIGINAL="$REMOTE/wesi_mail_health.pb.js"
          PATCHED="$REMOTE/wesi_save_verify.pb.js"
          restore(){ if [ -w "$HOOK" ]; then cat "$ORIGINAL" > "$HOOK" || true; chmod 0644 "$HOOK" || true; elif command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then sudo -n install -m 0644 "$ORIGINAL" "$HOOK" || true; fi; rm -rf "$REMOTE" || true; }
          trap restore EXIT
          if [ -w "$HOOK" ]; then cat "$PATCHED" > "$HOOK"; chmod 0644 "$HOOK"; else sudo -n install -m 0644 "$PATCHED" "$HOOK"; fi
          CODE=''
          for attempt in $(seq 1 20); do
            CODE=$(curl -sS -o "$REMOTE/result.json" -w '%{http_code}' --max-time 10 "http://127.0.0.1:8090/api/wesi/internal/save-verify-$TOKEN" || true)
            [ "$CODE" != 404 ] && [ -n "$CODE" ] && break
            sleep 1
          done
          cat "$REMOTE/result.json" 2>/dev/null || true
          [ "$CODE" = 200 ] || { echo "save verify HTTP $CODE" >&2; exit 40; }
          grep -q '"ok":true' "$REMOTE/result.json"
          restore
          trap - EXIT
          REMOTE_SCRIPT

      - name: Publish sanitized repair report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          python3 - <<'PY' > .github/live-sync-revision-repair.json
          import json, pathlib, datetime
          inspect=pathlib.Path('/tmp/revision-repair.txt').read_text(encoding='utf-8',errors='replace') if pathlib.Path('/tmp/revision-repair.txt').exists() else ''
          verify={}
          try: verify=json.loads(pathlib.Path('/tmp/save-verify.json').read_text(encoding='utf-8'))
          except Exception: pass
          print(json.dumps({
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'touchRevisionDefinedAfterRepair':'TOUCH_REVISION_DEFINED=true' in inspect.split('=== AFTER ===')[-1] if '=== AFTER ===' in inspect else False,
            'liveFilesMatchMain':'LIVE_FILES_MATCH_MAIN=true' in inspect,
            'saveProbeOk':verify.get('ok') is True,
          },ensure_ascii=False,indent=2))
          PY
          git config user.name 'WesiOS Sync Repair'
          git config user.email 'actions@users.noreply.github.com'
          git switch -C diag/live-sync-revision-repair
          git add .github/live-sync-revision-repair.json
          git commit -m 'diag(sync): verify live revision repair'
          git push --force origin HEAD:diag/live-sync-revision-repair
