name: Harden Wesi AI Stage 8 GPU telemetry

on:
  push:
    branches:
      - agent/wesi-ai-stage8-resource-scheduler

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage8-gpu-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage8-resource-scheduler
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Apply GPU telemetry hardening
        run: python tool/wesi_ai_stage8_gpu_snapshot_fix.py
      - name: Format touched files
        run: dart format lib/features/ai/runtime/wesi_resource_scheduler_models.dart test/wesi_resource_scheduler_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Scheduler regressions
        run: flutter test test/wesi_resource_scheduler_test.dart
      - name: Commit product fix and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wesi-ai-stage8-gpu-snapshot-fix.yml tool/wesi_ai_stage8_gpu_snapshot_fix.py
          git add lib/features/ai/runtime/wesi_resource_scheduler_models.dart test/wesi_resource_scheduler_test.dart
          git commit -m "fix(ai): reject inconsistent GPU resource snapshots"
          git push origin HEAD:agent/wesi-ai-stage8-resource-scheduler
