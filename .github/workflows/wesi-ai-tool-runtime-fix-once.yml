name: Wesi AI tool and agent runtime repair

on:
  push:
    branches: [agent/wesi-ai-tool-agent-runtime-fix]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wesi-ai-tool-agent-runtime-fix
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-tool-agent-runtime-fix
          fetch-depth: 0

      - name: Apply deterministic runtime patch
        run: |
          set -euo pipefail
          python -m py_compile scripts/wesi_ai_tool_runtime_fix.py
          python scripts/wesi_ai_tool_runtime_fix.py

      - name: Validate Wesi AI server runtime
        run: |
          set -euo pipefail
          for file in server/wesi-ai-relay/*.mjs server/wesi-ai-stream/*.mjs; do node --check "$file"; done
          for file in server/pb_hooks/wesi_ai_*.js server/pb_hooks/wesi_ai_*.pb.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
          node --test server/wesi-ai-relay/*.test.mjs
          node --test server/wesi-ai-stream/*.test.mjs
          python3 server/build-wesi-ai-personas.py
          test -s server/pb_hooks/.wesi-ai-personas.json
          rm -f server/pb_hooks/.wesi-ai-personas.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Full Flutter regression suite
        run: flutter test

      - name: Commit validated runtime repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            server/wesi-ai-stream/gateway.mjs \
            server/wesi-ai-stream/gateway.test.mjs \
            server/wesi-ai-stream/finance_balance.test.mjs \
            server/pb_hooks/wesi_ai_finance_tools.js \
            server/pb_hooks/wesi_ai_finance_balance.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'fix(ai): execute embedded tool calls without leaking protocol'
          git push origin HEAD:agent/wesi-ai-tool-agent-runtime-fix
