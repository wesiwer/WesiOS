name: Dispatch owner-login build once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-owner-login-build-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'WesiOS CI'
          git config user.email 'actions@users.noreply.github.com'

      - name: Start current WesiOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build.yml --repo "${{ github.repository }}" --ref main
          sleep 15

      - name: Find dispatched build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow build.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Build run: $RUN_ID"

      - name: Record running build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p server/build-status
          gh run view "${{ steps.build.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt \
            > server/build-status/owner-login-build.json
          git add server/build-status/owner-login-build.json
          git commit -m 'ci: record running owner login build' || true
          git push origin HEAD:main

      - name: Wait for Windows and Android build
        id: watch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "${{ steps.build.outputs.run_id }}" --repo "${{ github.repository }}" --exit-status --interval 15

      - name: Record final build status
        if: always() && steps.build.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "${{ steps.build.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --json databaseId,status,conclusion,url,headSha,createdAt,updatedAt \
            > server/build-status/owner-login-build.json
          git add server/build-status/owner-login-build.json
          git commit -m 'ci: record owner login build result' || exit 0
          git push origin HEAD:main

      - name: Require successful build
        if: steps.watch.outcome != 'success'
        run: exit 1
