name: Configure WesiOS mail transport

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-wesi-mail.yml'

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment:
      name: employee-portal
    steps:
      - name: Check required secrets
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          RESEND_KEY: ${{ secrets.WESI_RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.WESI_MAIL_FROM }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HOST USER KEY; do
            [ -n "${!name:-}" ] || { echo "::error::Missing $name"; exit 1; }
          done
          if [ -z "${RESEND_KEY:-}" ] || [ -z "${MAIL_FROM:-}" ]; then
            echo '::notice::WESI_RESEND_API_KEY/WESI_MAIL_FROM are not configured yet; server mail transport was not changed.'
            echo 'READY=0' >> "$GITHUB_ENV"
          else
            echo 'READY=1' >> "$GITHUB_ENV"
          fi

      - name: Prepare SSH
        if: env.READY == '1'
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Install private mail configuration
        if: env.READY == '1'
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          RESEND_KEY: ${{ secrets.WESI_RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.WESI_MAIL_FROM }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/wesi-mail.json"
          import json, os
          print(json.dumps({
              'provider': 'resend',
              'apiKey': os.environ['RESEND_KEY'],
              'from': os.environ['MAIL_FROM'],
          }, ensure_ascii=False))
          PY
          chmod 600 "$RUNNER_TEMP/wesi-mail.json"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes \
            "$RUNNER_TEMP/wesi-mail.json" "$USER@$HOST:/tmp/.wesi-mail.json"
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          HOOK_DIR=/opt/pocketbase/pb_hooks
          test -d "$HOOK_DIR"
          if [ -w "$HOOK_DIR" ]; then
            install -m 600 /tmp/.wesi-mail.json "$HOOK_DIR/.wesi-mail.json"
          elif [ -f "$HOOK_DIR/wesi_auth_bootstrap.pb.js" ] && [ -w "$HOOK_DIR/wesi_auth_bootstrap.pb.js" ]; then
            cat /tmp/.wesi-mail.json > "$HOOK_DIR/.wesi-mail.json"
            chmod 600 "$HOOK_DIR/.wesi-mail.json"
          else
            echo 'No permission to install WesiOS mail config' >&2
            rm -f /tmp/.wesi-mail.json
            exit 1
          fi
          rm -f /tmp/.wesi-mail.json
          test -s "$HOOK_DIR/.wesi-mail.json"
          REMOTE
          rm -f "$RUNNER_TEMP/wesi-mail.json"

      - name: Verify production mail readiness
        if: env.READY == '1'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 20 https://api.wesi-inc.ru/api/wesi/auth/mail-ready -o mail-ready.json; then
              python3 - <<'PY'
          import json
          with open('mail-ready.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('ready') is True, data
          assert data.get('httpsProviderConfigured') is True or data.get('smtpReady') is True, data
          print('WesiOS mail transport ready:', data)
          PY
              exit 0
            fi
            sleep 2
          done
          echo '::error::Production mail transport is still not ready'
          cat mail-ready.json 2>/dev/null || true
          exit 1
