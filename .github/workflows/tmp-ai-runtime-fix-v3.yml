name: Temporary Wesi AI Runtime Fix V3

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
    paths:
      - .github/workflows/tmp-ai-runtime-fix-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage12-final-20260816
          fetch-depth: 0

      - name: Reuse verified V2 patch and improve read tool row
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-ai-runtime-fix-v2.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          blocks = []
          pos = 0
          while True:
              start = workflow.find(marker, pos)
              if start < 0:
                  break
              start += len(marker)
              end = workflow.find('          PY\n', start)
              if end < 0:
                  raise SystemExit('unterminated embedded python block')
              raw = workflow[start:end]
              lines = []
              for line in raw.splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              blocks.append('\n'.join(lines))
              pos = end + len('          PY\n')
          if len(blocks) < 2:
              raise SystemExit(f'expected two patch blocks, got {len(blocks)}')
          exec(compile(blocks[0], 'v2-runtime-patch', 'exec'), {})
          exec(compile(blocks[1], 'v2-regression-tests', 'exec'), {})

          p = Path('lib/features/ai/widgets/wesi_ai_rich_message.dart')
          text = p.read_text()
          old = """    final hasDetails = event.detail.isNotEmpty || event.files.isNotEmpty;"""
          new = """    final inlineReadDetail = event.kind == WesiAiActivityKind.tool &&\n        event.detail.isNotEmpty &&\n        !event.hasDiff &&\n        event.files.isEmpty;\n    final hasDetails =\n        (!inlineReadDetail && event.detail.isNotEmpty) || event.files.isNotEmpty;"""
          if old not in text:
              raise SystemExit('missing activity details declaration')
          text = text.replace(old, new, 1)
          needle = """            if (_expanded) ...[\n              if (event.detail.isNotEmpty)"""
          replacement = """            if (inlineReadDetail)\n              Padding(\n                padding: const EdgeInsets.only(left: 24, top: 5),\n                child: Text(\n                  event.detail,\n                  style: theme.textTheme.bodySmall?.copyWith(\n                    color: theme.colorScheme.onSurfaceVariant,\n                  ),\n                ),\n              ),\n            if (_expanded) ...[\n              if (event.detail.isNotEmpty)"""
          if needle not in text:
              raise SystemExit('missing activity expanded details block')
          p.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Server checks
        run: |
          set -euo pipefail
          node --check server/wesi-ai-stream/gateway.mjs
          node --check server/pb_hooks/wesi_ai_finance_tools.js
          node --check server/pb_hooks/wesi_ai_tools.js
          (cd server/wesi-ai-stream && npm test)

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - run: dart format lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart lib/features/ai/widgets/wesi_ai_rich_message.dart lib/features/ai/wesi_ai_api.dart lib/features/treasury/models/transaction_model.dart test/wesi_ai_rich_message_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/wesi_ai_rich_message_test.dart test/wesi_ai_coagent_activity_test.dart

      - name: Commit verified fixes
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-ci'
          git config user.email 'wesi-ai-ci@users.noreply.github.com'
          git add lib server test .github/workflows/deploy-wesi-ai-streaming.yml
          git commit -m 'fix(ai): ground finance results and restore thinking stream UX'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
