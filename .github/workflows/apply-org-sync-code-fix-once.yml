name: Run sync repair stage2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-org-sync-code-fix-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-org-canonical-compare
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch test and commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/ops/repair_stage2.py > /tmp/repair_stage2.py
          : > /tmp/stage2.log
          set +e
          (
            set -euo pipefail
            python3 /tmp/repair_stage2.py
            dart format lib/core/sync/sync_recovery.dart lib/features/settings/sync_screen.dart test/core/sync/sync_recovery_test.dart
            git diff --check
            flutter pub get
            flutter test test/core/sync/sync_recovery_test.dart test/core/backup/local_backup_service_test.dart test/core/sync/organization_sync_server_compat_test.dart
            flutter analyze --no-fatal-infos lib/core/sync/sync_recovery.dart lib/features/settings/sync_screen.dart test/core/sync/sync_recovery_test.dart
          ) >> /tmp/stage2.log 2>&1
          RC=$?
          set -e
          {
            echo "exit=$RC"
            tail -n 220 /tmp/stage2.log
          } > /tmp/result.txt
          CONTENT=$(base64 -w0 /tmp/result.txt)
          URL="/repos/$GITHUB_REPOSITORY/contents/.github/ops/sync-repair-stage2-result.txt"
          SHA=$(gh api "$URL" --jq .sha 2>/dev/null || true)
          ARGS=(--method PUT -H 'Accept: application/vnd.github+json' "$URL" -f message='ops(sync): record stage2 result' -f content="$CONTENT" -f branch=main)
          if [ -n "$SHA" ]; then ARGS+=( -f sha="$SHA" ); fi
          gh api "${ARGS[@]}" >/dev/null
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          git config user.name 'WesiOS Sync Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/sync/sync_recovery.dart lib/features/settings/sync_screen.dart test/core/sync/sync_recovery_test.dart
          git commit -m 'fix(sync): verify canonical organization payloads after upload'
          git push origin HEAD:fix/recovery-org-canonical-compare
