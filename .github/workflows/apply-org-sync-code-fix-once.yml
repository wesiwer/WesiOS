name: Apply organization sync code fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-org-sync-code-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch sync codec
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/core/sync/sync_codec.dart')
          s=p.read_text(encoding='utf-8')
          a=s.index('bool _organizationSnapshotValid(')
          b=s.index('\nbool _employeeExists',a)
          helper=r'''bool _organizationConnectedToRoot(
            Map<String, OrganizationModel> byId,
            OrganizationModel node,
          ) {
            if (node.id == OrganizationModel.rootId) {
              return node.isRoot && node.parentId == null && !node.archived;
            }
            if (node.isRoot || node.parentId == null || node.parentId!.isEmpty) {
              return false;
            }
            final seen = <String>{node.id};
            var current = node;
            while (current.id != OrganizationModel.rootId) {
              final parentId = current.parentId;
              if (parentId == null || parentId.isEmpty || !seen.add(parentId)) {
                return false;
              }
              final parent = byId[parentId];
              if (parent == null) return false;
              if (!current.archived && parent.archived) return false;
              current = parent;
            }
            return current.isRoot && current.parentId == null && !current.archived;
          }
          '''
          s=s[:a]+helper+s[b:]
          cls=s.index('class OrganizationsSync extends SyncCollection<OrganizationModel>')
          a=s.index('  @override\n  Future<bool> applyFields(',cls)
          b=s.index('  @override\n  Future<void> removeById',a)
          repl=r'''  @override
            Map<String, OrganizationModel> local() {
              final b = box();
              if (b == null) return const {};
              final byId = <String, OrganizationModel>{
                for (final row in b.values) row.id: row,
              };
              return <String, OrganizationModel>{
                for (final row in byId.values)
                  if (_organizationConnectedToRoot(byId, row)) row.id: row,
              };
            }

            @override
            Future<bool> applyFields(Map<String, dynamic> fields) async {
              final b = box();
              final incoming = decode(fields);
              if (b == null || incoming == null) return false;
              final byId = <String, OrganizationModel>{
                for (final row in b.values)
                  if (row.id != incoming.id) row.id: row,
                incoming.id: incoming,
              };
              if (!_organizationConnectedToRoot(byId, incoming)) return false;
              if (incoming.archived &&
                  byId.values.any(
                    (row) => row.parentId == incoming.id && !row.archived,
                  )) {
                return false;
              }
              await b.put(incoming.id, incoming);
              return true;
            }

          '''
          s=s[:a]+repl+s[b:]
          p.write_text(s,encoding='utf-8')
          PY
          dart format lib/core/sync/sync_codec.dart test/core/sync/organization_sync_recovery_test.dart
          git diff --check
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/core/sync/organization_sync_recovery_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/core/sync/sync_codec.dart test/core/sync/organization_sync_recovery_test.dart
      - name: Commit to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Sync Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/sync/sync_codec.dart test/core/sync/organization_sync_recovery_test.dart
          git commit -m 'fix(sync): recover organization tree from stale local cache'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
