name: Diagnose PR 241 full analyze
# trigger: pr241-analyze-v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-org-sync-code-fix-once.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-org-canonical-compare
          fetch-depth: 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run full analyzer and persist exact output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          flutter pub get > /tmp/pubget.log 2>&1
          PUB_RC=$?
          if [ "$PUB_RC" -eq 0 ]; then
            flutter analyze --no-fatal-infos > /tmp/analyze.log 2>&1
            RC=$?
          else
            RC=$PUB_RC
            cp /tmp/pubget.log /tmp/analyze.log
          fi

          {
            echo "exit=$RC"
            echo "branch_head=$(git rev-parse HEAD)"
            echo "--- errors/warnings ---"
            grep -E 'error •|warning •|^error |^warning ' /tmp/analyze.log || true
            echo "--- tail ---"
            tail -n 260 /tmp/analyze.log
          } > /tmp/report.txt
          cat /tmp/report.txt

          CONTENT=$(base64 -w0 /tmp/report.txt)
          URL="/repos/$GITHUB_REPOSITORY/contents/.github/ops/pr241-full-analyze.txt"
          SHA=$(gh api "$URL" --jq .sha 2>/dev/null || true)
          ARGS=(--method PUT "$URL" -f message='ops(sync): record PR 241 analyzer output' -f content="$CONTENT" -f branch=main)
          if [ -n "$SHA" ]; then ARGS+=( -f sha="$SHA" ); fi
          gh api "${ARGS[@]}" >/dev/null

          exit "$RC"
