name: Verify sync repair Actions trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-org-sync-code-fix-once.yml'

permissions:
  contents: write

jobs:
  marker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf 'ok=1\nsource=%s\n' "$GITHUB_SHA" > /tmp/marker.txt
          CONTENT=$(base64 -w0 /tmp/marker.txt)
          URL="/repos/$GITHUB_REPOSITORY/contents/.github/ops/sync-repair-trigger-ok.txt"
          SHA=$(gh api "$URL" --jq .sha 2>/dev/null || true)
          ARGS=(--method PUT -H 'Accept: application/vnd.github+json' "$URL" -f message='ops(sync): confirm actions trigger' -f content="$CONTENT" -f branch=main)
          if [ -n "$SHA" ]; then ARGS+=( -f sha="$SHA" ); fi
          gh api "${ARGS[@]}"
