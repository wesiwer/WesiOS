name: Validate recovery organization fixes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-org-sync-code-fix-once.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-org-canonical-compare
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # 1) SyncEngine: explicit remote-authoritative mode for the manual
          # server -> device flow + tolerate stale journal stamps on rows that
          # were quarantined from the sync projection at snapshot time.
          p=Path('lib/core/sync/sync_engine.dart')
          s=p.read_text(encoding='utf-8')
          old="""  static bool _localSnapshotStillCurrent(
            SyncCollection<dynamic> c,
            String id,
            SyncRecord? snapshot,
          ) {
            final currentStamp = SyncJournal.stampOf(c.name, id);
            final currentValue = _localValueBySyncId(c, id);

            if (snapshot == null) {
              // A quarantined row can become visible after its parent/root is
              // repaired earlier in this same pass. Visibility is not a local edit;
              // a real Hive edit is journaled and therefore has a fresh stamp.
              return currentStamp == null;
            }
          """
          new="""  static bool _sameStamp(SyncStamp? a, SyncStamp? b) =>
              a?.updatedAt == b?.updatedAt && a?.deleted == b?.deleted;

            static bool _localSnapshotStillCurrent(
              SyncCollection<dynamic> c,
              String id,
              SyncRecord? snapshot,
              SyncStamp? initialStamp,
            ) {
              final currentStamp = SyncJournal.stampOf(c.name, id);
              final currentValue = _localValueBySyncId(c, id);

              if (snapshot == null) {
                // Quarantined legacy rows are intentionally absent from c.local().
                // A used device may still have an old journal stamp left by a
                // previous failed sync. Compare the journal against the stamp we
                // observed at the start of THIS pass instead of requiring null.
                // This still catches a genuine edit made while the pass is running.
                return _sameStamp(currentStamp, initialStamp);
              }
          """
          if old not in s:
              raise SystemExit('sync_engine snapshot block not found')
          s=s.replace(old,new,1)

          old="""  static Future<SyncReport> run({
            SyncTransport? transport,
            DateTime? now,
            Set<String>? only,
          }) async {
            final at = now ?? SyncClock.now();

            if (SyncRecoveryGuard.active) {
          """
          new="""  static Future<SyncReport> run({
            SyncTransport? transport,
            DateTime? now,
            Set<String>? only,
            bool remoteAuthoritative = false,
          }) async {
            final at = now ?? SyncClock.now();

            // remoteAuthoritative is used only after an explicit manual
            // confirmation that the server is the source for this pass. It is
            // allowed through the recovery lock, but it NEVER uploads local rows.
            if (SyncRecoveryGuard.active && !remoteAuthoritative) {
          """
          if old not in s:
              raise SystemExit('sync_engine run signature block not found')
          s=s.replace(old,new,1)

          old="""        final one = await _runOne(c, t, at, cancelled: cancelled);
          """
          new="""        final one = await _runOne(
                  c,
                  t,
                  at,
                  cancelled: cancelled,
                  remoteAuthoritative: remoteAuthoritative,
                );
          """
          if old not in s:
              raise SystemExit('sync_engine runOne call not found')
          s=s.replace(old,new,1)

          old="""  static Future<SyncCollectionReport> _runOne(
            SyncCollection<dynamic> c,
            SyncTransport t,
            DateTime at, {
            required bool Function() cancelled,
          }) async {
          """
          new="""  static Future<SyncCollectionReport> _runOne(
            SyncCollection<dynamic> c,
            SyncTransport t,
            DateTime at, {
            required bool Function() cancelled,
            required bool remoteAuthoritative,
          }) async {
          """
          if old not in s:
              raise SystemExit('sync_engine runOne signature not found')
          s=s.replace(old,new,1)

          old="""    final allLocalBefore = localState(c, at);
            final mergeLocal = firstEverExchange
                ? _onlyNewTo(allLocalBefore, remote.value!)
                : allLocalBefore;
            final plan = SyncMerge.merge(local: mergeLocal, remote: remote.value!);
          """
          new="""    final initialStamps = SyncJournal.forCollection(c.name);
            final allLocalBefore = localState(c, at);
            final plan = remoteAuthoritative
                ? SyncPlan(
                    toUpload: const <SyncRecord>[],
                    toApplyLocally: remote.value!.values.toList(growable: false),
                    merged: Map<String, SyncRecord>.from(remote.value!),
                  )
                : SyncMerge.merge(
                    local: firstEverExchange
                        ? _onlyNewTo(allLocalBefore, remote.value!)
                        : allLocalBefore,
                    remote: remote.value!,
                  );
          """
          if old not in s:
              raise SystemExit('sync_engine plan block not found')
          s=s.replace(old,new,1)

          # All snapshot checks in _runOne must compare with the journal state
          # captured before this pass started.
          s=s.replace(
              '_localSnapshotStillCurrent(c, r.id, allLocalBefore[r.id])',
              '_localSnapshotStillCurrent(\n              c, r.id, allLocalBefore[r.id], initialStamps[r.id],\n            )')
          s=s.replace(
              '_localSnapshotStillCurrent(c, id, allLocalBefore[id])',
              '_localSnapshotStillCurrent(\n          c, id, allLocalBefore[id], initialStamps[id],\n        )')
          # Ensure no stale three-argument call remains.
          import re
          calls=re.findall(r'_localSnapshotStillCurrent\([^;]+?\)',s,re.S)
          for call in calls[1:]:
              if 'initialStamps' not in call:
                  raise SystemExit('unpatched snapshot call: '+call[:120])
          p.write_text(s,encoding='utf-8')

          # 2) Manual download: remove the second, stale apply implementation.
          p=Path('lib/core/sync/sync_manual_direction.dart')
          s=p.read_text(encoding='utf-8')
          start=s.index('    await SyncJournal.open();\n    var received = 0;\n    try {', s.index('downloadServerAuthoritative'))
          end=s.index('\n  static Future<void> _persistSafetyBackup(', start)
          repl=r'''    try {
              final report = await SyncEngine.run(
                transport: transport,
                remoteAuthoritative: true,
              );
              final problem = report.firstFailure;
              if (problem != null) {
                return ManualDirectionalSyncReport(
                  ok: false,
                  upload: false,
                  changed: report.applied,
                  backupRecords: backup.records,
                  failure: problem,
                );
              }
              return ManualDirectionalSyncReport(
                ok: true,
                upload: false,
                changed: report.applied,
                backupRecords: backup.records,
              );
            } finally {
              if (automaticWasEnabled && !SyncRecoveryGuard.active) {
                SyncAuto.start();
              }
            }
          }
          '''
          s=s[:start]+repl+s[end:]
          # sync_journal is no longer used here.
          s=s.replace("import 'sync_journal.dart';\n",'')
          p.write_text(s,encoding='utf-8')

          # 3) Recovery verification: organization GETs are normalized by the
          # server. Compare their canonical model representation instead of raw
          # legacy JSON maps, while retaining strict comparison elsewhere.
          p=Path('lib/core/sync/sync_recovery.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace(
              '_sameValue(remote.fields, entry.value)',
              'samePayloadForVerification(collection, remote.fields, entry.value)')
          anchor='  static bool _sameSnapshot(_RecoverySnapshot a, _RecoverySnapshot b) {'
          if anchor not in s:
              raise SystemExit('sync_recovery helper anchor not found')
          helper=r'''  @visibleForTesting
            static bool samePayloadForVerification(
              SyncCollection<dynamic> collection,
              Map<String, dynamic> remote,
              Map<String, dynamic> local,
            ) {
              if (_sameValue(remote, local)) return true;
              final a = _verificationPayload(collection, remote);
              final b = _verificationPayload(collection, local);
              return a != null && b != null && _sameValue(a, b);
            }

            static Map<String, dynamic>? _verificationPayload(
              SyncCollection<dynamic> collection,
              Map<String, dynamic> fields,
            ) {
              if (collection.name != 'organizations') {
                return Map<String, dynamic>.from(fields);
              }
              try {
                // decode/encode removes legacy transport-only keys (created,
                // updated, archived, etc.) and canonicalises root metadata.
                final value = collection.decode(Map<String, dynamic>.from(fields));
                if (value == null) return null;
                final out = Map<String, dynamic>.from(collection.encode(value));

                // The production read hook fills these two empty legacy values.
                // They are transport/provenance defaults, not business changes.
                final currency = '${out['baseCurrency'] ?? ''}'.trim();
                if (currency.isEmpty) out['baseCurrency'] = 'RUB';
                final createdBy = '${out['createdBy'] ?? ''}'.trim();
                if (createdBy.isEmpty) out['createdBy'] = 'sync-server';
                return out;
              } catch (_) {
                return null;
              }
            }

            static String _collectionLabel(String name) {
              const labels = <String, String>{
                'organizations': 'Организации',
                'employees': 'Сотрудники',
                'organization_grants': 'Права сотрудников',
                'accounts': 'Счета',
                'finance_categories': 'Финансовые категории',
                'transactions': 'Операции',
                'tasks': 'Задачи',
                'roadmap_projects': 'Roadmap',
                'roadmap_items': 'Roadmap',
                'crm_clients': 'CRM',
                'crm_deals': 'CRM',
                'crm_interactions': 'CRM',
              };
              return labels[name] ?? name;
            }

            static String? _verificationDifference(
              SyncCollection<dynamic> collection,
              Map<String, dynamic> remote,
              Map<String, dynamic> local,
            ) {
              final a = _verificationPayload(collection, remote);
              final b = _verificationPayload(collection, local);
              if (a == null || b == null) return 'некорректная структура ответа';
              final keys = <String>{...a.keys, ...b.keys}.toList()..sort();
              const labels = <String, String>{
                'name': 'название',
                'parentId': 'родительская организация',
                'isRoot': 'тип организации',
                'baseCurrency': 'валюта',
                'status': 'статус',
                'createdAt': 'дата создания',
                'updatedAt': 'дата изменения',
                'createdBy': 'источник создания',
                'code': 'код',
                'description': 'описание',
                'colorValue': 'цвет',
                'sortOrder': 'порядок',
              };
              for (final key in keys) {
                if (!_sameValue(a[key], b[key])) return labels[key] ?? key;
              }
              return null;
            }

          '''
          s=s.replace(anchor,helper+anchor,1)

          old="""    var verified = 0;
            String? firstMismatch;
            for (final entry in localRows.entries) {
              final remote = after.value![entry.key];
              if (remote != null &&
                  !remote.deleted &&
                  samePayloadForVerification(collection, remote.fields, entry.value)) {
                verified++;
              } else {
                firstMismatch ??= entry.key;
              }
            }

            if (verified != localRows.length) {
              final rejected = pushed.authoritativeIds.isNotEmpty
                  ? pushed.authoritativeIds.first
                  : firstMismatch;
              return SyncRecoveryCollectionReport(
                collection: collection.name,
                local: localRows.length,
                uploaded: pushed.sent,
                verified: verified,
                failure: SyncFailure(
                  'RECOVERY_VERIFY_FAILED',
                  'После отправки не совпала ${collection.name}:${rejected ?? '?'}',
                ),
              );
            }
          """
          new="""    var verified = 0;
            String? firstMismatch;
            String? firstMismatchDetail;
            for (final entry in localRows.entries) {
              final remote = after.value![entry.key];
              if (remote != null &&
                  !remote.deleted &&
                  samePayloadForVerification(collection, remote.fields, entry.value)) {
                verified++;
              } else if (firstMismatch == null) {
                firstMismatch = entry.key;
                firstMismatchDetail = remote == null
                    ? 'запись отсутствует на сервере'
                    : remote.deleted
                    ? 'сервер пометил запись удалённой'
                    : _verificationDifference(
                        collection,
                        remote.fields,
                        entry.value,
                      );
              }
            }

            if (verified != localRows.length) {
              final detail = firstMismatchDetail;
              return SyncRecoveryCollectionReport(
                collection: collection.name,
                local: localRows.length,
                uploaded: pushed.sent,
                verified: verified,
                failure: SyncFailure(
                  'RECOVERY_VERIFY_FAILED',
                  'После отправки сервер вернул другую версию записи в разделе '
                      '«${_collectionLabel(collection.name)}»'
                      '${detail == null ? '' : ' — $detail'}',
                ),
              );
            }
          """
          if old not in s:
              raise SystemExit('sync_recovery verification block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # 4) Backup UX: only real exported .wesibackup files are selectable,
          # and user-visible errors no longer expose internal error codes.
          p=Path('lib/features/settings/sync_screen.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace("allowedExtensions: const <String>['wesibackup', 'json'],",
                      "allowedExtensions: const <String>['wesibackup'],")
          s=s.replace(
              "? 'Резервная копия подготовлена: ${backup.records} записей и ${backup.settingsCount} бизнес-настроек. Сохраните файл в «Файлы» или другое надёжное место.'",
              "? 'Резервная копия ${backup.fileName} подготовлена: ${backup.records} записей и ${backup.settingsCount} бизнес-настроек. Сохраните именно этот файл .wesibackup в надёжное место.'")
          old="""    } catch (error) {
              _say(
                _ru
                    ? 'Этот файл нельзя восстановить: $error'
                    : 'This file cannot be restored: $error',
                error: true,
              );
              return;
            }
          """
          new="""    } on LocalBackupException catch (error) {
              final message = error.code == 'BACKUP_FORMAT_INVALID'
                  ? (_ru
                        ? 'Выберите файл .wesibackup, созданный кнопкой «Экспортировать локальную резервную копию». Служебный JSON здесь восстановить нельзя.'
                        : 'Choose a .wesibackup file created by Export local backup. Internal JSON files cannot be restored here.')
                  : (_ru
                        ? 'Резервная копия не прошла проверку: ${error.message}'
                        : 'Backup validation failed: ${error.message}');
              _say(message, error: true);
              return;
            } catch (_) {
              _say(
                _ru
                    ? 'Не удалось прочитать выбранную резервную копию.'
                    : 'Could not read the selected backup.',
                error: true,
              );
              return;
            }
          """
          if old not in s:
              raise SystemExit('sync_screen backup catch block not found')
          s=s.replace(old,new,1)
          s=s.replace("? 'Восстановить из локальной копии'", "? 'Импортировать файл .wesibackup'")
          s=s.replace("'Restore local backup'", "'Import .wesibackup file'")
          p.write_text(s,encoding='utf-8')

          # 5) Version bump for the rescue build.
          p=Path('pubspec.yaml')
          s=p.read_text(encoding='utf-8').replace('version: 0.22.34+109','version: 0.22.35+110',1)
          p.write_text(s,encoding='utf-8')
          p=Path('lib/core/constants/app_version.dart')
          s=p.read_text(encoding='utf-8').replace("number = '0.22.34'","number = '0.22.35'",1).replace('build = 109','build = 110',1)
          p.write_text(s,encoding='utf-8')

          # 6) Regression: semantic organization verification accepts the exact
          # server-side legacy defaults but still rejects a real business diff.
          p=Path('test/core/sync/sync_recovery_test.dart')
          s=p.read_text(encoding='utf-8')
          marker='  test(\'empty server receives snapshot without changing local bytes\', () async {'
          test=r'''  test('organization verification accepts server legacy canonicalization', () {
            final collection = OrganizationsSync();
            final local = <String, dynamic>{
              'id': 'org_1786636872294887',
              'name': 'Local organization',
              'parentId': 'org_wesi_inc',
              'isRoot': false,
              'baseCurrency': '',
              'status': 'active',
              'createdAt': '2026-08-17T13:19:24.672Z',
              'updatedAt': '2026-08-17T13:19:24.672Z',
              'createdBy': '',
              'code': null,
              'description': null,
              'colorValue': null,
              'sortOrder': 0,
            };
            final remote = <String, dynamic>{
              ...local,
              'baseCurrency': 'RUB',
              'createdBy': 'sync-server',
              'created': '2026-08-17T13:19:24.672Z',
              'updated': '2026-08-17T13:19:24.672Z',
              'archived': false,
            };
            expect(
              SyncRecovery.samePayloadForVerification(collection, remote, local),
              isTrue,
            );
            remote['name'] = 'Different business name';
            expect(
              SyncRecovery.samePayloadForVerification(collection, remote, local),
              isFalse,
            );
          });

          '''
          if marker not in s:
              raise SystemExit('sync_recovery_test insertion marker missing')
          s=s.replace(marker,test+marker,1)
          p.write_text(s,encoding='utf-8')

          # 7) Used-device regression: stale journal stamps from old failed
          # attempts must not block hidden organization-tree repair.
          p=Path('test/core/sync/organization_sync_hidden_cache_engine_test.dart')
          s=p.read_text(encoding='utf-8')
          if "sync_journal.dart" not in s:
              s=s.replace("import 'package:wesios/core/sync/sync_engine.dart';\n",
                          "import 'package:wesios/core/sync/sync_engine.dart';\nimport 'package:wesios/core/sync/sync_journal.dart';\n")
          needle="""      expect(OrganizationsSync().local(), isEmpty);

            final serverAt = DateTime.utc(2026, 8, 17, 13, 19, 24, 672);
          """
          replacement="""      expect(OrganizationsSync().local(), isEmpty);

            // Simulate a real upgraded phone that already failed the old apply
            // path several times and therefore has journal entries for rows
            // hidden by the invalid root.
            await SyncJournal.open();
            final staleStamp = SyncStamp(DateTime.utc(2026, 8, 20, 12));
            for (final id in <String>[
              OrganizationModel.rootId,
              OrganizationModel.wesiBeatsId,
              'org_it',
            ]) {
              await SyncJournal.record('organizations', id, staleStamp);
            }

            final serverAt = DateTime.utc(2026, 8, 17, 13, 19, 24, 672);
          """
          if needle not in s:
              raise SystemExit('hidden cache stale-stamp marker missing')
          s=s.replace(needle,replacement,1)

          # Duplicate the regression in remote-authoritative mode, which is the
          # exact path used by the Manual Sync -> Download server button.
          start=s.index("  test(\n    'full engine repairs hidden legacy tree without false concurrent edit'")
          end=s.rfind('\n}')
          original=s[start:end]
          duplicate=original.replace(
              "'full engine repairs hidden legacy tree without false concurrent edit'",
              "'remote authoritative engine repairs used-device hidden legacy tree'",
              1,
          ).replace(
              "only: const <String>{'organizations'},\n      );",
              "only: const <String>{'organizations'},\n        remoteAuthoritative: true,\n      );",
              1,
          )
          s=s[:end]+'\n\n'+duplicate+s[end:]
          p.write_text(s,encoding='utf-8')
          PY

          dart format \
            lib/core/sync/sync_engine.dart \
            lib/core/sync/sync_manual_direction.dart \
            lib/core/sync/sync_recovery.dart \
            lib/features/settings/sync_screen.dart \
            test/core/sync/sync_recovery_test.dart \
            test/core/sync/organization_sync_hidden_cache_engine_test.dart
          git diff --check

      - name: Validate targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test \
            test/core/sync/organization_sync_legacy_root_test.dart \
            test/core/sync/organization_sync_recovery_test.dart \
            test/core/sync/organization_sync_server_compat_test.dart \
            test/core/sync/organization_sync_hidden_cache_engine_test.dart \
            test/core/sync/sync_recovery_test.dart \
            test/core/backup/local_backup_service_test.dart
          flutter analyze --no-fatal-infos \
            lib/core/sync/sync_engine.dart \
            lib/core/sync/sync_manual_direction.dart \
            lib/core/sync/sync_recovery.dart \
            lib/features/settings/sync_screen.dart \
            test/core/sync/organization_sync_hidden_cache_engine_test.dart \
            test/core/sync/sync_recovery_test.dart

      - name: Commit validated patch to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Sync Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/core/sync/sync_engine.dart \
            lib/core/sync/sync_manual_direction.dart \
            lib/core/sync/sync_recovery.dart \
            lib/features/settings/sync_screen.dart \
            test/core/sync/sync_recovery_test.dart \
            test/core/sync/organization_sync_hidden_cache_engine_test.dart \
            pubspec.yaml \
            lib/core/constants/app_version.dart
          git commit -m 'fix(sync): repair used-device recovery paths'
          git push origin HEAD:fix/recovery-org-canonical-compare

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh pr list --repo "$GITHUB_REPOSITORY" --head fix/recovery-org-canonical-compare --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head fix/recovery-org-canonical-compare \
              --title 'fix(sync): восстановление на уже использовавшемся телефоне' \
              --body 'Исправляет оба сценария с фото: ручной server→phone больше не использует старый apply-loop; phone→server сравнивает каноническую organization-модель вместо legacy transport JSON. Добавлен regression со старыми journal stamps, исправлен импорт .wesibackup, версия 0.22.35+110.'
          fi
