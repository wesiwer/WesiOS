name: Diagnose production organization sync once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-org-sync-code-fix-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${KEY:-}" && test -n "${HOST:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
      - name: Read organization structural payloads only
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          $SSH "$USER@$HOST" 'python3 - <<'"'"'PY'"'"'
          import json, sqlite3, os
          candidates=[
            "/opt/pocketbase/pb_data/data.db",
            "/opt/pocketbase/pb_data/data.db-wal",
          ]
          db=next((p for p in candidates if p.endswith("data.db") and os.path.exists(p)), None)
          if not db:
            raise SystemExit("PocketBase data.db not found")
          con=sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          rows=con.execute("SELECT rid, stamp, deleted, payload FROM wesios_records WHERE coll='organizations' ORDER BY rid").fetchall()
          keep=("id","name","parentId","isRoot","baseCurrency","status","createdAt","updatedAt","createdBy","code","sortOrder","archived","created","updated")
          print("COUNT", len(rows))
          for rid,stamp,deleted,payload in rows:
            try:
              p=json.loads(payload) if isinstance(payload,str) else payload
            except Exception:
              p={"_payload_parse":"failed"}
            if not isinstance(p,dict): p={"_payload_type":type(p).__name__}
            safe={k:p.get(k) for k in keep if k in p}
            print(json.dumps({"rid":rid,"stamp":stamp,"deleted":bool(deleted),"payload":safe},ensure_ascii=False,sort_keys=True))
          PY'
