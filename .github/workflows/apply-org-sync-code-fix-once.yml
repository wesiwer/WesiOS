name: Diagnose sync repair patch anchors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-org-sync-code-fix-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recovery-org-canonical-compare
      - name: Check anchors and persist report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' > /tmp/report.txt
          from pathlib import Path
          e=Path('lib/core/sync/sync_engine.dart').read_text(encoding='utf-8')
          m=Path('lib/core/sync/sync_manual_direction.dart').read_text(encoding='utf-8')
          t=Path('test/core/sync/organization_sync_hidden_cache_engine_test.dart').read_text(encoding='utf-8')
          checks={
            'snapshot_anchor': "return currentStamp == null;" in e,
            'run_guard_anchor': "if (SyncRecoveryGuard.active) {" in e,
            'runone_call': "final one = await _runOne(c, t, at, cancelled: cancelled);" in e,
            'runone_signature': "required bool Function() cancelled," in e,
            'plan_anchor': "final mergeLocal = firstEverExchange" in e,
            'snapshot_r_calls': e.count("_localSnapshotStillCurrent(c, r.id, allLocalBefore[r.id])"),
            'snapshot_id_calls': e.count("_localSnapshotStillCurrent(c, id, allLocalBefore[id])"),
            'manual_loop': "await SyncJournal.open();\n    var received = 0;\n    try {" in m,
            'test_anchor': "expect(OrganizationsSync().local(), isEmpty);\n\n      final serverAt" in t,
          }
          for k,v in checks.items(): print(f'{k}={v}')
          PY
          cat /tmp/report.txt
          CONTENT=$(base64 -w0 /tmp/report.txt)
          URL="/repos/$GITHUB_REPOSITORY/contents/.github/ops/sync-repair-anchor-report.txt"
          SHA=$(gh api "$URL" --jq .sha 2>/dev/null || true)
          ARGS=(--method PUT -H 'Accept: application/vnd.github+json' "$URL" -f message='ops(sync): record patch anchor report' -f content="$CONTENT" -f branch=main)
          if [ -n "$SHA" ]; then ARGS+=( -f sha="$SHA" ); fi
          gh api "${ARGS[@]}"
