name: Temporary Wesi AI Runtime Fix V2

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
    paths:
      - .github/workflows/tmp-ai-runtime-fix-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage12-final-20260816
          fetch-depth: 0

      - name: Apply runtime fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'lib/features/ai/ai_assistant_v2_screen.dart',
              '  WesiAiUiMode _uiMode = WesiAiUiMode.classic;',
              '  WesiAiUiMode _uiMode = WesiAiUiMode.thinking;',
          )

          replace(
              'lib/features/ai/widgets/wesi_ai_rich_message.dart',
              '''                Text(\n                  '+${event.additions}',\n                  style: theme.textTheme.labelSmall?.copyWith(\n                    color: positive,\n                    fontWeight: FontWeight.w700,\n                  ),\n                ),\n                const SizedBox(width: 5),\n                Text(\n                  '-${event.deletions}',\n                  style: theme.textTheme.labelSmall?.copyWith(\n                    color: negative,\n                    fontWeight: FontWeight.w700,\n                  ),\n                ),''',
              '''                if (event.hasDiff) ...[\n                  Text(\n                    '+${event.additions}',\n                    style: theme.textTheme.labelSmall?.copyWith(\n                      color: positive,\n                      fontWeight: FontWeight.w700,\n                    ),\n                  ),\n                  const SizedBox(width: 5),\n                  Text(\n                    '-${event.deletions}',\n                    style: theme.textTheme.labelSmall?.copyWith(\n                      color: negative,\n                      fontWeight: FontWeight.w700,\n                    ),\n                  ),\n                ],''',
          )

          api = Path('lib/features/ai/wesi_ai_api.dart')
          text = api.read_text()
          old = """      result.add(<String, dynamic>{\n        'id': 'tool_result_$index',\n        'kind': 'tool',\n        'sourceName': tool,\n        'label': tool.isEmpty ? 'Инструмент' : 'Инструмент · $tool',\n        'status': 'result',\n        'additions': count(payload['additions'] ?? map['additions']),\n        'deletions': count(payload['deletions'] ?? map['deletions']),\n        if (files.isNotEmpty) 'files': files,\n        if ('${map['code'] ?? ''}'.trim().isNotEmpty)\n          'detail': '${map['code']}',\n      });"""
          new = """      final hasDiffMetadata = payload.containsKey('additions') ||\n          payload.containsKey('deletions') ||\n          map.containsKey('additions') ||\n          map.containsKey('deletions') ||\n          files.isNotEmpty;\n      final transactionCount = payload['transactionCount'];\n      final organizationName = '${payload['organizationName'] ?? ''}'.trim();\n      final organizationId = '${payload['organizationId'] ?? ''}'.trim();\n      final code = '${map['code'] ?? ''}'.trim();\n      final detailParts = <String>[\n        if (transactionCount is num) '${transactionCount.toInt()} операций',\n        if (organizationName.isNotEmpty) organizationName,\n        if (organizationName.isEmpty && organizationId.isNotEmpty) organizationId,\n        if (code.isNotEmpty) code,\n      ];\n      result.add(<String, dynamic>{\n        'id': 'tool_result_$index',\n        'kind': 'tool',\n        'sourceName': tool,\n        'label': tool.isEmpty ? 'Инструмент' : 'Инструмент · $tool',\n        'status': 'result',\n        if (hasDiffMetadata)\n          'additions': count(payload['additions'] ?? map['additions']),\n        if (hasDiffMetadata)\n          'deletions': count(payload['deletions'] ?? map['deletions']),\n        if (files.isNotEmpty) 'files': files,\n        if (detailParts.isNotEmpty) 'detail': detailParts.join(' · '),\n      });"""
          if old not in text:
              raise SystemExit('missing fallback tool activity block')
          api.write_text(text.replace(old, new, 1))

          controller = Path('lib/features/ai/controllers/wesi_ai_chat_controller.dart')
          text = controller.read_text()
          marker = '''    void onActivity(Map<String, dynamic> raw) {\n'''
          helper = '''    String streamedToolDetail(Map<String, dynamic> raw) {\n      final parts = <String>[];\n      final transactionCount = raw['transactionCount'];\n      if (transactionCount is num) {\n        parts.add('${transactionCount.toInt()} операций');\n      }\n      final organizationName = '${raw['organizationName'] ?? ''}'.trim();\n      final organizationId = '${raw['organizationId'] ?? ''}'.trim();\n      if (organizationName.isNotEmpty) {\n        parts.add(organizationName);\n      } else if (organizationId.isNotEmpty) {\n        parts.add(organizationId);\n      }\n      final code = '${raw['code'] ?? ''}'.trim();\n      if (code.isNotEmpty) parts.add(code);\n      return parts.join(' · ');\n    }\n\n    void onActivity(Map<String, dynamic> raw) {\n'''
          if marker not in text:
              raise SystemExit('missing controller activity marker')
          text = text.replace(marker, helper, 1)
          old = '''            final code = '${raw['code'] ?? ''}'.trim();\n            if (code.isNotEmpty) current['detail'] = code;'''
          new = '''            final detail = streamedToolDetail(raw);\n            if (detail.isNotEmpty) current['detail'] = detail;'''
          if old not in text:
              raise SystemExit('missing controller existing-tool detail block')
          text = text.replace(old, new, 1)
          old = '''              additions: additions,\n              deletions: deletions,\n              files: files,\n            ));'''
          new = '''              detail: streamedToolDetail(raw),\n              additions: additions,\n              deletions: deletions,\n              files: files,\n            ));'''
          if old not in text:
              raise SystemExit('missing controller new-tool activity block')
          text = text.replace(old, new, 1)
          controller.write_text(text)

          replace(
              'server/wesi-ai-stream/gateway.mjs',
              "res.end(JSON.stringify({ok: true, service: 'wesi-ai-stream-gateway', streaming: true}));",
              "res.end(JSON.stringify({ok: true, ready: true, service: 'wesi-ai-stream-gateway', streaming: true}));",
          )

          gw = Path('server/wesi-ai-stream/gateway.mjs')
          text = gw.read_text()
          old = """        writeNdjson(res, {\n          type: 'tool',\n          phase: 'result',\n          name: toolRequest.name,\n          ok: toolResult?.ok === true,\n          code: toolResult?.code || null,\n          additions: diff.additions,\n          deletions: diff.deletions,\n          files: diff.files,\n        });"""
          new = """        const toolPayload = toolResult && typeof toolResult.result === 'object' && !Array.isArray(toolResult.result)\n          ? toolResult.result\n          : {};\n        const hasDiffMetadata = Object.prototype.hasOwnProperty.call(toolPayload, 'additions') ||\n          Object.prototype.hasOwnProperty.call(toolPayload, 'deletions') || diff.files.length > 0;\n        writeNdjson(res, {\n          type: 'tool',\n          phase: 'result',\n          name: toolRequest.name,\n          ok: toolResult?.ok === true,\n          code: toolResult?.code || null,\n          ...(hasDiffMetadata ? {additions: diff.additions, deletions: diff.deletions, files: diff.files} : {}),\n          ...(Number.isFinite(Number(toolPayload.transactionCount)) ? {transactionCount: Number(toolPayload.transactionCount)} : {}),\n          ...(toolPayload.organizationId ? {organizationId: String(toolPayload.organizationId)} : {}),\n          ...(toolPayload.organizationName ? {organizationName: String(toolPayload.organizationName)} : {}),\n        });"""
          if old not in text:
              raise SystemExit('missing gateway tool event block')
          text = text.replace(old, new, 1)
          text = text.replace(
              """          writeNdjson(res, {\n            type: 'agent',\n            phase: 'result',\n            name: prepared.persona,\n            role: 'lead',\n            additions: totalDiff.additions,\n            deletions: totalDiff.deletions,\n            files: totalDiff.files,\n          });""",
              """          writeNdjson(res, {\n            type: 'agent',\n            phase: 'result',\n            name: prepared.persona,\n            role: 'lead',\n            ...(totalDiff.additions || totalDiff.deletions || totalDiff.files.length\n              ? {additions: totalDiff.additions, deletions: totalDiff.deletions, files: totalDiff.files}\n              : {}),\n          });""",
              1,
          )
          text = text.replace(
              """      writeNdjson(res, {\n        type: 'agent',\n        phase: 'result',\n        name: prepared.persona,\n        role: 'lead',\n        additions: totalDiff.additions,\n        deletions: totalDiff.deletions,\n        files: totalDiff.files,\n      });""",
              """      writeNdjson(res, {\n        type: 'agent',\n        phase: 'result',\n        name: prepared.persona,\n        role: 'lead',\n        ...(totalDiff.additions || totalDiff.deletions || totalDiff.files.length\n          ? {additions: totalDiff.additions, deletions: totalDiff.deletions, files: totalDiff.files}\n          : {}),\n      });""",
              1,
          )
          gw.write_text(text)

          replace(
              'lib/features/treasury/models/transaction_model.dart',
              "        'organizationId': organizationId,",
              "        'organizationId': effectiveOrganizationId,",
          )

          dep = Path('.github/workflows/deploy-wesi-ai-streaming.yml')
          text = dep.read_text()
          old = '''          curl -fsS --max-time 10 http://127.0.0.1:8787/health\n          curl -fsS --max-time 10 http://127.0.0.1:8792/health'''
          new = '''          curl -fsS --max-time 10 http://127.0.0.1:8787/health\n          gateway_health="$(curl -fsS --max-time 10 http://127.0.0.1:8792/health)"\n          echo "$gateway_health" | grep -q '\"ready\":true'\n          echo "$gateway_health" | grep -q '\"streaming\":true' '''
          if old not in text:
              raise SystemExit('missing deploy health block')
          dep.write_text(text.replace(old, new, 1))
          PY

      - name: Add regression tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/wesi_ai_rich_message_test.dart')
          text = p.read_text()
          marker = "  testWidgets('live work log is expanded before final answer', (tester) async {"
          if marker not in text:
              raise SystemExit('missing rich-message marker')
          insert = """  testWidgets('read-only tool does not render fake +0 -0 diff counters', (tester) async {\n    await tester.pumpWidget(const MaterialApp(\n      home: Scaffold(\n        body: WesiAiRichMessage(\n          messageId: 'finance-tool',\n          text: '',\n          activityRaw: [\n            {\n              'id': 'finance-result',\n              'kind': 'tool',\n              'sourceName': 'finance_summary',\n              'label': 'Инструмент · finance_summary',\n              'status': 'result',\n              'detail': '40 операций · Wesi Inc',\n            }\n          ],\n        ),\n      ),\n    ));\n    expect(find.text('Инструмент · finance_summary'), findsOneWidget);\n    expect(find.text('40 операций · Wesi Inc'), findsOneWidget);\n    expect(find.text('+0'), findsNothing);\n    expect(find.text('-0'), findsNothing);\n  });\n\n"""
          p.write_text(text.replace(marker, insert + marker, 1))

          p = Path('server/wesi-ai-stream/gateway.test.mjs')
          text = p.read_text()
          if "gateway health exposes ready state" not in text:
              text += """\n\ntest('gateway health exposes ready state', async () => {\n  const handler = createGateway({\n    pocketBaseUrl: 'https://main.example.test',\n    relayUrl: 'https://relay.example.test',\n    streamSecret: 's'.repeat(40),\n    relaySecret: 'r'.repeat(40),\n    fetchImpl: async () => { throw new Error('not used'); },\n  });\n  const req = {method: 'GET', url: '/health'};\n  let status = 0; let body = '';\n  const res = {\n    destroyed: false, writableEnded: false,\n    writeHead(code) { status = code; },\n    end(value='') { body += value; this.writableEnded = true; },\n    write(value) { body += value; return true; },\n    on() {},\n  };\n  await handler(req, res);\n  assert.equal(status, 200);\n  const json = JSON.parse(body);\n  assert.equal(json.ready, true);\n  assert.equal(json.streaming, true);\n});\n"""
          p.write_text(text)
          PY

      - name: Server checks
        run: |
          set -euo pipefail
          node --check server/wesi-ai-stream/gateway.mjs
          node --check server/pb_hooks/wesi_ai_finance_tools.js
          node --check server/pb_hooks/wesi_ai_tools.js
          (cd server/wesi-ai-stream && npm test)

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - run: dart format lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart lib/features/ai/widgets/wesi_ai_rich_message.dart lib/features/ai/wesi_ai_api.dart lib/features/treasury/models/transaction_model.dart test/wesi_ai_rich_message_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/wesi_ai_rich_message_test.dart test/wesi_ai_coagent_activity_test.dart

      - name: Commit verified fixes
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-ci'
          git config user.email 'wesi-ai-ci@users.noreply.github.com'
          git add lib server test .github/workflows/deploy-wesi-ai-streaming.yml
          git commit -m 'fix(ai): ground finance results and restore thinking stream UX'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
