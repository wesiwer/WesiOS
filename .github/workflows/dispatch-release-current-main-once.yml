name: Dispatch Release Current Main Once
# trigger: signed dispatch for 0.22.32+107 with WesiAI live-thinking fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-release-current-main-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed WesiOS release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'dispatch 0.22.32+107 WesiAI live thinking and deep work details'
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='WesiOS 0.22.32+107: восстановлен живой ход работы WesiAI; мысли, инструменты и специалисты снова видны в Thinking, глубокие детали раскрываются вторым уровнем, а длинные автономные проходы больше не обрываются старым клиентским таймаутом.' \
            -f deploy_to_server=true
          echo 'Release workflow dispatched for WesiOS 0.22.32+107.'
