name: Dispatch Release Current Main Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-release-current-main-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed WesiOS release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'dispatch retry 4'
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='WesiOS 0.22.28+103 retry: updated dartssh2 2.22.5, pointycastle 4.x, SHA256 SSH host-key support, Flutter 3.47 compatibility fixes.' \
            -f deploy_to_server=true
          echo 'Release workflow dispatched after SSH stack repair.'
