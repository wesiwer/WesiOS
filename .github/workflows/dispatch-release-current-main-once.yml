name: Dispatch Release Current Main Once
# trigger: final signed dispatch for 0.22.30+105 after production sync hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-release-current-main-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed WesiOS release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'dispatch 0.22.30+105 legacy organization payload compatibility + settings cleanup'
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='WesiOS 0.22.30+105: fixes organizations:org_wesi_inc (+2) by normalizing legacy organization payloads on the production sync read path; removes the obsolete Telegram bot server-required placeholder from Settings.' \
            -f deploy_to_server=true
          echo 'Release workflow dispatched for WesiOS 0.22.30+105.'
