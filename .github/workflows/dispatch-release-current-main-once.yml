name: Dispatch Release Current Main Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-release-current-main-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed WesiOS release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'dispatch 0.22.29+104 organization-sync recovery'
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='WesiOS 0.22.29+104: fixes organization sync recovery from stale/orphan local Hive rows; revision-v2 production fix retained; validated with dedicated Flutter regression tests and analyzer.' \
            -f deploy_to_server=true
          echo 'Release workflow dispatched for WesiOS 0.22.29+104.'
