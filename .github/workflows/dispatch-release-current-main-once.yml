name: Dispatch Release Current Main Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-release-current-main-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed WesiOS release from current main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'dispatch retry 6'
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='WesiOS 0.22.28+103 retry: Android vibration and speech_to_text migrated off removed Flutter v1 embedding; file_picker, SSH, intl and Quill compatibility fixes retained.' \
            -f deploy_to_server=true
          echo 'Release workflow dispatched after remaining Android v1 embedding plugin fixes.'
