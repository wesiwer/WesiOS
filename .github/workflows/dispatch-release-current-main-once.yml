name: Dispatch Release Current Main Once
# trigger: signed dispatch for 0.22.32+107 with WesiAI live-thinking fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-release-current-main-once.yml'

permissions:
  actions: write
  contents: read
  statuses: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve current main
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "main=$sha"

      - name: Dispatch signed WesiOS release from current main
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo 'dispatch 0.22.32+107 WesiAI live thinking and deep work details'
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f notes='WesiOS 0.22.32+107: восстановлен живой ход работы WesiAI; мысли, инструменты и специалисты снова видны в Thinking, глубокие детали раскрываются вторым уровнем, а длинные автономные проходы больше не обрываются старым клиентским таймаутом.' \
            -f deploy_to_server=true
          echo "Release workflow dispatched for WesiOS 0.22.32+107 at $MAIN_SHA."

      - name: Find dispatched release run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          SINCE: ${{ steps.dispatch.outputs.since }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for i in $(seq 1 60); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow release-app.yml \
              --event workflow_dispatch \
              --branch main \
              --limit 20 \
              --json databaseId,headSha,createdAt \
              --jq --arg sha "$MAIN_SHA" --arg since "$SINCE" '[.[] | select(.headSha == $sha and .createdAt >= $since)] | sort_by(.createdAt) | reverse | .[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          [ -n "$run_id" ] || { echo 'Release run not found' >&2; exit 1; }
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
          echo "release run id=$run_id"

      - name: Wait for Windows and Android publication
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15

      - name: Publish release success status
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          RUN_ID: ${{ steps.run.outputs.id }}
        shell: bash
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$MAIN_SHA" \
            -f state=success \
            -f context='WesiOS Release 0.22.32' \
            -f description='Windows and Android release published successfully' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"

      - name: Publish release failure status
        if: ${{ failure() && steps.main.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          RUN_ID: ${{ steps.run.outputs.id }}
        shell: bash
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
          if [ -n "${RUN_ID:-}" ]; then url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$MAIN_SHA" \
            -f state=failure \
            -f context='WesiOS Release 0.22.32' \
            -f description='Release workflow failed; inspect Actions run' \
            -f target_url="$url"
