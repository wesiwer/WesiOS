name: Verify PR234 full once

# Trigger revision 2: workflow already exists on main before this push.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pr234-full-once.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 41228370058f7abc4039bb33144aa7c08e6754e0
      - name: Confirm exact head and tree
        run: |
          test "$(git rev-parse HEAD)" = "41228370058f7abc4039bb33144aa7c08e6754e0"
          git status --short
          echo 'ROADMAP TREE BEFORE PUB GET'
          git ls-files 'lib/features/roadmap/**'
      - name: Validate server JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in server/pb_hooks/*.js server/employee-portal/*.js server/wesi-ai-relay/*.mjs server/wesi-ai-stream/*.mjs; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Validate Wesi AI deployment shell
        shell: bash
        run: |
          set -euo pipefail
          for file in server/wesi-ai-relay/*.sh server/wesi-ai-stream/*.sh; do
            [ -f "$file" ] || continue
            bash -n "$file"
          done
          test -s .github/workflows/deploy-wesi-ai.yml
          test -s .github/workflows/deploy-wesi-ai-streaming.yml
          test ! -e .github/workflows/deploy-wesi-ai-relay.yml
          grep -q 'Deploy Wesi AI End-to-End' .github/workflows/deploy-wesi-ai.yml
          grep -q 'Deploy Wesi AI Streaming' .github/workflows/deploy-wesi-ai-streaming.yml
          grep -q 'configure-relay-https.sh' .github/workflows/deploy-wesi-ai.yml
          grep -q 'GEMINI_API_KEY' .github/workflows/deploy-wesi-ai.yml
      - name: Test Wesi AI Relay
        run: node --test server/wesi-ai-relay/*.test.mjs
      - name: Test Wesi AI Main streaming gateway
        run: node --test server/wesi-ai-stream/*.test.mjs
      - name: Validate Wesi AI persona bundle
        shell: bash
        run: |
          set -euo pipefail
          python server/build-wesi-ai-personas.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('server/pb_hooks/.wesi-ai-personas.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert len(data['personas']['zane']) >= 200
          assert len(data['personas']['nirvana']) >= 200
          p.unlink()
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Diagnose roadmap tree after pub get
        run: |
          echo 'ROADMAP TREE AFTER PUB GET'
          git status --short
          find lib/features/roadmap -maxdepth 3 -type f -print | sort
      - name: Full analyze
        run: flutter analyze --no-fatal-infos
      - name: Full tests
        run: flutter test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 41228370058f7abc4039bb33144aa7c08e6754e0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build Android debug APK
        run: flutter build apk --debug

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 41228370058f7abc4039bb33144aa7c08e6754e0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release

  report:
    if: always()
    needs: [analyze-test, android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Report result
        env:
          GH_TOKEN: ${{ github.token }}
          A: ${{ needs.analyze-test.result }}
          D: ${{ needs.android.result }}
          W: ${{ needs.windows.result }}
        shell: bash
        run: |
          if [ "$A" = success ] && [ "$D" = success ] && [ "$W" = success ]; then
            gh pr comment 234 --repo "$GITHUB_REPOSITORY" --body "✅ FULL GATE GREEN for 4122837: server/Wesi AI validation, full flutter analyze, full flutter test, Android debug build and Windows release build all passed."
          else
            gh pr comment 234 --repo "$GITHUB_REPOSITORY" --body "❌ FULL GATE: analyze/test=$A, android=$D, windows=$W. Inspect run $GITHUB_RUN_ID before merge."
            exit 1
          fi
