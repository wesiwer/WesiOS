name: Fix live sync CI

on:
  push:
    branches: [agent/live-sync-manual-refresh-clock]
    paths:
      - '.github/workflows/fix-live-sync-ci.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-sync-manual-refresh-clock
          fetch-depth: 0

      - name: Apply fixes
        run: python3 tools/fix_live_sync_ci.py

      - name: Validate
        run: |
          set -euo pipefail
          ! grep -q "sync/sync_engine.dart" lib/features/home/home_screen.dart
          grep -q '_registerProbeFailure();' lib/core/sync/sync_auto.dart

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Agent'
          git config user.email 'actions@github.com'
          git add lib
          git commit -m 'fix(sync): back off failed live refresh and clean Home import'
          git push origin HEAD:agent/live-sync-manual-refresh-clock
