name: Validate Classic Full Orchestration Once

on:
  push:
    branches: [fix/wesi-ai-classic-full-orchestration]
    paths:
      - '.github/workflows/validate-classic-full-orchestration-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wesi-ai-classic-full-orchestration
          fetch-depth: 0

      - name: Apply Classic orchestration fix
        run: |
          set -euo pipefail
          python3 scripts/patch_classic_full_orchestration.py
          grep -q "if (conversation.persona != WesiAiPersona.lobby)" lib/features/ai/wesi_ai_api.dart
          grep -q "if (!thinkingMode) return;" lib/features/ai/controllers/wesi_ai_chat_controller.dart
          grep -q "if (thinkingMode && !deliberationState)" server/wesi-ai-stream/gateway.mjs
          grep -q '^version: 0.22.22+97$' pubspec.yaml

      - name: Validate Node orchestration
        run: |
          set -euo pipefail
          node --check server/wesi-ai-stream/gateway.mjs
          node --check server/wesi-ai-stream/public_deliberation.mjs
          node --test server/wesi-ai-stream/*.test.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Validate Flutter AI client
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/features/ai
          flutter analyze --no-fatal-infos lib/features/ai lib/core/constants/app_version.dart

      - name: Commit validated product fix
        run: |
          set -euo pipefail
          git config user.name 'wesiwer'
          git config user.email '77644223+wesiwer@users.noreply.github.com'
          git add \
            lib/features/ai/wesi_ai_api.dart \
            lib/features/ai/controllers/wesi_ai_chat_controller.dart \
            server/wesi-ai-stream/gateway.mjs \
            server/wesi-ai-stream/gateway.test.mjs \
            pubspec.yaml \
            lib/core/constants/app_version.dart
          git rm -f scripts/patch_classic_full_orchestration.py
          git commit -m 'fix(ai): keep full orchestration in Classic mode'
          git push origin HEAD:fix/wesi-ai-classic-full-orchestration

# validation trigger 2
