name: Repair Android release signature

on:
  push:
    branches: [main]
    paths:
      - android/app/build.gradle
      - pubspec.yaml
      - .github/workflows/repair-android-signature.yml

permissions:
  contents: write

concurrency:
  group: repair-android-signature
  cancel-in-progress: true

env:
  RELEASE_TAG: app-latest

jobs:
  signed-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          RAW=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          echo "version=${RAW%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${RAW##*+}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - run: flutter pub get

      - name: Require real Firebase configuration
        run: |
          test -s android/app/google-services.json || {
            echo "::error::android/app/google-services.json отсутствует"
            exit 1
          }

      - name: Decode and verify permanent keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "::error::$name не задан"; exit 1; }
          done

          B64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          STORE_PASS=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          KEY_PASS=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '[:space:]')
          printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/wesios-release.jks"

          keytool -list -keystore "$RUNNER_TEMP/wesios-release.jks" \
            -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null

          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/wesios-release.jks"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4G -Dorg.gradle.daemon=false
        run: flutter build apk --release

      - name: Verify APK certificate equals keystore certificate
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER"

          EXPECTED=$(keytool -exportcert \
            -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')

          echo "Expected certificate: ${EXPECTED:0:12}…"
          echo "APK certificate:      ${ACTUAL:0:12}…"
          test -n "$ACTUAL"
          test "$EXPECTED" = "$ACTUAL" || {
            echo "::error::APK подписана не тем сертификатом"
            exit 1
          }
          cp "$APK" wesios-android.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WesiOS-Android-signed-0.18.0-build-39
          path: wesios-android.apk
          retention-days: 7

      - name: Replace Android asset and manifest in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          mkdir current
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern app-manifest.json --dir current
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern wesios-windows-x64.zip --dir current
          test -s current/app-manifest.json
          test -s current/wesios-windows-x64.zip

          APK_SIZE=$(stat -c%s wesios-android.apk)
          APK_SHA=$(sha256sum wesios-android.apk | awk '{print $1}')
          export APK_SIZE APK_SHA
          python3 <<'PY'
          import json, os
          path='current/app-manifest.json'
          with open(path, encoding='utf-8') as f:
              m=json.load(f)
          version=os.environ['VERSION']; build=int(os.environ['BUILD'])
          m['version']=version; m['build']=build
          android=m.setdefault('android', {})
          android.update({
              'version': version,
              'build': build,
              'asset': 'wesios-android.apk',
              'sizeBytes': int(os.environ['APK_SIZE']),
              'sha256': os.environ['APK_SHA'],
              'notes': 'Исправлена постоянная подпись Android-сборки.',
          })
          with open(path,'w',encoding='utf-8') as f:
              json.dump(m,f,ensure_ascii=False,indent=2)
          PY

          gh release upload "$RELEASE_TAG" wesios-android.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" current/app-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Prepare server upload
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${KEY:-}" && test -n "${HOST:-}"
          mkdir -p ~/.ssh upload
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          cp current/wesios-windows-x64.zip upload/
          cp wesios-android.apk upload/
          cp server/deploy-artifact.sh upload/

      - name: Publish corrected APK to WesiOS server
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
          ARTIFACTS_DIR: ${{ vars.WESI_ARTIFACTS_DIR }}
        run: |
          set -euo pipefail
          test -n "${USER:-}"
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE_TMP="/tmp/wesios-signature-repair-$GITHUB_RUN_ID"
          $SSH "$USER@$HOST" "mkdir -p '$REMOTE_TMP'"
          scp -i "$HOME/.ssh/id_deploy" -o BatchMode=yes upload/* "$USER@$HOST:$REMOTE_TMP/"
          $SSH "$USER@$HOST" \
            "WESI_ARTIFACTS='${ARTIFACTS_DIR:-/opt/pocketbase/pb_public/artifacts}' \
             bash '$REMOTE_TMP/deploy-artifact.sh' \
             --version '$VERSION' --build '$BUILD' --from '$REMOTE_TMP' \
             --notes-b64 '0JjRgdC/0YDQsNCy0LvQtdC90LAg0L/QvtGB0YLQvtGP0L3QvdCw0Y8g0L/QvtC00L/QuNGB0YwgQW5kcm9pZC3RgdCx0L7RgNC60Lgu'"
          $SSH "$USER@$HOST" "rm -rf '$REMOTE_TMP'"

      - name: Verify published Android build
        env:
          BASE: ${{ vars.WESI_ARTIFACTS_URL || 'https://api.wesi-inc.ru/artifacts' }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BASE/app/app-manifest.json" -o manifest.json
          python3 <<'PY'
          import json, os, urllib.request
          m=json.load(open('manifest.json'))
          assert m['version']==os.environ['VERSION']
          assert int(m['build'])==int(os.environ['BUILD'])
          a=m['android']
          url=os.environ['BASE'].rstrip('/')+'/'+a['path']
          req=urllib.request.Request(url, method='HEAD')
          with urllib.request.urlopen(req, timeout=30) as r:
              size=int(r.headers['Content-Length'])
          assert size==int(a['sizeBytes']), (size,a['sizeBytes'])
          print(url, size)
          PY
