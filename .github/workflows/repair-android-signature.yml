name: Build signed WesiOS release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android/app/build.gradle
      - android/app/src/main/**
      - assets/images/app_icon.png
      - pubspec.yaml
      - .github/workflows/repair-android-signature.yml
      - windows/**
      - server/deploy-artifact.sh

permissions:
  contents: write

concurrency:
  group: signed-wesios-release
  cancel-in-progress: true

env:
  RELEASE_TAG: app-latest
  FLUTTER_VERSION: '3.24.0'

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          [[ "$RAW" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || {
            echo "::error::Некорректная версия в pubspec.yaml: $RAW"
            exit 1
          }
          VERSION="${RAW%%+*}"
          BUILD="${RAW##*+}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "release=$VERSION+$BUILD" >> "$GITHUB_OUTPUT"

  android:
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Regenerate launcher icon from current WesiOS mark
        shell: bash
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -s "android/app/src/main/res/mipmap-$density/launcher_icon.png" || {
              echo "::error::launcher_icon.png не создан для $density"
              exit 1
            }
          done
          grep -q '@mipmap/launcher_icon' android/app/src/main/AndroidManifest.xml

      - name: Require real Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/google-services.json || {
            echo "::error::android/app/google-services.json отсутствует или пуст"
            exit 1
          }

      - name: Decode and verify permanent corporate keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name:-}" ] || { echo "::error::$name не задан"; exit 1; }
          done
          B64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]')
          STORE_PASS=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')
          KEY_PASS=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n')
          ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '[:space:]')
          KEYSTORE="$RUNNER_TEMP/wesios-release.jks"
          printf '%s' "$B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null
          {
            echo "KEYSTORE_PATH=$KEYSTORE"
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$ALIAS"
            echo "KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4G -Dorg.gradle.daemon=false
        run: >-
          flutter build apk --release
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build }}"

      - name: Verify package, signature, and corporate certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$APKSIGNER" || { echo "::error::apksigner не найден"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          grep -q 'Verified using v2 scheme.*true' apk-signature.txt || {
            echo "::error::APK не имеет действительной APK Signature Scheme v2"
            exit 1
          }
          EXPECTED=$(keytool -exportcert \
            -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}')
          ACTUAL=$(sed -nE \
            's/^.*certificate SHA-256 digest: ([0-9a-fA-F]+).*$/\1/p' \
            apk-signature.txt | head -1 | tr '[:upper:]' '[:lower:]')
          test -n "$ACTUAL" || { echo "::error::Не удалось извлечь SHA-256 сертификата"; exit 1; }
          test "$EXPECTED" = "$ACTUAL" || { echo "::error::APK подписана не корпоративным сертификатом WesiOS"; exit 1; }
          mkdir -p release-android
          cp "$APK" release-android/wesios-android.apk
          sha256sum release-android/wesios-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wesios-android-${{ needs.metadata.outputs.release }}-signed
          path: release-android/wesios-android.apk
          retention-days: 14
          if-no-files-found: error

  windows:
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Regenerate Windows icon from current WesiOS mark
        shell: pwsh
        run: |
          dart run flutter_launcher_icons
          if (-not (Test-Path "windows/runner/resources/app_icon.ico")) { throw "Current Windows icon was not generated" }

      - name: Build Windows release
        run: >-
          flutter build windows --release
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.build }}"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (-not $makensis) {
            $candidate = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (-not (Test-Path $candidate)) { throw "makensis.exe not found after NSIS installation" }
          }

      - name: Build WesiOS Setup executable
        shell: pwsh
        run: |
          $source = (Resolve-Path "build/windows/x64/runner/Release").Path
          if (-not (Test-Path "$source/wesios.exe")) { throw "Windows executable missing" }
          New-Item -ItemType Directory -Force -Path release-windows | Out-Null
          $out = (Join-Path (Resolve-Path "release-windows").Path "wesios-windows-x64-setup.exe")
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $makensis "/DVERSION=${{ needs.metadata.outputs.version }}" "/DBUILD_DIR=$source" "/DOUTPUT_FILE=$out" "windows/installer/wesios.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $out)) { throw "Windows installer missing" }
          if ((Get-Item $out).Length -le 0) { throw "Windows installer is empty" }
          Get-FileHash $out -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: wesios-windows-${{ needs.metadata.outputs.release }}
          path: release-windows/wesios-windows-x64-setup.exe
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [metadata, android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      BUILD: ${{ needs.metadata.outputs.build }}
      RELEASE: ${{ needs.metadata.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wesios-*-${{ needs.metadata.outputs.release }}*
          path: downloaded
          merge-multiple: true

      - name: Validate release payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          cp downloaded/wesios-android.apk upload/
          cp downloaded/wesios-windows-x64-setup.exe upload/
          cp server/deploy-artifact.sh upload/
          test -s upload/wesios-android.apk
          test -s upload/wesios-windows-x64-setup.exe
          chmod +x upload/deploy-artifact.sh
          APK_SHA=$(sha256sum upload/wesios-android.apk | cut -d' ' -f1)
          WIN_SHA=$(sha256sum upload/wesios-windows-x64-setup.exe | cut -d' ' -f1)
          APK_SIZE=$(stat -c%s upload/wesios-android.apk)
          WIN_SIZE=$(stat -c%s upload/wesios-windows-x64-setup.exe)
          echo "apk_sha=$APK_SHA" >> "$GITHUB_OUTPUT"
          echo "win_sha=$WIN_SHA" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "win_size=$WIN_SIZE" >> "$GITHUB_OUTPUT"
          echo "Android payload: $APK_SIZE bytes ${APK_SHA:0:16}…"
          echo "Windows installer: $WIN_SIZE bytes ${WIN_SHA:0:16}…"

      - name: Stage verified binaries on GitHub CDN
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          STAGE_TAG="wesi-stage-$GITHUB_RUN_ID"
          echo "STAGE_TAG=$STAGE_TAG" >> "$GITHUB_ENV"
          gh release create "$STAGE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Temporary WesiOS $RELEASE staging" \
            --notes "Temporary CDN staging for verified WesiOS $RELEASE artifacts." \
            --prerelease
          gh release upload "$STAGE_TAG" \
            upload/wesios-android.apk \
            upload/wesios-windows-x64-setup.exe \
            --repo "$GITHUB_REPOSITORY"

      - name: Prepare authenticated SSH connection
        env:
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEY:-}"
          test -n "${HOST:-}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Download verified binaries on server and publish atomically
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          APK_SHA: ${{ steps.payload.outputs.apk_sha }}
          WIN_SHA: ${{ steps.payload.outputs.win_sha }}
          APK_SIZE: ${{ steps.payload.outputs.apk_size }}
          WIN_SIZE: ${{ steps.payload.outputs.win_size }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${USER:-}"
          SSH="ssh -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          SCP="scp -i $HOME/.ssh/id_deploy -o BatchMode=yes"
          REMOTE_TMP="/tmp/wesios-release-$GITHUB_RUN_ID"
          RELEASE_ROOT="/opt/pocketbase/pb_public/artifacts"
          cleanup() { $SSH "$USER@$HOST" "rm -rf '$REMOTE_TMP'" || true; }
          trap cleanup EXIT
          $SSH "$USER@$HOST" "rm -rf '$REMOTE_TMP' && mkdir -p '$REMOTE_TMP'"
          $SCP upload/deploy-artifact.sh "$USER@$HOST:$REMOTE_TMP/deploy-artifact.sh"
          $SSH "$USER@$HOST" 'bash -s' -- \
            "$REMOTE_TMP" "$GITHUB_REPOSITORY" "$STAGE_TAG" \
            "$APK_SHA" "$APK_SIZE" "$WIN_SHA" "$WIN_SIZE" <<'REMOTE'
          set -euo pipefail
          TMP="$1"; REPO="$2"; TAG="$3"
          APK_SHA="$4"; APK_SIZE="$5"; WIN_SHA="$6"; WIN_SIZE="$7"
          fetch_verified() {
            local asset="$1" expected_sha="$2" expected_size="$3" target="$4"
            local attempt actual_sha actual_size
            for attempt in 1 2 3 4 5 6; do
              rm -f "$target"
              url="https://github.com/$REPO/releases/download/$TAG/$asset?attempt=$attempt"
              echo "CDN download $asset attempt $attempt"
              if curl -fL --retry 4 --retry-all-errors --retry-delay 2 \
                  --connect-timeout 15 --max-time 600 "$url" -o "$target"; then
                actual_size=$(stat -c%s "$target" 2>/dev/null || printf 0)
                actual_sha=$(sha256sum "$target" 2>/dev/null | cut -d' ' -f1 || true)
                if [ "$actual_size" = "$expected_size" ] && [ "$actual_sha" = "$expected_sha" ]; then
                  echo "$asset verified: $actual_size bytes ${actual_sha:0:16}…"
                  return 0
                fi
              fi
              sleep 3
            done
            return 1
          }
          fetch_verified wesios-android.apk "$APK_SHA" "$APK_SIZE" "$TMP/wesios-android.apk" &
          APK_PID=$!
          fetch_verified wesios-windows-x64-setup.exe "$WIN_SHA" "$WIN_SIZE" "$TMP/wesios-windows-x64-setup.exe" &
          WIN_PID=$!
          failed=0
          wait "$APK_PID" || failed=1
          wait "$WIN_PID" || failed=1
          test "$failed" -eq 0
          REMOTE
          $SSH "$USER@$HOST" \
            "WESI_ARTIFACTS='$RELEASE_ROOT' bash '$REMOTE_TMP/deploy-artifact.sh' \
             --version '$VERSION' --build '$BUILD' --from '$REMOTE_TMP' \
             --notes 'Исправлена Android-иконка. Windows теперь поставляется полноценным WesiOS Setup.'"
          $SSH "$USER@$HOST" \
            "python3 - '$RELEASE_ROOT/app/app-manifest.json' '$VERSION' '$BUILD' '$APK_SHA' '$WIN_SHA'" <<'PY'
          import json, sys
          path, version, build, apk_sha, win_sha = sys.argv[1], sys.argv[2], int(sys.argv[3]), sys.argv[4], sys.argv[5]
          with open(path, encoding='utf-8') as f:
              manifest = json.load(f)
          assert manifest['version'] == version
          assert int(manifest['build']) == build
          assert manifest['android']['sha256'] == apk_sha
          assert manifest['windows']['sha256'] == win_sha
          assert manifest['windows']['asset'].endswith('.exe')
          for platform in ('android', 'windows'):
              entry = manifest[platform]
              assert int(entry['sizeBytes']) > 0
              assert len(entry['sha256']) == 64
          print('server manifest OK:', version, build)
          PY

      - name: Verify published manifest and files
        env:
          CONFIGURED_BASE: ${{ vars.WESI_ARTIFACTS_URL }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${CONFIGURED_BASE:-https://api.wesi-inc.ru/artifacts}"
          curl --retry 4 --retry-all-errors -fsS --max-time 30 \
            -H 'Accept: application/json' \
            "$BASE/app/app-manifest.json?run=$GITHUB_RUN_ID" -o app-manifest.json
          test -s app-manifest.json
          python3 -m json.tool app-manifest.json >/dev/null
          BASE="$BASE" python3 <<'PY'
          import hashlib, json, os, urllib.request
          base=os.environ['BASE'].rstrip('/')
          version=os.environ['VERSION']
          build=int(os.environ['BUILD'])
          with open('app-manifest.json', encoding='utf-8') as f:
              manifest=json.load(f)
          assert manifest['version']==version
          assert int(manifest['build'])==build
          assert manifest['windows']['asset'].endswith('.exe')
          for platform in ('android', 'windows'):
              entry=manifest[platform]
              url=f"{base}/{entry['path']}?verify={os.environ.get('GITHUB_RUN_ID','release')}"
              digest=hashlib.sha256(); size=0
              with urllib.request.urlopen(url, timeout=90) as response:
                  while True:
                      chunk=response.read(1024*1024)
                      if not chunk: break
                      size += len(chunk); digest.update(chunk)
              assert size==int(entry['sizeBytes'])
              assert digest.hexdigest()==entry['sha256']
              print(platform, size, digest.hexdigest()[:16]+'…')
          PY

      - name: Replace assets in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "WesiOS latest" --notes "Current verified WesiOS release"
          fi
          gh release upload "$RELEASE_TAG" \
            upload/wesios-android.apk \
            upload/wesios-windows-x64-setup.exe \
            app-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Cleanup temporary CDN release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -n "${STAGE_TAG:-}" ]; then
            gh release delete "$STAGE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          fi
