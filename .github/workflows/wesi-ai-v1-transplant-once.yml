name: Transplant and verify Wesi AI tasks v1

on:
  push:
    branches:
      - chatgpt/wesi-ai-tasks-v1-on-01923

permissions:
  contents: write

concurrency:
  group: wesi-ai-v1-on-01923
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/wesi-ai-tasks-v1-on-01923
          fetch-depth: 0

      - name: Fetch Wesi AI foundation
        run: git fetch origin chatgpt/wesi-ai-tasks-v1-20260812

      - name: Copy Wesi AI product files
        run: |
          git checkout origin/chatgpt/wesi-ai-tasks-v1-20260812 -- \
            lib/features/tasks/ai/models/ai_task_suggestion.dart \
            lib/features/tasks/ai/models/ai_task_template.dart \
            lib/features/tasks/ai/services/task_template_catalog.dart \
            lib/features/tasks/ai/services/wesi_ai_task_engine.dart \
            lib/features/tasks/ai/services/wesi_ai_task_service.dart \
            lib/features/tasks/ai/widgets/ai_suggestion_edit_dialog.dart \
            lib/features/tasks/ai/widgets/wesi_ai_suggestions_panel.dart \
            test/wesi_ai_task_engine_test.dart \
            .github/scripts/wesi_ai_tasks_v1_patch.py

      - name: Connect Wesi AI to Tasks
        run: python3 .github/scripts/wesi_ai_tasks_v1_patch.py

      - name: Make task filters phone-safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/tasks/tasks_screen.dart')
          s = p.read_text(encoding='utf-8')
          start = s.index('  Widget _filters(bool ru) {')
          end = s.index('  Widget _chip({', start)
          replacement = '''  Widget _filters(bool ru) {
    final search = SizedBox(
      height: 38,
      child: TextField(
        style: TextStyle(fontSize: 13, color: AppTheme.textPrimary),
        onChanged: (v) => setState(() => _search = v),
        decoration: InputDecoration(
          isDense: true,
          prefixIcon: Icon(Icons.search, size: 17, color: AppTheme.textMuted),
          hintText: ru ? 'Поиск по задачам' : 'Search tasks',
          hintStyle: TextStyle(fontSize: 13, color: AppTheme.textMuted),
          filled: true,
          fillColor: AppTheme.surface.withOpacity(0.5),
          border: OutlineInputBorder(
            borderRadius: BorderRadius.circular(10),
            borderSide: BorderSide.none,
          ),
        ),
      ),
    );

    final overdue = _chip(
      label: ru ? 'Просроченные' : 'Overdue',
      selected: _onlyOverdue,
      color: AppTheme.accentRed,
      onTap: () => setState(() => _onlyOverdue = !_onlyOverdue),
    );

    final priority = PopupMenuButton<TaskPriority?>(
      color: AppTheme.surface,
      tooltip: ru ? 'Приоритет' : 'Priority',
      onSelected: (v) => setState(() => _priorityFilter = v),
      itemBuilder: (context) => [
        PopupMenuItem(
          value: null,
          child: Text(
            ru ? 'Любой приоритет' : 'Any priority',
            style: TextStyle(color: AppTheme.textPrimary),
          ),
        ),
        ...TaskPriority.values.map(
          (p) => PopupMenuItem(
            value: p,
            child: Text(
              TaskLabels.priority(p, ru),
              style: TextStyle(color: TaskLabels.priorityColor(p)),
            ),
          ),
        ),
      ],
      child: _chip(
        label: _priorityFilter == null
            ? (ru ? 'Приоритет' : 'Priority')
            : TaskLabels.priority(_priorityFilter!, ru),
        selected: _priorityFilter != null,
        color: _priorityFilter == null
            ? AppTheme.accent
            : TaskLabels.priorityColor(_priorityFilter!),
        onTap: null,
      ),
    );

    return LayoutBuilder(
      builder: (context, constraints) {
        if (constraints.maxWidth < 560) {
          return Column(
            crossAxisAlignment: CrossAxisAlignment.stretch,
            children: [
              search,
              const SizedBox(height: 8),
              SingleChildScrollView(
                scrollDirection: Axis.horizontal,
                child: Row(
                  children: [
                    overdue,
                    const SizedBox(width: 8),
                    priority,
                  ],
                ),
              ),
            ],
          );
        }
        return Row(
          children: [
            Expanded(child: search),
            const SizedBox(width: 10),
            overdue,
            const SizedBox(width: 8),
            priority,
          ],
        );
      },
    );
  }

'''
          p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
          PY

      - name: Remove patch helper
        run: rm -f .github/scripts/wesi_ai_tasks_v1_patch.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format Wesi AI files
        run: |
          dart format \
            lib/features/tasks/tasks_screen.dart \
            lib/features/tasks/ai \
            test/wesi_ai_task_engine_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Wesi AI tests
        run: flutter test test/wesi_ai_task_engine_test.dart

      - name: Phone task layout regression
        run: flutter test test/tasks_screen_layout_test.dart

      - name: Full test suite
        run: flutter test

      - name: Commit verified Wesi AI foundation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/wesi-ai-v1-transplant-once.yml
          git config user.name 'WesiOS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat(tasks): add Wesi AI smart task suggestions foundation'
          git push origin HEAD:chatgpt/wesi-ai-tasks-v1-on-01923