name: Finish WesiOS Calendar and Time Center

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  finish:
    if: github.head_ref == 'feat/calendar-clock-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Apply Calendar and Time Center patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/patch_calendar_clock.py ]]; then
            python3 tools/patch_calendar_clock.py
            rm tools/patch_calendar_clock.py
          fi
          rm -f tools/trigger_calendar_finisher.txt

      - name: Format feature Dart files only
        run: |
          dart format \
            lib/core/routes/app_router.dart \
            lib/core/sync/sync_codec.dart \
            lib/features/home/home_screen.dart \
            lib/main.dart \
            lib/features/calendar/calendar_screen.dart \
            lib/features/calendar/calendar_v2_screen.dart \
            lib/features/calendar/models/calendar_event.dart \
            lib/features/calendar/services/calendar_event_service.dart \
            lib/features/time_center/models/time_center_models.dart \
            lib/features/time_center/services/time_center_service.dart \
            lib/features/time_center/services/time_notification_scheduler.dart \
            lib/features/time_center/services/time_schedule_automation.dart \
            lib/features/time_center/time_center_screen.dart \
            test/calendar_clock_surface_test.dart \
            test/calendar_event_model_test.dart \
            test/calendar_sync_surface_test.dart \
            test/time_center_models_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(calendar): finish Calendar and Time Center"
          git push origin HEAD:${GITHUB_HEAD_REF}
