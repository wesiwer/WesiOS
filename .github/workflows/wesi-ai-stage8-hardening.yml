name: Validate Wesi AI Stage 8 hardening

on:
  push:
    branches:
      - agent/wesi-ai-stage8-resource-scheduler

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage8-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scheduler:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage8-resource-scheduler
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Apply Stage 8 journal hardening
        run: python tool/wesi_ai_stage8_hardening.py
      - name: Format Stage 8 sources
        run: >-
          dart format
          lib/features/ai/runtime/wesi_resource_scheduler.dart
          lib/features/ai/runtime/wesi_job_queue.dart
          test/wesi_resource_scheduler_test.dart
          test/wesi_job_queue_test.dart
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Stage 6-8 regression tests
        run: >-
          flutter test
          test/wesi_local_runtime_test.dart
          test/wesi_runtime_pack_test.dart
          test/wesi_resource_scheduler_test.dart
          test/wesi_job_queue_test.dart
          test/wesi_job_coordinator_test.dart
      - name: Commit validated hardening and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wesi-ai-stage8-hardening.yml tool/wesi_ai_stage8_hardening.py
          git add lib/features/ai/runtime/wesi_resource_scheduler.dart lib/features/ai/runtime/wesi_job_queue.dart test/wesi_resource_scheduler_test.dart test/wesi_job_queue_test.dart
          git commit -m "fix(ai): harden Stage 8 durable scheduling trust boundary"
          git push origin HEAD:agent/wesi-ai-stage8-resource-scheduler
