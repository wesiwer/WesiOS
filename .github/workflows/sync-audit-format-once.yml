name: Format Sync Audit Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-audit-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Format audited files
        run: |
          dart format \
            lib/core/sync/sync_engine.dart \
            lib/core/sync/sync_feature_extensions.dart \
            lib/core/sync/sync_audit_extensions.dart \
            lib/core/sync/sync_auto.dart \
            lib/core/sync/pocketbase_transport.dart \
            lib/features/settings/sync_screen.dart \
            lib/features/treasury/sandbox_screen.dart \
            lib/features/audio/services/audio_vault_extras_service.dart \
            test/sync_audit_extensions_test.dart
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/sync/sync_engine.dart \
                  lib/core/sync/sync_feature_extensions.dart \
                  lib/core/sync/sync_audit_extensions.dart \
                  lib/core/sync/sync_auto.dart \
                  lib/core/sync/pocketbase_transport.dart \
                  lib/features/settings/sync_screen.dart \
                  lib/features/treasury/sandbox_screen.dart \
                  lib/features/audio/services/audio_vault_extras_service.dart \
                  test/sync_audit_extensions_test.dart
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git commit -m 'style(sync): format audited synchronization files'
            git push origin HEAD:main
          fi
