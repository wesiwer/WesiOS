name: Audio Vault CI Dispatcher

on:
  push:
    paths:
      - '.github/audio-vault-ci-dispatch.trigger'

permissions:
  actions: write
  contents: write

jobs:
  finalize-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Finalize Audio Vault v2 source compatibility
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
            'lib/features/audio/services/audio_analysis_service.dart': [
              ("final start = (center - window ~/ 2).clamp(0, math.max(0, totalFrames - window));",
               "final start = (center - window ~/ 2)\n          .clamp(0, math.max(0, totalFrames - window))\n          .toInt();"),
              ("return score.clamp(0, 100);", "return score.clamp(0, 100).toInt();"),
            ],
            'lib/features/audio/services/spotify_connect_service.dart': [
              ("Timer.periodic(const Duration(seconds: 2)", "Timer.periodic(const Duration(seconds: 5)"),
              ("final ms = max(0, milliseconds);", "final ms = max(0, milliseconds).toInt();"),
              ("final v = percent.clamp(0, 100);", "final v = percent.clamp(0, 100).toInt();"),
            ],
            'lib/features/audio/widgets/audio_music_hub.dart': [
              ("(s.progressMs / s.durationMs).clamp(0.0, 1.0)", "(s.progressMs / s.durationMs).clamp(0.0, 1.0).toDouble()"),
              ("s.volumePercent.toDouble().clamp(0, 100)", "s.volumePercent.toDouble().clamp(0.0, 100.0).toDouble()"),
            ],
            'lib/features/audio/widgets/audio_analysis_panel.dart': [
              ("(e.value / maxValue).clamp(0.0, 1.0)", "(e.value / maxValue).clamp(0.0, 1.0).toDouble()"),
            ],
            'lib/features/audio/audio_vault_v2_screen.dart': [
              ("(state.position.inMilliseconds / total).clamp(0.0, 1.0);",
               "(state.position.inMilliseconds / total).clamp(0.0, 1.0).toDouble();"),
              ("await AudioVaultService.delete(b);", "await AudioVaultExtrasService.removeMeta(b.id);\n      await AudioVaultService.delete(b);"),
            ],
            'lib/features/audio/widgets/audio_mini_player.dart': [
              ("state.volumePercent.toDouble().clamp(0.0, 100.0),",
               "state.volumePercent.toDouble().clamp(0.0, 100.0).toDouble(),"),
            ],
          }

          for name, reps in replacements.items():
            path = Path(name)
            text = path.read_text()
            for old, new in reps:
              if old in text:
                text = text.replace(old, new)
            path.write_text(text)

          extras = Path('lib/features/audio/services/audio_vault_extras_service.dart')
          text = extras.read_text()
          marker = "  static Future<List<MusicLibraryTrack>> musicLibrary() async {"
          method = '''  static Future<void> removeMeta(String beatId) async {
            final box = await _box;
            final all = await _allMeta();
            if (all.remove(beatId) == null) return;
            await box.put(_metaKey, {
              for (final e in all.entries) e.key: e.value.toJson(),
            });
            revision.value++;
          }

'''
          if 'static Future<void> removeMeta(String beatId)' not in text:
            text = text.replace(marker, method + marker)
            extras.write_text(text)

          mini = Path('lib/features/audio/widgets/audio_mini_player.dart')
          text = mini.read_text()
          needle = "class _AudioMiniPlayerState extends State<AudioMiniPlayer> {\n  Offset _offset"
          if 'SpotifyConnectService.initialize();' not in text:
            text = text.replace(
              needle,
              "class _AudioMiniPlayerState extends State<AudioMiniPlayer> {\n  @override\n  void initState() {\n    super.initState();\n    SpotifyConnectService.initialize();\n  }\n\n  Offset _offset",
            )
            mini.write_text(text)
          PY

          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/audio
          if ! git diff --cached --quiet; then
            git commit -m 'fix(audio): finalize Audio Vault v2 compatibility'
            git push
          fi
      - name: Dispatch Audio Vault CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run audio-vault-ci.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Audio Vault CI dispatched on finalized main.'
