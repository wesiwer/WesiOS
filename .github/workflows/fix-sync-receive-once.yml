name: Fix sync receive once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sync-receive-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  harden-receive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply receive-path hardening
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/fix_sync_receive.py
          python /tmp/fix_sync_receive.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate receive regressions
        shell: bash
        run: |
          dart format             lib/features/auth/login_screen.dart             lib/core/sync/sync_auto.dart             lib/core/sync/sync_engine.dart             lib/core/sync/sync_merge.dart             test/sync_multi_device_test.dart             test/sync_receive_regression_test.dart
          flutter pub get
          flutter test             test/sync_receive_regression_test.dart             test/sync_multi_device_test.dart             test/sync_merge_test.dart             test/sync_engine_test.dart             test/sync_auto_test.dart             test/live_sync_revision_test.dart
          flutter analyze             lib/features/auth/login_screen.dart             lib/core/sync/sync_auto.dart             lib/core/sync/sync_engine.dart             lib/core/sync/sync_merge.dart             test/sync_receive_regression_test.dart             test/sync_multi_device_test.dart             --no-fatal-infos
          grep -q '^version: 0.22.24+99$' pubspec.yaml
          grep -q "static const String number = '0.22.24';" lib/core/constants/app_version.dart
          grep -q 'static const int build = 99;' lib/core/constants/app_version.dart

      - name: Commit validated receive fix
        shell: bash
        run: |
          git config user.name "WesiOS Sync Audit"
          git config user.email "actions@users.noreply.github.com"
          git add             lib/features/auth/login_screen.dart             lib/core/sync/sync_auto.dart             lib/core/sync/sync_engine.dart             lib/core/sync/sync_merge.dart             test/sync_multi_device_test.dart             test/sync_receive_regression_test.dart             pubspec.yaml             lib/core/constants/app_version.dart
          git commit -m "fix(sync): harden incoming cross-device updates"
          git push origin HEAD:main

      - name: Dispatch signed app release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run release-app.yml --ref main
