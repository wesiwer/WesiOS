name: Temporary Wesi AI Runtime Fix V4

on:
  push:
    branches:
      - agent/wesi-ai-stage12-final-20260816
    paths:
      - .github/workflows/tmp-ai-runtime-fix-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage12-final-20260816
          fetch-depth: 0

      - name: Apply already verified runtime patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-ai-runtime-fix-v3.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.find(marker)
          if start < 0:
              raise SystemExit('missing V3 patch block')
          start += len(marker)
          end = workflow.find('          PY\n', start)
          if end < 0:
              raise SystemExit('unterminated V3 patch block')
          raw = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          exec(compile('\n'.join(lines), 'v3-runtime-patch', 'exec'), {})
          PY

      - name: Keep workflow change out of Actions commit
        run: git restore .github/workflows/deploy-wesi-ai-streaming.yml

      - name: Server checks
        run: |
          set -euo pipefail
          node --check server/wesi-ai-stream/gateway.mjs
          node --check server/pb_hooks/wesi_ai_finance_tools.js
          node --check server/pb_hooks/wesi_ai_tools.js
          (cd server/wesi-ai-stream && npm test)

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - run: dart format lib/features/ai/ai_assistant_v2_screen.dart lib/features/ai/controllers/wesi_ai_chat_controller.dart lib/features/ai/widgets/wesi_ai_rich_message.dart lib/features/ai/wesi_ai_api.dart lib/features/treasury/models/transaction_model.dart test/wesi_ai_rich_message_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test/wesi_ai_rich_message_test.dart test/wesi_ai_coagent_activity_test.dart

      - name: Commit verified product code only
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-ci'
          git config user.email 'wesi-ai-ci@users.noreply.github.com'
          git add lib server test
          git commit -m 'fix(ai): ground finance results and restore thinking stream UX'
          git push origin HEAD:agent/wesi-ai-stage12-final-20260816
