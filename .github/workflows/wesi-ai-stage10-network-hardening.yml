name: Wesi AI Stage 10 Network Hardening

on:
  push:
    branches:
      - agent/wesi-ai-stage10-remote-worker-finalize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wesi-ai-stage10-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage10-remote-worker-finalize
          fetch-depth: 0

      - name: Apply distributed-state hardening
        run: python3 scripts/stage10_network_hardening.py

      - name: Validate server JavaScript
        run: |
          node --check server/pb_hooks/wesi_ai_remote_worker_lib.js
          node --check server/pb_hooks/wesi_ai_remote_worker.pb.js
          node --test server/wesi-ai-stream/remote_worker_protocol.test.mjs

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format Stage 10 network files
        run: |
          dart format \
            lib/features/ai/runtime/wesi_remote_worker_auth.dart \
            lib/features/ai/runtime/wesi_remote_worker_controller.dart \
            lib/features/ai/runtime/wesi_remote_worker_http_transport.dart \
            lib/features/ai/runtime/wesi_remote_worker_execution_store.dart \
            lib/features/ai/runtime/wesi_remote_worker_control_plane_bridge.dart \
            lib/features/ai/runtime/wesi_remote_worker_receipt_store.dart \
            lib/features/ai/runtime/wesi_remote_worker_agent.dart \
            test/wesi_remote_worker_protocol_test.dart \
            test/wesi_remote_worker_controller_test.dart \
            test/wesi_remote_worker_hardening_test.dart \
            test/wesi_remote_worker_http_transport_test.dart \
            test/wesi_remote_worker_agent_test.dart \
            test/wesi_remote_worker_pause_lifecycle_test.dart

      - name: Analyze
        shell: bash
        run: |
          set +e
          output="$(flutter analyze --no-fatal-infos 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              safe="${line//'%'/'%25'}"
              safe="${safe//$'\r'/'%0D'}"
              safe="${safe//$'\n'/'%0A'}"
              echo "::error::$safe"
            done <<< "$output"
            exit "$status"
          fi

      - name: Full regression suite
        run: flutter test

      - name: Commit validated transport and cleanup one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/wesi-ai-stage10-network-hardening.yml
          rm -f scripts/stage10_network_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): harden Stage 10 remote worker network transport"
          git push origin HEAD:agent/wesi-ai-stage10-remote-worker-finalize
