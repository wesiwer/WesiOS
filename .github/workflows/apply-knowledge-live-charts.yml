name: Apply Knowledge live charts

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'feat/knowledge-live-charts'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Replace linked demo arrays with live service
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show origin/main:tools/patch_knowledge_live_charts.py > /tmp/patch_knowledge_live_charts.py
          python3 /tmp/patch_knowledge_live_charts.py
          dart format \
            lib/features/knowledge/services/knowledge_linked_chart_service.dart \
            lib/features/knowledge/widgets/article_body_view.dart \
            test/knowledge_linked_chart_service_test.dart

      - name: Guard against demo linked data
        run: |
          set -euo pipefail
          grep -q 'KnowledgeLinkedChartService' lib/features/knowledge/widgets/article_body_view.dart
          grep -q "_linked.load(source)" lib/features/knowledge/widgets/article_body_view.dart
          ! grep -q 'Linked data — заглушка' lib/features/knowledge/widgets/article_body_view.dart
          ! grep -q '\[120.0, 135.0, 128.0' lib/features/knowledge/widgets/article_body_view.dart
          ! grep -q '\[5000.0, 4200.0, 6800.0' lib/features/knowledge/widgets/article_body_view.dart
          git diff --check

      - run: flutter pub get
      - run: flutter test test/knowledge_linked_chart_service_test.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: Commit product files
        run: |
          set -euo pipefail
          rm -f .github/knowledge-live-charts.marker
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/knowledge/services/knowledge_linked_chart_service.dart \
            lib/features/knowledge/widgets/article_body_view.dart \
            test/knowledge_linked_chart_service_test.dart
          git add -u .github/knowledge-live-charts.marker || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(knowledge): replace linked demo charts with live data'
          git push origin HEAD:${{ github.head_ref }}
