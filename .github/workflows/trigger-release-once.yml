name: Trigger WesiOS release once

on:
  push:
    branches:
      - ci/release-trigger-0.22.11-86

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch signed app release from feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-app.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "fix/wesi-ai-tool-agent-handoff" \
            -f notes="Wesi AI: hardened tool/agent handoff and answer-ready UX test build" \
            -f deploy_to_server=false
