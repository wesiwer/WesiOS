name: Organization temp cleanup

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/org-temp-cleanup-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/org-hierarchy-v1
          fetch-depth: 0
      - name: Remove all temporary organization CI harness files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/org-account-kind-fix-temp.yml \
            .github/workflows/org-compile-repair-temp.yml \
            .github/workflows/org-semantic-hardening-temp.yml \
            .github/workflows/org-ui-completion-temp.yml \
            .github/workflows/org-sync-integrity-temp.yml \
            .github/workflows/org-temp-cleanup.yml \
            .org_account_kind_trigger \
            .org_compile_repair_trigger \
            .org_semantic_hardening_trigger \
            .org_ui_completion_trigger \
            .org_sync_integrity_trigger
          git diff --check
      - name: Commit clean product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WesiOS CI Fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(org): remove temporary implementation CI"
          git push origin HEAD:agent/org-hierarchy-v1
