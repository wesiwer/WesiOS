name: Fix organization sync compatibility once
# trigger: legacy org_wesi_inc payload + remove stale Telegram settings placeholder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-organization-sync-recovery-once.yml'

permissions:
  contents: write

concurrency:
  group: fix-organization-sync-compat-once
  cancel-in-progress: true

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch legacy organization decoder and settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          codec = Path('lib/core/sync/sync_codec.dart')
          text = codec.read_text(encoding='utf-8')
          class_start = text.index('class OrganizationsSync extends SyncCollection<OrganizationModel>')
          start = text.index('  @override\n  OrganizationModel? decode(', class_start)
          end = text.index('  @override\n  Map<String, OrganizationModel> local()', start)
          replacement = r'''  @override
          OrganizationModel? decode(Map<String, dynamic> fields) {
            bool legacyTrue(Object? raw) {
              if (raw == true || raw == 1) return true;
              if (raw is String) {
                final value = raw.trim().toLowerCase();
                return value == '1' || value == 'true';
              }
              return false;
            }

            final id = _strOrNull(fields['id'])?.trim();
            final name = _strOrNull(fields['name'])?.trim();
            if (id == null || id.isEmpty || name == null || name.isEmpty) {
              return null;
            }

            final existing = box()?.get(id);
            final canonicalRoot = id == OrganizationModel.rootId;
            final declaredRoot = legacyTrue(fields['isRoot']);
            if (!canonicalRoot && declaredRoot) return null;
            final isRoot = canonicalRoot;

            var parentId = _strOrNull(fields['parentId'])?.trim();
            if (canonicalRoot) {
              parentId = null;
            } else if (parentId == null || parentId.isEmpty) {
              return null;
            }

            final createdAt = _date(fields['createdAt']) ??
                _date(fields['created']) ??
                existing?.createdAt;
            if (createdAt == null) return null;
            final updatedAt = _date(fields['updatedAt']) ??
                _date(fields['updated']) ??
                existing?.updatedAt ??
                createdAt;

            final status = switch (_strOrNull(fields['status'])) {
              'active' => OrganizationStatus.active,
              'archived' => OrganizationStatus.archived,
              _ when fields.containsKey('archived') => legacyTrue(fields['archived'])
                  ? OrganizationStatus.archived
                  : OrganizationStatus.active,
              _ => existing?.status ?? OrganizationStatus.active,
            };
            final currency = _str(
              fields['baseCurrency'],
              existing?.baseCurrency ?? 'RUB',
            ).trim().toUpperCase();

            return OrganizationModel(
              id: id,
              name: name,
              parentId: parentId,
              isRoot: isRoot,
              baseCurrency: currency.isEmpty ? 'RUB' : currency,
              status: status,
              createdAt: createdAt,
              updatedAt: updatedAt,
              createdBy: _str(
                fields['createdBy'],
                existing?.createdBy ?? 'sync-legacy',
              ),
              code: fields.containsKey('code')
                  ? _strOrNull(fields['code'])
                  : existing?.code,
              description: fields.containsKey('description')
                  ? _strOrNull(fields['description'])
                  : existing?.description,
              colorValue: fields.containsKey('colorValue')
                  ? (fields['colorValue'] == null
                      ? null
                      : _int(fields['colorValue']))
                  : existing?.colorValue,
              sortOrder: fields.containsKey('sortOrder')
                  ? _int(fields['sortOrder'])
                  : (existing?.sortOrder ?? 0),
            );
          }

          '''
          codec.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          settings = Path('lib/features/settings/settings_screen.dart')
          text = settings.read_text(encoding='utf-8')
          placeholder = """              _plannedTile(\n                icon: Icons.telegram,\n                title: WesiLocale.get('telegram_bot'),\n                subtitle: ru ? 'Нужен сервер' : 'Requires a server',\n              ),\n"""
          if text.count(placeholder) != 1:
              raise SystemExit('Telegram placeholder shape changed; refusing blind patch')
          settings.write_text(text.replace(placeholder, '', 1), encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          if 'version: 0.22.29+104' not in text:
              raise SystemExit('Unexpected pubspec version; refusing wrong release bump')
          pubspec.write_text(text.replace('version: 0.22.29+104', 'version: 0.22.30+105', 1), encoding='utf-8')

          app_version = Path('lib/core/constants/app_version.dart')
          text = app_version.read_text(encoding='utf-8')
          if "static const String number = '0.22.29';" not in text or 'static const int build = 104;' not in text:
              raise SystemExit('AppVersion does not match 0.22.29+104')
          text = text.replace("static const String number = '0.22.29';", "static const String number = '0.22.30';", 1)
          text = text.replace('static const int build = 104;', 'static const int build = 105;', 1)
          app_version.write_text(text, encoding='utf-8')
          PY

          mkdir -p test/core/sync
          cat > test/core/sync/organization_sync_legacy_payload_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:wesios/core/sync/sync_codec.dart';
          import 'package:wesios/features/organizations/models/organization_model.dart';

          void main() {
            test('canonical root repairs legacy metadata by stable id', () {
              final root = OrganizationsSync().decode(<String, dynamic>{
                'id': OrganizationModel.rootId,
                'name': 'Wesi Inc',
                'isRoot': 0,
                'parentId': 'legacy-root',
                'created': '2026-08-01T10:00:00Z',
                'updated': '2026-08-02T10:00:00Z',
                'archived': false,
              });
              expect(root, isNotNull);
              expect(root!.isRoot, isTrue);
              expect(root.parentId, isNull);
              expect(root.createdAt, DateTime.utc(2026, 8, 1, 10));
              expect(root.updatedAt, DateTime.utc(2026, 8, 2, 10));
            });

            test('legacy child accepts timestamp aliases', () {
              final child = OrganizationsSync().decode(<String, dynamic>{
                'id': OrganizationModel.wesiBeatsId,
                'name': 'Wesi Beats',
                'parentId': OrganizationModel.rootId,
                'isRoot': '0',
                'created': '2026-08-01T10:00:00Z',
                'archived': 0,
              });
              expect(child, isNotNull);
              expect(child!.isRoot, isFalse);
              expect(child.parentId, OrganizationModel.rootId);
              expect(child.status, OrganizationStatus.active);
            });

            test('other id cannot claim root through legacy flag', () {
              expect(
                OrganizationsSync().decode(<String, dynamic>{
                  'id': 'org_untrusted_root',
                  'name': 'Wrong root',
                  'isRoot': '1',
                  'createdAt': '2026-08-01T10:00:00Z',
                }),
                isNull,
              );
            });
          }
          DART

      - name: Format and verify
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/core/sync/sync_codec.dart \
            lib/features/settings/settings_screen.dart \
            lib/core/constants/app_version.dart \
            test/core/sync/organization_sync_legacy_payload_test.dart
          flutter pub get
          flutter test test/core/sync/organization_sync_legacy_payload_test.dart
          flutter test test/organization_sync_integrity_test.dart
          flutter analyze lib/core/sync/sync_codec.dart \
            lib/features/settings/settings_screen.dart \
            lib/core/constants/app_version.dart \
            test/core/sync/organization_sync_legacy_payload_test.dart
          ! grep -F "title: WesiLocale.get('telegram_bot')" lib/features/settings/settings_screen.dart
          grep -F 'version: 0.22.30+105' pubspec.yaml

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WesiOS CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-organization-sync-recovery-once.yml
          git add lib/core/sync/sync_codec.dart \
            lib/features/settings/settings_screen.dart \
            lib/core/constants/app_version.dart \
            pubspec.yaml \
            test/core/sync/organization_sync_legacy_payload_test.dart
          git commit -m 'fix: recover legacy organization sync and remove Telegram placeholder'
          git push origin HEAD:main
