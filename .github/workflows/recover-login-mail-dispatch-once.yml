name: Recover WesiOS login mail once
# trigger: production login recovery 2026-08-19

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-login-mail-dispatch-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch production mail recovery
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow activate-wesios-local-mail.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          echo "Previous run: $BEFORE"
          gh workflow run activate-wesios-local-mail.yml --repo "$GITHUB_REPOSITORY" --ref main
          RUN_ID=''
          for attempt in $(seq 1 30); do
            CANDIDATE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow activate-wesios-local-mail.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
            if [ "$CANDIDATE" != "0" ] && [ "$CANDIDATE" != "$BEFORE" ]; then
              RUN_ID="$CANDIDATE"
              break
            fi
            sleep 2
          done
          [ -n "$RUN_ID" ] || { echo '::error::Recovery workflow did not start'; exit 2; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Recovery run: $RUN_ID"

      - name: Wait for recovery and capture safe status
        id: wait
        if: always() && steps.dispatch.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set +e
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          WATCH_RC=$?
          set -e
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,createdAt,updatedAt,jobs > /tmp/recovery-run.json
          CODE=$(curl -sS -o /tmp/mail-ready.json -w '%{http_code}' --max-time 20 https://api.wesi-inc.ru/api/wesi/auth/mail-ready || true)
          echo "$CODE" > /tmp/mail-ready-code.txt
          echo "watch_rc=$WATCH_RC" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized recovery report
        if: always()
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github
          python3 - <<'PY' > .github/login-mail-recovery.json
          import json, os
          def load(path, default):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except Exception:
                  return default
          run = load('/tmp/recovery-run.json', {})
          mail = load('/tmp/mail-ready.json', {})
          try:
              code = open('/tmp/mail-ready-code.txt', encoding='utf-8').read().strip()
          except Exception:
              code = ''
          safe_mail = {k: mail.get(k) for k in (
              'ready','senderConfigured','smtpEnabled','smtpHostConfigured','smtpReady',
              'sendmailSelected','mailClientMode','httpsProviderConfigured','httpsProvider','reason'
          ) if k in mail}
          jobs=[]
          for job in run.get('jobs') or []:
              jobs.append({
                  'name': job.get('name'),
                  'status': job.get('status'),
                  'conclusion': job.get('conclusion'),
                  'databaseId': job.get('databaseId'),
                  'steps': [
                      {'name': s.get('name'), 'status': s.get('status'), 'conclusion': s.get('conclusion'), 'number': s.get('number')}
                      for s in (job.get('steps') or [])
                  ],
              })
          print(json.dumps({
              'controller': 'recover-wesios-login-mail-once',
              'runId': int(os.environ.get('RUN_ID') or 0),
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'jobs': jobs,
              'mailReadyHttp': code,
              'mailReady': safe_mail,
          }, ensure_ascii=False, indent=2))
          PY
          git config user.name 'WesiOS Auth Recovery'
          git config user.email 'actions@users.noreply.github.com'
          git switch -C diag/login-mail-recovery
          git add .github/login-mail-recovery.json
          git commit -m "diag(auth): login mail recovery ${RUN_ID:-unknown}"
          git push --force origin HEAD:diag/login-mail-recovery
