name: Wesi AI DNS Probe

on:
  push:
    branches:
      - chatgpt/wesi-ai-dns-probe
    paths:
      - .github/workflows/wesi-ai-dns-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Relay host
        run: |
          set -x
          python3 - <<'PY'
          import socket
          host = 'ai.wesi-wf.su'
          try:
              rows = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              print('RESOLVED', sorted({row[4][0] for row in rows}))
          except Exception as exc:
              print('RESOLVE_ERROR', repr(exc))
          PY

      - name: HTTP probe
        continue-on-error: true
        run: |
          set -x
          curl -v --max-time 15 http://ai.wesi-wf.su/health

      - name: HTTPS probe
        continue-on-error: true
        run: |
          set -x
          curl -v --max-time 20 https://ai.wesi-wf.su/health
