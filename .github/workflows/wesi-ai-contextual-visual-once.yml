name: Wesi AI contextual and visual UX one-shot

on:
  push:
    branches: [agent/wesi-ai-contextual-visual-final]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wesi-ai-contextual-visual-once-final
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-contextual-visual-final
          fetch-depth: 0

      - name: Validate and apply product patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/wesi_ai_visual_chat_patch.py
          python scripts/wesi_ai_visual_chat_patch.py
          python server/build-wesi-ai-personas.py
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('server/pb_hooks/.wesi-ai-personas.json').read_text())
          nirvana = data['personas']['nirvana']
          zane = data['personas']['zane']
          assert 'ПРОФЕССИОНАЛЬНОЕ ТВОРЧЕСКОЕ ИСКЛЮЧЕНИЕ' in nirvana
          assert 'wesi-chart' in nirvana
          assert 'wesi-chart' in zane
          Path('server/pb_hooks/.wesi-ai-personas.json').unlink()
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart
        run: |
          dart format \
            lib/features/ai/widgets/wesi_ai_visualization.dart \
            lib/features/ai/widgets/wesi_ai_rich_message.dart \
            lib/features/ai/wesi_ai_chat_ui.dart \
            lib/features/ai/controllers/wesi_ai_chat_controller.dart \
            lib/features/ai/ai_assistant_v2_screen.dart \
            test/wesi_ai_contextual_followup_clarification_test.dart \
            test/wesi_ai_lazy_conversation_test.dart \
            test/wesi_ai_visualization_persona_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Focused contextual and visual UX tests
        run: |
          flutter test \
            test/wesi_ai_contextual_followup_clarification_test.dart \
            test/wesi_ai_lazy_conversation_test.dart \
            test/wesi_ai_visualization_persona_test.dart

      - name: Full Flutter regression suite
        run: flutter test

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            docs/WESI_AI_CHAT_UX.md \
            docs/wesi_ai/personas/ZANE_PERSONA.md \
            docs/wesi_ai/personas/NIRVANA_PERSONA.md \
            lib/features/ai/widgets/wesi_ai_visualization.dart \
            lib/features/ai/widgets/wesi_ai_rich_message.dart \
            lib/features/ai/wesi_ai_chat_ui.dart \
            lib/features/ai/controllers/wesi_ai_chat_controller.dart \
            lib/features/ai/ai_assistant_v2_screen.dart \
            lib/features/ai/wesi_ai_managed_controller.dart \
            lib/features/ai/widgets/wesi_ai_message_content.dart \
            test/wesi_ai_contextual_followup_clarification_test.dart \
            test/wesi_ai_lazy_conversation_test.dart \
            test/wesi_ai_visualization_persona_test.dart \
            test/wesi_ai_queue_hardening_test.dart \
            TZ_HANDOFF.md
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'feat(ai): contextual chat, clarifications, visualizations, and lazy history'
          git push origin HEAD:agent/wesi-ai-contextual-visual-final
