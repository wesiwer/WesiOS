name: Deploy Wesi Aero Xray Relay

on:
  push:
    branches:
      - codex/wesi-aero-build-20260821
    paths:
      - WesiAero/server-node/scripts/setup-xray-prototype.sh
      - .github/workflows/wesi-aero-relay-deploy.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: wesi-aero-relay-production
  cancel-in-progress: false

jobs:
  deploy-relay:
    name: Deploy and verify VLESS + VMess
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_HOST: wesi-ai-178-236-247-194.nip.io
      EXPECTED_RELAY_IP: 178.236.247.194
      RELAY_SSH_HOST: ${{ secrets.WESI_RELAY_SSH_HOST }}
      RELAY_SSH_USER: ${{ secrets.WESI_RELAY_SSH_USER }}
    steps:
      - name: Publish relay deployment link
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -nc --arg state pending --arg target_url "$TARGET_URL" \
            --arg description "Wesi Aero Xray relay is deploying" --arg context "wesi-aero/relay" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "$payload"

      - uses: actions/checkout@v4

      - name: Validate deployment credentials
        env:
          RELAY_KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${RELAY_SSH_HOST:-}" ] || { echo '::error::WESI_RELAY_SSH_HOST is missing'; exit 1; }
          [ -n "${RELAY_SSH_USER:-}" ] || { echo '::error::WESI_RELAY_SSH_USER is missing'; exit 1; }
          [ -n "${RELAY_KEY:-}" ] || { echo '::error::WESI_RELAY_SSH_KEY is missing'; exit 1; }
          resolved=$(getent ahostsv4 "$PUBLIC_HOST" | awk 'NR==1 {print $1}')
          [ "$resolved" = "$EXPECTED_RELAY_IP" ] || { echo "::error::PUBLIC_HOST resolves to $resolved, expected $EXPECTED_RELAY_IP"; exit 1; }

      - name: Prepare relay SSH
        env:
          KEY: ${{ secrets.WESI_RELAY_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_RELAY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/wesi_aero_relay_key
          chmod 600 ~/.ssh/wesi_aero_relay_key
          if [ -n "${KNOWN:-}" ]; then
            printf '%s\n' "$KNOWN" > ~/.ssh/wesi_aero_known_hosts
          else
            ssh-keyscan -H "$RELAY_SSH_HOST" > ~/.ssh/wesi_aero_known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/wesi_aero_known_hosts

      - name: Deploy Xray configuration to foreign relay
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/wesi_aero_relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/wesi_aero_known_hosts" -o StrictHostKeyChecking=yes)
          remote_script="/tmp/wesi-aero-xray-$GITHUB_RUN_ID.sh"
          scp "${SSH[@]}" WesiAero/server-node/scripts/setup-xray-prototype.sh "$RELAY_SSH_USER@$RELAY_SSH_HOST:$remote_script"
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" \
            "chmod 700 '$remote_script' && sudo -n env WESI_AERO_PUBLIC_HOST='$PUBLIC_HOST' WESI_AERO_REALITY_PORT=8443 WESI_AERO_VMESS_PORT=8444 bash '$remote_script' && rm -f '$remote_script'"

      - name: Verify Xray service and local listeners
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/wesi_aero_relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/wesi_aero_known_hosts" -o StrictHostKeyChecking=yes)
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo -n systemctl is-active xray
          sudo -n xray run -test -config /usr/local/etc/xray/config.json
          listeners="$(sudo -n ss -lnt)"
          printf '%s\n' "$listeners" | grep -q ':8443' || { echo 'VLESS listener 8443 is missing' >&2; exit 21; }
          printf '%s\n' "$listeners" | grep -q ':8444' || { echo 'VMess listener 8444 is missing' >&2; exit 22; }
          if command -v ufw >/dev/null 2>&1; then
            sudo -n ufw status | grep -E '8443|8444' || true
          fi
          echo 'Local Xray service and both listeners verified.'
          REMOTE

      - name: Verify public relay TCP reachability
        run: |
          python3 - <<'PY'
          import socket
          import sys
          host = 'wesi-ai-178-236-247-194.nip.io'
          for port in (8443, 8444):
              try:
                  with socket.create_connection((host, port), timeout=8):
                      print(f'{host}:{port} reachable')
              except OSError as exc:
                  print(f'::error::{host}:{port} unreachable: {exc}')
                  sys.exit(20 + (port - 8443))
          PY

      - name: Resolve relay outbound NAT address
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/wesi_aero_relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/wesi_aero_known_hosts" -o StrictHostKeyChecking=yes)
          relay_egress_ip="$(ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" \
            "curl -4 --fail --silent --show-error --max-time 15 https://api.ipify.org")"
          python3 - "$relay_egress_ip" <<'PY'
          import ipaddress, sys
          ipaddress.ip_address(sys.argv[1].strip())
          PY
          echo "Relay outbound NAT address resolved."
          echo "RELAY_EGRESS_IP=$relay_egress_ip" >> "$GITHUB_ENV"

      - name: Retrieve ephemeral client verification configs
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/wesi_aero_relay_key" -o BatchMode=yes -o UserKnownHostsFile="$HOME/.ssh/wesi_aero_known_hosts" -o StrictHostKeyChecking=yes)
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" \
            "sudo -n cat /var/lib/wesi-aero/xray/clients/vless-client.json" > "$RUNNER_TEMP/vless-client.json"
          ssh "${SSH[@]}" "$RELAY_SSH_USER@$RELAY_SSH_HOST" \
            "sudo -n cat /var/lib/wesi-aero/xray/clients/vmess-client.json" > "$RUNNER_TEMP/vmess-client.json"
          chmod 600 "$RUNNER_TEMP/vless-client.json" "$RUNNER_TEMP/vmess-client.json"
          test -s "$RUNNER_TEMP/vless-client.json"
          test -s "$RUNNER_TEMP/vmess-client.json"

      - name: Install Xray verifier on runner
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/xray-install.sh"
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/XTLS/Xray-install/raw/main/install-release.sh \
            -o "$installer"
          chmod 700 "$installer"
          sudo bash "$installer" install
          xray version | head -n 1

      - name: End-to-end VLESS and VMess egress verification
        run: |
          set -euo pipefail
          [ -n "${RELAY_EGRESS_IP:-}" ] || { echo '::error::Relay egress IP was not resolved'; exit 1; }
          verify_protocol() {
            name="$1"
            config="$2"
            log="$RUNNER_TEMP/${name}.log"
            xray run -test -config "$config"
            xray run -config "$config" >"$log" 2>&1 &
            pid=$!
            cleanup() {
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            }
            trap cleanup RETURN
            ready=0
            for _ in $(seq 1 30); do
              if (echo >/dev/tcp/127.0.0.1/10808) 2>/dev/null; then ready=1; break; fi
              sleep 0.25
            done
            [ "$ready" = 1 ] || { echo "::error::$name local SOCKS listener did not start"; tail -n 30 "$log"; return 1; }
            proxy_ip=$(curl --fail --silent --show-error --max-time 20 \
              --socks5-hostname 127.0.0.1:10808 https://api.ipify.org)
            [ "$proxy_ip" = "$RELAY_EGRESS_IP" ] || {
              echo "::error::$name egress IP does not match the relay's measured NAT address"
              tail -n 30 "$log" || true
              return 1
            }
            cleanup
            trap - RETURN
            echo "$name handshake and relay egress verified."
          }
          verify_protocol vless "$RUNNER_TEMP/vless-client.json"
          verify_protocol vmess "$RUNNER_TEMP/vmess-client.json"
          rm -f "$RUNNER_TEMP/vless-client.json" "$RUNNER_TEMP/vmess-client.json"

      - name: Publish final relay status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; description='VLESS and VMess relay verified end to end'; else state=failure; description='Wesi Aero relay deployment failed'; fi
          payload=$(jq -nc --arg state "$state" --arg target_url "$TARGET_URL" \
            --arg description "$description" --arg context "wesi-aero/relay" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "$payload"
