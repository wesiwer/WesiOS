name: Verify auth v12 production once
# trigger: post-deploy retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-auth-v12-production-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: employee-portal
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify external auth and mail endpoints
        shell: bash
        run: |
          set -euo pipefail
          AUTH=$(curl -fsS --max-time 20 https://api.wesi-inc.ru/api/wesi/auth/version)
          MAIL=$(curl -fsS --max-time 20 https://api.wesi-inc.ru/api/wesi/auth/mail-ready)
          echo "$AUTH" > /tmp/auth.json
          echo "$MAIL" > /tmp/mail.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/auth.json',encoding='utf-8'))
          m=json.load(open('/tmp/mail.json',encoding='utf-8'))
          assert a.get('version') == '2026-08-09.owner-email-v12', a
          assert a.get('jsonReadable') is True, a
          assert m.get('ready') is True, m
          assert m.get('sendmailSelected') is True, m
          print('EXTERNAL_AUTH_V12_READY')
          PY
      - name: Verify exact hook on server
        env:
          HOST: ${{ secrets.WESI_SERVER_HOST }}
          USER: ${{ secrets.WESI_SERVER_USER }}
          KEY: ${{ secrets.WESI_SERVER_SSH_KEY }}
          KNOWN: ${{ secrets.WESI_SERVER_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HOST:-}" && test -n "${USER:-}" && test -n "${KEY:-}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "${KNOWN:-}" ]; then printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts; else ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          chmod 600 ~/.ssh/known_hosts
          ssh -i "$HOME/.ssh/id_deploy" -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          H=/opt/pocketbase/pb_hooks/wesi_auth_bootstrap.pb.js
          grep -q '2026-08-09.owner-email-v12' "$H"
          grep -q 'WesiOS start-v2 OTP delivery failed' "$H"
          grep -q 'payload.sentAt = sentAt.toISOString()' "$H"
          curl -fsS --max-time 10 http://127.0.0.1:8090/api/wesi/auth/version | grep -q '2026-08-09.owner-email-v12'
          echo SERVER_AUTH_V12_READY
          REMOTE
      - name: Publish verification report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > .github/auth-v12-production.json
          import json,datetime
          a=json.load(open('/tmp/auth.json',encoding='utf-8'))
          m=json.load(open('/tmp/mail.json',encoding='utf-8'))
          print(json.dumps({
            'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'authVersion':a.get('version'),
            'authJsonReadable':a.get('jsonReadable'),
            'mailReady':m.get('ready'),
            'mailMode':m.get('mailClientMode'),
            'sendmailSelected':m.get('sendmailSelected'),
            'serverHookVerified':True
          },ensure_ascii=False,indent=2))
          PY
          git config user.name 'WesiOS Auth Verification'
          git config user.email 'actions@users.noreply.github.com'
          git switch -C diag/auth-v12-production
          git add .github/auth-v12-production.json
          git commit -m 'diag(auth): verify v12 production'
          git push --force origin HEAD:diag/auth-v12-production
