name: Migrate WesiOS to self-hosted mail once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-selfhosted-mail-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove external mail provider path
        shell: python
        run: |
          from pathlib import Path

          auth = Path('server/pb_hooks/wesi_auth_bootstrap.pb.js')
          text = auth.read_text(encoding='utf-8')
          start = text.find('const wesiReadMailConfig = () => {')
          end_marker = 'routerAdd("POST", "/api/wesi/auth/start-v2", (e) => {'
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('HTTPS mail helper block not found exactly once')

          helper = '''const wesiDeliverMail = (app, email, displayName, subject, html, text) => {
            const settings = app.settings();
            const message = new MailerMessage({
              "from": {
                "address": settings.meta.senderAddress,
                "name": settings.meta.senderName || "WesiOS",
              },
              "to": [{"address": email, "name": displayName}],
              "subject": subject,
              "html": html,
              "text": text,
            });
            app.newMailClient().send(message);
            return settings && settings.smtp && settings.smtp.enabled === true ? "smtp" : "sendmail";
          };

          '''
          text = text[:start] + helper + text[end:]
          if 'api.resend.com' in text or 'wesiReadMailConfig' in text or 'provider !== "resend"' in text:
              raise SystemExit('external provider references remain in auth hook')
          auth.write_text(text, encoding='utf-8')

          health = Path('server/pb_hooks/wesi_mail_health.pb.js')
          health.write_text('''/// Non-secret readiness check for WesiOS email OTP delivery.
          /// PocketBase uses configured SMTP or the local Unix sendmail command.
          routerAdd("GET", "/api/wesi/auth/mail-ready", (e) => {
            const settings = e.app.settings();
            const senderConfigured = Boolean(
              settings && settings.meta && String(settings.meta.senderAddress || "").trim(),
            );
            const smtpEnabled = Boolean(
              settings && settings.smtp && settings.smtp.enabled === true,
            );
            const smtpHostConfigured = Boolean(
              settings && settings.smtp && String(settings.smtp.host || "").trim(),
            );
            const smtpReady = senderConfigured && smtpEnabled && smtpHostConfigured;
            // With SMTP disabled PocketBase intentionally falls back to the local
            // Unix sendmail command. CI verifies that binary on production over SSH.
            return e.json(senderConfigured ? 200 : 503, {
              "ready": senderConfigured,
              "senderConfigured": senderConfigured,
              "smtpEnabled": smtpEnabled,
              "smtpHostConfigured": smtpHostConfigured,
              "smtpReady": smtpReady,
              "transport": smtpReady ? "smtp" : "sendmail",
              "reason": senderConfigured ? "ok" : "sender_not_configured",
            });
          });
          ''', encoding='utf-8')

          Path('.github/workflows/configure-wesi-mail.yml').unlink(missing_ok=True)
          Path('.github/workflows/migrate-selfhosted-mail-once.yml').unlink(missing_ok=True)

      - name: Validate and commit
        run: |
          set -euo pipefail
          node --check server/pb_hooks/wesi_auth_bootstrap.pb.js
          node --check server/pb_hooks/wesi_mail_health.pb.js
          ! grep -R -n 'api.resend.com\|WESI_RESEND_API_KEY\|httpsProviderConfigured' \
            server/pb_hooks .github/workflows || true
          grep -q 'newMailClient().send(message)' server/pb_hooks/wesi_auth_bootstrap.pb.js
          grep -q 'sendmail' server/pb_hooks/wesi_mail_health.pb.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(mail): use self-hosted sendmail transport only'
          git push origin HEAD:main
