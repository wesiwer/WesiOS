name: Harden Wesi AI Stage 2 streaming transport

on:
  push:
    branches:
      - agent/wesi-ai-stage2-streaming

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[stage2-stream-hardened]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply heartbeat and CRLF hardening
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('server/wesi-ai-relay/text-stream.mjs')
          s=p.read_text(encoding='utf-8')
          old="""  for await (const chunk of response.body) {\n    pending += decoder.decode(chunk, {stream: true});\n    for (;;) {"""
          new="""  for await (const chunk of response.body) {\n    pending += decoder.decode(chunk, {stream: true});\n    pending = pending.replace(/\\r\\n/g, '\\n');\n    for (;;) {"""
          if old not in s: raise SystemExit('SSE normalization anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('server/wesi-ai-stream/gateway.mjs')
          s=p.read_text(encoding='utf-8')
          old="""      writeNdjson(res, {\n        type: 'meta',\n        requestId: prepared.requestId,\n        persona: prepared.persona,\n        tier: prepared.tier,\n      });\n\n      const toolResults = [];"""
          new="""      writeNdjson(res, {\n        type: 'meta',\n        requestId: prepared.requestId,\n        persona: prepared.persona,\n        tier: prepared.tier,\n      });\n      const heartbeat = setInterval(() => {\n        writeNdjson(res, {type: 'heartbeat'});\n      }, 15000);\n      heartbeat.unref?.();\n      const stopHeartbeat = () => clearInterval(heartbeat);\n      res.once('finish', stopHeartbeat);\n      res.once('close', stopHeartbeat);\n\n      const toolResults = [];"""
          if old not in s: raise SystemExit('gateway heartbeat anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('server/wesi-ai-relay/text-stream.test.mjs')
          s=p.read_text(encoding='utf-8')
          marker="""test('provider rejection happens before any delta and is eligible for fallback', async () => {"""
          test=r'''test('Gemini SSE parser accepts CRLF event framing', async () => {
  global.fetch = async () => new Response(
    'data: {"candidates":[{"content":{"parts":[{"text":"A"}]}}]}\r\n\r\n' +
    'data: {"candidates":[{"content":{"parts":[{"text":"B"}]}}]}\r\n\r\n',
    {status: 200, headers: {'content-type': 'text/event-stream'}},
  );
  const deltas = [];
  const result = await streamTextRoute(
    'google/gemini-test',
    {system: '', history: [], message: 'hello', attachments: []},
    'test-key',
    new AbortController().signal,
    (text) => deltas.push(text),
  );
  assert.equal(result.ok, true);
  assert.equal(result.answer, 'AB');
  assert.deepEqual(deltas, ['A', 'B']);
});

'''
          if marker not in s: raise SystemExit('CRLF test anchor missing')
          p.write_text(s.replace(marker,test+marker,1),encoding='utf-8')
          PY
      - name: Validate and test streaming server
        run: |
          set -euo pipefail
          node --check server/wesi-ai-relay/text-stream.mjs
          node --check server/wesi-ai-stream/gateway.mjs
          node --test server/wesi-ai-relay/*.test.mjs
          node --test server/wesi-ai-stream/*.test.mjs
      - name: Commit hardening
        run: |
          set -euo pipefail
          git config user.name 'wesi-ai-stage2-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add server/wesi-ai-relay/text-stream.mjs server/wesi-ai-relay/text-stream.test.mjs server/wesi-ai-stream/gateway.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(ai): harden streaming heartbeat and SSE framing [stage2-stream-hardened]'
          git push origin HEAD:agent/wesi-ai-stage2-streaming
