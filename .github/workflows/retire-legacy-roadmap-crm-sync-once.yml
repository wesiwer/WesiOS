name: Retire Legacy Roadmap CRM Sync Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retire-legacy-roadmap-crm-sync-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retire duplicate client snapshot sync
        run: python3 .github/scripts/retire-legacy-roadmap-crm-sync.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format touched Dart
        run: dart format lib/core/sync/sync_feature_extensions.dart test/sync_legacy_snapshot_retirement_test.dart
      - name: Run canonical-format regressions
        run: |
          flutter test test/sync_legacy_snapshot_retirement_test.dart test/sync_multi_device_test.dart test/organization_sync_integrity_test.dart
      - name: Analyze touched client code
        run: flutter analyze lib/core/sync/sync_feature_extensions.dart test/sync_legacy_snapshot_retirement_test.dart --no-fatal-infos
      - name: Validate diff
        run: git diff --check
      - name: Commit validated retirement
        run: |
          set -euo pipefail
          git config user.name 'WesiOS Sync Migration Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/sync/sync_feature_extensions.dart test/sync_legacy_snapshot_retirement_test.dart
          git diff --cached --check
          git commit -m 'fix(sync): retire stale Roadmap and CRM snapshot transport'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
