name: Stage14 Artifact Controller Patch

on:
  push:
    branches: [agent/wesi-ai-stage14-media-artifacts]
    paths:
      - '.github/workflows/stage14-artifact-controller-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wesi-ai-stage14-media-artifacts
          fetch-depth: 0
      - name: Apply controller artifact patch
        run: python3 .github/scripts/stage14_artifact_controller_patch.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format and verify
        run: |
          dart format lib/features/ai/controllers/wesi_ai_chat_controller.dart lib/features/ai/media_engines test/features/ai/media_engines
          flutter analyze lib/features/ai/controllers/wesi_ai_chat_controller.dart lib/features/ai/media_engines test/features/ai/media_engines --no-fatal-infos
          flutter test test/features/ai/media_engines
      - name: Commit verified product patch and remove one-shot files
        run: |
          rm -f .github/scripts/stage14_artifact_controller_patch.py .github/workflows/stage14-artifact-controller-patch.yml
          git config user.name 'wesi-ai-stage14-bot'
          git config user.email 'wesi-ai-stage14-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(ai): persist durable media artifact metadata'
          git push origin HEAD:agent/wesi-ai-stage14-media-artifacts
