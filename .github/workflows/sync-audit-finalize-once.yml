name: Finalize Sync Audit Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-audit-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final live-sync patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          # Open Profile screen must repaint when a profile arrives remotely,
          # but controller changes caused by that repaint must not auto-save
          # the same data as a new local edit.
          path = Path('lib/features/profile/profile_screen.dart')
          text = path.read_text()
          text = text.replace(
              "  String? _savedHint;\n  Timer? _debounce;\n",
              "  String? _savedHint;\n  Timer? _debounce;\n  bool _applyingSyncedProfile = false;\n",
              1,
          )
          text = text.replace(
              "    _loadAll();\n    for (final c in [\n",
              "    _loadAll();\n    ProfileService.revision.addListener(_onProfileRevision);\n    for (final c in [\n",
              1,
          )
          text = text.replace(
              "  void _scheduleSave() {\n    _debounce?.cancel();\n",
              "  void _scheduleSave() {\n    if (_applyingSyncedProfile) return;\n    _debounce?.cancel();\n",
              1,
          )
          marker = "  Future<void> _autoSave() async {\n"
          method = r'''  void _onProfileRevision() {
    if (!mounted || _applyingSyncedProfile) return;
    final box = Hive.box('wesios_settings');
    _applyingSyncedProfile = true;
    try {
      final idx = box.get('avatar_index');
      _selectedAvatarIndex = idx is int ? idx : 0;
      _nameCtrl.text = '${box.get('profile_name', defaultValue: '')}';
      _emailCtrl.text = '${box.get('profile_email', defaultValue: '')}';
      _gender = '${box.get('profile_gender', defaultValue: 'Не указан')}';
      _country = '${box.get('profile_country', defaultValue: 'Не указана')}';
      final birth = box.get('profile_birth');
      _birthDate = birth is String && birth.isNotEmpty
          ? DateTime.tryParse(birth)
          : null;
    } finally {
      _applyingSyncedProfile = false;
    }
    if (mounted) setState(() {});
  }

'''
          if text.count(marker) != 1:
              raise SystemExit('profile_screen.dart: autosave marker mismatch')
          text = text.replace(marker, method + marker, 1)
          text = text.replace(
              "  void dispose() {\n    _debounce?.cancel();\n",
              "  void dispose() {\n    ProfileService.revision.removeListener(_onProfileRevision);\n    _debounce?.cancel();\n",
              1,
          )
          path.write_text(text)

          # Message arrival already repaints an open chat; chat metadata (title,
          # membership, archive/mute/pin state) is a different collection and
          # must repaint even when no message changed.
          replace_once(
              'lib/features/chats/chat_screen.dart',
              "  Widget build(BuildContext context) {\n    return ValueListenableBuilder<int>(\n      valueListenable: MessageStore.revision,\n      builder: (context, _, __) {\n",
              "  Widget build(BuildContext context) {\n    return ValueListenableBuilder<int>(\n      valueListenable: ChatService.revision,\n      builder: (context, _, __) => ValueListenableBuilder<int>(\n        valueListenable: MessageStore.revision,\n        builder: (context, __, ___) {\n",
          )
          replace_once(
              'lib/features/chats/chat_screen.dart',
              "        );\n      },\n    );\n  }\n\n  Widget _header(ChatThread chat) {",
              "        );\n        },\n      ),\n    );\n  }\n\n  Widget _header(ChatThread chat) {",
          )

          # Rolling deploy safety: a new app may briefly hit an old server.
          path = Path('lib/core/sync/pocketbase_transport.dart')
          text = path.read_text()
          old = r'''  Future<SyncResult<String>> revision() async {
    if (!isSignedIn) return const SyncResult.fail(SyncFailure.notSignedIn);
    final res = await _send('GET', '/api/wesi/sync/revision-v2');
    if (res.failure != null) return SyncResult.fail(res.failure!);
    final revision = res.value!['revision'];
    if (revision is! String || revision.isEmpty) {
      return const SyncResult.fail(
        SyncFailure('NOT_WESIOS', 'Сервер не вернул ревизию синхронизации'),
      );
    }
    return SyncResult.ok(revision);
  }
'''
          new = r'''  Future<SyncResult<String>> revision() async {
    if (!isSignedIn) return const SyncResult.fail(SyncFailure.notSignedIn);
    final res = await _send('GET', '/api/wesi/sync/revision-v2');
    if (res.failure != null) {
      // During a rolling deploy an updated client may start a few seconds
      // before the new PocketBase hook. Keep live sync alive on the legacy
      // endpoint until revision-v2 becomes available.
      if (res.failure!.code == 'NOT_WESIOS') {
        final legacy = await _send('GET', '/api/wesi/sync/revision');
        if (legacy.failure != null) return SyncResult.fail(legacy.failure!);
        return SyncResult.ok(revisionFromResponse(legacy.value!));
      }
      return SyncResult.fail(res.failure!);
    }
    final revision = res.value!['revision'];
    if (revision is! String || revision.isEmpty) {
      return const SyncResult.fail(
        SyncFailure('NOT_WESIOS', 'Сервер не вернул ревизию синхронизации'),
      );
    }
    return SyncResult.ok(revision);
  }
'''
          if text.count(old) != 1:
              raise SystemExit('pocketbase_transport.dart: revision block mismatch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Format audited code
        run: |
          dart format \
            lib/core/sync/sync_audit_extensions.dart \
            lib/core/sync/sync_auto.dart \
            lib/core/sync/pocketbase_transport.dart \
            lib/main.dart \
            lib/features/settings/sync_screen.dart \
            lib/features/treasury/sandbox_screen.dart \
            lib/features/treasury/sandbox_forecast_screen.dart \
            lib/features/profile/profile_screen.dart \
            lib/features/chats/chat_screen.dart \
            lib/features/audio/services/audio_vault_extras_service.dart \
            lib/features/ai/backup/wesi_ai_backup_service.dart \
            lib/features/ai/backup/wesi_ai_d2d_service.dart \
            test/sync_audit_extensions_test.dart
          git diff --check

      - name: Check PocketBase hook syntax
        run: node --check server/pb_hooks/wesi_sync_extra.pb.js

      - name: Analyze full app
        run: flutter analyze --no-fatal-infos

      - name: Run sync audit regression test
        run: flutter test test/sync_audit_extensions_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Commit validated fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/sync/sync_audit_extensions.dart \
                  lib/core/sync/sync_auto.dart \
                  lib/core/sync/pocketbase_transport.dart \
                  lib/main.dart \
                  lib/features/settings/sync_screen.dart \
                  lib/features/treasury/sandbox_screen.dart \
                  lib/features/treasury/sandbox_forecast_screen.dart \
                  lib/features/profile/profile_screen.dart \
                  lib/features/chats/chat_screen.dart \
                  lib/features/audio/services/audio_vault_extras_service.dart \
                  lib/features/ai/backup/wesi_ai_backup_service.dart \
                  lib/features/ai/backup/wesi_ai_d2d_service.dart \
                  test/sync_audit_extensions_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No code changes to commit'
            exit 0
          fi
          git commit -m 'fix(sync): finalize live cross-device synchronization'
          git pull --rebase origin main
          git push origin HEAD:main
