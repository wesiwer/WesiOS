name: Run employee activation fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-employee-activation-fix.yml'

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Repair activation, deploy auth fix, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fix_employee_activation_01916.sh
