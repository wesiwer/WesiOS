name: Fix Sync Roundtrip Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sync-roundtrip-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve nullable fxRateAt during sync decode
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/core/sync/sync_codec.dart')
          s=p.read_text()
          old="      fxRateAt: _date(fields['fxRateAt']) ?? date,\n"
          new="      fxRateAt: _date(fields['fxRateAt']),\n"
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name 'WesiOS CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/core/sync/sync_codec.dart
          git commit -m 'fix(sync): preserve nullable FX timestamp round trip'
          git pull --rebase origin main
          git push origin HEAD:main
