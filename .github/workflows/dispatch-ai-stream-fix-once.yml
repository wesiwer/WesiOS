name: Dispatch AI Stream Trust Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-ai-stream-fix-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production streaming deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'retry after stable trust contract validation'
          gh workflow run deploy-wesi-ai-streaming.yml --repo "$GITHUB_REPOSITORY" --ref main -f public_host=wesi-ai-178-236-247-194.nip.io
