name: Temporary targeted org verifier

on:
  push:
    branches: [chatgpt/org-main-v2]
    paths: ['org-targeted-verify-trigger.txt']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/org-main-v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Previously failing tests
        run: >-
          flutter test
          test/crm_service_test.dart
          test/task_assignment_test.dart
          test/tasks_screen_layout_test.dart
          test/accounts_test.dart
          test/sync_engine_test.dart
          test/backup_service_test.dart
          test/team_stats_organization_scope_ui_test.dart
