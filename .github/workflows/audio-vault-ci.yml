name: Audio Vault CI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/audio-vault-ci.trigger'
  pull_request:
    paths:
      - '.github/audio-vault-pr-check'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter pub get
      - name: Analyze Audio Vault
        run: flutter analyze --no-fatal-infos lib/features/audio lib/app.dart lib/core/routes/app_router.dart
      - name: Build Android debug
        run: flutter build apk --debug

  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - run: flutter config --enable-windows-desktop
      - name: Recreate Windows platform
        shell: pwsh
        run: |
          if (Test-Path windows) { Remove-Item -Recurse -Force windows }
          flutter create --platforms=windows --project-name=wesios .
          if (Test-Path assets/images/app_icon.ico) {
            Copy-Item assets/images/app_icon.ico windows/runner/resources/app_icon.ico -Force
          }
      - run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release

  status:
    if: always() && github.event_name != 'pull_request'
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Write status marker
        env:
          ANDROID: ${{ needs.android.result }}
          WINDOWS: ${{ needs.windows.result }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          printf 'run_id=%s\nsha=%s\nandroid=%s\nwindows=%s\n' "$RUN_ID" "$SHA" "$ANDROID" "$WINDOWS" > .github/audio-vault-ci.status
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/audio-vault-ci.status
          git commit -m 'ci(audio): record Audio Vault validation result' || exit 0
          git push
