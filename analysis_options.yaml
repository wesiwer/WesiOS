include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Мёртвый код: cloud_firestore / firebase_auth убраны из pubspec, потому что
    # ломают Windows desktop build. Файл ниоткуда не импортируется и в сборку
    # не попадает, но analyzer ругался на отсутствующие пакеты.
    # Вернуть в анализ, когда Firestore/Auth вернутся в зависимости.
    - lib/core/services/finance_firestore_service.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    avoid_print: false
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
