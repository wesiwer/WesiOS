plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Не даём собрать Android release, если версия, зашитая в UI/updater,
// расходится с pubspec/local.properties. Именно такой рассинхрон привёл к
// тому, что APK обновлялся, а WesiOS продолжал считать себя старой версией
// и снова предлагал то же обновление.
def appVersionFile = rootProject.file('../lib/core/constants/app_version.dart')
def appVersionText = appVersionFile.exists() ? appVersionFile.getText('UTF-8') : ''
def appVersionMatcher = (appVersionText =~ /static const String number = '([^']+)'/)
def appBuildMatcher = (appVersionText =~ /static const int build = (\d+)/)
def dartVersionName = appVersionMatcher.find() ? appVersionMatcher.group(1) : null
def dartVersionCode = appBuildMatcher.find() ? appBuildMatcher.group(1) : null

// Подпись релиза. В CI workflow кладёт keystore во временный файл и
// выставляет KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
// Имена локальных переменных намеренно НЕ совпадают с keyAlias/keyPassword —
// иначе Groovy считает вызов `keyAlias keyAlias` вызовом String.call() и
// сборка падает с «No signature of method: java.lang.String.call()».
//
// trim() — защита от хвостового \n/пробела в GitHub Secrets (часто
// появляется при вставке в UI и даёт «keystore password was incorrect»).
def ksPath = System.getenv("KEYSTORE_PATH")?.trim()
def ksStorePassword = System.getenv("KEYSTORE_PASSWORD")?.trim()
def ksAlias = System.getenv("KEY_ALIAS")?.trim()
def ksKeyPassword = System.getenv("KEY_PASSWORD")?.trim()
def hasReleaseKey = ksPath != null &&
        ksStorePassword != null &&
        ksAlias != null &&
        ksKeyPassword != null &&
        !ksPath.isEmpty() &&
        !ksStorePassword.isEmpty() &&
        !ksAlias.isEmpty() &&
        !ksKeyPassword.isEmpty() &&
        file(ksPath).exists()

// Раньше release без секретов молча подписывался стандартным debug-ключом.
// Такая APK успешно собиралась, но Android запрещал установить её поверх
// WesiOS, подписанного постоянным корпоративным ключом. Теперь любая задача
// assembleRelease/bundleRelease и аналогичная завершается понятной ошибкой.
def releaseBuildRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (releaseBuildRequested && !hasReleaseKey) {
    throw new GradleException(
            "Release signing key is required. " +
            "Set KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. " +
            "Debug-signed release APKs are forbidden because they cannot update installed WesiOS builds."
    )
}
if (releaseBuildRequested) {
    if (dartVersionName == null || dartVersionCode == null) {
        throw new GradleException(
                "Cannot read AppVersion.number/build from lib/core/constants/app_version.dart"
        )
    }
    if (dartVersionName != flutterVersionName || dartVersionCode != flutterVersionCode) {
        throw new GradleException(
                "Release version mismatch: pubspec/local.properties is ${flutterVersionName}+${flutterVersionCode}, " +
                "but AppVersion is ${dartVersionName}+${dartVersionCode}. Update both before releasing."
        )
    }
}

android {
    namespace "com.wesi.wesios"
    compileSdkVersion 35
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.wesi.wesios"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksPath)
                storePassword ksStorePassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Никакого fallback на signingConfigs.debug. Если ключа нет,
            // проверка выше останавливает именно release-задачу.
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
}
