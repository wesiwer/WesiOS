plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Подпись релиза. В CI workflow кладёт keystore во временный файл и
// выставляет KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD.
// Имена локальных переменных намеренно НЕ совпадают с keyAlias/keyPassword —
// иначе Groovy считает вызов `keyAlias keyAlias` вызовом String.call() и
// сборка падает с «No signature of method: java.lang.String.call()».
//
// trim() — защита от хвостового \n/пробела в GitHub Secrets (часто
// появляется при вставке в UI и даёт «keystore password was incorrect»).
def ksPath = System.getenv("KEYSTORE_PATH")?.trim()
def ksStorePassword = System.getenv("KEYSTORE_PASSWORD")?.trim()
def ksAlias = System.getenv("KEY_ALIAS")?.trim()
def ksKeyPassword = System.getenv("KEY_PASSWORD")?.trim()
def hasReleaseKey = ksPath != null &&
        ksStorePassword != null &&
        ksAlias != null &&
        ksKeyPassword != null &&
        !ksPath.isEmpty() &&
        !ksStorePassword.isEmpty() &&
        !ksAlias.isEmpty() &&
        !ksKeyPassword.isEmpty() &&
        file(ksPath).exists()

android {
    namespace "com.wesi.wesios"
    compileSdkVersion 35
    ndkVersion "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.wesi.wesios"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksPath)
                storePassword ksStorePassword
                keyAlias ksAlias
                keyPassword ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKey
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")
}
